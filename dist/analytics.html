<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryLove · 数据看板</title><style>body{margin:0;background:#121512;color:#eff2e8;font:15px system-ui,sans-serif}main{max-width:1100px;margin:50px auto;padding:24px}h1{font-size:32px}p,small{color:#aab29d}button,select{background:#dfff36;border:0;border-radius:8px;padding:12px 18px;color:#17200c;margin:5px;cursor:pointer}table{border-collapse:collapse;width:100%;margin:20px 0 40px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ffffff18}th{color:#aab29d}.metrics{display:flex;gap:20px;flex-wrap:wrap}.metric{background:#20271a;border-radius:12px;padding:20px;min-width:160px}.metric b{display:block;font-size:34px}section{overflow:auto}#notice{line-height:1.8}</style><main><small>STORYLOVE · ADMIN</small><h1>点击与转化</h1><p>按匿名会话查看曝光、点击和转化。测试流量不计入统计。</p><button id="login">Google 登录</button><select id="days"><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="1">今天（UTC 分区）</option></select><button id="refresh">刷新报表</button><p id="notice" role="status">登录管理员账号后查看数据。</p><div id="report"></div><small>CTR＝有点击的页面访问 ÷ 对应元素有曝光的页面访问。成交只计入服务端确认的付款；匿名会话不等于跨设备用户。</small></main><script src="account.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pct=n=>n==null?'—':(n*100).toFixed(1)+'%';
$('#login').onclick=async()=>{try{await window.storyAccount.login()}catch(e){$('#notice').textContent=e.message}};
$('#refresh').onclick=async()=>{try{await window.accountReady;if(!window.storyAccount.user)throw Error('请先登录管理员账号。');const r=await window.storyAccount.api('analytics-report?days='+$('#days').value);$('#notice').textContent=r.truncated?'事件量超出单次报表上限，当前为部分统计。':'统计已更新；付款、登录和签到需对应服务配置后才会产生完成事件。';let html=`<div class="metrics"><div class="metric">匿名会话<b>${esc(r.sessions)}</b></div><div class="metric">事件<b>${esc(r.events)}</b></div><div class="metric">成功回复<b>${esc(r.totals.reply_complete||0)}</b></div></div>`;for(const [name,steps] of Object.entries(r.funnels)){html+=`<section><h2>${esc(name)}</h2><table><tr><th>阶段</th><th>会话数</th><th>整体转化</th></tr>${steps.map(x=>`<tr><td>${esc(x.event)}</td><td>${esc(x.sessions)}</td><td>${pct(x.conversion)}</td></tr>`).join('')}</table></section>`;}html+=`<section><h2>元素点击率</h2><table><tr><th>页面 / 位置</th><th>元素</th><th>曝光访问</th><th>点击访问</th><th>CTR</th></tr>${r.elements.map(x=>`<tr><td>${esc(x.page)} / ${esc(x.placement)}</td><td>${esc(x.element)} ${esc(x.item_id)}</td><td>${esc(x.impressions)}</td><td>${esc(x.clicked_views)}</td><td>${pct(x.ctr)}</td></tr>`).join('')}</table></section><section><h2>角色体验</h2><table><tr><th>角色</th><th>档案访问</th><th>开始对话</th><th>成功回复</th><th>失败</th><th>平均回复耗时</th></tr>${r.characters.map(x=>`<tr><td>${esc(x.character_id)}</td><td>${esc(x.views)}</td><td>${esc(x.starts)}</td><td>${esc(x.replies)}</td><td>${esc(x.failures)}</td><td>${x.average_reply_ms==null?'—':(x.average_reply_ms/1000).toFixed(1)+'s'}</td></tr>`).join('')}</table></section>`;$('#report').innerHTML=html;}catch(e){$('#notice').textContent=e.message;}};
</script></html>
