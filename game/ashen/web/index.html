<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>灰烬王冠</title>
<style>
:root { --ink: #f3efe6; --muted: #b9b2a6; --box: rgba(12, 12, 18, .86); --edge: rgba(232, 194, 122, .22); --accent: #e8c27a; --accent-ink: #2a1d08; --bg: #07070b; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.7 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent }
#stage { position: fixed; inset: 0; margin: auto; aspect-ratio: 16 / 9; max-width: 100vw; max-height: 100vh; width: 100vw; overflow: hidden; background: #111; user-select: none }
@media (max-aspect-ratio: 16/9) { #stage { width: 100vw; height: auto } }
@media (orientation: portrait) and (max-width: 700px) { #stage { aspect-ratio: auto; width: 100vw; height: 100dvh } }
.layer { position: absolute; inset: 0 }
#bg { background-size: cover; background-position: center; transition: opacity .6s }
#bg .ph, #cg .ph { position: absolute; left: 16px; top: 14px; font-size: 13px; color: rgba(255,255,255,.75); letter-spacing: .08em; background: rgba(0,0,0,.25); padding: 2px 10px; border-radius: 99px }
#sprites { pointer-events: none; will-change: transform }
.fx { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .35s; pointer-events: none; display: block }
.sprite { position: absolute; bottom: 0; height: 96%; aspect-ratio: 2 / 3; transform: translateX(-50%); transition: left .35s, filter .25s, opacity .3s; display: flex; align-items: flex-end; justify-content: center }
.sprite img { height: 100%; width: auto; object-fit: contain }
.sprite.dim { filter: brightness(.62) saturate(.8) }
.sprite svg { height: 100%; width: 100% }
@media (orientation: portrait) and (max-width: 700px) { .sprite { height: 62%; bottom: 26% } }
#cg { background-size: cover; background-position: center; opacity: 0; pointer-events: none; transition: opacity .6s }
#cg.on { opacity: 1 }
#box { position: absolute; left: 3%; right: 3%; bottom: 3%; min-height: 26%; background: var(--box); border: 1px solid var(--edge); border-radius: 14px; padding: 2.6% 3.2% 2%; backdrop-filter: blur(6px); cursor: pointer }
#name { position: absolute; top: -18px; left: 4%; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 3px 18px; border-radius: 99px; font-size: 15px; letter-spacing: .06em }
#name:empty { display: none }
#text { font-size: clamp(15px, 2.1vw, 21px); line-height: 1.75; min-height: 3.5em; white-space: pre-wrap }
#text.think { color: #cfe3ff; font-style: italic }
#text.forget { color: #8f8a83; letter-spacing: .04em }
.toast { position: absolute; left: 50%; top: 8%; transform: translateX(-50%); background: rgba(10,10,14,.9); border: 1px solid var(--edge); color: var(--muted); padding: 6px 16px; border-radius: 99px; font-size: 13px; z-index: 7; animation: toast 3.2s forwards }
@keyframes toast { 0% { opacity: 0 } 10%, 80% { opacity: 1 } 100% { opacity: 0 } }
.mem { border-bottom: 1px solid var(--edge); padding: 10px 2px }
.mem b { display: block; color: var(--accent); font-weight: 600 }
.mem.gone b, .mem.gone p { color: #6f6a64; text-decoration: line-through; text-decoration-color: rgba(255,255,255,.18) }
.mem p { margin: 4px 0 0; font-size: 14px; color: var(--muted) }
.arc { border-bottom: 1px solid var(--edge); padding: 10px 2px }
.arc h3 { margin: 0 0 6px; font-size: 15px; color: var(--accent) }
.arc dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; font-size: 13.5px }
.arc dt { color: var(--muted) } .arc dd { margin: 0 } .arc dd.q { color: #5f5a54 }
.clinic { margin: 14px auto 0; max-width: 640px; border: 1px solid var(--edge); border-radius: 10px; padding: 10px 16px; background: rgba(40, 40, 46, .55); text-align: left }
.clinic h4 { margin: 0 0 4px; font-size: 13px; letter-spacing: .12em; color: var(--accent) }
.clinic p { margin: 0; font-size: 14px }
#next { position: absolute; right: 2.4%; top: 34%; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 10px solid var(--accent); animation: bob 1s infinite; opacity: 0 }
#next.on { opacity: 1 }
@keyframes bob { 50% { transform: translateY(4px) } }
#bar { position: absolute; right: 4%; bottom: calc(3% + 4px); display: flex; gap: 4px; z-index: 3 }
#bar button, .menu button, .panel button { font: inherit; font-size: 12.5px; color: var(--muted); background: none; border: 0; padding: 4px 8px; border-radius: 6px; cursor: pointer }
#bar button[aria-pressed="true"] { color: var(--accent) }
#bar button { white-space: nowrap }
@media (max-width: 520px) { #bar { left: 4%; right: 4%; justify-content: space-between; gap: 0 } #bar button { padding: 4px 2px; font-size: 12px } }
#bar button:hover { color: var(--ink) }
.menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(6, 8, 18, .35); z-index: 4 }
.menu .prompt { color: var(--muted); font-size: 14px; letter-spacing: .1em; margin-bottom: 4px }
.menu .opt { min-width: min(560px, 82%); font-size: clamp(14px, 1.8vw, 18px); color: var(--ink); background: var(--box); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 22px; text-align: center; transition: background .15s, border-color .15s }
.menu .opt:hover, .menu .opt:focus-visible { border-color: var(--accent); background: rgba(58, 29, 39, .85); outline: none }
.menu .opt[disabled] { opacity: .45; cursor: default }
.menu .opt.talk-opt { border-style: dashed; color: var(--accent) }
.menu form.talk { display: flex; gap: 8px; width: min(560px, 86%); flex-wrap: wrap; justify-content: center }
.menu form.talk input { flex: 1 1 260px; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--box); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 16px; outline: none }
.menu form.talk button { font-size: 15px; color: var(--ink); border: 1px solid var(--edge); background: var(--box); border-radius: 12px; padding: 10px 18px }
.heart { position: absolute; z-index: 3; font-size: clamp(22px, 3vw, 34px); color: #ff8fb1; pointer-events: none; animation: heart 1.6s ease-out forwards; text-shadow: 0 0 12px rgba(255,143,177,.7) }
@keyframes heart { 0% { opacity: 0; transform: translateY(10px) scale(.6) } 20% { opacity: 1; transform: translateY(0) scale(1.1) } 100% { opacity: 0; transform: translateY(-60px) scale(1) } }
.panel { position: absolute; inset: 4%; background: rgba(10, 13, 26, .94); border: 1px solid var(--edge); border-radius: 14px; z-index: 6; display: flex; flex-direction: column; padding: 18px 22px }
.panel h2 { margin: 0 0 10px; font-size: 18px; letter-spacing: .1em }
.panel .body { overflow: auto; flex: 1; padding-right: 6px }
.panel .close { position: absolute; top: 10px; right: 12px; font-size: 14px }
.log p { margin: 0 0 10px } .log b { color: var(--accent); margin-right: 8px; font-weight: 600 }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px }
.slot { text-align: left !important; border: 1px solid var(--edge) !important; padding: 10px 12px !important; color: var(--ink) !important; line-height: 1.5 }
.slot small { color: var(--muted); display: block }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px }
.gallery div { aspect-ratio: 16/9; border-radius: 8px; background: #222 center/cover; display: flex; align-items: flex-end; padding: 6px 10px; font-size: 12.5px; border: 1px solid var(--edge) }
.gallery div.locked { color: var(--muted); background: repeating-linear-gradient(45deg, #1a1d2a 0 10px, #161925 10px 20px) }
#title { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; justify-content: center; padding-left: 8%; gap: 10px; background-size: cover; background-position: center }
#title::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,10,22,.85), rgba(8,10,22,.2) 70%) }
#title > * { position: relative }
#title h1 { margin: 0; font-size: clamp(26px, 5vw, 54px); letter-spacing: .12em; font-weight: 700 }
#title .sub { color: var(--muted); letter-spacing: .3em; font-size: clamp(11px, 1.4vw, 15px); margin-bottom: 18px }
#title button { align-self: flex-start; font: inherit; font-size: clamp(14px, 1.8vw, 18px); color: var(--ink); background: none; border: 0; border-left: 2px solid transparent; padding: 4px 12px; cursor: pointer; letter-spacing: .12em }
#title button:hover, #title button:focus-visible { border-left-color: var(--accent); color: var(--accent); outline: none }
#title .lang { position: absolute; top: 16px; right: 20px; font-size: 13px }
.end { position: absolute; inset: 0; z-index: 5; background: rgba(6, 8, 18, .88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 8%; text-align: center }
.end h2 { margin: 0; letter-spacing: .12em; text-wrap: balance } .end h3 { margin: 10px 0 0; font-size: 14px; font-weight: 500; letter-spacing: .2em; color: var(--muted) } .end p { margin: 0; color: var(--muted); max-width: 640px; line-height: 1.8 }
.end button { font: inherit; color: var(--ink); background: var(--box); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 20px; cursor: pointer; margin-top: 10px }
[hidden] { display: none !important }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <div id="sprites" class="layer"></div>
  <div id="cg" class="layer"></div>
  <div id="box" role="button" tabindex="0" aria-label="next"><div id="name"></div><div id="text"></div><div id="next"></div></div>
  <div id="bar"></div>
  <div id="menu" class="menu" hidden></div>
  <div id="panel" class="panel" hidden></div>
  <div id="endscreen" class="end" hidden></div>
  <div id="title"></div>
</div>
<script>/* StoryDate campaign engine — shared by every book. Canonical copy: game/engine/campaign_core.js
 * (books keep a byte-identical copy; CI checks it). Engine version CC.VERSION; reads campaigns of spec
 * storydate.campaign/0.3 (legacy: relationship model not enforced) and /0.4 (unified relationships,
 * tiers and a genre pack). See game/engine/README.md.
 * Pure functions, no DOM. Works in the browser (window.CC) and in Node (require).
 *
 * Layers (see 研究文档 §6–§7):
 *   rules      — conditions, effects, clamps. Only the rules change state.
 *   ledger     — append-only record of every change and its cause; endings are explained from it.
 *   director   — picks which side storylets to offer this chapter (salience: base + specificity + due echoes).
 *   echoes     — major choices register an echo; later nodes pay it with a callback line.
 *   debts      — when a choice removes the cause of a locked plot function, a debt opens and must be
 *                resolved later by transform / reroute / cancel.
 */
(function (root) {
  "use strict";
  const CC = {};
  CC.VERSION = "0.4.7";
  CC.SPECS = ["storydate.campaign/0.3", "storydate.campaign/0.4"];
  // 3 for legacy campaigns, 4 for campaigns on the unified relationship model + tiers + genre pack
  CC.specLevel = camp => { const m = /^storydate\.campaign\/0\.(\d+)$/.exec(camp.spec || ""); return m ? +m[1] : 0; };

  /* ---------------- conditions ---------------- */
  function getVar(st, name) { return st.v[name]; }
  function resolveVal(st, val) { return (typeof val === "string" && val[0] === "@") ? st.v[val.slice(1)] : val; }
  function evalCond(st, c) {
    if (!c) return true;
    if (c.all) return c.all.every(x => evalCond(st, x));
    if (c.any) return c.any.some(x => evalCond(st, x));
    const a = getVar(st, c.v), b = resolveVal(st, c.val);
    switch (c.op) {
      case "==": return (a === undefined ? false : a) === b;
      case "!=": return (a === undefined ? false : a) !== b;
      case ">=": return (a || 0) >= b;
      case "<=": return (a || 0) <= b;
      case ">": return (a || 0) > b;
      case "<": return (a || 0) < b;
      default: throw new Error("bad op " + c.op);
    }
  }
  function atoms(c, out = []) {
    if (!c) return out;
    if (c.all) c.all.forEach(x => atoms(x, out));
    else if (c.any) c.any.forEach(x => atoms(x, out));
    else out.push(c);
    return out;
  }
  function condVars(c) {
    const s = new Set();
    atoms(c).forEach(a => { s.add(a.v); if (typeof a.val === "string" && a.val[0] === "@") s.add(a.val.slice(1)); });
    return [...s];
  }
  CC.evalCond = evalCond; CC.atoms = atoms; CC.condVars = condVars;

  /* ---------------- state ---------------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  CC.rng = rng;

  /* A volume can start from where the previous one ended (carry = that volume's final state), or from a preset
   * (carry = { v: {...} } describing a typical earlier playthrough). Variables with the same name carry over,
   * except per-scene ones (heat.*) and narrative debts, which belong to their own volume. People also remember
   * what was said (mem) and promises still open stay open. */
  CC.carryable = (camp, name) => !!camp.vars[name] && camp.vars[name].carry !== false && !name.startsWith("heat.") && !name.startsWith("debt.") && name !== "ended_early";
  /* v2.3: each new volume pulls high relationship values back toward the middle (time passes; people change),
   * so a player who maxed someone out in an earlier volume still has room to grow. Values at or below the pivot
   * are kept as they are: a grudge or a cold shoulder carries over in full. */
  CC.compress = (camp, val) => {
    const cc = camp.carry_compress; if (!cc || val <= cc.pivot) return val;
    return Math.round(cc.pivot + (val - cc.pivot) * cc.k);
  };
  CC.tierOf = (camp, val) => { const t = camp.tiers; if (!t) return null; let k = 0; t.start.forEach((s, i) => { if (val >= s) k = i; }); return k; };
  CC.newGame = function (camp, carry) {
    const v = {};
    for (const [k, d] of Object.entries(camp.vars)) v[k] = d.init;
    for (const id of Object.keys(camp.debts)) v["debt." + id] = "none";
    const st = { v, vol: camp.id, ch: -1, phase: "start", cur: null, offer: [], lastOrder: -1, ledger: [], log: [], echoes: {}, seq: 0, done: [] };
    if (carry && carry.v) {
      const e = ledgerPush(st, { kind: "carry", node: null, choice: null, from: carry.vol || null, preset: carry.preset || null, changes: [], debts: [], echo: [] });
      for (let [k, val] of Object.entries(carry.v)) {
        if (!CC.carryable(camp, k) || val === undefined) continue;
        if (k.startsWith("rel.") && typeof val === "number") { const c = CC.compress(camp, val); if (c !== val) (e.compressed = e.compressed || []).push({ var: k, was: val, now: c }); val = c; }
        if (val === v[k]) continue;
        e.changes.push({ var: k, from: v[k], to: val }); v[k] = val;
      }
      if (carry.mem) st.mem = JSON.parse(JSON.stringify(carry.mem));
      if (carry.commits) st.commits = carry.commits.filter(k => k.status === "open").map(k => Object.assign({}, k, { prev: true }));
      if (carry.said) st.said = carry.said.slice();
      st.log.push({ k: "carry", from: carry.vol || null, preset: carry.preset || null, seq: e.seq });
    }
    enterChapter(camp, st, 0);
    return st;
  };
  // what a finished volume hands to the next one
  CC.carryOut = st => ({ vol: st.vol, v: Object.assign({}, st.v, st.v.ended_early ? { "prev.ended_early": true } : {}), ended_early: !!st.v.ended_early, mem: st.mem || {}, commits: st.commits || [], said: st.said || [] });
  CC.clone = st => JSON.parse(JSON.stringify(st));

  function chapterOf(camp, st) { return camp.chapters[st.ch]; }
  function nodesIn(camp, chId, kind) {
    return Object.values(camp.nodes).filter(n => n.chapter === chId && n.kind === kind).sort((a, b) => a.order - b.order);
  }

  function ledgerPush(st, e) { e.seq = ++st.seq; e.ch = st.ch; st.ledger.push(e); return e; }

  /* 0.4.1 hard tiers: camp.hard_tiers = { "rel.liubei.trust": 3 } means that once the value has reached that tier
   * (e.g. 倚重), ordinary gains no longer raise it; only an effect marked { key: true } (a key moment) can carry
   * it into the next tier. Losses always apply. The entry records what was held back (entry.held). */
  CC.heldBack = (camp, name, from, ef) => {
    const hard = camp.hard_tiers && camp.hard_tiers[name];
    if (hard === undefined || !ef.add || !(ef.by > 0) || ef.key) return false;
    const t = CC.tierOf(camp, from || 0); return t !== null && t >= hard;
  };
  // while someone holds a grudge (0.4.5): words toward them earn nothing, deeds earn half, key moments count in full,
  // and nothing short of a key moment lifts them into a higher tier with you
  // a book that wants its story to turn on a grudge declares a var "grudge.<who>"; the count is mirrored there so
  // conditions can read it (a third threat to Cao Cao is not the first)
  function setGrudge(camp, st, cid, n) {
    st.grudge = st.grudge || {}; st.grudge[cid] = Math.max(0, n);
    const v = "grudge." + cid, d = camp.vars[v]; if (d) st.v[v] = Math.max(d.min, Math.min(d.max, st.grudge[cid]));
  }
  function grudgeGate(camp, st, effs, words, e) {
    const g = st.grudge || {}, held = [], T = camp.tiers;
    const out = (effs || []).map(ef => {
      const m = /^rel\.(\w+)\.(\w+)$/.exec(ef.add || ""); if (!m || !(ef.by > 0) || !((g[m[1]] || 0) > 0)) return ef;
      let by = ef.key ? ef.by : words ? 0 : Math.floor(ef.by / 2);
      if (T && by > 0 && !ef.key) { const from = st.v[ef.add] || 0, k = T.start.reduce((a, s, i) => (from >= s ? i : a), 0); by = Math.min(by, T.end[k] - from); }
      if (by !== ef.by) held.push(m[1]);
      return by > 0 ? Object.assign({}, ef, { by }) : null;
    }).filter(Boolean);
    if (held.length) e.grudge = [...new Set((e.grudge || []).concat(held))];
    return out;
  }
  function applyEffects(camp, st, effects, entry) {
    for (const ef of effects || []) {
      const name = ef.set || ef.add;
      const d = camp.vars[name];
      if (!d) throw new Error("unknown var " + name);
      const from = st.v[name];
      if (CC.heldBack(camp, name, from, ef)) { (entry.held = entry.held || []).push(name); continue; }
      let to = ef.set !== undefined && "to" in ef ? ef.to : (from || 0) + ef.by;
      if (d.type === "num") to = Math.max(d.min, Math.min(d.max, to));
      st.v[name] = to;
      if (from !== to) entry.changes.push({ var: name, from, to });
    }
  }
  function openDebt(st, id, entry) {
    const k = "debt." + id;
    if (st.v[k] === "none") { st.v[k] = "open"; entry.changes.push({ var: k, from: "none", to: "open" }); entry.debts.push([id, "open"]); }
  }
  function resolveDebt(st, id, mode, entry) {
    const k = "debt." + id;
    if (st.v[k] === "open") { st.v[k] = mode; entry.changes.push({ var: k, from: "open", to: mode }); entry.debts.push([id, mode]); return true; }
    return false;
  }

  /* ---------------- art layers & places ---------------- */
  // a layer without "choice" shows when its condition holds; a layer with "choice" appears only after that option is taken
  CC.layers = function (camp, st, defs, choiceId) {
    const out = [];
    for (const l of defs || []) {
      if (l.choice && l.choice !== choiceId) continue;
      if (!evalCond(st, l.when)) continue;
      if (!out.includes(l.id)) out.push(l.id);
    }
    return out;
  };
  CC.stops = function (camp, st) {
    const out = [];
    const push = p => { if (p && out[out.length - 1] !== p) out.push(p); };
    for (const e of st.log) {
      if (e.k === "node") push(camp.nodes[e.n].place);
      if (e.k === "choice") { const c = camp.nodes[e.n].choices.find(x => x.id === e.c); push(c.place); }
    }
    return out;
  };

  /* ---------------- director ---------------- */
  CC.director = function (camp, st, chId) {
    const chap = camp.chapters.find(c => c.id === chId);
    const out = [];
    for (const n of nodesIn(camp, chId, "side")) {
      const eligible = !st.done.includes(n.id) && evalCond(st, n.when);
      const spec = atoms(n.when).length;
      const due = (n.callbacks || []).filter(c => st.echoes[c.pays] && !st.echoes[c.pays].paid.length && evalCond(st, c.when)).length;
      out.push({ id: n.id, eligible, base: n.salience || 0, spec, due, score: (n.salience || 0) + 2 * spec + 3 * due });
    }
    const ranked = out.filter(x => x.eligible).sort((a, b) => b.score - a.score || camp.nodes[a.id].order - camp.nodes[b.id].order);
    const sits = CC.situations(camp, st), kinds = sits.map(x => x.kind);
    if (kinds.includes("absent") || kinds.includes("dead")) return { all: out, offer: [], absent: sits.find(x => x.kind === "absent" || x.kind === "dead").id };
    const n = Math.max(1, (chap.offer || 2) - (kinds.includes("sidelined") || (!camp.situations && st.v["flag.sidelined"]) ? 1 : 0));
    return { all: out, offer: ranked.slice(0, n).map(x => x.id) };
  };

  function enterChapter(camp, st, i) {
    if (i >= camp.chapters.length) { checkCommits(camp, st, true); st.phase = "end"; st.cur = null; st.log.push({ k: "end" }); return; }
    st.ch = i; st.lastOrder = -1;
    const chap = chapterOf(camp, st);
    st.log.push({ k: "ch", c: chap.id, p: idxWhere(st, chap.intro) });
    tickSituations(camp, st);
    checkCommits(camp, st, false);
    // interrupts: crises that pre-empt a chapter when a meter crosses its line (disfavor, exposure)
    const intr = Object.values(camp.nodes).filter(n => n.kind === "interrupt" && !st.done.includes(n.id) && evalCond(st, n.when)).sort((a, b) => a.order - b.order)[0];
    if (intr) return enterNode(camp, st, intr.id);
    chapterBody(camp, st);
  }
  function chapterBody(camp, st) {
    const chap = chapterOf(camp, st);
    // main_first: the chapter opens on its main scene (a cold open); its side storylets are offered afterwards
    if (chap.main_first && st.sidedCh !== chap.id && st.lastOrder === -1) return nextMain(camp, st);
    offerSides(camp, st);
  }
  function offerSides(camp, st) {
    const chap = chapterOf(camp, st);
    st.sidedCh = chap.id;
    const hasSides = nodesIn(camp, chap.id, "side").length > 0;
    const d = CC.director(camp, st, chap.id);

温暖的记忆，由他挑。他不记得自己从前是谁。", "en": "Lamp: the spirit of the relic 'the Lamp'. Looks like a silver-haired youth of about nineteen in a white shirt, eyes like two candle flames. Speaks lightly; whenever Lin goes all out he takes one warm memory, and he chooses which. He doesn't remember who he used to be."}, "values": {"xiu": ["warmth", 1], "ji": ["trust", 1], "xin": ["trust", 1]}}, "gran": {"name": {"zh": "葛兰", "en": "Gran"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [1, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "葛兰·霍克：34 岁，旧港锚链酒吧的老板，术式世家霍克家被赶出门的长子，断剑的持有者。打架的人，话少，心里压着对父亲的事。", "en": "Gran Hawke: 34, owner of the Anchor Chain bar in the old harbor, the disowned eldest son of the Hawke spell-family, holder of the Broken Sword. A fighter, few words, his father heavy on his mind."}, "values": {"yong": ["esteem", 1], "xin": ["trust", 1], "shou": ["warmth", 1]}}, "sword": {"name": {"zh": "断剑", "en": "Broken Sword"}, "dims": {"warmth": [1, 0, 10], "trust": [0, 0, 10], "esteem": [1, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "断剑：遗器“断剑”的器灵，红发、皮夹克、小虎牙，爱喝朗姆，喝不醉。能斩断连结：术式、契约、因果。", "en": "Broken Sword: spirit of the relic, red hair, leather jacket, a sharp canine; loves rum and never gets drunk. She cuts connections: spells, contracts, causes."}, "values": {"yong": ["esteem", 1], "duo": ["esteem", 1]}}, "evelyn": {"name": {"zh": "伊芙琳", "en": "Evelyn"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [1, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "伊芙琳·冯·艾希：24 岁，艾希家的次女，荆棘冠的持有者。从来没有输过，父亲却选了姐姐当继承人。冷，准，把对手当成要评估的东西。", "en": "Evelyn von Eiche: 24, second daughter of the Eiche family, holder of the Thorn Crown. Has never lost; her father chose her sister as heir anyway. Cold, precise, sizes up opponents like goods."}, "values": {"duo": ["esteem", 1], "yong": ["esteem", 1]}}, "august": {"name": {"zh": "奥古斯特", "en": "August"}, "dims": {"warmth": [1, 0, 10], "trust": [1, 0, 10], "esteem": [1, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "奥古斯特·莱恩：60 岁上下，守秘局外勤监督官，干了四十一年，同事叫他“胶水”。守规矩，替普通人把魔法留下的痕迹补好。", "en": "August Lane: about 60, a field supervisor at the Secrecy Bureau for forty-one years; colleagues call him 'Glue'. Keeps the rules and patches over what magic leaves behind so ordinary people never see it."}, "values": {"xin": ["trust", 1], "shou": ["esteem", 1], "ji": ["warmth", 1]}}, "baiqiu": {"name": {"zh": "白秋", "en": "Bai Qiu"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [1, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "白秋：29 岁，在听潮茶楼三楼做情报生意，天平的持有者。银灰长发，木簪，旗袍式外套。天平拿走她做选择时的犹豫，所以她什么都决定得很快。", "en": "Bai Qiu: 29, deals information from the third floor of the Tidelistening Teahouse; holder of the Scales. Silver-grey hair, a wooden pin, a qipao-cut coat. The Scales take her hesitation, so she decides everything fast."}, "values": {"duo": ["esteem", 1], "xin": ["trust", 1], "xiu": ["warmth", 1]}}, "carlo": {"name": {"zh": "卡罗", "en": "Carlo"}, "dims": {"warmth": [1, 0, 10], "trust": [0, 0, 10], "esteem": [1, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "卡罗·文斯：27 岁，荧光绿头发的涂鸦画家，墨水瓶的持有者。想让所有人都能看见魔法。", "en": "Carlo Vince: 27, a neon-haired street painter, holder of the Inkwell. Wants everyone to be able to see magic."}, "values": {"xin": ["trust", 1], "yong": ["esteem", 1]}}, "suman": {"name": {"zh": "苏蔓", "en": "Su Man"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [1, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "苏蔓：31 岁，中心医院急诊科医生，守秘局的合作医生，摇篮的持有者。不想赢，想阻止王冠被打开。", "en": "Su Man: 31, an emergency doctor at Central Hospital who treats the Bureau's cases; holder of the Cradle. Doesn't want to win; wants to stop the Crown from opening."}, "values": {"xin": ["trust", 1], "xiu": ["warmth", 1], "shou": ["esteem", 1]}}, "adam": {"name": {"zh": "亚当", "en": "Adam"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [0, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "亚当·雷恩：双胞胎里的哥哥，戴黑色头戴式耳机，镜子的持有者。替弟弟坐过三年牢。", "en": "Adam Rhine: the elder twin, black headphones, holder of the Mirror. Served three years for his brother."}, "values": {"xin": ["trust", 1], "xiu": ["warmth", 1]}}, "ben": {"name": {"zh": "本", "en": "Ben"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [0, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "本·雷恩：双胞胎里的弟弟，戴黑色口罩，钟的持有者。钟拿走时间的顺序。", "en": "Ben Rhine: the younger twin, black mask, holder of the Clock. The Clock takes the order of time."}, "values": {"xin": ["trust", 1], "xiu": ["warmth", 1]}}, "cradle": {"name": {"zh": "摇篮", "en": "Cradle"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [0, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "摇篮：遗器“摇篮”的器灵，戴面纱的女人，很少说话。能让人和伤口睡着，代价是对未来的期待。", "en": "Cradle: the spirit of the relic, a veiled woman who rarely speaks. She can put people and wounds to sleep; the price is hope for what's ahead."}, "values": {"ji": ["trust", 1]}}, "poet": {"name": {"zh": "诗人", "en": "Poet"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [0, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "诗人：荆棘冠的器灵，黑发，长外套，捧着一本没有字的书。", "en": "Poet: the Thorn Crown's spirit, dark-haired, in a long coat, holding a book with no words."}, "values": {"ji": ["trust", 1]}}, "ink": {"name": {"zh": "墨水瓶", "en": "Inkwell"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [0, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "墨水瓶：书记员模样的器灵，戴眼镜，拿羽毛笔。写下来的东西会暂时成真。", "en": "Inkwell: a clerkish spirit in spectacles with a quill. What it writes comes true for a while."}, "values": {"ji": ["trust", 1]}}, "kite": {"name": {"zh": "风筝", "en": "Kite"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [0, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "风筝：光着脚的长发少女，头发长到脚踝。", "en": "Kite: a barefoot girl whose hair reaches her ankles."}, "values": {"ji": ["trust", 1]}}, "merlo": {"name": {"zh": "撑黑伞的人", "en": "The man with the umbrella"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [0, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "撑黑伞的男人：在钟楼上看棋盘的人，名字还没有人知道。", "en": "The man with the black umbrella: he watches a chessboard atop the clock tower; no one yet knows his name."}, "values": {"ji": ["trust", 1]}}}, "dims": {}, "echoes": {}, "debts": {}, "chapters": [{"id": "p", "title": {"zh": "序章", "en": "Prologue"}, "intro": [{"text": {"zh": "维斯特林，钟楼。", "en": "Westerling, the clock tower."}}], "offer": 0}, {"id": "c1", "title": {"zh": "第一章 · 修灯的人", "en": "Chapter 1 · The Lamp-Mender"}, "intro": [{"text": {"zh": "第七次灰烬王冠之争，第一夜。", "en": "The seventh Ashen Crown war, night one."}}], "offer": 2}, {"id": "c2", "title": {"zh": "第二章 · 摩天轮下", "en": "Chapter 2 · Under the Ferris Wheel"}, "intro": [{"text": {"zh": "第二夜。北岸，旧海滨游乐园。", "en": "Night two. The north shore, the old seaside park."}}], "offer": 2}, {"id": "c3", "title": {"zh": "第三章 · 守秘局", "en": "Chapter 3 · The Secrecy Bureau"}, "intro": [{"text": {"zh": "第三天。凌晨两点，雨停了。", "en": "Day three. Two a.m.; the rain has stopped."}}], "offer": 2}, {"id": "c4", "title": {"zh": "第四章 · 断剑的愿望", "en": "Chapter 4 · The Sword's Wish"}, "intro": [{"text": {"zh": "第四天。周五还有三天。", "en": "Day four. Three days until Friday."}}], "offer": 2}, {"id": "c5", "title": {"zh": "第五章 · 荆棘的诗", "en": "Chapter 5 · The Thorn's Poem"}, "intro": [{"text": {"zh": "周五，夜。旧港区，涂鸦街。", "en": "Friday night. The old harbor, Mural Street."}}], "offer": 2}, {"id": "c6", "title": {"zh": "第六章 · 地铁隧道", "en": "Chapter 6 · The Metro Tunnel"}, "intro": [{"text": {"zh": "同一夜，然后是下一天。", "en": "The same night, and then the next day."}}], "offer": 3}, {"id": "c7", "title": {"zh": "第七章 · 钟楼之下", "en": "Chapter 7 · Beneath the Clock Tower"}, "intro": [{"text": {"zh": "周日，然后是周二的午夜。", "en": "Sunday, and then Tuesday midnight."}}], "offer": 2}], "nodes": {"p_tower": {"id": "p_tower", "chapter": "p", "kind": "main", "title": {"zh": "序章 · 第六十年的灰", "en": "Prologue · Ash of the Sixtieth Year"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "六十年前的十一月。维斯特林的钟楼顶上，有两个人。", "en": "November, sixty years ago. Two people stand at the top of Westerling's clock tower."}}], "choices": [{"id": "go", "type": "expression", "label": {"zh": "（翻开第一章）", "en": "(Turn to Chapter 1)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [], "script": []}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "clocktower"}, {"op": "say", "who": null, "t": {"zh": "六十年前的十一月。维斯特林的钟楼顶上，有两个人。", "en": "November, sixty years ago. Two people stand at the top of Westerling's clock tower."}}, {"op": "say", "who": null, "t": {"zh": "一个扎马尾的女孩，穿着一件很旧的毛衣。一个戴单片眼镜的年轻人，一直在说话：别去了。我们换一个办法。", "en": "A girl with a ponytail in an old sweater. A young man with a monocle who keeps talking: don't. We'll find another way."}}, {"op": "say", "who": null, "t": {"zh": "女孩没有回头。", "en": "The girl doesn't look back."}}, {"op": "say", "who": null, "t": {"zh": "钟楼上空亮起一顶灰色的冠冕。第二天早上，城里没有一个人记得她。", "en": "A grey crown lights the sky above the tower. By morning no one in the city remembers her."}}, {"op": "say", "who": null, "t": {"zh": "——六十年后。", "en": "—Sixty years later."}}, {"op": "say", "who": null, "t": {"zh": "同一座钟楼，一个撑黑伞的男人站在栏杆边，看着一张自己会走的棋盘。", "en": "The same tower. A man with a black umbrella stands at the rail, watching a chessboard that moves by itself."}}, {"op": "say", "who": null, "t": {"zh": "“第一盏灯，”他说，“今晚会亮。”", "en": "'The first lamp,' he says, 'lights tonight.'"}}]}, "c1_shop": {"id": "c1_shop", "chapter": "c1", "kind": "main", "title": {"zh": "林记修复 · 夜 22:40", "en": "Lin's Repairs · 22:40"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "维斯特林下雨的时候，整座城都像一块泡在水里的旧怀表。", "en": "When it rains in Westerling, the whole city is like an old pocket watch soaking in water."}}], "choices": [{"id": "tools", "type": "strategy", "label": {"zh": "把父亲留下的工具包也带上", "en": "Take Dad's old toolkit too"}, "out": [{"text": {"zh": "柜台底下那只帆布包，拉链已经不太好拉了。镊子、锉刀、焊锡、一卷黄铜丝。", "en": "The canvas bag under the counter; its zip sticks. Tweezers, files, solder, a roll of brass wire."}}], "effects": [{"set": "flag.tools", "to": true}, {"add": "light", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "柜台底下那只帆布包，拉链已经不太好拉了。镊子、锉刀、焊锡、一卷黄铜丝。", "en": "The canvas bag under the counter; its zip sticks. Tweezers, files, solder, a roll of brass wire."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "修东西之前，先把工具摆齐。有人这么教过我。", "en": "Before you fix anything, lay out your tools. Someone taught me that."}}], "values": ["xiu"]}, {"id": "go", "type": "expression", "label": {"zh": "什么都不带，现在就去", "en": "Take nothing; go now"}, "out": [{"text": {"zh": "再想下去，我又要等一个十一年。", "en": "If I think any longer, I'll wait another eleven years."}}], "effects": [], "script": [{"op": "say", "who": "me", "think": true, "t": {"zh": "再想下去，我又要等一个十一年。", "en": "If I think any longer, I'll wait another eleven years."}}], "values": ["yong"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "shop_rain"}, {"op": "say", "who": null, "t": {"zh": "维斯特林下雨的时候，整座城都像一块泡在水里的旧怀表。", "en": "When it rains in Westerling, the whole city is like an old pocket watch soaking in water."}}, {"op": "say", "who": "me", "t": {"zh": "好了。换了两个电容，调谐轮的齿也补了。别再拿它砸核桃。", "en": "Done. Two new capacitors, and I patched the tuning wheel. Stop cracking walnuts with it."}}, {"op": "say", "who": null, "t": {"zh": "老头抱着收音机出了门。铺子重新安静下来，只剩满墙待修的东西。", "en": "The old man carries his radio out. The shop goes quiet, just walls of things waiting to be fixed."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "坏掉的东西不会骗人。哪里断了，哪里锈了，你只要认真看，它就全告诉你。不像人。", "en": "Broken things don't lie. Where it snapped, where it rusted—look hard and it tells you everything. Not like people."}}, {"op": "cg", "id": "cg_photo"}, {"op": "say", "who": null, "t": {"zh": "抽屉最里面有一张照片：十五年前的港口，一个缺了门牙的小女孩举着手去够海鸥。她身边，是一片空白。", "en": "At the back of the drawer, a photo: the harbor fifteen years ago, a gap-toothed girl reaching for a gull. Beside her, a blank."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "我记得那里站着她。蓝外套，袖口一块补丁。她叫林遥。可这个世界上，除了我，没有一个人记得。", "en": "I remember she stood there. A blue coat, a patch on the cuff. Her name was Lin Yao. And no one in this world remembers her but me."}}, {"op": "say", "who": null, "t": {"zh": "照片背面是母亲的字：栖栖，如果有一天你发现只有你还记得我，去祖宅的地下室。把那盏灯修好。", "en": "On the back, Mum's handwriting: Qiqi, if one day you find you're the only one who remembers me, go to the basement of the old house. Fix the lamp."}}, {"op": "cg", "id": null}, {"op": "say", "who": "me", "think": true, "t": {"zh": "十一年了，我一次也没有去过。", "en": "Eleven years, and I've never gone."}}]}, "s1_bar": {"id": "s1_bar", "chapter": "c1", "kind": "side", "title": {"zh": "旧港 · 锚链酒吧（葛兰）", "en": "Old harbor · the Anchor Chain (Gran)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "葛兰·霍克这辈子写坏过三百一十七张符纸。是他父亲替他数的。", "en": "Gran Hawke has botched three hundred and seventeen talismans in his life. His father counted them for him."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_gran", "to": true}], "script": [], "values": ["ji"]}], "salience": 2, "order": 0, "script": [{"op": "bg", "id": "bar"}, {"op": "say", "who": null, "t": {"zh": "葛兰·霍克这辈子写坏过三百一十七张符纸。是他父亲替他数的。", "en": "Gran Hawke has botched three hundred and seventeen talismans in his life. His father counted them for him."}}, {"op": "show", "who": "sword", "face": "smile", "at": "right"}, {"op": "say", "who": "sword", "t": {"zh": "葛兰——再来一杯！", "en": "Gran—another!"}, "face": "smile"}, {"op": "show", "who": "gran", "face": "normal", "at": "left"}, {"op": "say", "who": "gran", "t": {"zh": "你今晚已经喝了七杯了。", "en": "That's seven tonight."}}, {"op": "say", "who": "sword", "t": {"zh": "我是剑，喝不醉。喝的时候，我会觉得自己像个活人。", "en": "I'm a sword. I don't get drunk. When I drink, I feel like I'm alive."}}, {"op": "cg", "id": "cg_bar_pov"}, {"op": "say", "who": null, "t": {"zh": "十年前，他在码头的淤泥里捞起一截断剑。她醒了一半，说：等到第六十年，帮我一个忙。", "en": "Ten years ago he pulled a broken sword out of the harbor mud. She half-woke and said: in the sixtieth year, do me a favor."}}, {"op": "cg", "id": null}, {"op": "say", "who": "sword", "t": {"zh": "灯亮了。老城区，坡顶。", "en": "A lamp just lit. Old town, top of the hill."}, "face": "normal"}, {"op": "say", "who": "gran", "t": {"zh": "……那就去拿。", "en": "…Then let's go take it."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "他不是为了自己要遗器。是为了她。", "en": "He doesn't want relics for himself. He wants them for her."}}], "cast": [{"id": "gran"}, {"id": "sword"}]}, "s1_eiche": {"id": "s1_eiche", "chapter": "c1", "kind": "side", "title": {"zh": "填海新区 · 艾希大厦顶层（伊芙琳）", "en": "The reclaimed district · top of the Eiche Tower (Evelyn)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "伊芙琳·冯·艾希从来没有输过。可二十岁那年，父亲宣布的继承人是姐姐。", "en": "Evelyn von Eiche has never lost. Yet when she was twenty, her father named her sister heir."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_evelyn", "to": true}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "eiche_top"}, {"op": "say", "who": null, "t": {"zh": "伊芙琳·冯·艾希从来没有输过。可二十岁那年，父亲宣布的继承人是姐姐。", "en": "Evelyn von Eiche has never lost. Yet when she was twenty, her father named her sister heir."}}, {"op": "show", "who": "evelyn", "face": "normal", "at": "center"}, {"op": "say", "who": "evelyn", "t": {"zh": "第一盏灯亮了。老城区，林家。一个没落了五十年的家族。", "en": "The first lamp is lit. Old town, the Lin house. A family fallen for fifty years."}}, {"op": "say", "who": null, "t": {"zh": "她身后，一个黑发的男人捧着一本没有字的书。他念一个字，她手里那顶荆棘冠就亮一下。", "en": "Behind her, a dark-haired man holds a book with no words. Each word he reads makes the thorn crown in her hand glow."}}, {"op": "say", "who": "evelyn", "t": {"zh": "正好拿来开刀。第一个倒下的人，要让所有人都看清楚。", "en": "Then she's the one to start with. The first to fall should be seen by everyone."}, "face": "serious"}, {"op": "say", "who": null, "t": {"zh": "她戴上荆棘冠。尖刺扎进额角，渗出一滴血。她没有擦。", "en": "She puts on the crown. A thorn pricks her temple; a drop of blood runs down. She doesn't wipe it."}}], "cast": [{"id": "evelyn"}]}, "c1_basement": {"id": "c1_basement", "chapter": "c1", "kind": "main", "title": {"zh": "林家祖宅 · 地下室", "en": "The Lin house · the basement"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "客厅里，墙上一排相框全是空的。玻璃完好，里面只有发黄的衬纸。", "en": "In the parlor every frame on the wall is empty. The glass is intact; only yellowed backing inside."}}], "choices": [{"id": "accept", "type": "dilemma", "label": {"zh": "“我叫林栖。条件我接受。”", "en": "'My name is Lin Qi. I accept.'"}, "out": [{"text": {"zh": "黄铜的把手在我掌心发烫，像一颗心脏。白色的光顺着手臂往上爬。", "en": "The brass handle burns in my palm like a heart. White light climbs my arm."}}], "effects": [{"set": "flag.contract", "to": true}, {"set": "flag.saw_initials", "to": true}, {"add": "rel.lamp.trust", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "黄铜的把手在我掌心发烫，像一颗心脏。白色的光顺着手臂往上爬。", "en": "The brass handle burns in my palm like a heart. White light climbs my arm."}}, {"op": "say", "who": "lamp", "t": {"zh": "契约成立。欢迎来到灰烬王冠之争，林栖。", "en": "The pact is made. Welcome to the Ashen Crown war, Lin Qi."}}, {"op": "say", "who": null, "t": {"zh": "拱顶整块塌了下来。我把灯往上一举——光像一把伞撑开，碎石倒着飞了回去。", "en": "The vault caves in. I lift the lamp—light opens like an umbrella, and the rubble flies back up."}}], "values": ["yong"]}, {"id": "refuse", "type": "dilemma", "label": {"zh": "“我不跟你做这种交易。”", "en": "'I won't make that deal.'"}, "out": [{"text": {"zh": "……那你今晚会死的。", "en": "…Then you die tonight."}}], "effects": [{"set": "flag.dead_refuse", "to": true}], "script": [{"op": "say", "who": "lamp", "t": {"zh": "……那你今晚会死的。", "en": "…Then you die tonight."}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "拱顶塌下来的时候，我抱着那盏没有亮的灯，想起照片背面那行字。", "en": "When the vault comes down, I'm holding the unlit lamp, thinking of the words on the back of the photo."}}], "values": ["shou"], "ends": true}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "oldhouse"}, {"op": "say", "who": null, "t": {"zh": "客厅里，墙上一排相框全是空的。玻璃完好，里面只有发黄的衬纸。", "en": "In the parlor every frame on the wall is empty. The glass is intact; only yellowed backing inside."}}, {"op": "say", "who": null, "t": {"zh": "地下室的门上，有一道粉笔画的符号：一个圆，里面一簇小小的火苗。我碰了一下，它亮了，门自己开了。", "en": "On the basement door, a chalk sign: a circle with a small flame inside. I touch it; it glows; the door opens."}}, {"op": "bg", "id": "basement"}, {"op": "say", "who": null, "t": {"zh": "石砌的拱顶，四壁的书架，长桌上的天平和坩埚。长桌尽头，放着一盏摔坏的提灯。", "en": "A stone vault, shelves on every wall, scales and crucibles on a long table. At its end, a broken lamp."}}, {"op": "say", "who": null, "t": {"zh": "我把父亲的工具一样一样摆出来，像在手术台边摆器械。", "en": "I lay out Dad's tools one by one, like instruments beside an operating table."}, "when": {"v": "flag.tools", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "灯座底下刻着两个很潦草的字母：M. & S.", "en": "Scratched under the base, two scrawled letters: M. & S."}}, {"op": "cg", "id": "cg_mend_lamp"}, {"op": "say", "who": null, "t": {"zh": "磨锈，掰正，点焊，换玻璃。最后是灯芯。我捏着那一小截焦黑的棉线，闭上眼睛——", "en": "Sand the rust, straighten the frame, solder, new glass. Last, the wick. I pinch the scorched stub and close my eyes—"}}, {"op": "say", "who": null, "t": {"zh": "有什么东西在灯的深处醒了，一把抓住我，往里拉。成千上万盏灯，浮在黑暗里。", "en": "Something deep in the lamp wakes and pulls me in. Thousands of lamps, floating in the dark."}}, {"op": "cg", "id": "cg_lamp_lit"}, {"op": "show", "who": "lamp", "face": "smile", "at": "center"}, {"op": "say", "who": "lamp", "t": {"zh": "你修得真好。上一次有人把我修得这么好，还是很久以前的事。", "en": "You mended me beautifully. The last time anyone did, it was a long time ago."}, "face": "smile"}, {"op": "say", "who": "lamp", "t": {"zh": "我是这盏灯。十二件遗器之一，每六十年醒一次。今年是第六十年。", "en": "I'm this lamp. One of twelve relics. I wake every sixty years. This is the sixtieth."}}, {"op": "say", "who": "lamp", "t": {"zh": "谁先把五件握在手里，谁就能打开灰烬王冠，改写世界的一条规则。比如，让某个人从所有人的记忆里——", "en": "Whoever holds five first can open the Ashen Crown and rewrite one rule of the world. Say, make someone vanish from everyone's—"}}, {"op": "cg", "id": null}, {"op": "say", "who": "me", "t": {"zh": "……消失。", "en": "…memory."}}, {"op": "say", "who": "lamp", "t": {"zh": "和我结契，我借你力量。你每一次用尽全力，我就从你那里拿走一段记忆。拿哪一段，由我挑。", "en": "Bind yourself to me and I'll lend you power. Each time you go all out, I take one memory. I choose which."}, "face": "serious"}, {"op": "say", "who": "lamp", "t": {"zh": "我只拿温暖的那些。", "en": "I only take the warm ones."}}, {"op": "say", "who": null, "t": {"zh": "拱顶闷响了一声。石缝里漏下一线冷光。上面有个女人在笑：找到了——小灯笼。", "en": "The vault booms. Cold light leaks through a crack. Above, a woman laughs: found you—little lantern."}}], "cast": [{"id": "lamp"}]}, "c1_fight": {"id": "c1_fight", "chapter": "c1", "kind": "main", "title": {"zh": "地下室 · 断剑", "en": "The basement · the Broken Sword"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "皮靴踩着碎木头下楼。先下来的是一个很高的男人，络腮胡，酒保背心，两只拳头缠着绷带。", "en": "Boots on splintered wood. First down is a very tall man: beard, bartender's vest, both fists taped."}}], "choices": [{"id": "reconnect", "type": "dilemma", "label": {"zh": "看清断口，把线接回去——全力（会交出一段记忆）", "en": "Find the break and join it—all out (costs a memory)"}, "out": [{"text": {"zh": "——接上！", "en": "—Reconnect!"}}], "effects": [{"set": "mem.ride", "to": false}, {"add": "memories", "by": -1}, {"add": "light", "by": 1}, {"set": "flag.met_gran", "to": true}, {"add": "rel.gran.esteem", "by": 1}], "script": [{"op": "cg", "id": "cg_reconnect"}, {"op": "say", "who": "me", "t": {"zh": "——接上！", "en": "—Reconnect!"}}, {"op": "say", "who": null, "t": {"zh": "灯火炸开。有什么东西从我身体里被抽走了，很轻，很快，像风吹走一片叶子。", "en": "Light bursts. Something is drawn out of me, light and quick, like wind taking a leaf."}}, {"op": "say", "who": null, "t": {"zh": "一个夏天的下午。院子里的梧桐树，一辆天蓝色的小自行车。有个人在后面扶着车座跟着我跑……那个人是谁？", "en": "A summer afternoon. The plane tree, a little sky-blue bike. Someone running behind, holding the seat… who was it?"}}, {"op": "say", "who": "lamp", "t": {"zh": "第一段。学骑车的下午。我收下了。", "en": "The first. The afternoon you learned to ride. I'll keep it."}, "forget": true}, {"op": "cg", "id": null}, {"op": "say", "who": null, "t": {"zh": "断剑的刃停在我手腕上方一寸，被一层白光挡住了。", "en": "The blade stops an inch above my wrist, held by a sheet of white light."}}, {"op": "say", "who": "gran", "t": {"zh": "第一次就舍得交这么好的东西。小姑娘，你很想赢啊。明晚十二点，海滨游乐园，摩天轮底下。", "en": "Giving up something that good your first time. You really want to win. Tomorrow at midnight, the seaside park, under the Ferris wheel."}, "face": "serious"}], "values": ["yong"]}, {"id": "talk", "type": "strategy", "label": {"zh": "“你不是为了自己要灯。你是为了她。”", "en": "'You don't want the lamp for yourself. You want it for her.'"}, "out": [{"text": {"zh": "刃停在半空。红发的女人愣了一下，回头看葛兰。", "en": "The blade halts in midair. The red-haired woman freezes and looks back at Gran."}}], "effects": [{"set": "flag.met_gran", "to": true}, {"set": "flag.talked_down", "to": true}, {"add": "rel.gran.trust", "by": 2}, {"add": "rel.lamp.esteem", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "刃停在半空。红发的女人愣了一下，回头看葛兰。", "en": "The blade halts in midair. The red-haired woman freezes and looks back at Gran."}}, {"op": "say", "who": "gran", "t": {"zh": "……你怎么知道？", "en": "…How do you know that?"}, "face": "surprised"}, {"op": "say", "who": "me", "t": {"zh": "你看她的眼神，和我看那张照片的眼神一样。", "en": "You look at her the way I look at a photo."}}, {"op": "say", "who": "sword", "t": {"zh": "哈。被一个修收音机的看穿了。", "en": "Ha. Seen through by a radio repairer."}, "face": "smile"}, {"op": "say", "who": "gran", "t": {"zh": "今晚不打了。明晚十二点，海滨游乐园，摩天轮底下。我们好好打一场。", "en": "No fight tonight. Tomorrow at midnight, the seaside park, under the Ferris wheel. We'll do it properly."}}, {"op": "say", "who": "lamp", "t": {"zh": "……你没用全力。我什么都没拿。", "en": "…You didn't go all out. I took nothing."}, "face": "surprised"}], "values": ["xin"], "when": {"v": "flag.know_gran", "op": "==", "val": true}}, {"id": "shield", "type": "strategy", "label": {"zh": "不接线，把灯横过来硬挡", "en": "Don't reconnect; block with the lamp itself"}, "out": [{"text": {"zh": "断剑砍在灯上。灯没有碎，碎的是灯和我之间剩下的那一点连结。", "en": "The sword strikes the lamp. The lamp doesn't break; what's left of the link between us does."}}], "effects": [{"set": "flag.dead_cut", "to": true}, {"set": "flag.met_gran", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "断剑砍在灯上。灯没有碎，碎的是灯和我之间剩下的那一点连结。", "en": "The sword strikes the lamp. The lamp doesn't break; what's left of the link between us does."}}, {"op": "say", "who": "lamp", "t": {"zh": "林栖——", "en": "Lin Qi—"}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "光灭了。地下室重新黑下来，只剩下皮靴踩在碎木头上的声音。", "en": "The light goes out. The basement is dark again, only boots on splintered wood."}}], "values": ["shou"], "ends": true}], "salience": 0, "order": 3, "script": [{"op": "bg", "id": "basement"}, {"op": "say", "who": null, "t": {"zh": "皮靴踩着碎木头下楼。先下来的是一个很高的男人，络腮胡，酒保背心，两只拳头缠着绷带。", "en": "Boots on splintered wood. First down is a very tall man: beard, bartender's vest, both fists taped."}}, {"op": "show", "who": "gran", "face": "normal", "at": "left"}, {"op": "say", "who": "gran", "t": {"zh": "葛兰·霍克。在码头开酒吧，偶尔接点打架的活。", "en": "Gran Hawke. Run a bar by the docks; take the odd fighting job."}}, {"op": "show", "who": "sword", "face": "smile", "at": "right"}, {"op": "say", "who": "sword", "t": {"zh": "嗨，小灯笼。这就是你新挑的主人？一个修收音机的？", "en": "Hi, little lantern. This is your new holder? A radio repairer?"}, "face": "smile"}, {"op": "say", "who": "gran", "t": {"zh": "把灯交出来，你回去修你的收音机，忘了今晚的事。", "en": "Hand over the lamp. Go back to your radios and forget tonight."}}, {"op": "say", "who": "me", "t": {"zh": "不。", "en": "No."}}, {"op": "say", "who": "gran", "t": {"zh": "……断剑。", "en": "…Sword."}, "face": "serious"}, {"op": "say", "who": null, "t": {"zh": "红发的女人一步跨出来，半截断剑划出一道冷白色的弧线。我手臂上的光纹一暗——有一根看不见的线被剪断了。", "en": "The red-haired woman steps out; half a sword draws a cold white arc. The light-lines on my arm dim—an invisible thread has been cut."}}, {"op": "say", "who": "lamp", "t": {"zh": "她能斩断连结。我们之间的线，她刚刚砍了一刀。", "en": "She cuts connections. She just cut ours."}, "face": "battle"}, {"op": "say", "who": null, "t": {"zh": "断剑已经到了眼前。", "en": "The blade is already in my face."}}], "cast": [{"id": "gran"}, {"id": "sword"}, {"id": "lamp"}]}, "c2_shop": {"id": "c2_shop", "chapter": "c2", "kind": "main", "title": {"zh": "林记修复 · 第二天 21:15", "en": "Lin's Repairs · day two, 21:15"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "你知道我为什么只拿温暖的记忆吗？因为温暖的最重。只有最重的东西，才换得来最强的力量。", "en": "Do you know why I only take warm memories? Because warm ones weigh the most. Only the heaviest buys the strongest power."}}], "choices": [{"id": "scout", "type": "strategy", "label": {"zh": "先去游乐园看场地", "en": "Go to the park early and look at the ground"}, "out": [{"text": {"zh": "锈死的过山车，倒在地上的碰碰车，停摆的旋转木马，还有正中间那座巨大的摩天轮。", "en": "A rusted coaster, overturned bumper cars, a stalled carousel, and in the middle, a huge Ferris wheel."}}], "effects": [{"set": "flag.scouted", "to": true}, {"add": "light", "by": 1}], "script": [{"op": "bg", "id": "park_gate"}, {"op": "cg", "id": "cg_f_approach"}, {"op": "say", "who": null, "t": {"zh": "锈死的过山车，倒在地上的碰碰车，停摆的旋转木马，还有正中间那座巨大的摩天轮。", "en": "A rusted coaster, overturned bumper cars, a stalled carousel, and in the middle, a huge Ferris wheel."}}, {"op": "say", "who": null, "t": {"zh": "我用指尖碰了碰它的底座。四十八个车厢，三百八十四根辐条，几千颗螺栓——全都连在中间那根轴上。", "en": "I touch its base with a fingertip. Forty-eight cars, three hundred and eighty-four spokes, thousands of bolts—all tied to the hub at the center."}}, {"op": "cg", "id": null}, {"op": "say", "who": "me", "think": true, "t": {"zh": "修东西之前，先看结构。有人这么教过我。", "en": "Before you fix anything, read the structure. Someone taught me that."}}, {"op": "say", "who": "lamp", "t": {"zh": "这个习惯不错。", "en": "Good habit."}, "face": "smile"}], "values": ["xiu"]}, {"id": "album", "type": "expression", "label": {"zh": "在铺子里翻父亲的旧相册", "en": "Stay and go through Dad's old albums"}, "out": [{"text": {"zh": "塑料封皮一翻就掉渣。梧桐树，竹椅，搭在椅背上的毛巾。没有自行车，也没有扶车座的人。", "en": "The plastic covers crumble. A plane tree, a bamboo chair, a towel over its back. No bicycle, no one holding a seat."}}], "effects": [{"set": "flag.album", "to": true}, {"add": "rel.lamp.warmth", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "塑料封皮一翻就掉渣。梧桐树，竹椅，搭在椅背上的毛巾。没有自行车，也没有扶车座的人。", "en": "The plastic covers crumble. A plane tree, a bamboo chair, a towel over its back. No bicycle, no one holding a seat."}}, {"op": "say", "who": "lamp", "t": {"zh": "别看了。你只要记住：那个人，在你最需要的时候，帮了你。", "en": "Stop looking. Just remember: that person helped you when you needed it most."}, "face": "sad"}], "values": ["ji"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "shop_day"}, {"op": "say", "who": null, "t": {"zh": "我花了一整天，想想起那个下午。照片上的院子里，竹椅旁边，又是一片空白。", "en": "I spent the whole day trying to remember that afternoon. In the photo of the yard, beside the bamboo chair, another blank."}, "when": {"v": "mem.ride", "op": "!=", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "扶车座的人是谁？我连这个都不知道了。", "en": "Who held the seat? I don't even know that any more."}, "when": {"v": "mem.ride", "op": "!=", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "昨晚我什么都没交出去。可提灯说，下一次不会这么好运。", "en": "Last night I gave nothing up. But the Lamp says I won't be this lucky next time."}, "when": {"v": "mem.ride", "op": "==", "val": true}}, {"op": "show", "who": "lamp", "face": "normal", "at": "center"}, {"op": "say", "who": "lamp", "t": {"zh": "你知道我为什么只拿温暖的记忆吗？因为温暖的最重。只有最重的东西，才换得来最强的力量。", "en": "Do you know why I only take warm memories? Because warm ones weigh the most. Only the heaviest buys the strongest power."}}, {"op": "say", "who": "lamp", "t": {"zh": "离十二点还有三个小时。", "en": "Three hours until midnight."}}], "cast": [{"id": "lamp"}]}, "s2_light": {"id": "s2_light", "chapter": "c2", "kind": "side", "title": {"zh": "北岸旧灯塔顶（伊芙琳）", "en": "Top of the old lighthouse (Evelyn)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "一公里外，伊芙琳放下了望远镜。", "en": "A kilometer away, Evelyn lowers her binoculars."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_cut", "to": true}, {"set": "flag.know_evelyn", "to": true}], "script": [], "values": ["ji"]}], "salience": 2, "order": 0, "script": [{"op": "bg", "id": "lighthouse"}, {"op": "cg", "id": "cg_lighthouse"}, {"op": "say", "who": null, "t": {"zh": "一公里外，伊芙琳放下了望远镜。", "en": "A kilometer away, Evelyn lowers her binoculars."}}, {"op": "say", "who": "evelyn", "t": {"zh": "她在等。她接得比他砍得快，只要不停地接，他就永远砍不到她。", "en": "She's waiting. She mends faster than he cuts; as long as she keeps mending, he never lands a blow."}}, {"op": "say", "who": "evelyn", "t": {"zh": "所以葛兰会换个砍法。他要砍摩天轮。", "en": "So Gran will change what he cuts. He'll cut the Ferris wheel."}}, {"op": "say", "who": "evelyn", "t": {"zh": "几十个车厢，几千颗螺栓，全靠中间那根轴连着。断剑一刀斩开所有的连结——除非她全力出手，否则修不过来。", "en": "Dozens of cars, thousands of bolts, all held by the hub. One stroke severs every link—she can't mend it unless she goes all out."}}, {"op": "cg", "id": null}, {"op": "show", "who": "evelyn", "face": "serious", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "诗人在空白的书上写了一个红色的字。", "en": "The poet writes one red word on the blank page."}}], "cast": [{"id": "evelyn"}]}, "s2_gran": {"id": "s2_gran", "chapter": "c2", "kind": "side", "title": {"zh": "摩天轮下（葛兰）", "en": "Under the wheel (Gran)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "葛兰坐在生锈的长椅上，旁边两瓶啤酒，一瓶开着，一瓶没开。", "en": "Gran sits on a rusted bench, two beers beside him, one open, one not."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.gran_plan", "to": true}, {"add": "rel.gran.esteem", "by": 1}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "ferris"}, {"op": "show", "who": "gran", "face": "normal", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "葛兰坐在生锈的长椅上，旁边两瓶啤酒，一瓶开着，一瓶没开。", "en": "Gran sits on a rusted bench, two beers beside him, one open, one not."}}, {"op": "say", "who": "sword", "t": {"zh": "那小姑娘能把断的东西接回去。我砍一刀，她接一刀。", "en": "That girl joins whatever's cut. I cut, she joins."}}, {"op": "say", "who": "gran", "t": {"zh": "那就砍她接不过来的东西。", "en": "Then cut something she can't join in time."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "他不想要她的命。他想看那盏灯的底牌。", "en": "He doesn't want her life. He wants to see the lamp's last card."}}], "cast": [{"id": "gran"}]}, "c2_duel": {"id": "c2_duel", "chapter": "c2", "kind": "main", "title": {"zh": "北岸 · 摩天轮下 23:40", "en": "North shore · under the wheel, 23:40"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "来早了。还有十八分钟。喝吗？", "en": "You're early. Eighteen minutes. Beer?"}}], "choices": [{"id": "block", "type": "strategy", "label": {"zh": "抢先一步，挡在摩天轮的中心轴前面", "en": "Get there first and stand in front of the hub"}, "out": [{"text": {"zh": "我比他先到。我背靠着那根轴，把灯举在胸前。", "en": "I get there first. Back to the hub, lamp at my chest."}}], "effects": [{"set": "flag.blocked_cut", "to": true}, {"add": "rel.gran.esteem", "by": 2}, {"add": "rel.gran.trust", "by": 1}, {"add": "light", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "我比他先到。我背靠着那根轴，把灯举在胸前。", "en": "I get there first. Back to the hub, lamp at my chest."}}, {"op": "say", "who": "me", "t": {"zh": "你要砍它，就先砍我。可你不想要我的命，对吧？", "en": "If you cut it, you cut me first. And you don't want my life, do you?"}}, {"op": "say", "who": "gran", "t": {"zh": "……你知道我要砍什么。", "en": "…You knew what I'd cut."}, "face": "surprised"}, {"op": "say", "who": "sword", "t": {"zh": "哈。被看穿两次了，葛兰。", "en": "Ha. Seen through twice now, Gran."}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "剑尖停在我胸前三寸。他收了手。", "en": "The point stops three inches from my chest. He pulls back."}}], "values": ["yong"], "when": {"v": "flag.know_cut", "op": "==", "val": true}}, {"id": "hold", "type": "strategy", "label": {"zh": "守住，等他露出破绽", "en": "Hold, and wait for an opening"}, "out": [{"text": {"zh": "我一直接，一直退。他一直砍。然后他转过身，朝摩天轮冲过去。", "en": "I keep joining, keep backing away. He keeps cutting. Then he turns and charges the wheel."}}], "effects": [{"add": "light", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "我一直接，一直退。他一直砍。然后他转过身，朝摩天轮冲过去。", "en": "I keep joining, keep backing away. He keeps cutting. Then he turns and charges the wheel."}}], "values": ["shou"]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "ferris"}, {"op": "cg", "id": "cg_f_bench"}, {"op": "say", "who": "gran", "t": {"zh": "来早了。还有十八分钟。喝吗？", "en": "You're early. Eighteen minutes. Beer?"}}, {"op": "say", "who": "me", "t": {"zh": "打完再说。", "en": "After."}}, {"op": "say", "who": "gran", "t": {"zh": "也是。不管谁赢。", "en": "Fair. Whoever wins."}}, {"op": "say", "who": "gran", "t": {"zh": "昨晚那句话，我想了一整天。今天还是要打。", "en": "I thought about what you said all day. We still fight."}, "face": "serious", "when": {"v": "flag.talked_down", "op": "==", "val": true}}, {"op": "cg", "id": "cg_f_summon"}, {"op": "say", "who": "sword", "t": {"zh": "在呢。", "en": "Here."}, "face": "battle"}, {"op": "say", "who": null, "t": {"zh": "他动了。块头大，却快得像一辆没开灯的货车。断剑横扫，铁栏杆一节一节散开——不是被切断，是“连结”没了。", "en": "He moves. Big, but fast as an unlit truck. The Sword sweeps; the railings come apart—not cut, their connections simply gone."}}, {"op": "cg", "id": "cg_f_rails"}, {"op": "say", "who": null, "t": {"zh": "我蹲下去，手按在地上。断开的栏杆往回长。", "en": "I crouch, palm to the ground. The severed railings grow back."}}, {"op": "say", "who": "sword", "t": {"zh": "她接得比昨天还快。", "en": "She's joining faster than yesterday."}}, {"op": "cg", "id": null}, {"op": "show", "who": "gran", "face": "battle", "at": "left"}, {"op": "show", "who": "sword", "face": "battle", "at": "right"}, {"op": "say", "who": null, "t": {"zh": "葛兰的目光越过我，落在我身后那座摩天轮上。", "en": "Gran's eyes go past me, to the Ferris wheel at my back."}}], "cast": [{"id": "gran"}, {"id": "sword"}, {"id": "lamp"}]}, "c2_wheel": {"id": "c2_wheel", "chapter": "c2", "kind": "main", "title": {"zh": "摩天轮下 · 断剑——斩", "en": "Under the wheel · Sword—cut"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "choices": [{"id": "full", "type": "dilemma", "label": {"zh": "“全部……修好！”——全力（会交出一段记忆）", "en": "'Mend—all of it!'—all out (costs a memory)"}, "out": [{"text": {"zh": "灯火炸开，像一个太阳。四千六百个断口在光里一颗一颗地亮起来，又熄灭。下坠的车厢停在了半空。", "en": "The light bursts like a sun. Four thousand six hundred breaks light up one by one, then go dark. The falling cars stop in midair."}}], "effects": [{"set": "mem.praise", "to": false}, {"add": "memories", "by": -1}, {"add": "light", "by": 1}, {"add": "notice", "by": 2}, {"set": "flag.wheel_full", "to": true}, {"add": "rel.gran.esteem", "by": 1}], "script": [{"op": "cg", "id": "cg_restore"}, {"op": "say", "who": null, "t": {"zh": "灯火炸开，像一个太阳。四千六百个断口在光里一颗一颗地亮起来，又熄灭。下坠的车厢停在了半空。", "en": "The light bursts like a sun. Four thousand six hundred breaks light up one by one, then go dark. The falling cars stop in midair."}}, {"op": "say", "who": null, "t": {"zh": "那种被抽走的感觉，比昨天更重。台灯下拆开的闹钟。它重新走起来的时候，一只带着机油味的大手揉了揉我的头。“栖栖，你的手真巧。”", "en": "The feeling of being emptied, heavier than yesterday. An alarm clock in pieces under a desk lamp. When it ticks again, a big hand smelling of machine oil ruffles my hair. 'Qiqi, your hands are so clever.'"}}, {"op": "say", "who": null, "t": {"zh": "那天晚上是什么时候？父亲说了什么来着？", "en": "When was that night? What did Dad say?"}}, {"op": "say", "who": "lamp", "t": {"zh": "第二段。第一次被父亲夸手巧的晚上。我收下了。", "en": "The second. The night your father first praised your hands. I'll keep it."}, "forget": true}, {"op": "cg", "id": "cg_wheel"}, {"op": "say", "who": null, "t": {"zh": "然后，摩天轮开始转了。没有电，它就那样自己慢慢地转了起来。", "en": "Then the wheel starts to turn. No power at all; it simply turns, slowly, on its own."}}, {"op": "say", "who": null, "t": {"zh": "那一下的光，整个北岸都看见了。海湾对面的渔船上，有人举起了手机。", "en": "The whole north shore saw that flash. On a fishing boat across the bay, someone raised a phone."}}], "values": ["yong"], "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"id": "hub", "type": "strategy", "label": {"zh": "只修中心轴——它是所有连结的根", "en": "Mend only the hub—it is the root of every link"}, "out": [{"text": {"zh": "我想起下午碰过的那根轴。所有的辐条、所有的车厢，都是从它那里伸出去的。", "en": "I remember the hub I touched this afternoon. Every spoke, every car, reaches out from there."}}], "effects": [{"set": "flag.hub_only", "to": true}, {"add": "light", "by": 1}, {"add": "notice", "by": 1}, {"add": "rel.lamp.esteem", "by": 1}, {"add": "rel.gran.esteem", "by": 2}], "script": [{"op": "say", "who": null, "t": {"zh": "我想起下午碰过的那根轴。所有的辐条、所有的车厢，都是从它那里伸出去的。", "en": "I remember the hub I touched this afternoon. Every spoke, every car, reaches out from there."}}, {"op": "say", "who": "me", "t": {"zh": "不用修四千六百个。修一个就够了。", "en": "I don't need to mend four thousand six hundred. Just one."}}, {"op": "say", "who": null, "t": {"zh": "白光只亮了一瞬，落在轴心上。轴想起了自己，辐条就想起了轴，车厢就想起了辐条。一个接一个，像一排倒回去的骨牌。", "en": "The light flashes once, onto the hub. The hub remembers itself; the spokes remember the hub; the cars remember the spokes. One by one, like dominoes falling backward."}}, {"op": "say", "who": "lamp", "t": {"zh": "……你没用全力。我什么都没拿。", "en": "…You didn't go all out. I took nothing."}, "face": "surprised"}, {"op": "cg", "id": "cg_wheel"}, {"op": "say", "who": null, "t": {"zh": "摩天轮慢慢地转了起来。", "en": "The wheel begins, slowly, to turn."}}], "values": ["xiu"], "when": {"any": [{"v": "flag.scouted", "op": "==", "val": true}, {"v": "flag.blocked_cut", "op": "==", "val": true}]}}, {"id": "dive", "type": "strategy", "label": {"zh": "扑进旁边的排水沟里躲开", "en": "Dive into the drainage ditch"}, "out": [{"text": {"zh": "我扑了出去。车厢砸下来的声音，像一整座城一起塌了。", "en": "I throw myself aside. The cars crash down like a whole city collapsing."}}], "effects": [{"set": "flag.dead_wheel", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "我扑了出去。车厢砸下来的声音，像一整座城一起塌了。", "en": "I throw myself aside. The cars crash down like a whole city collapsing."}}, {"op": "say", "who": null, "t": {"zh": "等我爬起来，腰上的灯不见了。葛兰站在废墟上，手里提着它。", "en": "When I climb out, the lamp is gone from my belt. Gran stands on the wreckage, holding it."}}], "values": ["shou"], "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}, "ends": true}], "salience": 0, "order": 3, "script": [{"op": "bg", "id": "ferris"}, {"op": "cg", "id": "cg_cut", "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "say", "who": "gran", "t": {"zh": "断剑——", "en": "Sword—"}, "face": "battle", "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "say", "who": "sword", "t": {"zh": "——斩！", "en": "—cut!"}, "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "没有声音。那一刀从上往下划过空气，摩天轮上几千个连结同时松开了。", "en": "No sound. One stroke through the air, and thousands of links on the wheel let go at once."}, "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "四十八个车厢在半空中晃了一下，然后一起往下掉。几十吨的钢铁，朝我头顶砸下来。", "en": "Forty-eight cars sway in midair, then fall together. Tons of steel, straight at my head."}, "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "say", "who": "lamp", "t": {"zh": "你修不过来。除非你全力出手。", "en": "You can't mend that in time. Not unless you go all out."}, "face": "battle", "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "cg", "id": null, "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "葛兰没有砍摩天轮。可他退开的时候，断剑擦过了底座——一根主辐条断了，整座轮子歪了一下。", "en": "Gran never cuts the wheel. But as he pulls back, the Sword grazes the base—a main spoke snaps and the whole wheel lurches."}, "when": {"v": "flag.blocked_cut", "op": "==", "val": true}}, {"op": "say", "who": "lamp", "t": {"zh": "只断了一根。你不用全力。", "en": "Only one. You don't need to go all out."}, "face": "normal", "when": {"v": "flag.blocked_cut", "op": "==", "val": true}}], "cast": [{"id": "gran"}, {"id": "sword"}, {"id": "lamp"}]}, "c2_after": {"id": "c2_after", "chapter": "c2", "kind": "main", "title": {"zh": "摩天轮下 · 打完以后", "en": "Under the wheel · afterward"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "葛兰仰着头，看了那座转着的摩天轮很久。", "en": "Gran looks up at the turning wheel for a long time."}}], "choices": [{"id": "beer", "type": "expression", "label": {"zh": "接过那瓶没开的啤酒", "en": "Take the unopened beer"}, "out": [{"text": {"zh": "说好了，打完再喝。", "en": "Like we said. After."}}], "effects": [{"add": "rel.gran.trust", "by": 2}, {"add": "rel.gran.warmth", "by": 1}], "script": [{"op": "say", "who": "gran", "t": {"zh": "说好了，打完再喝。", "en": "Like we said. After."}}, {"op": "say", "who": null, "t": {"zh": "我们坐在长椅上，谁都没说话，看摩天轮转了一圈又一圈。", "en": "We sit on the bench, saying nothing, watching it go round and round."}}, {"op": "say", "who": "gran", "t": {"zh": "下回打架，叫上我。", "en": "Next time there's a fight, call me."}}], "values": ["xin"]}, {"id": "ask", "type": "expression", "label": {"zh": "“你要遗器，是为了断剑吧？”", "en": "'You want the relics for the Sword, don't you?'"}, "out": [{"text": {"zh": "……你读过我的那一夜。", "en": "…You've read my night."}}], "effects": [{"add": "rel.gran.trust", "by": 3}], "script": [{"op": "say", "who": "gran", "t": {"zh": "……你读过我的那一夜。", "en": "…You've read my night."}, "face": "surprised"}, {"op": "say", "who": "gran", "t": {"zh": "她陪了我十年。她想要的东西，只有王冠给得了。", "en": "She's been with me ten years. What she wants, only the Crown can give."}}, {"op": "say", "who": "sword", "t": {"zh": "葛兰，别说了。", "en": "Gran, that's enough."}, "face": "sad"}], "values": ["ji"], "when": {"v": "flag.know_gran", "op": "==", "val": true}}, {"id": "leave", "type": "expression", "label": {"zh": "什么也不说，转身回家", "en": "Say nothing and go home"}, "out": [{"text": {"zh": "我走的时候，听见身后啤酒瓶盖被撬开的声音。", "en": "As I leave, I hear a bottle cap pop behind me."}}], "effects": [], "script": [{"op": "say", "who": null, "t": {"zh": "我走的时候，听见身后啤酒瓶盖被撬开的声音。", "en": "As I leave, I hear a bottle cap pop behind me."}}], "values": ["shou"]}], "salience": 0, "order": 4, "script": [{"op": "bg", "id": "ferris"}, {"op": "show", "who": "gran", "face": "normal", "at": "left"}, {"op": "say", "who": null, "t": {"zh": "葛兰仰着头，看了那座转着的摩天轮很久。", "en": "Gran looks up at the turning wheel for a long time."}}, {"op": "say", "who": "sword", "t": {"zh": "……她修好了。", "en": "…She mended it."}}, {"op": "say", "who": "gran", "t": {"zh": "嗯。", "en": "Yeah."}}, {"op": "say", "who": "gran", "t": {"zh": "我小时候来过这里。那时候它还亮着。", "en": "I came here as a kid. It still lit up then."}, "face": "sad"}, {"op": "say", "who": "me", "think": true, "t": {"zh": "我看着它转，心里空了一块。我不知道那一块原来放着什么。", "en": "I watch it turn, and something in me is hollow. I don't know what used to be there."}, "when": {"v": "mem.praise", "op": "!=", "val": true}}], "cast": [{"id": "gran"}, {"id": "sword"}]}, "c3_note": {"id": "c3_note", "chapter": "c3", "kind": "main", "title": {"zh": "林记修复 · 凌晨 02:10", "en": "Lin's Repairs · 02:10"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "我没有开大灯，只拧开了台灯。拉开抽屉，摸出一个硬皮笔记本。", "en": "I don't turn on the main light, only the desk lamp. From the drawer, a hardback notebook."}}], "choices": [{"id": "open", "type": "expression", "label": {"zh": "把本子合上，去开门", "en": "Close the notebook and open the door"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.notebook", "to": true}], "script": [], "values": ["ji"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "shop_night"}, {"op": "say", "who": null, "t": {"zh": "我没有开大灯，只拧开了台灯。拉开抽屉，摸出一个硬皮笔记本。", "en": "I don't turn on the main light, only the desk lamp. From the drawer, a hardback notebook."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "在提灯拿走更多东西之前，把她写下来。", "en": "Before the Lamp takes any more, I'll write her down."}}, {"op": "say", "who": null, "t": {"zh": "我的母亲叫林遥。", "en": "My mother's name is Lin Yao."}}, {"op": "say", "who": null, "t": {"zh": "她穿一件洗得发白的蓝外套，左边袖口有一块补丁，针脚歪歪扭扭。", "en": "She wears a washed-out blue coat with a crooked patch on the left cuff."}, "when": {"v": "mem.coat", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "她做的番茄蛋汤很咸，每次都咸，可她自己从来不觉得。", "en": "Her tomato-and-egg soup is salty, every time, and she never notices."}, "when": {"v": "mem.soup", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "她不会骑自行车。", "en": "She can't ride a bike."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "……这句话是怎么冒出来的？如果她不会骑，那个下午扶着车座的人，就不是她。那是谁？", "en": "…Where did that come from? If she couldn't ride, then whoever held the seat that afternoon wasn't her. Then who?"}, "when": {"v": "mem.ride", "op": "!=", "val": true}}, {"op": "show", "who": "lamp", "face": "sad", "at": "center", "when": {"v": "mem.ride", "op": "!=", "val": true}}, {"op": "say", "who": "lamp", "t": {"zh": "这就是代价最可怕的地方。不是忘掉，是你再也分不清，剩下的哪些是真的。", "en": "That's the worst of the price. Not forgetting—never again being sure which of what's left is true."}, "when": {"v": "mem.ride", "op": "!=", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "我记得那个下午。扶车座的是……我还记得。所以我知道她不会骑。", "en": "I remember that afternoon. The one holding the seat was… I still remember. That's how I know she couldn't ride."}, "when": {"v": "mem.ride", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "卷帘门外面，有人敲了三下。很有礼貌，间隔均匀，像是用尺子量过的。", "en": "Three knocks on the shutter. Polite, evenly spaced, as if measured with a ruler."}}], "cast": [{"id": "lamp"}]}, "s3_baiqiu": {"id": "s3_baiqiu", "chapter": "c3", "kind": "side", "title": {"zh": "听潮茶楼三楼 · 下午三点（白秋）", "en": "Tidelistening Teahouse · 3 p.m. (Bai Qiu)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "白秋喜欢下午三点。不早不晚，正好够她听见想听的话。", "en": "Bai Qiu likes three in the afternoon. Not early, not late; just right for hearing what she wants to hear."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_baiqiu", "to": true}, {"add": "rel.baiqiu.esteem", "by": 1}], "script": [], "values": ["ji"]}], "salience": 2, "order": 0, "script": [{"op": "bg", "id": "teahouse"}, {"op": "show", "who": "baiqiu", "face": "smile", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "白秋喜欢下午三点。不早不晚，正好够她听见想听的话。", "en": "Bai Qiu likes three in the afternoon. Not early, not late; just right for hearing what she wants to hear."}}, {"op": "say", "who": null, "t": {"zh": "天平拿走的，是她做选择时的犹豫。所以五年来，她做什么决定都很快，快到自己都害怕。", "en": "What the Scales take is her hesitation. So for five years she has decided everything fast, so fast it frightens her."}}, {"op": "say", "who": "baiqiu", "t": {"zh": "我想要一个没有代价的世界。如果魔法不再拿走任何东西，就不会再有人那样死去了。", "en": "I want a world without a price. If magic stopped taking things, no one would die like that again."}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "“这是个好愿望。”白衣的女孩说。“这是个坏愿望。”黑衣的女孩说。", "en": "'That's a good wish,' says the girl in white. 'That's a bad wish,' says the girl in black."}}], "cast": [{"id": "baiqiu"}]}, "s3_chess": {"id": "s3_chess", "chapter": "c3", "kind": "side", "title": {"zh": "钟楼顶层（撑黑伞的人）", "en": "The clock tower (the man with the umbrella)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "撑黑伞的男人还站在栏杆边。棋盘上，白色的骑士往前走了一格。", "en": "The man with the black umbrella still stands at the rail. On the board, the white knight moves one square."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.saw_chess", "to": true}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "clocktower"}, {"op": "say", "who": null, "t": {"zh": "撑黑伞的男人还站在栏杆边。棋盘上，白色的骑士往前走了一格。", "en": "The man with the black umbrella still stands at the rail. On the board, the white knight moves one square."}}, {"op": "say", "who": null, "t": {"zh": "“修灯的那个，”棋盘说，“第二次没有全力，也修好了。”", "en": "'The lamp-mender,' says the chessboard, 'mended it the second time without going all out.'"}}, {"op": "say", "who": null, "t": {"zh": "男人没有说话。他看着那枚白骑士，看了很久。", "en": "The man says nothing. He looks at the white knight for a long time."}}], "when": {"v": "flag.hub_only", "op": "==", "val": true}}, "s3_chess_b": {"id": "s3_chess_b", "chapter": "c3", "kind": "side", "title": {"zh": "钟楼顶层（撑黑伞的人）", "en": "The clock tower (the man with the umbrella)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "撑黑伞的男人还站在栏杆边。棋盘上，白色的骑士往前走了一格。", "en": "The man with the black umbrella still stands at the rail. On the board, the white knight moves one square."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.saw_chess", "to": true}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "clocktower"}, {"op": "say", "who": null, "t": {"zh": "撑黑伞的男人还站在栏杆边。棋盘上，白色的骑士往前走了一格。", "en": "The man with the black umbrella still stands at the rail. On the board, the white knight moves one square."}}, {"op": "say", "who": null, "t": {"zh": "“修灯的那个，”棋盘说，“已经交出去两段了。”", "en": "'The lamp-mender,' says the chessboard, 'has given up two already.'"}}, {"op": "say", "who": null, "t": {"zh": "“六十年前，”男人说，“也是从第二段开始，她就不回头了。”", "en": "'Sixty years ago,' the man says, 'it was after the second that she stopped looking back.'"}}], "when": {"v": "flag.hub_only", "op": "!=", "val": true}}, "c3_august": {"id": "c3_august", "chapter": "c3", "kind": "main", "title": {"zh": "林记修复 · 凌晨 03:05", "en": "Lin's Repairs · 03:05"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "深夜打扰。我是守秘局的监督官，奥古斯特·莱恩。今晚，我替您收拾了一座摩天轮。", "en": "Forgive the hour. I'm a supervisor with the Secrecy Bureau, August Lane. Tonight I tidied up a Ferris wheel for you."}}], "choices": [{"id": "sign", "type": "expression", "label": {"zh": "签字，照实说摩天轮是我修的", "en": "Sign, and admit the wheel was mine"}, "out": [{"text": {"zh": "谢谢您的诚实。我明天会去申请一份“旧乐园改造项目试运营”的许可。", "en": "Thank you for your honesty. Tomorrow I'll file for an 'old park refurbishment trial run' permit."}}], "effects": [{"set": "flag.registered", "to": true}, {"add": "rel.august.trust", "by": 1}], "script": [{"op": "say", "who": "august", "t": {"zh": "谢谢您的诚实。我明天会去申请一份“旧乐园改造项目试运营”的许可。", "en": "Thank you for your honesty. Tomorrow I'll file for an 'old park refurbishment trial run' permit."}}], "values": ["xin"]}, {"id": "photo", "type": "dilemma", "label": {"zh": "签字，然后把那张照片推到他面前", "en": "Sign, then slide the photo across to him"}, "out": [{"text": {"zh": "缺了门牙的小女孩举着手，身边是一片完整得过分的空白。", "en": "A gap-toothed girl reaching up, beside her a blank far too complete."}}], "effects": [{"set": "flag.registered", "to": true}, {"set": "flag.showed_photo", "to": true}, {"add": "rel.august.trust", "by": 2}, {"add": "rel.august.warmth", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "缺了门牙的小女孩举着手，身边是一片完整得过分的空白。", "en": "A gap-toothed girl reaching up, beside her a blank far too complete."}}, {"op": "say", "who": "me", "t": {"zh": "十一年前，她从所有人的记忆里消失了。只有我还记得。", "en": "Eleven years ago she vanished from everyone's memory. Only I remember."}}, {"op": "say", "who": "august", "t": {"zh": "十一年前？不是六十年前？……那就不对了。", "en": "Eleven years ago? Not sixty? …Then something's wrong."}, "face": "surprised"}, {"op": "say", "who": "august", "t": {"zh": "或者说，上一次王冠改写的那条规则，到现在还在起作用。", "en": "Or else the rule the Crown rewrote last time is still working, even now."}, "face": "serious"}], "values": ["ji"]}, {"id": "lie", "type": "strategy", "label": {"zh": "签字，但说摩天轮不是我修的", "en": "Sign, but say the wheel wasn't you"}, "out": [{"text": {"zh": "……是吗。", "en": "…Is that so."}}], "effects": [{"set": "flag.registered", "to": true}, {"set": "flag.lied", "to": true}, {"add": "notice", "by": 2}, {"add": "rel.august.trust", "by": -1}], "script": [{"op": "say", "who": "august", "t": {"zh": "……是吗。", "en": "…Is that so."}, "face": "serious"}, {"op": "say", "who": null, "t": {"zh": "他推了推老花镜，在表格的空白处写了一行很小的字。", "en": "He nudges his reading glasses and writes a tiny line in the margin."}}], "values": ["duo"]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "shop_night"}, {"op": "show", "who": "august", "face": "normal", "at": "center"}, {"op": "say", "who": "august", "t": {"zh": "深夜打扰。我是守秘局的监督官，奥古斯特·莱恩。今晚，我替您收拾了一座摩天轮。", "en": "Forgive the hour. I'm a supervisor with the Secrecy Bureau, August Lane. Tonight I tidied up a Ferris wheel for you."}}, {"op": "say", "who": "august", "t": {"zh": "守秘局在王冠之争里保持中立。我们只管一件事：普通人不应该知道魔法的存在。", "en": "The Bureau is neutral in the Crown war. We see to one thing only: ordinary people must not learn that magic exists."}}, {"op": "cg", "id": "cg_register"}, {"op": "say", "who": null, "t": {"zh": "他推过来一张表：第七次灰烬王冠之争·遗器持有者登记。十二行。最后一行，钥匙那一栏，什么都没有写——不是“空”，也不是“未登记”，就只是一片空白。", "en": "He slides a form across: Seventh Ashen Crown War · Relic Holder Register. Twelve lines. The last, for the Key, is empty—not 'none', not 'unregistered', just blank."}}, {"op": "say", "who": "augu
