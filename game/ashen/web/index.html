", "en": "The rice-grain flame on the wick suddenly rises. Lightly, slowly, like someone in the dark drawing a deep breath."}}], "values": ["xin"]}, {"id": "win", "type": "strategy", "label": {"zh": "“我要赢。只要能走到王冠面前，你拿什么都行。”", "en": "'I'm going to win. If it gets me to the Crown, take whatever you want.'"}, "out": [{"text": {"zh": "……你知道我为什么只拿温暖的记忆吗？因为最不舍得。我拿得越重，你就越恨我。你越恨我，我就越不用……", "en": "…Do you know why I only take warm memories? Because they're the hardest to give. The heavier I take, the more you'll hate me. The more you hate me, the less I have to…"}}], "effects": [{"set": "flag.vow_win", "to": true}, {"add": "light", "by": 2}, {"add": "rel.lamp.trust", "by": -1}], "script": [{"op": "say", "who": "lamp", "t": {"zh": "……你知道我为什么只拿温暖的记忆吗？因为最不舍得。我拿得越重，你就越恨我。你越恨我，我就越不用……", "en": "…Do you know why I only take warm memories? Because they're the hardest to give. The heavier I take, the more you'll hate me. The more you hate me, the less I have to…"}, "face": "sad"}, {"op": "say", "who": "me", "t": {"zh": "越不用什么？", "en": "The less you have to what?"}}, {"op": "say", "who": null, "t": {"zh": "他低下头，没有回答。", "en": "He lowers his head and doesn't answer."}}], "values": ["duo"]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "shop_night"}, {"op": "show", "who": "lamp", "face": "sad", "at": "center"}, {"op": "say", "who": "me", "t": {"zh": "那盏被锁起来的灯里面，是我妈妈。你为什么有她的记忆？她也是你的主人？", "en": "The locked lantern has my mother inside. Why do you have her memories? Was she your holder too?"}}, {"op": "say", "who": "lamp", "t": {"zh": "我答应过她。她说，你看见了，就会去找她。她不想让你去找她。", "en": "I promised her. She said if you saw, you'd go looking for her. She didn't want you to."}}, {"op": "say", "who": "me", "t": {"zh": "……她还活着吗？我只问这一个。", "en": "…Is she alive? That's all I'm asking."}}, {"op": "say", "who": "lamp", "t": {"zh": "我不知道。她把东西交给我，然后就不见了。我和你一样，林栖。我只记得她，却不知道她去了哪里。", "en": "I don't know. She gave it to me, and then she was gone. I'm like you, Lin. I remember her and don't know where she went."}}, {"op": "say", "who": "lamp", "t": {"zh": "等你站在王冠面前，我就把它还给你。", "en": "When you stand before the Crown, I'll give it back to you."}}, {"op": "say", "who": null, "t": {"zh": "我拿出那个硬皮本子。第一页写着：我的母亲叫林遥。", "en": "I take out the hardback notebook. Page one: My mother's name is Lin Yao."}}, {"op": "say", "who": null, "t": {"zh": "我把“她不会骑自行车”那一行划掉，在下面写：扶我学骑车的，是爸爸。我已经不记得了。但是提灯替我记得。", "en": "I strike out 'She can't ride a bike' and write beneath: The one who taught me to ride was Dad. I don't remember anymore. But the Lamp remembers for me."}, "when": {"v": "mem.ride", "op": "!=", "val": true}}], "cast": [{"id": "lamp"}]}, "c7_plaza": {"id": "c7_plaza", "chapter": "c7", "kind": "main", "title": {"zh": "钟楼广场 · 周二 23:59", "en": "Clock-tower plaza · Tuesday, 23:59"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "那一行字出现在了啤酒瓶的标签上。原本印着“维斯特林精酿”的地方：明晚十二点，钟楼之下。所有遗器持有者，来见我。", "en": "The line appeared on the beer bottle's label, where it used to say 'Westerling Craft': Midnight tomorrow, beneath the clock tower. Every relic holder, come and see me."}}], "choices": [{"id": "pride", "type": "dilemma", "label": {"zh": "“你已经想不起来，为什么要让所有人看着你了，对吧？”", "en": "'You can't remember anymore why you want everyone watching, can you?'"}, "out": [{"text": {"zh": "……这和你没关系。", "en": "…That's none of your business."}}], "effects": [{"set": "flag.evelyn_falter", "to": true}, {"add": "rel.evelyn.trust", "by": 2}, {"add": "rel.evelyn.warmth", "by": 1}], "script": [{"op": "say", "who": "evelyn", "t": {"zh": "……这和你没关系。", "en": "…That's none of your business."}}, {"op": "say", "who": "me", "t": {"zh": "你叫我们所有人来，让我们看着你赢。赢了以后呢？你为什么要让所有人看着？", "en": "You called us all here to watch you win. After that? Why do you need everyone watching?"}}, {"op": "say", "who": null, "t": {"zh": "她的手指在手套里蜷了一下。她想说“因为我要让他们承认我”，可这句话到了嘴边，变得很陌生，像一句别人说过的话。", "en": "Her fingers curl inside her gloves. She wants to say 'because I want them to acknowledge me', but at her lips it turns strange, like something someone else once said."}}, {"op": "say", "who": "evelyn", "t": {"zh": "……修灯的。你很烦。", "en": "…Lamp-mender. You're a nuisance."}, "face": "sad"}, {"op": "say", "who": "me", "t": {"zh": "我知道。很多人都这么说。", "en": "I know. A lot of people say so."}}], "values": ["ji"], "when": {"any": [{"v": "flag.know_pride", "op": "==", "val": true}, {"v": "flag.know_invite", "op": "==", "val": true}]}}, {"id": "again", "type": "expression", "label": {"zh": "“你上次说还没想好要改什么。现在想好了吗？”", "en": "'Last time you hadn't decided what to change. Have you now?'"}, "out": [{"text": {"zh": "赢了以后，我再想。", "en": "I'll think about it after I win."}}], "effects": [{"add": "rel.evelyn.trust", "by": 1}, {"add": "rel.evelyn.esteem", "by": 1}], "script": [{"op": "say", "who": "evelyn", "t": {"zh": "赢了以后，我再想。", "en": "I'll think about it after I win."}}, {"op": "say", "who": "me", "t": {"zh": "那你现在为什么要让所有人看着？", "en": "Then why do you need everyone watching now?"}}, {"op": "say", "who": "evelyn", "t": {"zh": "……修灯的，你很烦。", "en": "…Lamp-mender, you're a nuisance."}, "face": "serious"}], "values": ["xin"], "when": {"v": "flag.asked_evelyn", "op": "==", "val": true}}, {"id": "look", "type": "expression", "label": {"zh": "什么都不说，抬头看那顶荆棘王冠", "en": "Say nothing; look up at the crown of thorns"}, "out": [{"text": {"zh": "月光从荆棘的缝隙里漏下来，在广场上投下一片斑驳的、带刺的影子。所有人都仰着头。", "en": "Moonlight leaks through the thorns and throws a dappled, spiked shadow across the plaza. Everyone is looking up."}}], "effects": [{"add": "rel.evelyn.esteem", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "月光从荆棘的缝隙里漏下来，在广场上投下一片斑驳的、带刺的影子。所有人都仰着头。", "en": "Moonlight leaks through the thorns and throws a dappled, spiked shadow across the plaza. Everyone is looking up."}}], "values": ["shou"]}], "salience": 0, "order": 3, "script": [{"op": "bg", "id": "clock_plaza"}, {"op": "say", "who": null, "t": {"zh": "那一行字出现在了啤酒瓶的标签上。原本印着“维斯特林精酿”的地方：明晚十二点，钟楼之下。所有遗器持有者，来见我。", "en": "The line appeared on the beer bottle's label, where it used to say 'Westerling Craft': Midnight tomorrow, beneath the clock tower. Every relic holder, come and see me."}}, {"op": "say", "who": null, "t": {"zh": "广场被清空了：“钟楼夜间检修”。白秋和她的双生子，葛兰和断剑，苏蔓和摇篮，戴耳机的亚当，两手空空的卡罗。还有扣着最上面一颗扣子的奥古斯特。", "en": "The plaza has been cleared: 'Clock tower closed for night maintenance'. Bai Qiu and her twins, Gran and the Sword, Su Man and the Cradle, Adam in his headphones, Carlo with empty hands. And August, buttoned to the top."}}, {"op": "show", "who": "gran", "face": "normal", "at": "left"}, {"op": "say", "who": "sword", "t": {"zh": "你紧张什么？你烟都快被你嚼烂了。", "en": "What are you nervous about? You've chewed that cigarette to pulp."}, "face": "smile", "when": {"v": "rel.gran.trust", "op": ">=", "val": 4}}, {"op": "say", "who": null, "t": {"zh": "葛兰隔着半个广场看了我一眼，把那支被嚼烂的烟扔进了垃圾桶，别过了脸。", "en": "Across half the plaza Gran glances at me, tosses the chewed cigarette in the bin and looks away."}}, {"op": "hide", "who": "gran"}, {"op": "say", "who": null, "t": {"zh": "钟楼的钟敲响了十二点。", "en": "The clock tower strikes twelve."}}, {"op": "cg", "id": "cg_plaza"}, {"op": "say", "who": null, "t": {"zh": "第一声钟响，伊芙琳从钟楼顶上走了下来。不是走楼梯，是走在荆棘交织成的阶梯上。光着脚的长发少女在她身后飞；戴眼镜的书记员写下一行字：钟楼，停。", "en": "On the first stroke Evelyn descends from the top of the tower—not by stairs, but down a stair of woven thorns. A barefoot girl with long hair flies behind her; a bespectacled clerk writes a line: Clock, stop."}}, {"op": "say", "who": "evelyn", "t": {"zh": "我会赢。", "en": "I will win."}, "face": "serious"}, {"op": "say", "who": null, "t": {"zh": "那四个字变成了四根古树一样的巨大荆棘，撞碎了广场的石板，长到钟楼的高度，在尖顶上空交织成了一顶漆黑的、带刺的冠冕。", "en": "Those words become four thorns as thick as ancient trees. They shatter the paving, grow to the height of the tower and weave above the spire into a black crown of thorns."}}, {"op": "cg", "id": null}, {"op": "show", "who": "evelyn", "face": "normal", "at": "center"}, {"op": "say", "who": "lamp", "t": {"zh": "她每一次出手，荆棘冠都会拿走她的骄傲。她现在用得这么狠，应该已经没剩多少了。", "en": "Every time she strikes, the Crown takes her pride. Using it this hard, she can't have much left."}}], "cast": [{"id": "evelyn"}, {"id": "lamp"}, {"id": "gran"}]}, "c7_end": {"id": "c7_end", "chapter": "c7", "kind": "main", "title": {"zh": "钟楼广场 · 00:09", "en": "Clock-tower plaza · 00:09"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "奥古斯特·莱恩感觉到西装内袋里多了一样东西。一个牛皮纸信封。里面是一张泛黄的纸：", "en": "August Lane feels something new in his inside pocket. A brown envelope. Inside, a yellowed page:"}}], "choices": [{"id": "wait", "type": "expression", "label": {"zh": "“我等你。”", "en": "'I'll be waiting.'"}, "out": [{"text": {"zh": "钟楼的钟敲响了十二点十分。那一声很长，很长，在维斯特林的上空回荡了很久。像是一场漫长的战争，终于真正地，开始了。", "en": "The tower strikes ten past twelve. The note is long, so long, ringing over Westerling for a great while. As if a long war has finally, truly begun."}}], "effects": [{"set": "flag.c7_done", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "钟楼的钟敲响了十二点十分。那一声很长，很长，在维斯特林的上空回荡了很久。像是一场漫长的战争，终于真正地，开始了。", "en": "The tower strikes ten past twelve. The note is long, so long, ringing over Westerling for a great while. As if a long war has finally, truly begun."}}], "values": ["yong"]}], "salience": 0, "order": 4, "script": [{"op": "bg", "id": "clock_plaza"}, {"op": "show", "who": "august", "face": "serious", "at": "left"}, {"op": "say", "who": null, "t": {"zh": "奥古斯特·莱恩感觉到西装内袋里多了一样东西。一个牛皮纸信封。里面是一张泛黄的纸：", "en": "August Lane feels something new in his inside pocket. A brown envelope. Inside, a yellowed page:"}}, {"op": "say", "who": null, "t": {"zh": "第六次灰烬王冠之争，胜者：梅洛。改写的规则：（此处字迹被抹去）。规则生效后，确认被遗忘者名单如下——", "en": "Sixth Ashen Crown War. Victor: Merlo. Rule rewritten: (this line erased). Confirmed forgotten after the rule took effect:"}}, {"op": "say", "who": null, "t": {"zh": "7. 苏（姓氏不详）——提灯持有者。……最后一个名字，墨迹比其他的都新：林遥——十一年前。", "en": "7. Su (surname unknown)—holder of the Lamp. …The last name, in fresher ink than the rest: Lin Yao—eleven years ago."}}, {"op": "say", "who": null, "t": {"zh": "他抬起头，隔着整个广场，看向我。他找了四十一年的东西，就这样，被人塞进了他的口袋里。", "en": "He looks up, across the whole plaza, at me. What he spent forty-one years looking for has simply been slipped into his pocket."}, "when": {"v": "flag.showed_photo", "op": "==", "val": true}}, {"op": "hide", "who": "august"}, {"op": "show", "who": "evelyn", "face": "normal", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "伊芙琳打了一个响指。钟楼的指针重新开始走了。只有那顶荆棘王冠还悬在夜空里。", "en": "Evelyn snaps her fingers. The clock hands move again. Only the crown of thorns still hangs in the night sky."}}, {"op": "say", "who": "evelyn", "t": {"zh": "诸位，我给大家七天的时间。七天以后，我会从你们每一个人手里，把遗器拿过来。一个一个地，按我的顺序。", "en": "Everyone, I give you seven days. In seven days I will take your relics from each of you. One by one, in my order."}}, {"op": "say", "who": "evelyn", "t": {"zh": "修灯的，你是第一个。", "en": "Lamp-mender. You're first."}}, {"op": "say", "who": null, "t": {"zh": "我的手慢慢地握住了腰上的提灯。灯是暖的。", "en": "My hand slowly closes on the lamp at my belt. It's warm."}}], "cast": [{"id": "evelyn"}, {"id": "august"}]}}, "endings": [{"id": "g_end", "title": {"zh": "结局", "en": "Ending"}, "fragments": [{"id": "refuse", "title": {"zh": "坏结局「地下室的灰」", "en": "Bad End: Ash in the Basement"}, "text": {"zh": "拱顶塌下来。第二天，林记修复的卷帘门没有拉开。没有人记得那家铺子原本是谁开的。", "en": "The vault falls. Next day Lin's Repairs doesn't open. No one remembers who used to run it."}, "when": {"v": "flag.dead_refuse", "op": "==", "val": true}, "dead": true, "clinic": {"zh": "灰色诊所里，戴圆框眼镜的医生推了推眼镜：“拒绝契约没有错，错在时机。那一晚，断剑已经找上门了。先活下来，代价以后再谈。——回到地下室，接受契约。”", "en": "In the grey clinic, the doctor in round glasses pushes them up: 'Refusing the pact isn't wrong; the timing is. That night the Sword was already at the door. Live first; argue about the price later. —Go back to the basement and accept.'"}}, {"id": "cut", "title": {"zh": "坏结局「断线」", "en": "Bad End: Severed"}, "text": {"zh": "灯还在，契约断了。葛兰拎走了提灯。你回到铺子里，想不起来自己为什么要去祖宅。", "en": "The lamp survives; the pact doesn't. Gran takes the Lamp. Back at the shop you can't remember why you went to the old house."}, "when": {"v": "flag.dead_cut", "op": "==", "val": true}, "dead": true, "clinic": {"zh": "穿蓝外套的女人坐在诊所的柜台后面：“断剑斩的是连结，挡是挡不住的。要么接回去，要么让她不想砍。你读过葛兰那一夜吗？”", "en": "A woman in a blue coat sits behind the clinic counter: 'The Sword cuts connections; you can't block that. Either join it again, or make her not want to cut. Did you read Gran's night?'"}}, {"id": "wheel", "title": {"zh": "坏结局「星期」", "en": "Bad End: Sunday"}, "text": {"zh": "星期日乐园的招牌上，“日”字三十年前就掉了。那一夜以后，摩天轮底下又多了一堆废铁。你没有灯了。", "en": "The 'Sunday' sign lost its last letters thirty years ago. After that night there's one more heap of scrap under the wheel. You no longer have a lamp."}, "when": {"v": "flag.dead_wheel", "op": "==", "val": true}, "dead": true, "clinic": {"zh": "戴圆框眼镜的医生：“躲开没有用，那是几十吨的钢。要么全力，要么找到所有连结的根。下午去看过场地吗？”", "en": "The doctor in round glasses: 'Dodging won't work; that's tons of steel. Go all out, or find the root of every link. Did you look at the ground that afternoon?'"}}, {"id": "alley", "title": {"zh": "坏结局「背后」", "en": "Bad End: Behind You"}, "text": {"zh": "线断了。灯落进蓝色的油漆里，再也没有亮。那一夜以后，你又变回了一个只会修收音机的人。", "en": "The line is cut. The lamp falls into the blue paint and never lights again. After that night you're just someone who fixes radios."}, "when": {"v": "flag.dead_alley", "op": "==", "val": true}, "dead": true, "clinic": {"zh": "戴圆框眼镜的医生：“断剑砍的是连结。把背留给他，就是把线留给他。你见过他砍摩天轮——他从来先砍什么？”", "en": "The doctor in round glasses: 'The Sword cuts links. Turn your back on him and you hand him the line. You saw him at the wheel—what does he always cut first?'"}, "cg": "cg_m_spilled"}, {"id": "tunnel", "title": {"zh": "坏结局「〇号线」", "en": "Bad End: Line Zero"}, "text": {"zh": "〇号线又封上了。守秘局的报告里写着：信号故障，无人受伤。提灯那一栏，持有者变成了“雷恩，A.”。", "en": "Line Zero is sealed again. The Bureau report reads: signal fault, no injuries. On the Lamp's line, the holder now reads 'Rhine, A.'"}, "when": {"v": "flag.dead_tunnel", "op": "==", "val": true}, "dead": true, "clinic": {"zh": "戴圆框眼镜的医生：“镜子只会照它见过的东西。你修过什么，它没见过？——还有，那两兄弟，读过他们的那一夜吗？”", "en": "The doctor in round glasses: 'The mirror can only copy what it has seen. What could you mend that it has never seen? And those brothers—did you read their night?'"}, "cg": "cg_t_ambush"}, {"id": "vol1", "title": {"zh": "卷一《灯火》完", "en": "Volume 1, Lamplight · The End"}, "cg": "cg_plaza", "text": {"zh": "荆棘王冠悬在维斯特林的夜空里。伊芙琳给了所有人七天，而你是第一个。灯是暖的。卷二《结盟》，从这七天开始。", "en": "The crown of thorns hangs over Westerling. Evelyn has given everyone seven days, and you are first. The lamp is warm. Volume 2, Alliance, begins with those seven days."}, "when": {"v": "flag.c7_done", "op": "==", "val": true}}]}, {"id": "g_mem", "title": {"zh": "记忆册", "en": "The memory book"}, "fragments": [{"id": "whole", "text": {"zh": "记忆册里一页都没有变灰。你学会了在不全力的时候，也能把东西修好。", "en": "Not one page of the memory book has gone grey. You learned to mend things without going all out."}, "when": {"all": [{"v": "flag.c7_done", "op": "==", "val": true}, {"v": "memories", "op": ">=", "val": 6}]}}, {"id": "some", "text": {"zh": "记忆册里有几页变灰了。你知道那里写过很温暖的事，只是想不起来是什么。", "en": "A few pages of the memory book have gone grey. You know something warm was written there; you can't recall what."}, "when": {"all": [{"v": "flag.c7_done", "op": "==", "val": true}, {"all": [{"v": "memories", "op": "<=", "val": 5}, {"v": "memories", "op": ">=", "val": 3}]}]}}, {"id": "most", "text": {"zh": "记忆册里大半都变灰了。最后剩下的那一页，是港口的照片：照片上你身边是一片空白，可你记得那里站着她。", "en": "Most of the memory book has gone grey. The last page left is the photo at the harbor: a blank beside you, but you remember she stood there."}, "when": {"all": [{"v": "flag.c7_done", "op": "==", "val": true}, {"v": "memories", "op": "<=", "val": 2}]}}]}, {"id": "g_gran", "title": {"zh": "葛兰", "en": "Gran"}, "fragments": [{"id": "ally", "text": {"zh": "葛兰在摩天轮底下说：下回打架，叫上我。你没想到自己会记住这句话。", "en": "Under the Ferris wheel Gran said: next time there's a fight, call me. You didn't expect to remember that."}, "when": {"all": [{"v": "flag.c7_done", "op": "==", "val": true}, {"v": "rel.gran.trust", "op": ">=", "val": 4}]}}, {"id": "rival", "text": {"zh": "葛兰还是你的对手。他扔给你的那瓶啤酒，你还没有开。", "en": "Gran is still your opponent. The beer he tossed you is still unopened."}, "when": {"all": [{"v": "flag.c7_done", "op": "==", "val": true}, {"v": "rel.gran.trust", "op": "<=", "val": 3}]}}]}, {"id": "g_ben", "title": {"zh": "雷恩兄弟", "en": "The Rhine brothers"}, "fragments": [{"id": "ben_leg", "text": {"zh": "本出院那天是走着出去的。亚当在医院门口站了很久，什么都没说，冲你鞠了一躬。", "en": "Ben walked out of the hospital on his own feet. Adam stood at the door a long time, said nothing, and bowed to you."}, "when": {"all": [{"v": "flag.c7_done", "op": "==", "val": true}, {"v": "flag.ben_leg", "op": "==", "val": true}]}}, {"id": "ben_lost", "text": {"zh": "本的左腿没了。你在工具包里翻出一盒弹簧和齿轮，想了很久，能不能给他修一条腿。", "en": "Ben lost his left leg. You turned out a box of springs and gears from your tool bag and wondered for a long time whether you could mend him a leg."}, "when": {"all": [{"v": "flag.c7_done", "op": "==", "val": true}, {"v": "flag.ben_leg", "op": "!=", "val": true}]}}]}, {"id": "g_su", "title": {"zh": "苏蔓", "en": "Su Man"}, "fragments": [{"id": "su", "text": {"zh": "苏蔓的名片压在柜台的玻璃底下。她还是每天打一个电话来，问你吃药了没有。", "en": "Su Man's card sits under the counter glass. She still calls every day to ask if you've taken your pills."}, "when": {"all": [{"v": "flag.c7_done", "op": "==", "val": true}, {"v": "flag.told_su", "op": "==", "val": true}]}}, {"id": "su_far", "text": {"zh": "苏蔓说过，她想阻止王冠被打开。你没告诉她你妈妈的事。也许下一次。", "en": "Su Man said she wants to stop the Crown opening. You didn't tell her about your mum. Next time, maybe."}, "when": {"all": [{"v": "flag.c7_done", "op": "==", "val": true}, {"v": "flag.told_su", "op": "!=", "val": true}]}}]}, {"id": "g_evelyn", "title": {"zh": "伊芙琳", "en": "Evelyn"}, "fragments": [{"id": "evelyn", "text": {"zh": "伊芙琳走回夜空之前，最后看了你一眼。那一眼里，好像有一个她自己也答不上来的问题。", "en": "Before Evelyn walked back into the sky she looked at you one last time. As if there were a question in it she couldn't /* ---------- state ---------- */

  preload(url).then(apply); setTimeout(apply, el.dataset.shown ? 2500 : 1500);
}

  const el = $("#cg"), id = V.cg, url = id && artOf(`cg/${id}.webp`);

const POS = { left: 24, center: 50, right: 76 };
function silhouette(who, face) {
  const c = COLORS[who] || "#ddd", f = t((CAMP.art.faces || {})[face]) || face;

    <circle cx="45" cy="38" r="20" fill="url(#g-${who})"/><path d="M12 160 C12 95 25 70 45 66 C65 70 78 95 78 160 Z" fill="url(#g-${who})"/>
    <text x="45" y="112" text-anchor="middle" font-size="9" fill="#1b1b2a" font-weight="700"></text><text x="45" y="125" text-anchor="middle" font-size="7.5" fill="#1b1b2a"></text>`;

}

/* ---------- the script runner ---------- */
function load(lines, src) { V.queue = lines.map((l, k) => ({ ...l, src: `${src}:${k}` })); V.i = 0; prefetch(lines); }
function step() {

    if (op.op === "bg") { V.bg = op.id; V.cg = null; V.sprites = {}; draw(); continue; }
    if (op.op === "show") {
      const at = op.at || (V.sprites[op.who] || {}).at || "center";
      for (const w of Object.keys(V.sprites)) if (w !== op.who && V.sprites[w].at === at) delete V.sprites[w];   // 同一个位置只站一个人：后上来的把前面的人换下去
      V.sprites[op.who] = { face: op.face, at }; drawSprites(); continue; }
    if (op.op === "hide") { if (op.who) delete V.sprites[op.who]; else V.sprites = {}; drawSprites(); continue; }
    if (op.op === "cg") { if (op.id && !artOf(`cg/${op.id}.webp`)) continue;   // 还没画的 CG 先跳过，不显示占位；图一到就会出现
      V.cg = op.id; if (op.id) unlock("cg", op.id); drawCg(); continue; }

}
function say(op) {

  V.speaker = op.who && op.who !== "me" ? op.who : null; drawSprites();
  $("#name").textContent = op.who ? nameOf(op.who) : "";
  const el = $("#text"), full = t(op.t);
  el.classList.toggle("think", !!op.think); el.classList.toggle("forget", !!op.forget); if (op.forget && !skip) toast(ui("memToast"));
  V.log.push({ who: op.who ? nameOf(op.who) : "", text: op.think ? `（${full}）` : full }); if (V.log.length > 300) V.log.shift();

  $("#next").classList.remove("on");

}

  $("#next").classList.add("on");

}

/* ---------- engine bridge ---------- */

}

const AUDIO = { on: store.get("music", true), ctx: null, out: null, mood: "day", sea: false, rain: false, beat: 0, next: 0, timer: null, amb: null };
const MOODS = {   // 每小节一个和弦（MIDI 音高）、每分钟拍数、音量

const BGMOOD = { clocktower: "night", shop_rain: "night", basement: "night", bar: "night", eiche_top: "night", ferris: "night", lighthouse: "night", shop_night: "night", harbor_street: "night", oldhouse: "dusk", shop_day: "dusk", park_gate: "dusk", mural_alley: "night", metro: "night", train: "night", clock_plaza: "night", hawke_study: "night", lamp_inside: "night", ward: "day" };

/* ---------- 自由对话（v0.18）：对场上的女主说一句话 ----------
   AI 回一句台词，并只给你的话打标签（语气、显出的品质）；好感怎么变由引擎规则决定（CC.speak），每幕最多两句。
   网站没接 AI（或本地打开页面）时不出现这个入口。 */
const TALK = { ai: false };

function talkBox(n, who) {
  const m = $("#menu"); m.replaceChildren(); m.hidden = false;

  const inp = document.createElement("input"); inp.maxLength = 120; inp.placeholder = ui("talkHint"); inp.autocomplete = "off"; inp.enterKeyHint = "send";

  f.append(inp, send, back); m.append(f);
  f.onsubmit = async e => {

    inp.disabled = send.disabled = back.disabled = true; send.textContent = "…";
    const recent = V.log.slice(-10).map(l => (l.who ? l.who + "：" : "") + l.text);
    let out = null;
    try {
      // 和三国走同一条通道：流式 + 结构化输出（模型的回答一定是合法的 JSON），读最后的 done
      const r = await fetch("/api/sanguo", { method: "POST", headers: { "content-type": "application/json", accept: "application/x-ndjson" }, body: JSON.stringify({ game: "xichuan", phase: "express", task: "talk", lang: LANG, context: { node: n.id, target: who, text, vars: G.v, recent, memories: ((V.said || {})[who] || []).slice(-6) } }) });
      const body = r.ok ? await r.text() : "";

    // 她记得你说过的话（之后的对话会带上）
    V.said = V.said || {}; (V.said[who] = V.said[who] || []).push(text.slice(0, 80)); if (V.said[who].length > 12) V.said[who].shift();

    // 这句话是不是剧本里的某条“走向”（决裂、隐藏的门、承诺）：AI 认出来的为准，离线时按语气标签兜底；后果由规则决定

/* ---------- 2.5D：倾斜手机（电脑上移动鼠标），背景和 CG 按深度图错开，立绘是中间一层 ----------
   深度图在 art/depth/（越亮越近），由开源的 Depth Anything V2 Small 生成；没有深度图或浏览器不支持 WebGL 时，照常显示平面图。 */

const FX = { bg: new DepthLayer($("#bg"), .05), cg: new DepthLayer($("#cg"), .04) };
function askTilt() {                       // iPhone only lets a page read the tilt after a tap, and asks the player first
  const D = window.DeviceOrientationEvent;
  if (!TILT.asked && D && typeof D.requestPermission === "function") { TILT.asked = true; D.requestPermission().catch(() => {}); }
}
addEventListener("deviceorientation", e => {
  if (e.beta == null || e.gamma == null) return;
  const ang = (screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0;
  let gx = e.gamma, gy = e.beta;
  if (ang === 90) { gx = e.beta; gy = -e.gamma; } else if (ang === -90 || ang === 270) { gx = -e.beta; gy = e.gamma; }
  if (!TILT.base) TILT.base = { x: gx, y: gy };
  TILT.base.x += (gx - TILT.base.x) * .006; TILT.base.y += (gy - TILT.base.y) * .006;   // whatever angle you hold settles back to "front" after a few seconds
  TILT.tx = clamp1((gx - TILT.base.x) / 14); TILT.ty = clamp1((gy - TILT.base.y) / 14);

$("#stage").addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const r = $("#stage").getBoundingClientRect(); TILT.tx = clamp1(((e.clientX - r.left) / r.width) * 2 - 1); TILT.ty = clamp1(((e.clientY - r.top) / r.height) * 2 - 1);

(function fxLoop() {

  const x = TILT.on ? TILT.x : 0, y = TILT.on ? TILT.y : 0;
  FX.bg.draw(x, y); if (V && V.cg) FX.cg.draw(x, y);
  const st = $("#stage"); $("#sprites").style.transform = `translate3d(${(-x * .05 * .6 * st.clientWidth / 1.05).toFixed(1)}px, ${(-y * .05 * .35 * st.clientHeight / 1.05).toFixed(1)}px, 0)`;
