/* ---------- bar, title, input ---------- */
function renderBar() {
  const bar = $("#bar"); bar.replaceChildren();
  const btn = (k, f, pressed) => { const b = document.createElement("button"); b.textContent = ui(k); if (pressed != null) b.setAttribute("aria-pressed", String(pressed)); b.onclick = e => { e.stopPropagation(); f(); }; bar.append(b); };
  btn("log", showLog); btn("mem", showMemory); btn("arc", showArchive); btn("auto", () => { auto = !auto; skip = false; renderBar(); if (auto && !typing && $("#menu").hidden) step(); }, auto);
  btn("skip", () => { skip = !skip; auto = false; renderBar(); if (skip && $("#menu").hidden) step(); }, skip);
  btn("music", () => { AUDIO.on = !AUDIO.on; store.set("music", AUDIO.on); AUDIO.on ? audioStart() : audioStop(); renderBar(); }, AUDIO.on);
  btn("tilt", () => { TILT.on = !TILT.on; store.set("tilt", TILT.on); askTilt(); renderBar(); }, TILT.on);
  btn("style", toggleStyle); btn("save", () => slots("save")); btn("loadS", () => slots("load"));
  btn("lang", () => { LANG = LANG === "zh" ? "en" : "zh"; saveLang(LANG); document.documentElement.lang = LANG; renderBar(); draw(); const op = V.queue[V.i - 1]; if (op && op.op === "say") { clearInterval(typing); typing = null; $("#name").textContent = op.who ? nameOf(op.who) : ""; $("#text").textContent = t(op.t); $("#next").classList.add("on"); } });
  btn("title", title);
}
function title() {
  auto = skip = false; clearTimeout(timer);
  const el = $("#title"); el.hidden = false; el.replaceChildren();
  const url = art("cg/title.webp") || art("bg/clocktower.webp");
  // 停在标题画面时，先把开场要用的图下好
  const first = Object.values(CAMP.nodes).find(n => n.chapter === CAMP.chapters[0].id && n.kind === "main"); if (first) prefetch(first.script);
  el.style.backgroundImage = url ? `url("${url}")` : "radial-gradient(ellipse at 50% 35%, #3a3326, #0b0a0e 70%)";
  const h = document.createElement("h1"); h.textContent = t(CAMP.title);
  const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = ui("sub");
  el.append(h, sub);
  const b = (k, f, dis) => { const x = document.createElement("button"); x.textContent = ui(k); x.disabled = !!dis; x.onclick = f; if (dis) x.style.opacity = .4; el.append(x); };
  const a = store.get("auto", null);
  if (a) b("cont", () => restore(a));
  b("start", start); b("load", () => { el.hidden = true; slots("load"); $("#panel").querySelector(".close").onclick = () => { $("#panel").hidden = true; title(); }; });
  b("gallery", () => { showGallery(); }); b("arc", () => { showArchive(); });
  { const s = document.createElement("button"); s.className = "lang"; s.style.right = "70px"; s.textContent = ui("style") + " · " + t(CAMP.art.styles[STYLE]); s.onclick = () => { toggleStyle(); title(); }; el.append(s); }
  const l = document.createElement("button"); l.className = "lang"; l.textContent = ui("lang"); l.onclick = () => { LANG = LANG === "zh" ? "en" : "zh"; saveLang(LANG); title(); renderBar(); }; el.append(l);
  el.querySelector("button")?.focus();
}
function start() {
  askTilt(); audioStart();
  ["lamp", "gran", "sword"].forEach(w => preload(art(`sprites/${w}/normal.webp`)));
  G = CC.newGame(CAMP); V = { bg: null, cg: null, sprites: {}, queue: [], i: 0, log: [], speaker: null, started: null };
  $("#title").hidden = true; $("#endscreen").hidden = true; draw(); next();
}
$("#box").addEventListener("click", () => { if ($("#menu").hidden && $("#panel").hidden) { skip = false; step(); } });
document.addEventListener("keydown", e => {
  if (!$("#title").hidden || !$("#menu").hidden) return;
  if (!$("#panel").hidden) { if (e.key === "Escape") $("#panel").hidden = true; return; }
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); step(); }
  if (e.key === "Control") { skip = true; renderBar(); step(); }
});
document.addEventListener("keyup", e => { if (e.key === "Control") { skip = false; renderBar(); } });

/* ---------- 背景音乐（实验版，v0.18）：页面里实时合成，不用音频文件 ----------
   轻柔的钢琴琶音 + 和弦铺底，按场景分白天、黄昏、夜里、雨天；海边的场景加海浪，下雨的场景加雨声。
   确认“有声音”值得做以后，换成正式授权的配乐。 */
const AUDIO = { on: store.get("music", true), ctx: null, out: null, mood: "day", sea: false, rain: false, beat: 0, next: 0, timer: null, amb: null };
const MOODS = {   // 每小节一个和弦（MIDI 音高）、每分钟拍数、音量
  day:   { bpm: 76, vol: .9, chords: [[60, 64, 67, 71], [57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 67]] },
  dusk:  { bpm: 68, vol: .8, chords: [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]] },
  night: { bpm: 58, vol: .65, chords: [[57, 60, 64, 67], [53, 57, 60, 64], [48, 52, 55, 59], [55, 59, 62, 65]] },
};
const BGMOOD = { clocktower: "night", shop_rain: "night", basement: "night", bar: "night", eiche_top: "night", ferris: "night", lighthouse: "night", shop_night: "night", harbor_street: "night", oldhouse: "dusk", shop_day: "dusk", park_gate: "dusk" };
const SEA = new Set(["bar", "ferris", "lighthouse", "park_gate"]);
const RAIN = new Set(["shop_rain", "clocktower"]);
function audioMood(id) { if (!id) return; AUDIO.mood = BGMOOD[id] || "day"; AUDIO.sea = SEA.has(id); AUDIO.rain = RAIN.has(id); audioAmb(); }
function audioStart() {
  if (!AUDIO.on) return;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  if (!AUDIO.ctx) {
    const c = AUDIO.ctx = new AC(), out = AUDIO.out = c.createGain(); out.gain.value = 0;
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600;

/* ---------- 自由对话（v0.18）：对场上的女主说一句话 ----------
   AI 回一句台词，并只给你的话打标签（语气、显出的品质）；好感怎么变由引擎规则决定（CC.speak），每幕最多两句。
   网站没接 AI（或本地打开页面）时不出现这个入口。 */
const TALK = { ai: false };

}
function talkBox(n, who) {
  const m = $("#menu"); m.replaceChildren(); m.hidden = false;
  const p = document.createElement("div"); p.className = "prompt"; p.textContent = ui("talk")(nameOf(who)); m.append(p);
  const f = document.createElement("form"); f.className = "talk";
  const inp = document.createElement("input"); inp.maxLength = 120; inp.placeholder = ui("talkHint"); inp.autocomplete = "off"; inp.enterKeyHint = "send";
  const send = document.createElement("button"); send.type = "submit"; send.textContent = ui("send");

  f.append(inp, send, back); m.append(f);
  f.onsubmit = async e => {

    inp.disabled = send.disabled = back.disabled = true; send.textContent = "…";
    const recent = V.log.slice(-10).map(l => (l.who ? l.who + "：" : "") + l.text);
    let out = null;
    try {
      // 和三国走同一条通道：流式 + 结构化输出（模型的回答一定是合法的 JSON），读最后的 done
      const r = await fetch("/api/sanguo", { method: "POST", headers: { "content-type": "application/json", accept: "application/x-ndjson" }, body: JSON.stringify({ game: "xichuan", phase: "express", task: "talk", lang: LANG, context: { node: n.id, target: who, text, vars: G.v, recent, memories: ((V.said || {})[who] || []).slice(-6) } }) });
      const body = r.ok ? await r.text() : "";
      for (const line of body.split("\n")) { try { const m = JSON.parse(line); if (m.type === "done" && m.output && typeof m.output.reply === "string") out = m.output; } catch {} }
    } catch {}

    if (!out) { load([mine, { op: "say", who: null, t: { zh: UI.zh.noReply, en: UI.en.noReply } }], `t:${n.id}`); return step(); }
    // 她记得你说过的话（之后的对话会带上）
    V.said = V.said || {}; (V.said[who] = V.said[who] || []).push(text.slice(0, 80)); if (V.said[who].length > 12) V.said[who].shift();
    CC.chat(CAMP, G);
    // 这句话是不是剧本里的某条“走向”（决裂、隐藏的门、承诺）：AI 认出来的为准，离线时按语气标签兜底；后果由规则决定
    const avail = CC.moves(CAMP, G).filter(m => m.to === who);
    let mv = out.move && avail.find(m => m.id === out.move);
    if (!mv) { const mm = CC.matchMove(CAMP, G, text, who, out.tone); if (mm && (mm.labels || []).includes(out.tone)) mv = mm; }
    const e2 = mv ? CC.move(CAMP, G, mv.id, text) : CC.speak(CAMP, G, out.tone || "flat", text, who, Array.isArray(out.values) ? out.values : []);
    const up = !!(e2 && e2.changes && e2.changes.some(c => c.var === `rel.${who}.intimacy` && c.to > c.from));
    const lines = [mine, { op: "say", who, t: { zh: out.reply, en: out.reply }, face: MOODFACE[out.mood] || "normal", heart: up }];
    if (mv) (mv.out || []).forEach(p => { if (!p.when || CC.evalCond(G, p.when)) lines.push({ op: "say", who: null, t: p.text }); });
    load(lines, `t:${n.id}`);

  setTimeout(() => inp.focus(), 50);
}

/* ---------- 2.5D：倾斜手机（电脑上移动鼠标），背景和 CG 按深度图错开，立绘是中间一层 ----------
   深度图在 art/depth/（越亮越近），由开源的 Depth Anything V2 Small 生成；没有深度图或浏览器不支持 WebGL 时，照常显示平面图。 */
const TILT = { on: store.get("tilt", true), x: 0, y: 0, tx: 0, ty: 0, base: null, asked: false };

const FX = { bg: new DepthLayer($("#bg"), .05), cg: new DepthLayer($("#cg"), .04) };
function askTilt() {                       // iPhone only lets a page read the tilt after a tap, and asks the player first
  const D = window.DeviceOrientationEvent;
  if (!TILT.asked && D && typeof D.requestPermission === "function") { TILT.asked = true; D.requestPermission().catch(() => {}); }
}
addEventListener("deviceorientation", e => {
  if (e.beta == null || e.gamma == null) return;
  const ang = (screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0;
  let gx = e.gamma, gy = e.beta;
  if (ang === 90) { gx = e.beta; gy = -e.gamma; } else if (ang === -90 || ang === 270) { gx = -e.beta; gy = e.gamma; }
  if (!TILT.base) TILT.base = { x: gx, y: gy };
  TILT.base.x += (gx - TILT.base.x) * .006; TILT.base.y += (gy - TILT.base.y) * .006;   // whatever angle you hold settles back to "front" after a few seconds

$("#stage").addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const r = $("#stage").getBoundingClientRect(); TILT.tx = clamp1(((e.clientX - r.left) / r.width) * 2 - 1); TILT.ty = clamp1(((e.clientY - r.top) / r.height) * 2 - 1);

(function fxLoop() {
  TILT.x += (TILT.tx - TILT.x) * .1; TILT.y += (TILT.ty - TILT.y) * .1;
  const x = TILT.on ? TILT.x : 0, y = TILT.on ? TILT.y : 0;
  FX.bg.draw(x, y); if (V && V.cg) FX.cg.draw(x, y);
  const st = $("#stage"); $("#sprites").style.transform = `translate3d(${(-x * .05 * .6 * st.clientWidth / 1.05).toFixed(1)}px, ${(-y * .05 * .35 * st.clientHeight / 1.05).toFixed(1)}px, 0)`;
  requestAnimationFrame(fxLoop);
})();
document.documentElement.lang = LANG; renderBar(); title();
window.__xc = { get G() { return G; }, get V() { return V; }, step, start };
