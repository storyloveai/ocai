ber who he used to be."}, "values": {"xiu": ["warmth", 1], "ji": ["trust", 1], "xin": ["trust", 1]}}, "gran": {"name": {"zh": "葛兰", "en": "Gran"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [1, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "葛兰·霍克：34 岁，旧港锚链酒吧的老板，术式世家霍克家被赶出门的长子，断剑的持有者。打架的人，话少，心里压着对父亲的事。", "en": "Gran Hawke: 34, owner of the Anchor Chain bar in the old harbor, the disowned eldest son of the Hawke spell-family, holder of the Broken Sword. A fighter, few words, his father heavy on his mind."}, "values": {"yong": ["esteem", 1], "xin": ["trust", 1], "shou": ["warmth", 1]}}, "sword": {"name": {"zh": "断剑", "en": "Broken Sword"}, "dims": {"warmth": [1, 0, 10], "trust": [0, 0, 10], "esteem": [1, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "断剑：遗器“断剑”的器灵，红发、皮夹克、小虎牙，爱喝朗姆，喝不醉。能斩断连结：术式、契约、因果。", "en": "Broken Sword: spirit of the relic, red hair, leather jacket, a sharp canine; loves rum and never gets drunk. She cuts connections: spells, contracts, causes."}, "values": {"yong": ["esteem", 1], "duo": ["esteem", 1]}}, "evelyn": {"name": {"zh": "伊芙琳", "en": "Evelyn"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [1, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "伊芙琳·冯·艾希：24 岁，艾希家的次女，荆棘冠的持有者。从来没有输过，父亲却选了姐姐当继承人。冷，准，把对手当成要评估的东西。", "en": "Evelyn von Eiche: 24, second daughter of the Eiche family, holder of the Thorn Crown. Has never lost; her father chose her sister as heir anyway. Cold, precise, sizes up opponents like goods."}, "values": {"duo": ["esteem", 1], "yong": ["esteem", 1]}}, "august": {"name": {"zh": "奥古斯特", "en": "August"}, "dims": {"warmth": [1, 0, 10], "trust": [1, 0, 10], "esteem": [1, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "奥古斯特·莱恩：60 岁上下，守秘局外勤监督官，干了四十一年，同事叫他“胶水”。守规矩，替普通人把魔法留下的痕迹补好。", "en": "August Lane: about 60, a field supervisor at the Secrecy Bureau for forty-one years; colleagues call him 'Glue'. Keeps the rules and patches over what magic leaves behind so ordinary people never see it."}, "values": {"xin": ["trust", 1], "shou": ["esteem", 1], "ji": ["warmth", 1]}}, "baiqiu": {"name": {"zh": "白秋", "en": "Bai Qiu"}, "dims": {"warmth": [0, 0, 10], "trust": [0, 0, 10], "esteem": [1, 0, 10]}, "original": true, "main": "trust", "persona": {"zh": "白秋：29 岁，在听潮茶楼三楼做情报生意，天平的持有者。银灰长发，木簪，旗袍式外套。天平拿走她做选择时的犹豫，所以她什么都决定得很快。", "en": "Bai Qiu: 29, deals information from the third floor of the Tidelistening Teahouse; holder of the Scales. Silver-grey hair, a wooden pin, a qipao-cut coat. The Scales take her hesitation, so she decides everything fast."}, "values": {"duo": ["esteem", 1], "xin": ["trust", 1], "xiu": ["warmth", 1]}}}, "dims": {}, "echoes": {}, "debts": {}, "chapters": [{"id": "p", "title": {"zh": "序章", "en": "Prologue"}, "intro": [{"text": {"zh": "维斯特林，钟楼。", "en": "Westerling, the clock tower."}}], "offer": 0}, {"id": "c1", "title": {"zh": "第一章 · 修灯的人", "en": "Chapter 1 · The Lamp-Mender"}, "intro": [{"text": {"zh": "第七次灰烬王冠之争，第一夜。", "en": "The seventh Ashen Crown war, night one."}}], "offer": 2}, {"id": "c2", "title": {"zh": "第二章 · 摩天轮下", "en": "Chapter 2 · Under the Ferris Wheel"}, "intro": [{"text": {"zh": "第二夜。北岸，旧海滨游乐园。", "en": "Night two. The north shore, the old seaside park."}}], "offer": 2}, {"id": "c3", "title": {"zh": "第三章 · 守秘局", "en": "Chapter 3 · The Secrecy Bureau"}, "intro": [{"text": {"zh": "第三天。凌晨两点，雨停了。", "en": "Day three. Two a.m.; the rain has stopped."}}], "offer": 2}], "nodes": {"p_tower": {"id": "p_tower", "chapter": "p", "kind": "main", "title": {"zh": "序章 · 第六十年的灰", "en": "Prologue · Ash of the Sixtieth Year"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "六十年前的十一月。维斯特林的钟楼顶上，有两个人。", "en": "November, sixty years ago. Two people stand at the top of Westerling's clock tower."}}], "choices": [{"id": "go", "type": "expression", "label": {"zh": "（翻开第一章）", "en": "(Turn to Chapter 1)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [], "script": []}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "clocktower"}, {"op": "say", "who": null, "t": {"zh": "六十年前的十一月。维斯特林的钟楼顶上，有两个人。", "en": "November, sixty years ago. Two people stand at the top of Westerling's clock tower."}}, {"op": "say", "who": null, "t": {"zh": "一个扎马尾的女孩，穿着一件很旧的毛衣。一个戴单片眼镜的年轻人，一直在说话：别去了。我们换一个办法。", "en": "A girl with a ponytail in an old sweater. A young man with a monocle who keeps talking: don't. We'll find another way."}}, {"op": "say", "who": null, "t": {"zh": "女孩没有回头。", "en": "The girl doesn't look back."}}, {"op": "say", "who": null, "t": {"zh": "钟楼上空亮起一顶灰色的冠冕。第二天早上，城里没有一个人记得她。", "en": "A grey crown lights the sky above the tower. By morning no one in the city remembers her."}}, {"op": "say", "who": null, "t": {"zh": "——六十年后。", "en": "—Sixty years later."}}, {"op": "say", "who": null, "t": {"zh": "同一座钟楼，一个撑黑伞的男人站在栏杆边，看着一张自己会走的棋盘。", "en": "The same tower. A man with a black umbrella stands at the rail, watching a chessboard that moves by itself."}}, {"op": "say", "who": null, "t": {"zh": "“第一盏灯，”他说，“今晚会亮。”", "en": "'The first lamp,' he says, 'lights tonight.'"}}]}, "c1_shop": {"id": "c1_shop", "chapter": "c1", "kind": "main", "title": {"zh": "林记修复 · 夜 22:40", "en": "Lin's Repairs · 22:40"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "维斯特林下雨的时候，整座城都像一块泡在水里的旧怀表。", "en": "When it rains in Westerling, the whole city is like an old pocket watch soaking in water."}}], "choices": [{"id": "tools", "type": "strategy", "label": {"zh": "把父亲留下的工具包也带上", "en": "Take Dad's old toolkit too"}, "out": [{"text": {"zh": "柜台底下那只帆布包，拉链已经不太好拉了。镊子、锉刀、焊锡、一卷黄铜丝。", "en": "The canvas bag under the counter; its zip sticks. Tweezers, files, solder, a roll of brass wire."}}], "effects": [{"set": "flag.tools", "to": true}, {"add": "light", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "柜台底下那只帆布包，拉链已经不太好拉了。镊子、锉刀、焊锡、一卷黄铜丝。", "en": "The canvas bag under the counter; its zip sticks. Tweezers, files, solder, a roll of brass wire."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "修东西之前，先把工具摆齐。有人这么教过我。", "en": "Before you fix anything, lay out your tools. Someone taught me that."}}], "values": ["xiu"]}, {"id": "go", "type": "expression", "label": {"zh": "什么都不带，现在就去", "en": "Take nothing; go now"}, "out": [{"text": {"zh": "再想下去，我又要等一个十一年。", "en": "If I think any longer, I'll wait another eleven years."}}], "effects": [], "script": [{"op": "say", "who": "me", "think": true, "t": {"zh": "再想下去，我又要等一个十一年。", "en": "If I think any longer, I'll wait another eleven years."}}], "values": ["yong"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "shop_rain"}, {"op": "say", "who": null, "t": {"zh": "维斯特林下雨的时候，整座城都像一块泡在水里的旧怀表。", "en": "When it rains in Westerling, the whole city is like an old pocket watch soaking in water."}}, {"op": "say", "who": "me", "t": {"zh": "好了。换了两个电容，调谐轮的齿也补了。别再拿它砸核桃。", "en": "Done. Two new capacitors, and I patched the tuning wheel. Stop cracking walnuts with it."}}, {"op": "say", "who": null, "t": {"zh": "老头抱着收音机出了门。铺子重新安静下来，只剩满墙待修的东西。", "en": "The old man carries his radio out. The shop goes quiet, just walls of things waiting to be fixed."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "坏掉的东西不会骗人。哪里断了，哪里锈了，你只要认真看，它就全告诉你。不像人。", "en": "Broken things don't lie. Where it snapped, where it rusted—look hard and it tells you everything. Not like people."}}, {"op": "cg", "id": "cg_photo"}, {"op": "say", "who": null, "t": {"zh": "抽屉最里面有一张照片：十五年前的港口，一个缺了门牙的小女孩举着手去够海鸥。她身边，是一片空白。", "en": "At the back of the drawer, a photo: the harbor fifteen years ago, a gap-toothed girl reaching for a gull. Beside her, a blank."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "我记得那里站着她。蓝外套，袖口一块补丁。她叫林遥。可这个世界上，除了我，没有一个人记得。", "en": "I remember she stood there. A blue coat, a patch on the cuff. Her name was Lin Yao. And no one in this world remembers her but me."}}, {"op": "say", "who": null, "t": {"zh": "照片背面是母亲的字：栖栖，如果有一天你发现只有你还记得我，去祖宅的地下室。把那盏灯修好。", "en": "On the back, Mum's handwriting: Qiqi, if one day you find you're the only one who remembers me, go to the basement of the old house. Fix the lamp."}}, {"op": "cg", "id": null}, {"op": "say", "who": "me", "think": true, "t": {"zh": "十一年了，我一次也没有去过。", "en": "Eleven years, and I've never gone."}}]}, "s1_bar": {"id": "s1_bar", "chapter": "c1", "kind": "side", "title": {"zh": "旧港 · 锚链酒吧（葛兰）", "en": "Old harbor · the Anchor Chain (Gran)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "葛兰·霍克这辈子写坏过三百一十七张符纸。是他父亲替他数的。", "en": "Gran Hawke has botched three hundred and seventeen talismans in his life. His father counted them for him."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_gran", "to": true}], "script": [], "values": ["ji"]}], "salience": 2, "order": 0, "script": [{"op": "bg", "id": "bar"}, {"op": "say", "who": null, "t": {"zh": "葛兰·霍克这辈子写坏过三百一十七张符纸。是他父亲替他数的。", "en": "Gran Hawke has botched three hundred and seventeen talismans in his life. His father counted them for him."}}, {"op": "show", "who": "sword", "face": "smile", "at": "right"}, {"op": "say", "who": "sword", "t": {"zh": "葛兰——再来一杯！", "en": "Gran—another!"}, "face": "smile"}, {"op": "show", "who": "gran", "face": "normal", "at": "left"}, {"op": "say", "who": "gran", "t": {"zh": "你今晚已经喝了七杯了。", "en": "That's seven tonight."}}, {"op": "say", "who": "sword", "t": {"zh": "我是剑，喝不醉。喝的时候，我会觉得自己像个活人。", "en": "I'm a sword. I don't get drunk. When I drink, I feel like I'm alive."}}, {"op": "say", "who": null, "t": {"zh": "十年前，他在码头的淤泥里捞起一截断剑。她醒了一半，说：等到第六十年，帮我一个忙。", "en": "Ten years ago he pulled a broken sword out of the harbor mud. She half-woke and said: in the sixtieth year, do me a favor."}}, {"op": "say", "who": "sword", "t": {"zh": "灯亮了。老城区，坡顶。", "en": "A lamp just lit. Old town, top of the hill."}, "face": "normal"}, {"op": "say", "who": "gran", "t": {"zh": "……那就去拿。", "en": "…Then let's go take it."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "他不是为了自己要遗器。是为了她。", "en": "He doesn't want relics for himself. He wants them for her."}}], "cast": [{"id": "gran"}, {"id": "sword"}]}, "s1_eiche": {"id": "s1_eiche", "chapter": "c1", "kind": "side", "title": {"zh": "填海新区 · 艾希大厦顶层（伊芙琳）", "en": "The reclaimed district · top of the Eiche Tower (Evelyn)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "伊芙琳·冯·艾希从来没有输过。可二十岁那年，父亲宣布的继承人是姐姐。", "en": "Evelyn von Eiche has never lost. Yet when she was twenty, her father named her sister heir."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_evelyn", "to": true}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "eiche_top"}, {"op": "say", "who": null, "t": {"zh": "伊芙琳·冯·艾希从来没有输过。可二十岁那年，父亲宣布的继承人是姐姐。", "en": "Evelyn von Eiche has never lost. Yet when she was twenty, her father named her sister heir."}}, {"op": "show", "who": "evelyn", "face": "normal", "at": "center"}, {"op": "say", "who": "evelyn", "t": {"zh": "第一盏灯亮了。老城区，林家。一个没落了五十年的家族。", "en": "The first lamp is lit. Old town, the Lin house. A family fallen for fifty years."}}, {"op": "say", "who": null, "t": {"zh": "她身后，一个黑发的男人捧着一本没有字的书。他念一个字，她手里那顶荆棘冠就亮一下。", "en": "Behind her, a dark-haired man holds a book with no words. Each word he reads makes the thorn crown in her hand glow."}}, {"op": "say", "who": "evelyn", "t": {"zh": "正好拿来开刀。第一个倒下的人，要让所有人都看清楚。", "en": "Then she's the one to start with. The first to fall should be seen by everyone."}, "face": "serious"}, {"op": "say", "who": null, "t": {"zh": "她戴上荆棘冠。尖刺扎进额角，渗出一滴血。她没有擦。", "en": "She puts on the crown. A thorn pricks her temple; a drop of blood runs down. She doesn't wipe it."}}], "cast": [{"id": "evelyn"}]}, "c1_basement": {"id": "c1_basement", "chapter": "c1", "kind": "main", "title": {"zh": "林家祖宅 · 地下室", "en": "The Lin house · the basement"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "客厅里，墙上一排相框全是空的。玻璃完好，里面只有发黄的衬纸。", "en": "In the parlor every frame on the wall is empty. The glass is intact; only yellowed backing inside."}}], "choices": [{"id": "accept", "type": "dilemma", "label": {"zh": "“我叫林栖。条件我接受。”", "en": "'My name is Lin Qi. I accept.'"}, "out": [{"text": {"zh": "黄铜的把手在我掌心发烫，像一颗心脏。白色的光顺着手臂往上爬。", "en": "The brass handle burns in my palm like a heart. White light climbs my arm."}}], "effects": [{"set": "flag.contract", "to": true}, {"set": "flag.saw_initials", "to": true}, {"add": "rel.lamp.trust", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "黄铜的把手在我掌心发烫，像一颗心脏。白色的光顺着手臂往上爬。", "en": "The brass handle burns in my palm like a heart. White light climbs my arm."}}, {"op": "say", "who": "lamp", "t": {"zh": "契约成立。欢迎来到灰烬王冠之争，林栖。", "en": "The pact is made. Welcome to the Ashen Crown war, Lin Qi."}}, {"op": "say", "who": null, "t": {"zh": "拱顶整块塌了下来。我把灯往上一举——光像一把伞撑开，碎石倒着飞了回去。", "en": "The vault caves in. I lift the lamp—light opens like an umbrella, and the rubble flies back up."}}], "values": ["yong"]}, {"id": "refuse", "type": "dilemma", "label": {"zh": "“我不跟你做这种交易。”", "en": "'I won't make that deal.'"}, "out": [{"text": {"zh": "……那你今晚会死的。", "en": "…Then you die tonight."}}], "effects": [{"set": "flag.dead_refuse", "to": true}], "script": [{"op": "say", "who": "lamp", "t": {"zh": "……那你今晚会死的。", "en": "…Then you die tonight."}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "拱顶塌下来的时候，我抱着那盏没有亮的灯，想起照片背面那行字。", "en": "When the vault comes down, I'm holding the unlit lamp, thinking of the words on the back of the photo."}}], "values": ["shou"], "ends": true}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "oldhouse"}, {"op": "say", "who": null, "t": {"zh": "客厅里，墙上一排相框全是空的。玻璃完好，里面只有发黄的衬纸。", "en": "In the parlor every frame on the wall is empty. The glass is intact; only yellowed backing inside."}}, {"op": "say", "who": null, "t": {"zh": "地下室的门上，有一道粉笔画的符号：一个圆，里面一簇小小的火苗。我碰了一下，它亮了，门自己开了。", "en": "On the basement door, a chalk sign: a circle with a small flame inside. I touch it; it glows; the door opens."}}, {"op": "bg", "id": "basement"}, {"op": "say", "who": null, "t": {"zh": "石砌的拱顶，四壁的书架，长桌上的天平和坩埚。长桌尽头，放着一盏摔坏的提灯。", "en": "A stone vault, shelves on every wall, scales and crucibles on a long table. At its end, a broken lamp."}}, {"op": "say", "who": null, "t": {"zh": "我把父亲的工具一样一样摆出来，像在手术台边摆器械。", "en": "I lay out Dad's tools one by one, like instruments beside an operating table."}, "when": {"v": "flag.tools", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "灯座底下刻着两个很潦草的字母：M. & S.", "en": "Scratched under the base, two scrawled letters: M. & S."}}, {"op": "say", "who": null, "t": {"zh": "磨锈，掰正，点焊，换玻璃。最后是灯芯。我捏着那一小截焦黑的棉线，闭上眼睛——", "en": "Sand the rust, straighten the frame, solder, new glass. Last, the wick. I pinch the scorched stub and close my eyes—"}}, {"op": "say", "who": null, "t": {"zh": "有什么东西在灯的深处醒了，一把抓住我，往里拉。成千上万盏灯，浮在黑暗里。", "en": "Something deep in the lamp wakes and pulls me in. Thousands of lamps, floating in the dark."}}, {"op": "cg", "id": "cg_lamp_lit"}, {"op": "show", "who": "lamp", "face": "smile", "at": "center"}, {"op": "say", "who": "lamp", "t": {"zh": "你修得真好。上一次有人把我修得这么好，还是很久以前的事。", "en": "You mended me beautifully. The last time anyone did, it was a long time ago."}, "face": "smile"}, {"op": "say", "who": "lamp", "t": {"zh": "我是这盏灯。十二件遗器之一，每六十年醒一次。今年是第六十年。", "en": "I'm this lamp. One of twelve relics. I wake every sixty years. This is the sixtieth."}}, {"op": "say", "who": "lamp", "t": {"zh": "谁先把五件握在手里，谁就能打开灰烬王冠，改写世界的一条规则。比如，让某个人从所有人的记忆里——", "en": "Whoever holds five first can open the Ashen Crown and rewrite one rule of the world. Say, make someone vanish from everyone's—"}}, {"op": "cg", "id": null}, {"op": "say", "who": "me", "t": {"zh": "……消失。", "en": "…memory."}}, {"op": "say", "who": "lamp", "t": {"zh": "和我结契，我借你力量。你每一次用尽全力，我就从你那里拿走一段记忆。拿哪一段，由我挑。", "en": "Bind yourself to me and I'll lend you power. Each time you go all out, I take one memory. I choose which."}, "face": "serious"}, {"op": "say", "who": "lamp", "t": {"zh": "我只拿温暖的那些。", "en": "I only take the warm ones."}}, {"op": "say", "who": null, "t": {"zh": "拱顶闷响了一声。石缝里漏下一线冷光。上面有个女人在笑：找到了——小灯笼。", "en": "The vault booms. Cold light leaks through a crack. Above, a woman laughs: found you—little lantern."}}], "cast": [{"id": "lamp"}]}, "c1_fight": {"id": "c1_fight", "chapter": "c1", "kind": "main", "title": {"zh": "地下室 · 断剑", "en": "The basement · the Broken Sword"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "皮靴踩着碎木头下楼。先下来的是一个很高的男人，络腮胡，酒保背心，两只拳头缠着绷带。", "en": "Boots on splintered wood. First down is a very tall man: beard, bartender's vest, both fists taped."}}], "choices": [{"id": "reconnect", "type": "dilemma", "label": {"zh": "看清断口，把线接回去——全力（会交出一段记忆）", "en": "Find the break and join it—all out (costs a memory)"}, "out": [{"text": {"zh": "——接上！", "en": "—Reconnect!"}}], "effects": [{"set": "mem.ride", "to": false}, {"add": "memories", "by": -1}, {"add": "light", "by": 1}, {"set": "flag.met_gran", "to": true}, {"add": "rel.gran.esteem", "by": 1}], "script": [{"op": "cg", "id": "cg_reconnect"}, {"op": "say", "who": "me", "t": {"zh": "——接上！", "en": "—Reconnect!"}}, {"op": "say", "who": null, "t": {"zh": "灯火炸开。有什么东西从我身体里被抽走了，很轻，很快，像风吹走一片叶子。", "en": "Light bursts. Something is drawn out of me, light and quick, like wind taking a leaf."}}, {"op": "say", "who": null, "t": {"zh": "一个夏天的下午。院子里的梧桐树，一辆天蓝色的小自行车。有个人在后面扶着车座跟着我跑……那个人是谁？", "en": "A summer afternoon. The plane tree, a little sky-blue bike. Someone running behind, holding the seat… who was it?"}}, {"op": "say", "who": "lamp", "t": {"zh": "第一段。学骑车的下午。我收下了。", "en": "The first. The afternoon you learned to ride. I'll keep it."}, "forget": true}, {"op": "cg", "id": null}, {"op": "say", "who": null, "t": {"zh": "断剑的刃停在我手腕上方一寸，被一层白光挡住了。", "en": "The blade stops an inch above my wrist, held by a sheet of white light."}}, {"op": "say", "who": "gran", "t": {"zh": "第一次就舍得交这么好的东西。小姑娘，你很想赢啊。明晚十二点，海滨游乐园，摩天轮底下。", "en": "Giving up something that good your first time. You really want to win. Tomorrow at midnight, the seaside park, under the Ferris wheel."}, "face": "serious"}], "values": ["yong"]}, {"id": "talk", "type": "strategy", "label": {"zh": "“你不是为了自己要灯。你是为了她。”", "en": "'You don't want the lamp for yourself. You want it for her.'"}, "out": [{"text": {"zh": "刃停在半空。红发的女人愣了一下，回头看葛兰。", "en": "The blade halts in midair. The red-haired woman freezes and looks back at Gran."}}], "effects": [{"set": "flag.met_gran", "to": true}, {"set": "flag.talked_down", "to": true}, {"add": "rel.gran.trust", "by": 2}, {"add": "rel.lamp.esteem", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "刃停在半空。红发的女人愣了一下，回头看葛兰。", "en": "The blade halts in midair. The red-haired woman freezes and looks back at Gran."}}, {"op": "say", "who": "gran", "t": {"zh": "……你怎么知道？", "en": "…How do you know that?"}, "face": "surprised"}, {"op": "say", "who": "me", "t": {"zh": "你看她的眼神，和我看那张照片的眼神一样。", "en": "You look at her the way I look at a photo."}}, {"op": "say", "who": "sword", "t": {"zh": "哈。被一个修收音机的看穿了。", "en": "Ha. Seen through by a radio repairer."}, "face": "smile"}, {"op": "say", "who": "gran", "t": {"zh": "今晚不打了。明晚十二点，海滨游乐园，摩天轮底下。我们好好打一场。", "en": "No fight tonight. Tomorrow at midnight, the seaside park, under the Ferris wheel. We'll do it properly."}}, {"op": "say", "who": "lamp", "t": {"zh": "……你没用全力。我什么都没拿。", "en": "…You didn't go all out. I took nothing."}, "face": "surprised"}], "values": ["xin"], "when": {"v": "flag.know_gran", "op": "==", "val": true}}, {"id": "shield", "type": "strategy", "label": {"zh": "不接线，把灯横过来硬挡", "en": "Don't reconnect; block with the lamp itself"}, "out": [{"text": {"zh": "断剑砍在灯上。灯没有碎，碎的是灯和我之间剩下的那一点连结。", "en": "The sword strikes the lamp. The lamp doesn't break; what's left of the link between us does."}}], "effects": [{"set": "flag.dead_cut", "to": true}, {"set": "flag.met_gran", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "断剑砍在灯上。灯没有碎，碎的是灯和我之间剩下的那一点连结。", "en": "The sword strikes the lamp. The lamp doesn't break; what's left of the link between us does."}}, {"op": "say", "who": "lamp", "t": {"zh": "林栖——", "en": "Lin Qi—"}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "光灭了。地下室重新黑下来，只剩下皮靴踩在碎木头上的声音。", "en": "The light goes out. The basement is dark again, only boots on splintered wood."}}], "values": ["shou"], "ends": true}], "salience": 0, "order": 3, "script": [{"op": "bg", "id": "basement"}, {"op": "say", "who": null, "t": {"zh": "皮靴踩着碎木头下楼。先下来的是一个很高的男人，络腮胡，酒保背心，两只拳头缠着绷带。", "en": "Boots on splintered wood. First down is a very tall man: beard, bartender's vest, both fists taped."}}, {"op": "show", "who": "gran", "face": "normal", "at": "left"}, {"op": "say", "who": "gran", "t": {"zh": "葛兰·霍克。在码头开酒吧，偶尔接点打架的活。", "en": "Gran Hawke. Run a bar by the docks; take the odd fighting job."}}, {"op": "show", "who": "sword", "face": "smile", "at": "right"}, {"op": "say", "who": "sword", "t": {"zh": "嗨，小灯笼。这就是你新挑的主人？一个修收音机的？", "en": "Hi, little lantern. This is your new holder? A radio repairer?"}, "face": "smile"}, {"op": "say", "who": "gran", "t": {"zh": "把灯交出来，你回去修你的收音机，忘了今晚的事。", "en": "Hand over the lamp. Go back to your radios and forget tonight."}}, {"op": "say", "who": "me", "t": {"zh": "不。", "en": "No."}}, {"op": "say", "who": "gran", "t": {"zh": "……断剑。", "en": "…Sword."}, "face": "serious"}, {"op": "say", "who": null, "t": {"zh": "红发的女人一步跨出来，半截断剑划出一道冷白色的弧线。我手臂上的光纹一暗——有一根看不见的线被剪断了。", "en": "The red-haired woman steps out; half a sword draws a cold white arc. The light-lines on my arm dim—an invisible thread has been cut."}}, {"op": "say", "who": "lamp", "t": {"zh": "她能斩断连结。我们之间的线，她刚刚砍了一刀。", "en": "She cuts connections. She just cut ours."}, "face": "battle"}, {"op": "say", "who": null, "t": {"zh": "断剑已经到了眼前。", "en": "The blade is already in my face."}}], "cast": [{"id": "gran"}, {"id": "sword"}, {"id": "lamp"}]}, "c2_shop": {"id": "c2_shop", "chapter": "c2", "kind": "main", "title": {"zh": "林记修复 · 第二天 21:15", "en": "Lin's Repairs · day two, 21:15"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "你知道我为什么只拿温暖的记忆吗？因为温暖的最重。只有最重的东西，才换得来最强的力量。", "en": "Do you know why I only take warm memories? Because warm ones weigh the most. Only the heaviest buys the strongest power."}}], "choices": [{"id": "scout", "type": "strategy", "label": {"zh": "先去游乐园看场地", "en": "Go to the park early and look at the ground"}, "out": [{"text": {"zh": "锈死的过山车，倒在地上的碰碰车，停摆的旋转木马，还有正中间那座巨大的摩天轮。", "en": "A rusted coaster, overturned bumper cars, a stalled carousel, and in the middle, a huge Ferris wheel."}}], "effects": [{"set": "flag.scouted", "to": true}, {"add": "light", "by": 1}], "script": [{"op": "bg", "id": "park_gate"}, {"op": "say", "who": null, "t": {"zh": "锈死的过山车，倒在地上的碰碰车，停摆的旋转木马，还有正中间那座巨大的摩天轮。", "en": "A rusted coaster, overturned bumper cars, a stalled carousel, and in the middle, a huge Ferris wheel."}}, {"op": "say", "who": null, "t": {"zh": "我用指尖碰了碰它的底座。四十八个车厢，三百八十四根辐条，几千颗螺栓——全都连在中间那根轴上。", "en": "I touch its base with a fingertip. Forty-eight cars, three hundred and eighty-four spokes, thousands of bolts—all tied to the hub at the center."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "修东西之前，先看结构。有人这么教过我。", "en": "Before you fix anything, read the structure. Someone taught me that."}}, {"op": "say", "who": "lamp", "t": {"zh": "这个习惯不错。", "en": "Good habit."}, "face": "smile"}], "values": ["xiu"]}, {"id": "album", "type": "expression", "label": {"zh": "在铺子里翻父亲的旧相册", "en": "Stay and go through Dad's old albums"}, "out": [{"text": {"zh": "塑料封皮一翻就掉渣。梧桐树，竹椅，搭在椅背上的毛巾。没有自行车，也没有扶车座的人。", "en": "The plastic covers crumble. A plane tree, a bamboo chair, a towel over its back. No bicycle, no one holding a seat."}}], "effects": [{"set": "flag.album", "to": true}, {"add": "rel.lamp.warmth", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "塑料封皮一翻就掉渣。梧桐树，竹椅，搭在椅背上的毛巾。没有自行车，也没有扶车座的人。", "en": "The plastic covers crumble. A plane tree, a bamboo chair, a towel over its back. No bicycle, no one holding a seat."}}, {"op": "say", "who": "lamp", "t": {"zh": "别看了。你只要记住：那个人，在你最需要的时候，帮了你。", "en": "Stop looking. Just remember: that person helped you when you needed it most."}, "face": "sad"}], "values": ["ji"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "shop_day"}, {"op": "say", "who": null, "t": {"zh": "我花了一整天，想想起那个下午。照片上的院子里，竹椅旁边，又是一片空白。", "en": "I spent the whole day trying to remember that afternoon. In the photo of the yard, beside the bamboo chair, another blank."}, "when": {"v": "mem.ride", "op": "!=", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "扶车座的人是谁？我连这个都不知道了。", "en": "Who held the seat? I don't even know that any more."}, "when": {"v": "mem.ride", "op": "!=", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "昨晚我什么都没交出去。可提灯说，下一次不会这么好运。", "en": "Last night I gave nothing up. But the Lamp says I won't be this lucky next time."}, "when": {"v": "mem.ride", "op": "==", "val": true}}, {"op": "show", "who": "lamp", "face": "normal", "at": "center"}, {"op": "say", "who": "lamp", "t": {"zh": "你知道我为什么只拿温暖的记忆吗？因为温暖的最重。只有最重的东西，才换得来最强的力量。", "en": "Do you know why I only take warm memories? Because warm ones weigh the most. Only the heaviest buys the strongest power."}}, {"op": "say", "who": "lamp", "t": {"zh": "离十二点还有三个小时。", "en": "Three hours until midnight."}}], "cast": [{"id": "lamp"}]}, "s2_light": {"id": "s2_light", "chapter": "c2", "kind": "side", "title": {"zh": "北岸旧灯塔顶（伊芙琳）", "en": "Top of the old lighthouse (Evelyn)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "一公里外，伊芙琳放下了望远镜。", "en": "A kilometer away, Evelyn lowers her binoculars."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_cut", "to": true}, {"set": "flag.know_evelyn", "to": true}], "script": [], "values": ["ji"]}], "salience": 2, "order": 0, "script": [{"op": "bg", "id": "lighthouse"}, {"op": "show", "who": "evelyn", "face": "serious", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "一公里外，伊芙琳放下了望远镜。", "en": "A kilometer away, Evelyn lowers her binoculars."}}, {"op": "say", "who": "evelyn", "t": {"zh": "她在等。她接得比他砍得快，只要不停地接，他就永远砍不到她。", "en": "She's waiting. She mends faster than he cuts; as long as she keeps mending, he never lands a blow."}}, {"op": "say", "who": "evelyn", "t": {"zh": "所以葛兰会换个砍法。他要砍摩天轮。", "en": "So Gran will change what he cuts. He'll cut the Ferris wheel."}}, {"op": "say", "who": "evelyn", "t": {"zh": "几十个车厢，几千颗螺栓，全靠中间那根轴连着。断剑一刀斩开所有的连结——除非她全力出手，否则修不过来。", "en": "Dozens of cars, thousands of bolts, all held by the hub. One stroke severs every link—she can't mend it unless she goes all out."}}, {"op": "say", "who": null, "t": {"zh": "诗人在空白的书上写了一个红色的字。", "en": "The poet writes one red word on the blank page."}}], "cast": [{"id": "evelyn"}]}, "s2_gran": {"id": "s2_gran", "chapter": "c2", "kind": "side", "title": {"zh": "摩天轮下（葛兰）", "en": "Under the wheel (Gran)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "葛兰坐在生锈的长椅上，旁边两瓶啤酒，一瓶开着，一瓶没开。", "en": "Gran sits on a rusted bench, two beers beside him, one open, one not."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.gran_plan", "to": true}, {"add": "rel.gran.esteem", "by": 1}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "ferris"}, {"op": "show", "who": "gran", "face": "normal", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "葛兰坐在生锈的长椅上，旁边两瓶啤酒，一瓶开着，一瓶没开。", "en": "Gran sits on a rusted bench, two beers beside him, one open, one not."}}, {"op": "say", "who": "sword", "t": {"zh": "那小姑娘能把断的东西接回去。我砍一刀，她接一刀。", "en": "That girl joins whatever's cut. I cut, she joins."}}, {"op": "say", "who": "gran", "t": {"zh": "那就砍她接不过来的东西。", "en": "Then cut something she can't join in time."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "他不想要她的命。他想看那盏灯的底牌。", "en": "He doesn't want her life. He wants to see the lamp's last card."}}], "cast": [{"id": "gran"}]}, "c2_duel": {"id": "c2_duel", "chapter": "c2", "kind": "main", "title": {"zh": "北岸 · 摩天轮下 23:40", "en": "North shore · under the wheel, 23:40"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "来早了。还有十八分钟。喝吗？", "en": "You're early. Eighteen minutes. Beer?"}}], "choices": [{"id": "block", "type": "strategy", "label": {"zh": "抢先一步，挡在摩天轮的中心轴前面", "en": "Get there first and stand in front of the hub"}, "out": [{"text": {"zh": "我比他先到。我背靠着那根轴，把灯举在胸前。", "en": "I get there first. Back to the hub, lamp at my chest."}}], "effects": [{"set": "flag.blocked_cut", "to": true}, {"add": "rel.gran.esteem", "by": 2}, {"add": "rel.gran.trust", "by": 1}, {"add": "light", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "我比他先到。我背靠着那根轴，把灯举在胸前。", "en": "I get there first. Back to the hub, lamp at my chest."}}, {"op": "say", "who": "me", "t": {"zh": "你要砍它，就先砍我。可你不想要我的命，对吧？", "en": "If you cut it, you cut me first. And you don't want my life, do you?"}}, {"op": "say", "who": "gran", "t": {"zh": "……你知道我要砍什么。", "en": "…You knew what I'd cut."}, "face": "surprised"}, {"op": "say", "who": "sword", "t": {"zh": "哈。被看穿两次了，葛兰。", "en": "Ha. Seen through twice now, Gran."}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "剑尖停在我胸前三寸。他收了手。", "en": "The point stops three inches from my chest. He pulls back."}}], "values": ["yong"], "when": {"v": "flag.know_cut", "op": "==", "val": true}}, {"id": "hold", "type": "strategy", "label": {"zh": "守住，等他露出破绽", "en": "Hold, and wait for an opening"}, "out": [{"text": {"zh": "我一直接，一直退。他一直砍。然后他转过身，朝摩天轮冲过去。", "en": "I keep joining, keep backing away. He keeps cutting. Then he turns and charges the wheel."}}], "effects": [{"add": "light", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "我一直接，一直退。他一直砍。然后他转过身，朝摩天轮冲过去。", "en": "I keep joining, keep backing away. He keeps cutting. Then he turns and charges the wheel."}}], "values": ["shou"]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "ferris"}, {"op": "show", "who": "gran", "face": "normal", "at": "left"}, {"op": "say", "who": "gran", "t": {"zh": "来早了。还有十八分钟。喝吗？", "en": "You're early. Eighteen minutes. Beer?"}}, {"op": "say", "who": "me", "t": {"zh": "打完再说。", "en": "After."}}, {"op": "say", "who": "gran", "t": {"zh": "也是。不管谁赢。", "en": "Fair. Whoever wins."}}, {"op": "say", "who": "gran", "t": {"zh": "昨晚那句话，我想了一整天。今天还是要打。", "en": "I thought about what you said all day. We still fight."}, "face": "serious", "when": {"v": "flag.talked_down", "op": "==", "val": true}}, {"op": "show", "who": "sword", "face": "battle", "at": "right"}, {"op": "say", "who": null, "t": {"zh": "他动了。块头大，却快得像一辆没开灯的货车。断剑横扫，铁栏杆一节一节散开——不是被切断，是“连结”没了。", "en": "He moves. Big, but fast as an unlit truck. The Sword sweeps; the railings come apart—not cut, their connections simply gone."}}, {"op": "say", "who": null, "t": {"zh": "我蹲下去，手按在地上。断开的栏杆往回长。", "en": "I crouch, palm to the ground. The severed railings grow back."}}, {"op": "say", "who": "sword", "t": {"zh": "她接得比昨天还快。", "en": "She's joining faster than yesterday."}}, {"op": "say", "who": null, "t": {"zh": "葛兰的目光越过我，落在我身后那座摩天轮上。", "en": "Gran's eyes go past me, to the Ferris wheel at my back."}}], "cast": [{"id": "gran"}, {"id": "sword"}, {"id": "lamp"}]}, "c2_wheel": {"id": "c2_wheel", "chapter": "c2", "kind": "main", "title": {"zh": "摩天轮下 · 断剑——斩", "en": "Under the wheel · Sword—cut"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "choices": [{"id": "full", "type": "dilemma", "label": {"zh": "“全部……修好！”——全力（会交出一段记忆）", "en": "'Mend—all of it!'—all out (costs a memory)"}, "out": [{"text": {"zh": "灯火炸开，像一个太阳。四千六百个断口在光里一颗一颗地亮起来，又熄灭。下坠的车厢停在了半空。", "en": "The light bursts like a sun. Four thousand six hundred breaks light up one by one, then go dark. The falling cars stop in midair."}}], "effects": [{"set": "mem.praise", "to": false}, {"add": "memories", "by": -1}, {"add": "light", "by": 1}, {"add": "notice", "by": 2}, {"set": "flag.wheel_full", "to": true}, {"add": "rel.gran.esteem", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "灯火炸开，像一个太阳。四千六百个断口在光里一颗一颗地亮起来，又熄灭。下坠的车厢停在了半空。", "en": "The light bursts like a sun. Four thousand six hundred breaks light up one by one, then go dark. The falling cars stop in midair."}}, {"op": "say", "who": null, "t": {"zh": "那种被抽走的感觉，比昨天更重。台灯下拆开的闹钟。它重新走起来的时候，一只带着机油味的大手揉了揉我的头。“栖栖，你的手真巧。”", "en": "The feeling of being emptied, heavier than yesterday. An alarm clock in pieces under a desk lamp. When it ticks again, a big hand smelling of machine oil ruffles my hair. 'Qiqi, your hands are so clever.'"}}, {"op": "say", "who": null, "t": {"zh": "那天晚上是什么时候？父亲说了什么来着？", "en": "When was that night? What did Dad say?"}}, {"op": "say", "who": "lamp", "t": {"zh": "第二段。第一次被父亲夸手巧的晚上。我收下了。", "en": "The second. The night your father first praised your hands. I'll keep it."}, "forget": true}, {"op": "cg", "id": "cg_wheel"}, {"op": "say", "who": null, "t": {"zh": "然后，摩天轮开始转了。没有电，它就那样自己慢慢地转了起来。", "en": "Then the wheel starts to turn. No power at all; it simply turns, slowly, on its own."}}, {"op": "say", "who": null, "t": {"zh": "那一下的光，整个北岸都看见了。海湾对面的渔船上，有人举起了手机。", "en": "The whole north shore saw that flash. On a fishing boat across the bay, someone raised a phone."}}], "values": ["yong"], "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"id": "hub", "type": "strategy", "label": {"zh": "只修中心轴——它是所有连结的根", "en": "Mend only the hub—it is the root of every link"}, "out": [{"text": {"zh": "我想起下午碰过的那根轴。所有的辐条、所有的车厢，都是从它那里伸出去的。", "en": "I remember the hub I touched this afternoon. Every spoke, every car, reaches out from there."}}], "effects": [{"set": "flag.hub_only", "to": true}, {"add": "light", "by": 1}, {"add": "notice", "by": 1}, {"add": "rel.lamp.esteem", "by": 1}, {"add": "rel.gran.esteem", "by": 2}], "script": [{"op": "say", "who": null, "t": {"zh": "我想起下午碰过的那根轴。所有的辐条、所有的车厢，都是从它那里伸出去的。", "en": "I remember the hub I touched this afternoon. Every spoke, every car, reaches out from there."}}, {"op": "say", "who": "me", "t": {"zh": "不用修四千六百个。修一个就够了。", "en": "I don't need to mend four thousand six hundred. Just one."}}, {"op": "say", "who": null, "t": {"zh": "白光只亮了一瞬，落在轴心上。轴想起了自己，辐条就想起了轴，车厢就想起了辐条。一个接一个，像一排倒回去的骨牌。", "en": "The light flashes once, onto the hub. The hub remembers itself; the spokes remember the hub; the cars remember the spokes. One by one, like dominoes falling backward."}}, {"op": "say", "who": "lamp", "t": {"zh": "……你没用全力。我什么都没拿。", "en": "…You didn't go all out. I took nothing."}, "face": "surprised"}, {"op": "cg", "id": "cg_wheel"}, {"op": "say", "who": null, "t": {"zh": "摩天轮慢慢地转了起来。", "en": "The wheel begins, slowly, to turn."}}], "values": ["xiu"], "when": {"any": [{"v": "flag.scouted", "op": "==", "val": true}, {"v": "flag.blocked_cut", "op": "==", "val": true}]}}, {"id": "dive", "type": "strategy", "label": {"zh": "扑进旁边的排水沟里躲开", "en": "Dive into the drainage ditch"}, "out": [{"text": {"zh": "我扑了出去。车厢砸下来的声音，像一整座城一起塌了。", "en": "I throw myself aside. The cars crash down like a whole city collapsing."}}], "effects": [{"set": "flag.dead_wheel", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "我扑了出去。车厢砸下来的声音，像一整座城一起塌了。", "en": "I throw myself aside. The cars crash down like a whole city collapsing."}}, {"op": "say", "who": null, "t": {"zh": "等我爬起来，腰上的灯不见了。葛兰站在废墟上，手里提着它。", "en": "When I climb out, the lamp is gone from my belt. Gran stands on the wreckage, holding it."}}], "values": ["shou"], "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}, "ends": true}], "salience": 0, "order": 3, "script": [{"op": "bg", "id": "ferris"}, {"op": "cg", "id": "cg_cut", "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "say", "who": "gran", "t": {"zh": "断剑——", "en": "Sword—"}, "face": "battle", "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "say", "who": "sword", "t": {"zh": "——斩！", "en": "—cut!"}, "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "没有声音。那一刀从上往下划过空气，摩天轮上几千个连结同时松开了。", "en": "No sound. One stroke through the air, and thousands of links on the wheel let go at once."}, "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "四十八个车厢在半空中晃了一下，然后一起往下掉。几十吨的钢铁，朝我头顶砸下来。", "en": "Forty-eight cars sway in midair, then fall together. Tons of steel, straight at my head."}, "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "say", "who": "lamp", "t": {"zh": "你修不过来。除非你全力出手。", "en": "You can't mend that in time. Not unless you go all out."}, "face": "battle", "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "cg", "id": null, "when": {"v": "flag.blocked_cut", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "葛兰没有砍摩天轮。可他退开的时候，断剑擦过了底座——一根主辐条断了，整座轮子歪了一下。", "en": "Gran never cuts the wheel. But as he pulls back, the Sword grazes the base—a main spoke snaps and the whole wheel lurches."}, "when": {"v": "flag.blocked_cut", "op": "==", "val": true}}, {"op": "say", "who": "lamp", "t": {"zh": "只断了一根。你不用全力。", "en": "Only one. You don't need to go all out."}, "face": "normal", "when": {"v": "flag.blocked_cut", "op": "==", "val": true}}], "cast": [{"id": "gran"}, {"id": "sword"}, {"id": "lamp"}]}, "c2_after": {"id": "c2_after", "chapter": "c2", "kind": "main", "title": {"zh": "摩天轮下 · 打完以后", "en": "Under the wheel · afterward"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "葛兰仰着头，看了那座转着的摩天轮很久。", "en": "Gran looks up at the turning wheel for a long time."}}], "choices": [{"id": "beer", "type": "expression", "label": {"zh": "接过那瓶没开的啤酒", "en": "Take the unopened beer"}, "out": [{"text": {"zh": "说好了，打完再喝。", "en": "Like we said. After."}}], "effects": [{"add": "rel.gran.trust", "by": 2}, {"add": "rel.gran.warmth", "by": 1}], "script": [{"op": "say", "who": "gran", "t": {"zh": "说好了，打完再喝。", "en": "Like we said. After."}}, {"op": "say", "who": null, "t": {"zh": "我们坐在长椅上，谁都没说话，看摩天轮转了一圈又一圈。", "en": "We sit on the bench, saying nothing, watching it go round and round."}}, {"op": "say", "who": "gran", "t": {"zh": "下回打架，叫上我。", "en": "Next time there's a fight, call me."}}], "values": ["xin"]}, {"id": "ask", "type": "expression", "label": {"zh": "“你要遗器，是为了断剑吧？”", "en": "'You want the relics for the Sword, don't you?'"}, "out": [{"text": {"zh": "……你读过我的那一夜。", "en": "…You've read my night."}}], "effects": [{"add": "rel.gran.trust", "by": 3}], "script": [{"op": "say", "who": "gran", "t": {"zh": "……你读过我的那一夜。", "en": "…You've read my night."}, "face": "surprised"}, {"op": "say", "who": "gran", "t": {"zh": "她陪了我十年。她想要的东西，只有王冠给得了。", "en": "She's been with me ten years. What she wants, only the Crown can give."}}, {"op": "say", "who": "sword", "t": {"zh": "葛兰，别说了。", "en": "Gran, that's enough."}, "face": "sad"}], "values": ["ji"], "when": {"v": "flag.know_gran", "op": "==", "val": true}}, {"id": "leave", "type": "expression", "label": {"zh": "什么也不说，转身回家", "en": "Say nothing and go home"}, "out": [{"text": {"zh": "我走的时候，听见身后啤酒瓶盖被撬开的声音。", "en": "As I leave, I hear a bottle cap pop behind me."}}], "effects": [], "script": [{"op": "say", "who": null, "t": {"zh": "我走的时候，听见身后啤酒瓶盖被撬开的声音。", "en": "As I leave, I hear a bottle cap pop behind me."}}], "values": ["shou"]}], "salience": 0, "order": 4, "script": [{"op": "bg", "id": "ferris"}, {"op": "show", "who": "gran", "face": "normal", "at": "left"}, {"op": "say", "who": null, "t": {"zh": "葛兰仰着头，看了那座转着的摩天轮很久。", "en": "Gran looks up at the turning wheel for a long time."}}, {"op": "say", "who": "sword", "t": {"zh": "……她修好了。", "en": "…She mended it."}}, {"op": "say", "who": "gran", "t": {"zh": "嗯。", "en": "Yeah."}}, {"op": "say", "who": "gran", "t": {"zh": "我小时候来过这里。那时候它还亮着。", "en": "I came here as a kid. It still lit up then."}, "face": "sad"}, {"op": "say", "who": "me", "think": true, "t": {"zh": "我看着它转，心里空了一块。我不知道那一块原来放着什么。", "en": "I watch it turn, and something in me is hollow. I don't know what used to be there."}, "when": {"v": "mem.praise", "op": "!=", "val": true}}], "cast": [{"id": "gran"}, {"id": "sword"}]}, "c3_note": {"id": "c3_note", "chapter": "c3", "kind": "main", "title": {"zh": "林记修复 · 凌晨 02:10", "en": "Lin's Repairs · 02:10"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "我没有开大灯，只拧开了台灯。拉开抽屉，摸出一个硬皮笔记本。", "en": "I don't turn on the main light, only the desk lamp. From the drawer, a hardback notebook."}}], "choices": [{"id": "open", "type": "expression", "label": {"zh": "把本子合上，去开门", "en": "Close the notebook and open the door"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.notebook", "to": true}], "script": [], "values": ["ji"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "shop_night"}, {"op": "say", "who": null, "t": {"zh": "我没有开大灯，只拧开了台灯。拉开抽屉，摸出一个硬皮笔记本。", "en": "I don't turn on the main light, only the desk lamp. From the drawer, a hardback notebook."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "在提灯拿走更多东西之前，把她写下来。", "en": "Before the Lamp takes any more, I'll write her down."}}, {"op": "say", "who": null, "t": {"zh": "我的母亲叫林遥。", "en": "My mother's name is Lin Yao."}}, {"op": "say", "who": null, "t": {"zh": "她穿一件洗得发白的蓝外套，左边袖口有一块补丁，针脚歪歪扭扭。", "en": "She wears a washed-out blue coat with a crooked patch on the left cuff."}, "when": {"v": "mem.coat", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "她做的番茄蛋汤很咸，每次都咸，可她自己从来不觉得。", "en": "Her tomato-and-egg soup is salty, every time, and she never notices."}, "when": {"v": "mem.soup", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "她不会骑自行车。", "en": "She can't ride a bike."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "……这句话是怎么冒出来的？如果她不会骑，那个下午扶着车座的人，就不是她。那是谁？", "en": "…Where did that come from? If she couldn't ride, then whoever held the seat that afternoon wasn't her. Then who?"}, "when": {"v": "mem.ride", "op": "!=", "val": true}}, {"op": "show", "who": "lamp", "face": "sad", "at": "center", "when": {"v": "mem.ride", "op": "!=", "val": true}}, {"op": "say", "who": "lamp", "t": {"zh": "这就是代价最可怕的地方。不是忘掉，是你再也分不清，剩下的哪些是真的。", "en": "That's the worst of the price. Not forgetting—never again being sure which of what's left is true."}, "when": {"v": "mem.ride", "op": "!=", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "我记得那个下午。扶车座的是……我还记得。所以我知道她不会骑。", "en": "I remember that afternoon. The one holding the seat was… I still remember. That's how I know she couldn't ride."}, "when": {"v": "mem.ride", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "卷帘门外面，有人敲了三下。很有礼貌，间隔均匀，像是用尺子量过的。", "en": "Three knocks on the shutter. Polite, evenly spaced, as if measured with a ruler."}}], "cast": [{"id": "lamp"}]}, "s3_baiqiu": {"id": "s3_baiqiu", "chapter": "c3", "kind": "side", "title": {"zh": "听潮茶楼三楼 · 下午三点（白秋）", "en": "Tidelistening Teahouse · 3 p.m. (Bai Qiu)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "白秋喜欢下午三点。不早不晚，正好够她听见想听的话。", "en": "Bai Qiu likes three in the afternoon. Not early, not late; just right for hearing what she wants to hear."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_baiqiu", "to": true}, {"add": "rel.baiqiu.esteem", "by": 1}], "script": [], "values": ["ji"]}], "salience": 2, "order": 0, "script": [{"op": "bg", "id": "teahouse"}, {"op": "show", "who": "baiqiu", "face": "smile", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "白秋喜欢下午三点。不早不晚，正好够她听见想听的话。", "en": "Bai Qiu likes three in the afternoon. Not early, not late; just right for hearing what she wants to hear."}}, {"op": "say", "who": null, "t": {"zh": "天平拿走的，是她做选择时的犹豫。所以五年来，她做什么决定都很快，快到自己都害怕。", "en": "What the Scales take is her hesitation. So for five years she has decided everything fast, so fast it frightens her."}}, {"op": "say", "who": "baiqiu", "t": {"zh": "我想要一个没有代价的世界。如果魔法不再拿走任何东西，就不会再有人那样死去了。", "en": "I want a world without a price. If magic stopped taking things, no one would die like that again."}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "“这是个好愿望。”白衣的女孩说。“这是个坏愿望。”黑衣的女孩说。", "en": "'That's a good wish,' says the girl in white. 'That's a bad wish,' says the girl in black."}}], "cast": [{"id": "baiqiu"}]}, "s3_chess": {"id": "s3_chess", "chapter": "c3", "kind": "side", "title": {"zh": "钟楼顶层（撑黑伞的人）", "en": "The clock tower (the man with the umbrella)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "撑黑伞的男人还站在栏杆边。棋盘上，白色的骑士往前走了一格。", "en": "The man with the black umbrella still stands at the rail. On the board, the white knight moves one square."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.saw_chess", "to": true}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "clocktower"}, {"op": "say", "who": null, "t": {"zh": "撑黑伞的男人还站在栏杆边。棋盘上，白色的骑士往前走了一格。", "en": "The man with the black umbrella still stands at the rail. On the board, the white knight moves one square."}}, {"op": "say", "who": null, "t": {"zh": "“修灯的那个，”棋盘说，“第二次没有全力，也修好了。”", "en": "'The lamp-mender,' says the chessboard, 'mended it the second time without going all out.'"}}, {"op": "say", "who": null, "t": {"zh": "男人没有说话。他看着那枚白骑士，看了很久。", "en": "The man says nothing. He looks at the white knight for a long time."}}], "when": {"v": "flag.hub_only", "op": "==", "val": true}}, "s3_chess_b": {"id": "s3_chess_b", "chapter": "c3", "kind": "side", "title": {"zh": "钟楼顶层（撑黑伞的人）", "en": "The clock tower (the man with the umbrella)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "撑黑伞的男人还站在栏杆边。棋盘上，白色的骑士往前走了一格。", "en": "The man with the black umbrella still stands at the rail. On the board, the white knight moves one square."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.saw_chess", "to": true}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "clocktower"}, {"op": "say", "who": null, "t": {"zh": "撑黑伞的男人还站在栏杆边。棋盘上，白色的骑士往前走了一格。", "en": "The man with the black umbrella still stands at the rail. On the board, the white knight moves one square."}}, {"op": "say", "who": null, "t": {"zh": "“修灯的那个，”棋盘说，“已经交出去两段了。”", "en": "'The lamp-mender,' says the chessboard, 'has given up two already.'"}}, {"op": "say", "who": null, "t": {"zh": "“六十年前，”男人说，“也是从第二段开始，她就不回头了。”", "en": "'Sixty years ago,' the man says, 'it was after the second that she stopped looking back.'"}}], "when": {"v": "flag.hub_only", "op": "!=", "val": true}}, "c3_august": {"id": "c3_august", "chapter": "c3", "kind": "main", "title": {"zh": "林记修复 · 凌晨 03:05", "en": "Lin's Repairs · 03:05"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "深夜打扰。我是守秘局的监督官，奥古斯特·莱恩。今晚，我替您收拾了一座摩天轮。", "en": "Forgive the hour. I'm a supervisor with the Secrecy Bureau, August Lane. Tonight I tidied up a Ferris wheel for you."}}], "choices": [{"id": "sign", "type": "expression", "label": {"zh": "签字，照实说摩天轮是我修的", "en": "Sign, and admit the wheel was mine"}, "out": [{"text": {"zh": "谢谢您的诚实。我明天会去申请一份“旧乐园改造项目试运营”的许可。", "en": "Thank you for your honesty. Tomorrow I'll file for an 'old park refurbishment trial run' permit."}}], "effects": [{"set": "flag.registered", "to": true}, {"add": "rel.august.trust", "by": 1}], "script": [{"op": "say", "who": "august", "t": {"zh": "谢谢您的诚实。我明天会去申请一份“旧乐园改造项目试运营”的许可。", "en": "Thank you for your honesty. Tomorrow I'll file for an 'old park refurbishment trial run' permit."}}], "values": ["xin"]}, {"id": "photo", "type": "dilemma", "label": {"zh": "签字，然后把那张照片推到他面前", "en": "Sign, then slide the photo across to him"}, "out": [{"text": {"zh": "缺了门牙的小女孩举着手，身边是一片完整得过分的空白。", "en": "A gap-toothed girl reaching up, beside her a blank far too complete."}}], "effects": [{"set": "flag.registered", "to": true}, {"set": "flag.showed_photo", "to": true}, {"add": "rel.august.trust", "by": 2}, {"add": "rel.august.warmth", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "缺了门牙的小女孩举着手，身边是一片完整得过分的空白。", "en": "A gap-toothed girl reaching up, beside her a blank far too complete."}}, {"op": "say", "who": "me", "t": {"zh": "十一年前，她从所有人的记忆里消失了。只有我还记得。", "en": "Eleven years ago she vanished from everyone's memory. Only I remember."}}, {"op": "say", "who": "august", "t": {"zh": "十一年前？不是六十年前？……那就不对了。", "en": "Eleven years ago? Not sixty? …Then something's wrong."}, "face": "surprised"}, {"op": "say", "who": "august", "t": {"zh": "或者说，上一次王冠改写的那条规则，到现在还在起作用。", "en": "Or else the rule the Crown rewrote last time is still working, even now."}, "face": "serious"}], "values": ["ji"]}, {"id": "lie", "type": "strategy", "label": {"zh": "签字，但说摩天轮不是我修的", "en": "Sign, but say the wheel wasn't you"}, "out": [{"text": {"zh": "……是吗。", "en": "…Is that so."}}], "effects": [{"set": "flag.registered", "to": true}, {"set": "flag.lied", "to": true}, {"add": "notice", "by": 2}, {"add": "rel.august.trust", "by": -1}], "script": [{"op": "say", "who": "august", "t": {"zh": "……是吗。", "en": "…Is that so."}, "face": "serious"}, {"op": "say", "who": null, "t": {"zh": "他推了推老花镜，在表格的空白处写了一行很小的字。", "en": "He nudges his reading glasses and writes a tiny line in the margin."}}], "values": ["duo"]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "shop_night"}, {"op": "show", "who": "august", "face": "normal", "at": "center"}, {"op": "say", "who": "august", "t": {"zh": "深夜打扰。我是守秘局的监督官，奥古斯特·莱恩。今晚，我替您收拾了一座摩天轮。", "en": "Forgive the hour. I'm a supervisor with the Secrecy Bureau, August Lane. Tonight I tidied up a Ferris wheel for you."}}, {"op": "say", "who": "august", "t": {"zh": "守秘局在王冠之争里保持中立。我们只管一件事：普通人不应该知道魔法的存在。", "en": "The Bureau is neutral in the Crown war. We see to one thing only: ordinary people must not learn that magic exists."}}, {"op": "cg", "id": "cg_register"}, {"op": "say", "who": null, "t": {"zh": "他推过来一张表：第七次灰烬王冠之争·遗器持有者登记。十二行。最后一行，钥匙那一栏，什么都没有写——不是“空”，也不是“未登记”，就只是一片空白。", "en": "He slides a form across: Seventh Ashen Crown War · Relic Holder Register. Twelve lines. The last, for the Key, is empty—not 'none', not 'unregistered', just blank."}}, {"op": "say", "who": "august", "t": {"zh": "四百二十年来，钥匙那一栏从来没有填过。可是每一次王冠打开，都需要用到它。", "en": "In four hundred and twenty years, no one has ever filled in the Key. Yet every time the Crown opens, it is used."}}, {"op": "cg", "id": null}, {"op": "say", "who": "august", "t": {"zh": "请在这里签字。规则三条：不许在普通人面前使用遗器；不许伤害与王冠之争无关的人；王冠打开以后，结果由王冠决定。", "en": "Sign here. Three rules: no relics before ordinary people; no harm to anyone outside the war; once the Crown opens, the Crown decides."}}], "cast": [{"id": "august"}]}, "x_notice": {"id": "x_notice", "chapter": "*", "kind": "interrupt", "title": {"zh": "凌晨一点 · 坡底", "en": "1 a.m. · foot of the slope"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "回家的路上，坡底停着两辆没有标志的车。两个穿黑西装的人拦住我：“您好，市政燃气检测。北岸那边刚才有点异常。”", "en": "On the way home, two unmarked cars wait at the foot of the slope. Two men in black suits stop me. 'Good evening, city gas inspection. Something odd on the north shore just now.'"}}], "choices": [{"id": "cooperate", "type": "expression", "label": {"zh": "站在路灯底下，问什么答什么", "en": "Stand under the streetlight and answer everything"}, "out": [{"text": {"zh": "问了二十分钟。走的时候，其中一个说：监督官晚点会去您铺子里。请说实话，省大家的事。", "en": "Twenty minutes of questions. Leaving, one says: the supervisor will call at your shop later. Please tell him the truth; it saves everyone trouble."}}], "effects": [{"set": "flag.questioned", "to": true}, {"add": "notice", "by": -1}], "script": [{"op": "say", "who": null, "t": {"zh": "问了二十分钟。走的时候，其中一个说：监督官晚点会去您铺子里。请说实话，省大家的事。", "en": "Twenty minutes of questions. Leaving, one says: the supervisor will call at your shop later. Please tell him the truth; it saves everyone trouble."}}], "values": ["xin"]}, {"id": "refuse", "type": "strategy", "label": {"zh": "“我只是路过。”绕开他们走", "en": "'Just passing.' Walk around them"}, "out": [{"text": {"zh": "他们没有追。可是那两辆车的灯，一直跟到了我铺子门口。", "en": "They don't follow on foot. But the cars' headlights follow me all the way to my shutter."}}], "effects": [{"set": "flag.questioned", "to": true}, {"add": "notice", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "他们没有追。可是那两辆车的灯，一直跟到了我铺子门口。", "en": "They don't follow on foot. But the cars' headlights follow me all the way to my shutter."}}], "values": ["shou"]}], "salience": 0, "order": -1, "script": [{"op": "bg", "id": "harbor_street"}, {"op": "say", "who": null, "t": {"zh": "回家的路上，坡底停着两辆没有标志的车。两个穿黑西装的人拦住我：“您好，市政燃气检测。北岸那边刚才有点异常。”", "en": "On the way home, two unmarked cars wait at the foot of the slope. Two men in black suits stop me. 'Good evening, city gas inspection. Something odd on the north shore just now.'"}}, {"op": "say", "who": null, "t": {"zh": "他们不看燃气表。他们一直在看我腰上的灯。", "en": "They don't look at any meter. They keep looking at the lamp on my belt."}}], "when": {"v": "notice", "op": ">=", "val": 2}}, "c3_tea": {"id": "c3_tea", "chapter": "c3", "kind": "main", "title": {"zh": "听潮茶楼三楼 · 15:12", "en": "Tidelistening Teahouse · 15:12"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "门缝里塞着一张纸条：你昨晚被人照了镜子。想知道是谁，下午三点，听潮茶楼三楼。署名是一架小小的天平。", "en": "A note under the door: Someone held a mirror to you last night. If you want to know who, 3 p.m., third floor of the Tidelistening Teahouse. Signed with a tiny pair of scales."}}], "choices": [{"id": "mend", "type": "dilemma", "label": {"zh": "“我修。”——把手放在那道裂纹上", "en": "'I'll mend it.'—lay a hand on the crack"}, "out": [{"text": {"zh": "裂纹很细，很深，从秤盘边缘一直延伸到中心。像是被什么太重的东西压裂的。", "en": "The crack is fine and deep, from rim to center. As if something far too heavy pressed it."}}], "effects": [{"set": "flag.met_baiqiu", "to": true}, {"set": "flag.heard_sword", "to": true}, {"set": "flag.heard_ink", "to": true}, {"set": "flag.fixed_scales", "to": true}, {"add": "rel.baiqiu.trust", "by": 2}, {"add": "light", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "裂纹很细，很深，从秤盘边缘一直延伸到中心。像是被什么太重的东西压裂的。", "en": "The crack is fine and deep, from rim to center. As if something far too heavy pressed it."}}, {"op": "cg", "id": "cg_scales"}, {"op": "say", "who": null, "t": {"zh": "我一点一点地，让它想起原来的样子。两只秤盘晃了晃，停在了同一个高度。平了。", "en": "Bit by bit I let it remember what it was. The pans sway and settle at the same height. Level."}}, {"op": "say", "who": "baiqiu", "t": {"zh": "……三年了。", "en": "…Three years."}, "face": "surprised"}, {"op": "cg", "id": null}], "values": ["xiu"]}, {"id": "wish", "type": "expression", "label": {"zh": "“你想要一个没有代价的世界，对吧？”", "en": "'You want a world without a price, don't you?'"}, "out": [{"text": {"zh": "……你从哪里听来的？", "en": "…Where did you hear that?"}}], "effects": [{"set": "flag.met_baiqiu", "to": true}, {"set": "flag.heard_sword", "to": true}, {"set": "flag.heard_ink", "to": true}, {"set": "flag.fixed_scales", "to": true}, {"add": "rel.baiqiu.trust", "by": 3}, {"add": "rel.baiqiu.esteem", "by": 1}], "script": [{"op": "say", "who": "baiqiu", "t": {"zh": "……你从哪里听来的？", "en": "…Where did you hear that?"}, "face": "surprised"}, {"op": "say", "who": "me", "t": {"zh": "我修好它，但你得告诉我：压裂它的，是什么？", "en": "I'll mend it, but tell me: what cracked it?"}}, {"op": "say", "who": "baiqiu", "t": {"zh": "那是第四条情报。……好吧。是一个人的命。总有一天告诉你。", "en": "That's a fourth piece. …Fine. A life. I'll tell you one day."}, "face": "sad"}, {"op": "cg", "id": "cg_scales"}, {"op": "say", "who": null, "t": {"zh": "秤盘平了。", "en": "The pans come level."}}, {"op": "cg", "id": null}], "values": ["ji"], "when": {"v": "flag.know_baiqiu", "op": "==", "val": true}}, {"id": "decline", "type": "strategy", "label": {"zh": "“情报我听了。东西，不修。”", "en": "'I heard your information. I won't mend it.'"}, "out": [{"text": {"zh": "也好。你只要相信你自己的判断就好。", "en": "Fair enough. Trust your own judgment."}}], "effects": [{"set": "flag.met_baiqiu", "to": true}, {"set": "flag.heard_sword", "to": true}, {"set": "flag.heard_ink", "to": true}], "script": [{"op": "say", "who": "baiqiu", "t": {"zh": "也好。你只要相信你自己的判断就好。", "en": "Fair enough. Trust your own judgment."}, "face": "smile"}], "values": ["shou"]}], "salience": 0, "order": 3, "script": [{"op": "bg", "id": "teahouse"}, {"op": "say", "who": null, "t": {"zh": "门缝里塞着一张纸条：你昨晚被人照了镜子。想知道是谁，下午三点，听潮茶楼三楼。署名是一架小小的天平。", "en": "A note under the door: Someone held a mirror to you last night. If you want to know who, 3 p.m., third floor of the Tidelistening Teahouse. Signed with a tiny pair of scales."}}, {"op": "show", "who": "baiqiu", "face": "smile", "at": "center"}, {"op": "say", "who": "baiqiu", "t": {"zh": "请坐，林小姐。茶刚泡好。", "en": "Have a seat, Miss Lin. The tea's just made."}}, {"op": "say", "who": null, "t": {"zh": "“喝茶吗？”白衣的说。“别喝茶。”黑衣的说。", "en": "'Some tea?' says the one in white. 'Don't drink the tea,' says the one in black."}}, {"op": "say", "who": "baiqiu", "t": {"zh": "我手里有三条情报，都和你有关。换你修一样东西。", "en": "I have three pieces of information, all about you. In exchange, you mend one thing for me."}}, {"op": "say", "who": null, "t": {"zh": "她把一架巴掌大的黄铜天平放在桌上。左边秤盘边缘有一道裂纹，一直裂到中心。", "en": "She sets a palm-sized brass scale on the table. A crack runs from the left pan's rim to the center."}}, {"op": "say", "who": "baiqiu", "t": {"zh": "第一条：昨晚你修摩天轮的时候，有人在灯塔上看着。第二条：伊芙琳的下一个目标，是卡罗·文斯的墨水瓶。", "en": "One: while you mended the wheel last night, someone watched from the lighthouse. Two: Evelyn's next target is Carlo Vince's Inkwell."}}, {"op": "say", "who": "baiqiu", "t": {"zh": "第三条：断剑的那道断口，是六十年前断的。断剑当时的主人，在钟楼上被一盏灯拦住了——你的那盏灯。提灯的上一任主人，亲手折断了断剑。", "en": "Three: the Sword broke sixty years ago. Its holder was stopped on the clock tower by a lamp—your lamp. The Lamp's last holder broke the Sword with her own hands."}, "face": "serious"}, {"op": "say", "who": null, "t": {"zh": "“是真的。”白衣的说。“是假的。”黑衣的说。两个声音完全重叠。", "en": "'It's true,' says the one in white. 'It's false,' says the one in black. Their voices overlap exactly."}}], "cast": [{"id": "baiqiu"}]}, "c3_end": {"id": "c3_end", "chapter": "c3", "kind": "main", "title": {"zh": "老城区坡道 · 夜", "en": "The old-town slope · night"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "提灯。白秋说的是真的吗？六十年前，你的上一任主人折断了断剑？", "en": "Lamp. Was Bai Qiu telling the truth? Did your last holder break the Sword sixty years ago?"}}], "choices": [{"id": "sleep", "type": "expression", "label": {"zh": "把灯挂回腰上，拉下卷帘门", "en": "Hang the lamp back on my belt and pull down the shutter"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.c3_done", "to": true}], "script": [], "values": ["ji"]}], "salience": 0, "order": 4, "script": [{"op": "bg", "id": "shop_night"}, {"op": "show", "who": "lamp", "face": "normal", "at": "center"}, {"op": "say", "who": "me", "t": {"zh": "提灯。白秋说的是真的吗？六十年前，你的上一任主人折断了断剑？", "en": "Lamp. Was Bai Qiu telling the truth? Did your last holder break the Sword sixty years ago?"}}, {"op": "say", "who": "lamp", "t": {"zh": "……我不记得了。王冠改写规则的时候，会把“改之前是什么样”从所有人的记忆里一起抹掉。连我们也一样。", "en": "…I don't remember. When the Crown rewrites a rule, it wipes what came before from everyone's memory. Us too."} const markSeen = k => { if (!seen.has(k)) { seen.add(k); store.set("seen", [...seen]); } };
const unlock = (kind, id) => { const u = store.get(kind, []); if (!u.includes(id)) { u.push(id); store.set(kind, u); } };

/* ---------- drawing ---------- */
function drawBg() {
  const el = $("#bg"), id = V.bg, url = id && art(`bg/${id}.webp`);
  const grad = id ? `linear-gradient(160deg, hsl(${hue(id)} 45% 32%), hsl(${(hue(id) + 40) % 360} 40% 14%))` : "none";
  audioMood(id);
  const apply = () => {
    if (V.bg !== id || el.dataset.shown === (id || "")) return; el.dataset.shown = id || "";
    el.style.backgroundImage = url ? `url("${url}"), ${grad}` : grad;
    ph(el, !url && id ? t((CAMP.art.bg || {})[id]) || id : null);
    FX.bg && FX.bg.set(url, url && art(`depth/bg/${id}.webp`));
  };
  if (!url) return apply();
  // 新背景下好之前继续显示上一张，不露出底色；太久没到（网慢）才先垫颜色
  preload(url).then(apply); setTimeout(apply, el.dataset.shown ? 2500 : 1500);
}
function drawCg() {
  const el = $("#cg"), id = V.cg, url = id && art(`cg/${id}.webp`);
  if (!id) { el.classList.remove("on"); return; }
  const grad = `radial-gradient(circle at 60% 40%, hsl(${hue(id)} 60% 55%), hsl(${(hue(id) + 200) % 360} 40% 12%))`;
  const apply = () => {
    if (V.cg !== id || (el.dataset.shown === id && el.classList.contains("on"))) return; el.dataset.shown = id;
    el.style.backgroundImage = url ? `url("${url}"), ${grad}` : grad;
    ph(el, !url ? "CG · " + (t((CAMP.art.cg || {})[id]) || id) : null);
    FX.cg && FX.cg.set(url, url && art(`depth/cg/${id}.webp`));
    el.classList.add("on");
  };
  if (!url) return apply();
  preload(url).then(apply); setTimeout(apply, 2500);   // CG 下好了才淡入
}
const POS = { left: 24, center: 50, right: 76 };
function silhouette(who, face) {
  const c = COLORS[who] || "#ddd", f = t((CAMP.art.faces || {})[face]) || face;
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 90 160");
  svg.innerHTML = `<defs><linearGradient id="g-${who}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".95"/><stop offset="1" stop-color="${c}" stop-opacity=".35"/></linearGradient></defs>
    <circle cx="45" cy="38" r="20" fill="url(#g-${who})"/><path d="M12 160 C12 95 25 70 45 66 C65 70 78 95 78 160 Z" fill="url(#g-${who})"/>
    <text x="45" y="112" text-anchor="middle" font-size="9" fill="#1b1b2a" font-weight="700"></text><text x="45" y="125" text-anchor="middle" font-size="7.5" fill="#1b1b2a"></text>`;
  svg.querySelectorAll("text")[0].textContent = t(CAMP.chars[who].name);
  svg.querySelectorAll("text")[1].textContent = f;
  return svg;
}
function ph(el, label) { el.querySelector(".ph")?.remove(); if (label) { const s = document.createElement("span"); s.className = "ph"; s.textContent = label; el.append(s); } }
function drawSprites() {
  const box = $("#sprites"); box.replaceChildren();
  for (const [who, s] of Object.entries(V.sprites)) {
    const d = document.createElement("div"); d.className = "sprite" + (V.speaker && V.speaker !== who ? " dim" : "");
    d.style.left = (POS[s.at] ?? 50) + "%";
    const url = art(`sprites/${who}/${s.face}.webp`) || art(`sprites/${who}/normal.webp`);   // an expression not drawn yet: the standard sprite
    if (!url) { d.append(silhouette(who, s.face)); box.append(d); continue; }   // 图还没到：先放剪影
    const img = new Image(); img.src = url; img.alt = ""; d.append(img);
    box.append(d);
  }
}
function draw() { drawBg(); drawSprites(); drawCg(); }

/* ---------- the script runner ---------- */
function load(lines, src) { V.queue = lines.map((l, k) => ({ ...l, src: `${src}:${k}` })); V.i = 0; prefetch(lines); }
function step() {
  clearTimeout(timer);
  if (typing) { finishTyping(); return; }
  while (V.i < V.queue.length) {
    const op = V.queue[V.i++];
    if (op.when && !CC.evalCond(G, op.when)) continue;
    if (op.op === "bg") { V.bg = op.id; V.cg = null; V.sprites = {}; draw(); continue; }
    if (op.op === "show") {
      const at = op.at || (V.sprites[op.who] || {}).at || "center";
      for (const w of Object.keys(V.sprites)) if (w !== op.who && V.sprites[w].at === at) delete V.sprites[w];   // 同一个位置只站一个人：后上来的把前面的人换下去
      V.sprites[op.who] = { face: op.face, at }; drawSprites(); continue; }
    if (op.op === "hide") { if (op.who) delete V.sprites[op.who]; else V.sprites = {}; drawSprites(); continue; }
    if (op.op === "cg") { if (op.id && !art(`cg/${op.id}.webp`)) continue;   // 还没画的 CG 先跳过，不显示占位；图一到就会出现
      V.cg = op.id; if (op.id) unlock("cg", op.id); drawCg(); continue; }
    if (op.op === "say") { say(op); return; }
  }
  next();                                        // the scene's lines are done: ask the engine what comes next
}
function say(op) {
  if (op.face && op.who && V.sprites[op.who]) V.sprites[op.who].face = op.face;
  if (op.heart) { const h = document.createElement("div"); h.className = "heart"; h.textContent = "♡"; const at = (V.sprites[op.who] && POS[V.sprites[op.who].at]) ?? 50; h.style.left = `calc(${at}% + 9%)`; h.style.top = "18%"; $("#stage").append(h); setTimeout(() => h.remove(), 1700); }
  V.speaker = op.who && op.who !== "me" ? op.who : null; drawSprites();
  $("#name").textContent = op.who ? nameOf(op.who) : "";
  const el = $("#text"), full = t(op.t);
  el.classList.toggle("think", !!op.think); el.classList.toggle("forget", !!op.forget); if (op.forget && !skip) toast(ui("memToast"));
  V.log.push({ who: op.who ? nameOf(op.who) : "", text: op.think ? `（${full}）` : full }); if (V.log.length > 300) V.log.shift();
  const wasSeen = seen.has(op.src); markSeen(op.src);
  if (skip && !wasSeen) { skip = false; renderBar(); }
  if (skip) { el.textContent = full; $("#next").classList.add("on"); timer = setTimeout(step, 40); return; }
  $("#next").classList.remove("on");
  let k = 0; el.textContent = "";
  typingFull = full;
  typing = setInterval(() => { k += 2; el.textContent = full.slice(0, k); if (k >= full.length) finishTyping(); }, 28);
}
function finishTyping() {
  if (typing) { clearInterval(typing); $("#text").textContent = typingFull; typing = null; }
  $("#next").classList.add("on");
  if (auto) timer = setTimeout(step, 1400 + 40 * $("#text").textContent.length);
}

/* ---------- engine bridge ---------- */
function next() {
  unlockArchive();
  if (G.phase === "end") return showEnd();
  if (G.phase === "side") return sideMenu();
  if (G.phase === "node") {
    const n = CAMP.nodes[G.cur];
    if (V.started !== G.cur) { V.started = G.cur; load(n.script || [], "n:" + n.id); autosave(); return step(); }
    return choiceMenu(n);
  }
}
function menu(prompt, opts) {
  const m = $("#menu"); m.replaceChildren(); m.hidden = false; skip = false; renderBar();
  if (prompt) { const p = document.createElement("div"); p.className = "prompt"; p.textContent = prompt; m.append(p); }
  opts.forEach(o => { const b = document.createElement("button"); b.className = "opt"; b.textContent = o.label; b.disabled = !!o.disabled; b.onclick = () => { m.hidden = true; o.go(); }; m.append(b); });
  m.querySelector("button:not([disabled])")?.focus();
}
function choiceMenu(n) {
  const os = CC.choices(CAMP, G).filter(o => !o.locked);
  os.forEach(o => prefetch((o.c.script || []).slice(0, 12)));
  menu(ui("prompt"), os.map(o => ({ label: t(o.c.label), go: () => {
    V.log.push({ who: "", text: "▸ " + t(o.c.label) });
    const lines = o.c.script || []; CC.choose(CAMP, G, o.id); V.started = null;
    load(lines, `c:${n.id}.${o.id}`); step();
  } })));
  // 自由对话：场上有女主、这一幕还有说话的机会、网站接了 AI，就多一个“对她说点什么”
  const who = talkTarget(n);
  if (who && TALK.ai && CC.freeLeft(CAMP, G) > 0) {
    const b = document.createElement("button"); b.className = "opt talk-opt"; b.textContent = ui("talk")(nameOf(who));
    b.onclick = () => talkBox(n, who); $("#menu").insertBefore(b, $("#menu .opt"));
  }
}
function sideMenu() {
  const ch = CAMP.chapters[G.ch];
  G.offer.forEach(id => prefetch((CAMP.nodes[id].script || []).slice(0, 12)));
  menu(t(ch.side_prompt || CAMP.side_prompt), G.offer.map(id => ({ label: t(CAMP.nodes[id].title), go: () => { CC.pickSide(CAMP, G, id); V.started = null; next(); } })));
}
function showEnd() {
  const es = CC.endings(CAMP, G), e = $("#endscreen"); e.replaceChildren(); e.hidden = false;
  // 结局有自己的 CG 就铺在后面（压暗，字照样看得清）
  const ecg = es.map(x => CAMP.endings.find(g => g.id === x.group).fragments.find(f => f.id === x.frag).cg).find(id => id && art(`cg/${id}.webp`));
  e.style.backgroundImage = ecg ? `linear-gradient(rgba(6,8,18,.55), rgba(6,8,18,.82)), url("${art(`cg/${ecg}.webp`)}")` : "";
  e.style.backgroundSize = "cover"; e.style.backgroundPosition = "center";
  if (ecg) unlock("cg", ecg);
  es.forEach((x, i) => {   // 每一组一个小标题（结局有自己的名字就用它），下面是正文
    const g = CAMP.endings.find(g => g.id === x.group), f = g.fragments.find(f => f.id === x.frag);
    const h = document.createElement(i ? "h3" : "h2"); h.textContent = t(f.title || g.title); e.append(h);
    const p = document.createElement("p"); p.textContent = t(f.text); e.append(p); unlock("ends", x.group + "." + x.frag);
    if (f.clinic) { const c = document.createElement("div"); c.className = "clinic"; const h4 = document.createElement("h4"); h4.textContent = ui("clinic"); const q = document.createElement("p"); q.textContent = t(f.clinic); c.append(h4, q); e.append(c); }
  });
  const b = document.createElement("button"); b.textContent = ui("back"); b.onclick = () => { e.hidden = true; title(); }; e.append(b);
  store.set("auto", null);
}

/* ---------- saves ---------- */
const snapshot = () => JSON.parse(JSON.stringify({ G, V: { ...V, log: V.log.slice(-60) }, at: Date.now(), label: nameOf(null) + t(CAMP.chapters[Math.max(0, G.ch)]?.title) }));
function autosave() { if (G && G.phase !== "end") store.set("auto", snapshot()); }
function restore(s) { askTilt(); audioStart(); G = s.G; V = s.V; typing = null; $("#endscreen").hidden = true; $("#menu").hidden = true; $("#title").hidden = true; draw(); V.i = Math.max(0, V.i - 1); step(); }
function slots(mode) {
  const p = $("#panel"); p.replaceChildren(); p.hidden = false;
  const h = document.createElement("h2"); h.textContent = mode === "save" ? ui("save") : ui("loadS");
  const close = document.createElement("button"); close.className = "close"; close.textContent = ui("close"); close.onclick = () => p.hidden = true;
  const body = document.createElement("div"); body.className = "body slots";
  for (let n = 1; n <= 9; n++) {
    const s = store.get("slot" + n, null), b = document.createElement("button"); b.className = "slot";
    b.textContent = ui("savedAt")(n); const sm = document.createElement("small");
    sm.textContent = s ? `${t(CAMP.chapters[Math.max(0, s.G.ch)]?.title)} · ${new Date(s.at).toLocaleString()}` : ui("empty"); b.append(sm);
    b.disabled = mode === "load" && !s;
    b.onclick = () => { if (mode === "save") { store.set("slot" + n, snapshot()); slots("save"); } else { p.hidden = true; restore(s); } };
    body.append(b);
  }
  p.append(h, close, body);
}
function showLog() {
  const p = $("#panel"); p.replaceChildren(); p.hidden = false;
  const h = document.createElement("h2"); h.textContent = ui("log");
  const close = document.createElement("button"); close.className = "close"; close.textContent = ui("close"); close.onclick = () => p.hidden = true;
  const body = document.createElement("div"); body.className = "body log";
  V.log.forEach(l => { const q = document.createElement("p"); if (l.who) { const b = document.createElement("b"); b.textContent = l.who; q.append(b); } q.append(l.text); body.append(q); });
  p.append(h, close, body); body.scrollTop = body.scrollHeight;
}
function showGallery() {
  const p = $("#panel"); p.replaceChildren(); p.hidden = false;
  const h = document.createElement("h2"); h.textContent = ui("gallery");
  const close = document.createElement("button"); close.className = "close"; close.textContent = ui("close"); close.onclick = () => p.hidden = true;
  const body = document.createElement("div"); body.className = "body";
  const got = store.get("cg", []), ends = store.get("ends", []);
  const sec = (title, items) => { const s = document.createElement("h2"); s.textContent = title; s.style.fontSize = "14px"; const g = document.createElement("div"); g.className = "gallery"; items.forEach(([open, label, url]) => { const d = document.createElement("div"); d.textContent = open ? label : ui("locked"); if (!open) d.className = "locked"; else if (url) d.style.backgroundImage = `url("${url}")`; g.append(d); }); body.append(s, g); };
  sec(ui("cgs"), Object.entries(CAMP.art.cg || {}).map(([id, n]) => [got.includes(id), t(n), art(`cg/${id}.webp`)]));
  sec(ui("ends"), CAMP.endings.flatMap(g => g.fragments.filter(f => !f.dead).map(f => [ends.includes(g.id + "." + f.id), f.title ? t(f.title) : t(f.text).slice(0, 26) + "…", null])));
  sec(ui("clinic"), CAMP.endings.flatMap(g => g.fragments.filter(f => f.dead).map(f => [ends.includes(g.id + "." + f.id), t(f.title), null])));
  p.append(h, close, body);
}


/* ---------- 灰烬王冠：记忆册、遗器档案、画风 ---------- */
function toast(msg) { const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; $("#stage").append(d); setTimeout(() => d.remove(), 3300); }
function toggleStyle() { STYLE = STYLE === "anime" ? "real" : "anime"; store.set("style", STYLE); if (V) { $("#bg").dataset.shown = ""; draw(); } renderBar(); toast(ui("style") + " · " + t(CAMP.art.styles[STYLE])); }
function panelOpen(title) {
  const p = $("#panel"); p.replaceChildren(); p.hidden = false;
  const h = document.createElement("h2"); h.textContent = title;
  const close = document.createElement("button"); close.className = "close"; close.textContent = ui("close"); close.onclick = () => p.hidden = true;
  const body = document.createElement("div"); body.className = "body"; p.append(h, close, body); return body;
}
function showMemory() {
  const body = panelOpen(ui("mem"));
  const has = id => !G || G.v["mem." + id] !== false;
  const left = (CAMP.memories || []).filter(m => has(m.id)).length;
  const s = document.createElement("p"); s.style.color = "var(--muted)"; s.textContent = ui("memLeft")(left); body.append(s);
  for (const m of CAMP.memories || []) {
    const d = document.createElement("div"); d.className = "mem" + (has(m.id) ? "" : " gone");
    const b = document.createElement("b"); b.textContent = t(m.title);
    const p = document.createElement("p"); p.textContent = has(m.id) ? t(m.text) : ui("memGone");
    d.append(b, p); body.append(d);
  }
}
function unlockArchive() {
  if (!G) return;
  for (const r of CAMP.archive || []) r.rows.forEach((row, i) => { if (CC.evalCond(G, row.when)) unlock("arc", r.id + "." + i); });
}
function showArchive() {
  const body = panelOpen(ui("arc")), got = store.get("arc", []);
  const s = document.createElement("p"); s.style.color = "var(--muted)"; s.style.fontSize = "13px"; s.textContent = ui("arcHint"); body.append(s);
  for (const r of CAMP.archive || []) {
    const d = document.createElement("div"); d.className = "arc";
    const h = document.createElement("h3"); h.textContent = t(r.name);
    const dl = document.createElement("dl");
    r.rows.forEach((row, i) => { const open = got.includes(r.id + "." + i); const dt = document.createElement("dt"); dt.textContent = t(row.label); const dd = document.createElement("dd"); dd.textContent = open ? t(row.text) : ui("unknown"); if (!open) dd.className = "q"; dl.append(dt, dd); });
    d.append(h, dl); body.append(d);
  }
