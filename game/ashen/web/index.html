st", "t": {"zh": "四百二十年来，钥匙那一栏从来没有填过。可是每一次王冠打开，都需要用到它。", "en": "In four hundred and twenty years, no one has ever filled in the Key. Yet every time the Crown opens, it is used."}}, {"op": "cg", "id": null}, {"op": "say", "who": "august", "t": {"zh": "请在这里签字。规则三条：不许在普通人面前使用遗器；不许伤害与王冠之争无关的人；王冠打开以后，结果由王冠决定。", "en": "Sign here. Three rules: no relics before ordinary people; no harm to anyone outside the war; once the Crown opens, the Crown decides."}}], "cast": [{"id": "august"}]}, "x_notice": {"id": "x_notice", "chapter": "*", "kind": "interrupt", "title": {"zh": "凌晨一点 · 坡底", "en": "1 a.m. · foot of the slope"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "回家的路上，坡底停着两辆没有标志的车。两个穿黑西装的人拦住我：“您好，市政燃气检测。这一带刚才有点异常。”", "en": "On the way home, two unmarked cars wait at the foot of the slope. Two men in black suits stop me. 'Good evening, city gas inspection. Something odd around here just now.'"}}], "choices": [{"id": "cooperate", "type": "expression", "label": {"zh": "站在路灯底下，问什么答什么", "en": "Stand under the streetlight and answer everything"}, "out": [{"text": {"zh": "问了二十分钟。走的时候，其中一个说：监督官晚点会去您铺子里。请说实话，省大家的事。", "en": "Twenty minutes of questions. Leaving, one says: the supervisor will call at your shop later. Please tell him the truth; it saves everyone trouble."}}], "effects": [{"set": "flag.questioned", "to": true}, {"add": "notice", "by": -1}], "script": [{"op": "say", "who": null, "t": {"zh": "问了二十分钟。走的时候，其中一个说：监督官晚点会去您铺子里。请说实话，省大家的事。", "en": "Twenty minutes of questions. Leaving, one says: the supervisor will call at your shop later. Please tell him the truth; it saves everyone trouble."}}], "values": ["xin"]}, {"id": "refuse", "type": "strategy", "label": {"zh": "“我只是路过。”绕开他们走", "en": "'Just passing.' Walk around them"}, "out": [{"text": {"zh": "他们没有追。可是那两辆车的灯，一直跟到了我铺子门口。", "en": "They don't follow on foot. But the cars' headlights follow me all the way to my shutter."}}], "effects": [{"set": "flag.questioned", "to": true}, {"add": "notice", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "他们没有追。可是那两辆车的灯，一直跟到了我铺子门口。", "en": "They don't follow on foot. But the cars' headlights follow me all the way to my shutter."}}], "values": ["shou"]}], "salience": 0, "order": -1, "script": [{"op": "bg", "id": "harbor_street"}, {"op": "say", "who": null, "t": {"zh": "回家的路上，坡底停着两辆没有标志的车。两个穿黑西装的人拦住我：“您好，市政燃气检测。这一带刚才有点异常。”", "en": "On the way home, two unmarked cars wait at the foot of the slope. Two men in black suits stop me. 'Good evening, city gas inspection. Something odd around here just now.'"}}, {"op": "say", "who": null, "t": {"zh": "他们不看燃气表。他们一直在看我腰上的灯。", "en": "They don't look at any meter. They keep looking at the lamp on my belt."}}], "when": {"v": "notice", "op": ">=", "val": 2}}, "c3_tea": {"id": "c3_tea", "chapter": "c3", "kind": "main", "title": {"zh": "听潮茶楼三楼 · 15:12", "en": "Tidelistening Teahouse · 15:12"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "门缝里塞着一张纸条：你昨晚被人照了镜子。想知道是谁，下午三点，听潮茶楼三楼。署名是一架小小的天平。", "en": "A note under the door: Someone held a mirror to you last night. If you want to know who, 3 p.m., third floor of the Tidelistening Teahouse. Signed with a tiny pair of scales."}}], "choices": [{"id": "mend", "type": "dilemma", "label": {"zh": "“我修。”——把手放在那道裂纹上", "en": "'I'll mend it.'—lay a hand on the crack"}, "out": [{"text": {"zh": "裂纹很细，很深，从秤盘边缘一直延伸到中心。像是被什么太重的东西压裂的。", "en": "The crack is fine and deep, from rim to center. As if something far too heavy pressed it."}}], "effects": [{"set": "flag.met_baiqiu", "to": true}, {"set": "flag.heard_sword", "to": true}, {"set": "flag.heard_ink", "to": true}, {"set": "flag.fixed_scales", "to": true}, {"add": "rel.baiqiu.trust", "by": 2}, {"add": "light", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "裂纹很细，很深，从秤盘边缘一直延伸到中心。像是被什么太重的东西压裂的。", "en": "The crack is fine and deep, from rim to center. As if something far too heavy pressed it."}}, {"op": "cg", "id": "cg_scales"}, {"op": "say", "who": null, "t": {"zh": "我一点一点地，让它想起原来的样子。两只秤盘晃了晃，停在了同一个高度。平了。", "en": "Bit by bit I let it remember what it was. The pans sway and settle at the same height. Level."}}, {"op": "say", "who": "baiqiu", "t": {"zh": "……三年了。", "en": "…Three years."}, "face": "surprised"}, {"op": "cg", "id": null}], "values": ["xiu"]}, {"id": "wish", "type": "expression", "label": {"zh": "“你想要一个没有代价的世界，对吧？”", "en": "'You want a world without a price, don't you?'"}, "out": [{"text": {"zh": "……你从哪里听来的？", "en": "…Where did you hear that?"}}], "effects": [{"set": "flag.met_baiqiu", "to": true}, {"set": "flag.heard_sword", "to": true}, {"set": "flag.heard_ink", "to": true}, {"set": "flag.fixed_scales", "to": true}, {"add": "rel.baiqiu.trust", "by": 3}, {"add": "rel.baiqiu.esteem", "by": 1}], "script": [{"op": "say", "who": "baiqiu", "t": {"zh": "……你从哪里听来的？", "en": "…Where did you hear that?"}, "face": "surprised"}, {"op": "say", "who": "me", "t": {"zh": "我修好它，但你得告诉我：压裂它的，是什么？", "en": "I'll mend it, but tell me: what cracked it?"}}, {"op": "say", "who": "baiqiu", "t": {"zh": "那是第四条情报。……好吧。是一个人的命。总有一天告诉你。", "en": "That's a fourth piece. …Fine. A life. I'll tell you one day."}, "face": "sad"}, {"op": "cg", "id": "cg_scales"}, {"op": "say", "who": null, "t": {"zh": "秤盘平了。", "en": "The pans come level."}}, {"op": "cg", "id": null}], "values": ["ji"], "when": {"v": "flag.know_baiqiu", "op": "==", "val": true}}, {"id": "decline", "type": "strategy", "label": {"zh": "“情报我听了。东西，不修。”", "en": "'I heard your information. I won't mend it.'"}, "out": [{"text": {"zh": "也好。你只要相信你自己的判断就好。", "en": "Fair enough. Trust your own judgment."}}], "effects": [{"set": "flag.met_baiqiu", "to": true}, {"set": "flag.heard_sword", "to": true}, {"set": "flag.heard_ink", "to": true}], "script": [{"op": "say", "who": "baiqiu", "t": {"zh": "也好。你只要相信你自己的判断就好。", "en": "Fair enough. Trust your own judgment."}, "face": "smile"}], "values": ["shou"]}], "salience": 0, "order": 3, "script": [{"op": "bg", "id": "teahouse"}, {"op": "say", "who": null, "t": {"zh": "门缝里塞着一张纸条：你昨晚被人照了镜子。想知道是谁，下午三点，听潮茶楼三楼。署名是一架小小的天平。", "en": "A note under the door: Someone held a mirror to you last night. If you want to know who, 3 p.m., third floor of the Tidelistening Teahouse. Signed with a tiny pair of scales."}}, {"op": "show", "who": "baiqiu", "face": "smile", "at": "center"}, {"op": "say", "who": "baiqiu", "t": {"zh": "请坐，林小姐。茶刚泡好。", "en": "Have a seat, Miss Lin. The tea's just made."}}, {"op": "say", "who": null, "t": {"zh": "“喝茶吗？”白衣的说。“别喝茶。”黑衣的说。", "en": "'Some tea?' says the one in white. 'Don't drink the tea,' says the one in black."}}, {"op": "say", "who": "baiqiu", "t": {"zh": "我手里有三条情报，都和你有关。换你修一样东西。", "en": "I have three pieces of information, all about you. In exchange, you mend one thing for me."}}, {"op": "say", "who": null, "t": {"zh": "她把一架巴掌大的黄铜天平放在桌上。左边秤盘边缘有一道裂纹，一直裂到中心。", "en": "She sets a palm-sized brass scale on the table. A crack runs from the left pan's rim to the center."}}, {"op": "say", "who": "baiqiu", "t": {"zh": "第一条：昨晚你修摩天轮的时候，有人在灯塔上看着。第二条：伊芙琳的下一个目标，是卡罗·文斯的墨水瓶。", "en": "One: while you mended the wheel last night, someone watched from the lighthouse. Two: Evelyn's next target is Carlo Vince's Inkwell."}}, {"op": "say", "who": "baiqiu", "t": {"zh": "第三条：断剑的那道断口，是六十年前断的。断剑当时的主人，在钟楼上被一盏灯拦住了——你的那盏灯。提灯的上一任主人，亲手折断了断剑。", "en": "Three: the Sword broke sixty years ago. Its holder was stopped on the clock tower by a lamp—your lamp. The Lamp's last holder broke the Sword with her own hands."}, "face": "serious"}, {"op": "say", "who": null, "t": {"zh": "“是真的。”白衣的说。“是假的。”黑衣的说。两个声音完全重叠。", "en": "'It's true,' says the one in white. 'It's false,' says the one in black. Their voices overlap exactly."}}], "cast": [{"id": "baiqiu"}]}, "c3_end": {"id": "c3_end", "chapter": "c3", "kind": "main", "title": {"zh": "老城区坡道 · 夜", "en": "The old-town slope · night"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "提灯。白秋说的是真的吗？六十年前，你的上一任主人折断了断剑？", "en": "Lamp. Was Bai Qiu telling the truth? Did your last holder break the Sword sixty years ago?"}}], "choices": [{"id": "sleep", "type": "expression", "label": {"zh": "把灯挂回腰上，拉下卷帘门", "en": "Hang the lamp back on my belt and pull down the shutter"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.c3_done", "to": true}], "script": [], "values": ["ji"]}], "salience": 0, "order": 4, "script": [{"op": "bg", "id": "shop_night"}, {"op": "show", "who": "lamp", "face": "normal", "at": "center"}, {"op": "say", "who": "me", "t": {"zh": "提灯。白秋说的是真的吗？六十年前，你的上一任主人折断了断剑？", "en": "Lamp. Was Bai Qiu telling the truth? Did your last holder break the Sword sixty years ago?"}}, {"op": "say", "who": "lamp", "t": {"zh": "……我不记得了。王冠改写规则的时候，会把“改之前是什么样”从所有人的记忆里一起抹掉。连我们也一样。", "en": "…I don't remember. When the Crown rewrites a rule, it wipes what came before from everyone's memory. Us too."}, "face": "sad"}, {"op": "say", "who": "me", "t": {"zh": "灯座底下那两个字母，M. 和 S.，是谁？", "en": "The two letters under your base, M. and S.—who are they?"}, "when": {"v": "flag.saw_initials", "op": "==", "val": true}}, {"op": "say", "who": "lamp", "t": {"zh": "……不知道。可是每次你问，我这里就有一点疼。", "en": "…I don't know. But every time you ask, it hurts a little here."}, "when": {"v": "flag.saw_initials", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "钟楼敲了十二下。", "en": "The clock tower strikes twelve."}}], "cast": [{"id": "lamp"}]}, "s4_bar": {"id": "s4_bar", "chapter": "c4", "kind": "side", "title": {"zh": "锚链酒吧 · 17:30（葛兰）", "en": "The Anchor Chain · 17:30 (Gran)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "葛兰擦同一张桌子擦了三遍。断剑坐在吧台尽头她的老位置上，面前一杯朗姆，一口没动。", "en": "Gran wipes the same table three times. The Sword sits in her old seat at the end of the bar, a rum in front of her, untouched."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_wish", "to": true}, {"add": "rel.sword.warmth", "by": 1}], "script": [], "values": ["ji"]}], "salience": 2, "order": 0, "script": [{"op": "bg", "id": "bar"}, {"op": "say", "who": null, "t": {"zh": "葛兰擦同一张桌子擦了三遍。断剑坐在吧台尽头她的老位置上，面前一杯朗姆，一口没动。", "en": "Gran wipes the same table three times. The Sword sits in her old seat at the end of the bar, a rum in front of her, untouched."}}, {"op": "show", "who": "gran", "face": "serious", "at": "left"}, {"op": "show", "who": "sword", "face": "sad", "at": "right"}, {"op": "say", "who": "gran", "t": {"zh": "说吧。昨晚你为什么放水。", "en": "Out with it. Why did you go easy last night?"}}, {"op": "say", "who": "sword", "t": {"zh": "葛兰，你知道遗器会不会死吗？我们会被打碎，会被埋在泥里，会被忘掉几百年。可我们不会死。", "en": "Gran, do you know if relics can die? We get smashed, buried in mud, forgotten for centuries. But we don't die."}}, {"op": "say", "who": "sword", "t": {"zh": "我换过十一个主人。十一个人，每一个都在我身上交出了他们的恨。没有一个赢过。", "en": "I've had eleven holders. Eleven people, and each of them handed me their hatred. Not one of them ever won."}}, {"op": "say", "who": "sword", "t": {"zh": "我想死。不是被打碎，不是睡过去。是真正地死。能改写世界规则的东西，只有王冠。", "en": "I want to die. Not smashed, not asleep. Really die. Only one thing can rewrite the world's rules: the Crown."}, "face": "sad"}, {"op": "say", "who": "gran", "t": {"zh": "那你为什么不直接去求那个修灯的？", "en": "Then why not just ask the lamp-mender?"}}, {"op": "say", "who": "sword", "t": {"zh": "因为我更想让你赢。十一个主人，没有一个问过我想要什么。你是第一个给我倒酒的人。", "en": "Because I'd rather you won. Eleven holders, and not one asked what I wanted. You're the first who ever poured me a drink."}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "葛兰的喉咙一下子堵住了。", "en": "Something catches in Gran's throat."}}], "cast": [{"id": "gran"}, {"id": "sword"}]}, "s4_hawke": {"id": "s4_hawke", "chapter": "c4", "kind": "side", "title": {"zh": "老城区 · 霍克宅 20:15（葛兰）", "en": "Old town · the Hawke house, 20:15 (Gran)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "十五年前，他就是从这扇门里被赶出去的。书桌后面的皮椅上，坐着一个瘦得像干柴的老人。只有那双眼睛没变。", "en": "Fifteen years ago he was thrown out through this door. In the leather chair behind the desk sits an old man, thin as kindling. Only the eyes haven't changed."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_hawke", "to": true}, {"add": "rel.gran.esteem", "by": 1}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "hawke_study"}, {"op": "say", "who": null, "t": {"zh": "十五年前，他就是从这扇门里被赶出去的。书桌后面的皮椅上，坐着一个瘦得像干柴的老人。只有那双眼睛没变。", "en": "Fifteen years ago he was thrown out through this door. In the leather chair behind the desk sits an old man, thin as kindling. Only the eyes haven't changed."}}, {"op": "show", "who": "gran", "face": "serious", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "书架最上面一层，一个长条形的木匣子。盖子上刻着：霍克家第七代家主 · 阿尔伯特 · 断剑之主。", "en": "On the top shelf, a long wooden case. Carved on the lid: Albert, Seventh Head of the House of Hawke · Master of the Broken Sword."}}, {"op": "say", "who": null, "t": {"zh": "匣子里铺着深红色的天鹅绒，绒面上有一道剑形的凹痕。凹痕里什么都没有。", "en": "Inside, dark-red velvet pressed with the shape of a sword. The hollow is empty."}}, {"op": "say", "who": null, "t": {"zh": "“他输了，回来以后什么都不记得。他坐在窗前二十年，每天从这个匣子里‘拿出’一把剑来擦。临死前，他抓着我的手说：告诉她，对不起。”", "en": "'He lost, and came home remembering nothing. He sat at that window twenty years, taking a sword out of this case every morning to polish. Before he died he gripped my hand and said: tell her I'm sorry.'"}}, {"op": "say", "who": "gran", "t": {"zh": "我不是去跟他们打。我是去送一个朋友。一个喝了十年酒、从来没喝醉过的朋友。", "en": "I'm not going to fight them. I'm going to see a friend off. One who's been drinking for ten years and never once got drunk."}}, {"op": "say", "who": null, "t": {"zh": "他走到门口。身后，父亲的声音很低：“三百一十七张。那天晚上，我数的是三百一十七张。那些符纸，我都留着。”", "en": "At the door, his father's voice, very low: 'Three hundred and seventeen. That night I counted three hundred and seventeen. I kept every one of them.'"}}, {"op": "say", "who": null, "t": {"zh": "葛兰没有回头。他怕自己一看，就再也走不动了。", "en": "Gran doesn't turn around. He's afraid that if he looks, he'll never be able to leave."}}, {"op": "cg", "id": "cg_sealed"}, {"op": "say", "who": null, "t": {"zh": "回到酒吧门口，一个报童模样的人递给他一个墨绿色的信封，蜡封上印着一架小小的天平：六十年前折断断剑的，是提灯的上一任主人。这一任提灯的主人，周五晚上会出现在旧港区的涂鸦街。", "en": "Back at the bar, someone dressed as a paperboy hands him a dark-green envelope, sealed with a tiny pair of scales: The Lamp's last holder broke the Sword sixty years ago. Its current holder will be on Mural Street in the old harbor on Friday night."}}, {"op": "cg", "id": null}], "cast": [{"id": "gran"}]}, "c4_shop": {"id": "c4_shop", "chapter": "c4", "kind": "main", "title": {"zh": "林记修复 · 第四天 14:00", "en": "Lin's Repairs · day four, 14:00"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "下午的铺子很安静。我把一台收音机的后盖拆下来，又装回去，什么都没修。", "en": "The shop is quiet in the afternoon. I take the back off a radio, put it on again, mend nothing."}}], "choices": [{"id": "warn", "type": "strategy", "label": {"zh": "去旧港区找卡罗，提醒他", "en": "Go to the old harbor and warn Carlo"}, "out": [{"text": {"zh": "涂鸦街的尽头，一个荧光绿头发的年轻人蹲在脚手架上，往一面三层楼高的砖墙上喷鲸鱼的轮廓。", "en": "At the end of Mural Street a young man with neon-green hair crouches on scaffolding, spraying the outline of a whale onto a three-story brick wall."}}], "effects": [{"set": "flag.warned_carlo", "to": true}, {"set": "flag.know_ink_rule", "to": true}, {"add": "rel.lamp.trust", "by": 1}], "script": [{"op": "bg", "id": "mural_alley"}, {"op": "show", "who": "carlo", "face": "normal", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "涂鸦街的尽头，一个荧光绿头发的年轻人蹲在脚手架上，往一面三层楼高的砖墙上喷鲸鱼的轮廓。", "en": "At the end of Mural Street a young man with neon-green hair crouches on scaffolding, spraying the outline of a whale onto a three-story brick wall."}}, {"op": "say", "who": "me", "t": {"zh": "伊芙琳·冯·艾希周五会来拿你的墨水瓶。", "en": "Evelyn von Eiche is coming for your Inkwell on Friday."}}, {"op": "say", "who": "carlo", "t": {"zh": "让她来。周五我要让这条鲸鱼游出来，让整条街的人都看见。魔法师们藏了几百年，凭什么？", "en": "Let her. On Friday this whale swims off the wall and the whole street sees it. Wizards have hidden for centuries. Why should they?"}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "他身边，一个戴眼镜的书记员从墨水瓶里探出半个身子，推了推眼镜。", "en": "Beside him, a bespectacled clerk leans halfway out of an inkwell and pushes up his glasses."}}, {"op": "say", "who": "ink", "t": {"zh": "写下来的东西会暂时成真。不过，得先写。", "en": "What is written comes true for a while. But it has to be written first."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "先写。写要时间，要手，要看得见写在哪里。", "en": "Written first. Writing takes time, a hand, and somewhere to see it land."}}, {"op": "say", "who": "me", "t": {"zh": "那就别等她开口。先把字写好。", "en": "Then don't wait for her to speak. Have your words ready."}}, {"op": "say", "who": "carlo", "t": {"zh": "……你这人真奇怪。周五来看吧，修灯的。", "en": "…You're a strange one. Come and watch on Friday, lamp-mender."}, "face": "normal"}], "values": ["xin"]}, {"id": "rest", "type": "expression", "label": {"zh": "留在铺子里，把身体和灯都养好", "en": "Stay in the shop; let both body and lamp recover"}, "out": [{"text": {"zh": "我把灯放在柜台上，用软布擦了一下午。灯芯的火苗慢慢站直了。", "en": "I set the lamp on the counter and polish it all afternoon. The flame on the wick slowly straightens."}}], "effects": [{"add": "light", "by": 1}, {"add": "rel.lamp.warmth", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "我把灯放在柜台上，用软布擦了一下午。灯芯的火苗慢慢站直了。", "en": "I set the lamp on the counter and polish it all afternoon. The flame on the wick slowly straightens."}}, {"op": "say", "who": "lamp", "t": {"zh": "……谢谢。很舒服。", "en": "…Thanks. That's nice."}, "face": "smile"}], "values": ["shou"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "shop_day"}, {"op": "show", "who": "lamp", "face": "normal", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "下午的铺子很安静。我把一台收音机的后盖拆下来，又装回去，什么都没修。", "en": "The shop is quiet in the afternoon. I take the back off a radio, put it on again, mend nothing."}}, {"op": "say", "who": "lamp", "t": {"zh": "你在想白秋说的事。伊芙琳的下一个目标，是卡罗·文斯的墨水瓶。", "en": "You're thinking about what Bai Qiu said. Evelyn's next target is Carlo Vince's Inkwell."}}, {"op": "say", "who": "me", "t": {"zh": "周五晚上。还有三天。", "en": "Friday night. Three days."}}, {"op": "say", "who": "lamp", "t": {"zh": "那不是你的仗。", "en": "That isn't your fight."}}, {"op": "say", "who": "me", "t": {"zh": "如果她拿到第二件，就会去拿第三件。迟早轮到我。", "en": "If she gets a second, she'll go for a third. Sooner or later it's me."}}], "cast": [{"id": "lamp"}]}, "c4_night": {"id": "c4_night", "chapter": "c4", "kind": "main", "title": {"zh": "林记修复 · 周五 21:30", "en": "Lin's Repairs · Friday, 21:30"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "周五。我把风衣穿上，把灯挂在腰上。", "en": "Friday. I put on my coat and hang the lamp from my belt."}}], "choices": [{"id": "early", "type": "strategy", "label": {"zh": "早点出门，十点半之前到涂鸦街", "en": "Leave early; reach Mural Street before ten thirty"}, "out": [{"text": {"zh": "我抄近路下了坡。港口的风里有油漆味。", "en": "I take the shortcut down the slope. The harbor wind smells of paint."}}], "effects": [{"set": "flag.go_early", "to": true}, {"set": "flag.c4_done", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "我抄近路下了坡。港口的风里有油漆味。", "en": "I take the shortcut down the slope. The harbor wind smells of paint."}}], "values": ["yong"], "when": {"v": "flag.warned_carlo", "op": "==", "val": true}}, {"id": "late", "type": "expression", "label": {"zh": "等灯再亮一点再走", "en": "Wait until the lamp is a little brighter"}, "out": [{"text": {"zh": "等我出门，已经快十一点了。", "en": "By the time I leave it's nearly eleven."}}], "effects": [{"add": "light", "by": 1}, {"set": "flag.c4_done", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "等我出门，已经快十一点了。", "en": "By the time I leave it's nearly eleven."}}], "values": ["shou"]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "shop_night"}, {"op": "show", "who": "lamp", "face": "normal", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "周五。我把风衣穿上，把灯挂在腰上。", "en": "Friday. I put on my coat and hang the lamp from my belt."}}, {"op": "say", "who": null, "t": {"zh": "手机上有一条短信，号码不认识：今晚十点半，最大的那条。——卡罗", "en": "A text from a number I don't know: Ten thirty tonight. The biggest one. —Carlo"}, "when": {"v": "flag.warned_carlo", "op": "==", "val": true}}, {"op": "say", "who": "lamp", "t": {"zh": "林栖。如果今晚你要全力出手，告诉我一声。我好挑。", "en": "Lin. If you go all out tonight, warn me. So I can choose."}, "face": "sad"}, {"op": "say", "who": "me", "t": {"zh": "挑什么？", "en": "Choose what?"}}, {"op": "say", "who": "lamp", "t": {"zh": "挑一段你最不会想念的。……虽然没有这种东西。", "en": "One you'd miss least. …Though there's no such thing."}}], "cast": [{"id": "lamp"}]}, "s5_carlo": {"id": "s5_carlo", "chapter": "c5", "kind": "side", "title": {"zh": "涂鸦街 · 22:30（卡罗）", "en": "Mural Street · 22:30 (Carlo)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "卡罗·文斯画过整座维斯特林。每一幅画，第二天早上都会被市政的人刷掉。他被抓过十一次，罚过三十多次款。", "en": "Carlo Vince has painted all of Westerling. Every piece is scrubbed off by the city by morning. Arrested eleven times, fined more than thirty."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_carlo", "to": true}, {"add": "rel.carlo.warmth", "by": 1}], "script": [], "values": ["ji"]}], "salience": 2, "order": 0, "script": [{"op": "bg", "id": "mural_alley"}, {"op": "show", "who": "carlo", "face": "normal", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "卡罗·文斯画过整座维斯特林。每一幅画，第二天早上都会被市政的人刷掉。他被抓过十一次，罚过三十多次款。", "en": "Carlo Vince has painted all of Westerling. Every piece is scrubbed off by the city by morning. Arrested eleven times, fined more than thirty."}}, {"op": "say", "who": null, "t": {"zh": "只有一个小女孩看过他的鲸鱼以后，问他：叔叔，它会游走吗？那天晚上，他在旧货市场买到了一个墨水瓶。", "en": "Only one little girl ever looked at his whale and asked: will it swim away? That night he bought an inkwell at a flea market."}}, {"op": "cg", "id": "cg_m_paint"}, {"op": "say", "who": "ink", "t": {"zh": "写什么？", "en": "What shall I write?"}}, {"op": "say", "who": "carlo", "t": {"zh": "老样子。让它游。", "en": "Same as always. Let it swim."}, "face": "smile"}, {"op": "cg", "id": "cg_m_whale"}, {"op": "say", "who": null, "t": {"zh": "鲸鱼眨了一下眼睛，从墙上游了出来。肚子上的星星一颗一颗地亮起来，把整条街照成了深蓝色的海底。窗户里，有人探出了头。", "en": "The whale blinks and swims out of the wall. The stars on its belly light one by one, turning the street into a deep-blue seabed. Heads lean out of windows."}}, {"op": "say", "who": "carlo", "t": {"zh": "他们只是没有机会知道，世界可以比他们以为的更大。", "en": "They've just never had the chance to learn the world could be bigger than they thought."}}, {"op": "cg", "id": null}], "cast": [{"id": "carlo"}]}, "s5_evelyn": {"id": "s5_evelyn", "chapter": "c5", "kind": "side", "title": {"zh": "艾希大厦顶层 · 21:50（伊芙琳）", "en": "Eiche Tower, top floor · 21:50 (Evelyn)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "伊芙琳·冯·艾希对打架没有兴趣。她对“赢”有兴趣。打架只是赢的一种方式，而且是最笨的一种。", "en": "Evelyn von Eiche has no interest in fighting. She is interested in winning. Fighting is just one way to win, and the stupidest."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_evelyn_why", "to": true}, {"add": "rel.evelyn.esteem", "by": 1}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "eiche_top"}, {"op": "show", "who": "evelyn", "face": "normal", "at": "left"}, {"op": "show", "who": "poet", "face": "normal", "at": "right"}, {"op": "say", "who": null, "t": {"zh": "伊芙琳·冯·艾希对打架没有兴趣。她对“赢”有兴趣。打架只是赢的一种方式，而且是最笨的一种。", "en": "Evelyn von Eiche has no interest in fighting. She is interested in winning. Fighting is just one way to win, and the stupidest."}}, {"op": "say", "who": "poet", "t": {"zh": "我的小姐，您还没告诉我，您为什么想赢。", "en": "My lady, you still haven't told me why you want to win."}}, {"op": "say", "who": "evelyn", "t": {"zh": "赢了以后再想。", "en": "I'll think about it after I win."}, "face": "serious"}, {"op": "say", "who": "poet", "t": {"zh": "荆棘冠每次替您开口，都会收下一点东西。关于您自己的骄傲。", "en": "Every time the Crown speaks for you, it keeps something. A little of your pride in yourself."}, "face": "serious"}, {"op": "say", "who": "evelyn", "t": {"zh": "那就收。我本来也不需要那个。", "en": "Let it. I never needed that anyway."}}, {"op": "say", "who": null, "t": {"zh": "诗人深深地鞠了一躬，嘴角微微翘了起来。", "en": "The poet bows deeply; the corner of his mouth lifts."}}], "cast": [{"id": "evelyn"}, {"id": "poet"}]}, "c5_alley": {"id": "c5_alley", "chapter": "c5", "kind": "main", "title": {"zh": "涂鸦街 · 22:41", "en": "Mural Street · 22:41"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "choices": [{"id": "first", "type": "strategy", "label": {"zh": "冲卡罗喊：“现在就写！别等她开口！”", "en": "Shout to Carlo: 'Write it now! Don't wait for her to speak!'"}, "out": [{"text": {"zh": "卡罗！先写！", "en": "Carlo! Write first!"}}], "effects": [{"set": "flag.helped_carlo", "to": true}, {"set": "flag.saw_evelyn_win", "to": true}, {"add": "rel.carlo.trust", "by": 2}, {"add": "rel.evelyn.esteem", "by": 2}], "script": [{"op": "say", "who": "me", "t": {"zh": "卡罗！先写！", "en": "Carlo! Write first!"}}, {"op": "say", "who": null, "t": {"zh": "羽毛笔在空中飞快地写了一行红字：荆棘烧尽。", "en": "The quill races through the air in red: Thorns, burn."}}, {"op": "cg", "id": "cg_m_inkfire"}, {"op": "say", "who": null, "t": {"zh": "红色的字迹变成了火，顺着荆棘一路烧过去。伊芙琳往后退了一步，大衣的下摆着了火。", "en": "The red letters become fire, running along the thorns. Evelyn steps back; the hem of her coat catches."}}, {"op": "say", "who": "evelyn", "t": {"zh": "……你看出来了。写比说慢。所以要先写。", "en": "…You saw it. Writing is slower than speech. So you write first."}, "face": "surprised"}, {"op": "say", "who": "evelyn", "t": {"zh": "那就让他写不出来。卡罗，你的手。", "en": "Then he won't write at all. Carlo, your hands."}, "face": "serious"}, {"op": "say", "who": null, "t": {"zh": "两个字，变成两根荆棘，在下一行字落下之前缠住了他的手腕。羽毛笔掉在地上。", "en": "Two words, two thorns, around his wrists before the next line can fall. The quill drops."}}, {"op": "say", "who": null, "t": {"zh": "可她没有再封他的眼睛和嘴。她弯腰捡起墨水瓶的时候，看了我一眼。", "en": "But she doesn't bind his eyes or mouth. Bending to pick up the Inkwell, she glances at me."}}, {"op": "cg", "id": null}], "values": ["yong"], "when": {"all": [{"v": "flag.go_early", "op": "==", "val": true}, {"v": "flag.know_ink_rule", "op": "==", "val": true}]}}, {"id": "watch", "type": "expression", "label": {"zh": "看着。记住她每一句话变成什么", "en": "Watch. Remember what each of her words becomes"}, "out": [{"text": {"zh": "“你的手。你的眼睛。你的嘴。”三句话，三根荆棘。说比写快，快很多。", "en": "'Your hands. Your eyes. Your mouth.' Three sentences, three thorns. Speech is faster than writing. Much faster."}}], "effects": [{"set": "flag.saw_evelyn_win", "to": true}, {"add": "rel.evelyn.esteem", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "“你的手。你的眼睛。你的嘴。”三句话，三根荆棘。说比写快，快很多。", "en": "'Your hands. Your eyes. Your mouth.' Three sentences, three thorns. Speech is faster than writing. Much faster."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "她每一次都先说要缠住什么。她得说出来。", "en": "Every time, she names what to bind first. She has to say it."}}], "values": ["ji"], "when": {"v": "flag.go_early", "op": "==", "val": true}}, {"id": "free", "type": "expression", "label": {"zh": "“他已经输了。放开他。”", "en": "'He's already lost. Let him go.'"}, "out": [{"text": {"zh": "他输了。", "en": "He lost."}}], "effects": [{"add": "rel.carlo.trust", "by": 1}, {"add": "rel.evelyn.esteem", "by": 1}], "script": [{"op": "say", "who": "evelyn", "t": {"zh": "他输了。", "en": "He lost."}}, {"op": "say", "who": "me", "t": {"zh": "所以你不需要再绑着他。", "en": "So you don't need to keep him bound."}}, {"op": "say", "who": null, "t": {"zh": "她看了我一眼，像是有点意外。然后抬了抬手指，荆棘一根一根枯萎，化成了黑色的灰。", "en": "She looks at me as if mildly surprised. Then she lifts a finger, and the thorns wither one by one into black ash."}}], "values": ["xiu"], "when": {"v": "flag.go_early", "op": "!=", "val": true}}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "mural_alley"}, {"op": "say", "who": null, "t": {"zh": "我赶到的时候，鲸鱼还在半空中游。街口站着一个穿红大衣的女人。", "en": "When I arrive the whale is still swimming in midair. A woman in a red coat stands at the mouth of the street."}, "when": {"v": "flag.go_early", "op": "==", "val": true}}, {"op": "cg", "id": "cg_m_challenge", "when": {"v": "flag.go_early", "op": "==", "val": true}}, {"op": "say", "who": "evelyn", "t": {"zh": "卡罗·文斯。你在普通人面前使用遗器。守秘局那个老古董太慢了，我替他收。", "en": "Carlo Vince. You used a relic in front of ordinary people. The Bureau's old relic is too slow; I'll collect for him."}, "when": {"v": "flag.go_early", "op": "==", "val": true}}, {"op": "cg", "id": "cg_m_thorn", "when": {"v": "flag.go_early", "op": "==", "val": true}}, {"op": "say", "who": "evelyn", "t": {"zh": "鲸鱼，落下来。", "en": "Whale. Fall."}, "face": "serious", "when": {"v": "flag.go_early", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "她说出的每一个字，都在半空中变成了一根带刺的藤。蓝色的颜料像血一样往下淌。", "en": "Every word she speaks becomes a thorned vine in the air. Blue paint drips like blood."}, "when": {"v": "flag.go_early", "op": "==", "val": true}}, {"op": "cg", "id": null, "when": {"v": "flag.go_early", "op": "==", "val": true}}, {"op": "cg", "id": "cg_m_spilled", "when": {"v": "flag.go_early", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "我赶到的时候，一切都结束了。满地都是蓝色的油漆，像一条被打碎的河。卡罗跪在中间，手腕、眼睛和嘴上缠着黑色的荆棘。", "en": "When I arrive it's all over. Blue paint everywhere, like a shattered river. Carlo kneels in the middle, black thorns around his wrists, his eyes, his mouth."}, "when": {"v": "flag.go_early", "op": "!=", "val": true}}, {"op": "cg", "id": null, "when": {"v": "flag.go_early", "op": "!=", "val": true}}, {"op": "show", "who": "evelyn", "face": "normal", "at": "center", "when": {"v": "flag.go_early", "op": "!=", "val": true}}, {"op": "say", "who": "evelyn", "t": {"zh": "修灯的。你来晚了。不过也没关系，你来早了也拦不住我。", "en": "Lamp-mender. You're late. Not that it matters; you couldn't have stopped me early either."}, "when": {"v": "flag.go_early", "op": "!=", "val": true}}], "cast": [{"id": "evelyn"}, {"id": "carlo"}]}, "c5_ask": {"id": "c5_ask", "chapter": "c5", "kind": "main", "title": {"zh": "涂鸦街 · 22:56", "en": "Mural Street · 22:56"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "我扶住卡罗，用指尖碰了碰他手腕上的伤口。伤口在指尖下慢慢合拢了。伊芙琳把深蓝色的墨水瓶举在路灯下看。", "en": "I hold Carlo up and touch the cut on his wrist. It closes under my fingertip. Evelyn holds the dark-blue Inkwell up to the streetlight."}}], "choices": [{"id": "why", "type": "expression", "label": {"zh": "“你为什么想赢？”", "en": "'Why do you want to win?'"}, "out": [{"text": {"zh": "你赢了，会改写一条规则。会影响所有人，包括他，包括那些刚刚关上窗户的人。我想知道你要改什么。", "en": "If you win you'll rewrite a rule. It touches everyone—him, the people who just shut their windows. I want to know what you'll change."}}], "effects": [{"set": "flag.asked_evelyn", "to": true}, {"add": "rel.evelyn.trust", "by": 1}, {"add": "rel.evelyn.esteem", "by": 1}], "script": [{"op": "say", "who": "me", "t": {"zh": "你赢了，会改写一条规则。会影响所有人，包括他，包括那些刚刚关上窗户的人。我想知道你要改什么。", "en": "If you win you'll rewrite a rule. It touches everyone—him, the people who just shut their windows. I want to know what you'll change."}}, {"op": "say", "who": "evelyn", "t": {"zh": "……我还没想好。", "en": "…I haven't decided."}, "face": "sad"}, {"op": "say", "who": "me", "t": {"zh": "没想好就去打仗？", "en": "You go to war without deciding?"}}, {"op": "say", "who": "evelyn", "t": {"zh": "没想好，也可以先赢。", "en": "You can win first and decide after."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "“赢了以后再想。”她对诗人也是这么说的。一字不差。", "en": "'I'll think about it after I win.' Word for word what she told the poet."}, "when": {"v": "flag.know_evelyn_why", "op": "==", "val": true}}], "values": ["xin"]}, {"id": "quiet", "type": "strategy", "label": {"zh": "什么都不说，只是看着她的手", "en": "Say nothing; just watch her hands"}, "out": [{"text": {"zh": "她握墨水瓶的手，在手套里轻轻蜷了一下。像是有什么东西被抽走了，很轻，很快。", "en": "The hand holding the Inkwell curls slightly inside its glove. As if something were drawn out of her, light and quick."}}], "effects": [{"add": "rel.evelyn.esteem", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "她握墨水瓶的手，在手套里轻轻蜷了一下。像是有什么东西被抽走了，很轻，很快。", "en": "The hand holding the Inkwell curls slightly inside its glove. As if something were drawn out of her, light and quick."}}], "values": ["shou"]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "mural_alley"}, {"op": "cg", "id": "cg_m_after"}, {"op": "say", "who": null, "t": {"zh": "我扶住卡罗，用指尖碰了碰他手腕上的伤口。伤口在指尖下慢慢合拢了。伊芙琳把深蓝色的墨水瓶举在路灯下看。", "en": "I hold Carlo up and touch the cut on his wrist. It closes under my fingertip. Evelyn holds the dark-blue Inkwell up to the streetlight."}}, {"op": "say", "who": "evelyn", "t": {"zh": "你很喜欢修东西。那就别做别的。回家去，修你的收音机。这场仗不适合你。", "en": "You like mending things. So don't do anything else. Go home and fix your radios. This war isn't for you."}}, {"op": "cg", "id": null}, {"op": "show", "who": "evelyn", "face": "normal", "at": "center"}], "cast": [{"id": "evelyn"}]}, "c5_gran": {"id": "c5_gran", "chapter": "c5", "kind": "main", "title": {"zh": "涂鸦街 · 23:02", "en": "Mural Street · 23:02"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "修灯的，你后面有人。", "en": "Lamp-mender. Someone's behind you."}}], "choices": [{"id": "guard", "type": "strategy", "label": {"zh": "他要砍的不是我——两只手握住我和提灯之间的那根线", "en": "It isn't me he'll cut—grip the line between me and the Lamp with both hands"}, "out": [{"text": {"zh": "摩天轮底下，他砍的是连结。今晚也一样。他要先断我的灯。", "en": "Under the wheel, he cut links. Tonight is no different. He'll sever my lamp first."}}], "effects": [{"set": "flag.guarded_line", "to": true}, {"set": "flag.told_gran_mum", "to": true}, {"add": "rel.gran.esteem", "by": 2}, {"add": "rel.gran.trust", "by": 1}, {"add": "rel.lamp.trust", "by": 1}], "script": [{"op": "say", "who": "me", "think": true, "t": {"zh": "摩天轮底下，他砍的是连结。今晚也一样。他要先断我的灯。", "en": "Under the wheel, he cut links. Tonight is no different. He'll sever my lamp first."}}, {"op": "say", "who": null, "t": {"zh": "我没有摘灯。我闭上眼，用修复术去“握”住胸口那根看不见的弦。", "en": "I don't unhook the lamp. I close my eyes and use the mending to hold the invisible string in my chest."}}, {"op": "say", "who": null, "t": {"zh": "断剑落下来，砍在弦上。弦嗡的一声，弯了——没有断。我一直在修它，他砍一寸，我接一寸。", "en": "The Sword comes down on the string. It thrums and bends—and holds. I keep mending it; for every inch he cuts, I join one."}}, {"op": "say", "who": "sword", "t": {"zh": "……葛兰。她第三次看穿你了。", "en": "…Gran. That's the third time she's read you."}, "face": "smile"}, {"op": "say", "who": "gran", "t": {"zh": "你为什么不用全力？", "en": "Why won't you go all out?"}, "face": "serious"}, {"op": "say", "who": "me", "t": {"zh": "我怕忘了她。我妈妈。", "en": "I'm afraid of forgetting her. My mum."}}, {"op": "say", "who": null, "t": {"zh": "葛兰的手指在剑柄上收紧了。远处，警笛声越来越近。", "en": "Gran's fingers tighten on the hilt. In the distance, sirens getting closer."}}, {"op": "say", "who": "gran", "t": {"zh": "下一次，你要是还不用全力，我就真的砍你了。", "en": "Next time, if you still won't go all out, I really will cut you."}}], "values": ["shou"], "when": {"any": [{"v": "flag.know_cut", "op": "==", "val": true}, {"v": "flag.blocked_cut", "op": "==", "val": true}]}}, {"id": "full", "type": "dilemma", "label": {"zh": "“提灯——”全力（会交出一段记忆）", "en": "'Lamp—' all out (costs a memory)"}, "out": [{"text": {"zh": "灯火炸开。断剑砍在白光里，像砍进了一面墙。葛兰被光推出去七八米，靠在一面画满鲸鱼的墙上。", "en": "The light bursts. The Sword strikes into the white like striking a wall. Gran is shoved back seven or eight meters against a wall of painted whales."}}], "effects": [{"set": "mem.musicbox", "to": false}, {"add": "memories", "by": -1}, {"set": "flag.c5_full", "to": true}, {"add": "notice", "by": 2}, {"add": "light", "by": 1}, {"add": "rel.gran.esteem", "by": 1}, {"add": "rel.lamp.trust", "by": -1}], "script": [{"op": "say", "who": null, "t": {"zh": "灯火炸开。断剑砍在白光里，像砍进了一面墙。葛兰被光推出去七八米，靠在一面画满鲸鱼的墙上。", "en": "The light bursts. The Sword strikes into the white like striking a wall. Gran is shoved back seven or eight meters against a wall of painted whales."}}, {"op": "say", "who": null, "t": {"zh": "那种被抽走的感觉来了。五岁，梧桐树底下，一只八音盒。妈妈叫我吃饭，我说它现在就坏着，它现在就难受。", "en": "The emptying comes. Five years old, under the plane tree, a music box. Mum calls me in to eat; I say it's broken right now, it hurts right now."}}, {"op": "say", "who": "lamp", "t": {"zh": "第三段。你第一次修好的八音盒。我收下了。", "en": "The third. The first music box you ever mended. I'll keep it."}, "forget": true}, {"op": "say", "who": null, "t": {"zh": "整条涂鸦街都被照亮了。街两边的窗户里，有人尖叫。", "en": "The whole of Mural Street lights up. In the windows on either side, someone screams."}}, {"op": "say", "who": "gran", "t": {"zh": "……这才像样。", "en": "…That's more like it."}, "face": "battle"}, {"op": "say", "who": "sword", "t": {"zh": "葛兰，走吧。守秘局的人马上就到。", "en": "Gran, let's go. The Bureau's almost here."}, "face": "sad"}], "values": ["yong"]}, {"id": "hesitate", "type": "expression", "label": {"zh": "（手在抖）", "en": "(My hands are shaking)"}, "out": [{"text": {"zh": "就这一瞬间的犹豫，葛兰已经到了面前。断剑没有砍我，它砍的是我和提灯之间的那根线。腰上的灯一下子变得冰凉。", "en": "In that one moment of hesitation Gran is on me. The Sword doesn't cut me; it cuts the line between me and the Lamp. The lamp at my belt goes cold."}}], "effects": [{"set": "flag.c5_hurt", "to": true}, {"set": "flag.told_gran_mum", "to": true}, {"add": "light", "by": -1}, {"add": "rel.gran.warmth", "by": 1}, {"add": "rel.sword.warmth", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "就这一瞬间的犹豫，葛兰已经到了面前。断剑没有砍我，它砍的是我和提灯之间的那根线。腰上的灯一下子变得冰凉。", "en": "In that one moment of hesitation Gran is on me. The Sword doesn't cut me; it cuts the line between me and the Lamp. The lamp at my belt goes cold."}}, {"op": "say", "who": "lamp", "t": {"zh": "接上！", "en": "Rejoin it!"}}, {"op": "say", "who": null, "t": {"zh": "我抓了两次，都没有抓住。缠着绷带的拳头，正正地砸在我的腹部。我撞在墙上，又摔进了满地的蓝色油漆里。", "en": "I grab twice and miss both times. A bandaged fist lands square in my stomach. I hit the wall and slide down into the blue paint."}}, {"op": "say", "who": "sword", "t": {"zh": "葛兰，够了。她不想打。你看不出来吗？她怕再交出去什么。", "en": "Gran, enough. She doesn't want to fight. Can't you see? She's afraid of giving up anything else."}, "face": "sad"}, {"op": "say", "who": "gran", "t": {"zh": "你为什么不用全力？", "en": "Why won't you go all out?"}, "face": "serious"}, {"op": "say", "who": "me", "t": {"zh": "……我怕忘了她。我妈妈。", "en": "…I'm afraid of forgetting her. My mum."}}, {"op": "say", "who": "gran", "t": {"zh": "下一次，你要是还不用全力，我就真的砍你了。", "en": "Next time, if you still won't go all out, I really will cut you."}}, {"op": "say", "who": null, "t": {"zh": "他走了。夜空被两边的楼夹成一条细缝，缝里有一颗很淡的星星。腰上的灯没有温度。我闭上了眼睛。", "en": "He leaves. The sky is a thin slit between the buildings, with one faint star in it. The lamp at my belt has no warmth. I close my eyes."}}], "values": ["xin"]}, {"id": "chase", "type": "strategy", "label": {"zh": "不理他，转身去追伊芙琳的墨水瓶", "en": "Ignore him and turn to chase Evelyn and the Inkwell"}, "out": [{"text": {"zh": "我背对着他跑出去三步。第四步的时候，胸口那根弦断了，断得干干净净。", "en": "I run three steps with my back to him. On the fourth, the string in my chest snaps, cleanly."}}], "effects": [{"set": "flag.dead_alley", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "我背对着他跑出去三步。第四步的时候，胸口那根弦断了，断得干干净净。", "en": "I run three steps with my back to him. On the fourth, the string in my chest snaps, cleanly."}}, {"op": "say", "who": null, "t": {"zh": "这一次，没有人喊“接上”。", "en": "This time no one shouts 'Rejoin it'."}}], "values": ["duo"], "ends": true}], "salience": 0, "order": 3, "script": [{"op": "bg", "id": "mural_alley"}, {"op": "say", "who": "evelyn", "t": {"zh": "修灯的，你后面有人。", "en": "Lamp-mender. Someone's behind you."}}, {"op": "show", "who": "gran", "face": "battle", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "涂鸦街的另一头，站着葛兰。拳头上缠着白色的绷带，手里拎着半截发着冷光的断剑。他的脸上什么表情都没有，像一块石头。", "en": "At the other end of the street stands Gran. White bandages on his fists, the half-sword glowing cold in his hand. His face shows nothing at all, like stone."}}, {"op": "say", "who": "gran", "t": {"zh": "六十年前，是你那盏灯的上一任主人，折断了断剑。", "en": "Sixty years ago, your lamp's last holder broke the Sword."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "墨绿色的信，天平的蜡封。白秋也给他送了一份。", "en": "A dark-green letter with a scales seal. Bai Qiu sent him one too."}, "when": {"v": "flag.know_hawke", "op": "==", "val": true}}, {"op": "say", "who": "gran", "t": {"zh": "我不在乎六十年前发生了什么。我只在乎一件事：我要赢。", "en": "I don't care what happened sixty years ago. I care about one thing: winning."}}, {"op": "say", "who": null, "t": {"zh": "他冲了过来。我伸手去摘腰上的灯——手停住了。如果我再全力出手一次，提灯会拿走什么？", "en": "He charges. I reach for the lamp at my belt—and my hand stops. If I go all out again, what will the Lamp take?"}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "“我想让我的最后一个主人，是给我倒酒的那个。”他是在替她打。", "en": "'I want my last holder to be the one who poured me a drink.' He's fighting for her."}, "when": {"v": "flag.know_wish", "op": "==", "val": true}}], "cast": [{"id": "gran"}, {"id": "sword"}, {"id": "lamp"}]}, "c5_end": {"id": "c5_end", "chapter": "c5", "kind": "main", "title": {"zh": "涂鸦街口 · 23:20", "en": "Mouth of Mural Street · 23:20"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "守秘局的车开进了街口。一个西装扣子扣到最上面一颗的老人走过来，看了看满地的蓝色，又看了看我。", "en": "Bureau cars pull into the street. An old man with his jacket buttoned to the top walks over, looks at the blue everywhere, then at me."}}], "choices": [{"id": "go", "type": "expression", "label": {"zh": "上车", "en": "Get in the car"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.c5_done", "to": true}], "script": [], "values": ["xin"]}], "salience": 0, "order": 4, "script": [{"op": "bg", "id": "mural_alley"}, {"op": "show", "who": "august", "face": "normal", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "守秘局的车开进了街口。一个西装扣子扣到最上面一颗的老人走过来，看了看满地的蓝色，又看了看我。", "en": "Bureau cars pull into the street. An old man with his jacket buttoned to the top walks over, looks at the blue everywhere, then at me."}}, {"op": "say", "who": "august", "t": {"zh": "林小姐。整条街的人都看见了。我需要一个晚上，和很多燃气公司的通知单。", "en": "Miss Lin. The whole street saw that. I'll need a night and a great many gas-company notices."}, "face": "serious", "when": {"v": "flag.c5_full", "op": "==", "val": true}}, {"op": "say", "who": "august", "t": {"zh": "别说话。我送您去医院。那里有一位医生，不问问题。", "en": "Don't talk. I'll take you to hospital. There's a doctor there who doesn't ask questions."}, "when": {"v": "flag.c5_hurt", "op": "==", "val": true}}, {"op": "say", "who": "august", "t": {"zh": "您没受伤？……那请帮我扶一下文斯先生。他得去医院。", "en": "You're not hurt? …Then please help me with Mr. Vince. He needs a hospital."}, "when": {"all": [{"v": "flag.c5_full", "op": "!=", "val": true}, {"v": "flag.c5_hurt", "op": "!=", "val": true}]}}], "cast": [{"id": "august"}]}, "s6_cradle": {"id": "s6_cradle", "chapter": "c6", "kind": "side", "title": {"zh": "中心医院急诊科 · 凌晨 00:40（苏蔓）", "en": "Central Hospital, emergency · 00:40 (Su Man)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "苏蔓这周上了六个夜班。消毒水的味道浓得能把鼻子腌透，她早就闻不出来了。", "en": "Su Man has worked six night shifts this week. The disinfectant could pickle a nose; she stopped smelling it long ago."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_cradle", "to": true}, {"add": "rel.suman.esteem", "by": 1}], "script": [], "values": ["ji"]}], "salience": 2, "order": 0, "script": [{"op": "bg", "id": "ward"}, {"op": "show", "who": "suman", "face": "sad", "at": "left"}, {"op": "say", "who": null, "t": {"zh": "苏蔓这周上了六个夜班。消毒水的味道浓得能把鼻子腌透，她早就闻不出来了。", "en": "Su Man has worked six night shifts this week. The disinfectant could pickle a nose; she stopped smelling it long ago."}}, {"op": "say", "who": null, "t": {"zh": "守秘局送来一个短头发的年轻女人，满身蓝色油漆，手里死死攥着一盏黄铜提灯，护士怎么掰都掰不开。", "en": "The Bureau brings in a short-haired young woman covered in blue paint, a brass lamp clenched in her hand so tight the nurses can't pry it loose."}}, {"op": "say", "who": null, "t": {"zh": "三个月前，苏蔓在医院地下室捡到了一只木头摇篮。从那以后，一个戴面纱的女人跟着她，一言不发。", "en": "Three months ago Su Man found a wooden cradle in the hospital basement. Since then a veiled woman has followed her, silent."}}, {"op": "cg", "id": "cg_cradle"}, {"op": "show", "who": "cradle", "face": "normal", "at": "right"}, {"op": "say", "who": "cradle", "t": {"zh": "让她睡吧。她太累了。她已经失去了太多。只要你愿意，我可以让她一直睡下去，直到所有人都忘了她。", "en": "Let her sleep. She's so tired. She has lost too much already. If you wish it, I can let her sleep until everyone forgets her."}}, {"op": "say", "who": "suman", "t": {"zh": "不。我是医生。我的病人，要醒过来。痛不痛，要不要继续打，是她醒过来以后自己决定的。", "en": "No. I'm a doctor. My patient wakes up. Whether it hurts, whether she keeps fighting—that's hers to decide when she's awake."}, "face": "serious"}, {"op": "cg", "id": null}, {"op": "say", "who": null, "t": {"zh": "她看着那盏灯。“小时候，我外婆家的阁楼上，挂过一盏一模一样的。”", "en": "She looks at the lamp. 'When I was little, there was one exactly like it hanging in my grandmother's attic.'"}}], "cast": [{"id": "suman"}, {"id": "cradle"}]}, "s6_twins": {"id": "s6_twins", "chapter": "c6", "kind": "side", "title": {"zh": "〇号线废弃隧道 · 21:00（雷恩兄弟）", "en": "Line Zero tunnel · 21:00 (the Rhine brothers)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "雷恩兄弟出生的时候只隔了四分钟。十八岁那年他们黑进了银行，被抓了。哥哥亚当替弟弟扛下所有罪名，坐了三年牢。", "en": "The Rhine brothers were born four minutes apart. At eighteen they hacked a bank and were caught. Adam, the elder, took the whole blame and served three years."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_twins", "to": true}, {"add": "rel.ben.warmth", "by": 1}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "metro"}, {"op": "cg", "id": "cg_t_ambush"}, {"op": "say", "who": null, "t": {"zh": "雷恩兄弟出生的时候只隔了四分钟。十八岁那年他们黑进了银行，被抓了。哥哥亚当替弟弟扛下所有罪名，坐了三年牢。", "en": "The Rhine brothers were born four minutes apart. At eighteen they hacked a bank and were caught. Adam, the elder, took the whole blame and served three years."}}, {"op": "say", "who": null, "t": {"zh": "出狱那天以后，亚当再没摘下过那副耳机，本再没摘下过那个口罩。", "en": "Since the day he got out, Adam has never taken off his headphones, and Ben has never taken off his mask."}}, {"op": "cg", "id": null}, {"op": "show", "who": "adam", "face": "normal", "at": "left"}, {"op": "show", "who": "ben", "face": "normal", "at": "right"}, {"op": "say", "who": "adam", "t": {"zh": "镜子照过她的修复术。修复的反面，就是拆解。只是威力只有原版的一半。", "en": "The mirror caught her mending. The flip side of mending is unmaking. At half the strength of the original."}}, {"op": "say", "who": "ben", "t": {"zh": "哥，我们为什么要打她？她手里只有一件。", "en": "Why her, though? She's only got one."}}, {"op": "say", "who": "adam", "t": {"zh": "因为打伊芙琳会死。打她，不会。", "en": "Because fighting Evelyn gets us killed. Fighting her won't."}}, {"op": "cg", "id": "cg_t_watch"}, {"op": "say", "who": null, "t": {"zh": "本摸了摸脖子上的铜怀表。钟拿走的，是时间的顺序。他有时候分不清，哥哥是先坐牢，还是先出狱。", "en": "Ben touches the brass pocket watch at his throat. The Clock takes the order of time. Some days he can't tell whether his brother went to prison first or came out first."}}, {"op": "say", "who": null, "t": {"zh": "他想要的那条规则，从来没告诉过亚当：他想让自己，可以不再是亚当的弟弟。", "en": "The rule he wants, he has never told Adam: to no longer have to be Adam's little brother."}}, {"op": "cg", "id": null}], "cast": [{"id": "adam"}, {"id": "ben"}]}, "s6_kite": {"id": "s6_kite", "chapter": "c6", "kind": "side", "title": {"zh": "北区 · 老公寓屋顶 23:40（伊芙琳）", "en": "North side · an old rooftop, 23:40 (Evelyn)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "战斗只持续了两分钟。“风筝的线，断。”一根细得像丝的荆棘，缠住了器灵和主人之间那根看不见的线。", "en": "The fight lasts two minutes. 'Kite string. Break.' A thorn fine as silk catches the invisible line between spirit and holder."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_pride", "to": true}, {"add": "rel.evelyn.warmth", "by": 1}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "eiche_top"}, {"op": "show", "who": "evelyn", "face": "serious", "at": "left"}, {"op": "say", "who": null, "t": {"zh": "战斗只持续了两分钟。“风筝的线，断。”一根细得像丝的荆棘，缠住了器灵和主人之间那根看不见的线。", "en": "The fight lasts two minutes. 'Kite string. Break.' A thorn fine as silk catches the invisible line between spirit and holder."}}, {"op": "show", "who": "kite", "face": "normal", "at": "right"}, {"op": "say", "who": "kite", "t": {"zh": "你要飞吗？", "en": "Do you want to fly?"}}, {"op": "say", "who": "evelyn", "t": {"zh": "不。我要赢。", "en": "No. I want to win."}}, {"op": "say", "who": null, "t": {"zh": "少女握住了她戴着手套的手指。那种被抽走的感觉又来了，比刚才重一点。", "en": "The girl takes her gloved fingers. The emptying comes again, heavier than before."}}, {"op": "say", "who": "evelyn", "t": {"zh": "诗人。我刚才……是不是忘了什么？", "en": "Poet. Did I just… forget something?"}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "她记得十八岁那年的考核，一百年来的最高分，所有考官都站起来看着她。可那种站在考场门口、胸口发烫的感觉——没有了。", "en": "She remembers the exam at eighteen, the highest score in a century, every examiner on his feet. But that burning feeling at the door of the hall—gone."}}, {"op": "say", "who": null, "t": {"zh": "她手里握着三件遗器。她是这场仗里第一个手握三件的人。可她一点都不觉得骄傲。", "en": "She holds three relics. The first in this war to hold three. And she feels no pride at all."}}], "cast": [{"id": "evelyn"}, {"id": "kite"}]}, "c6_ward": {"id": "c6_ward", "chapter": "c6", "kind": "main", "title": {"zh": "中心医院 · 早晨 06:20", "en": "Central Hospital · 06:20"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "我叫苏蔓，急诊科的医生。你的灯在睡觉。它自己在修。", "en": "I'm Su Man, an emergency doctor. Your lamp is asleep. It's mending itself."}}], "choices": [{"id": "tell", "type": "dilemma", "label": {"zh": "“她叫林遥。十一年前，她消失了。只有我还记得。”", "en": "'Her name is Lin Yao. She vanished eleven years ago. Only I remember.'"}, "out": [{"text": {"zh": "你昏迷的时候一直在叫妈妈。可你的病历上，母亲那一栏写的是“信息缺失”。", "en": "You kept calling for your mum while you were out. But on your chart, the mother field says 'information missing'."}}], "effects": [{"set": "flag.told_su", "to": true}, {"add": "rel.suman.trust", "by": 2}, {"add": "rel.suman.warmth", "by": 1}], "script": [{"op": "say", "who": "suman", "t": {"zh": "你昏迷的时候一直在叫妈妈。可你的病历上，母亲那一栏写的是“信息缺失”。", "en": "You kept calling for your mum while you were out. But on your chart, the mother field says 'information missing'."}, "face": "sad"}, {"op": "say", "who": "suman", "t": {"zh": "我外婆阁楼上有一盏和你这个一模一样的灯。她擦了四十年，却说不出那是谁的。", "en": "My grandmother's attic had a lamp just like yours. She polished it for forty years and could never say whose it was."}}, {"op": "say", "who": "suman", "t": {"zh": "我的电话。下次你再被人打成这样，直接打给我，别等守秘局。他们太慢了。", "en": "My number. Next time someone does this to you, call me directly. The Bureau is too slow."}, "face": "smile"}], "values": ["xin"]}, {"id": "keep", "type": "strategy", "label": {"zh": "“谢谢你治我。别的，我还不能说。”", "en": "'Thank you for treating me. The rest I can't say yet.'"}, "out": [{"text": {"zh": "随你。你需要休息至少两周。但我猜你不会听我的。", "en": "Suit yourself. You need two weeks' rest at least. But I doubt you'll listen."}}], "effects": [{"add": "rel.suman.esteem", "by": 1}], "script": [{"op": "say", "who": "suman", "t": {"zh": "随你。你需要休息至少两周。但我猜你不会听我的。", "en": "Suit yourself. You need two weeks' rest at least. But I doubt you'll listen."}}], "values": ["shou"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "ward"}, {"op": "show", "who": "suman", "face": "normal", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "我是被疼醒的。肚子，肋骨，头，手——手指僵得像木头，因为攥了一整夜的灯。", "en": "Pain wakes me. Stomach, ribs, head, hands—my fingers stiff as wood from clutching the lamp all night."}, "when": {"v": "flag.c5_hurt", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "我在走廊的长椅上坐了一夜。卡罗在里面缝针。天亮的时候，一个穿白大褂的女人在我旁边坐下了。", "en": "I sit all night on a bench in the corridor while Carlo gets stitched. At dawn a woman in a white coat sits down beside me."}, "when": {"v": "flag.c5_hurt", "op": "!=", "val": true}}, {"op": "say", "who": "suman", "t": {"zh": "我叫苏蔓，急诊科的医生。你的灯在睡觉。它自己在修。", "en": "I'm Su Man, an emergency doctor. Your lamp is asleep. It's mending itself."}}, {"op": "say", "who": "me", "t": {"zh": "你怎么知道？", "en": "How do you know?"}}, {"op": "say", "who": null, "t": {"zh": "她往旁边让了让。在她身后，站着一个戴面纱的女人。", "en": "She shifts aside. Behind her stands a veiled woman."}}, {"op": "show", "who": "cradle", "face": "normal", "at": "right"}, {"op": "say", "who": "suman", "t": {"zh": "我不想赢，也不想改写任何规则。我想阻止王冠被打开。六十年前有人改了一条规则，从那以后，每隔几年就会有人从世界上消失。不是死，是消失。", "en": "I don't want to win or rewrite anything. I want to stop the Crown opening. Someone changed a rule sixty years ago, and since then, every few years, someone vanishes from the world. Not dies. Vanishes."}, "face": "serious"}], "cast": [{"id": "suman"}, {"id": "cradle"}]}, "c6_train": {"id": "c6_train", "chapter": "c6", "kind": "main", "title": {"zh": "〇号线隧道 · 21:24", "en": "Line Zero tunnel · 21:24"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "对了。你出院以后，最好别坐地铁。昨晚有人入侵了地铁的调度系统，是一对双胞胎干的。", "en": "One more thing. After you leave, don't take the metro. Someone broke into the metro dispatch last night. A pair of twins."}}], "choices": [{"id": "time", "type": "strategy", "label": {"zh": "手按在葛兰背上——修好被拉长的时间", "en": "Hand on Gran's back—mend the stretched time"}, "out": [{"text": {"zh": "镜子复制的修复术，是我修摩天轮的那一次。我修过东西，从来没有修过时间。镜子也没照过。", "en": "The mending the mirror copied was the wheel. I've mended things, never time. The mirror has never seen that."}}], "effects": [{"set": "flag.mended_time", "to": true}, {"add": "light", "by": 1}, {"add": "rel.gran.trust", "by": 2}, {"add": "rel.gran.esteem", "by": 1}, {"add": "rel.lamp.esteem", "by": 1}], "script": [{"op": "say", "who": "me", "think": true, "t": {"zh": "镜子复制的修复术，是我修摩天轮的那一次。我修过东西，从来没有修过时间。镜子也没照过。", "en": "The mending the mirror copied was the wheel. I've mended things, never time. The mirror has never seen that."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "被拉长的时间像一根拉坏的弹簧。每一个点都想弹回去，都想起它原本的长度。", "en": "Stretched time is like an overstretched spring. Every point wants to snap back, remembers its true length."}}, {"op": "cg", "id": "cg_t_reconnect"}, {"op": "say", "who": "me", "t": {"zh": "接上。", "en": "Rejoin."}}, {"op": "say", "who": null, "t": {"zh": "时间弹了回去。葛兰的手臂一轻，断剑像一道闪电劈了出去。", "en": "Time springs back. Gran's arm goes light; the Sword flies out like lightning."}}, {"op": "cg", "id": "cg_t_blades"}, {"op": "say", "who": null, "t": {"zh": "原版和复制品撞在一起。复制品碎了。亚当被震得撞在墙上，镜子从手里脱出去，在地上滑出好远。", "en": "Original meets copy. The copy shatters. Adam slams into the wall; the mirror skids away across the ground."}}, {"op": "say", "who": "lamp", "t": {"zh": "……你没用全力。你修好了一样它没见过的东西。", "en": "…You didn't go all out. You mended something it had never seen."}, "face": "surprised"}, {"op": "cg", "id": null}], "values": ["xiu"], "when": {"any": [{"v": "flag.know_twins", "op": "==", "val": true}, {"v": "light", "op": ">=", "val": 2}]}}, {"id": "full", "type": "dilemma", "label": {"zh": "全力，把镜子里的光整个修回去（会交出一段记忆）", "en": "All out—mend every copied light back into the mirror (costs a memory)"}, "out": [{"text": {"zh": "灯火从我的掌心里涌出来，把整条隧道照成了白天。镜子里所有的光，被一道一道地按了回去。", "en": "Light floods out of my palm and turns the tunnel to day. Every light in the mirror is pressed back in, one after another."}}], "effects": [{"set": "mem.soup", "to": false}, {"add": "memories", "by": -1}, {"set": "flag.tunnel_full", "to": true}, {"add": "light", "by": 1}, {"add": "rel.gran.esteem", "by": 1}, {"add": "rel.lamp.trust", "by": -1}], "script": [{"op": "say", "who": null, "t": {"zh": "灯火从我的掌心里涌出来，把整条隧道照成了白天。镜子里所有的光，被一道一道地按了回去。", "en": "Light floods out of my palm and turns the tunnel to day. Every light in the mirror is pressed back in, one after another."}}, {"op": "say", "who": null, "t": {"zh": "那种被抽走的感觉。很咸的番茄蛋汤，每次都咸，她自己从来不觉得。是什么味道来着？", "en": "The emptying. Too-salty tomato-and-egg soup, salty every time, and she never noticed. What did it taste like?"}}, {"op": "say", "who": "lamp", "t": {"zh": "第四段。那碗很咸的汤。我收下了。", "en": "The fourth. That too-salty soup. I'll keep it."}, "forget": true}, {"op": "cg", "id": "cg_t_blades"}, {"op": "say", "who": null, "t": {"zh": "葛兰的刃劈出去，复制品碎了。镜子从亚当手里飞出去，在地上滑出好远。", "en": "Gran's blade lands; the copy shatters. The mirror flies from Adam's hand and skids across the ground."}}, {"op": "cg", "id": null}], "values": ["yong"]}, {"id": "run", "type": "strategy", "label": {"zh": "趁葛兰拖住他们，从另一头跑出去", "en": "While Gran holds them, run out the other end"}, "out": [{"text": {"zh": "我跑进了黑暗里。身后，冷白色的刃落下来——是镜子里的那一刀。", "en": "I run into the dark. Behind me the cold white blade falls—the copy from the mirror."}}], "effects": [{"set": "flag.dead_tunnel", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "我跑进了黑暗里。身后，冷白色的刃落下来——是镜子里的那一刀。", "en": "I run into the dark. Behind me the cold white blade falls—the copy from the mirror."}}, {"op": "say", "who": null, "t": {"zh": "这一次，没有人站在我前面。", "en": "This time no one stands in front of me."}}], "values": ["shou"], "ends": true}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "train"}, {"op": "say", "who": "suman", "t": {"zh": "对了。你出院以后，最好别坐地铁。昨晚有人入侵了地铁的调度系统，是一对双胞胎干的。", "en": "One more thing. After you leave, don't take the metro. Someone broke into the metro dispatch last night. A pair of twins."}, "face": "serious"}, {"op": "hide", "who": "suman"}, {"op": "cg", "id": "cg_t_stopped"}, {"op": "say", "who": null, "t": {"zh": "列车在隧道里突然停下了。窗外的墙太旧了，水泥上长满青苔，墙上是褪色的标识：〇号线。", "en": "The train stops dead in the tunnel. The walls outside are too old, moss on the concrete, a faded sign: Line Zero."}}, {"op": "cg", "id": "cg_t_frozen"}, {"op": "say", "who": null, "t": {"zh": "所有的门同时打开。车厢里的人一个接一个地停住了，像被按了暂停键的录像。只有我还能动。", "en": "Every door opens at once. One by one the passengers stop, like a paused recording. Only I can move."}}, {"op": "say", "who": "ben", "t": {"zh": "时间减速，一百倍。普通人感觉不到。", "en": "Time slowed a hundredfold. Ordinary people won't notice."}}, {"op": "say", "who": "adam", "t": {"zh": "林栖小姐。我们是雷恩兄弟。我们要你的灯。", "en": "Miss Lin. We're the Rhine brothers. We want your lamp."}}, {"op": "cg", "id": "cg_t_beam"}, {"op": "say", "who": null, "t": {"zh": "镜面上白光一闪——是我自己在摩天轮下的修复术。光照在车厢壁上，钢板变回了铁锭，玻璃变回了沙子。", "en": "White light flashes on the mirror—my own mending from under the wheel. It hits the car wall: steel back to ingots, glass back to sand."}}, {"op": "say", "who": "adam", "t": {"zh": "修复的反面，就是拆解。你自己不知道吧？包括人。", "en": "The flip side of mending is unmaking. Didn't know that, did you? People included."}}, {"op": "cg", "id": "cg_t_intercept"}, {"op": "say", "who": null, "t": {"zh": "那道光对准我胸口的瞬间，一道冷白色的刃从隧道深处劈过来，把它斩成了两截。", "en": "As the beam swings to my chest, a cold white blade cuts in from deeper in the tunnel and severs it in two."}}, {"op": "cg", "id": null}, {"op": "show", "who": "gran", "face": "battle", "at": "center"}, {"op": "say", "who": "gran", "t": {"zh": "闭嘴，躲好。你现在这个样子，一碰就碎。", "en": "Shut up and get behind me. In your state, one touch and you'll shatter."}}, {"op": "say", "who": "gran", "t": {"zh": "我是来抢灯的。我要从她手里抢，不是从你们手里。", "en": "I'm here for the lamp. I'll take it from her—not from you."}}, {"op": "cg", "id": "cg_t_slow"}, {"op": "say", "who": "ben", "t": {"zh": "哥，我减速他。", "en": "I'll slow him."}}, {"op": "say", "who": null, "t": {"zh": "葛兰像掉进了一池子蜂蜜。镜子里，冷白色的光一闪——断剑斩摩天轮的那一刀，也被照下来了。", "en": "Gran is suddenly wading through honey. In the mirror, a cold white flash—the stroke that cut the wheel, copied too."}}, {"op": "say", "who": "adam", "t": {"zh": "斩断连结。你自己的能力，尝尝看。", "en": "Severing. Have a taste of your own power."}}, {"op": "cg", "id": null}], "cast": [{"id": "gran"}, {"id": "adam"}, {"id": "ben"}, {"id": "lamp"}]}, "c6_ben": {"id": "c6_ben", "chapter": "c6", "kind": "main", "title": {"zh": "〇号线隧道 · 21:31", "en": "Line Zero tunnel · 21:31"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "哥！", "en": "Adam!"}}], "choices": [{"id": "take", "type": "dilemma", "label": {"zh": "“……提灯。拿吧。”（会交出关于妈妈的一段记忆）", "en": "'…Lamp. Take it.' (costs a memory of Mum)"}, "out": [{"text": {"zh": "洗得发白的蓝外套，袖口的补丁。我想，如果我忘了，那个本子还在。如果我不出手，这个人会失去一条腿。", "en": "The washed-out blue coat, the patch on the cuff. If I forget, the notebook will still be there. If I don't do this, he loses a leg."}}], "effects": [{"set": "mem.coat", "to": false}, {"add": "memories", "by": -1}, {"set": "flag.ben_leg", "to": true}, {"add": "rel.adam.trust", "by": 3}, {"add": "rel.ben.trust", "by": 3}, {"add": "rel.lamp.warmth", "by": -1}, {"add": "notice", "by": 1}], "script": [{"op": "say", "who": "me", "think": true, "t": {"zh": "洗得发白的蓝外套，袖口的补丁。我想，如果我忘了，那个本子还在。如果我不出手，这个人会失去一条腿。", "en": "The washed-out blue coat, the patch on the cuff. If I forget, the notebook will still be there. If I don't do this, he loses a leg."}}, {"op": "say", "who": null, "t": {"zh": "灯火灌进他的腿里。拆解停住了，然后往回长：骨，肉，皮。", "en": "The light pours into his leg. The unmaking stops, then grows back: bone, flesh, skin."}}, {"op": "say", "who": null, "t": {"zh": "我的手在一个冬天里。有人把它揣进一只口袋，口袋是暖的。是谁的口袋？", "en": "My hand is in a winter. Someone tucks it into a pocket, and the pocket is warm. Whose pocket?"}}, {"op": "say", "who": "lamp", "t": {"zh": "第五段。妈妈的蓝外套。……对不起，林栖。我收下了。", "en": "The fifth. Mum's blue coat. …I'm sorry, Lin. I'll keep it."}, "forget": true}, {"op": "show", "who": "suman", "face": "serious", "at": "center", "when": {"v": "flag.told_su", "op": "==", "val": true}}, {"op": "say", "who": "suman", "t": {"zh": "……我来晚了。你已经做了。", "en": "…I'm too late. You've already done it."}, "face": "sad", "when": {"v": "flag.told_su", "op": "==", "val": true}}], "values": ["xiu"]}, {"id": "su", "type": "strategy", "label": {"zh": "给苏蔓打电话——摇篮能让伤口睡着", "en": "Call Su Man—the Cradle can put a wound to sleep"}, "out": [{"text": {"zh": "我拨了那个号码。她接得很快，像一直醒着。", "en": "I dial the number. She answers fast, as if she'd been awake all along."}}], "effects": [{"set": "flag.su_cradle", "to": true}, {"add": "rel.suman.trust", "by": 2}, {"add": "rel.adam.trust", "by": 2}, {"add": "rel.ben.trust", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "我拨了那个号码。她接得很快，像一直醒着。", "en": "I dial the number. She answers fast, as if she'd been awake all along."}}, {"op": "cg", "id": "cg_t_rescue"}, {"op": "show", "who": "suman", "face": "serious", "at": "center"}, {"op": "say", "who": "suman", "t": {"zh": "别动。交给我。摇篮，让他睡。", "en": "Don't move. Leave it to me. Cradle, let him sleep."}}, {"op": "say", "who": null, "t": {"zh": "一种很温柔的感觉，像一首很久以前听过的摇篮曲。拆解停住了——不是被修好，是睡着了。", "en": "Something very gentle, like a lullaby heard long ago. The unmaking stops—not mended. Asleep."}}, {"op": "say", "who": "suman", "t": {"zh": "我本来下个月要去南边的海岛晒太阳，订好了机票。现在我想不起来，我为什么想去了。", "en": "I was going south next month to lie in the sun on an island. Tickets booked. Now I can't remember why I wanted to go."}, "face": "sad"}, {"op": "say", "who": "cradle", "t": {"zh": "对未来的期待。我收下了。", "en": "Her hope for what's ahead. I have taken it."}}, {"op": "cg", "id": null}], "values": ["xin"], "when": {"any": [{"v": "flag.told_su", "op": "==", "val": true}, {"v": "flag.know_cradle", "op": "==", "val": true}]}}, {"id": "hold", "type": "expression", "label": {"zh": "按住他的腿，能修多少修多少，不交出去", "en": "Hold his leg and mend what I can—without giving anything up"}, "out": [{"text": {"zh": "我修了一寸，又一寸。拆解停在大腿根的时候，我也停了，因为我已经没有力气了。", "en": "I mend an inch, then another. When the unmaking stops at his thigh, so do I. I have nothing left."}}], "effects": [{"add": "light", "by": -1}, {"add": "rel.adam.trust", "by": 1}, {"add": "rel.ben.trust", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "我修了一寸，又一寸。拆解停在大腿根的时候，我也停了，因为我已经没有力气了。", "en": "I mend an inch, then another. When the unmaking stops at his thigh, so do I. I have nothing left."}}, {"op": "say", "who": "adam", "t": {"zh": "……谢谢。", "en": "…Thank you."}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "他背起弟弟，走进了隧道的黑暗里。本的左腿，从大腿往下，空空荡荡。", "en": "He hoists his brother on his back and walks into the dark. Below the thigh, Ben's left leg is gone."}}], "values": ["shou"]}], "salience": 0, "order": 3, "script": [{"op": "bg", "id": "metro"}, {"op": "say", "who": "ben", "t": {"zh": "哥！", "en": "Adam!"}}, {"op": "say", "who": null, "t": {"zh": "本扑过去，举起怀表——他不是要攻击，他是要把哥哥周围的时间停下来，伤就不会恶化。可那面镜子掉在地上，镜面朝上，正对着他。", "en": "Ben lunges, raising the watch—not to attack. To stop time around his brother, so the wound won't worsen. But the mirror lies face up on the ground, right in his path."}}, {"op": "say", "who": null, "t": {"zh": "镜子里还残留着一道光。最后一道：我的拆解。", "en": "One light is left in the mirror. The last: my unmaking."}}, {"op": "say", "who": null, "t": {"zh": "他的左腿，从膝盖往下，开始像沙子一样往下掉。", "en": "His left leg, from the knee down, begins to fall away like sand."}}, {"op": "show", "who": "adam", "face": "sad", "at": "left"}, {"op": "show", "who": "ben", "face": "sad", "at": "right"}, {"op": "say", "who": "adam", "t": {"zh": "本——！", "en": "Ben—!"}}, {"op": "say", "who": null, "t": {"zh": "我扑过去，手按在他膝盖上。太快了。那是我自己的力量，失去了控制。我修好一寸，它就拆掉两寸。", "en": "I throw myself down, hands on his knee. Too fast. My own power, out of control. For every inch I mend it unmakes two."}}, {"op": "say", "who": "lamp", "t": {"zh": "林栖，你要是全力出手，我会拿走很重的东西。也许是她。", "en": "Lin, if you go all out, I'll take something heavy. Maybe her."}, "face": "sad"}, {"op": "say", "who": "ben", "t": {"zh": "哥……对不起……", "en": "Adam… sorry…"}}], "cast": [{"id": "adam"}, {"id": "ben"}, {"id": "lamp"}]}, "c6_after": {"id": "c6_after", "chapter": "c6", "kind": "main", "title": {"zh": "〇号线隧道 · 打完以后", "en": "Line Zero tunnel · afterward"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "列车里，时间重新开始流动。车门关上了，列车缓缓开走，朝着有光的地方。隧道里只剩下我和葛兰。", "en": "In the train, time flows again. The doors close and it pulls away slowly, toward the light. Only Gran and I are left in the tunnel."}}], "choices": [{"id": "keep", "type": "expression", "label": {"zh": "把啤酒揣进风衣口袋", "en": "Tuck the beer into my coat pocket"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.c6_done", "to": true}, {"add": "rel.gran.warmth", "by": 1}], "script": [], "values": ["xin"]}], "salience": 0, "order": 4, "script": [{"op": "bg", "id": "metro"}, {"op": "say", "who": null, "t": {"zh": "列车里，时间重新开始流动。车门关上了，列车缓缓开走，朝着有光的地方。隧道里只剩下我和葛兰。", "en": "In the train, time flows again. The doors close and it pulls away slowly, toward the light. Only Gran and I are left in the tunnel."}}, {"op": "show", "who": "gran", "face": "normal", "at": "center"}, {"op": "say", "who": "gran", "t": {"zh": "你刚才，为了一个刚刚要杀你的人，打算全力出手。", "en": "Just now you were ready to go all out for someone who'd just tried to kill you."}}, {"op": "say", "who": "gran", "t": {"zh": "六十年前的事，我不在乎了。断剑说，她想死。我要赢，是为了替她说那句话。", "en": "I'm done caring about sixty years ago. The Sword says she wants to die. I'm winning so I can say that for her."}}, {"op": "say", "who": "me", "t": {"zh": "那我们是敌人。", "en": "Then we're enemies."}}, {"op": "say", "who": "gran", "t": {"zh": "是敌人。", "en": "Enemies."}}, {"op": "say", "who": "me", "t": {"zh": "那你刚才为什么救我？", "en": "Then why did you save me?"}}, {"op": "say", "who": "gran", "t": {"zh": "……因为你在涂鸦街说，你怕忘了你妈。我祖父忘了断剑，擦了二十年空匣子。", "en": "…Because on Mural Street you said you were afraid of forgetting your mum. My grandfather forgot the Sword and polished an empty case for twenty years."}, "face": "sad", "when": {"v": "rel.gran.trust", "op": ">=", "val": 4}}, {"op": "say", "who": null, "t": {"zh": "他没回答完。他站起来，往隧道深处走，走了几步，从兜里掏出一样东西往后一扔。是一瓶没开的啤酒。", "en": "He doesn't finish. He gets up, walks deeper into the tunnel, and a few steps on tosses something back over his shoulder. An unopened beer."}}, {"op": "say", "who": "gran", "t": {"zh": "打完再喝。不管谁赢。", "en": "Drink it when it's over. Whoever wins."}}, {"op": "say", "who": "lamp", "t": {"zh": "……你交朋友的方式真奇怪。", "en": "…You make friends in the strangest way."}, "face": "smile"}, {"op": "say", "who": "me", "t": {"zh": "他不是朋友。", "en": "He's not a friend."}}, {"op": "say", "who": "lamp", "t": {"zh": "嗯。敌人。", "en": "Mm. An enemy."}}], "cast": [{"id": "gran"}, {"id": "lamp"}]}, "s7_chess": {"id": "s7_chess", "chapter": "c7", "kind": "side", "title": {"zh": "钟楼顶层 · 23:00（撑黑伞的人）", "en": "Top of the clock tower · 23:00 (the man with the umbrella)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "棋盘上，白色的骑士和黑色的车，原本隔着整个棋盘对峙。现在它们挨在了一起，面对着那枚金红色的皇后。", "en": "On the board the white knight and the black rook used to face each other across the whole board. Now they stand side by side, facing the red-gold queen."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.saw_chess_grey", "to": true}], "script": [], "values": ["ji"]}], "salience": 2, "order": 0, "script": [{"op": "bg", "id": "clocktower"}, {"op": "show", "who": "merlo", "face": "serious", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "棋盘上，白色的骑士和黑色的车，原本隔着整个棋盘对峙。现在它们挨在了一起，面对着那枚金红色的皇后。", "en": "On the board the white knight and the black rook used to face each other across the whole board. Now they stand side by side, facing the red-gold queen."}}, {"op": "say", "who": null, "t": {"zh": "棋盘最底下一行，最角落的格子里，一枚他从来没有摆过的棋子自己立了起来。灰色的，像是用灰烬捏成的，没有形状。", "en": "In the bottom row, in the corner square, a piece he never placed stands up by itself. Grey, as if pressed out of ash, without a shape."}}, {"op": "say", "who": null, "t": {"zh": "棋盘开口了。可那不是棋盘的声音。是一个女孩的声音，很轻，在笑。", "en": "The board speaks. But it isn't the board's voice. It is a girl's, light, laughing."}}, {"op": "say", "who": null, "t": {"zh": "“梅洛，你还记得你答应过我什么吗？”", "en": "'Merlo, do you remember what you promised me?'"}}, {"op": "say", "who": "merlo", "t": {"zh": "……我答应过什么？", "en": "…What did I promise?"}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "钟楼的钟敲响了十一点。他想不起来。他什么都想不起来。", "en": "The tower strikes eleven. He can't remember. He can't remember anything."}}], "cast": [{"id": "merlo"}]}, "s7_ink": {"id": "s7_ink", "chapter": "c7", "kind": "side", "title": {"zh": "艾希大厦楼下 · 黄昏（伊芙琳）", "en": "Below Eiche Tower · dusk (Evelyn)"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "墨水瓶写下了一行字，墨迹还没有干：明晚十二点，钟楼之下。所有遗器持有者，来见我。", "en": "The Inkwell has written a line, the ink still wet: Midnight tomorrow, beneath the clock tower. Every relic holder, come and see me."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "（合上这一页）", "en": "(Close this page)"}, "out": [{"text": {"zh": "（继续）", "en": "(Continue)"}}], "effects": [{"set": "flag.know_invite", "to": true}, {"add": "rel.evelyn.esteem", "by": 1}], "script": [], "values": ["ji"]}], "salience": 1, "order": 0, "script": [{"op": "bg", "id": "eiche_top"}, {"op": "show", "who": "evelyn", "face": "normal", "at": "left"}, {"op": "show", "who": "ink", "face": "normal", "at": "right"}, {"op": "say", "who": null, "t": {"zh": "墨水瓶写下了一行字，墨迹还没有干：明晚十二点，钟楼之下。所有遗器持有者，来见我。", "en": "The Inkwell has written a line, the ink still wet: Midnight tomorrow, beneath the clock tower. Every relic holder, come and see me."}}, {"op": "say", "who": "poet", "t": {"zh": "您确定吗，我的小姐？这是宣战。现在宣战，所有人都会联合起来对付您。", "en": "Are you sure, my lady? This is a declaration of war. Declare now and everyone will unite against you."}}, {"op": "say", "who": "evelyn", "t": {"zh": "那就让他们来。我要所有人都看着。看着我赢。", "en": "Then let them. I want everyone watching. Watching me win."}, "face": "serious"}, {"op": "say", "who": null, "t": {"zh": "诗人没有告诉她：她说出“我要所有人都看着”的时候，荆棘冠又悄悄拿走了一点东西。她已经快不记得，自己为什么想让所有人看着了。", "en": "The poet doesn't tell her: as she said 'I want everyone watching', the Crown quietly took a little more. She can barely remember why she wants anyone to watch."}}], "cast": [{"id": "evelyn"}, {"id": "ink"}, {"id": "poet"}]}, "c7_lamp": {"id": "c7_lamp", "chapter": "c7", "kind": "main", "title": {"zh": "林记修复 · 周日 10:20", "en": "Lin's Repairs · Sunday, 10:20"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "灯芯上的火苗小得像一粒米。我用软布擦着黄铜的框架，擦到灯座底下的时候，手指摸到了一道刻痕。", "en": "The flame on the wick is the size of a grain of rice. I polish the brass frame with a soft cloth, and under the base my finger finds a groove."}}], "choices": [{"id": "touch", "type": "dilemma", "label": {"zh": "伸手去拨开那些光带", "en": "Reach out and part the bands"}, "out": [{"text": {"zh": "光带烫得像烙铁。我拨开了一条——只看见本子封皮上的一行字：给六十年后，那个比我更勇敢的人。", "en": "The bands burn like irons. I part one—and see only a line on the notebook's cover: To the one, sixty years on, who is braver than I was."}}], "effects": [{"set": "flag.touched_lock", "to": true}, {"set": "flag.saw_initials", "to": true}, {"add": "rel.lamp.trust", "by": -2}, {"add": "light", "by": -1}], "script": [{"op": "say", "who": null, "t": {"zh": "光带烫得像烙铁。我拨开了一条——只看见本子封皮上的一行字：给六十年后，那个比我更勇敢的人。", "en": "The bands burn like irons. I part one—and see only a line on the notebook's cover: To the one, sixty years on, who is braver than I was."}}, {"op": "say", "who": null, "t": {"zh": "然后光带合上了，把我推了出来。", "en": "Then the bands close, and push me out."}}, {"op": "say", "who": "lamp", "t": {"zh": "……她让我答应她两件事。替她保管好，一直到最后。还有，不要让你看见。", "en": "…She made me promise two things. Keep it safe until the end. And don't let you see."}, "face": "sad"}], "values": ["duo"]}, {"id": "stop", "type": "expression", "label": {"zh": "把手收回来", "en": "Draw my hand back"}, "out": [{"text": {"zh": "我把手收了回来。光带上的白光一明一暗，像在呼吸。", "en": "I draw my hand back. The white bands brighten and dim, as if breathing."}}], "effects": [{"set": "flag.saw_initials", "to": true}, {"add": "rel.lamp.trust", "by": 2}], "script": [{"op": "say", "who": null, "t": {"zh": "我把手收了回来。光带上的白光一明一暗，像在呼吸。", "en": "I draw my hand back. The white bands brighten and dim, as if breathing."}}, {"op": "say", "who": "lamp", "t": {"zh": "……谢谢。", "en": "…Thank you."}}], "values": ["shou"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "shop_day"}, {"op": "say", "who": null, "t": {"zh": "苏蔓打电话来：“本醒了。腿是好的。他哥哥守在床边，三天没合眼。本醒过来，第一句话是问他哥哥吃饭了没有。”", "en": "Su Man calls: 'Ben's awake. The leg is fine. His brother hasn't slept in three days. The first thing Ben asked was whether his brother had eaten.'"}, "when": {"v": "flag.ben_leg", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "苏蔓打电话来：“本醒了。左腿没了。本醒过来，第一句话是问他哥哥吃饭了没有。……林栖，那不是你的错。”", "en": "Su Man calls: 'Ben's awake. The left leg is gone. The first thing he asked was whether his brother had eaten. …Lin, it isn't your fault.'"}, "when": {"v": "flag.ben_leg", "op": "!=", "val": true}}, {"op": "cg", "id": "cg_mend_lamp"}, {"op": "say", "who": null, "t": {"zh": "灯芯上的火苗小得像一粒米。我用软布擦着黄铜的框架，擦到灯座底下的时候，手指摸到了一道刻痕。", "en": "The flame on the wick is the size of a grain of rice. I polish the brass frame with a soft cloth, and under the base my finger finds a groove."}}, {"op": "say", "who": null, "t": {"zh": "灯座底下，刻得很潦草：M. & S.", "en": "Under the base, scratched in a hurry: M. & S."}}, {"op": "say", "who": null, "t": {"zh": "我闭上眼睛，用修复术去“看”那盏灯的里面。我这辈子从来没有这样做过。", "en": "I close my eyes and use the mending to look inside the lamp. I've never done that in my life."}}, {"op": "cg", "id": null}, {"op": "bg", "id": "lamp_inside"}, {"op": "cg", "id": "cg_lamp_lit"}, {"op": "say", "who": null, "t": {"zh": "无边无际的黑暗里，飘着一盏一盏的灯，像一片倒过来的星空。每一盏灯里面，都有画面在流动。被提灯收下的、所有主人的、所有温暖的记忆。", "en": "In boundless dark float lanterns, one after another, like an upside-down sky. Pictures move inside each. Every warm memory the Lamp has ever taken from every holder."}}, {"op": "say", "who": null, "t": {"zh": "离我最近的一盏：梧桐树，天蓝色的小自行车。扶着车座跑的是一个戴黑框眼镜、穿着沾了机油的工作服的男人。“栖栖，看前面！爸爸不松手——”", "en": "The nearest: the plane tree, the little sky-blue bike. The one running behind is a man in black-framed glasses and an oil-stained work shirt. 'Qiqi, look ahead! Daddy won't let go—'"}, "when": {"v": "mem.ride", "op": "!=", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "是父亲。不是母亲。我看见了，可心里什么都没有。像在看一部别人的电影。", "en": "Dad. Not Mum. I can see it, and feel nothing. Like watching someone else's film."}, "when": {"v": "mem.ride", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "一盏灯里是拆开的闹钟和一只大手。", "en": "In one lantern, a clock in pieces and a big hand."}, "when": {"v": "mem.praise", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "一盏灯里是梧桐树底下的八音盒。", "en": "In one, a music box under the plane tree."}, "when": {"v": "mem.musicbox", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "一盏灯里冒着热气，是一碗汤。", "en": "In one, steam rising from a bowl of soup."}, "when": {"v": "mem.soup", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "一盏灯里是一只蓝色的口袋，口袋里揣着一只小手。", "en": "In one, a blue pocket with a small hand tucked inside."}, "when": {"v": "mem.coat", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "黑暗最深的地方，悬着一盏被锁住的灯。四周缠着一圈一圈白色的光带。缝隙里漏出蓝色的光。", "en": "In the deepest dark hangs one lantern, locked. White bands wrap it round and round. Blue light leaks through the gaps."}}, {"op": "say", "who": null, "t": {"zh": "我从缝隙里看见了一只袖子。洗得发白的蓝外套，左边袖口一块补丁。一只手握着笔，在一本很厚很厚的本子上写字。", "en": "Through a gap I see a sleeve. A washed-out blue coat, a patch on the left cuff. A hand holding a pen, writing in a very thick notebook."}}, {"op": "say", "who": "me", "t": {"zh": "……妈妈？", "en": "…Mum?"}}, {"op": "show", "who": "lamp", "face": "sad", "at": "center"}, {"op": "say", "who": "lamp", "t": {"zh": "别碰。林栖，求你了。", "en": "Don't touch it. Lin, please."}, "face": "sad"}], "cast": [{"id": "lamp"}]}, "c7_talk": {"id": "c7_talk", "chapter": "c7", "kind": "main", "title": {"zh": "林记修复 · 黄昏 18:30", "en": "Lin's Repairs · dusk, 18:30"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "那盏被锁起来的灯里面，是我妈妈。你为什么有她的记忆？她也是你的主人？", "en": "The locked lantern has my mother inside. Why do you have her memories? Was she your holder too?"}}], "choices": [{"id": "friends", "type": "expression", "label": {"zh": "“我不会再全力出手了。我去交朋友。”", "en": "'I won't go all out anymore. I'll make friends.'"}, "out": [{"text": {"zh": "我把那瓶没开的啤酒放在柜台上。", "en": "I set the unopened beer on the counter."}}], "effects": [{"set": "flag.vow_friends", "to": true}, {"add": "rel.lamp.warmth", "by": 2}, {"add": "rel.lamp.trust", "by": 1}, {"add": "light", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "我把那瓶没开的啤酒放在柜台上。", "en": "I set the unopened beer on the counter."}}, {"op": "say", "who": "lamp", "t": {"zh": "这是灰烬王冠之争。十二件遗器，五个家族，所有人都想赢。没有人会跟你交朋友。", "en": "This is the Ashen Crown war. Twelve relics, five families, everyone wants to win. No one will be your friend."}}, {"op": "say", "who": "me", "t": {"zh": "葛兰会。苏蔓会。也许白秋也会，只要我能弄清楚她要什么。伊芙琳不知道自己要什么。我想帮她想出来。", "en": "Gran will. Su Man will. Maybe Bai Qiu too, once I figure out what she wants. Evelyn doesn't know what she wants. I'd like to help her find out."}}, {"op": "say", "who": null, "t": {"zh": "我伸出手，摸了摸他透明的、银白色的头发。就像很多年前，有人摸我的头那样。", "en": "I reach out and touch his transparent silver hair. The way someone touched mine, many years ago."}}, {"op": "say", "who": "me", "t": {"zh": "我不恨你。你替我记着那个下午，替我记着爸爸，替我记着妈妈。谢谢你，提灯。", "en": "I don't hate you. You remember that afternoon for me, and Dad, and Mum. Thank you, Lamp."}}, {"op": "say", "who": null, "t": {"zh": "灯芯上那粒米大的火苗，忽然跳了起来。很轻，很慢，像一个人在黑暗里，深深地吸了一口气。
