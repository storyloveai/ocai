<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>灰烬王冠</title>
<style>
:root { --ink: #f3efe6; --muted: #b9b2a6; --box: rgba(12, 12, 18, .86); --edge: rgba(232, 194, 122, .22); --accent: #e8c27a; --accent-ink: #2a1d08; --bg: #07070b; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.7 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent }
#stage { position: fixed; inset: 0; margin: auto; aspect-ratio: 16 / 9; max-width: 100vw; max-height: 100vh; width: 100vw; overflow: hidden; background: #111; user-select: none }
@media (max-aspect-ratio: 16/9) { #stage { width: 100vw; height: auto } }
@media (orientation: portrait) and (max-width: 700px) { #stage { aspect-ratio: auto; width: 100vw; height: 100dvh } }
.layer { position: absolute; inset: 0 }
#bg { background-size: cover; background-position: center; transition: opacity .6s }
#bg .ph, #cg .ph { position: absolute; left: 16px; top: 14px; font-size: 13px; color: rgba(255,255,255,.75); letter-spacing: .08em; background: rgba(0,0,0,.25); padding: 2px 10px; border-radius: 99px }
#sprites { pointer-events: none; will-change: transform }
.fx { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .35s; pointer-events: none; display: block }
.sprite { position: absolute; bottom: 0; height: 96%; aspect-ratio: 2 / 3; transform: translateX(-50%); transition: left .35s, filter .25s, opacity .3s; display: flex; align-items: flex-end; justify-content: center }
.sprite img { height: 100%; width: auto; object-fit: contain }
.sprite.dim { filter: brightness(.62) saturate(.8) }
.sprite svg { height: 100%; width: 100% }
@media (orientation: portrait) and (max-width: 700px) { .sprite { height: 62%; bottom: 26% } }
#cg { background-size: cover; background-position: center; opacity: 0; pointer-events: none; transition: opacity .6s }
#cg.on { opacity: 1 }
#box { position: absolute; left: 3%; right: 3%; bottom: 3%; min-height: 26%; background: var(--box); border: 1px solid var(--edge); border-radius: 14px; padding: 2.6% 3.2% 2%; backdrop-filter: blur(6px); cursor: pointer }
#name { position: absolute; top: -18px; left: 4%; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 3px 18px; border-radius: 99px; font-size: 15px; letter-spacing: .06em }
#name:empty { display: none }
#text { font-size: clamp(15px, 2.1vw, 21px); line-height: 1.75; min-height: 3.5em; white-space: pre-wrap }
#text.think { color: #cfe3ff; font-style: italic }
#text.forget { color: #8f8a83; letter-spacing: .04em }
.toast { position: absolute; left: 50%; top: 8%; transform: translateX(-50%); background: rgba(10,10,14,.9); border: 1px solid var(--edge); color: var(--muted); padding: 6px 16px; border-radius: 99px; font-size: 13px; z-index: 7; animation: toast 3.2s forwards }
@keyframes toast { 0% { opacity: 0 } 10%, 80% { opacity: 1 } 100% { opacity: 0 } }
.mem { border-bottom: 1px solid var(--edge); padding: 10px 2px }
.mem b { display: block; color: var(--accent); font-weight: 600 }
.mem.gone b, .mem.gone p { color: #6f6a64; text-decoration: line-through; text-decoration-color: rgba(255,255,255,.18) }
.mem p { margin: 4px 0 0; font-size: 14px; color: var(--muted) }
.arc { border-bottom: 1px solid var(--edge); padding: 10px 2px }
.arc h3 { margin: 0 0 6px; font-size: 15px; color: var(--accent) }
.arc dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; font-size: 13.5px }
.arc dt { color: var(--muted) } .arc dd { margin: 0 } .arc dd.q { color: #5f5a54 }
.clinic { margin: 14px auto 0; max-width: 640px; border: 1px solid var(--edge); border-radius: 10px; padding: 10px 16px; background: rgba(40, 40, 46, .55); text-align: left }
.clinic h4 { margin: 0 0 4px; font-size: 13px; letter-spacing: .12em; color: var(--accent) }
.clinic p { margin: 0; font-size: 14px }
#next { position: absolute; right: 2.4%; top: 34%; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 10px solid var(--accent); animation: bob 1s infinite; opacity: 0 }
#next.on { opacity: 1 }
@keyframes bob { 50% { transform: translateY(4px) } }
#bar { position: absolute; right: 4%; bottom: calc(3% + 4px); display: flex; gap: 4px; z-index: 3 }
#bar button, .menu button, .panel button { font: inherit; font-size: 12.5px; color: var(--muted); background: none; border: 0; padding: 4px 8px; border-radius: 6px; cursor: pointer }
#bar button[aria-pressed="true"] { color: var(--accent) }
#bar button { white-space: nowrap }
@media (max-width: 520px) { #bar { left: 4%; right: 4%; justify-content: space-between; gap: 0 } #bar button { padding: 4px 2px; font-size: 12px } }
#bar button:hover { color: var(--ink) }
.menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(6, 8, 18, .35); z-index: 4 }
.menu .prompt { color: var(--muted); font-size: 14px; letter-spacing: .1em; margin-bottom: 4px }
.menu .opt { min-width: min(560px, 82%); font-size: clamp(14px, 1.8vw, 18px); color: var(--ink); background: var(--box); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 22px; text-align: center; transition: background .15s, border-color .15s }
.menu .opt:hover, .menu .opt:focus-visible { border-color: var(--accent); background: rgba(58, 29, 39, .85); outline: none }
.menu .opt[disabled] { opacity: .45; cursor: default }
.menu .opt.talk-opt { border-style: dashed; color: var(--accent) }
.menu form.talk { display: flex; gap: 8px; width: min(560px, 86%); flex-wrap: wrap; justify-content: center }
.menu form.talk input { flex: 1 1 260px; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--box); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 16px; outline: none }
.menu form.talk button { font-size: 15px; color: var(--ink); border: 1px solid var(--edge); background: var(--box); border-radius: 12px; padding: 10px 18px }
.heart { position: absolute; z-index: 3; font-size: clamp(22px, 3vw, 34px); color: #ff8fb1; pointer-events: none; animation: heart 1.6s ease-out forwards; text-shadow: 0 0 12px rgba(255,143,177,.7) }
@keyframes heart { 0% { opacity: 0; transform: translateY(10px) scale(.6) } 20% { opacity: 1; transform: translateY(0) scale(1.1) } 100% { opacity: 0; transform: translateY(-60px) scale(1) } }
.panel { position: absolute; inset: 4%; background: rgba(10, 13, 26, .94); border: 1px solid var(--edge); border-radius: 14px; z-index: 6; display: flex; flex-direction: column; padding: 18px 22px }
.panel h2 { margin: 0 0 10px; font-size: 18px; letter-spacing: .1em }
.panel .body { overflow: auto; flex: 1; padding-right: 6px }
.panel .close { position: absolute; top: 10px; right: 12px; font-size: 14px }
.log p { margin: 0 0 10px } .log b { color: var(--accent); margin-right: 8px; font-weight: 600 }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px }
.slot { text-align: left !important; border: 1px solid var(--edge) !important; padding: 10px 12px !important; color: var(--ink) !important; line-height: 1.5 }
.slot small { color: var(--muted); display: block }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px }
.gallery div { aspect-ratio: 16/9; border-radius: 8px; background: #222 center/cover; display: flex; align-items: flex-end; padding: 6px 10px; font-size: 12.5px; border: 1px solid var(--edge) }
.gallery div.locked { color: var(--muted); background: repeating-linear-gradient(45deg, #1a1d2a 0 10px, #161925 10px 20px) }
#title { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; justify-content: center; padding-left: 8%; gap: 10px; background-size: cover; background-position: center }
#title::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,10,22,.85), rgba(8,10,22,.2) 70%) }
#title > * { position: relative }
#title h1 { margin: 0; font-size: clamp(26px, 5vw, 54px); letter-spacing: .12em; font-weight: 700 }
#title .sub { color: var(--muted); letter-spacing: .3em; font-size: clamp(11px, 1.4vw, 15px); margin-bottom: 18px }
#title button { align-self: flex-start; font: inherit; font-size: clamp(14px, 1.8vw, 18px); color: var(--ink); background: none; border: 0; border-left: 2px solid transparent; padding: 4px 12px; cursor: pointer; letter-spacing: .12em }
#title button:hover, #title button:focus-visible { border-left-color: var(--accent); color: var(--accent); outline: none }
#title .lang { position: absolute; top: 16px; right: 20px; font-size: 13px }
.end { position: absolute; inset: 0; z-index: 5; background: rgba(6, 8, 18, .88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 8%; text-align: center }
.end h2 { margin: 0; letter-spacing: .12em; text-wrap: balance } .end h3 { margin: 10px 0 0; font-size: 14px; font-weight: 500; letter-spacing: .2em; color: var(--muted) } .end p { margin: 0; color: var(--muted); max-width: 640px; line-height: 1.8 }
.end button { font: inherit; color: var(--ink); background: var(--box); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 20px; cursor: pointer; margin-top: 10px }
[hidden] { display: none !important }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <div id="sprites" class="layer"></div>
  <div id="cg" class="layer"></div>
  <div id="box" role="button" tabindex="0" aria-label="next"><div id="name"></div><div id="text"></div><div id="next"></div></div>
  <div id="bar"></div>
  <div id="menu" class="menu" hidden></div>
  <div id="panel" class="panel" hidden></div>
  <div id="endscreen" class="end" hidden></div>
  <div id="title"></div>
</div>
<script>/* StoryDate campaign engine — shared by every book. Canonical copy: game/engine/campaign_core.js
 * (books keep a byte-identical copy; CI checks it). Engine version CC.VERSION; reads campaigns of spec
 * storydate.campaign/0.3 (legacy: relationship model not enforced) and /0.4 (unified relationships,
 * tiers and a genre pack). See game/engine/README.md.
 * Pure functions, no DOM. Works in the browser (window.CC) and in Node (require).
 *
 * Layers (see 研究文档 §6–§7):
 *   rules      — conditions, effects, clamps. Only the rules change state.
 *   ledger     — append-only record of every change and its cause; endings are explained from it.
 *   director   — picks which side storylets to offer this chapter (salience: base + specificity + due echoes).
 *   echoes     — major choices register an echo; later nodes pay it with a callback line.
 *   debts      — when a choice removes the cause of a locked plot function, a debt opens and must be
 *                resolved later by transform / reroute / cancel.
 */
(function (root) {
  "use strict";
  const CC = {};
  CC.VERSION = "0.4.7";
  CC.SPECS = ["storydate.campaign/0.3", "storydate.campaign/0.4"];
  // 3 for legacy campaigns, 4 for campaigns on the unified relationship model + tiers + genre pack
  CC.specLevel = camp => { const m = /^storydate\.campaign\/0\.(\d+)$/.exec(camp.spec || ""); return m ? +m[1] : 0; };

  /* ---------------- conditions ---------------- */
  function getVar(st, name) { return st.v[name]; }
  function resolveVal(st, val) { return (typeof val === "string" && val[0] === "@") ? st.v[val.slice(1)] : val; }
  function evalCond(st, c) {
    if (!c) return true;
    if (c.all) return c.all.every(x => evalCond(st, x));
    if (c.any) return c.any.some(x => evalCond(st, x));
    const a = getVar(st, c.v), b = resolveVal(st, c.val);
    switch (c.op) {
      case "==": return (a === undefined ? false : a) === b;
      case "!=": return (a === undefined ? false : a) !== b;
      case ">=": return (a || 0) >= b;
      case "<=": return (a || 0) <= b;
      case ">": return (a || 0) > b;
      case "<": return (a || 0) < b;
      default: throw new Error("bad op " + c.op);
    }
  }
  function atoms(c, out = []) {
    if (!c) return out;
    if (c.all) c.all.forEach(x => atoms(x, out));
    else if (c.any) c.any.forEach(x => atoms(x, out));
    else out.push(c);
    return out;
  }
  function condVars(c) {
    const s = new Set();
    atoms(c).forEach(a => { s.add(a.v); if (typeof a.val === "string" && a.val[0] === "@") s.add(a.val.slice(1)); });
    return [...s];
  }
  CC.evalCond = evalCond; CC.atoms = atoms; CC.condVars = condVars;

  /* ---------------- state ---------------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  CC.rng = rng;

  /* A volume can start from where the previous one ended (carry = that volume's final state), or from a preset
   * (carry = { v: {...} } describing a typical earlier playthrough). Variables with the same name carry over,
   * except per-scene ones (heat.*) and narrative debts, which belong to their own volume. People also remember
   * what was said (mem) and promises still open stay open. */
  CC.carryable = (camp, name) => !!camp.vars[name] && camp.vars[name].carry !== false && !name.startsWith("heat.") && !name.startsWith("debt.") && name !== "ended_early";
  /* v2.3: each new volume pulls high relationship values back toward the middle (time passes; people change),
   * so a player who maxed someone out in an earlier volume still has room to grow. Values at or below the pivot
   * are kept as they are: a grudge or a cold shoulder carries over in full. */
  CC.compress = (camp, val) => {
    const cc = camp.carry_compress; if (!cc || val <= cc.pivot) return val;
    return Math.round(cc.pivot + (val - cc.pivot) * cc.k);
  };
  CC.tierOf = (camp, val) => { const t = camp.tiers; if (!t) return null; let k = 0; t.start.forEach((s, i) => { if (val >= s) k = i; }); return k; };
  CC.newGame = function (camp, carry) {
    const v = {};
    for (const [k, d] of Object.entries(camp.vars)) v[k] = d.init;
    for (const id of Object.keys(camp.debts)) v["debt." + id] = "none";
    const st = { v, vol: camp.id, ch: -1, phase: "start", cur: null, offer: [], lastOrder: -1, ledger: [], log: [], echoes: {}, seq: 0, done: [] };
    if (carry && carry.v) {
      const e = ledgerPush(st, { kind: "carry", node: null, choice: null, from: carry.vol || null, preset: carry.preset || null, changes: [], debts: [], echo: [] });
      for (let [k, val] of Object.entries(carry.v)) {
        if (!CC.carryable(camp, k) || val === undefined) continue;
        if (k.startsWith("rel.") && typeof val === "number") { const c = CC.compress(camp, val); if (c !== val) (e.compressed = e.compressed || []).push({ var: k, was: val, now: c }); val = c; }
        if (val === v[k]) continue;
        e.changes.push({ var: k, from: v[k], to: val }); v[k] = val;
      }
      if (carry.mem) st.mem = JSON.parse(JSON.stringify(carry.mem));
      if (carry.commits) st.commits = carry.commits.filter(k => k.status === "open").map(k => Object.assign({}, k, { prev: true }));
      if (carry.said) st.said = carry.said.slice();
      st.log.push({ k: "carry", from: carry.vol || null, preset: carry.preset || null, seq: e.seq });
    }
    enterChapter(camp, st, 0);
    return st;
  };
  // what a finished volume hands to the next one
  CC.carryOut = st => ({ vol: st.vol, v: Object.assign({}, st.v, st.v.ended_early ? { "prev.ended_early": true } : {}), ended_early: !!st.v.ended_early, mem: st.mem || {}, commits: st.commits || [], said: st.said || [] });
  CC.clone = st => JSON.parse(JSON.stringify(st));

  function chapterOf(camp, st) { return camp.chapters[st.ch]; }
  function nodesIn(camp, chId, kind) {
    return Object.values(camp.nodes).filter(n => n.chapter === chId && n.kind === kind).sort((a, b) => a.order - b.order);
  }

  function ledgerPush(st, e) { e.seq = ++st.seq; e.ch = st.ch; st.ledger.push(e); return e; }

  /* 0.4.1 hard tiers: camp.hard_tiers = { "rel.liubei.trust": 3 } means that once the value has reached that tier
   * (e.g. 倚重), ordinary gains no longer raise it; only an effect marked { key: true } (a key moment) can carry
   * it into the next tier. Losses always apply. The entry records what was held back (entry.held). */
  CC.heldBack = (camp, name, from, ef) => {
    const hard = camp.hard_tiers && camp.hard_tiers[name];
    if (hard === undefined || !ef.add || !(ef.by > 0) || ef.key) return false;
    const t = CC.tierOf(camp, from || 0); return t !== null && t >= hard;
  };
  // while someone holds a grudge (0.4.5): words toward them earn nothing, deeds earn half, key moments count in full,
  // and nothing short of a key moment lifts them into a higher tier with you
  // a book that wants its story to turn on a grudge declares a var "grudge.<who>"; the count is mirrored there so
  // conditions can read it (a third threat to Cao Cao is not the first)
  function setGrudge(camp, st, cid, n) {
    st.grudge = st.grudge || {}; st.grudge[cid] = Math.max(0, n);
    const v = "grudge." + cid, d = camp.vars[v]; if (d) st.v[v] = Math.max(d.min, Math.min(d.max, st.grudge[cid]));
  }
  function grudgeGate(camp, st, effs, words, e) {
    const g = st.grudge || {}, held = [], T = camp.tiers;
    const out = (effs || []).map(ef => {
      const m = /^rel\.(\w+)\.(\w+)$/.exec(ef.add || ""); if (!m || !(ef.by > 0) || !((g[m[1]] || 0) > 0)) return ef;
      let by = ef.key ? ef.by : words ? 0 : Math.floor(ef.by / 2);
      if (T && by > 0 && !ef.key) { const from = st.v[ef.add] || 0, k = T.start.reduce((a, s, i) => (from >= s ? i : a), 0); by = Math.min(by, T.end[k] - from); }
      if (by !== ef.by) held.push(m[1]);
      return by > 0 ? Object.assign({}, ef, { by }) : null;
    }).filter(Boolean);
    if (held.length) e.grudge = [...new Set((e.grudge || []).concat(held))];
    return out;
  }
  function applyEffects(camp, st, effects, entry) {
    for (const ef of effects || []) {
      const name = ef.set || ef.add;
      const d = camp.vars[name];
      if (!d) throw new Error("unknown var " + name);
      const from = st.v[name];
      if (CC.heldBack(camp, name, from, ef)) { (entry.held = entry.held || []).push(name); continue; }
      let to = ef.set !== undefined && "to" in ef ? ef.to : (from || 0) + ef.by;
      if (d.type === "num") to = Math.max(d.min, Math.min(d.max, to));
      st.v[name] = to;
      if (from !== to) entry.changes.push({ var: name, from, to });
    }
  }
  function openDebt(st, id, entry) {
    const k = "debt." + id;
    if (st.v[k] === "none") { st.v[k] = "open"; entry.changes.push({ var: k, from: "none", to: "open" }); entry.debts.push([id, "open"]); }
  }
  function resolveDebt(st, id, mode, entry) {
    const k = "debt." + id;
    if (st.v[k] === "open") { st.v[k] = mode; entry.changes.push({ var: k, from: "open", to: mode }); entry.debts.push([id, mode]); return true; }
    return false;
  }

  /* ---------------- art layers & places ---------------- */
  // a layer without "choice" shows when its condition holds; a layer with "choice" appears only after that option is taken
  CC.layers = function (camp, st, defs, choiceId) {
    const out = [];
    for (const l of defs || []) {
      if (l.choice && l.choice !== choiceId) continue;
      if (!evalCond(st, l.when)) continue;
      if (!out.includes(l.id)) out.push(l.id);
    }
    return out;
  };
  CC.stops = function (camp, st) {
    const out = [];
    const push = p => { if (p && out[out.length - 1] !== p) out.push(p); };
    for (const e of st.log) {
      if (e.k === "node") push(camp.nodes[e.n].place);
      if (e.k === "choice") { const c = camp.nodes[e.n].choices.find(x => x.id === e.c); push(c.place); }
    }
    return out;
  };

  /* ---------------- director ---------------- */
  CC.director = function (camp, st, chId) {
    const chap = camp.chapters.find(c => c.id === chId);
    const out = [];
    for (const n of nodesIn(camp, chId, "side")) {
      const eligible = !st.done.includes(n.id) && evalCond(st, n.when);
      const spec = atoms(n.when).length;
      const due = (n.callbacks || []).filter(c => st.echoes[c.pays] && !st.echoes[c.pays].paid.length && evalCond(st, c.when)).length;
      out.push({ id: n.id, eligible, base: n.salience || 0, spec, due, score: (n.salience || 0) + 2 * spec + 3 * due });
    }
    const ranked = out.filter(x => x.eligible).sort((a, b) => b.score - a.score || camp.nodes[a.id].order - camp.nodes[b.id].order);
    const sits = CC.situations(camp, st), kinds = sits.map(x => x.kind);
    if (kinds.includes("absent") || kinds.includes("dead")) return { all: out, offer: [], absent: sits.find(x => x.kind === "absent" || x.kind === "dead").id };
    const n = Math.max(1, (chap.offer || 2) - (kinds.includes("sidelined") || (!camp.situations && st.v["flag.sidelined"]) ? 1 : 0));
    return { all: out, offer: ranked.slice(0, n).map(x => x.id) };
  };

  function enterChapter(camp, st, i) {
    if (i >= camp.chapters.length) { checkCommits(camp, st, true); st.phase = "end"; st.cur = null; st.log.push({ k: "end" }); return; }
    st.ch = i; st.lastOrder = -1;
    const chap = chapterOf(camp, st);
    st.log.push({ k: "ch", c: chap.id, p: idxWhere(st, chap.intro) });
    tickSituations(camp, st);
    checkCommits(camp, st, false);
    // interrupts: crises that pre-empt a chapter when a meter crosses its line (disfavor, exposure)
    const intr = Object.values(camp.nodes).filter(n => n.kind === "interrupt" && !st.done.includes(n.id) && evalCond(st, n.when)).sort((a, b) => a.order - b.order)[0];
    if (intr) return enterNode(camp, st, intr.id);
    chapterBody(camp, st);
  }
  function chapterBody(camp, st) {
    const chap = chapterOf(camp, st);
    // main_first: the chapter opens on its main scene (a cold open); its side storylets are offered afterwards
    if (chap.main_first && st.sidedCh !== chap.id && st.lastOrder === -1) return nextMain(camp, st);
    offerSides(camp, st);
  }
  function offerSides(camp, st) {
    const chap = chapterOf(camp, st);
    st.sidedCh = chap.id;
    const hasSides = nodesIn(camp, chap.id, "side").length > 0;
    const d = CC.director(camp, st, chap.id);
