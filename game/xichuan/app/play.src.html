<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>汐川的第七个春天</title>
<style>
:root { --ink: #f4f1ec; --muted: #c9c3bb; --box: rgba(18, 24, 44, .82); --edge: rgba(255, 255, 255, .18); --accent: #ffb3c7; --accent-ink: #3a1d27; --bg: #0b0f1c; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.7 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent }
#stage { position: fixed; inset: 0; margin: auto; aspect-ratio: 16 / 9; max-width: 100vw; max-height: 100vh; width: 100vw; overflow: hidden; background: #111; user-select: none }
@media (max-aspect-ratio: 16/9) { #stage { width: 100vw; height: auto } }
@media (orientation: portrait) and (max-width: 700px) { #stage { aspect-ratio: auto; width: 100vw; height: 100dvh } }
.layer { position: absolute; inset: 0 }
#bg { background-size: cover; background-position: center; transition: opacity .6s }
#bg .ph, #cg .ph { position: absolute; left: 16px; top: 14px; font-size: 13px; color: rgba(255,255,255,.75); letter-spacing: .08em; background: rgba(0,0,0,.25); padding: 2px 10px; border-radius: 99px }
#sprites { pointer-events: none; will-change: transform }
.fx { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .35s; pointer-events: none; display: block }
.sprite { position: absolute; bottom: 0; height: 96%; aspect-ratio: 2 / 3; transform: translateX(-50%); transition: left .35s, filter .25s, opacity .3s; display: flex; align-items: flex-end; justify-content: center }
.sprite img { height: 100%; width: auto; object-fit: contain }
.sprite.dim { filter: brightness(.62) saturate(.8) }
.sprite svg { height: 100%; width: 100% }
@media (orientation: portrait) and (max-width: 700px) { .sprite { height: 62%; bottom: 26% } }
#cg { background-size: cover; background-position: center; opacity: 0; pointer-events: none; transition: opacity .6s }
#cg.on { opacity: 1 }
#box { position: absolute; left: 3%; right: 3%; bottom: 3%; min-height: 26%; background: var(--box); border: 1px solid var(--edge); border-radius: 14px; padding: 2.6% 3.2% 2%; backdrop-filter: blur(6px); cursor: pointer }
#name { position: absolute; top: -18px; left: 4%; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 3px 18px; border-radius: 99px; font-size: 15px; letter-spacing: .06em }
#name:empty { display: none }
#text { font-size: clamp(15px, 2.1vw, 21px); line-height: 1.75; min-height: 3.5em; white-space: pre-wrap }
#text.think { color: #cfe3ff; font-style: italic }
#next { position: absolute; right: 2.4%; top: 34%; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 10px solid var(--accent); animation: bob 1s infinite; opacity: 0 }
#next.on { opacity: 1 }
@keyframes bob { 50% { transform: translateY(4px) } }
#bar { position: absolute; right: 4%; bottom: calc(3% + 4px); display: flex; gap: 4px; z-index: 3 }
#bar button, .menu button, .panel button { font: inherit; font-size: 12.5px; color: var(--muted); background: none; border: 0; padding: 4px 8px; border-radius: 6px; cursor: pointer }
#bar button[aria-pressed="true"] { color: var(--accent) }
#bar button { white-space: nowrap }
@media (max-width: 520px) { #bar { left: 4%; right: 4%; justify-content: space-between; gap: 0 } #bar button { padding: 4px 2px; font-size: 12px } }
#bar button:hover { color: var(--ink) }
.menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(6, 8, 18, .35); z-index: 4 }
.menu .prompt { color: var(--muted); font-size: 14px; letter-spacing: .1em; margin-bottom: 4px }
.menu .opt { min-width: min(560px, 82%); font-size: clamp(14px, 1.8vw, 18px); color: var(--ink); background: var(--box); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 22px; text-align: center; transition: background .15s, border-color .15s }
.menu .opt:hover, .menu .opt:focus-visible { border-color: var(--accent); background: rgba(58, 29, 39, .85); outline: none }
.menu .opt[disabled] { opacity: .45; cursor: default }
.menu .opt.talk-opt { border-style: dashed; color: var(--accent) }
.menu form.talk { display: flex; gap: 8px; width: min(560px, 86%); flex-wrap: wrap; justify-content: center }
.menu form.talk input { flex: 1 1 260px; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--box); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 16px; outline: none }
.menu form.talk button { font-size: 15px; color: var(--ink); border: 1px solid var(--edge); background: var(--box); border-radius: 12px; padding: 10px 18px }
.heart { position: absolute; z-index: 3; font-size: clamp(22px, 3vw, 34px); color: #ff8fb1; pointer-events: none; animation: heart 1.6s ease-out forwards; text-shadow: 0 0 12px rgba(255,143,177,.7) }
@keyframes heart { 0% { opacity: 0; transform: translateY(10px) scale(.6) } 20% { opacity: 1; transform: translateY(0) scale(1.1) } 100% { opacity: 0; transform: translateY(-60px) scale(1) } }
.panel { position: absolute; inset: 4%; background: rgba(10, 13, 26, .94); border: 1px solid var(--edge); border-radius: 14px; z-index: 6; display: flex; flex-direction: column; padding: 18px 22px }
.panel h2 { margin: 0 0 10px; font-size: 18px; letter-spacing: .1em }
.panel .body { overflow: auto; flex: 1; padding-right: 6px }
.panel .close { position: absolute; top: 10px; right: 12px; font-size: 14px }
.log p { margin: 0 0 10px } .log b { color: var(--accent); margin-right: 8px; font-weight: 600 }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px }
.slot { text-align: left !important; border: 1px solid var(--edge) !important; padding: 10px 12px !important; color: var(--ink) !important; line-height: 1.5 }
.slot small { color: var(--muted); display: block }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px }
.gallery div { aspect-ratio: 16/9; border-radius: 8px; background: #222 center/cover; display: flex; align-items: flex-end; padding: 6px 10px; font-size: 12.5px; border: 1px solid var(--edge) }
.gallery div.locked { color: var(--muted); background: repeating-linear-gradient(45deg, #1a1d2a 0 10px, #161925 10px 20px) }
#title { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; justify-content: center; padding-left: 8%; gap: 10px; background-size: cover; background-position: center }
#title::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,10,22,.85), rgba(8,10,22,.2) 70%) }
#title > * { position: relative }
#title h1 { margin: 0; font-size: clamp(26px, 5vw, 54px); letter-spacing: .12em; font-weight: 700 }
#title .sub { color: var(--muted); letter-spacing: .3em; font-size: clamp(11px, 1.4vw, 15px); margin-bottom: 18px }
#title button { align-self: flex-start; font: inherit; font-size: clamp(14px, 1.8vw, 18px); color: var(--ink); background: none; border: 0; border-left: 2px solid transparent; padding: 4px 12px; cursor: pointer; letter-spacing: .12em }
#title button:hover, #title button:focus-visible { border-left-color: var(--accent); color: var(--accent); outline: none }
#title .lang { position: absolute; top: 16px; right: 20px; font-size: 13px }
.end { position: absolute; inset: 0; z-index: 5; background: rgba(6, 8, 18, .88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 8%; text-align: center }
.end h2 { margin: 0; letter-spacing: .12em; text-wrap: balance } .end h3 { margin: 10px 0 0; font-size: 14px; font-weight: 500; letter-spacing: .2em; color: var(--muted) } .end p { margin: 0; color: var(--muted); max-width: 640px; line-height: 1.8 }
.end .credits { font-size: 12px; opacity: .6; margin-top: 6px }
.end button { font: inherit; color: var(--ink); background: var(--box); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 20px; cursor: pointer; margin-top: 10px }
[hidden] { display: none !important }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <div id="sprites" class="layer"></div>
  <div id="cg" class="layer"></div>
  <div id="box" role="button" tabindex="0" aria-label="next"><div id="name"></div><div id="text"></div><div id="next"></div></div>
  <div id="bar"></div>
  <div id="menu" class="menu" hidden></div>
  <div id="panel" class="panel" hidden></div>
  <div id="endscreen" class="end" hidden></div>
  <div id="title"></div>
</div>
<script>/*__ENGINE__*/</script>
<script>
const CAMP = /*__CAMPAIGN__*/null;
const ART_FILES = new Set(/*__ART__*/[]);
// 不管页面是以 /assets/xichuan、/assets/xichuan/ 还是 /assets/xichuan/index.html 打开，图都从同一个目录取
const ART_BASE = (() => { const u = new URL(location.href); u.search = u.hash = ""; let p = u.pathname; if (/\.html?$/.test(p)) p = p.replace(/[^/]*$/, ""); else if (!p.endsWith("/")) p += "/"; return u.origin + p + "art/"; })();
const IMGS = new Map();          // url -> Promise<Image>，同一张图只下一次
function preload(url) {
  if (!url) return Promise.resolve(null);
  if (!IMGS.has(url)) IMGS.set(url, new Promise(res => { const i = new Image(); i.onload = () => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()).then(() => res(i)); i.onerror = () => res(null); i.src = url; }));
  return IMGS.get(url);
}
CC.validate(CAMP);
const $ = s => document.querySelector(s);
const store = { get(k, d) { try { const v = localStorage.getItem("xc." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("xc." + k, JSON.stringify(v)); } catch {} } };
// 网站（StoryDate）选过的语言优先：localStorage 的 sd.lang；游戏里切换时也写回去，两边一致。
const siteLang = () => { try { const v = localStorage.getItem("sd.lang"); return v === "zh" || v === "en" ? v : null; } catch { return null; } };
const saveLang = l => { store.set("lang", l); try { localStorage.setItem("sd.lang", l); } catch {} };
let LANG = siteLang() || store.get("lang", (navigator.language || "").startsWith("zh") ? "zh" : "en");
const t = x => x == null ? "" : typeof x === "string" ? x : (x[LANG] || x.zh || x.en || "");
const UI = {
  zh: { start: "开始游戏", cont: "继续", load: "读取存档", gallery: "回想", log: "回看", auto: "自动", skip: "跳过", save: "存档", loadS: "读档", lang: "EN", title: "标题", close: "关闭", empty: "空", saved: "已存档", sub: "THE SEVENTH SPRING OF XICHUAN", cgs: "CG", ends: "结局", locked: "未解锁", back: "回到标题", song: "片尾曲《第七个春天》 · AI 生成（腾讯音乐人 MusicBuddy）", again: "从头再来", prompt: "怎么做？", tilt: "立体", music: "音乐", talk: n => `（对${n}说点什么……）`, talkHint: "想对她说什么？", send: "说", cancel: "算了", noReply: "（她好像没听清，看了你一眼。）", savedAt: n => `存档 ${n}` },
  en: { start: "Start", cont: "Continue", load: "Load", gallery: "Gallery", log: "Log", auto: "Auto", skip: "Skip", save: "Save", loadS: "Load", lang: "中", title: "Title", close: "Close", empty: "Empty", saved: "Saved", sub: "汐川的第七个春天", cgs: "CG", ends: "Endings", locked: "Locked", back: "Back to title", song: "Ending song \"The Seventh Spring\" · AI-generated (Tencent Music MusicBuddy)", again: "Play again", prompt: "What do you do?", tilt: "3D", music: "Music", talk: n => `(Say something to ${n}…)`, talkHint: "What do you want to say?", send: "Say", cancel: "Never mind", noReply: "(She doesn't seem to catch it, and just glances at you.)", savedAt: n => `Slot ${n}` },
};
const ui = k => UI[LANG][k];
// 手机屏幕用 1280 宽的小图（art/m/ 下），体积约一半
const SMALL = Math.max(screen.width || 0, screen.height || 0) <= 1000;
const art = p => SMALL && ART_FILES.has("m/" + p) ? ART_BASE + "m/" + p : ART_FILES.has(p) ? ART_BASE + p : null;
// 提前下好接下来要用的图：背景（连深度图）、CG、立绘
function prefetch(ops) {
  for (const op of (ops || []).slice(0, 60)) {
    if (op.op === "bg" && op.id) { preload(art(`bg/${op.id}.webp`)); preload(art(`depth/bg/${op.id}.webp`)); }
    else if (op.op === "cg" && op.id) { preload(art(`cg/${op.id}.webp`)); preload(art(`depth/cg/${op.id}.webp`)); }
    else if ((op.op === "show" || op.op === "say") && op.who && op.who !== "me") preload(art(`sprites/${op.who}/${op.face || "normal"}.webp`));
  }
}
const hue = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const COLORS = { zhiyao: "#ff9db8", shencheng: "#8fc7ff", jibai: "#c7b4ff", zhou: "#c9b48a", chenghang: "#9fe0a8" };
const nameOf = who => who === "me" ? t(CAMP.player.name) : who ? t(CAMP.chars[who].name) : "";

/* ---------- state ---------- */
let G = null;                          // engine state
let V = { bg: null, cg: null, sprites: {}, queue: [], i: 0, log: [], speaker: null };
let typing = null, typingFull = "", auto = false, skip = false, timer = null;
const seen = new Set(store.get("seen", []));
const markSeen = k => { if (!seen.has(k)) { seen.add(k); store.set("seen", [...seen]); } };
const unlock = (kind, id) => { const u = store.get(kind, []); if (!u.includes(id)) { u.push(id); store.set(kind, u); } };

/* ---------- drawing ---------- */
function drawBg() {
  const el = $("#bg"), id = V.bg, url = id && art(`bg/${id}.webp`);
  const grad = id ? `linear-gradient(160deg, hsl(${hue(id)} 45% 32%), hsl(${(hue(id) + 40) % 360} 40% 14%))` : "none";
  audioMood(id);
  const apply = () => {
    if (V.bg !== id || el.dataset.shown === (id || "")) return; el.dataset.shown = id || "";
    el.style.backgroundImage = url ? `url("${url}"), ${grad}` : grad;
    ph(el, !url && id ? t((CAMP.art.bg || {})[id]) || id : null);
    FX.bg && FX.bg.set(url, url && art(`depth/bg/${id}.webp`));
  };
  if (!url) return apply();
  // 新背景下好之前继续显示上一张，不露出底色；太久没到（网慢）才先垫颜色
  preload(url).then(apply); setTimeout(apply, el.dataset.shown ? 2500 : 1500);
}
function drawCg() {
  const el = $("#cg"), id = V.cg, url = id && art(`cg/${id}.webp`);
  if (!id) { el.classList.remove("on"); return; }
  const grad = `radial-gradient(circle at 60% 40%, hsl(${hue(id)} 60% 55%), hsl(${(hue(id) + 200) % 360} 40% 12%))`;
  const apply = () => {
    if (V.cg !== id || (el.dataset.shown === id && el.classList.contains("on"))) return; el.dataset.shown = id;
    el.style.backgroundImage = url ? `url("${url}"), ${grad}` : grad;
    ph(el, !url ? "CG · " + (t((CAMP.art.cg || {})[id]) || id) : null);
    FX.cg && FX.cg.set(url, url && art(`depth/cg/${id}.webp`));
    el.classList.add("on");
  };
  if (!url) return apply();
  preload(url).then(apply); setTimeout(apply, 2500);   // CG 下好了才淡入
}
const POS = { left: 24, center: 50, right: 76 };
function silhouette(who, face) {
  const c = COLORS[who] || "#ddd", f = t((CAMP.art.faces || {})[face]) || face;
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 90 160");
  svg.innerHTML = `<defs><linearGradient id="g-${who}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".95"/><stop offset="1" stop-color="${c}" stop-opacity=".35"/></linearGradient></defs>
    <circle cx="45" cy="38" r="20" fill="url(#g-${who})"/><path d="M12 160 C12 95 25 70 45 66 C65 70 78 95 78 160 Z" fill="url(#g-${who})"/>
    <text x="45" y="112" text-anchor="middle" font-size="9" fill="#1b1b2a" font-weight="700"></text><text x="45" y="125" text-anchor="middle" font-size="7.5" fill="#1b1b2a"></text>`;
  svg.querySelectorAll("text")[0].textContent = t(CAMP.chars[who].name);
  svg.querySelectorAll("text")[1].textContent = f;
  return svg;
}
function ph(el, label) { el.querySelector(".ph")?.remove(); if (label) { const s = document.createElement("span"); s.className = "ph"; s.textContent = label; el.append(s); } }
function drawSprites() {
  const box = $("#sprites"); box.replaceChildren();
  for (const [who, s] of Object.entries(V.sprites)) {
    const d = document.createElement("div"); d.className = "sprite" + (V.speaker && V.speaker !== who ? " dim" : "");
    d.style.left = (POS[s.at] ?? 50) + "%";
    const url = art(`sprites/${who}/${s.face}.webp`) || art(`sprites/${who}/normal.webp`);   // an expression not drawn yet: the standard sprite
    if (!url) continue;   // 还没画立绘的人（配角）不放占位轮廓，只在对话框上显示名字
    const img = new Image(); img.src = url; img.alt = ""; d.append(img);
    box.append(d);
  }
}
function draw() { drawBg(); drawSprites(); drawCg(); }

/* ---------- the script runner ---------- */
function load(lines, src) { V.queue = lines.map((l, k) => ({ ...l, src: `${src}:${k}` })); V.i = 0; prefetch(lines); }
function step() {
  clearTimeout(timer);
  if (typing) { finishTyping(); return; }
  while (V.i < V.queue.length) {
    const op = V.queue[V.i++];
    if (op.when && !CC.evalCond(G, op.when)) continue;
    if (op.op === "bg") { V.bg = op.id; V.cg = null; V.sprites = {}; draw(); continue; }
    if (op.op === "show") {
      const at = op.at || (V.sprites[op.who] || {}).at || "center";
      for (const w of Object.keys(V.sprites)) if (w !== op.who && V.sprites[w].at === at) delete V.sprites[w];   // 同一个位置只站一个人：后上来的把前面的人换下去
      V.sprites[op.who] = { face: op.face, at }; drawSprites(); continue; }
    if (op.op === "hide") { if (op.who) delete V.sprites[op.who]; else V.sprites = {}; drawSprites(); continue; }
    if (op.op === "cg") { if (op.id && !art(`cg/${op.id}.webp`)) continue;   // 还没画的 CG 先跳过，不显示占位；图一到就会出现
      V.cg = op.id; if (op.id) unlock("cg", op.id); drawCg(); continue; }
    if (op.op === "say") { say(op); return; }
  }
  next();                                        // the scene's lines are done: ask the engine what comes next
}
function say(op) {
  if (op.face && op.who && V.sprites[op.who]) V.sprites[op.who].face = op.face;
  if (op.heart) { const h = document.createElement("div"); h.className = "heart"; h.textContent = "♡"; const at = (V.sprites[op.who] && POS[V.sprites[op.who].at]) ?? 50; h.style.left = `calc(${at}% + 9%)`; h.style.top = "18%"; $("#stage").append(h); setTimeout(() => h.remove(), 1700); }
  V.speaker = op.who && op.who !== "me" ? op.who : null; drawSprites();
  $("#name").textContent = op.who ? nameOf(op.who) : "";
  const el = $("#text"), full = t(op.t);
  el.classList.toggle("think", !!op.think);
  V.log.push({ who: op.who ? nameOf(op.who) : "", text: op.think ? `（${full}）` : full }); if (V.log.length > 300) V.log.shift();
  const wasSeen = seen.has(op.src); markSeen(op.src);
  if (skip && !wasSeen) { skip = false; renderBar(); }
  if (skip) { el.textContent = full; $("#next").classList.add("on"); timer = setTimeout(step, 40); return; }
  $("#next").classList.remove("on");
  let k = 0; el.textContent = "";
  typingFull = full;
  typing = setInterval(() => { k += 2; el.textContent = full.slice(0, k); if (k >= full.length) finishTyping(); }, 28);
}
function finishTyping() {
  if (typing) { clearInterval(typing); $("#text").textContent = typingFull; typing = null; }
  $("#next").classList.add("on");
  if (auto) timer = setTimeout(step, 1400 + 40 * $("#text").textContent.length);
}

/* ---------- engine bridge ---------- */
function next() {
  if (G.phase === "end") return showEnd();
  if (G.phase === "side") return sideMenu();
  if (G.phase === "node") {
    const n = CAMP.nodes[G.cur];
    if (V.started !== G.cur) { V.started = G.cur; load(n.script || [], "n:" + n.id); autosave(); return step(); }
    return choiceMenu(n);
  }
}
function menu(prompt, opts) {
  const m = $("#menu"); m.replaceChildren(); m.hidden = false; skip = false; renderBar();
  if (prompt) { const p = document.createElement("div"); p.className = "prompt"; p.textContent = prompt; m.append(p); }
  opts.forEach(o => { const b = document.createElement("button"); b.className = "opt"; b.textContent = o.label; b.disabled = !!o.disabled; b.onclick = () => { m.hidden = true; o.go(); }; m.append(b); });
  m.querySelector("button:not([disabled])")?.focus();
}
function choiceMenu(n) {
  const os = CC.choices(CAMP, G).filter(o => !o.locked);
  os.forEach(o => prefetch((o.c.script || []).slice(0, 12)));
  menu(ui("prompt"), os.map(o => ({ label: t(o.c.label), go: () => {
    V.log.push({ who: "", text: "▸ " + t(o.c.label) });
    const lines = o.c.script || []; CC.choose(CAMP, G, o.id); V.started = null;
    load(lines, `c:${n.id}.${o.id}`); step();
  } })));
  // 自由对话：场上有女主、这一幕还有说话的机会、网站接了 AI，就多一个“对她说点什么”
  const who = talkTarget(n);
  if (who && TALK.ai && CC.freeLeft(CAMP, G) > 0) {
    const b = document.createElement("button"); b.className = "opt talk-opt"; b.textContent = ui("talk")(nameOf(who));
    b.onclick = () => talkBox(n, who); $("#menu").insertBefore(b, $("#menu .opt"));
  }
}
function sideMenu() {
  const ch = CAMP.chapters[G.ch];
  G.offer.forEach(id => prefetch((CAMP.nodes[id].script || []).slice(0, 12)));

/* ---------- 背景音乐（实验版，v0.18）：页面里实时合成，不用音频文件 ----------
   轻柔的钢琴琶音 + 和弦铺底，按场景分白天、黄昏、夜里、雨天；海边的场景加海浪，下雨的场景加雨声。

const AUDIO = { on: store.get("music", true), ctx: null, out: null, mood: "day", sea: false, rain: false, beat: 0, next: 0, timer: null, amb: null };
const MOODS = {   // 每小节一个和弦（MIDI 音高）、每分钟拍数、音量
  day:   { bpm: 76, vol: .9, chords: [[60, 64, 67, 71], [57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 67]] },
  dusk:  { bpm: 68, vol: .8, chords: [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]] },
  night: { bpm: 58, vol: .65, chords: [[57, 60, 64, 67], [53, 57, 60, 64], [48, 52, 55, 59], [55, 59, 62, 65]] },

const BGMOOD = { cinema_night: "night", seawall_night: "night", street: "night", rain_street: "night", projection: "night", train: "dusk", cinema_dusk: "dusk", rooftop: "dusk", library: "dusk", oldhouse: "dusk" };
const SEA = new Set(["station", "cinema_dusk", "cinema_night", "seawall_night", "beach", "train", "street"]);
function audioMood(id) { if (!id) return; AUDIO.mood = BGMOOD[id] || "day"; AUDIO.sea = SEA.has(id); AUDIO.rain = id === "rain_street"; audioAmb(); }
/* 片尾曲（决策记录 v0.29）：结局画面放一首歌，合成音乐让开；回到标题时停掉，合成音乐回来 */
const SONG = { el: null };
function songPlay() {
  if (!AUDIO.on) return;
  try {
    if (!SONG.el) { SONG.el = new Audio(ART_BASE.replace(/art\/$/, "audio/") + "seventh_spring.mp3"); SONG.el.volume = .85; }
    SONG.el.currentTime = 0; SONG.el.play().catch(() => {});

function songStop() {
  if (SONG.el) SONG.el.pause();

    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600;
    const dl = c.createDelay(); dl.delayTime.value = .33; const fb = c.createGain(); fb.gain.value = .32; const wet = c.createGain(); wet.gain.value = .35;
    out.connect(lp); lp.connect(c.destination); lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(c.destination);

  audioAmb();
}
function audioStop() {
  if (!AUDIO.ctx) return; const c = AUDIO.ctx;
  AUDIO.out.gain.setTargetAtTime(0, c.currentTime, .4); clearInterval(AUDIO.timer); AUDIO.timer = null; audioAmb(true);
}
function note(midi, t, len, vol, type) {
  const c = AUDIO.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), f = 440 * Math.pow(2, (midi - 69) / 12);
  o.type = type || "sine"; o.frequency.value = f; o2.type = "sine"; o2.frequency.value = f * 2; const g2 = c.createGain(); g2.gain.value = .18;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0008, t + len);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(AUDIO.out); o.start(t); o2.start(t); o.stop(t + len + .05); o2.stop(t + len + .05);

  const c = AUDIO.ctx; if (!c || document.hidden) return;

    if (b === 0) { ch.forEach(n => note(n - 12, t, spb * 4.2, .05 * m.vol, "triangle")); note(ch[0] - 24, t, spb * 4, .07 * m.vol, "sine"); }
    const pat = [0, 2, 1, 3, 2, 3, 1, 2][(AUDIO.beat % 8)];
    if (!(AUDIO.mood === "night" && b === 3)) note(ch[pat] + 12, t, spb * 2.6, .07 * m.vol);
    if (AUDIO.beat % 16 === 14) note(ch[3] + 24, t + spb / 2, spb * 2, .03 * m.vol);

function audioAmb(stop) {        // 海浪、雨声：滤过的噪声，海浪带慢起伏
  const c = AUDIO.ctx; if (!c) return;
  const want = stop || !AUDIO.on ? null : AUDIO.rain ? "rain" : AUDIO.sea ? "sea" : null;
  if (AUDIO.amb && AUDIO.amb.kind === want) return;
  if (AUDIO.amb) { const a = AUDIO.amb; a.g.gain.setTargetAtTime(0, c.currentTime, .6); setTimeout(() => { try { a.src.stop(); a.lfo && a.lfo.stop(); } catch {} }, 3000); AUDIO.amb = null; }
