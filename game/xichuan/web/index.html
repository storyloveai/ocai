alls asleep almost at once. I sit by the projector and listen to the sea all afternoon."}}, {"op": "say", "who": "jibai", "t": {"zh": "（醒来）……你一直在？", "en": "(waking) …You stayed the whole time?"}, "face": "surprised"}], "values": ["ti"]}, {"id": "sign", "type": "dilemma", "label": {"zh": "在床板背面刻下两个人的名字。", "en": "Carve both your names into the underside of the cot."}, "out": [{"text": {"zh": "……你在破坏文物。", "en": "…You're vandalizing a historical artifact."}}], "effects": [{"add": "rel.jibai.intimacy", "by": 1}, {"add": "rel.jibai.trust", "by": 1}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "……你在破坏文物。", "en": "…You're vandalizing a historical artifact."}, "face": "surprised"}, {"op": "say", "who": null, "t": {"zh": "她嘴上这么说，还是接过小刀，在我的名字旁边，一笔一画地刻上了“季白”。", "en": "She says that, but she takes the knife anyway and, stroke by careful stroke, carves 'Ji Bai' beside my name."}}], "values": ["xi"]}], "salience": 1, "order": 2, "script": [{"op": "bg", "id": "projection"}, {"op": "say", "who": null, "t": {"zh": "放映室明天就要拆了。季白在打包最后一箱胶片，我坐在那张小床上。床太小了，腿伸不直。", "en": "The booth comes down tomorrow. Ji Bai is packing the last box of film; I'm sitting on the little cot. It's too small now. My legs won't stretch out."}}, {"op": "show", "who": "jibai", "face": "normal", "at": "center"}, {"op": "say", "who": "jibai", "t": {"zh": "这两年，我修片修到太晚，就在这张床上睡。", "en": "These two years, whenever I worked too late, I slept on that cot."}, "face": "shy"}, {"op": "say", "who": "jibai", "t": {"zh": "……原来，我一直睡在你的床上。", "en": "…So all this time, I've been sleeping in your bed."}, "face": "shy"}], "when": {"v": "flag.route_jibai", "op": "==", "val": true}, "cast": [{"id": "jibai"}]}, "c6_shelf": {"id": "c6_shelf", "chapter": "c6", "kind": "side", "title": {"zh": "第七个架子的背面", "en": "Behind the Seventh Shelf"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "仓库要清空了。我们把第七个架子搬开，后面的墙上，用图钉钉着一张便签。", "en": "The storeroom is being cleared. We move the seventh shelf aside; on the wall behind it, a note is pinned up with a thumbtack."}}], "choices": [{"id": "tonight", "type": "dilemma", "label": {"zh": "“今晚就去找。”", "en": "\"We'll look tonight.\""}, "out": [{"text": {"zh": "好。我带手套。胶片不能用手直接碰。", "en": "All right. I'll bring gloves. You can't touch film with bare hands."}}], "effects": [{"add": "rel.jibai.intimacy", "by": 1}, {"set": "flag.j_clue", "to": true}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "好。我带手套。胶片不能用手直接碰。", "en": "All right. I'll bring gloves. You can't touch film with bare hands."}, "face": "smile"}], "values": ["yong"]}, {"id": "keep", "type": "expression", "label": {"zh": "把便签小心取下来，夹进第七卷的铁盒里。", "en": "Take the note down carefully and tuck it into reel seven's tin."}, "out": [{"text": {"zh": "……你开始像个修胶片的人了。", "en": "…You're starting to act like a film restorer."}}], "effects": [{"add": "rel.jibai.trust", "by": 1}, {"add": "rel.jibai.esteem", "by": 1}, {"set": "flag.j_clue", "to": true}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "……你开始像个修胶片的人了。", "en": "…You're starting to act like a film restorer."}, "face": "smile"}], "values": ["ti"]}], "salience": 1, "order": 3, "script": [{"op": "bg", "id": "storeroom"}, {"op": "say", "who": null, "t": {"zh": "仓库要清空了。我们把第七个架子搬开，后面的墙上，用图钉钉着一张便签。", "en": "The storeroom is being cleared. We move the seventh shelf aside; on the wall behind it, a note is pinned up with a thumbtack."}}, {"op": "show", "who": "jibai", "face": "surprised", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "是爷爷的字：“剩下的，在家里。”", "en": "It's my grandfather's handwriting: 'The rest is at home.'"}}, {"op": "say", "who": "jibai", "t": {"zh": "……家里。陆同学，是你家。", "en": "…At home. Mr. Lu, that means your house."}, "face": "surprised"}], "when": {"v": "flag.route_jibai", "op": "==", "val": true}, "cast": [{"id": "jibai"}]}, "c7_attic": {"id": "c7_attic", "chapter": "c7", "kind": "main", "title": {"zh": "给远", "en": "For Yuan"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "盒盖上贴着一张纸：“给远”。", "en": "There's a slip of paper taped to the lid: 'For Yuan.'"}}], "choices": [{"id": "together", "type": "dilemma", "label": {"zh": "“把它接回去。明天晚上，我们把第七卷完整地放一遍。”", "en": "\"Splice it back in. Tomorrow night, we'll run reel seven all the way through.\""}, "out": [{"text": {"zh": "放在哪里？影院已经没有了。", "en": "Where? There's no cinema anymore."}}], "effects": [{"add": "rel.jibai.intimacy", "by": 1}, {"add": "rel.jibai.trust", "by": 1}, {"set": "flag.j_whole", "to": true}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "放在哪里？影院已经没有了。", "en": "Where? There's no cinema anymore."}, "face": "sad"}, {"op": "say", "who": "me", "t": {"zh": "放映机在我这里。银幕的话——海堤上，挂一块白布就够了。", "en": "I've got the projector. As for a screen—on the seawall, a white sheet will do."}, "when": {"v": "flag.j_projector", "op": "==", "val": true}}, {"op": "say", "who": "me", "t": {"zh": "我去借。学校的、文化馆的，总有一台还能转。", "en": "I'll borrow one. The university's, the community center's—one of them must still run."}, "when": {"v": "flag.j_projector", "op": "!=", "val": true}}, {"op": "say", "who": "jibai", "t": {"zh": "……好。今晚我不睡了。一格都不会接错。", "en": "…All right. I won't sleep tonight. Not a single frame will be out of place."}, "face": "smile"}], "values": ["yong"]}, {"id": "alone", "type": "expression", "label": {"zh": "“是给我的。……我想先一个人看。”", "en": "\"It's for me. …I'd like to watch it alone first.\""}, "out": [{"text": {"zh": "……嗯。应该的。", "en": "…Mm. Of course."}}], "effects": [{"add": "rel.jibai.intimacy", "by": -1}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "……嗯。应该的。", "en": "…Mm. Of course."}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "她把铁盒递给我，脱下白手套，放在铁盒上面，自己下楼去了。", "en": "She hands me the tin, takes off her white gloves, lays them on top of it, and goes downstairs alone."}}], "values": ["cheng"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "oldhouse"}, {"op": "say", "who": null, "t": {"zh": "“剩下的，在家里。”我们从晚上找到半夜，最后在阁楼的樟木箱底下，找到了一个很小的铁盒。", "en": "'The rest is at home.' We search from evening until midnight, and at last, at the bottom of a camphor chest in the attic, we find a very small tin."}, "when": {"v": "flag.j_clue", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "收拾阁楼的时候，樟木箱底下掉出来一个很小的铁盒。", "en": "While clearing out the attic, a very small tin drops from the bottom of a camphor chest."}, "when": {"v": "flag.j_clue", "op": "!=", "val": true}}, {"op": "say", "who": null, "t": {"zh": "盒盖上贴着一张纸：“给远”。", "en": "There's a slip of paper taped to the lid: 'For Yuan.'"}}, {"op": "show", "who": "jibai", "face": "surprised", "at": "center"}, {"op": "say", "who": "jibai", "t": {"zh": "……就是它。第七卷剪掉的那一段。", "en": "…This is it. The part cut from reel seven."}, "face": "surprised"}, {"op": "say", "who": "jibai", "t": {"zh": "你说过要找回来。……你真的找到了。", "en": "You said we'd find it. …And you actually did."}, "face": "smile", "when": {"v": "flag.j_search", "op": "==", "val": true}}, {"op": "say", "who": "jibai", "t": {"zh": "胶片还好。他存得很仔细。", "en": "The film's in good shape. He stored it very carefully."}, "face": "normal"}], "when": {"v": "flag.route_jibai", "op": "==", "val": true}, "cast": [{"id": "jibai"}]}, "c7_run": {"id": "c7_run", "chapter": "c7", "kind": "main", "title": {"zh": "海堤上的放映", "en": "A Screening on the Seawall"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "海堤上挂起了一块白布。来的人不多：老周，程航，几个路过的学生，还有一只猫。", "en": "A white sheet hangs on the seawall. Not many come: Old Zhou, Cheng Hang, a few passing students, and a cat."}}], "choices": [{"id": "stay", "type": "dilemma", "label": {"zh": "“留在汐川。我们开一家没有影院的电影院。每个周六，海堤上，放一场。”", "en": "\"Stay in Xichuan. We'll open a cinema without a cinema. Every Saturday, on the seawall, one show.\""}, "out": [{"text": {"zh": "……这是我听过最不合理的提议。没有座位，没有屋顶，下雨就要停。", "en": "…That's the least reasonable proposal I've ever heard. No seats, no roof, and every rain cancels the show."}}], "effects": [{"set": "flag.j_good", "to": true}, {"add": "rel.jibai.intimacy", "by": 1}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "……这是我听过最不合理的提议。没有座位，没有屋顶，下雨就要停。", "en": "…That's the least reasonable proposal I've ever heard. No seats, no roof, and every rain cancels the show."}, "face": "surprised"}, {"op": "cg", "id": "cg_seawall_screen"}, {"op": "say", "who": "jibai", "t": {"zh": "可是，你说的时候，没有一点要结束的样子。", "en": "But when you say it, there's nothing about it that sounds like an ending."}, "face": "shy"}, {"op": "say", "who": "jibai", "t": {"zh": "……陆远。我留下来。放映员，和你。", "en": "…Lu Yuan. I'll stay. As the projectionist—and with you."}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "那是她第一次，叫我的名字。", "en": "It's the first time she's called me by my name."}}, {"op": "cg", "id": null}], "values": ["yong"], "when": {"all": [{"v": "rel.jibai.intimacy", "op": ">=", "val": 8}, {"v": "rel.jibai.trust", "op": ">=", "val": 4}, {"v": "flag.j_projector", "op": "==", "val": true}]}}, {"id": "go", "type": "expression", "label": {"zh": "“去资料馆吧。那里，什么都不会结束。”", "en": "\"Go to the archive. Nothing ever has to end there.\""}, "out": [{"text": {"zh": "……嗯。", "en": "…Mm."}}], "effects": [{"set": "flag.j_normal", "to": true}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "……嗯。", "en": "…Mm."}, "face": "sad"}, {"op": "say", "who": "jibai", "t": {"zh": "谢谢你，陆同学。第七卷，我会照顾好它。", "en": "Thank you, Mr. Lu. I'll take good care of reel seven."}, "face": "smile"}]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "seawall_night"}, {"op": "say", "who": null, "t": {"zh": "海堤上挂起了一块白布。来的人不多：老周，程航，几个路过的学生，还有一只猫。", "en": "A white sheet hangs on the seawall. Not many come: Old Zhou, Cheng Hang, a few passing students, and a cat."}}, {"op": "show", "who": "jibai", "face": "normal", "at": "center"}, {"op": "say", "who": null, "t": {"zh": "那一段，我一个人看完以后，还是交给了她。她接得很整齐，看不出接缝。", "en": "After I watched that section alone, I gave it to her in the end. She spliced it so neatly you can't see the join."}, "when": {"v": "flag.j_whole", "op": "!=", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "报纸上说，这部片子只放一次。今晚，就是那一次。", "en": "The newspaper said this film would be shown only once. Tonight is that once."}, "when": {"v": "flag.j_once", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "放映机转起来了。第一格，是一片海。", "en": "The projector starts to turn. The first frame is the sea."}}, {"op": "say", "who": null, "t": {"zh": "所有的春天放完以后，接缝过去，画面上出现了一个人。是爷爷。他坐在放映室的小床旁边，对着镜头，有点不好意思。", "en": "After all the springs have played, the splice goes by, and a man appears on screen. It's my grandfather. He's sitting beside the cot in the booth, facing the camera, a little embarrassed."}}, {"op": "say", "who": null, "t": {"zh": "“远。你要是看到这个，说明你回来了。那年你爸带你走，我没有留你。对不起。”", "en": "'Yuan. If you're watching this, it means you came back. The year your dad took you away, I didn't ask you to stay. I'm sorry.'"}}, {"op": "say", "who": null, "t": {"zh": "“这部片子，我只想放一次。最后一场，留给你放。”", "en": "'I only ever wanted this film shown once. The last show is yours to run.'"}}, {"op": "say", "who": null, "t": {"zh": "画面暗了。海堤上，没有人说话。", "en": "The picture fades. On the seawall, no one speaks."}}, {"op": "say", "who": null, "t": {"zh": "季白一直看到了最后一格。这一次，她没有转过身去。", "en": "Ji Bai watched all the way to the last frame. This time, she didn't turn away."}, "when": {"v": "flag.j_watched", "op": "==", "val": true}}, {"op": "say", "who": "jibai", "t": {"zh": "……陆同学。他说，最后一场，留给你放。", "en": "…Mr. Lu. He said the last show is yours to run."}, "face": "sad"}, {"op": "say", "who": "jibai", "t": {"zh": "那我呢？七月以后，我去哪里放？", "en": "And what about me? After July, where do I run films?"}, "face": "sad"}], "when": {"v": "flag.route_jibai", "op": "==", "val": true}, "cast": [{"id": "jibai"}, {"id": "zhou"}, {"id": "chenghang"}]}}, "endings": [{"id": "g_end", "title": {"zh": "尾声", "en": "Epilogue"}, "fragments": [{"id": "zhiyao_good", "title": {"zh": "夏知遥 · 好结局「第八个春天」", "en": "Xia Zhiyao · Good Ending: The Eighth Spring"}, "text": {"zh": "第二年三月，汐川的海堤上挂起了一块缝补过的白布，右下角的颜色和别处不一样。来了四十三个人。开场前五分钟，最早那班车进站了。一个扎着侧马尾的女孩拖着箱子一路跑过来，坐进了第一排正中间。“社长，你迟到了。”“……闭嘴。开始吧。”", "en": "The next March, a patched white canvas goes up on the Xichuan seawall; its bottom-right corner is a different shade from the rest. Forty-three people come. Five minutes before the show, the first train of the morning pulls in. A girl with a side ponytail comes running all the way from the station, dragging a suitcase, and drops into the front row, dead center. 'You're late, President.' '…Shut up. Let's begin.'"}, "when": {"v": "flag.z_good", "op": "==", "val": true}}, {"id": "zhiyao_normal", "title": {"zh": "夏知遥 · 普通结局「春天过去了」", "en": "Xia Zhiyao · Normal Ending: And Spring Passed"}, "text": {"zh": "一开始，她每周都会发来照片：老家的天空，医院窗外的树。后来，照片越来越少。第二年春天，我在海堤上放了一场电影，第一排的那个位置空着。散场的时候我才明白，有些话，在站台上不说，就再也说不出口了。", "en": "At first she sends photos every week: the sky back home, the tree outside the hospital window. Then fewer, and fewer. The next spring I hold a screening on the seawall, and that front-row seat stays empty. Only as the crowd leaves do I understand: some words, if you don't say them on the platform, you never get to say at all."}, "when": {"v": "flag.z_normal", "op": "==", "val": true}}, {"id": "shencheng_good", "title": {"zh": "沈澄 · 好结局「第八封信」", "en": "Shen Cheng · Good Ending: The Eighth Letter"}, "text": {"zh": "第二年春天，咖啡馆重新开张，菜单最上面多了一行：“第一排——热可可，一块棉花糖”。可可罐还在柜子最高的那一格，里面有八个信封。第八封寄出去了，走了七百米，从咖啡馆到老房子。上面只写了一句：“今天也在。”", "en": "The next spring the café reopens, with a new line at the top of the menu: 'The Front Row—hot cocoa, one marshmallow.' The cocoa tin still sits on the highest shelf, and now it holds eight envelopes. The eighth one was actually mailed: seven hundred meters, from the café to the old house. It says only: 'Still here today.'"}, "when": {"v": "flag.c_good", "op": "==", "val": true}}, {"id": "shencheng_normal", "title": {"zh": "沈澄 · 普通结局「没有寄出的信」", "en": "Shen Cheng · Normal Ending: Letters Never Sent"}, "text": {"zh": "回到城里以后，我把七封信一封一封读完了。骂我的那些，骂得很准；别的那些，我读了很多遍。第二年春天，我收到一张明信片，背面是汐川的海，没有署名。我知道是谁。可是这一次，她没有写“等你”。", "en": "Back in the city, I read the seven letters, one after another. The ones that call me names are accurate. The others, I read many times. The next spring, a postcard arrives: the sea at Xichuan on the front, no signature. I know who it's from. But this time, she didn't write 'waiting for you.'"}, "when": {"v": "flag.c_normal", "op": "==", "val": true}}, {"id": "jibai_good", "title": {"zh": "季白 · 好结局「没有影院的电影院」", "en": "Ji Bai · Good Ending: A Cinema Without a Cinema"}, "text": {"zh": "后来，汐川的海堤上每个周六都放电影，下雨就停。放映员是个戴圆眼镜的研究生，她现在会看完每一部片子的最后一卷，看完了，就去找坐在第一排的那个人。第七卷没有再放过。它说过只放一次，我们答应了它。", "en": "After that, there's a film on the Xichuan seawall every Saturday, cancelled only by rain. The projectionist is a graduate student in round glasses. These days she watches the final reel of every film, and when it's over, she goes to find the person sitting in the front row. Reel seven is never shown again. It said it would be shown only once, and we promised."}, "when": {"v": "flag.j_good", "op": "==", "val": true}}, {"id": "jibai_normal", "title": {"zh": "季白 · 普通结局「片尾字幕」", "en": "Ji Bai · Normal Ending: End Credits"}, "text": {"zh": "七月，季白去了北京。第七卷跟着她，住进了恒温恒湿的库房。秋天，她寄来一张照片：她站在一排排胶片架中间，笑得很安静。照片背面写着：“这里的每一部，我都会看完。”我把照片夹进了爷爷的报纸里。", "en": "In July, Ji Bai left for Beijing. Reel seven went with her, into a vault kept at constant temperature and humidity. In autumn she sent a photo: standing among rows and rows of film racks, smiling quietly. On the back: 'Every film here, I'll watch to the end.' I tucked the photo into my grandfather's newspaper."}, "when": {"v": "flag.j_normal", "op": "==", "val": true}}, {"id": "none", "title": {"zh": "普通结局「最后一排」", "en": "Normal Ending: The Back Row"}, "text": {"zh": "最后一场放映，你坐在最后一排。散场的时候，银幕上的光一点一点暗下去。春天就这样过去了。", "en": "At the last show you sit in the back row. As the crowd leaves, the light on the screen fades bit by bit. And so the spring passes."}, "when": {"v": "flag.route_none", "op": "==", "val": true}}]}, {"id": "g_heart", "title": {"zh": "这个春天", "en": "This spring"}, "fragments": [{"id": "zhiyao", "text": {"zh": "夏知遥在社团群里，第一次叫了你的名字。", "en": "In the club chat, Xia Zhiyao calls you by name for the first time."}, "when": {"all": [{"v": "flag.route_zhiyao", "op": "!=", "val": true}, {"v": "flag.route_shencheng", "op": "!=", "val": true}, {"v": "flag.route_jibai", "op": "!=", "val": true}, {"v": "rel.zhiyao.intimacy", "op": ">=", "val": 2}]}}, {"id": "shencheng", "text": {"zh": "沈澄的咖啡馆，那几天打烊总比平时晚一个小时。", "en": "Those nights, Shen Cheng's café always closes an hour late."}, "when": {"all": [{"v": "flag.route_zhiyao", "op": "!=", "val": true}, {"v": "flag.route_shencheng", "op": "!=", "val": true}, {"v": "flag.route_jibai", "op": "!=", "val": true}, {"v": "rel.shencheng.intimacy", "op": ">=", "val": 2}]}}, {"id": "jibai", "text": {"zh": "放映室的灯，那几周每晚都亮到很晚。", "en": "For those weeks, the light in the booth burns late every night."}, "when": {"all": [{"v": "flag.route_zhiyao", "op": "!=", "val": true}, {"v": "flag.route_shencheng", "op": "!=", "val": true}, {"v": "flag.route_jibai", "op": "!=", "val": true}, {"v": "rel.jibai.intimacy", "op": ">=", "val": 2}]}}, {"id": "none", "text": {"zh": "这个春天过得很快。你还说不清，自己最想见的是谁。", "en": "The spring goes by fast. You still can't say who you most want to see."}, "when": {"all": [{"v": "flag.route_zhiyao", "op": "!=", "val": true}, {"v": "flag.route_shencheng", "op": "!=", "val": true}, {"v": "flag.route_jibai", "op": "!=", "val": true}, {"all": [{"v": "rel.zhiyao.intimacy", "op": "<=", "val": 1}, {"v": "rel.shencheng.intimacy", "op": "<=", "val": 1}, {"v": "rel.jibai.intimacy", "op": "<=", "val": 1}]}]}}]}], "side_prompt": {"zh": "放学后，你去了……", "en": "After classes, you went…"}, "art": {"bg": {"train": {"zh": "列车车厢 · 黄昏", "en": "Train carriage · dusk"}, "station": {"zh": "汐川站", "en": "Xichuan Station"}, "oldhouse": {"zh": "老房子的院子", "en": "The old house"}, "cinema_dusk": {"zh": "潮声影院 · 黄昏", "en": "Tidesound Cinema · dusk"}, "c   btn("lang", () => { LANG = LANG === "zh" ? "en" : "zh"; store.set("lang", LANG); document.documentElement.lang = LANG; renderBar(); draw(); const op = V.queue[V.i - 1]; if (op && op.op === "say") { clearInterval(typing); typing = null; $("#name").textContent = op.who ? nameOf(op.who) : ""; $("#text").textContent = t(op.t); $("#next").classList.add("on"); } });
  btn("title", title);
}
function title() {
  auto = skip = false; clearTimeout(timer);
  const el = $("#title"); el.hidden = false; el.replaceChildren();
  const url = art("cg/title.webp") || art("bg/cinema_dusk.webp");
  el.style.backgroundImage = url ? `url("${url}")` : "linear-gradient(160deg, #2a3c6b, #f2a6b8 140%)";
  const h = document.createElement("h1"); h.textContent = t(CAMP.title);
  const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = ui("sub");
  el.append(h, sub);
  const b = (k, f, dis) => { const x = document.createElement("button"); x.textContent = ui(k); x.disabled = !!dis; x.onclick = f; if (dis) x.style.opacity = .4; el.append(x); };
  const a = store.get("auto", null);
  if (a) b("cont", () => restore(a));
  b("start", start); b("load", () => { el.hidden = true; slots("load"); $("#panel").querySelector(".close").onclick = () => { $("#panel").hidden = true; title(); }; });
  b("gallery", () => { showGallery(); });
  const l = document.createElement("button"); l.className = "lang"; l.textContent = ui("lang"); l.onclick = () => { LANG = LANG === "zh" ? "en" : "zh"; store.set("lang", LANG); title(); renderBar(); }; el.append(l);
  el.querySelector("button")?.focus();
}
function start() {
  ART_FILES.forEach(f => { if (f.startsWith("bg/") || f.endsWith("/normal.webp")) preload(ART_BASE + f); });
  G = CC.newGame(CAMP); V = { bg: null, cg: null, sprites: {}, queue: [], i: 0, log: [], speaker: null, started: null };
  $("#title").hidden = true; $("#endscreen").hidden = true; draw(); next();
}
$("#box").addEventListener("click", () => { if ($("#menu").hidden && $("#panel").hidden) { skip = false; step(); } });
document.addEventListener("keydown", e => {
  if (!$("#title").hidden || !$("#menu").hidden) return;
  if (!$("#panel").hidden) { if (e.key === "Escape") $("#panel").hidden = true; return; }
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); step(); }
  if (e.key === "Control") { skip = true; renderBar(); step(); }
});
document.addEventListener("keyup", e => { if (e.key === "Control") { skip = false; renderBar(); } });
document.documentElement.lang = LANG; renderBar(); title();
window.__xc = { get G() { return G; }, get V() { return V; }, step, start };
</script>
