": {"zh": "去银幕下面。夏知遥一定还在排练。", "en": "Go to the stage below the screen. Zhiyao will still be rehearsing."}, "out": [{"text": {"zh": "……你来了。", "en": "…You came."}}], "effects": [{"set": "flag.route_zhiyao", "to": true}, {"add": "rel.zhiyao.intimacy", "by": 1}], "script": [{"op": "show", "who": "zhiyao", "face": "sad", "at": "center"}, {"op": "say", "who": "zhiyao", "t": {"zh": "……你来了。", "en": "…You came."}, "face": "sad"}, {"op": "say", "who": "zhiyao", "t": {"zh": "我一个人练了一晚上开场白。每次念到“最后一季”，就念不下去。", "en": "I've been practicing the opening speech all night on my own. Every time I get to 'final season,' I can't go on."}, "face": "sad"}, {"op": "say", "who": "zhiyao", "t": {"zh": "你知道的。这也是我的最后一季。", "en": "You know why. It's my final season too."}, "face": "sad", "when": {"v": "flag.zhiyao_secret", "op": "==", "val": true}}], "when": {"v": "rel.zhiyao.intimacy", "op": ">=", "val": 4}}, {"id": "shencheng", "type": "dilemma", "label": {"zh": "去海堤。沈澄说过，她每年春天都会去看影院还在不在。", "en": "Go to the seawall. Shen Cheng said she checks every spring that the cinema's still there."}, "out": [{"text": {"zh": "……我就知道。", "en": "…I knew it."}}], "effects": [{"set": "flag.route_shencheng", "to": true}, {"add": "rel.shencheng.intimacy", "by": 1}], "script": [{"op": "show", "who": "shencheng", "face": "normal", "at": "center"}, {"op": "say", "who": "shencheng", "t": {"zh": "……我就知道。", "en": "…I knew it."}, "face": "smile"}, {"op": "say", "who": "shencheng", "t": {"zh": "明天。七年前你说的那一场，就是明天。", "en": "Tomorrow. The show you promised seven years ago—it's tomorrow."}, "face": "shy", "when": {"v": "flag.cheng_promise", "op": "==", "val": true}}, {"op": "say", "who": "shencheng", "t": {"zh": "社员证我带着。明天我坐第一排，你别想跑。", "en": "I've got my membership card. I'm sitting in the front row tomorrow, so don't you dare run off."}, "face": "smile", "when": {"v": "flag.third_cheng", "op": "==", "val": true}}], "when": {"v": "rel.shencheng.intimacy", "op": ">=", "val": 4}}, {"id": "jibai", "type": "dilemma", "label": {"zh": "去放映室。灯还亮着。", "en": "Go to the booth. The light's still on."}, "out": [{"text": {"zh": "我修好了。第七卷。……要看吗？", "en": "I've finished it. Reel seven. …Do you want to see it?"}}], "effects": [{"set": "flag.route_jibai", "to": true}, {"add": "rel.jibai.intimacy", "by": 1}], "script": [{"op": "show", "who": "jibai", "face": "normal", "at": "center"}, {"op": "say", "who": "jibai", "t": {"zh": "我修好了。第七卷。……要看吗？", "en": "I've finished it. Reel seven. …Do you want to see it?"}, "face": "normal"}, {"op": "say", "who": "jibai", "t": {"zh": "你说过，要一起看。我一个人的时候，一格都没看。", "en": "You said we'd watch it together. On my own, I haven't looked at a single frame."}, "face": "shy", "when": {"v": "flag.reel_together", "op": "==", "val": true}}, {"op": "say", "who": "jibai", "t": {"zh": "做了社员以后，我第一次有了放映室的钥匙。……今晚，我想用它。", "en": "Since becoming a member, I have my own key to the booth for the first time. …Tonight I wanted to use it."}, "face": "smile", "when": {"v": "flag.third_jibai", "op": "==", "val": true}}], "when": {"v": "rel.jibai.intimacy", "op": ">=", "val": 4}}, {"id": "alone", "type": "expression", "label": {"zh": "回老房子。明天还要早起。", "en": "Go back to the old house. It's an early start tomorrow."}, "out": [{"text": {"zh": "院子里的枇杷树沙沙地响。我躺在小时候的床上，听了一夜的海。", "en": "The loquat tree rustles in the yard. I lie in my childhood bed and listen to the sea all night."}}], "effects": [{"set": "flag.route_none", "to": true}], "script": [{"op": "bg", "id": "oldhouse"}, {"op": "say", "who": null, "t": {"zh": "院子里的枇杷树沙沙地响。我躺在小时候的床上，听了一夜的海。", "en": "The loquat tree rustles in the yard. I lie in my childhood bed and listen to the sea all night."}}]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "cinema_night"}, {"op": "say", "who": null, "t": {"zh": "四月最后一个周五。明天，是潮声影院的最后一场放映。下周一，拆迁队就会进场。", "en": "The last Friday of April. Tomorrow is the Tidesound Cinema's final screening. Next Monday, the demolition crew moves in."}}, {"op": "say", "who": null, "t": {"zh": "海报贴满了半个汐川。夏知遥说，明天至少会来两百个人。", "en": "Posters cover half of Xichuan. Zhiyao says at least two hundred people will come tomorrow."}}, {"op": "say", "who": null, "t": {"zh": "海报最上面印着一行字：“来看它最后一个春天。”——是我第一天在这里说的话。", "en": "Across the top of every poster is one line: 'Come see its last spring.' The words I said here on my first day."}, "when": {"v": "flag.saw_last_spring", "op": "==", "val": true}}, {"op": "show", "who": "chenghang", "face": "smile", "at": "right", "when": {"v": "flag.third_hang", "op": "==", "val": true}}, {"op": "say", "who": "chenghang", "t": {"zh": "两百个？我在论坛上发了帖，保底三百。别谢我，谢我的号召力。", "en": "Two hundred? I posted on the forum. Three hundred, minimum. Don't thank me—thank my reach."}, "face": "smile", "when": {"v": "flag.third_hang", "op": "==", "val": true}}, {"op": "hide", "who": "chenghang", "when": {"v": "flag.third_hang", "op": "==", "val": true}}, {"op": "show", "who": "zhou", "face": "normal", "at": "center"}, {"op": "say", "who": "zhou", "t": {"zh": "你爷爷要是看见了，得哭。", "en": "If your grandfather could see this, he'd cry."}, "face": "smile"}, {"op": "say", "who": "zhou", "t": {"zh": "去吧。今晚，总有人在等你。", "en": "Go on. Tonight, someone's bound to be waiting for you."}, "face": "normal"}, {"op": "hide", "who": "zhou"}, {"op": "say", "who": "me", "think": true, "t": {"zh": "今晚，我想去见的是——", "en": "Tonight, the one I want to see is—"}}], "cast": [{"id": "zhou"}, {"id": "zhiyao"}, {"id": "shencheng"}, {"id": "jibai"}]}, "c5_last": {"id": "c5_last", "chapter": "c5", "kind": "main", "title": {"zh": "最后一场", "en": "The Last Show"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "晚上六点半，铁椅子坐满了。后来的人站在最后一排后面，再后来的人，坐到了海堤上。", "en": "Six-thirty in the evening, and every iron seat is taken. Latecomers stand behind the back row; the ones after them sit along the seawall."}}], "choices": [{"id": "stand", "type": "dilemma", "label": {"zh": "走上台，站到她旁边。", "en": "Walk up onto the stage and stand beside her."}, "out": [{"text": {"zh": "……陆远？", "en": "…Lu Yuan?"}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 1}, {"add": "rel.zhiyao.esteem", "by": 1}, {"set": "flag.z_stage", "to": true}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "……陆远？", "en": "…Lu Yuan?"}, "face": "surprised"}, {"op": "say", "who": "me", "t": {"zh": "我们社长有点激动。下面这句，我们一起念。", "en": "Our president's a little emotional. We'll say this next part together."}}, {"op": "say", "who": null, "t": {"zh": "她看了我一眼，深吸一口气。", "en": "She glances at me and takes a deep breath."}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……春季放映会，最后一季。第一部——开始！", "en": "…The Spring Screenings, final season. Our first film—let's begin!"}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "台下的掌声，比海浪还响。", "en": "The applause is louder than the waves."}}], "values": ["yong"]}, {"id": "echo", "type": "dilemma", "label": {"zh": "在台下，把她第一天说的那句话喊回给她。", "en": "From the crowd, shout her own words from that first day back at her."}, "out": [{"text": {"zh": "社长！五个人也是观众——今天有三百个！", "en": "President! Five people is still an audience—tonight there are three hundred!"}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 1}, {"add": "rel.zhiyao.trust", "by": 1}, {"set": "flag.z_echo", "to": true}], "script": [{"op": "say", "who": "me", "t": {"zh": "社长！五个人也是观众——今天有三百个！", "en": "President! Five people is still an audience—tonight there are three hundred!"}}, {"op": "say", "who": null, "t": {"zh": "台下哄地笑了。有人跟着喊：“开始！开始！”", "en": "The crowd bursts out laughing. Someone starts chanting: 'Begin! Begin!'"}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……笨蛋。", "en": "…Idiot."}, "face": "shy"}, {"op": "say", "who": "zhiyao", "t": {"zh": "那就——春季放映会，最后一季，开始！", "en": "Then—the Spring Screenings, final season, let's begin!"}, "face": "smile"}], "values": ["wen"]}, {"id": "booth", "type": "strategy", "label": {"zh": "跑去放映室，让季白先开机，用画面替她解围。", "en": "Run to the booth and have Ji Bai start the projector, to get her off the hook."}, "out": [{"text": {"zh": "光从我头顶射出去，银幕亮了。台下安静下来。", "en": "Light shoots out over my head and the screen comes alive. The crowd falls quiet."}}], "effects": [{"add": "rel.zhiyao.esteem", "by": 1}], "script": [{"op": "hide", "who": "zhiyao"}, {"op": "say", "who": null, "t": {"zh": "光从我头顶射出去，银幕亮了。台下安静下来。", "en": "Light shoots out over my head and the screen comes alive. The crowd falls quiet."}}, {"op": "say", "who": null, "t": {"zh": "等我回到台下，夏知遥已经不在台上了。她坐在最边上的位置，一直看着银幕，没有看我。", "en": "By the time I get back down, Zhiyao has left the stage. She's sitting in the seat at the very end of a row, eyes fixed on the screen. She doesn't look at me."}}], "values": ["ti"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "cinema_night"}, {"op": "say", "who": null, "t": {"zh": "晚上六点半，铁椅子坐满了。后来的人站在最后一排后面，再后来的人，坐到了海堤上。", "en": "Six-thirty in the evening, and every iron seat is taken. Latecomers stand behind the back row; the ones after them sit along the seawall."}}, {"op": "show", "who": "chenghang", "face": "smile", "at": "right", "when": {"v": "flag.third_hang", "op": "==", "val": true}}, {"op": "say", "who": "chenghang", "t": {"zh": "三百二十七个。我数了两遍。", "en": "Three hundred and twenty-seven. I counted twice."}, "face": "smile", "when": {"v": "flag.third_hang", "op": "==", "val": true}}, {"op": "hide", "who": "chenghang", "when": {"v": "flag.third_hang", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "老周坐在第一排正中间。那是爷爷以前的位置。", "en": "Old Zhou sits dead center in the front row. It used to be my grandfather's seat."}}, {"op": "say", "who": null, "t": {"zh": "七点整。夏知遥走上台，拿起话筒。", "en": "Seven o'clock sharp. Xia Zhiyao walks onto the stage and picks up the microphone."}}, {"op": "show", "who": "zhiyao", "face": "normal", "at": "center"}, {"op": "say", "who": "zhiyao", "t": {"zh": "各位晚上好。欢迎来到潮声影院，春季放映会——", "en": "Good evening, everyone. Welcome to the Tidesound Cinema, and to the Spring Screenings—"}, "face": "normal"}, {"op": "say", "who": "zhiyao", "t": {"zh": "……最后、", "en": "…final—"}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "她停住了。三百个人在等。海风把她手里的稿子吹得哗哗响。", "en": "She stops. Three hundred people wait. The sea wind rattles the pages in her hand."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "我知道她为什么念不下去。这是影院的最后一季，也是她的。", "en": "I know why she can't go on. It's the cinema's final season, and hers too."}, "when": {"v": "flag.zhiyao_secret", "op": "==", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "得做点什么。", "en": "I have to do something."}}], "when": {"v": "flag.route_zhiyao", "op": "==", "val": true}, "cast": [{"id": "zhiyao"}, {"id": "chenghang"}]}, "c5_after": {"id": "c5_after", "chapter": "c5", "kind": "main", "title": {"zh": "散场以后", "en": "After the Crowd Leaves"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "最后一部电影的最后一个镜头，是一片海。银幕上的海，和银幕后面的海，连在了一起。", "en": "The last shot of the last film is the sea. The sea on the screen and the sea behind it run together into one."}}], "choices": [{"id": "week", "type": "dilemma", "label": {"zh": "“那这一周，你想做的事，我们全做完。”", "en": "\"Then this week, everything you want to do—we'll do it all.\""}, "out": [{"text": {"zh": "……你是听不懂人话吗。", "en": "…Do you not understand plain words?"}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 2}, {"set": "flag.z_week", "to": true}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "……你是听不懂人话吗。", "en": "…Do you not understand plain words?"}, "face": "angry"}, {"op": "say", "who": "zhiyao", "t": {"zh": "毕业前想做的事，我列过一张单子。十件。……你可别后悔。", "en": "I made a list once. Things to do before graduating. Ten of them. …Don't you dare regret this."}, "face": "smile"}], "values": ["cheng"]}, {"id": "follow", "type": "dilemma", "label": {"zh": "“那我跟你一起回去。”", "en": "\"Then I'll go back with you.\""}, "out": [{"text": {"zh": "……你说什么傻话。", "en": "…What kind of stupid thing is that to say?"}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 1}, {"add": "rel.zhiyao.trust", "by": -1}, {"set": "flag.z_rash", "to": true}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "……你说什么傻话。", "en": "…What kind of stupid thing is that to say?"}, "face": "surprised"}, {"op": "say", "who": "zhiyao", "t": {"zh": "你才刚回到汐川。老房子、影院、你爷爷留下的东西……你又要为了别人，走一次？", "en": "You've only just come back to Xichuan. The old house, the cinema, everything your grandfather left… and you'd leave again, for someone else?"}, "face": "angry"}, {"op": "say", "who": null, "t": {"zh": "她跳下台，往门口走。走到一半，停了一下。", "en": "She hops down from the stage and heads for the gate. Halfway there, she stops."}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……谢谢。可是不行。", "en": "…Thank you. But no."}, "face": "sad"}], "values": ["yong"]}, {"id": "nod", "type": "expression", "label": {"zh": "“……我知道了。”", "en": "\"…All right.\""}, "out": [{"text": {"zh": "嗯。这样最好。", "en": "Mm. It's better this way."}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": -1}, {"set": "flag.z_distance", "to": true}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "嗯。这样最好。", "en": "Mm. It's better this way."}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "她笑得很好看。好看得不像真的。", "en": "Her smile is lovely. Too lovely to be real."}}], "values": ["ti"]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "cinema_night"}, {"op": "cg", "id": "cg_last_screening"}, {"op": "say", "who": null, "t": {"zh": "最后一部电影的最后一个镜头，是一片海。银幕上的海，和银幕后面的海，连在了一起。", "en": "The last shot of the last film is the sea. The sea on the screen and the sea behind it run together into one."}}, {"op": "cg", "id": null}, {"op": "say", "who": null, "t": {"zh": "人走光了。夏知遥坐在台边，两只脚悬在半空。", "en": "Everyone has gone. Zhiyao sits on the edge of the stage, feet dangling over the side."}}, {"op": "show", "who": "zhiyao", "face": "smile", "at": "center"}, {"op": "say", "who": "zhiyao", "t": {"zh": "三百二十七个人。……我也数了。", "en": "Three hundred and twenty-seven people. …I counted too."}, "face": "smile"}, {"op": "say", "who": "zhiyao", "t": {"zh": "陆远。下周六，我坐早上那班车回家。", "en": "Lu Yuan. Next Saturday I'm taking the morning train home."}, "face": "sad"}, {"op": "say", "who": "zhiyao", "t": {"zh": "我妈下个月做手术。家里只有她一个人。……这件事，我一直没跟社里说。", "en": "My mom has surgery next month. She's on her own at home. …I never told anyone in the club."}, "face": "sad", "when": {"v": "flag.zhiyao_secret", "op": "!=", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "你早就知道了。那天在天台上，我只告诉了你一个人。", "en": "You knew already. That day on the roof, you were the only one I told."}, "face": "normal", "when": {"v": "flag.zhiyao_secret", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "所以啊，这一周，你别对我太好。不然我走的时候，会哭得很难看的。", "en": "So this week—don't be too nice to me. Otherwise when I leave, I'll cry, and it won't be pretty."}, "face": "smile"}], "when": {"v": "flag.route_zhiyao", "op": "==", "val": true}, "cast": [{"id": "zhiyao"}]}, "c6_screen": {"id": "c6_screen", "chapter": "c6", "kind": "main", "title": {"zh": "拆迁的早上", "en": "The Morning of the Demolition"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "周一早上，挖掘机停在了影院门口。工人们先拆的是铁椅子，一排一排，叮叮当当。", "en": "Monday morning, an excavator pulls up at the cinema gate. The workers take the iron seats out first, row by row, clanging."}}], "choices": [{"id": "cut", "type": "dilemma", "label": {"zh": "爬上架子，帮她剪下右下角那一块。", "en": "Climb the scaffold and cut the bottom-right corner for her."}, "out": [{"text": {"zh": "银幕的布比想象中厚。剪下来的那一块上，有一道淡淡的水渍，像一朵云。", "en": "The canvas is thicker than I expected. On the piece that comes away there's a faint water stain, shaped like a cloud."}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 1}, {"set": "flag.z_screen", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "银幕的布比想象中厚。剪下来的那一块上，有一道淡淡的水渍，像一朵云。", "en": "The canvas is thicker than I expected. On the piece that comes away there's a faint water stain, shaped like a cloud."}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……这是我大一第一次来的时候，下雨淋的。我记得。", "en": "…That's from the rain the first time I came here, freshman year. I remember."}, "face": "sad"}, {"op": "say", "who": "zhiyao", "t": {"zh": "谢谢你。偏偏是这一块。", "en": "Thank you. Of all the pieces, it was this one."}, "face": "smile"}], "values": ["yong"]}, {"id": "sign", "type": "dilemma", "label": {"zh": "“剪下来以后，社员都在背面签个名。”", "en": "\"Once it's cut, let's have every member sign the back.\""}, "out": [{"text": {"zh": "背面是灰色的。我们用马克笔，一个一个签上去。", "en": "The back is grey. We sign it one by one, in marker."}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 1}, {"add": "rel.zhiyao.trust", "by": 1}, {"set": "flag.z_screen", "to": true}, {"set": "flag.z_signed", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "背面是灰色的。我们用马克笔，一个一个签上去。", "en": "The back is grey. We sign it one by one, in marker."}}, {"op": "say", "who": null, "t": {"zh": "季白签得最工整，像印上去的。", "en": "Ji Bai's signature is the neatest, as if it were printed."}, "when": {"v": "flag.third_jibai", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "沈澄签完，在旁边画了一只三花猫。", "en": "Shen Cheng signs, then draws a calico cat beside her name."}, "when": {"v": "flag.third_cheng", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "程航签了一个最大的名字，占了半块布。", "en": "Cheng Hang signs the biggest name of all. It takes up half the cloth."}, "when": {"v": "flag.third_hang", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "好丑。", "en": "It's hideous."}, "face": "smile"}, {"op": "say", "who": "zhiyao", "t": {"zh": "……我会好好挂起来的。", "en": "…I'll hang it up properly."}, "face": "shy"}], "values": ["wen"]}, {"id": "delay", "type": "strategy", "label": {"zh": "“我去和拆迁队商量，银幕晚两天再拆。”", "en": "\"I'll talk to the demolition crew. Get them to leave the screen two more days.\""}, "out": [{"text": {"zh": "……你这个人，总想把什么都留住。", "en": "…You always want to hold on to everything, don't you."}}], "effects": [{"add": "rel.zhiyao.esteem", "by": 1}, {"add": "rel.zhiyao.trust", "by": 1}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "……你这个人，总想把什么都留住。", "en": "…You always want to hold on to everything, don't you."}, "face": "sad"}, {"op": "say", "who": "zhiyao", "t": {"zh": "可是留不住的。早一天，晚一天，都一样。", "en": "But you can't. A day earlier, a day later—it's all the same."}, "face": "normal"}], "values": ["gu"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "cinema_dusk"}, {"op": "say", "who": null, "t": {"zh": "周一早上，挖掘机停在了影院门口。工人们先拆的是铁椅子，一排一排，叮叮当当。", "en": "Monday morning, an excavator pulls up at the cinema gate. The workers take the iron seats out first, row by row, clanging."}}, {"op": "show", "who": "zhou", "face": "normal", "at": "left"}, {"op": "say", "who": "zhou", "t": {"zh": "银幕留到最后拆。那块布，是你爷爷一针一针缝的。", "en": "The screen comes down last. Your grandfather sewed that canvas himself, stitch by stitch."}, "face": "sad"}, {"op": "hide", "who": "zhou"}, {"op": "show", "who": "zhiyao", "face": "smile", "at": "center", "when": {"v": "flag.z_week", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "单子上第一件：从银幕上剪一块布带走。工人叔叔同意了，就一小块。", "en": "First thing on the list: cut a piece off the screen to take with me. The workers said yes—just a small piece."}, "face": "smile", "when": {"v": "flag.z_week", "op": "==", "val": true}}, {"op": "show", "who": "zhiyao", "face": "angry", "at": "center", "when": {"v": "flag.z_rash", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……那天晚上的话，我就当没听见。", "en": "…What you said that night—I'm pretending I didn't hear it."}, "face": "angry", "when": {"v": "flag.z_rash", "op": "==", "val": true}}, {"op": "show", "who": "zhiyao", "face": "normal", "at": "center", "when": {"v": "flag.z_distance", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "陆远。早。", "en": "Lu Yuan. Morning."}, "face": "normal", "when": {"v": "flag.z_distance", "op": "==", "val": true}}, {"op": "show", "who": "zhiyao", "face": "normal", "at": "center", "when": {"all": [{"v": "flag.z_week", "op": "!=", "val": true}, {"v": "flag.z_rash", "op": "!=", "val": true}, {"v": "flag.z_distance", "op": "!=", "val": true}]}}, {"op": "say", "who": "zhiyao", "t": {"zh": "我想要一小块银幕。带回家，挂在我妈的病房里。她第一次看电影，也是在这里。", "en": "I want a little piece of the screen. To take home and hang in my mom's hospital room. The first film she ever saw was here, too."}, "face": "sad"}], "when": {"v": "flag.route_zhiyao", "op": "==", "val": true}, "cast": [{"id": "zhiyao"}, {"id": "zhou"}]}, "c6_beach": {"id": "c6_beach", "chapter": "c6", "kind": "side", "title": {"zh": "单子上的第七件", "en": "Number Seven on the List"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "周三下午，没有课。夏知遥拉我到了海边，手里攥着那张单子。", "en": "Wednesday afternoon, no classes. Zhiyao drags me down to the beach, the list clutched in her hand."}}], "choices": [{"id": "shout", "type": "dilemma", "label": {"zh": "对着海喊：“汐川——我回来了！”", "en": "Shout at the sea: \"Xichuan—I'm back!\""}, "out": [{"text": {"zh": "喊完，嗓子都哑了。几只海鸥被吓飞了。", "en": "When I'm done my throat is raw. A few gulls take off in fright."}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 2}, {"set": "flag.z_shout", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "喊完，嗓子都哑了。几只海鸥被吓飞了。", "en": "When I'm done my throat is raw. A few gulls take off in fright."}}, {"op": "say", "who": "zhiyao", "t": {"zh": "到我了。", "en": "My turn."}, "face": "normal"}, {"op": "say", "who": "zhiyao", "t": {"zh": "我——不——想——走——！", "en": "I—don't—want—to—go!"}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "海浪把她的声音卷走了。她站了很久，然后转过身来，眼睛红红的，笑了。", "en": "The waves carry her voice away. She stands there a long time, then turns around, eyes red, and smiles."}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……好了。说完了。你就当没听见。", "en": "…There. Done. Pretend you didn't hear that."}, "face": "smile"}], "values": ["yong"]}, {"id": "skip", "type": "expression", "label": {"zh": "“第七件就算了吧，太傻了。”", "en": "\"Let's skip number seven. It's silly.\""}, "out": [{"text": {"zh": "……也是。", "en": "…I guess."}}], "effects": [{"add": "rel.zhiyao.warmth", "by": -1}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "……也是。", "en": "…I guess."}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "她把单子折起来，放回口袋。那天下午，我们只是沿着海边走了一圈。", "en": "She folds the list and puts it back in her pocket. That afternoon, we just walk the length of the shore."}}], "values": ["xi"]}], "salience": 1, "order": 1, "script": [{"op": "bg", "id": "beach"}, {"op": "say", "who": null, "t": {"zh": "周三下午，没有课。夏知遥拉我到了海边，手里攥着那张单子。", "en": "Wednesday afternoon, no classes. Zhiyao drags me down to the beach, the list clutched in her hand."}}, {"op": "show", "who": "zhiyao", "face": "smile", "at": "center"}, {"op": "say", "who": "zhiyao", "t": {"zh": "第七件：对着海，喊一句平时不敢说的话。", "en": "Number seven: shout something at the sea that you'd never dare say out loud."}, "face": "smile"}, {"op": "say", "who": "zhiyao", "t": {"zh": "……单子是我自己的。今天突然想做，就叫上你了。", "en": "…It's my own list. I just felt like doing it today, so I called you."}, "face": "shy", "when": {"v": "flag.z_week", "op": "!=", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "你先。", "en": "You first."}, "face": "normal"}], "when": {"v": "flag.route_zhiyao", "op": "==", "val": true}, "cast": [{"id": "zhiyao"}]}, "c6_call": {"id": "c6_call", "chapter": "c6", "kind": "side", "title": {"zh": "视频电话", "en": "The Video Call"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "活动室已经空了一半。夏知遥一边装箱，一边接起了视频电话。这一次，她没有按掉。", "en": "The club room is half empty. Zhiyao is packing boxes when a video call comes in. This time, she doesn't decline it."}}], "choices": [{"id": "tell", "type": "dilemma", "label": {"zh": "跟阿姨讲周六那晚，她在三百个人面前念开场白。", "en": "Tell her mother about Saturday night—her daughter's opening speech in front of three hundred people."}, "out": [{"text": {"zh": "我讲完，屏幕那头安静了一会儿。", "en": "When I finish, the other end of the line is quiet for a moment."}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 2}, {"set": "flag.z_mom", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "我讲完，屏幕那头安静了一会儿。", "en": "When I finish, the other end of the line is quiet for a moment."}}, {"op": "say", "who": null, "t": {"zh": "“她小时候就爱站在台上。”阿姨说，“我生病以后，她就不站了。谢谢你，让她又站上去了。”", "en": "'She always loved being on a stage when she was little,' her mother says. 'After I got sick, she stopped. Thank you for getting her back up there.'"}}, {"op": "say", "who": "zhiyao", "t": {"zh": "妈！……你别乱说。", "en": "Mom! …Don't say things like that."}, "face": "shy"}], "values": ["wen"]}, {"id": "greet", "type": "expression", "label": {"zh": "规规矩矩地问好，说社团会把那块银幕寄到医院。", "en": "Greet her politely, and say the club will send the piece of screen to the hospital."}, "out": [{"text": {"zh": "“这孩子真懂事。”阿姨说，“知遥这个人嘴硬，你多担待。”", "en": "'What a thoughtful young man,' her mother says. 'Zhiyao's all bark—be patient with her.'"}}], "effects": [{"add": "rel.zhiyao.trust", "by": 1}, {"add": "rel.zhiyao.intimacy", "by": 1}, {"set": "flag.z_mom", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "“这孩子真懂事。”阿姨说，“知遥这个人嘴硬，你多担待。”", "en": "'What a thoughtful young man,' her mother says. 'Zhiyao's all bark—be patient with her.'"}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……我挂了！", "en": "…I'm hanging up!"}, "face": "angry"}], "values": ["ti"]}], "salience": 1, "order": 2, "script": [{"op": "bg", "id": "clubroom"}, {"op": "say", "who": null, "t": {"zh": "活动室已经空了一半。夏知遥一边装箱，一边接起了视频电话。这一次，她没有按掉。", "en": "The club room is half empty. Zhiyao is packing boxes when a video call comes in. This time, she doesn't decline it."}}, {"op": "show", "who": "zhiyao", "face": "shy", "at": "center"}, {"op": "say", "who": "zhiyao", "t": {"zh": "妈。嗯，吃了。……这个？这是社员。", "en": "Mom. Yeah, I ate. …Him? He's a club member."}, "face": "shy"}, {"op": "say", "who": null, "t": {"zh": "她把手机转过来对着我。屏幕里的阿姨很瘦，笑起来和她一模一样。", "en": "She turns the phone toward me. The woman on the screen is very thin, and when she smiles she looks exactly like her daughter."}}], "when": {"all": [{"v": "flag.route_zhiyao", "op": "==", "val": true}, {"any": [{"v": "flag.knows_mom", "op": "==", "val": true}, {"v": "flag.zhiyao_secret", "op": "==", "val": true}]}]}, "cast": [{"id": "zhiyao"}]}, "c6_roof": {"id": "c6_roof", "chapter": "c6", "kind": "side", "title": {"zh": "天台上看不见的白点", "en": "The White Dot That Isn't There"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "中午，我们又上了天台。她还是带了两个饭团。", "en": "At noon we go up to the roof again. She's brought two rice balls, as always."}}], "choices": [{"id": "photo", "type": "strategy", "label": {"zh": "“那我每周六拍一张汐川的海，发给你。”", "en": "\"Then every Saturday I'll take a photo of the sea here and send it to you.\""}, "out": [{"text": {"zh": "……每周？", "en": "…Every week?"}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 1}, {"add": "rel.zhiyao.trust", "by": 1}, {"set": "flag.z_photo", "to": true}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "……每周？", "en": "…Every week?"}, "face": "surprised"}, {"op": "say", "who": "zhiyao", "t": {"zh": "说好了。少一周，我就把你从社员名单上删掉。", "en": "It's a deal. Miss one week and I'm striking you off the membership list."}, "face": "smile"}], "values": ["gu"]}, {"id": "quiet", "type": "expression", "label": {"zh": "什么也不说，陪她坐着，把饭团吃完。", "en": "Say nothing. Sit with her and finish the rice balls."}, "out": [{"text": {"zh": "风很大。吃到一半，她把头轻轻靠在了我的肩膀上。", "en": "It's windy. Halfway through, she leans her head lightly against my shoulder."}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 2}], "script": [{"op": "say", "who": null, "t": {"zh": "风很大。吃到一半，她把头轻轻靠在了我的肩膀上。", "en": "It's windy. Halfway through, she leans her head lightly against my shoulder."}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……就一会儿。", "en": "…Just for a minute."}, "face": "shy"}], "values": ["ti"]}], "salience": 1, "order": 3, "script": [{"op": "bg", "id": "rooftop"}, {"op": "say", "who": null, "t": {"zh": "中午，我们又上了天台。她还是带了两个饭团。", "en": "At noon we go up to the roof again. She's brought two rice balls, as always."}}, {"op": "show", "who": "zhiyao", "face": "normal", "at": "center"}, {"op": "say", "who": "zhiyao", "t": {"zh": "你看，那个白点不见了。", "en": "Look. The white dot's gone."}, "face": "sad"}, {"op": "say", "who": "zhiyao", "t": {"zh": "以后我在家里，往南边看，什么都看不见了。", "en": "When I'm home, I'll look south and there'll be nothing to see."}, "face": "sad"}], "when": {"v": "flag.route_zhiyao", "op": "==", "val": true}, "cast": [{"id": "zhiyao"}]}, "c7_rain": {"id": "c7_rain", "chapter": "c7", "kind": "main", "title": {"zh": "雨夜", "en": "The Rainy Night"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "她走的前一晚，下雨了。夏知遥抱着一个纸箱，站在校门口的公交站下面。", "en": "The night before she leaves, it rains. Zhiyao stands under the bus shelter by the school gate, hugging a cardboard box."}}], "choices": [{"id": "stay", "type": "dilemma", "label": {"zh": "“我留下来。明年春天，我在汐川重新放电影。”", "en": "\"I'm staying. Next spring, I'll start showing films in Xichuan again.\""}, "out": [{"text": {"zh": "……没有影院了。", "en": "…There's no cinema anymore."}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 1}, {"add": "rel.zhiyao.trust", "by": 1}, {"set": "flag.z_stay", "to": true}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "……没有影院了。", "en": "…There's no cinema anymore."}, "face": "surprised"}, {"op": "say", "who": "me", "t": {"zh": "有海堤。有银幕。季白说，那台旧放映机还能转。", "en": "There's the seawall. There's a screen. Ji Bai says the old projector still runs."}}, {"op": "say", "who": "me", "t": {"zh": "银幕少了右下角一块。正好，等它回来补上。", "en": "The screen's missing its bottom-right corner. Fine. It can be stitched back in when it comes home."}, "when": {"v": "flag.z_screen", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……背面还有大家的名字呢。可不许弄丢。", "en": "…It's got everyone's names on the back. Don't you dare lose it."}, "face": "sad", "when": {"v": "flag.z_signed", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……那你给我留个位置。", "en": "…Then save me a seat."}, "face": "sad"}, {"op": "say", "who": "zhiyao", "t": {"zh": "第一排。正中间。", "en": "Front row. Dead center."}, "face": "smile"}], "values": ["gu"]}, {"id": "umbrella", "type": "expression", "label": {"zh": "把伞给她，陪她走回宿舍。", "en": "Give her your umbrella and walk her back to her dorm."}, "out": [{"text": {"zh": "伞不大。我们一路没说话，雨落在我的半边肩膀上。", "en": "The umbrella isn't big. We don't say a word the whole way, and the rain falls on one of my shoulders."}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "伞不大。我们一路没说话，雨落在我的半边肩膀上。", "en": "The umbrella isn't big. We don't say a word the whole way, and the rain falls on one of my shoulders."}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……你半边都湿了，笨蛋。", "en": "…Half of you is soaked, you idiot."}, "face": "shy"}], "values": ["wen"]}, {"id": "letgo", "type": "expression", "label": {"zh": "“回去照顾好阿姨。别回头。”", "en": "\"Go home and take care of your mom. Don't look back.\""}, "out": [{"text": {"zh": "……嗯。", "en": "…Mm."}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": -1}, {"set": "flag.z_letgo", "to": true}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "……嗯。", "en": "…Mm."}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "车来了。她抱着纸箱上了车，真的一次也没有回头。", "en": "The bus comes. She climbs on with the box in her arms, and she really doesn't look back, not once."}}], "values": ["ti"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "rain_street"}, {"op": "say", "who": null, "t": {"zh": "她走的前一晚，下雨了。夏知遥抱着一个纸箱，站在校门口的公交站下面。", "en": "The night before she leaves, it rains. Zhiyao stands under the bus shelter by the school gate, hugging a cardboard box."}}, {"op": "show", "who": "zhiyao", "face": "normal", "at": "center"}, {"op": "say", "who": "zhiyao", "t": {"zh": "这一周，你真的没来找我。……我是不是很奇怪，明明是我让你别来的。", "en": "You really didn't come looking for me all week. …Isn't it strange? I'm the one who told you not to."}, "face": "sad", "when": {"v": "flag.z_distance", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "社团的东西，都在这里了。钥匙给你。", "en": "Everything from the club is in here. Here's the key."}, "face": "normal"}, {"op": "say", "who": "zhiyao", "t": {"zh": "陆远，电影社以后就是你的了。", "en": "Lu Yuan, the film club's yours now."}, "face": "smile"}, {"op": "say", "who": "zhiyao", "t": {"zh": "……其实我一直想问。你说回汐川，是为了看它最后一个春天。那看完了以后呢？", "en": "…There's something I've always wanted to ask. You said you came back to Xichuan to see its last spring. What about after?"}, "face": "normal"}], "when": {"v": "flag.route_zhiyao", "op": "==", "val": true}, "cast": [{"id": "zhiyao"}]}, "c7_station": {"id": "c7_station", "chapter": "c7", "kind": "main", "title": {"zh": "站台", "en": "The Platform"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "早上七点的汐川站，只有一个站台。和我回来的那天一样。", "en": "Seven in the morning, and Xichuan Station has only one platform. Just like the day I came back."}}], "choices": [{"id": "confess", "type": "dilemma", "label": {"zh": "“夏知遥。我喜欢你。……所以明年春天，回来看我放的第一场。”", "en": "\"Xia Zhiyao. I like you. …So next spring, come back and watch my first show.\""}, "out": [{"text": {"zh": "……诶？", "en": "…Huh?"}}], "effects": [{"set": "flag.z_good", "to": true}, {"add": "rel.zhiyao.intimacy", "by": 1}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "……诶？", "en": "…Huh?"}, "face": "surprised"}, {"op": "say", "who": "zhiyao", "t": {"zh": "笨蛋。为什么偏偏现在才说。", "en": "Idiot. Why did you have to wait until now to say it?"}, "face": "sad"}, {"op": "cg", "id": "cg_platform"}, {"op": "say", "who": null, "t": {"zh": "她跳上车门的台阶，又转过身来。眼泪掉下来了，可她在笑。", "en": "She steps up into the doorway of the train, then turns back. The tears are falling, but she's smiling."}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……我也是。第一排，给我留着。", "en": "…Me too. Save me that front-row seat."}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "车门关上了。列车开走的时候，她一直把手贴在窗户上。", "en": "The doors close. As the train pulls away, she keeps her hand pressed to the window."}}, {"op": "cg", "id": null}], "values": ["cheng"], "when": {"all": [{"v": "rel.zhiyao.intimacy", "op": ">=", "val": 8}, {"v": "rel.zhiyao.trust", "op": ">=", "val": 4}, {"v": "flag.z_stay", "op": "==", "val": true}]}}, {"id": "wave", "type": "expression", "label": {"zh": "挥挥手：“一路顺风。”", "en": "Wave: \"Have a safe trip.\""}, "out": [{"text": {"zh": "嗯。你也是。", "en": "Mm. You too."}}], "effects": [{"set": "flag.z_normal", "to": true}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "嗯。你也是。", "en": "Mm. You too."}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "她笑着挥手，上了车。列车拐过海湾，看不见了。", "en": "She waves, smiling, and boards. The train rounds the bay and is gone."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "直到那时我才想起来：七年前，我也是这样，什么都没说。", "en": "Only then does it hit me: seven years ago, I said nothing either. Just like this."}}]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "station"}, {"op": "say", "who": null, "t": {"zh": "早上七点的汐川站，只有一个站台。和我回来的那天一样。", "en": "Seven in the morning, and Xichuan Station has only one platform. Just like the day I came back."}}, {"op": "say", "who": null, "t": {"zh": "花已经谢了。树上全是新叶子。", "en": "The blossoms have fallen. The trees are all new leaves."}}, {"op": "show", "who": "zhiyao", "face": "normal", "at": "center"}, {"op": "say", "who": "zhiyao", "t": {"zh": "……你来了。我以为你不会来。", "en": "…You came. I thought you wouldn't."}, "face": "surprised", "when": {"v": "flag.z_letgo", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "喂。来送我啊？", "en": "Hey. Come to see me off?"}, "face": "smile", "when": {"v": "flag.z_letgo", "op": "!=", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "那块银幕，我放在箱子最上面了。", "en": "That piece of screen—I put it right on top in my suitcase."}, "face": "normal", "when": {"v": "flag.z_screen", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "我妈说，下次让你去家里吃饭。……你别当真啊！", "en": "My mom says you should come over for dinner sometime. …Don't take that seriously!"}, "face": "shy", "when": {"v": "flag.z_mom", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "那天在海边喊的那句，你就当没听见。……听见了也不许说。", "en": "What I shouted at the sea that day—pretend you didn't hear. …And if you did, don't you dare say so."}, "face": "shy", "when": {"v": "flag.z_shout", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "那天你上台的时候，腿一直在抖。我站在旁边，看得清清楚楚。", "en": "That night you came up on stage, your legs were shaking the whole time. I was right next to you. I saw everything."}, "face": "smile", "when": {"v": "flag.z_stage", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "“五个人也是观众”——那句明明是我的台词，被你抢走了。", "en": "'Five people is still an audience'—that was my line, and you stole it."}, "face": "smile", "when": {"v": "flag.z_echo", "op": "==", "val": true}}, {"op": "say", "who": "zhiyao", "t": {"zh": "这周六的照片，别忘了。", "en": "Don't forget this Saturday's photo."}, "face": "smile", "when": {"v": "flag.z_photo", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "广播响了。列车进站。", "en": "The announcement sounds. The train pulls in."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "七年前，我从这个站台离开，什么都没来得及说。", "en": "Seven years ago I left from this platform without getting a single word out."}}], "when": {"v": "flag.route_zhiyao", "op": "==", "val": true}, "cast": [{"id": "zhiyao"}]}, "c5_front": {"id": "c5_front", "chapter": "c5", "kind": "main", "title": {"zh": "第一排", "en": "The Front Row"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "最后一场。铁椅子坐满了，后来的人站到了海堤上。", "en": "The last show. Every iron seat is taken; latecomers stand along the seawall."}}], "choices": [{"id": "leaving", "type": "dilemma", "label": {"zh": "“因为第二天，我就要走了。”", "en": "\"Because the next day, I was leaving.\""}, "out": [{"text": {"zh": "……原来你知道。", "en": "…So you did know."}}], "effects": [{"add": "rel.shencheng.trust", "by": 1}, {"add": "rel.shencheng.intimacy", "by": 1}], "script": [{"op": "say", "who": "shencheng", "t": {"zh": "……原来你知道。", "en": "…So you did know."}, "face": "surprised"}, {"op": "say", "who": "shencheng", "t": {"zh": "你那天睡得那么香。我一边看电影，一边想：明天开始，这个人就不在了。", "en": "You were sleeping so soundly. And I sat there watching the film, thinking: starting tomorrow, he won't be here."}, "face": "sad"}], "values": ["ti"]}, {"id": "ask", "type": "dilemma", "label": {"zh": "“我不知道。你告诉我。”", "en": "\"I don't know. Tell me.\""}, "out": [{"text": {"zh": "……说出来，就不算了。", "en": "…If I say it, it won't count."}}], "effects": [{"add": "rel.shencheng.intimacy", "by": 2}, {"set": "flag.c_asked", "to": true}], "script": [{"op": "say", "who": "shencheng", "t": {"zh": "……说出来，就不算了。", "en": "…If I say it, it won't count."}, "face": "sad"}, {"op": "say", "who": "shencheng", "t": {"zh": "不过今天的电影放完了，约也兑现了。那就说吧。", "en": "But today's film is nearly over, and the promise has been kept. So I'll say it."}, "face": "normal"}, {"op": "say", "who": "shencheng", "t": {"zh": "因为我一直以为，你会回来。可是看着你睡着的样子，我突然知道，你不会了。", "en": "Because I'd always believed you'd come back. But watching you sleep, I suddenly knew you wouldn't."}, "face": "sad"}], "values": ["cheng"]}, {"id": "film", "type": "expression", "label": {"zh": "“因为电影太难过了吧。”", "en": "\"Because the film was sad, I guess.\""}, "out": [{"text": {"zh": "……嗯。就当是吧。", "en": "…Mm. Let's say that."}}], "effects": [{"add": "rel.shencheng.warmth", "by": -1}], "script": [{"op": "say", "who": "shencheng", "t": {"zh": "……嗯。就当是吧。", "en": "…Mm. Let's say that."}, "face": "normal"}, {"op": "say", "who": null, "t": {"zh": "她把头从我肩膀上抬起来，坐直了。", "en": "She lifts her head from my shoulder and sits up straight."}}], "values": ["xi"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "cinema_night"}, {"op": "say", "who": null, "t": {"zh": "最后一场。铁椅子坐满了，后来的人站到了海堤上。", "en": "The last show. Every iron seat is taken; latecomers stand along the seawall."}}, {"op": "say", "who": null, "t": {"zh": "第一排最左边的两个位置，椅背上用粉笔写着：“留座”。", "en": "On the two seats at the far left of the front row, someone has chalked on the backs: 'Reserved.'"}}, {"op": "show", "who": "shencheng", "face": "normal", "at": "center"}, {"op": "say", "who": "shencheng", "t": {"zh": "……别看了。是我写的。", "en": "…Stop staring. I wrote it."}, "face": "shy"}, {"op": "say", "who": "shencheng", "t": {"zh": "七年前，我们就坐在这两个位置。", "en": "Seven years ago, these were our seats."}, "face": "normal"}, {"op": "cg", "id": "cg_front_row"}, {"op": "say", "who": null, "t": {"zh": "电影开始了。放到一半，我的肩膀一沉——是她的头。她没睡着，眼睛睁着，看着银幕。", "en": "The film begins. Halfway through, my shoulder grows heavy—her head. She isn't asleep. Her eyes are open, on the screen."}}, {"op": "say", "who": "shencheng", "t": {"zh": "（小声）七年前那天，你在这里睡着了。我哭了。", "en": "(quietly) Seven years ago, you fell asleep right here. And I cried."}, "face": "sad"}, {"op": "say", "who": "shencheng", "t": {"zh": "你知道我为什么哭吗？", "en": "Do you know why I cried?"}, "face": "normal"}, {"op": "cg", "id": null}], "when": {"v": "flag.route_shencheng", "op": "==", "val": true}, "cast": [{"id": "shencheng"}]}, "c5_even": {"id": "c5_even", "chapter": "c5", "kind": "main", "title": {"zh": "两清", "en": "Even"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "散场后，我送她回咖啡馆。和七年前一样的路。", "en": "After the show I walk her back to the café. The same road as seven years ago."}}], "choices": [{"id": "undecided", "type": "dilemma", "label": {"zh": "“我还没想好。……这是实话。”", "en": "\"I haven't decided. …That's the truth.\""}, "out": [{"text": {"zh": "嗯。你没摸耳朵。", "en": "Mm. You didn't touch your ear."}}], "effects": [{"add": "rel.shencheng.trust", "by": 1}, {"set": "flag.c_honest", "to": true}], "script": [{"op": "say", "who": "shencheng", "t": {"zh": "嗯。你没摸耳朵。", "en": "Mm. You didn't touch your ear."}, "face": "normal"}, {"op": "say", "who": "shencheng", "t": {"zh": "那等你想好了，第一个告诉我。别让我从中介嘴里听到。", "en": "Then when you've decided, tell me first. Don't let me hear it from some agent."}, "face": "sad"}], "values": ["cheng"]}, {"id": "promise", "type": "dilemma", "label": {"zh": "“不卖了。我不走了。”", "en": "\"I'm not selling. I'm not leaving.\""}, "out": [{"text": {"zh": "……不卖了？", "en": "…You're not selling?"}}], "effects": [{"add": "rel.shencheng.intimacy", "by": 1}, {"set": "flag.c_rash", "to": true}], "script": [{"op": "say", "who": "shencheng", "t": {"zh": "……不卖了？", "en": "…You're not selling?"}, "face": "surprised"}, {"op": "say", "who": "shencheng", "t": {"zh": "七年前，你也说过你会回来。", "en": "Seven years ago, you said you'd come back, too."}, "face": "sad"}, {"op": "say", "who": "shencheng", "t": {"zh": "别随口答应我。我已经不是会相信这种话的小孩了。", "en": "Don't promise me things off the cuff. I'm not a kid who believes that kind of thing anymore."}, "face": "angry"}], "values": ["yong"]}, {"id": "visit", "type": "expression", "label": {"zh": "“卖了以后，我也会常回来看你。”", "en": "\"Even if I sell, I'll come back to see you often.\""}, "out": [{"text": {"zh": "……常回来。", "en": "…'Often.'"}}], "effects": [{"add": "rel.shencheng.intimacy", "by": -1}, {"add": "rel.shencheng.trust", "by": -1}, {"set": "flag.c_cold", "to": true}], "script": [{"op": "say", "who": "shencheng", "t": {"zh": "……常回来。", "en": "…'Often.'"}, "face": "normal"}, {"op": "say", "who": "shencheng", "t": {"zh": "晚安，陆远。", "en": "Good night, Lu Yuan."}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "风铃响了一下，门关上了。", "en": "The wind chime rings once, and the door closes."}}], "values": ["xi"]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "street"}, {"op": "say", "who": null, "t": {"zh": "散场后，我送她回咖啡馆。和七年前一样的路。", "en": "After the show I walk her back to the café. The same road as seven years ago."}}, {"op": "show", "who": "shencheng", "face": "normal", "at": "center"}, {"op": "say", "who": "shencheng", "t": {"zh": "约兑现了。陆远，我们两清了。", "en": "The promise is kept. Lu Yuan, we're even now."}, "face": "smile"}, {"op": "say", "who": "shencheng", "t": {"zh": "……下午有个中介来店里，问你那栋老房子什么时候能看。", "en": "…A real estate agent came by the café this afternoon. Asked when they could view that old house of yours."}, "face": "normal"}, {"op": "say", "who": "me", "think": true, "t": {"zh": "转学手续是临时办的：只在这里念一个学期。回来之前，我的打算是看完影院最后一场，把房子卖掉，回城里的学校去。", "en": "The transfer was only ever meant to be temporary: one semester here. Before I came back, the plan was to see the cinema's last show, sell the house, and go back to my university in the city."}}, {"op": "say", "who": "shencheng", "t": {"zh": "要卖了，对吧。看完影院最后一场，你就又要走了。", "en": "You're selling, aren't you. Once you've seen the cinema's last show, you'll leave again."}, "face": "sad"}], "when": {"v": "flag.route_shencheng", "op": "==", "val": true}, "cast": [{"id": "shencheng"}]}, "c6_tin": {"id": "c6_tin", "chapter": "c6", "kind": "main", "title": {"zh": "可可罐", "en": "The Cocoa Tin"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "影院开拆那周，沈澄的咖啡馆也要重新装修。打烊以后，我留下来帮她搬柜子。", "en": "The week the cinema comes down, Shen Cheng's café is being renovated too. After closing I stay to help her move the cabinets."}}], "choices": [{"id": "wait", "type": "dilemma", "label": {"zh": "一封也不打开，把它们一个个捡起来放回罐子里，等她开口。", "en": "Open none of them. Pick them up one by one, put them back in the tin, and wait for her to speak."}, "out": [{"text": {"zh": "我把盖子盖好，递给她。她接过去，抱在怀里，很久没说话。", "en": "I put the lid back on and hand it to her. She takes it and holds it against her chest, silent for a long time."}}], "effects": [{"add": "rel.shencheng.trust", "by": 1}, {"add": "rel.shencheng.intimacy", "by": 1}, {"set": "flag.c_letters", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "我把盖子盖好，递给她。她接过去，抱在怀里，很久没说话。", "en": "I put the lid back on and hand it to her. She takes it and holds it against her chest, silent for a long time."}}, {"op": "say", "who": "shencheng", "t": {"zh": "……每年春天，影院开始放电影的那天，我写一封。", "en": "…Every spring, on the day the cinema started showing films again, I wrote one."}, "face": "sad"}, {"op": "say", "who": "shencheng", "t": {"zh": "不知道寄到哪里。所以就放在这里。", "en": "I didn't know where to send them. So I kept them here."}, "face": "normal"}, {"op": "say", "who": "shencheng", "t": {"zh": "今年的那一封……还没写。", "en": "This year's… I haven't written yet."}, "face": "shy"}], "values": ["ti"]}, {"id": "ask", "type": "dilemma", "label": {"zh": "“这些……是写给我的？”", "en": "\"Are these… for me?\""}, "out": [{"text": {"zh": "……是。", "en": "…Yes."}}], "effects": [{"add": "rel.shencheng.intimacy", "by": 2}, {"set": "flag.c_letters", "to": true}], "script": [{"op": "say", "who": "shencheng", "t": {"zh": "……是。", "en": "…Yes."}, "face": "shy"}, {"op": "say", "who": "shencheng", "t": {"zh": "可是不给你看。一封都不给。", "en": "But you're not reading them. Not a single one."}, "face": "angry"}, {"op": "say", "who": "shencheng", "t": {"zh": "里面有骂你的，有……别的。总之不给。", "en": "Some of them call you names. Some of them are… other things. Anyway, no."}, "face": "shy"}], "values": ["cheng"]}, {"id": "read", "type": "expression", "label": {"zh": "捡起“第一个春天”那一封，拆开。", "en": "Pick up 'The first spring' and open it."}, "out": [{"text": {"zh": "陆远！", "en": "Lu Yuan!"}}], "effects": [{"add": "rel.shencheng.trust", "by": -2}, {"set": "flag.c_tore", "to": true}], "script": [{"op": "say", "who": "shencheng", "t": {"zh": "陆远！", "en": "Lu Yuan!"}, "face": "angry"}, {"op": "say", "who": null, "t": {"zh": "她一把夺了过去。信封的一角，被撕开了一道口子。", "en": "She snatches it out of my hand. One corner of the envelope is torn."}}, {"op": "say", "who": "shencheng", "t": {"zh": "……你走吧。今天不用帮忙了。", "en": "…Go. You don't need to help tonight."}, "face": "sad"}], "values": ["xi"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "cafe"}, {"op": "say", "who": null, "t": {"zh": "影院开拆那周，沈澄的咖啡馆也要重新装修。打烊以后，我留下来帮她搬柜子。", "en": "The week the cinema comes down, Shen Cheng's café is being renovated too. After closing I stay to help her move the cabinets."}}, {"op": "show", "who": "shencheng", "face": "normal", "at": "right"}, {"op": "say", "who": null, "t": {"zh": "那天晚上以后，她给我端咖啡，只说一句“请慢用”。和对任何一个客人都一样。", "en": "Since that night, when she brings me coffee she says only 'Enjoy.' The same as with any other customer."}, "when": {"v": "flag.c_cold", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "最上面一格，掉下来一个旧可可罐，盖子摔开了。里面是一叠信封。", "en": "From the top shelf an old cocoa tin falls, and the lid pops off. Inside is a stack of envelopes."}}, {"op": "say", "who": null, "t": {"zh": "七个。每一个上面写着一行字：“第一个春天”“第二个春天”……一直到“第七个春天”。最后一个，是空的，没有封口。", "en": "Seven of them. Each one bears a single line: 'The first spring,' 'The second spring'… all the way to 'The seventh spring.' The last one is empty, and unsealed."}}, {"op": "say", "who": null, "t": {"zh": "收信人那一栏，写的都是我的名字。没有地址。", "en": "In the space for the addressee, every one has my name. No address."}}, {"op": "show", "who": "shencheng", "face": "surprised", "at": "right"}, {"op": "say", "who": "shencheng", "t": {"zh": "……别看。", "en": "…Don't look."}, "face": "surprised"}], "when": {"v": "flag.route_shencheng", "op": "==", "val": true}, "cast": [{"id": "shencheng"}]}, "c6_cats": {"id": "c6_cats", "chapter": "c6", "kind": "side", "title": {"zh": "三花的孙子", "en": "The Calico's Grandkits"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "海堤上，那只最小的猫一直跟着沈澄走。", "en": "On the seawall, the smallest of the cats keeps following Shen Cheng."}}], "choices": [{"id": "adopt", "type": "dilemma", "label": {"zh": "“放我那里吧。老房子有院子。”", "en": "\"Let it stay with me. The old house has a yard.\""}, "out": [{"text": {"zh": "……你那里？", "en": "…With you?"}}], "effects": [{"add": "rel.shencheng.intimacy", "by": 1}, {"add": "rel.shencheng.trust", "by": 1}, {"set": "flag.c_cat", "to": true}], "script": [{"op": "say", "who": "shencheng", "t": {"zh": "……你那里？", "en": "…With you?"}, "face": "surprised"}, {"op": "say", "who": "shencheng", "t": {"zh": "养猫要很久的。十几年。你想好了？", "en": "A cat is a long time. Over ten years. Have you thought this through?"}, "face": "normal"}, {"op": "say", "who": "shencheng", "t": {"zh": "……那我每天去喂。你不在的时候也去。", "en": "…Then I'll come feed it every day. Even when you're not around."}, "fa .route_shencheng", "op": "==", "val": true}, "cast": [{"id": "shencheng"}]}, "c7_sign": {"id": "c7_sign", "chapter": "c7", "kind": "main", "title": {"zh": "签字的那天", "en": "The Day of the Signing"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "周五下午，中介带着买家来了。合同摊在院子里的石桌上，枇杷树的影子落在纸上。", "en": "Friday afternoon, the agent brings the buyer. The contract is laid out on the stone table in the yard, the loquat tree's shadow falling across the page."}}], "choices": [{"id": "keep", "type": "dilemma", "label": {"zh": "把笔还给中介：“对不起。不卖了。”", "en": "Hand the pen back to the agent: \"I'm sorry. I'm not selling.\""}, "out": [{"text": {"zh": "买家骂了几句，走了。中介摇着头，把合同收回了包里。", "en": "The buyer grumbles a few words and leaves. The agent shakes his head and puts the contract back in his bag."}}], "effects": [{"add": "rel.shencheng.trust", "by": 1}, {"set": "flag.c_keep", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "买家骂了几句，走了。中介摇着头，把合同收回了包里。", "en": "The buyer grumbles a few words and leaves. The agent shakes his head and puts the contract back in his bag."}}, {"op": "say", "who": null, "t": {"zh": "我给城里的学校发了一封邮件：下学期，我不回去了。发完以后，手机在手里攥了很久。", "en": "I email my university in the city: I won't be coming back next semester. Afterward, I hold the phone in my hand for a long time."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "然后，我拨了她的号码。答应过的：第一个告诉她。", "en": "Then I dial her number. I promised: she'd be the first to know."}, "when": {"v": "flag.c_honest", "op": "==", "val": true}}], "values": ["gu"]}, {"id": "later", "type": "strategy", "label": {"zh": "“再给我一周。”", "en": "\"Give me another week.\""}, "out": [{"text": {"zh": "中介答应了，脸色不太好看。买家说，一周以后不签，他就买别家的。", "en": "The agent agrees, though he doesn't look pleased. The buyer says if it isn't signed in a week, he'll buy elsewhere."}}], "effects": [{"add": "rel.shencheng.trust", "by": -1}], "script": [{"op": "say", "who": null, "t": {"zh": "中介答应了，脸色不太好看。买家说，一周以后不签，他就买别家的。", "en": "The agent agrees, though he doesn't look pleased. The buyer says if it isn't signed in a week, he'll buy elsewhere."}}], "values": ["ti"]}, {"id": "sign", "type": "expression", "label": {"zh": "签字。", "en": "Sign."}, "out": [{"text": {"zh": "我签了名字。笔尖划过纸的声音，比想象中响。", "en": "I sign my name. The scratch of the nib across the paper is louder than I expected."}}], "effects": [{"set": "flag.c_sold", "to": true}, {"add": "rel.shencheng.intimacy", "by": -1}], "script": [{"op": "say", "who": null, "t": {"zh": "我签了名字。笔尖划过纸的声音，比想象中响。", "en": "I sign my name. The scratch of the nib across the paper is louder than I expected."}}], "values": ["xi"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "oldhouse"}, {"op": "say", "who": null, "t": {"zh": "周五下午，中介带着买家来了。合同摊在院子里的石桌上，枇杷树的影子落在纸上。", "en": "Friday afternoon, the agent brings the buyer. The contract is laid out on the stone table in the yard, the loquat tree's shadow falling across the page."}}, {"op": "say", "who": null, "t": {"zh": "“签了字，下个月就能过户。”中介把笔递给我。", "en": "'Sign here, and the transfer goes through next month.' The agent holds out a pen."}}, {"op": "say", "who": null, "t": {"zh": "院子角落里，那只叫“七”的小猫正在睡觉。", "en": "In a corner of the yard, the little cat called Seven is asleep."}, "when": {"v": "flag.c_cat", "op": "==", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "阁楼的箱子里，还有一把黄色的伞。", "en": "Up in the attic, in a box, there's still a yellow umbrella."}, "when": {"v": "flag.c_umbrella", "op": "==", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "那天晚上，我随口说过“不卖了”。她说她不信。", "en": "That night I said 'I'm not selling' without thinking. She said she didn't believe me."}, "when": {"v": "flag.c_rash", "op": "==", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "她说过：想好了，第一个告诉她。", "en": "She said: when you've decided, tell me first."}, "when": {"v": "flag.c_honest", "op": "==", "val": true}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "沈澄没有来。她说今天要盯着店里装修。", ll": [{"v": "rel.shencheng.intimacy", "op": ">=", "val": 8}, {"v": "rel.shencheng.trust", "op": ">=", "val": 4}, {"v": "flag.c_keep", "op": "==", "val": true}]}}, {"id": "take", "type": "expression", "label": {"zh": "接过可可罐。", "en": "Take the cocoa tin."}, "out": [{"text": {"zh": "都给你。……从今往后，我不写了。", "en": "They're all yours. …From now on, I won't write any more."}}], "effects": [{"set": "flag.c_normal", "to": true}], "script": [{"op": "say", "who": "shencheng", "t": {"zh": "都给你。……从今往后，我不写了。", "en": "They're all yours. …From now on, I won't write any more."}, "face": "smile"}, {"op": "say", "who": "shencheng", "t": {"zh": "一路顺风，陆远。", "en": "Safe travels, Lu Yuan."}, "face": "normal"}, {"op": "say", "who": null, "t": {"zh": "她转身走了。海风很大，罐子在我手里很轻。", "en": "She turns and walks away. The sea wind is strong, and the tin is very light in my hands."}}]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "seawall_night"}, {"op": "say", "who": null, "t": {"zh": "夜里，沈澄在海堤上等我。手里拿着那个可可罐。", "en": "That night, Shen Cheng waits for me on the seawall, the cocoa tin in her hands."}}, {"op": "show", "who": "shencheng", "face": "normal", "at": "center"}, {"op": "say", "who": "shencheng", "t": {"zh": "中介来店里了，说你把买家气走了。……笨蛋。", "en": "The agent came by the café. Said you drove the buyer off. …Idiot."}, "face": "shy", "when": {"v": "flag.c_keep", "op": "==", "val": true}}, {"op": "say", "who": "shencheng", "t": {"zh": "听说签了。……挺好的。城里的学校，总要回去的。", "en": "I heard you signed. …That's good. You have to go back to your university in the city eventually."}, "face": "smile", "when": {"v": "flag.c_sold", "op": "==", "val": true}}, {"op": "say", "who": "shencheng", "t": {"zh": "听说你让人家再等一周。……你总是让人等。", "en": "I heard you asked them to wait another week. …You're always making people wait."}, "face": "sad", "when": {"all": [{"v": "flag.c_keep", "op": "!=", "val": true}, {"v": "flag.c_sold", "op": "!=", "val": true}]}}, {"op": "say", "who": "shencheng", "t": {"zh": "这七封信，我想了很久要怎么办。", "en": "I've thought for a long time about what to do with these seven letters."}, "face": "normal"}, {"op": "say", "who": "shencheng", "t": {"zh": "那天你一封都没拆。……谢谢。", "en": "That day you didn't open a single one. …Thank you."}, "face": "shy", "when": {"v": "flag.c_letters", "op": "==", "val": true}}, {"op": "say", "who": "shencheng", "t": {"zh": "被你撕开的那一封，我用胶带粘好了。", "en": "The one you tore open—I taped it back together."}, "face": "sad", "when": {"v": "flag.c_tore", "op": "==", "val": true}}, {"op": "say", "who": "shencheng", "t": {"zh": "第一排那晚，你问我为什么哭。我只说了一半。另一半，都在这里面。", "en": "That night in the front row, you asked why I cried. I only told you half. The other half is all in here."}, "face": "normal", "when": {"v": "flag.c_asked", "op": "==", "val": true}}, {"op": "say", "who": "shencheng", "t": {"zh": "第七个信封是空的。今年，我写不出来了。", "en": "The seventh envelope is empty. This year, I couldn't write it."}, "face": "sad"}], "when": {"v": "flag.route_shencheng", "op": "==", "val": true}, "cast": [{"id": "shencheng"}]}, "c5_reel": {"id": "c5_reel", "chapter": "c5", "kind": "main", "title": {"zh": "第七卷", "en": "Reel Seven"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "零点过后。放映室里只开了一盏灯。季白把第七卷装上放映机，手停在开关上。", "en": "Past midnight. A single lamp is lit in the booth. Ji Bai threads reel seven onto the projector, and her hand stops on the switch."}}], "choices": [{"id": "find", "type": "dilemma", "label": {"zh": "“剪掉的那一段，我们把它找回来。”", "en": "\"Whatever he cut out—we'll find it.\""}, "out": [{"text": {"zh": "……找？", "en": "…Find it?"}}], "effects": [{"add": "rel.jibai.intimacy", "by": 1}, {"add": "rel.jibai.trust", "by": 1}, {"set": "flag.j_search", "to": true}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "……找？", "en": "…Find it?"}, "face": "surprised"}, {"op": "say", "who": "jibai", "t": {"zh": "胶片是会坏的。剪下来放了七年，可能已经粘成一团了。", "en": "Film decays. If it's been sitting cut loose for seven years, it may have fused into a lump."}, "face": "normal"}, {"op": "say", "who": "jibai", "t": {"zh": "不过，修胶片的人，最喜欢的就是这种事。", "en": "But for someone who restores film, that's exactly the kind of job we love."}, "face": "smile"}], "values": ["yong"]}, {"id": "cot", "type": "expression", "label": {"zh": "“那张床……我小时候真的在这里睡过很多次。”", "en": "\"That cot… I really did sleep here, lots of times, as a kid.\""}, "out": [{"text": {"zh": "他拍了你很多次。每一次，镜头都很稳。", "en": "He filmed you over and over. Every time, the camera was steady."}}], "effects": [{"add": "rel.jibai.intimacy", "by": 2}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "他拍了你很多次。每一次，镜头都很稳。", "en": "He filmed you over and over. Every time, the camera was steady."}, "face": "normal"}, {"op": "say", "who": "jibai", "t": {"zh": "陆同学，他很想你。胶片不会说谎。", "en": "Mr. Lu, he missed you. Film doesn't lie."}, "face": "sad"}], "values": ["wen"]}, {"id": "leave", "type": "expression", "label": {"zh": "“他剪掉，就是不想让人看。算了吧。”", "en": "\"If he cut it, he didn't want it seen. Let it go.\""}, "out": [{"text": {"zh": "……嗯。", "en": "…Mm."}}], "effects": [{"add": "rel.jibai.trust", "by": 1}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "……嗯。", "en": "…Mm."}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "她把胶片倒回去，放进铁盒，在盖子上贴了一张新标签：“第七卷（不完整）”。", "en": "She rewinds the film, puts it back in its tin, and sticks a new label on the lid: 'Reel 7 (incomplete).'"}}], "values": ["ti"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "projection"}, {"op": "say", "who": null, "t": {"zh": "零点过后。放映室里只开了一盏灯。季白把第七卷装上放映机，手停在开关上。", "en": "Past midnight. A single lamp is lit in the booth. Ji Bai threads reel seven onto the projector, and her hand stops on the switch."}}, {"op": "show", "who": "jibai", "face": "normal", "at": "center"}, {"op": "say", "who": "jibai", "t": {"zh": "我修好了，可是一格都没看。……你来开。", "en": "I've restored it, but I haven't watched a single frame. …You turn it on."}, "face": "normal"}, {"op": "cg", "id": "cg_booth"}, {"op": "say", "who": null, "t": {"zh": "第一格，是一片海。然后是潮声影院，刚刷过漆的银幕。再然后，是放映室里那张小床——床上睡着一个小孩。", "en": "The first frame is the sea. Then the Tidesound, its screen freshly painted. Then the little cot in the booth—and a child asleep on it."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "是我。", "en": "It's me."}}, {"op": "say", "who": null, "t": {"zh": "画面里有很多个春天：银幕补了又补，椅子换了一排又一排，第一排有个小女孩在哭。最后，是空荡荡的座位，和一行手写的字幕：“第七个春天”。", "en": "There are many springs on the film: the screen patched again and again, the seats replaced row by row, a little girl crying in the front row. And at the end, empty seats, and one handwritten title card: 'The Seventh Spring.'"}}, {"op": "say", "who": null, "t": {"zh": "然后，画面断了。只剩一道歪歪扭扭的接缝。", "en": "Then the picture cuts off. All that's left is a crooked splice."}}, {"op": "cg", "id": null}, {"op": "say", "who": "jibai", "t": {"zh": "……后面被剪掉了。剪得很急。他的手在抖。", "en": "…The rest has been cut. In a hurry. His hands were shaking."}, "face": "sad"}], "when": {"v": "flag.route_jibai", "op": "==", "val": true}, "cast": [{"id": "jibai"}]}, "c5_lastreel": {"id": "c5_lastreel", "chapter": "c5", "kind": "main", "title": {"zh": "最后一卷", "en": "The Final Reel"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "晚上，最后一场。三百多人坐在下面，我和季白在放映室里。从小窗望出去，银幕亮得像一扇门。", "en": "Evening, the last show. Over three hundred people below; Ji Bai and I up in the booth. Through the little window, the screen glows like a doorway."}}], "choices": [{"id": "watch", "type": "dilemma", "label": {"zh": "“今天，我们一起看完。”", "en": "\"Tonight, we'll watch it to the end. Together.\""}, "out": [{"text": {"zh": "……一起？", "en": "…Together?"}}], "effects": [{"add": "rel.jibai.intimacy", "by": 2}, {"set": "flag.j_watched", "to": true}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "……一起？", "en": "…Together?"}, "face": "surprised"}, {"op": "say", "who": null, "t": {"zh": "她慢慢转过身来。我们挤在那扇小窗前面，肩膀挨着肩膀。", "en": "Slowly, she turns around. We squeeze in front of the little window, shoulder to shoulder."}}, {"op": "say", "who": null, "t": {"zh": "片尾字幕升起来的时候，下面的三百个人一起鼓掌。季白没有鼓掌。她在哭，哭得很安静。", "en": "As the end credits rise, the three hundred people below applaud together. Ji Bai doesn't clap. She's crying, very quietly."}}, {"op": "say", "who": "jibai", "t": {"zh": "……原来结束是这个样子的。也不是很可怕。", "en": "…So this is what an ending looks like. It isn't all that frightening."}, "face": "smile"}], "values": ["yong"]}, {"id": "narrate", "type": "dilemma", "label": {"zh": "“那我替你看。我讲给你听。”", "en": "\"Then I'll watch it for you. I'll tell you what happens.\""}, "out": [{"text": {"zh": "我站在小窗前，一句一句地讲。她背对着银幕，闭着眼睛听。", "en": "I stand at the window and describe it line by line. She sits with her back to the screen, eyes closed, listening."}}], "effects": [{"add": "rel.jibai.intimacy", "by": 1}, {"add": "rel.jibai.trust", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "我站在小窗前，一句一句地讲。她背对着银幕，闭着眼睛听。", "en": "I stand at the window and describe it line by line. She sits with her back to the screen, eyes closed, listening."}}, {"op": "say", "who": "jibai", "t": {"zh": "……你讲得比电影好。", "en": "…You tell it better than the film does."}, "face": "smile"}], "values": ["wen"]}, {"id": "let", "type": "expression", "label": {"zh": "什么也不说，陪她背对着坐下。", "en": "Say nothing. Sit down beside her, back to the window."}, "out": [{"text": {"zh": "我们背对着银幕坐了一卷的时间。放映机嗒嗒地响，像一只很大的钟。", "en": "We sit with our backs to the screen for the length of a reel. The projector clatters away like a very large clock."}}], "effects": [{"add": "rel.jibai.trust", "by": 1}], "script": [{"op": "say", "who": null, "t": {"zh": "我们背对着银幕坐了一卷的时间。放映机嗒嗒地响，像一只很大的钟。", "en": "We sit with our backs to the screen for the length of a reel. The projector clatters away like a very large clock."}}], "values": ["ti"]}], "salience": 0, "order": 2, "script": [{"op": "bg", "id": "projection"}, {"op": "say", "who": null, "t": {"zh": "晚上，最后一场。三百多人坐在下面，我和季白在放映室里。从小窗望出去，银幕亮得像一扇门。", "en": "Evening, the last show. Over three hundred people below; Ji Bai and I up in the booth. Through the little window, the screen glows like a doorway."}}, {"op": "show", "who": "jibai", "face": "normal", "at": "center"}, {"op": "say", "who": "jibai", "t": {"zh": "还有一卷就放完了。", "en": "One more reel and it's over."}, "face": "normal"}, {"op": "say", "who": null, "t": {"zh": "她把最后一卷装上机器，然后转过身，背对着小窗坐下了。", "en": "She threads the final reel onto the machine, then turns around and sits down with her back to the window."}}, {"op": "say", "who": "jibai", "t": {"zh": "我从来不看最后一卷。每一部都是。只看焦点，不看故事。", "en": "I never watch the final reel. Not of any film. I check the focus, I don't watch the story."}, "face": "sad"}, {"op": "say", "who": "jibai", "t": {"zh": "看了，就结束了。", "en": "If I watch it, it's over."}, "face": "sad"}], "when": {"v": "flag.route_jibai", "op": "==", "val": true}, "cast": [{"id": "jibai"}]}, "c6_scrap": {"id": "c6_scrap", "chapter": "c6", "kind": "main", "title": {"zh": "废铁", "en": "Scrap Metal"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "周一，拆迁队进场。收废品的三轮车停在放映室楼下。", "en": "Monday, the demolition crew moves in. A scrap collector's tricycle is parked below the booth."}}], "choices": [{"id": "buy", "type": "dilemma", "label": {"zh": "“八百块，那台小的我买了。”", "en": "\"Eight hundred? I'll buy the small one.\""}, "out": [{"text": {"zh": "……你买放映机做什么？你又不会放。", "en": "…What do you want with a projector? You don't know how to run one."}}], "effects": [{"add": "rel.jibai.intimacy", "by": 1}, {"add": "rel.jibai.trust", "by": 1}, {"set": "flag.j_projector", "to": true}], "script": [{"op": "say", "who": null, "t": {"zh": "义卖海报剩下的钱，正好够。", "en": "What's left from the poster sale covers it exactly."}, "when": {"v": "flag.poster_sale", "op": "==", "val": true}}, {"op": "say", "who": null, "t": {"zh": "我把钱包里的钱全掏了出来，还差两百。老周骂了一句，替我补上了。", "en": "I empty my wallet and come up two hundred short. Old Zhou swears once and makes up the difference."}, "when": {"v": "flag.poster_sale", "op": "!=", "val": true}}, {"op": "say", "who": "jibai", "t": {"zh": "……你买放映机做什么？你又不会放。 ": "hide", "who": "zhou"}, {"op": "show", "who": "jibai", "face": "normal", "at": "center"}, {"op": "say", "who": "jibai", "t": {"zh": "陆同学，有件事我还没说。", "en": "Mr. Lu, there's something I haven't told you."}, "face": "normal"}, {"op": "say", "who": "jibai", "t": {"zh": "北京的电影资料馆要我去修片子。七月报到。……他们说，第七卷也可以一起带去，好好保存。", "en": "The National Film Archive in Beijing wants me to restore films for them. I start in July. …They say reel seven can come too, to be properly preserved."}, "face": "sad"}, {"op": "say", "who": "jibai", "t": {"zh": "影院没了，放映机也没了。我在汐川，已经没有可以放电影的地方了。", "en": "The cinema's gone. The projectors will be gone. There's nowhere left in Xichuan for me to run a film."}, "face": "sad"}], "when": {"v": "flag.route_jibai", "op": "==", "val": true}, "cast": [{"id": "jibai"}, {"id": "zhou"}]}, "c6_paper": {"id": "c6_paper", "chapter": "c6", "kind": "side", "title": {"zh": "十四年前的报纸", "en": "A Newspaper from Fourteen Years Ago"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "图书馆三楼，季白翻出了一摞旧报纸。", "en": "On the library's third floor, Ji Bai has dug out a stack of old newspapers."}}], "choices": [{"id": "once", "type": "dilemma", "label": {"zh": "“只放一次……那一次，他想放给谁看？”", "en": "\"Only once… Who did he want to show it to?\""}, "out": [{"text": {"zh": "……陆同学。", "en": "…Mr. Lu."}}], "effects": [{"add": "rel.jibai.intimacy", "by": 1}, {"add": "rel.jibai.trust", "by": 1}, {"set": "flag.j_once", "to": true}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "……陆同学。", "en": "…Mr. Lu."}, "face": "sad"}, {"op": "say", "who": "jibai", "t": {"zh": "你在问一个答案很明显的问题。", "en": "You're asking a question with a very obvious answer."}, "face": "sad"}], "values": ["cheng"]}, {"id": "copy", "type": "strategy", "label": {"zh": "把那篇报道复印下来，夹进第七卷的铁盒里。", "en": "Photocopy the article and tuck it into reel seven's tin."}, "out": [{"text": {"zh": "好主意。片子和说明书，放在一起。", "en": "Good idea. The film and its notes, kept together."}}], "effects": [{"add": "rel.jibai.esteem",
