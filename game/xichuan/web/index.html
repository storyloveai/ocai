<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>汐川的第七个春天</title>
<style>
:root { --ink: #f4f1ec; --muted: #c9c3bb; --box: rgba(18, 24, 44, .82); --edge: rgba(255, 255, 255, .18); --accent: #ffb3c7; --accent-ink: #3a1d27; --bg: #0b0f1c; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.7 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent }
#stage { position: fixed; inset: 0; margin: auto; aspect-ratio: 16 / 9; max-width: 100vw; max-height: 100vh; width: 100vw; overflow: hidden; background: #111; user-select: none }
@media (max-aspect-ratio: 16/9) { #stage { width: 100vw; height: auto } }
@media (orientation: portrait) and (max-width: 700px) { #stage { aspect-ratio: auto; width: 100vw; height: 100dvh } }
.layer { position: absolute; inset: 0 }
#bg { background-size: cover; background-position: center; transition: opacity .6s }
#bg .ph, #cg .ph { position: absolute; left: 16px; top: 14px; font-size: 13px; color: rgba(255,255,255,.75); letter-spacing: .08em; background: rgba(0,0,0,.25); padding: 2px 10px; border-radius: 99px }
#sprites { pointer-events: none }
.sprite { position: absolute; bottom: 0; height: 96%; aspect-ratio: 2 / 3; transform: translateX(-50%); transition: left .35s, filter .25s, opacity .3s; display: flex; align-items: flex-end; justify-content: center }
.sprite img { height: 100%; width: auto; object-fit: contain }
.sprite.dim { filter: brightness(.62) saturate(.8) }
.sprite svg { height: 100%; width: 100% }
@media (orientation: portrait) and (max-width: 700px) { .sprite { height: 62%; bottom: 26% } }
#cg { background-size: cover; background-position: center; opacity: 0; pointer-events: none; transition: opacity .6s }
#cg.on { opacity: 1 }
#box { position: absolute; left: 3%; right: 3%; bottom: 3%; min-height: 26%; background: var(--box); border: 1px solid var(--edge); border-radius: 14px; padding: 2.6% 3.2% 2%; backdrop-filter: blur(6px); cursor: pointer }
#name { position: absolute; top: -18px; left: 4%; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 3px 18px; border-radius: 99px; font-size: 15px; letter-spacing: .06em }
#name:empty { display: none }
#text { font-size: clamp(15px, 2.1vw, 21px); line-height: 1.75; min-height: 3.5em; white-space: pre-wrap }
#text.think { color: #cfe3ff; font-style: italic }
#next { position: absolute; right: 2.4%; top: 34%; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 10px solid var(--accent); animation: bob 1s infinite; opacity: 0 }
#next.on { opacity: 1 }
@keyframes bob { 50% { transform: translateY(4px) } }
#bar { position: absolute; right: 4%; bottom: calc(3% + 4px); display: flex; gap: 4px; z-index: 3 }
#bar button, .menu button, .panel button { font: inherit; font-size: 12.5px; color: var(--muted); background: none; border: 0; padding: 4px 8px; border-radius: 6px; cursor: pointer }
#bar button[aria-pressed="true"] { color: var(--accent) }
#bar button:hover { color: var(--ink) }
.menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(6, 8, 18, .35); z-index: 4 }
.menu .prompt { color: var(--muted); font-size: 14px; letter-spacing: .1em; margin-bottom: 4px }
.menu .opt { min-width: min(560px, 82%); font-size: clamp(14px, 1.8vw, 18px); color: var(--ink); background: var(--box); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 22px; text-align: center; transition: background .15s, border-color .15s }
.menu .opt:hover, .menu .opt:focus-visible { border-color: var(--accent); background: rgba(58, 29, 39, .85); outline: none }
.menu .opt[disabled] { opacity: .45; cursor: default }
.panel { position: absolute; inset: 4%; background: rgba(10, 13, 26, .94); border: 1px solid var(--edge); border-radius: 14px; z-index: 6; display: flex; flex-direction: column; padding: 18px 22px }
.panel h2 { margin: 0 0 10px; font-size: 18px; letter-spacing: .1em }
.panel .body { overflow: auto; flex: 1; padding-right: 6px }
.panel .close { position: absolute; top: 10px; right: 12px; font-size: 14px }
.log p { margin: 0 0 10px } .log b { color: var(--accent); margin-right: 8px; font-weight: 600 }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px }
.slot { text-align: left !important; border: 1px solid var(--edge) !important; padding: 10px 12px !important; color: var(--ink) !important; line-height: 1.5 }
.slot small { color: var(--muted); display: block }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px }
.gallery div { aspect-ratio: 16/9; border-radius: 8px; background: #222 center/cover; display: flex; align-items: flex-end; padding: 6px 10px; font-size: 12.5px; border: 1px solid var(--edge) }
.gallery div.locked { color: var(--muted); background: repeating-linear-gradient(45deg, #1a1d2a 0 10px, #161925 10px 20px) }
#title { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; justify-content: center; padding-left: 8%; gap: 10px; background-size: cover; background-position: center }
#title::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,10,22,.85), rgba(8,10,22,.2) 70%) }
#title > * { position: relative }
#title h1 { margin: 0; font-size: clamp(26px, 5vw, 54px); letter-spacing: .12em; font-weight: 700 }
#title .sub { color: var(--muted); letter-spacing: .3em; font-size: clamp(11px, 1.4vw, 15px); margin-bottom: 18px }
#title button { align-self: flex-start; font: inherit; font-size: clamp(14px, 1.8vw, 18px); color: var(--ink); background: none; border: 0; border-left: 2px solid transparent; padding: 4px 12px; cursor: pointer; letter-spacing: .12em }
#title button:hover, #title button:focus-visible { border-left-color: var(--accent); color: var(--accent); outline: none }
#title .lang { position: absolute; top: 16px; right: 20px; font-size: 13px }
.end { position: absolute; inset: 0; z-index: 5; background: rgba(6, 8, 18, .88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 8%; text-align: center }
.end h2 { margin: 0; letter-spacing: .12em; text-wrap: balance } .end h3 { margin: 10px 0 0; font-size: 14px; font-weight: 500; letter-spacing: .2em; color: var(--muted) } .end p { margin: 0; color: var(--muted); max-width: 640px; line-height: 1.8 }
.end button { font: inherit; color: var(--ink); background: var(--box); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 20px; cursor: pointer; margin-top: 10px }
[hidden] { display: none !important }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <div id="sprites" class="layer"></div>
  <div id="cg" class="layer"></div>
  <div id="box" role="button" tabindex="0" aria-label="next"><div id="name"></div><div id="text"></div><div id="next"></div></div>
  <div id="bar"></div>
  <div id="menu" class="menu" hidden></div>
  <div id="panel" class="panel" hidden></div>
  <div id="endscreen" class="end" hidden></div>
  <div id="title"></div>
</div>
<script>/* StoryDate campaign engine — shared by every book. Canonical copy: game/engine/campaign_core.js
 * (books keep a byte-identical copy; CI checks it). Engine version CC.VERSION; reads campaigns of spec
 * storydate.campaign/0.3 (legacy: relationship model not enforced) and /0.4 (unified relationships,
 * tiers and a genre pack). See game/engine/README.md.
 * Pure functions, no DOM. Works in the browser (window.CC) and in Node (require).
 *
 * Layers (see 研究文档 §6–§7):
 *   rules      — conditions, effects, clamps. Only the rules change state.
 *   ledger     — append-only record of every change and its cause; endings are explained from it.
 *   director   — picks which side storylets to offer this chapter (salience: base + specificity + due echoes).
 *   echoes     — major choices register an echo; later nodes pay it with a callback line.
 *   debts      — when a choice removes the cause of a locked plot function, a debt opens and must be
 *                resolved later by transform / reroute / cancel.
 */
(function (root) {
  "use strict";
  const CC = {};
  CC.VERSION = "0.4.7";
  CC.SPECS = ["storydate.campaign/0.3", "storydate.campaign/0.4"];
  // 3 for legacy campaigns, 4 for campaigns on the unified relationship model + tiers + genre pack
  CC.specLevel = camp => { const m = /^storydate\.campaign\/0\.(\d+)$/.exec(camp.spec || ""); return m ? +m[1] : 0; };

  /* ---------------- conditions ---------------- */
  function getVar(st, name) { return st.v[name]; }
  function resolveVal(st, val) { return (typeof val === "string" && val[0] === "@") ? st.v[val.slice(1)] : val; }
  function evalCond(st, c) {
    if (!c) return true;
    if (c.all) return c.all.every(x => evalCond(st, x));
    if (c.any) return c.any.some(x => evalCond(st, x));
    const a = getVar(st, c.v), b = resolveVal(st, c.val);
    switch (c.op) {
      case "==": return (a === undefined ? false : a) === b;
      case "!=": return (a === undefined ? false : a) !== b;
      case ">=": return (a || 0) >= b;
      case "<=": return (a || 0) <= b;
      case ">": return (a || 0) > b;
      case "<": return (a || 0) < b;
      default: throw new Error("bad op " + c.op);
    }
  }
  function atoms(c, out = []) {
    if (!c) return out;
    if (c.all) c.all.forEach(x => atoms(x, out));
    else if (c.any) c.any.forEach(x => atoms(x, out));
    else out.push(c);
    return out;
  }
  function condVars(c) {
    const s = new Set();
    atoms(c).forEach(a => { s.add(a.v); if (typeof a.val === "string" && a.val[0] === "@") s.add(a.val.slice(1)); });
    return [...s];
  }
  CC.evalCond = evalCond; CC.atoms = atoms; CC.condVars = condVars;

  /* ---------------- state ---------------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  CC.rng = rng;

  /* A volume can start from where the previous one ended (carry = that volume's final state), or from a preset
   * (carry = { v: {...} } describing a typical earlier playthrough). Variables with the same name carry over,
   * except per-scene ones (heat.*) and narrative debts, which belong to their own volume. People also remember
   * what was said (mem) and promises still open stay open. */
  CC.carryable = (camp, name) => !!camp.vars[name] && camp.vars[name].carry !== false && !name.startsWith("heat.") && !name.startsWith("debt.") && name !== "ended_early";
  /* v2.3: each new volume pulls high relationship values back toward the middle (time passes; people change),
   * so a player who maxed someone out in an earlier volume still has room to grow. Values at or below the pivot
   * are kept as they are: a grudge or a cold shoulder carries over in full. */
  CC.compress = (camp, val) => {
    const cc = camp.carry_compress; if (!cc || val <= cc.pivot) return val;
    return Math.round(cc.pivot + (val - cc.pivot) * cc.k);
  };
  CC.tierOf = (camp, val) => { const t = camp.tiers; if (!t) return null; let k = 0; t.start.forEach((s, i) => { if (val >= s) k = i; }); return k; };
  CC.newGame = function (camp, carry) {
    const v = {};
    for (const [k, d] of Object.entries(camp.vars)) v[k] = d.init;
    for (const id of Object.keys(camp.debts)) v["debt." + id] = "none";
    const st = { v, vol: camp.id, ch: -1, phase: "start", cur: null, offer: [], lastOrder: -1, ledger: [], log: [], echoes: {}, seq: 0, done: [] };
    if (carry && carry.v) {
      const e = ledgerPush(st, { kind: "carry", node: null, choice: null, from: carry.vol || null, preset: carry.preset || null, changes: [], debts: [], echo: [] });
      for (let [k, val] of Object.entries(carry.v)) {
        if (!CC.carryable(camp, k) || val === undefined) continue;
        if (k.startsWith("rel.") && typeof val === "number") { const c = CC.compress(camp, val); if (c !== val) (e.compressed = e.compressed || []).push({ var: k, was: val, now: c }); val = c; }
        if (val === v[k]) continue;
        e.changes.push({ var: k, from: v[k], to: val }); v[k] = val;
      }
      if (carry.mem) st.mem = JSON.parse(JSON.stringify(carry.mem));
      if (carry.commits) st.commits = carry.commits.filter(k => k.status === "open").map(k => Object.assign({}, k, { prev: true }));
      if (carry.said) st.said = carry.said.slice();
      st.log.push({ k: "carry", from: carry.vol || null, preset: carry.preset || null, seq: e.seq });
    }
    enterChapter(camp, st, 0);
    return st;
  };
  // what a finished volume hands to the next one
  CC.carryOut = st => ({ vol: st.vol, v: Object.assign({}, st.v, st.v.ended_early ? { "prev.ended_early": true } : {}), ended_early: !!st.v.ended_early, mem: st.mem || {}, commits: st.commits || [], said: st.said || [] });
  CC.clone = st => JSON.parse(JSON.stringify(st));

  function chapterOf(camp, st) { return camp.chapters[st.ch]; }
  function nodesIn(camp, chId, kind) {
    return Object.values(camp.nodes).filter(n => n.chapter === chId && n.kind === kind).sort((a, b) => a.order - b.order);
  }

  function ledgerPush(st, e) { e.seq = ++st.seq; e.ch = st.ch; st.ledger.push(e); return e; }

  /* 0.4.1 hard tiers: camp.hard_tiers = { "rel.liubei.trust": 3 } means that once the value has reached that tier
   * (e.g. 倚重), ordinary gains no longer raise it; only an effect marked { key: true } (a key moment) can carry
   * it into the next tier. Losses always apply. The entry records what was held back (entry.held). */
  CC.heldBack = (camp, name, from, ef) => {
    const hard = camp.hard_tiers && camp.hard_tiers[name];
    if (hard === undefined || !ef.add || !(ef.by > 0) || ef.key) return false;
    const t = CC.tierOf(camp, from || 0); return t !== null && t >= hard;
  };
  // while someone holds a grudge (0.4.5): words toward them earn nothing, deeds earn half, key moments count in full,
  // and nothing short of a key moment lifts them into a higher tier with you
  // a book that wants its story to turn on a grudge declares a var "grudge.<who>"; the count is mirrored there so
  // conditions can read it (a third threat to Cao Cao is not the first)
  function setGrudge(camp, st, cid, n) {
    st.grudge = st.grudge || {}; st.grudge[cid] = Math.max(0, n);
    const v = "grudge." + cid, d = camp.vars[v]; if (d) st.v[v] = Math.max(d.min, Math.min(d.max, st.grudge[cid]));
  }
  function grudgeGate(camp, st, effs, words, e) {
    const g = st.grudge || {}, held = [], T = camp.tiers;
    const out = (effs || []).map(ef => {
      const m = /^rel\.(\w+)\.(\w+)$/.exec(ef.add || ""); if (!m || !(ef.by > 0) || !((g[m[1]] || 0) > 0)) return ef;
      let by = ef.key ? ef.by : words ? 0 : Math.floor(ef.by / 2);
      if (T && by > 0 && !ef.key) { const from = st.v[ef.add] || 0, k = T.start.reduce((a, s, i) => (from >= s ? i : a), 0); by = Math.min(by, T.end[k] - from); }
      if (by !== ef.by) held.push(m[1]);
      return by > 0 ? Object.assign({}, ef, { by }) : null;
    }).filter(Boolean);
    if (held.length) e.grudge = [...new Set((e.grudge || []).concat(held))];
    return out;
  }
  function applyEffects(camp, st, effects, entry) {
    for (const ef of effects || []) {
      const name = ef.set || ef.add;
      const d = camp.vars[name];
      if (!d) throw new Error("unknown var " + name);
      const from = st.v[name];
      if (CC.heldBack(camp, name, from, ef)) { (entry.held = entry.held || []).push(name); continue; }
      let to = ef.set !== undefined && "to" in ef ? ef.to : (from || 0) + ef.by;
      if (d.type === "num") to = Math.max(d.min, Math.min(d.max, to));
      st.v[name] = to;
      if (from !== to) entry.changes.push({ var: name, from, to });
    }
  }
  function openDebt(st, id, entry) {
    const k = "debt." + id;
    if (st.v[k] === "none") { st.v[k] = "open"; entry.changes.push({ var: k, from: "none", to: "open" }); entry.debts.push([id, "open"]); }
  }
  function resolveDebt(st, id, mode, entry) {
    const k = "debt." + id;
    if (st.v[k] === "open") { st.v[k] = mode; entry.changes.push({ var: k, from: "open", to: mode }); entry.debts.push([id, mode]); return true; }
    return false;
  }

  /* ---------------- art layers & places ---------------- */
  // a layer without "choice" shows when its condition holds; a layer with "choice" appears only after that option is taken
  CC.layers = function (camp, st, defs, choiceId) {
    const out = [];
    for (const l of defs || []) {
      if (l.choice && l.choice !== choiceId) continue;
      if (!evalCond(st, l.when)) continue;
      if (!out.includes(l.id)) out.push(l.id);
    }
    return out;
  };
  CC.stops = function (camp, st) {
    const out = [];
    const push = p => { if (p && out[out.length - 1] !== p) out.push(p); };
    for (const e of st.log) {
      if (e.k === "node") push(camp.nodes[e.n].place);
      if (e.k === "choice") { const c = camp.nodes[e.n].choices.find(x => x.id === e.c); push(c.place); }
    }
    return out;
  };

  /* ---------------- director ---------------- */
  CC.director = function (camp, st, chId) {
    const chap = camp.chapters.find(c => c.id === chId);
    const out = [];
    for (const n of nodesIn(camp, chId, "side")) {
      const eligible = !st.done.includes(n.id) && evalCond(st, n.when);
      const spec = atoms(n.when).length;
      const due = (n.callbacks || []).filter(c => st.echoes[c.pays] && !st.echoes[c.pays].paid.length && evalCond(st, c.when)).length;
      out.push({ id: n.id, eligible, base: n.salience || 0, spec, due, score: (n.salience || 0) + 2 * spec + 3 * due });
    }
    const ranked = out.filter(x => x.eligible).sort((a, b) => b.score - a.score || camp.nodes[a.id].order - camp.nodes[b.id].order);
    const sits = CC.situations(camp, st), kinds = sits.map(x => x.kind);
    if (kinds.includes("absent") || kinds.includes("dead")) return { all: out, offer: [], absent: sits.find(x => x.kind === "absent" || x.kind === "dead").id };
    const n = Math.max(1, (chap.offer || 2) - (kinds.includes("sidelined") || (!camp.situations && st.v["flag.sidelined"]) ? 1 : 0));
    return { all: out, offer: ranked.slice(0, n).map(x => x.id) };
  };

  function enterChapter(camp, st, i) {
    if (i >= camp.chapters.length) { checkCommits(camp, st, true); st.phase = "end"; st.cur = null; st.log.push({ k: "end" }); return; }
    st.ch = i; st.lastOrder = -1;
    const chap = chapterOf(camp, st);
    st.log.push({ k: "ch", c: chap.id, p: idxWhere(st, chap.intro) });
    tickSituations(camp, st);
    checkCommits(camp, st, false);
    // interrupts: crises that pre-empt a chapter when a meter crosses its line (disfavor, exposure)
    const intr = Object.values(camp.nodes).filter(n => n.kind === "interrupt" && !st.done.includes(n.id) && evalCond(st, n.when)).sort((a, b) => a.order - b.order)[0];
    if (intr) return enterNode(camp, st, intr.id);
    chapterBody(camp, st);
  }
  function chapterBody(camp, st) {
    const chap = chapterOf(camp, st);
    // main_first: the chapter opens on its main scene (a cold open); its side storylets are offered afterwards
    if (chap.main_first && st.sidedCh !== chap.id && st.lastOrder === -1) return nextMain(camp, st);
    offerSides(camp, st);
  }
  function offerSides(camp, st) {
    const chap = chapterOf(camp, st);
    st.sidedCh = chap.id;
    const hasSides = nodesIn(camp, chap.id, "side").length > 0;
    const d = CC.director(camp, st, chap.id);
    if (d.offer.length) {
      st.phase = "side"; st.offer = d.offer; st.cur = null;
      st.log.push({ k: "offer", c: chap.id, ids: d.offer, scores: d.all });
      return;
    }
    if (hasSides) st.log.push(d.absent ? { k: "sys", key: "away", sit: d.absent } : { k: "sys", key: "quiet" });
    nextMain(camp, st);
  }
  function idxWhere(st, paras) { const r = []; (paras || []).forEach((p, i) => { if (evalCond(st, p.when)) r.push(i); }); return r; }

  function nextMain(camp, st) {
    const chap = chapterOf(camp, st);
    const n = nodesIn(camp, chap.id, "main").find(n => n.order > st.lastOrder && !st.done.includes(n.id) && evalCond(st, n.when));
    if (!n) return chap.main_first && st.sidedCh !== chap.id ? offerSides(camp, st) : enterChapter(camp, st, st.ch + 1);
    st.lastOrder = n.order;
    enterNode(camp, st, n.id);
  }

  function enterNode(camp, st, id) {
    const n = camp.nodes[id];
    if (n.kind !== "flash") for (const k of Object.keys(st.v)) if (k.startsWith("heat.")) st.v[k] = 0; // tension is per scene
    st.cur = id; st.phase = "node"; st.offer = [];
    if (n.talk) { st.turns = st.turns || {}; st.turns[id] = n.talk.turns; }
    const oe = [];
    (n.on_enter || []).forEach((o, i) => {
      if (!evalCond(st, o.when)) return;
      const e = ledgerPush(st, { kind: "enter", node: id, choice: null, changes: [], debts: [], echo: [] });
      applyEffects(camp, st, o.effects, e);
      (o.resolve || []).forEach(([d, m]) => resolveDebt(st, d, m, e));
      oe.push(i);
    });
    // callbacks: pay pending echoes first, then most specific; at most two lines
    const cands = (n.callbacks || []).map((c, i) => ({ c, i })).filter(({ c }) => st.echoes[c.pays] && evalCond(st, c.when));
    cands.sort((a, b) => (st.echoes[a.c.pays].paid.length - st.echoes[b.c.pays].paid.length) || (st.echoes[b.c.pays].at - st.echoes[a.c.pays].at) || (atoms(b.c.when).length - atoms(a.c.when).length) || a.i - b.i);
    const cbs = cands.slice(0, 2).map(x => x.i);
    cbs.forEach(i => st.echoes[n.callbacks[i].pays].paid.push({ node: id, seq: st.seq }));
    st.log.push({ k: "node", n: id, p: idxWhere(st, n.intro), oe, cb: cbs, al: n.art ? CC.layers(camp, st, n.art.layers, null) : [], rel: Object.fromEntries(Object.entries(st.v).filter(([k]) => k.startsWith("rel."))) });
  }

  CC.pickSide = function (camp, st, id) {

", "label": {"zh": "“我只是来收拾爷爷的东西。”", "en": "\"I'm just here to pack up my grandfather's things.\""}, "out": [{"text": {"zh": "……这样啊。", "en": "…I see."}}], "effects": [{"add": "rel.zhiyao.trust", "by": 1}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "……这样啊。", "en": "…I see."}, "face": "sad"}, {"op": "say", "who": "zhiyao", "t": {"zh": "那你收拾的时候，小心点放映室。里面的东西，比你以为的要多。", "en": "Then be careful in the booth when you do. There's more in there than you think."}, "face": "normal"}, {"op": "say", "who": null, "t": {"zh": "她跳下台子，从我身边走过，没有回头。", "en": "She hops down from the stage and walks past me without looking back."}}], "values": ["cheng"]}, {"id": "spring", "type": "expression", "label": {"zh": "“……来看它最后一个春天。”", "en": "\"…I came to see its last spring.\""}, "out": [{"text": {"zh": "最后一个春天……", "en": "Its last spring…"}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 1}, {"set": "flag.saw_last_spring", "to": true}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "最后一个春天……", "en": "Its last spring…"}, "face": "surprised"}, {"op": "say", "who": "zhiyao", "t": {"zh": "这句话不错。可以借我用在海报上吗？", "en": "That's a good line. Can I borrow it for the poster?"}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "她笑起来的时候，夕阳刚好落进海里。", "en": "When she smiles, the sun has just slipped into the sea."}}], "values": ["wen"]}, {"id": "who", "type": "expression", "label": {"zh": "“……先说你是谁？”", "en": "\"…Who are you, first?\""}, "out": [{"text": {"zh": "我？夏知遥，汐川大学电影社社长。", "en": "Me? Xia Zhiyao. President of the Xichuan University Film Club."}}], "effects": [{"add": "rel.zhiyao.warmth", "by": 1}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "我？夏知遥，汐川大学电影社社长。", "en": "Me? Xia Zhiyao. President of the Xichuan University Film Club."}, "face": "normal"}, {"op": "say", "who": "zhiyao", "t": {"zh": "社员嘛……目前，一个。就是我。", "en": "Members… currently, one. Me."}, "face": "smile"}], "values": ["xi"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "train"}, {"op": "say", "who": null, "t": {"zh": "三月。列车沿着海岸线往南开。窗外的海，和七年前一模一样。", "en": "March. The train runs south along the coast. The sea outside the window looks exactly as it did seven years ago."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "七年。我以为自己不会再回来了。", "en": "Seven years. I thought I'd never come back."}}, {"op": "say", "who": null, "t": {"zh": "父亲去世以后，律师寄来一封信：汐川的老房子归我了。还有一句话，写在信的最后——", "en": "After my father died, the lawyer sent a letter: the old house in Xichuan was mine now. And one more line, at the very end—"}}, {"op": "say", "who": null, "t": {"zh": "“潮声影院五月拆除。你祖父的东西，还在放映室。——老周”", "en": "'The Tidesound Cinema comes down in May. Your grandfather's things are still in the projection booth. —Old Zhou'"}}, {"op": "bg", "id": "station"}, {"op": "say", "who": null, "t": {"zh": "汐川站小得只有一个站台。风里有咸味。", "en": "Xichuan Station has only one platform. The wind tastes of salt."}}, {"op": "bg", "id": "oldhouse"}, {"op": "say", "who": null, "t": {"zh": "老房子的门锁锈了。院子里那棵枇杷树还在，比记忆里高了很多。", "en": "The lock on the old house has rusted. The loquat tree in the yard is still there, much taller than I remember."}}, {"op": "say", "who": "me", "think": true, "t": {"zh": "先去影院看看吧。趁天还没黑。", "en": "I'll go see the cinema first. While it's still light."}}, {"op": "bg", "id": "cinema_dusk"}, {"op": "say", "who": null, "t": {"zh": "潮声影院是一座露天影院。白色的银幕背对着海，前面是一排排生锈的铁椅子。夕阳把银幕染成了橙色。", "en": "The Tidesound Cinema is an open-air theater. Its white screen stands with its back to the sea, rows of rusting iron seats before it. The sunset has turned the screen orange."}}, {"op": "cg", "id": "cg_stage"}, {"op": "say", "who": null, "t": {"zh": "银幕下面的台子上，站着一个女孩。她对着空无一人的座位，大声地念着什么。", "en": "On the stage beneath the screen stands a girl. She is reading something aloud, at full volume, to rows of empty seats."}}, {"op": "cg", "id": null}, {"op": "show", "who": "zhiyao", "face": "normal", "at": "center"}, {"op": "say", "who": "zhiyao", "t": {"zh": "……春季放映会，最后一季！每周六晚上七点，潮声影院，免费入场！——不对，太像卖菜的了。", "en": "…The Spring Screenings, final season! Every Saturday, seven p.m., the Tidesound Cinema, free admission!—No. That sounds like a market stall."}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……啊。", "en": "…Oh."}, "face": "surprised"}, {"op": "say", "who": "zhiyao", "t": {"zh": "你是拆迁办的人吧？我告诉你，五月之前，我们一天也不会搬的！", "en": "You're from the demolition office, right? Let me tell you—until May, we're not moving out a single day early!"}, "face": "angry"}, {"op": "say", "who": "me", "t": {"zh": "我不是拆迁办的。我姓陆。这座影院，是我爷爷开的。", "en": "I'm not from the demolition office. My name's Lu. My grandfather built this cinema."}}, {"op": "say", "who": "zhiyao", "t": {"zh": "……诶？", "en": "…Huh?"}, "face": "surprised"}, {"op": "say", "who": "zhiyao", "t": {"zh": "陆爷爷的孙子？那你——你是来拆它的，还是来救它的？", "en": "Grandpa Lu's grandson? Then you're—are you here to tear it down, or to save it?"}, "face": "normal"}], "cast": [{"id": "zhiyao"}]}, "c1_fair": {"id": "c1_fair", "chapter": "c1", "kind": "main", "title": {"zh": "社团招新", "en": "Club Fair"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "转学到汐川大学的第一天，室友程航就把我拖到了社团招新的广场上。", "en": "On my first day at Xichuan University, my roommate Cheng Hang drags me to the club fair in the square."}}], "choices": [{"id": "join", "type": "dilemma", "label": {"zh": "当场填表。", "en": "Fill in the form on the spot."}, "out": [{"text": {"zh": "真的？！", "en": "Really?!"}}], "effects": [{"set": "flag.joined_club", "to": true}, {"add": "rel.zhiyao.intimacy", "by": 1}, {"add": "rel.zhiyao.esteem", "by": 1}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "真的？！", "en": "Really?!"}, "face": "surprised"}, {"op": "say", "who": "zhiyao", "t": {"zh": "好，陆远，从今天起你就是电影社的第二个社员。工作很多的，你别后悔。", "en": "Okay, Lu Yuan, as of today you're the film club's second member. There's a lot of work. No regrets."}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "她把表格收好，像是怕我反悔，又看了一遍我的名字。", "en": "She tucks the form away, then reads my name over once more, as if afraid I'd take it back."}}], "values": ["yong"]}, {"id": "chase", "type": "dilemma", "label": {"zh": "说要想想，转身去追沈澄。", "en": "Say you need to think, and go after Shen Cheng."}, "out": [{"text": {"zh": "……喂！", "en": "…Hey!"}}], "effects": [{"add": "rel.shencheng.intimacy", "by": 1}, {"add": "rumor", "by": 1}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "……喂！", "en": "…Hey!"}, "face": "angry"}, {"op": "say", "who": null, "t": {"zh": "我在广场的另一头追上了沈澄。她没有停下来。", "en": "I catch up with Shen Cheng at the far end of the square. She doesn't stop walking."}}, {"op": "show", "who": "shencheng", "face": "normal", "at": "center"}, {"op": "say", "who": "shencheng", "t": {"zh": "有事？", "en": "Something you need?"}, "face": "normal"}, {"op": "say", "who": "me", "t": {"zh": "……好久不见。", "en": "…It's been a long time."}}, {"op": "say", "who": "shencheng", "t": {"zh": "七年。不是“好久”。", "en": "Seven years. Not 'a long time.'"}, "face": "sad"}, {"op": "say", "who": null, "t": {"zh": "她说完就走了。可我看见，她走到拐角时，回头看了一眼。", "en": "Then she's gone. But at the corner, I see her glance back once."}}], "values": ["gu"]}, {"id": "ask", "type": "expression", "label": {"zh": "问季白：放映员是做什么的？", "en": "Ask Ji Bai what a projectionist actually does."}, "out": [{"text": {"zh": "让光穿过胶片，一秒二十四格，打到银幕上。观众看见的是动，其实每一格都是停着的。", "en": "I send light through the film, twenty-four frames a second, onto the screen. The audience sees motion, but every single frame is standing still."}}], "effects": [{"set": "flag.joined_club", "to": true}, {"add": "rel.jibai.intimacy", "by": 1}, {"add": "rel.zhiyao.warmth", "by": 1}], "script": [{"op": "show", "who": "jibai", "face": "normal", "at": "right"}, {"op": "say", "who": "jibai", "t": {"zh": "让光穿过胶片，一秒二十四格，打到银幕上。观众看见的是动，其实每一格都是停着的。", "en": "I send light through the film, twenty-four frames a second, onto the screen. The audience sees motion, but every single frame is standing still."}, "face": "normal"}, {"op": "say", "who": "jibai", "t": {"zh": "……抱歉，说多了。", "en": "…Sorry. I talked too much."}, "face": "shy"}, {"op": "say", "who": "zhiyao", "t": {"zh": "她一说起胶片就停不下来。所以——你入不入？", "en": "Once she starts on film she can't stop. So—are you in?"}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "我在表格上写了名字。季白在旁边看着，没说话，嘴角好像动了一下。", "en": "I write my name on the form. Ji Bai watches without a word; the corner of her mouth seems to move."}}], "values": ["ti"]}], "salience": 0, "order": 1, "script": [{"op": "bg", "id": "campus"}, {"op": "say", "who": null, "t": {"zh": "转学到汐川大学的第一天，室友程航就把我拖到了社团招新的广场上。", "en": "On my first day at Xichuan University, my roommate Cheng Hang drags me to the club fair in the square."}}, {"op": "show", "who": "chenghang", "face": "smile", "at": "left"}, {"op": "say", "who": "chenghang", "t": {"zh": "听我的，大三转学生想融入，只有一条路：社团。尤其是女生多的社团。", "en": "Trust me. A third-year transfer has one way to fit in: clubs. Especially clubs with lots of girls."}, "face": "smile"}, {"op": "say", "who": "chenghang", "t": {"zh": "那个摊位就不行了，你看，只有一个人。", "en": "That booth's hopeless, though. Look—one person."}, "face": "normal"}, {"op": "hide", "who": "chenghang"}, {"op": "say", "who": null, "t": {"zh": "最角落的摊位上，摆着一台老式放映机，一张手画的海报：《春季放映会 · 最后一季》。摊位后面坐着的，是昨天那个女孩。", "en": "At the farthest corner booth sit an old film projector and a hand-drawn poster: 'The Spring Screenings · Final Season.' Behind it sits the girl from yesterday."}}, {"op": "show", "who": "zhiyao", "face": "surprised", "at": "center"}, {"op": "say", "who": "zhiyao", "t": {"zh": "啊，陆爷爷的孙子！你也是这个学校的？", "en": "Oh—Grandpa Lu's grandson! You go here too?"}, "face": "surprised"}, {"op": "say", "who": "zhiyao", "t": {"zh": "太好了。听着，电影社再招不到两个人，学期末就要被撤销了。你来，就还差一个。", "en": "Perfect. Listen—if the film club doesn't get two more members, it's dissolved at the end of term. You join, and we're only one short."}, "face": "smile"}, {"op": "show", "who": "jibai", "face": "normal", "at": "right"}, {"op": "say", "who": "jibai", "t": {"zh": "知遥，放映机的片门我调好了。下周六可以用。", "en": "Zhiyao, I've adjusted the projector's gate. It'll be ready next Saturday."}, "face": "normal"}, {"op": "say", "who": "zhiyao", "t": {"zh": "这是季白，研究生，影院的放映员。", "en": "This is Ji Bai, a grad student. She's the cinema's projectionist."}, "face": "normal"}, {"op": "say", "who": "jibai", "t": {"zh": "我不是社员。我是被雇来的。……你好，陆同学。", "en": "I'm not a member. I'm hired help. …Hello, Mr. Lu."}, "face": "normal"}, {"op": "say", "who": null, "t": {"zh": "一个端着托盘的女孩从摊位前走过，停下了。托盘上是几杯外送的咖啡。", "en": "A girl carrying a tray of takeaway coffees passes the booth, and stops."}}, {"op": "hide", "who": "jibai"}, {"op": "show", "who": "shencheng", "face": "normal", "at": "right"}, {"op": "say", "who": "shencheng", "t": {"zh": "……陆远。", "en": "…Lu Yuan."}, "face": "surprised"}, {"op": "say", "who": "shencheng", "t": {"zh": "回来了啊。", "en": "So you're back."}, "face": "normal"}, {"op": "say", "who": "me", "think": true, "t": {"zh": "沈澄。七年没见，她一眼就认出了我。", "en": "Shen Cheng. Seven years, and she recognized me at a glance."}}, {"op": "say", "who": "shencheng", "t": {"zh": "我还要送咖啡。", "en": "I've got coffee to deliver."}, "face": "normal"}, {"op": "hide", "who": "shencheng"}, {"op": "say", "who": "zhiyao", "t": {"zh": "认识的人？……先不管这个。所以，你入不入社？", "en": "Someone you know? …Never mind. So—are you joining or not?"}, "face": "normal"}], "cast": [{"id": "zhiyao"}, {"id": "jibai"}, {"id": "shencheng"}, {"id": "chenghang"}]}, "c1_poster": {"id": "c1_poster", "chapter": "c1", "kind": "side", "title": {"zh": "雨里的海报", "en": "Posters in the Rain"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "傍晚下起了雨。我在校门口看见夏知遥抱着一卷海报，一张一张往公告栏上贴。", "en": "It starts raining in the evening. At the school gate I find Xia Zhiyao with an armful of posters, pasting them onto the notice board one by one."}}], "choices": [{"id": "umbrella", "type": "expression", "label": {"zh": "把伞撑到她头顶。", "en": "Hold your umbrella over her."}, "out": [{"text": {"zh": "……都湿透了还撑伞，你傻不傻。", "en": "…We're already soaked and you open an umbrella. Are you an idiot?"}}], "effects": [{"add": "rel.zhiyao.intimacy", "by": 1}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "……都湿透了还撑伞，你傻不傻。", "en": "…We're already soaked and you open an umbrella. Are you an idiot?"}, "face": "shy"}, {"op": "say", "who": null, "t": {"zh": "她没有躲开。", "en": "She doesn't step away."}}], "values": ["ti"]}, {"id": "promise", "type": "dilemma", "label": {"zh": "“那就让它满一次。我帮你。”", "en": "\"Then let's fill it once. I'll help.\""}, "out": [{"text": {"zh": "说好了啊。说话不算数的人，我会记一辈子的。", "en": "That's a promise. I'll remember anyone who breaks one for the rest of my life."}}], "effects": [{"add": "rel.zhiyao.trust", "by": 1}, {"add": "rel.zhiyao.esteem", "by": 1}], "script": [{"op": "say", "who": "zhiyao", "t": {"zh": "说好了啊。说话不算数的人，我会记一辈子的。", "en": "That's a promise. I'll remember anyone who breaks one for the rest of my life."}, "face": "smile"}], "values": ["yong"]}], "salience": 1, "order": 1, "script": [{"op": "bg", "id": "rain_street"}, {"op": "say", "who": null, "t": {"zh": "傍晚下起了雨。我在校门口看见夏知遥抱着一卷海报，一张一张往公告栏上贴。", "en": "It starts raining in the evening. At the school gate I find Xia Zhiyao with an armful of posters, pasting them onto the notice board one by one."}}, {"op": "show", "who": "zhiyao", "face": "normal", "at": "center"}, {"op": "say", "who": "zhiyao", "t": {"zh": "看什么？来帮忙啊，社员。", "en": "What are you staring at? Come help, member."}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "我们贴完最后一张的时候，两个人都湿透了。", "en": "By the time we've put up the last one, we're both soaked."}}, {"op": "say", "who": "zhiyao", "t": {"zh": "其实我知道，就算招满了人，影院五月还是要拆。", "en": "Honestly, I know it. Even if we fill the club, the cinema still comes down in May."}, "face": "sad"}, {"op": "say", "who": "zhiyao", "t": {"zh": "可是我想在它拆掉之前，让它再满一次。哪怕就一次。", "en": "But before it does, I want to see it full one more time. Even just once."}, "face": "normal"}], "cast": [{"id": "zhiyao"}]}, "c1_cafe": {"id": "c1_cafe", "chapter": "c1", "kind": "side", "title": {"zh": "海边的咖啡馆", "en": "The Seaside Café"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "沈家的咖啡馆还在海堤边上，招牌换了，门口的风铃没换。", "en": "The Shen family café still sits by the seawall. The sign is new; the wind chime by the door isn't."}}], "choices": [{"id": "childhood", "type": "expression", "label": {"zh": "“热可可，多放一块棉花糖。”——小时候每次来都点这个。", "en": "\"Hot cocoa, extra marshmallow.\" The order you always made as a kid."}, "out": [{"text": {"zh": "……嗯。", "en": "…Okay."}}], "effects": [{"add": "rel.shencheng.intimacy", "by": 1}, {"set": "flag.cheng_coffee", "to": true}], "script": [{"op": "say", "who": "shencheng", "t": {"zh": "……嗯。", "en": "…Okay."}, "face": "surprised"}, {"op": "say", "who": null, "t": {"zh": "她转身去做，背对着我站了很久。端上来的时候，杯子里有两块棉花糖。", "en": "She turns to make it and stands with her back to me for a long time. When she brings it over, there are two marshmallows in the cup."}}, {"op": "say", "who": "shencheng", "t": {"zh": "这个你倒是记得。", "en": "That, you remember."}, "face": "sad"}], "values": ["wen"]}, {"id": "ask_why", "type": "dilemma", "label": {"zh": "“你在生我的气？”", "en": "\"Are you angry with me?\""}, "out": [{"text": {"zh": "生气？", "en": "Angry?"}}], "effects": [{"add": "rel.shencheng.trust", "by": 1}, {"add": "rumor", "by": 1}], "script": [{"op": "say", "who": "shencheng", "t": {"zh": "生气？", "en": "Angry?"}, "face": "normal"}, {"op": "say", "who": "shencheng", "t": {"zh": "生气要力气的。七年，早用完了。", "en": "Being angry takes energy. I used it all up years ago."}, "face": "sad"}, {"op": "say", "who": "shencheng", "t": {"zh": "……你连那天也忘了吧。", "en": "…You've forgotten that day too, haven't you."}, "face": "normal"}, {"op": "say", "who": "me", "think": true, "t": {"zh": "那天？哪一天？", "en": "That day? Which day?"}}], "values": ["cheng"]}], "salience": 1, "order": 2, "script": [{"op": "bg", "id": "cafe"}, {"op": "say", "who": null, "t": {"zh": "沈家的咖啡馆还在海堤边上，招牌换了，门口的风铃没换。", "en": "The Shen family café still sits by the seawall. The sign is new; the wind chime by the door isn't."}}, {"op": "show", "who": "shencheng", "face": "normal", "at": "center"}, {"op": "say", "who": "shencheng", "t": {"zh": "……欢迎光临。要点什么？", "en": "…Welcome. What can I get you?"}, "face": "normal"}, {"op": "say", "who": "me", "think": true, "t": {"zh": "她的语气，和对任何一个客人都一样。", "en": "Her tone is the same as with any other customer."}}], "cast": [{"id": "shencheng"}]}, "c1_booth": {"id": "c1_booth", "chapter": "c1", "kind": "side", "title": {"zh": "放映室", "en": "The Projection Booth"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "潮声影院的放映室在银幕对面的小楼上。我推门进去的时候，季白正对着灯，一格一格地看胶片。", "en": "The Tidesound's projection booth is in the little building facing the screen. When I push the door open, Ji Bai is holding film up to the lamp, studying it frame by frame."}}], "choices": [{"id": "look", "type": "dilemma", "label": {"zh": "“能让我看看那盘胶片吗？”", "en": "\"Could I see that reel?\""}, "out": [{"text": {"zh": "……可以看，不可以放。", "en": "…You can look. You can't run it."}}], "effects": [{"set": "flag.saw_reel", "to": true}, {"add": "rel.jibai.trust", "by": 1}, {"add": "rel.jibai.intimacy", "by": 1}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "……可以看，不可以放。", "en": "…You can look. You can't run it."}, "face": "normal"}, {"op": "say", "who": null, "t": {"zh": "那盘胶片很轻，铁盒上有一道划痕，像是有人用指甲刻下的一个数字：7。", "en": "The reel is light. On its tin there is a scratch, as if someone carved a number with a fingernail: 7."}}], "values": ["yong"]}, {"id": "help", "type": "expression", "label": {"zh": "“你在修什么？我能帮忙吗？”", "en": "\"What are you repairing? Can I help?\""}, "out": [{"text": {"zh": "那你帮我拿着这一头。别碰到画面。", "en": "Then hold this end for me. Don't touch the picture."}}], "effects": [{"add": "rel.jibai.warmth", "by": 1}, {"add": "rel.jibai.intimacy", "by": 1}], "script": [{"op": "say", "who": "jibai", "t": {"zh": "那你帮我拿着这一头。别碰到画面。", "en": "Then hold this end for me. Don't touch the picture."}, "face": "smile"}, {"op": "say", "who": null, "t": {"zh": "我们一直修到天黑。她讲每一格的时候，声音比白天轻快很多。", "en": "We work until dark. When she talks about each frame, her voice is far lighter than it was by day."}}], "values": ["ti"]}], "salience": 1, "order": 3, "script": [{"op": "bg", "id": "projection"}, {"op": "say", "who": null, "t": {"zh": "潮声影院的放映室在银幕对面的小楼上。我推门进去的时候，季白正对着灯，一格一格地看胶片。", "en": "The Tidesound's projection booth is in the little building facing the screen. When I push the door open, Ji Bai is holding film up to the lamp, studying it frame by frame."}}, {"op": "show", "who": "jibai", "face": "normal", "at": "center"}, {"op": "say", "who": "jibai", "t": {"zh": "陆同学。墙上那些，是你祖父的字。", "en": "Mr. Lu. The writing on the wall there is your grandfather's."}, "face": "normal"}, {"op": "say", "who": null, "t": {"zh": "墙上贴满了泛黄的便签：哪台机器哪天换过灯泡，哪部片子哪一卷容易断。最下面一张写着：“第七卷，别放。”", "en": "The wall is covered with yellowed notes: which machine had its bulb changed when, which reel of which film tends to snap. The one at the very bottom says: 'Reel seven. Don't run it.'"}}, {"op": "say", "who": "jibai", "t": {"zh": "仓库里确实有一盘没有标签的胶片。我数过，它在第七个架子上。", "en": "There is a reel with no label in the storeroom. I counted. It's on the seventh shelf."}, "face": "normal"}, {"op": "say", "who": "jibai", "t": {"zh": "我一直没放。……因为他说别放。", "en": "I've never run it. …Because he said not to."}, "face": "sad"}], "cast": [{"id": "jibai"}]}, "x_rumor": {"id": "x_rumor", "chapter": "*", "kind": "interrupt", "title": {"zh": "流言", "en": "Rumors"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "兄弟，你出名了。论坛上说转学生一来就到处追女生。", "en": "Buddy, you're famous. The forum says the new transfer has been chasing every girl in sight."}}], "choices": [{"id": "ok", "type": "expression", "label": {"zh": "“……知道了。”", "en": "\"…Got it.\""}, "out": [{"text": {"zh": "这几天，路上遇见的人好像都在看我。", "en": "For days after, everyone I pass seems to be looking at me."}}], "effects": [{"add": "rumor", "by": -2}], "script": [{"op": "say", "who": null, "t": {"zh": "这几天，路上遇见的人好像都在看我。", "en": "For days after, everyone I pass seems to be looking at me."}}]}], "salience": 0, "order": -1, "script": [{"op": "bg", "id": "campus"}, {"op": "show", "who": "chenghang", "face": "surprised", "at": "center"}, {"op": "say", "who": "chenghang", "t": {"zh": "兄弟，你出名了。论坛上说转学生一来就到处追女生。", "en": "Buddy, you're famous. The forum says the new transfer has been chasing every girl in sight."}, "face": "surprised"}, {"op": "say", "who": "chenghang", "t": {"zh": "我的建议是：这两天低调一点。", "en": "My advice: keep your head down for a couple of days."}, "face": "normal"}], "when": {"v": "rumor", "op": ">=", "val": 2}}, "c2_screening": {"id": "c2_screening", "chapter": "c2", "kind": "main", "title": {"zh": "第一场放映", "en": "The First Screening"}, "lock": "free", "canon": {"zh": "原创", "en": "original"}, "intro": [{"text": {"zh": "周六傍晚。潮声影院的铁椅子被我们擦了一下午，还是锈的。", "en": "Saturday evening. We spent the whole afternoon wiping down the Tidesound's iron chairs. They're still rusty."}}], "choices": [{"id": "splice", "type": "dilemma", "label": {"zh": "跑去放映室，帮季白接片。", "en": "Run to the booth and help Ji Bai splice the film."}, "out": [{"text": {"zh": "按住这里。对，别抖。", "en": "Hold it here. Yes. Don't shake."}}], "effects": [{"add": "rel.jibai.intimacy", "by": 1}, {"add": "rel.jibai.esteem", "by": 1}], "script": [{"op": "bg", "id": "projection"}, {"op": "show", "who": "jibai", "face": "normal", "at": "center"}, {"op": "say", "who": "jibai", "t": {"zh": "按住这里。对，别抖。", "en": "Hold it here. Yes. Don't shake."}, "face": "normal"}, {"op": "say", "who": null, "t": {"zh": "她的手很稳。三分钟后，银幕重新亮了起来。", "en": "Her hands are steady. Three minutes later the screen lights up again."}}, {"op": "say", "who": "jibai", "t": {"zh": "……你的手，比我想的稳。", "en": "…Your hands are steadier than I expected."}, "face": "smile"}], "values": ["ti"]}, {"id": "stage", "type": "dilemma", "label": {"zh": "跳上台，陪夏知遥对观众说话救场。", "en": "Jump onto the stage and help Zhiyao keep the audience."}, "out": [{"text": {"zh": "各位，趁换片的时间，我们社长讲讲这部电影的幕后故事。", "en": "Everyone—while we change the reel, o
