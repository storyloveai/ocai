nds still busy."},{"zh":"『你还是老样子，』她说，『话少，眼睛不老实。』","en":"'You haven't changed,' she says. 'Few words, restless eyes.'"},{"zh":"江风吹过来，她把披风往你这边拉了拉。","en":"The river wind blows in. She pulls the edge of her cloak over toward you."}],"threat":[{"zh":"温芷退了一步：『你吓到我了。』她把药箱抱在怀里，没有再说话。","en":"Wen Zhi steps back. 'You're frightening me.' She holds her medicine chest close and says nothing more."},{"zh":"『你走吧。』她说，『今晚别再来了。』","en":"'Go,' she says. 'Don't come back tonight.'"}],"nonsense":[{"zh":"温芷伸手摸了摸你的额头：『没发烧啊。』","en":"Wen Zhi feels your forehead. 'No fever.'"},{"zh":"『又说胡话。』她笑着摇头。","en":"'Talking nonsense again.' She shakes her head, smiling."}]},"openers":{"warm":{"zh":"温芷听见你的脚步声，先笑了：『就知道是你。』","en":"Wen Zhi hears your footsteps and smiles first. 'I knew it was you.'"},"cold":{"zh":"温芷背对着你，手里的活没停：『有事？』","en":"Wen Zhi keeps her back to you, hands busy. 'Yes?'"},"neutral":{"zh":"温芷往旁边挪了挪，没说话。","en":"Wen Zhi shifts over without a word."}}},"zhouyu":{"name":{"zh":"周瑜","en":"Zhou Yu"},"dims":{"warmth":[1,0,10],"trust":[1,0,10],"esteem":[2,0,10]},"main":"esteem","heat":{"rude":[1],"threat":[2],"nonsense":[0,1],"romantic":[0,1],"line":2},"romance":false,"react":{"love":[{"zh":"周瑜挑了挑眉，笑了：『子衡这话，该对小乔说才是。』","en":"Zhou Yu raises an eyebrow and laughs. 'Save that for my wife, Ziheng.'"},{"zh":"『又来？』他按住琴弦，『你们刘家的人，说话都这么不着边际？』","en":"'Again?' He stills the strings. 'Do all of Liu Bei's people talk such nonsense?'"}],"insult":[{"zh":"周瑜的手停在剑柄上：『你再说一句。』","en":"Zhou Yu's hand stops on his sword hilt. 'Say one more word.'"},{"zh":"『看在子敬的面上，我不与你计较。』他的脸色已经白了。","en":"'For Zijing's sake, I'll let that pass.' His face has gone pale."}],"praise":[{"zh":"『过奖。』他嘴上谦，眼里却亮了。","en":"'Too kind.' Modest words, bright eyes."},{"zh":"『这话，你在孔明面前也敢说？』他笑着问。","en":"'Would you dare say that in front of Kongming?' he asks, smiling."}],"ask":[{"zh":"周瑜反问：『你家军师怎么说？』","en":"Zhou Yu answers with a question. 'What does your strategist say?'"},{"zh":"『这是东吴的事。』他淡淡地说，『子衡不必操心。』","en":"'That's Wu's business,' he says coolly. 'No need to trouble yourself.'"}],"small":[{"zh":"周瑜随手拨了一下琴弦，没有说话。","en":"Zhou Yu idly plucks a string and says nothing."},{"zh":"『江上风大。』他说。","en":"'The wind is strong on the river,' he says."},{"zh":"他望着北岸，好一会儿才回过神来。","en":"He gazes at the north bank for a long moment before turning back."}],"threat":[{"zh":"周瑜霍地站起，剑已出鞘半尺：『在我的营里说这种话？』","en":"Zhou Yu is on his feet, his sword half a foot out of its sheath. 'You say that in my camp?'"},{"zh":"帐外的甲士已经掀开了帘子。","en":"The guards outside have already pulled back the tent flap."}],"nonsense":[{"zh":"『有意思。』周瑜看着你，『孔明身边的人，都这样说话？』","en":"'Interesting.' Zhou Yu studies you. 'Does everyone around Kongming talk like this?'"},{"zh":"他摇摇头，接着看他的地图。","en":"He shakes his head and goes back to his map."}]},"persona":{"zh":"周瑜：东吴大都督，三十出头，赤壁的主帅；风流倜傥、精通音律，自负而好胜，最在意的是被诸葛亮压过一头。称玩家“子衡”。","en":"Zhou Yu: Grand Commander of Wu, early thirties, victor of Red Cliffs; elegant, musical, proud and competitive, stung above all by being outdone by Zhuge Liang. Calls the player Ziheng."},"values":{"zhi":["esteem",1],"yong":["esteem",1],"cheng":["trust",1],"li":["trust",-1]}},"lusu":{"name":{"zh":"鲁肃","en":"Lu Su"},"dims":{"warmth":[2,0,10],"trust":[3,0,10],"esteem":[1,0,10]},"main":"trust","heat":{"rude":[1],"threat":[2],"line":4},"romance":false,"react":{"love":[{"zh":"鲁肃愣住，随即连连摆手：『子衡，子衡，这话可不能乱说！』","en":"Lu Su freezes, then waves his hands. 'Ziheng, Ziheng, you can't go around saying that!'"},{"zh":"『你们刘家的人啊……』他叹了口气，倒也没生气。","en":"'You Liu people…' He sighs, but isn't angry."}],"insult":[{"zh":"鲁肃的脸红了：『肃一片好心，先生何必如此？』","en":"Lu Su flushes. 'I mean well, sir. Why talk to me like that?'"},{"zh":"他闷闷地喝了一口茶，不再说话。","en":"He takes a sullen sip of tea and stops talking."}],"praise":[{"zh":"『不敢当，不敢当。』鲁肃笑得很老实。","en":"'Not at all, not at all.' Lu Su's smile is plain and honest."},{"zh":"『先生要是在吴侯面前也这么说就好了。』","en":"'If only you'd say that in front of the Marquis.'"}],"ask":[{"zh":"鲁肃想了想：『这件事，肃也做不得主。』","en":"Lu Su thinks it over. 'That isn't mine to decide.'"},{"zh":"『先生问到点子上了。』他苦笑，『肃也想知道。』","en":"'You've put your finger on it.' He smiles ruefully. 'I'd like to know too.'"}],"small":[{"zh":"鲁肃点点头，又叹了口气。","en":"Lu Su nods, then sighs again."},{"zh":"『荆州的事，难办啊。』他自言自语。","en":"'This Jingzhou business,' he mutters. 'It's hard.'"},{"zh":"他给你添了茶。","en":"He tops up your tea."}],"threat":[{"zh":"鲁肃脸色发白：『先生……这是要两家翻脸吗？』","en":"Lu Su goes pale. 'Sir… do you want our two houses at war?'"},{"zh":"他站起身，一句话也没说就走了。","en":"He stands and leaves without a word."}],"nonsense":[{"zh":"鲁肃眨了眨眼，似乎在想这是不是什么暗语。","en":"Lu Su blinks, apparently wondering whether it's some kind of code."},{"zh":"『先生累了。』他宽厚地说。","en":"'You're tired, sir,' he says kindly."}]},"persona":{"zh":"鲁肃：东吴重臣，忠厚、稳重，一心维系孙刘联盟，常被夹在周瑜和诸葛亮中间；说话诚恳，偶尔叫苦。称玩家“子衡”。","en":"Lu Su: senior minister of Wu, honest and steady, devoted to keeping the Sun–Liu alliance alive, forever caught between Zhou Yu and Zhuge Liang; earnest, sometimes exasperated. Calls the player Ziheng."},"values":{"cheng":["trust",1],"yi":["trust",1],"li":["trust",-1]}},"zhaoyun":{"name":{"zh":"赵云","en":"Zhao Yun"},"dims":{"warmth":[2,0,10],"trust":[3,0,10],"esteem":[1,0,10]},"main":"trust","heat":{"rude":[1],"threat":[2],"romantic":[0,1],"line":3},"romance":false,"react":{"love":[{"zh":"赵云的脸一下子红了，抱拳道：『先生说笑了。』","en":"Zhao Yun turns red and clasps his hands. 'You jest, sir.'"},{"zh":"『子衡先生，』他认真地说，『这种话，不该对子龙说。』","en":"'Master Ziheng,' he says gravely, 'that isn't something to say to me.'"}],"insult":[{"zh":"赵云的眉头动了一下，没有回嘴。","en":"Zhao Yun's brows twitch, but he doesn't answer back."},{"zh":"『先生若对子龙不满，请直说是哪件事。』","en":"'If you have a complaint against me, sir, tell me what it is.'"}],"praise":[{"zh":"『分内之事。』赵云说。","en":"'Only my duty,' says Zhao Yun."},{"zh":"他抱了抱拳，没有多说。","en":"He clasps his hands and says no more."}],"ask":[{"zh":"赵云想了想：『这要看主公的意思。』","en":"Zhao Yun considers. 'That depends on our lord.'"},{"zh":"『子龙只管打仗，这些事，先生比我懂。』","en":"'I only fight. You understand these things better than I do, sir.'"}],"small":[{"zh":"赵云在擦枪，嗯了一声。","en":"Zhao Yun is cleaning his spear. He grunts."},{"zh":"『明日卯时出发。』他提醒你。","en":"'We leave at dawn,' he reminds you."},{"zh":"他给马添了一把草料。","en":"He gives his horse another handful of feed."}],"threat":[{"zh":"赵云握住了枪杆，看着你，一动不动。","en":"Zhao Yun's hand closes on his spear. He looks at you and doesn't move."},{"zh":"『先生喝多了。子龙送你回去。』","en":"'You've had too much, sir. Let me see you back.'"}],"nonsense":[{"zh":"赵云困惑地看着你。","en":"Zhao Yun looks at you, puzzled."},{"zh":"『先生说的，子龙听不懂。』","en":"'I don't follow you, sir.'"}]},"persona":{"zh":"赵云：刘备帐下大将，长坂坡单骑救主；沉稳、谨慎、守礼，话不多，做事一丝不苟。称玩家“子衡先生”。","en":"Zhao Yun: Liu Bei's general who rode alone through Changban to save the heir; calm, careful, correct, says little and does everything properly. Calls the player Master Ziheng."},"openers":{"warm":{"zh":"赵云起身让座：『先生来了。』","en":"Zhao Yun rises and offers you a seat. 'Sir.'"},"cold":{"zh":"赵云抬头看了你一眼，手里的枪没放下。","en":"Zhao Yun glances up and doesn't put down his spear."},"neutral":{"zh":"赵云点点头，往火堆里添了一根柴。","en":"Zhao Yun nods and adds a stick to the fire."}},"values":{"yi":["trust",1],"yong":["esteem",1],"ren":["warmth",1],"li":["esteem",-1]}},"sunfuren":{"name":{"zh":"孙夫人","en":"Lady Sun"},"dims":{"warmth":[0,0,10],"trust":[1,0,10],"esteem":[0,0,10]},"main":"warmth","from_chapter":"c3","heat":{"rude":[1],"threat":[2],"romantic":[1],"nonsense":[0,1],"line":2},"romance":false,"react":{"love":[{"zh":"孙夫人的刀尖抬了起来：『你知道我是谁的夫人？』","en":"Lady Sun's blade lifts. 'Do you know whose wife I am?'"},{"zh":"『再说一遍，』她冷冷地说，『我就让侍婢把你扔出去。』","en":"'Say it again,' she says coldly, 'and my maids will throw you out.'"}],"insult":[{"zh":"孙夫人笑了，笑得很冷：『好大的胆子。』","en":"Lady Sun laughs, very coldly. 'You have nerve.'"},{"zh":"她拔出了腰间的短刀，放在案上。","en":"She draws the short blade at her waist and lays it on the table."}],"praise":[{"zh":"『少拿好话哄我。』她嘴上这么说，神色却缓了。","en":"'Don't flatter me.' But her face softens."},{"zh":"『你们荆州人，就这句话说得像样。』","en":"'That's the first decent thing anyone from Jingzhou has said.'"}],"ask":[{"zh":"孙夫人反问：『你为什么想知道？』","en":"Lady Sun asks back. 'Why do you want to know?'"},{"zh":"『这是我的事。』她说。","en":"'That's my business,' she says."}],"small":[{"zh":"孙夫人在擦一把弓，没理你。","en":"Lady Sun is polishing a bow and ignores you."},{"zh":"『江东的弓，比荆州的好。』她说。","en":"'Wu bows are better than Jingzhou bows,' she says."},{"zh":"侍婢们佩着刀，站在她身后。","en":"Her maids stand behind her, swords at their hips."}],"threat":[{"zh":"孙夫人一扬手，侍婢的刀已经出鞘：『在我面前说这种话？』","en":"Lady Sun raises a hand and her maids' swords are out. 'You dare, in front of me?'"},{"zh":"『滚出去。』","en":"'Get out.'"}],"nonsense":[{"zh":"孙夫人皱眉：『你是来说书的？』","en":"Lady Sun frowns. 'Are you a storyteller now?'"},{"zh":"她挥了挥手，让侍婢送客。","en":"She waves for her maids to see you out."}]},"persona":{"zh":"孙夫人：孙权之妹，嫁给刘备；性情刚烈、好武，房中摆满兵器，侍婢都佩刀；骄傲，最恨被人当作棋子。成年人。称玩家“子衡”。","en":"Lady Sun: Sun Quan's sister, married to Liu Bei; fierce and martial, her rooms full of weapons and her maids armed; proud, and hates being treated as a pawn. An adult. Calls the player Ziheng."},"values":{"yong":["esteem",1],"cheng":["trust",1],"li":["warmth",-1]}},"pangtong":{"name":{"zh":"庞统","en":"Pang Tong"},"dims":{"warmth":[1,0,10],"trust":[1,0,10],"esteem":[1,0,10]},"main":"esteem","heat":{"rude":[0,1],"threat":[1],"line":4},"romance":false,"react":{"love":[{"zh":"庞统大笑，笑得酒都洒了：『好！这句我记下了，等我死了刻在碑上。』","en":"Pang Tong roars with laughter and spills his wine. 'Good! I'll have that carved on my tombstone.'"},{"zh":"『子衡，你醉了，还是我醉了？』","en":"'Ziheng, are you drunk, or am I?'"}],"insult":[{"zh":"庞统眯起眼：『骂得好，再骂一句我听听。』","en":"Pang Tong narrows his eyes. 'Nicely said. Go on, give me another.'"},{"zh":"『我这张脸挨骂惯了。』他慢慢地说，『可我不惯被自己人骂。』","en":"'This face is used to insults,' he says slowly. 'But not from my own side.'"}],"praise":[{"zh":"『夸我的人少，你算一个。』他给你满上。","en":"'Few people praise me. You're one.' He fills your cup."},{"zh":"庞统摸着下巴：『这话，你该当着孔明说。』","en":"Pang Tong strokes his chin. 'You should say that in front of Kongming.'"}],"ask":[{"zh":"庞统反问：『你自己怎么看？』","en":"Pang Tong asks back. 'What do you think?'"},{"zh":"『问得好，』他说，『可惜我也不知道。』","en":"'Good question,' he says. 'Pity I don't know either.'"}],"small":[{"zh":"庞统往嘴里倒了一口酒。","en":"Pang Tong tips back a mouthful of wine."},{"zh":"『西川的酒，听说比荆州的好。』他说。","en":"'They say the wine in the west is better than Jingzhou's,' he says."},{"zh":"他望着灯花，不知在想什么。","en":"He watches the lamp, thinking about something."}],"threat":[{"zh":"庞统一点也不怕：『要动手就快些，我还要喝酒。』","en":"Pang Tong isn't the least afraid. 'If you're going to do it, be quick. I want my wine.'"},{"zh":"他把酒囊收了起来：『今夜到此为止。』","en":"He puts the wine skin away. 'That's enough for tonight.'"}],"nonsense":[{"zh":"庞统哈哈一笑：『这话比我的长相还古怪。』","en":"Pang Tong laughs. 'That's even stranger than my face.'"},{"zh":"『你这是在打什么哑谜？』","en":"'What riddle is this?'"}]},"persona":{"zh":"庞统：道号凤雏，与诸葛亮齐名；相貌古怪，放旷不羁，好酒，嘴上刻薄，心里比谁都急着建功。称玩家“子衡”。","en":"Pang Tong, the Young Phoenix, as famous as Zhuge Liang; odd-looking, unconventional, fond of wine, sharp-tongued, and more eager than anyone to prove himself. Calls the player Ziheng."},"openers":{"warm":{"zh":"庞统举起酒囊：『来得正好，一个人喝没意思。』","en":"Pang Tong raises a wine skin. 'Just in time. Drinking alone is dull.'"},"cold":{"zh":"庞统没抬头：『有事说事。』","en":"Pang Tong doesn't look up. 'Say what you came to say.'"},"neutral":{"zh":"庞统朝对面的席位努了努嘴。","en":"Pang Tong jerks his chin at the seat opposite."}},"values":{"zhi":["esteem",1],"yong":["warmth",1]}},"zhangsong":{"name":{"zh":"张松","en":"Zhang Song"},"dims":{"warmth":[0,0,10],"trust":[0,0,10],"esteem":[0,0,10]},"main":"esteem","from_chapter":"c5","heat":{"rude":[2],"threat":[2],"nonsense":[0,1],"line":2},"romance":false,"react":{"love":[{"zh":"张松瞪着你，过了好一会儿才说：『先生……这是在取笑松？』","en":"Zhang Song stares at you a long time. 'Sir… are you making fun of me?'"},{"zh":"『松长成这样，还没人对我说过这种话。』他冷笑。","en":"'Looking the way I do, no one's ever said that to me.' He sneers."}],"insult":[{"zh":"张松的脸一下子沉了：『曹操也这么看我。你们刘家，和曹家一样？』","en":"Zhang Song's face falls. 'Cao Cao looked at me like that too. Is Liu Bei's house no different?'"},{"zh":"他站起身，袖子一甩。","en":"He stands and flicks his sleeve."}],"praise":[{"zh":"『先生过誉。』张松的嘴角翘了起来。","en":"'You praise me too much, sir.' The corners of his mouth turn up."},{"zh":"『这话，比曹操那里的好听多了。』","en":"'Much nicer than what I heard at Cao Cao's court.'"}],"ask":[{"zh":"张松想了想：『先生想知道西川的什么？』","en":"Zhang Song thinks. 'What do you want to know about the west, sir?'"},{"zh":"『这个，松一时说不清。』他打了个哈哈。","en":"'I couldn't say offhand.' He laughs it off."}],"small":[{"zh":"张松打量着屋里的陈设，没有说话。","en":"Zhang Song looks over the furnishings and says nothing."},{"zh":"『荆州的茶不错。』他说。","en":"'The tea in Jingzhou is good,' he says."},{"zh":"他从袖子里摸了摸什么，又放了回去。","en":"He feels for something in his sleeve, then lets it be."}],"threat":[{"zh":"张松吓得往后一缩，随即又挺直了腰：『松虽矮小，不怕死。』","en":"Zhang Song flinches, then straightens. 'I may be small, but I'm not afraid to die.'"},{"zh":"『原来刘皇叔的人是这样待客的。』","en":"'So this is how Lord Liu's people treat a guest.'"}],"nonsense":[{"zh":"张松眨眨眼：『先生是在考松？』","en":"Zhang Song blinks. 'Is this a test, sir?'"},{"zh":"他认真地想了半天，最后摇了摇头。","en":"He thinks hard about it, then shakes his head."}]},"persona":{"zh":"张松：益州别驾，相貌丑陋、身材矮小，却过目不忘、口才极好；自尊心极强，最记恨被人轻视。称玩家“子衡先生”。","en":"Zhang Song: Lieutenant of Yi province; ugly and tiny, with a perfect memory and a quick tongue; fiercely proud, and never forgets a slight. Calls the player Master Ziheng."},"values":{"zhi":["esteem",1],"ren":["warmth",1]}}},"dims":{"warmth":{"zh":"交情","en":"Friendship"},"trust":{"zh":"信任","en":"Trust"},"esteem":{"zh":"看重","en":"Esteem"},"intimacy":{"zh":"亲近","en":"Closeness"}},"echoes":{"e_nanjun":{"zh":"你劝刘备抢在周瑜之前取了南郡","en":"You got Liu Bei into Nanjun ahead of Zhou Yu"},"e_yield":{"zh":"你劝刘备把南郡让给了周瑜","en":"You had Liu Bei leave Nanjun to Zhou Yu"},"e_warned_zy":{"zh":"你提醒过周瑜曹仁诈败","en":"You warned Zhou Yu about Cao Ren's feint"},"e_wz_zhou":{"zh":"温芷替周瑜治过箭伤","en":"Wen Zhi treated Zhou Yu's wound"},"e_lusu":{"zh":"你和鲁肃立过归还荆州的约","en":"You signed a promise with Lu Su to return Jingzhou"},"e_weiyan":{"zh":"你在长沙替魏延求过情","en":"You pleaded for Wei Yan at Changsha"},"e_zy":{"zh":"你支持赵云拒了桂阳的婚事","en":"You backed Zhao Yun in refusing the Guiyang marriage"},"e_ganlu":{"zh":"你在甘露寺当众揭破了伏兵","en":"You exposed the ambush at Ganlu Temple"},"e_rear":{"zh":"你在江边替主公断后","en":"You held the rear on the riverbank"},"e_left_sun":{"zh":"逃离东吴时，你撇下了孙夫人","en":"You left Lady Sun behind in the escape"},"e_pt":{"zh":"你在柴桑结识了庞统","en":"You met Pang Tong at Chaisang"},"e_pt_vouch":{"zh":"你在耒阳替庞统作保","en":"You vouched for Pang Tong at Leiyang"},"e_zs":{"zh":"你以礼相待张松","en":"You treated Zhang Song with courtesy"},"e_adou":{"zh":"你随赵云截江夺回了阿斗","en":"You took A Dou back on the river with Zhao Yun"},"e_wz_road":{"zh":"你和温芷定下了去留","en":"You and Wen Zhi decided where she would go"},"e_luofeng":{"zh":"你在落凤坡改变了庞统的命","en":"You changed Pang Tong's fate at Fallen Phoenix Slope"},"e_liuqi":{"zh":"你以刘琦之名推托了鲁肃","en":"You put Lu Su off in Liu Qi's name"},"e_tongque":{"zh":"你在铜雀台上作了一篇文章","en":"You wrote a piece on the Bronze Bird Terrace"},"e_zy_lives":{"zh":"你和温芷守住了周瑜的命","en":"You and Wen Zhi kept Zhou Yu alive"},"e_cloak":{"zh":"你在潼关把外袍扔给了曹操","en":"You threw Cao Cao your cloak at Tongguan"},"e_defect":{"zh":"你随张松离开了曹营","en":"You left Cao with Zhang Song"},"e_cao_stay":{"zh":"赤壁之后你仍留在曹营","en":"You stayed with Cao after Red Cliffs"}},"debts":{"d_base":{"title":{"zh":"立足之地","en":"A place to stand"},"lock":"functional","broken":{"zh":"南郡让给了周瑜，刘备没有自己的城。","en":"With Nanjun left to Zhou Yu, Liu Bei has no city of his own."},"function":{"zh":"刘备据有荆州，才有后来的入川","en":"Liu Bei holding Jingzhou, which makes the move west possible"}},"d_zhouyu":{"title":{"zh":"周瑜之死","en":"Zhou Yu's death"},"lock":"functional","broken":{"zh":"周瑜没有死，东吴的兵权不会落到鲁肃手里。","en":"Zhou Yu lives, so command in Wu doesn't pass to Lu Su."},"function":{"zh":"鲁肃主事，孙刘联盟得以维持","en":"Lu Su in command, keeping the alliance alive"}},"d_phoenix":{"title":{"zh":"凤雏","en":"The Young Phoenix"},"lock":"functional","broken":{"zh":"庞统没有死，诸葛亮就没有入川的理由。","en":"Pang Tong lives, so Zhuge Liang has no reason to come west."},"function":{"zh":"诸葛亮入川，关羽独守荆州","en":"Zhuge Liang comes west, leaving Guan Yu alone in Jingzhou"}}},"chapters":[{"id":"c1","title":{"zh":"南郡","en":"Nanjun"},"year":{"zh":"建安十三年（208）","en":"Jian'an 13 (208)"},"canon":{"zh":"第51–52回","en":"Ch. 51–52"},"offer":2,"intro":[{"text":{"zh":"赤壁的火灭了。曹操北还，留曹仁守南郡。周瑜要取南郡，刘备也想要。两家的盟约，从这一天起就开始算账了。","en":"The fire at Red Cliffs has burned out. Cao Cao has gone north, leaving Cao Ren to hold Nanjun. Zhou Yu wants Nanjun. So does Liu Bei. From this day on, the alliance starts keeping accounts."},"when":{"v":"track","op":"!=","val":"cao"}},{"text":{"zh":"赤壁的火灭了。你随曹操北还许都。一路上没有人说话。","en":"The fire at Red Cliffs has burned out. You go north with Cao Cao. No one speaks on the road."},"when":{"v":"track","op":"==","val":"cao"}}]},{"id":"c2","title":{"zh":"四郡","en":"The Four Commanderies"},"year":{"zh":"建安十四年（209）","en":"Jian'an 14 (209)"},"canon":{"zh":"第52–53回","en":"Ch. 52–53"},"offer":2,"intro":[{"text":{"zh":"荆州南边还有四郡：武陵、长沙、桂阳、零陵。谁先拿下，荆州就算谁的。","en":"South of Jingzhou lie four commanderies: Wuling, Changsha, Guiyang and Lingling. Whoever takes them holds Jingzhou."},"when":{"v":"track","op":"!=","val":"cao"}},{"text":{"zh":"许都。曹操在邺城起铜雀台，一年里都在议论南方。你也被问过好几回。","en":"Xuchang. Cao Cao is building the Bronze Bird Terrace at Ye, and all year the talk is of the south. You are asked about it more than once."},"when":{"v":"track","op":"==","val":"cao"}}]},{"id":"c3","title":{"zh":"甘露寺","en":"Ganlu Temple"},"year":{"zh":"建安十四年（209）","en":"Jian'an 14 (209)"},"canon":{"zh":"第54–55回","en":"Ch. 54–55"},"offer":2,"intro":[{"text":{"zh":"刘琦病故，甘夫人也去世了。江东来人，说吴侯有个妹妹，愿与皇叔结亲。诸葛亮笑了，赵云皱了眉。","en":"Liu Qi has died, and so has Lady Gan. Envoys come from the east: the Marquis of Wu has a sister, and would join the houses by marriage. Zhuge Liang smiles. Zhao Yun frowns."},"when":{"all":[{"v":"track","op":"!=","val":"cao"},{"v":"flag.mi_saved","op":"!=","val":true}]}},{"text":{"zh":"刘琦病故，甘夫人也去世了。糜夫人还在——你在长坂坡救下的那位。江东的说辞于是变了：不是续弦，是两家结亲，永为唇齿。诸葛亮笑了，赵云皱了眉。","en":"Liu Qi has died, and so has Lady Gan. Lady Mi is still alive—the woman you saved at Changban. So the east changes its words: not a second wife but a union of houses, lips and teeth forever. Zhuge Liang smiles. Zhao Yun frowns."},"when":{"all":[{"v":"track","op":"!=","val":"cao"},{"v":"flag.mi_saved","op":"==","val":true}]}},{"text":{"zh":"消息传到许都：刘备要娶孙权的妹妹。曹操听了，把笔一扔。","en":"News reaches Xuchang: Liu Bei is to marry Sun Quan's sister. Cao Cao throws down his brush."},"when":{"v":"track","op":"==","val":"cao"}}]},{"id":"c4","title":{"zh":"柴桑","en":"Chaisang"},"year":{"zh":"建安十五年（210）","en":"Jian'an 15 (210)"},"canon":{"zh":"第56–57回","en":"Ch. 56–57"},"offer":2,"intro":[{"text":{"zh":"周瑜的箭伤一直没好。他又想出一计：借道荆州去取西川，路过时顺手收了荆州。","en":"Zhou Yu's arrow wound has never healed. He has a new plan: march through Jingzhou to take the west, and take Jingzhou on the way."},"when":{"v":"track","op":"!=","val":"cao"}},{"text":{"zh":"铜雀台落成。曹操大宴文武，要诸将比箭，文官作赋。","en":"The Bronze Bird Terrace is finished. Cao Cao feasts his officers: the generals will shoot for a prize, the scholars write verses."},"when":{"v":"track","op":"==","val":"cao"}}]},{"id":"c5","title":{"zh":"西川来客","en":"A Visitor from the West"},"year":{"zh":"建安十六年（211）","en":"Jian'an 16 (211)"},"canon":{"zh":"第58–60回","en":"Ch. 58–60"},"offer":2,"intro":[{"text":{"zh":"西凉马超起兵，曹操亲征潼关。同一年，益州别驾张松带着一张图出了蜀道。他先去了许都。","en":"Ma Chao rises in the west and Cao Cao marches to Tongguan. That same year, Zhang Song, Lieutenant of Yi province, comes out of the Shu roads with a map. He goes to Xuchang first."}}]},{"id":"c6","title":{"zh":"截江","en":"On the River"},"year":{"zh":"建安十七年（212）","en":"Jian'an 17 (212)"},"canon":{"zh":"第61回","en":"Ch. 61"},"offer":2,"intro":[{"text":{"zh":"刘璋请刘备入川拒张鲁。刘备带庞统、黄忠、魏延西去，诸葛亮、关羽、张飞、赵云留守荆州。江东看准了这个空子。","en":"Liu Zhang invites Liu Bei west to hold off Zhang Lu. Liu Bei goes with Pang Tong, Huang Zhong and Wei Yan; Zhuge Liang, Guan Yu, Zhang Fei and Zhao Yun hold Jingzhou. Wu sees its chance."}}]},{"id":"c7","title":{"zh":"落凤坡","en":"Fallen Phoenix Slope"},"year":{"zh":"建安十八年（213）","en":"Jian'an 18 (213)"},"canon":{"zh":"第62–63回","en":"Ch. 62–63"},"offer":2,"intro":[{"text":{"zh":"刘备和刘璋翻了脸。张松事泄被杀。大军直逼雒城，城外有两条路。","en":"Liu Bei and Liu Zhang have fallen out. Zhang Song's plot was discovered and he has been executed. The army closes on Luocheng, and there are two roads to it."}}]},{"id":"c8","title":{"zh":"益州","en":"Yi Province"},"year":{"zh":"建安十九年（214）","en":"Jian'an 19 (214)"},"canon":{"zh":"第63–65回","en":"Ch. 63–65"},"offer":2,"intro":[{"text":{"zh":"雒城破了。张飞在巴郡义释严颜，马超在葭萌关归降。成都城下，刘璋的使者出城来了。","en":"Luocheng has fallen. Zhang Fei spared Yan Yan at Ba commandery; Ma Chao has submitted at Jiameng Pass. Under the walls of Chengdu, Liu Zhang's envoy rides out."}}]}],"nodes":{"x_return":{"id":"x_return","chapter":"*","kind":"interrupt","title":{"zh":"归来","en":"Coming Back"},"lock":"free","canon":{"zh":"原创","en":"original"},"intro":[{"text":{"zh":"你离开之后，听说了赤壁的火，也听说了华容道。有人说你是妖人，有人说你早死了。","en":"After you left, you heard about the fire at Red Cliffs, and about Huarong. Some say you're a sorcerer; some say you're long dead."},"when":{"v":"flag.exposed","op":"==","val":true}},{"text":{"zh":"荆州那趟出使，你没有死。你在江夏、在长沙、在不知名的渡口之间流落了一年。","en":"You didn't die on that mission to Jingzhou. You drifted for a year—Jiangxia, Changsha, ferries with no names."},"when":{"v":"flag.mi_heng","op":"==","val":true}},{"text":{"zh":"离开之后，你在江湖上走了一年。","en":"After you left, you spent a year on the roads."},"when":{"all":[{"v":"flag.exposed","op":"!=","val":true},{"v":"flag.mi_heng","op":"!=","val":true}]}},{"text":{"zh":"一天，鲁肃的船停在你借住的渔村。他认出了你：『孔明说，你若还活着，就该回来。』","en":"One day Lu Su's boat stops at the fishing village where you're lodging. He recognizes you. 'Kongming says that if you're still alive, you should come back.'"}}],"choices":[{"id":"back","type":"dilemma","label":{"zh":"跟鲁肃上船。","en":"Get on Lu Su's boat."},"out":[{"text":{"zh":"刘备见到你，愣了很久，只说了一句：『回来就好。』诸葛亮在旁边，什么也没问。","en":"When Liu Bei sees you he is still for a long time, then says only, 'You're back. Good.' Zhuge Liang, beside him, asks nothing."}}],"effects":[{"set":"flag.came_back","to":true},{"set":"track","to":"liu"},{"add":"rel.lusu.trust","by":1},{"add":"rel.liubei.trust","by":-1}]},{"id":"hermit","type":"expression","label":{"zh":"谢过鲁肃，留在渔村。","en":"Thank Lu Su and stay in the village."},"out":[{"text":{"zh":"鲁肃叹了口气，留下一袋钱，开船走了。你在江边看着他的帆，直到看不见。","en":"Lu Su sighs, leaves you a purse, and sails. You watch his sail from the bank until it's gone."}}],"effects":[{"set":"flag.v2_hermit","to":true}],"ends":true}],"salience":0,"order":-2,"when":{"v":"prev.ended_early","op":"==","val":true},"art":{"scene":"riverbank","layers":[]},"cast":[{"id":"lusu"}]},"x_north":{"id":"x_north","chapter":"*","kind":"interrupt","title":{"zh":"北还","en":"Going North"},"lock":"free","canon":{"zh":"原创","en":"original"},"intro":[{"text":{"zh":"赤壁之后，曹操回到许都，第一件事是问你：『孤败在哪里？』你说了。他听完，很久没有说话。","en":"Back in Xuchang after Red Cliffs, the first thing Cao Cao does is ask you, 'Where did I lose?' You tell him. He listens, and says nothing for a long time."}},{"text":{"zh":"那天夜里，有人从窗缝里塞进一封信，没有署名，字是鲁肃的：『孔明问你，可愿南归。』","en":"That night someone slides a letter through your shutters. Unsigned, but the hand is Lu Su's: 'Kongming asks whether you will come south.'"}}],"choices":[{"id":"south","type":"dilemma","label":{"zh":"连夜南下。","en":"Go south that night."},"out":[{"text":{"zh":"你从许都一路逃到江边，搭上了东吴的船。刘备见你回来，没有提曹营的事。可你知道，有人提了。","en":"You run from Xuchang to the river and get aboard a Wu boat. Liu Bei says nothing about your time with Cao when you come back. But you know others do."}}],"effects":[{"set":"flag.v2_returned","to":true},{"set":"track","to":"liu"},{"add":"rel.caocao.esteem","by":-3},{"add":"rel.liubei.trust","by":-1},{"add":"rel.zhuge.trust","by":-1}],"values":["yi"]},{"id":"stay","type":"dilemma","label":{"zh":"把信烧了。","en":"Burn the letter."},"out":[{"text":{"zh":"第二天，曹操让你随他去邺城看铜雀台的地基。他什么都知道，什么也没说。","en":"The next day Cao Cao takes you to Ye to see the foundations of the Bronze Bird Terrace. He knows everything, and says nothing."}}],"effects":[{"set":"flag.cao_stay","to":true},{"add":"rel.caocao.esteem","by":1}],"echo":["e_cao_stay"],"values":["li"]}],"salience":0,"order":-1,"when":{"all":[{"v":"track","op":"==","val":"cao"},{"v":"prev.ended_early","op":"!=","val":true}]},"art":{"scene":"letter","layers":[]},"cast":[{"id":"caocao"}]},"c1_wound":{"id":"c1_wound","chapter":"c1","kind":"side","title":{"zh":"箭伤","en":"The Arrow Wound"},"lock":"free","canon":{"zh":"原创人物","en":"original character"},"intro":[{"text":{"zh":"周瑜攻南郡时中了一箭，箭上有毒。东吴的军医束手无策，有人想起了刘备营里那位颍川女医。鲁肃亲自来请温芷。","en":"Zhou Yu took an arrow attacking Nanjun, and the arrow was poisoned. Wu's army doctors are at a loss, and someone remembers the woman physician from Yingchuan in Liu Bei's camp. Lu Su comes himself to ask for Wen Zhi."}}],"choices":[{"id":"let","type":"dilemma","label":{"zh":"让她去。医者不问来人是哪一边的。","en":"Let her go. A physician doesn't ask which side the patient is on."},"out":[{"text":{"zh":"温芷在周瑜帐里守了三夜。回来时她说：『箭毒拔了。可这伤最怕气，他偏偏是个爱生气的人。』","en":"Wen Zhi sits three nights in Zhou Yu's tent. When she comes back she says, 'I drew the poison. But this wound can't bear anger, and he's a man who angers easily.'"}}],"effects":[{"set":"flag.wz_treated_zhou","to":true},{"add":"rel.wenzhi.trust","by":1},{"add":"rel.zhouyu.trust","by":2},{"add":"rel.lusu.trust","by":1}],"echo":["e_wz_zhou"],"values":["ren"]},{"id":"spy","type":"strategy","label":{"zh":"让她去，回来把周瑜的伤势一五一十告诉你。","en":"Let her go, and have her tell you everything about his condition."},"out":[{"text":{"zh":"温芷看了你很久：『你要我做的，到底是大夫，还是探子？』她还是去了，回来也还是说了。只是那几天，她没再跟你多说一句话。","en":"Wen Zhi looks at you a long time. 'Do you want a physician or a spy?' She goes anyway, and comes back and tells you. But for days after, she says nothing more to you than she must."}}],"effects":[{"set":"flag.wz_spied_zhou","to":true},{"add":"rel.wenzhi.trust","by":-2},{"add":"rel.wenzhi.intimacy","by":-1},{"add":"renown.cunning","by":1}],"echo":["e_wz_zhou"],"values":["li"]},{"id":"refuse","type":"expression","label":{"zh":"不让她去：周瑜的营里，太险。","en":"Refuse: Zhou Yu's camp is too dangerous."},"out":[{"text":{"zh":"鲁肃失望地走了。温芷没有争，只是把药箱收了起来。","en":"Lu Su leaves disappointed. Wen Zhi doesn't argue. She just puts her medicine chest away."}}],"effects":[{"add":"rel.lusu.trust","by":-1}]}],"salience":3,"order":1,"when":{"all":[{"v":"track","op":"!=","val":"cao"},{"v":"flag.wenzhi_with_you","op":"==","val":true}]},"art":{"scene":"herbs","layers":[{"id":"two"}]},"place":"jiangling","cast":[{"id":"wenzhi"},{"id":"lusu"}]},"c1_lusu":{"id":"c1_lusu","chapter":"c1","kind":"side","title":{"zh":"讨荆州","en":"Lu Su Comes for Jingzhou"},"lock":"functional","canon":{"zh":"第52回","en":"Ch. 52"},"intro":[{"text":{"zh":"鲁肃来了。他说，曹兵是东吴打退的，荆州理当归东吴。诸葛亮看了你一眼，示意你先开口。","en":"Lu Su has come. Wu drove Cao's army off, he says, so Jingzhou rightly belongs to Wu. Zhuge Liang glances at you: you speak first."}}],"choices":[{"id":"liuqi","type":"strategy","label":{"zh":"搬出刘琦：荆州是刘表的基业，自然归他的儿子。","en":"Bring up Liu Qi: Jingzhou was Liu Biao's, so it goes to his son."},"out":[{"text":{"zh":"鲁肃无话可说：『那……若公子不在了呢？』诸葛亮笑道：『那时再议。』鲁肃走时，脸色很难看。","en":"Lu Su has no answer. 'And… if the young lord should pass?' Zhuge Liang smiles. 'Then we'll talk again.' Lu Su leaves looking grim."}}],"effects":[{"set":"flag.liuqi_pretext","to":true},{"add":"rel.zhuge.esteem","by":1},{"add":"rel.lusu.trust","by":-1},{"add":"renown.cunning","by":1}],"echo":["e_liuqi"],"values":["zhi"]},{"id":"pledge","type":"dilemma","label":{"zh":"立个约：等主公有了别的地盘，荆州归还东吴。","en":"Sign a promise: when our lord has other land, Jingzhou goes back to Wu."},"out":[{"text":{"zh":"鲁肃松了一口气，郑重地收起了那张纸。诸葛亮没有拦你，只是事后说：『子衡兄，这张纸，以后会有人拿来的。』","en":"Lu Su breathes out and puts the paper away with care. Zhuge Liang doesn't stop you, but says afterward, 'Ziheng, someone will bring that paper back one day.'"}}],"effects":[{"set":"flag.promised_return","to":true},{"add":"rel.lusu.trust","by":2},{"add":"rel.liubei.trust","by":1},{"add":"renown.loyal","by":1}],"echo":["e_lusu"],"values":["cheng","yi"]},{"id":"foresee","type":"strategy","label":{"zh":"直说：刘琦公子活不长了，不如现在就谈。","en":"Say it plainly: Liu Qi won't live long. Better to talk now."},"out":[{"text":{"zh":"屋里一静。鲁肃看着你，像看一个说了不吉利话的人。半年后，刘琦果然病故。","en":"The room goes quiet. Lu Su looks at you as at a man who has said something ill-omened. Six months later, Liu Qi dies."}}],"effects":[{"add":"uncanny","by":1},{"add":"rel.lusu.trust","by":1},{"add":"rel.zhuge.trust","by":-1}],"foresight":true,"values":["cheng"]}],"salience":1,"order":2,"when":{"v":"track","op":"!=","val":"cao"},"art":{"scene":"hall","layers":[]},"place":"jiangling","cast":[{"id":"lusu"},{"id":"zhuge"}]},"c1_nanjun":{"id":"c1_nanjun","chapter":"c1","kind":"main","title":{"zh":"一气周瑜","en":"The First Vexation"},"lock":"functional","canon":{"zh":"第51回","en":"Ch. 51"},"intro":[{"text":{"zh":"周瑜和曹仁在南郡城下苦战了好些日子，周瑜中了毒箭。诸葛亮却在这时请刘备看一样东西：从曹营截来的兵符。","en":"Zhou Yu and Cao Ren have fought under Nanjun's walls for days, and Zhou Yu has taken a poisoned arrow. Now Zhuge Liang shows Liu Bei something: an army tally taken from Cao's camp."}},{"text":{"zh":"诸葛亮说话时看了你一眼。你从曹营回来才几天，帐里的人还在掂量你。","en":"Zhuge Liang glances at you as he speaks. You came back from Cao's camp only days ago, and the tent is still weighing you up."},"when":{"v":"flag.v2_returned","op":"==","val":true}},{"text":{"zh":"鲁肃把你送回来才半个月。帐里的人看你，像看一个从坟里走出来的人。","en":"Lu Su brought you back barely a fortnight ago. People in the tent look at you as if you'd walked out of a grave."},"when":{"v":"flag.came_back","op":"==","val":true}}],"choices":[{"id":"take","type":"strategy","label":{"zh":"劝主公趁虚而入：拿兵符赚开南郡，再取荆州、襄阳。","en":"Urge your lord to slip in: use the tally to open Nanjun, then take Jingzhou and Xiangyang."},"out":[{"text":{"zh":"一夜之间，三座城都插上了刘字旗。周瑜赶到城下，赵云在城楼上拱手。周瑜大叫一声，箭疮迸裂，坠下马去。","en":"In one night three cities fly Liu banners. Zhou Yu arrives under the walls to find Zhao Yun bowing from the gatehouse. He cries out, his wound bursts open, and he falls from his horse."}}],"effects":[{"set":"flag.took_nanjun","to":true},{"add":"rel.liubei.trust","by":1},{"add":"rel.zhuge.esteem","by":1},{"add":"rel.zhouyu.esteem","by":-1},{"add":"rel.zhouyu.trust","by":-2},{"add":"renown.cunning","by":1}],"echo":["e_nanjun"],"values":["zhi","li"]},{"id":"yield","type":"dilemma","label":{"zh":"劝主公按兵不动：南郡让周瑜去取，盟约要紧。","en":"Urge your lord to hold back: let Zhou Yu take Nanjun. The alliance matters more."},"out":[{"text":{"zh":"刘备犹豫再三，听了你的。周瑜拿下了南郡，派人送来一坛酒。诸葛亮望着那坛酒，说：『主公现在连一座自己的城都没有了。』","en":"Liu Bei hesitates, then listens to you. Zhou Yu takes Nanjun and sends over a jar of wine. Zhuge Liang looks at the jar and says, 'Now my lord doesn't have a single city of his own.'"}}],"effects":[{"set":"flag.yielded_nanjun","to":true},{"add":"rel.zhouyu.trust","by":2},{"add":"rel.lusu.trust","by":1},{"add":"rel.zhuge.esteem","by":-1},{"add":"renown.loyal","by":1},{"add":"deviation","by":1}],"echo":["e_yield"],"debt":["d_base"],"values":["yi","cheng"]},{"id":"warn","type":"strategy","label":{"zh":"连夜去见周瑜：曹仁的败退是诈，城里有伏兵。","en":"Go to Zhou Yu that night: Cao Ren's retreat is a trick, and the city is full of ambushers."},"out":[{"text":{"zh":"周瑜看了你很久，下令缓攻。他没有中第二次计。南郡最后还是被诸葛亮赚了去，可周瑜记住了你。","en":"Zhou Yu studies you a long time, then orders the attack slowed. He doesn't fall for the second trap. Nanjun still goes to Zhuge Liang's trick in the end, but Zhou Yu remembers you."}}],"effects":[{"set":"flag.warned_zhouyu","to":true},{"add":"rel.zhouyu.esteem","by":2},{"add":"rel.zhouyu.trust","by":1},{"add":"rel.zhuge.trust","by":-1},{"add":"uncanny","by":1}],"foresight":true,"echo":["e_warned_zy"],"values":["cheng","zhi"]}],"salience":0,"order":10,"when":{"v":"track","op":"!=","val":"cao"},"ask":{"who":"zhouyu","fallback":"dodge","q":{"zh":"周瑜在阵前遇见你，勒住马：『子衡，你说实话——孔明与我，谁更高明？』","en":"Zhou Yu meets you before the lines and reins in. 'Ziheng, tell me honestly: Kongming or I—who is the better man?'"},"answers":[{"id":"rude","means":{"zh":"讽刺或冒犯周瑜","en":"mocks or insults Zhou Yu"},"out":[{"text":{"zh":"周瑜的脸色一下子白了。","en":"Zhou Yu's face goes white."}}],"effects":[{"add":"heat.zhouyu","by":1},{"add":"rel.zhouyu.esteem","by":-1},{"add":"renown.rash","by":1}],"match":"气死|小肚|心胸|嫉妒|丢人|jealous|petty|sore loser","mood":"cold"},{"id":"kongming","means":{"zh":"说诸葛亮更高明","en":"says Zhuge Liang"},"out":[{"text":{"zh":"周瑜笑了，笑得很难看：『你倒是诚实。』他拨马就走。","en":"Zhou Yu smiles, an ugly smile. 'You're honest, at least.' He wheels his horse and goes."}}],"effects":[{"add":"rel.zhouyu.esteem","by":-1},{"add":"heat.zhouyu","by":1}],"match":"孔明|诸葛|卧龙|军师|他更|kongming|zhuge","mood":"cold"},{"id":"you","means":{"zh":"说周瑜更高明","en":"says Zhou Yu"},"out":[{"text":{"zh":"周瑜看了你一眼：『这话，你在孔明面前也敢说？』他嘴上这么问，眼里却亮了。","en":"Zhou Yu looks at you. 'Would you say that in front of Kongming?' But his eyes light up."}}],"effects":[{"add":"rel.zhouyu.esteem","by":1},{"add":"rel.zhuge.trust","by":-1}],"match":"都督|公瑾|周郎|你更|您更|大都督|zhou yu|gongjin|you are|you're better","mood":"warm"},{"id":"both","means":{"zh":"说两人各有所长、不可比","en":"says each has his own strengths"},"out":[{"text":{"zh":"周瑜沉默了一会儿：『各有所长……可天下只有一个荆州。』","en":"Zhou Yu is silent a moment. 'Each has his strengths… but there is only one Jingzhou.'"}}],"effects":[{"add":"rel.zhouyu.esteem","by":1}],"match":"各有|不分|都|难分|一个.*一个|each|both|equal","mood":"neutral"},{"id":"dodge","means":{"zh":"推辞、不正面回答","en":"evades"},"out":[{"text":{"zh":"周瑜冷笑一声：『刘备手下的人，说话都学会绕弯了。』","en":"Zhou Yu snorts. 'Liu Bei's people have all learned to talk in circles.'"}}],"effects":[],"match":"不知|不好说|不敢|不便|i don't know|can't say","mood":"cold"}]},"art":{"scene":"citywall","layers":[{"id":"siege"},{"id":"flag_liu","choice":"take"},{"id":"flag_wu","choice":"yield"},{"id":"rider"}]},"place":"jiangling","cast":[{"id":"zhouyu"},{"id":"zhuge"}]},"c1_cao":{"id":"c1_cao","chapter":"c1","kind":"main","title":{"zh":"孤败在哪里","en":"Where Did I Lose"},"lock":"free","canon":{"zh":"原创","en":"original"},"intro":[{"text":{"zh":"许都。曹操设宴，席上没有人提赤壁。酒到半酣，他忽然点了你的名。","en":"Xuchang. Cao Cao holds a banquet; no one mentions Red Cliffs. Half drunk, he suddenly calls your name."}}],"choices":[{"id":"truth","type":"dilemma","label":{"zh":"当众说实话：败在骄兵，败在不识水战。","en":"Tell the truth in front of everyone: arrogance, and not knowing how to fight on water."},"out":[{"text":{"zh":"满座变色。曹操却笑了：『好！这话只有你敢说。』","en":"The whole table changes color. Cao Cao laughs. 'Good! Only you would dare say that.'"}}],"effects":[{"add":"rel.caocao.esteem","by":2},{"add":"renown.rash","by":1}]},{"id":"fate","type":"expression","label":{"zh":"说是天意，东南风不该在冬天来。","en":"Say it was Heaven's will: a southeast wind had no business blowing in winter."},"out":[{"text":{"zh":"曹操点点头，又摇摇头，没说什么。","en":"Cao Cao nods, then shakes his head, and says nothing."}}],"effects":[{"add":"rel.caocao.esteem","by":-1}]}],"salience":0,"order":10,"when":{"v":"track","op":"==","val":"cao"},"art":{"scene":"hall","layers":[]},"place":"xuchang","cast":[{"id":"caocao"}]},"c2_guiyang":{"id":"c2_guiyang","chapter":"c2","kind":"side","title":{"zh":"桂阳","en":"Guiyang"},"lock":"functional","canon":{"zh":"第52回","en":"Ch. 52"},"intro":[{"text":{"zh":"赵云取了桂阳。太守赵范设宴，请出他寡居的嫂嫂樊氏，要许给赵云。赵云把酒席掀了。赵范连夜派人来找你，请你去劝。","en":"Zhao Yun has taken Guiyang. At the feast the governor, Zhao Fan, brings out his widowed sister-in-law, Lady Fan, and offers her to Zhao Yun in marriage. Zhao Yun overturns the table. That night Zhao Fan sends for you to talk him round."}}],"choices":[{"id":"back","type":"dilemma","label":{"zh":"站在赵云这边：刚降的城，娶不得降将的家眷。","en":"Side with Zhao Yun: you don't marry into a surrendered governor's family in a city just taken."},"out":[{"text":{"zh":"赵云对你抱了抱拳：『先生懂我。』后来赵范果然有异心，没能得逞。","en":"Zhao Yun clasps his hands to you. 'You understand me, sir.' Later Zhao Fan does try to turn, and fails."}}],"effects":[{"set":"flag.zy_refused","to":true},{"add":"rel.zhaoyun.trust","by":2},{"add":"rel.zhaoyun.warmth","by":1},{"add":"renown.loyal","by":1}],"echo":["e_zy"],"values":["yi"]},{"id":"persuade","type":"strategy","label":{"zh":"劝赵云：结了这门亲，桂阳就稳了。","en":"Persuade Zhao Yun: the marriage would make Guiyang secure."},"out":[{"text":{"zh":"赵云听完，只说了一句：『天下女子不少，子龙只怕名不立。』他没再理你。","en":"Zhao Yun hears you out and says only, 'There are many women in the world. What I fear is failing to make my name.' He doesn't speak to you again that night."}}],"effects":[{"add":"rel.zhaoyun.trust","by":-1},{"add":"rel.zhaoyun.warmth","by":-1},{"add":"renown.cunning","by":1}],"values":["li"]}],"salience":2,"order":1,"when":{"v":"track","op":"!=","val":"cao"},"art":{"scene":"citywall","layers":[{"id":"flag_liu"},{"id":"dusk"}]},"place":"guiyang","cast":[{"id":"zhaoyun"}]},"c2_changsha":{"id":"c2_changsha","chapter":"c2","kind":"main","title":{"zh":"义释黄汉升","en":"Mercy for Huang Zhong"},"lock":"literal","canon":{"zh":"第53回","en":"Ch. 53"},"intro":[{"text":{"zh":"关羽取长沙，和老将黄忠战了一百多合不分胜负。第二天黄忠马失前蹄，关羽没有杀他；黄忠也只射了关羽的盔缨。太守韩玄要斩黄忠，魏延杀了韩玄，开城献降。诸葛亮却下令：把魏延推出去斩了。","en":"Guan Yu attacks Changsha and fights the old general Huang Zhong for over a hundred bouts without a winner. Next day Huang Zhong's horse stumbles and Guan Yu spares him; Huang Zhong, in turn, shoots only the tassel of Guan Yu's helmet. The governor, Han Xuan, means to behead Huang Zhong—so Wei Yan kills Han Xuan and opens the gates. And Zhuge Liang orders: take Wei Yan out and behead him."}}],"choices":[{"id":"plead","type":"dilemma","label":{"zh":"出来为魏延求情：杀了献城的人，以后谁还敢来投？","en":"Step forward for Wei Yan: kill the man who opened the gates, and who will ever come over to us?"},"out":[{"text":{"zh":"刘备也开了口。诸葛亮看了你一眼，饶了魏延，却指着他说：『汝可尽忠报主，勿生异心。』魏延叩头。退下时，他回头看了你一眼。","en":"Liu Bei speaks up too. Zhuge Liang glances at you and spares Wei Yan, but points at him: 'Serve your lord loyally and harbor no other thought.' Wei Yan bows his head to the floor. On his way out he looks back at you."}}],"effects":[{"set":"flag.pleaded_weiyan","to":true},{"add":"rel.liubei.trust","by":1},{"add":"rel.zhuge.esteem","by":-1},{"add":"renown.loyal","by":1}],"echo":["e_weiyan"],"values":["ren"]},{"id":"silent","type":"expression","label":{"zh":"不出声，看主公怎么说。","en":"Say nothing. See what your lord says."},"out":[{"text":{"zh":"刘备开口求情，诸葛亮饶了魏延。这件事和你无关。","en":"Liu Bei pleads, and Zhuge Liang spares Wei Yan. It has nothing to do with you."}}],"effects":[]},{"id":"foresee","type":"strategy","label":{"zh":"私下对诸葛亮说：军师看得不错，这个人，以后要防。","en":"Tell Zhuge Liang privately: you're right about him. This one will need watching."},"out":[{"text":{"zh":"诸葛亮的扇子停了：『子衡兄也看出来了？』他没再说什么。可从那天起，魏延每次出战，诸葛亮都会多派一支兵在后面。","en":"Zhuge Liang's fan stops. 'You see it too?' He says no more. But from that day, whenever Wei Yan goes out to fight, Zhuge Liang sends another column behind him."}}],"effects":[{"set":"flag.foresaw_weiyan","to":true},{"add":"uncanny","by":1},{"add":"rel.zhuge.esteem","by":1},{"add":"rel.zhuge.trust","by":-1}],"foresight":true,"echo":["e_weiyan"],"values":["zhi"]}],"salience":0,"order":10,"when":{"v":"track","op":"!=","val":"cao"},"quote":{"zh":"孔明喝令刀斧手推下斩之。……孔明曰：「……吾观魏延脑后有反骨，久后必反，故先斩之，以绝祸根。」玄德曰：「若杀此人，恐降者人人自危；望军师恕之。」","en":"Kongming ordered the axemen to take him out and behead him. … \"I see a rebel's bone at the back of Wei Yan's head; he will turn in the end. I mean to cut him down first and pull the trouble up by the root.\" Xuande said, \"Kill this man, and everyone who surrenders to us will fear for his life. I beg you to pardon him.\""},"ask":{"who":"guanyu","fallback":"dodge","q":{"zh":"散了帐，关羽叫住你：『黄忠刀法不在我之下，他马失前蹄，我放了他。你说，我做得对不对？』","en":"After the council Guan Yu calls you back. 'Huang Zhong's blade is as good as mine. His horse stumbled and I let him go. Tell me—was I right?'"},"answers":[{"id":"wrong","means":{"zh":"说不对：战场上不该留情","en":"says no—no mercy on the battlefield"},"out":[{"text":{"zh":"关羽的脸沉了下来：『那你和韩玄，有什么两样？』","en":"Guan Yu's face darkens. 'Then how are you different from Han Xuan?'"}}],"effects":[{"add":"rel.guanyu.esteem","by":-1}],"match":"不对|不该|错|心软|妇人之仁|wrong|weak|mistake|no\\b","mood":"cold"},{"id":"right","means":{"zh":"说对：这是义","en":"says yes—that was righteous"},"out":[{"text":{"zh":"关羽点了点头：『你懂。』","en":"Guan Yu nods. 'You understand.'"}}],"effects":[{"add":"rel.guanyu.esteem","by":1}],"match":"对|义|应该|没错|好汉|英雄|right|honou?r|righteous|yes","mood":"warm"},{"id":"gain","means":{"zh":"说结果是好的：收了黄忠这员大将","en":"says it worked out—it won them Huang Zhong"},"out":[{"text":{"zh":"关羽皱眉：『我放他，不是为了收他。』他顿了顿，『不过……也好。』","en":"Guan Yu frowns. 'I didn't spare him to win him.' A pause. 'Still… it's well.'"}}],"effects":[{"add":"rel.guanyu.esteem","by":0},{"add":"renown.cunning","by":1}],"match":"收|得了|大将|归降|值|won him|recruit|gain","mood":"neutral"},{"id":"dodge","means":{"zh":"推辞、不正面回答","en":"evades"},"out":[{"text":{"zh":"关羽看了你一会儿，不再问了。","en":"Guan Yu looks at you a while and asks no more."}}],"effects":[],"match":"不知|不好说|将军自己|you know best|can't say","mood":"neutral"}]},"art":{"scene":"citywall","layers":[{"id":"open"},{"id":"flag_liu"},{"id":"rider"}]},"place":"changsha","cast":[{"id":"guanyu"},{"id":"zhuge"}]},"c2_zhaoyun":{"id":"c2_zhaoyun","chapter":"c2","kind":"main","title":{"zh":"夜谈·赵云","en":"Night Talk: Zhao Yun"},"lock":"free","canon":{"zh":"夜谈","en":"night talk"},"intro":[{"text":{"zh":"桂阳城头，赵云在擦枪。长坂坡之后，你们还没有好好说过话。","en":"On the Guiyang wall, Zhao Yun is cleaning his spear. Since Changban, the two of you have never really talked."}}],"choices":[{"id":"leave","type":"expression","label":{"zh":"起身告辞。","en":"Say goodnight and go."},"out":[{"text":{"zh":"赵云送你下了城楼。","en":"Zhao Yun sees you down from the wall."}}],"effects":[]}],"salience":0,"order":20,"when":{"v":"track","op":"!=","val":"cao"},"talk":{"char":"zhaoyun","turns":2,"topics":[{"id":"changban","label":{"zh":"问他长坂坡那天，怕不怕。","en":"Ask whether he was afraid that day at Changban."},"reply":[{"text":{"zh":"赵云想了很久：『怕。怕的不是死，是怀里那孩子。』他看了你一眼：『糜夫人能活下来，是你的功劳。』","en":"Zhao Yun thinks a long time. 'Yes. Not of dying—of the child in my arms.' He looks at you. 'Lady Mi lived because of you.'"},"when":{"v":"flag.mi_saved","op":"==","val":true}},{"text":{"zh":"赵云想了很久：『怕。怕的不是死，是怀里那孩子。』他没再说下去。糜夫人投井的事，他从不提。","en":"Zhao Yun thinks a long time. 'Yes. Not of dying—of the child in my arms.' He says no more. He never mentions Lady Mi and the well."},"when":{"v":"flag.mi_saved","op":"!=","val":true}}],"effects":[{"add":"rel.zhaoyun.warmth","by":1}]},{"id":"lord","label":{"zh":"问他为什么跟着刘备。","en":"Ask why he follows Liu Bei."},"reply":[{"text":{"zh":"『我在公孙瓒那里时，见过很多主公。』他说，『只有这一位，打了败仗还记得百姓。』","en":"'With Gongsun Zan I saw a lot of lords,' he says. 'Only this one remembers the people even when he's losing.'"}}],"effects":[{"add":"rel.zhaoyun.trust","by":1}]},{"id":"east","label":{"zh":"提醒他：以后去江东，多留个心眼。","en":"Warn him: if he's ever sent east, keep his eyes open."},"reply":[{"text":{"zh":"赵云点点头：『先生放心。子龙去哪里，都只信主公一个人。』","en":"Zhao Yun nods. 'Don't worry, sir. Wherever I go, I trust no one but our lord.'"}}],"effects":[{"add":"rel.zhaoyun.trust","by":1},{"add":"renown.loyal","by":1}]}]},"art":{"scene":"campfire","layers":[{"id":"wall"}]},"place":"guiyang"},"c3_ganlu":{"id":"c3_ganlu","chapter":"c3","kind":"main","title":{"zh":"甘露寺","en":"Ganlu Temple"},"lock":"functional","canon":{"zh":"第54回","en":"Ch. 54"},"intro":[{"text":{"zh":"南徐。吴国太在甘露寺相看女婿，一见刘备就喜欢上了。可你在廊下看见：两廊的帐幕后面，藏着刀斧手。赵云按着剑，看着你。","en":"Nanxu. Lady Wu, the Marquis's mother, receives her prospective son-in-law at Ganlu Temple, and takes to Liu Bei at once. But in the corridors you see it: behind the curtains on both sides are men with axes. Zhao Yun, hand on his sword, looks at you."}}],"choices":[{"id":"kneel","type":"strategy","label":{"zh":"让主公当着国太的面哭诉：要杀就在这里杀。","en":"Have your lord kneel before Lady Wu and weep: if they mean to kill him, let them do it here."},"out":[{"text":{"zh":"刘备跪在国太面前流泪。国太大怒，把孙权、吕范骂得抬不起头，当场认下了这个女婿。","en":"Liu Bei kneels and weeps before her. Lady Wu is furious; she berates Sun Quan and Lü Fan until they can't raise their heads, and accepts the son-in-law on the spot."}}],"effects":[{"add":"rel.liubei.trust","by":1},{"add":"renown.cunning","by":1}],"values":["zhi"]},{"id":"expose","type":"dilemma","label":{"zh":"你自己走出去，一把扯开帐幕。","en":"Walk out yourself and pull the curtain aside."},"out":[{"text":{"zh":"帐幕后面的刀斧手面面相觑。国太的脸色铁青。婚事成了，可孙权从此记住了你的名字，周瑜也是。","en":"The axemen behind it stare at one another. Lady Wu's face goes iron-grey. The marriage goes ahead—but from that day Sun Quan knows your name, and so does Zhou Yu."}}],"effects":[{"set":"flag.ganlu_exposed","to":true},{"add":"rel.liubei.trust","by":2},{"add":"rel.zhaoyun.trust","by":1},{"add":"rel.zhouyu.esteem","by":1},{"add":"rel.zhouyu.trust","by":-1},{"add":"renown.rash","by":1}],"echo":["e_ganlu"],"values":["yong"]},{"id":"stone","type":"expression","label":{"zh":"什么也不做，陪主公去看那块石头。","en":"Do nothing; go with your lord to see the stone."},"out":[{"text":{"zh":"刘备拔剑向天祝祷，一剑把石头劈成两半。孙权也劈了一剑。两道剑痕交成一个十字。你知道，两人许的愿不一样。","en":"Liu Bei draws his sword, prays, and splits a rock in two. Sun Quan strikes it too. The two cuts cross. You know the two men wished for different things."}}],"effects":[]}],"salience":0,"order":10,"when":{"v":"track","op":"!=","val":"cao"},"callbacks":[{"pays":"e_liuqi","text":{"zh":"鲁肃也在席上。他这回没带笑：刘琦公子已经不在了，荆州的事，该议了。","en":"Lu Su is at the feast too, and not smiling this time: the young lord Liu Qi is gone, so it is time to settle Jingzhou."},"when":{"v":"flag.liuqi_pretext","op":"==","val":true}}],"art":{"scene":"temple","layers":[{"id":"ambush"},{"id":"rock","choice":"stone"}]},"place":"jingkou","cast":[{"id":"liubei"},{"id":"zhaoyun"}]},"c3_flight":{"id":"c3_flight","chapter":"c3","kind":"main","title":{"zh":"赔了夫人","en":"Losing the Bride"},"lock":"functional","canon":{"zh":"第55回","en":"Ch. 55"},"intro":[{"text":{"zh":"刘备在东吴住得忘了回去。赵云拆开第二个锦囊，谎报曹操来攻荆州。孙夫人跟着刘备连夜出逃，东吴的追兵一路追到江边。","en":"Liu Bei is so comfortable in Wu he forgets to go home. Zhao Yun opens the second brocade bag and reports, falsely, that Cao Cao is attacking Jingzhou. Lady Sun flees with Liu Bei that night, and Wu's riders chase them to the river."}}],"choices":[{"id":"lady","type":"strategy","label":{"zh":"请孙夫人出面，喝退追兵。","en":"Ask Lady Sun to face the pursuers and order them back."},"out":[{"text":{"zh":"孙夫人掀开车帘，把追来的将领骂得下马请罪。没人敢拦吴侯的妹妹。船到了，诸葛亮的人在岸上齐声大喊，周瑜气得箭疮又裂了。","en":"Lady Sun throws back the curtain and berates the pursuing generals until they dismount and beg her pardon. No one dares stop the Marquis's sister. The boats arrive, Zhuge Liang's men shout from the bank, and Zhou Yu's wound tears open again."}}],"effects":[{"add":"rel.sunfuren.trust","by":1},{"add":"rel.sunfuren.warmth","by":1},{"add":"rel.liubei.trust","by":1}],"values":["zhi"]},{"id":"rear","type":"dilemma","label":{"zh":"你带几个人留在江边断后。","en":"Stay at the riverbank with a few men to hold the rear."},"out":[{"text":{"zh":"你在江边拖了一个时辰，背上挨了一刀。上船时，孙夫人亲手给你裹了伤：『荆州人，原来也有不怕死的。』","en":"You hold them for an hour and take a cut across the back. When you board, Lady Sun binds the wound herself. 'So some Jingzhou men aren't afraid to die.'"}}],"effects":[{"set":"flag.rearguard","to":true},{"add":"rel.sunfuren.warmth","by":2},{"add":"rel.sunfuren.trust","by":1},{"add":"rel.zhaoyun.warmth","by":1},{"add":"rel.liubei.trust","by":1}],"echo":["e_rear"],"values":["yong","yi"]},{"id":"leave","type":"dilemma","label":{"zh":"劝主公先走：夫人的车太慢，追兵追的是她。","en":"Urge your lord to go ahead: the lady's carriage is too slow, and it's her they're after."},"out":[{"text":{"zh":"刘备犹豫了。孙夫人在车里听见了，冷笑一声，自己挥鞭赶车追了上来。她一路没再看你一眼。","en":"Liu Bei hesitates. Lady Sun hears it from her carriage, laughs coldly, and whips her own horses to catch up. She doesn't look at you again the whole way."}}],"effects":[{"set":"flag.left_sun","to":true},{"add":"rel.sunfuren.warmth","by":-2},{"add":"rel.sunfuren.trust","by":-2},{"add":"renown.cunning","by":1}],"echo":["e_left_sun"],"values":["li"]}],"salience":0,"order":20,"when":{"v":"track","op":"!=","val":"cao"},"callbacks":[{"pays":"e_ganlu","text":{"zh":"东吴的追兵追得格外凶：甘露寺扯帐子的那个人，也在车队里。","en":"Wu's riders chase hardest of all: the man who pulled the curtain at Ganlu Temple is with the carriages."},"when":{"v":"flag.ganlu_exposed","op":"==","val":true}}],"ask":{"who":"sunfuren","fallback":"dodge","q":{"zh":"马车停下来换马时，孙夫人掀开帘子看着你：『你说实话——你家主公娶我，是真心，还是借我？』","en":"While the horses are changed, Lady Sun pulls back the curtain and looks at you. 'Tell me the truth—did your lord marry me because he wanted me, or to use me?'"},"answers":[{"id":"rude","means":{"zh":"冒犯她或说她不配","en":"insults her"},"out":[{"text":{"zh":"孙夫人的刀已经架在了车窗上：『再说一遍？』","en":"Lady Sun's blade is already resting on the carriage window. 'Say that again?'"}}],"effects":[{"add":"heat.sunfuren","by":1},{"add":"rel.sunfuren.warmth","by":-2},{"add":"renown.rash","by":1}],"match":"不配|人质|筹码|棋子|hostage|pawn|bargaining chip","mood":"cold"},{"id":"both","means":{"zh":"说两者都有","en":"says both"},"out":[{"text":{"zh":"孙夫人愣了一下，笑了：『你倒是不骗人。』","en":"Lady Sun blinks, then laughs. 'You don't lie, at least.'"}}],"effects":[{"add":"rel.sunfuren.trust","by":2},{"add":"rel.sunfuren.warmth","by":1}],"match":"都有|既.*也|一半|两者|both|a bit of both|half","mood":"warm"},{"id":"use","means":{"zh":"直说是借她、联姻是为了政治","en":"admits it was politics"},"out":[{"text":{"zh":"孙夫人的脸色变了，又慢慢平复：『至少你说了实话。别人都在哄我。』","en":"Lady Sun's face changes, then slowly settles. 'At least you told me the truth. Everyone else just humors me.'"}}],"effects":[{"add":"rel.sunfuren.trust","by":2},{"add":"rel.sunfuren.warmth","by":-1},{"add":"rel.liubei.trust","by":-1}],"match":"借|政治|联盟|结盟|两家|利益|politic|alliance|use you","mood":"cold"},{"id":"love","means":{"zh":"说主公是真心","en":"says Liu Bei truly loves her"},"out":[{"text":{"zh":"孙夫人看着你：『你说得这么快，是早想好的吧？』她放下了帘子。","en":"Lady Sun studies you. 'You said that very quickly. Did you prepare it?' She drops the curtain."}}],"effects":[{"add":"rel.sunfuren.trust","by":-1}],"match":"真心|喜欢|爱|真情|love|truly|really cares","mood":"neutral"},{"id":"dodge","means":{"zh":"推辞、不正面回答","en":"evades"},"out":[{"text":{"zh":"孙夫人冷哼一声：『荆州人都这样说话。』","en":"Lady Sun snorts. 'Everyone from Jingzhou talks like that.'"}}],"effects":[{"add":"rel.sunfuren.warmth","by":-1}],"match":"不知|不好说|问主公|ask him|can't say","mood":"cold"}]},"art":{"scene":"bigriver","layers":[{"id":"wu_ships"},{"id":"blockade","choice":"lady"}]},"place":"gongan","cast":[{"id":"sunfuren"},{"id":"zhaoyun"}]},"c4_tongque":{"id":"c4_tongque","chapter":"c4","kind":"main","title":{"zh":"铜雀台","en":"The Bronze Bird Terrace"},"lock":"literal","canon":{"zh":"第56回","en":"Ch. 56"},"intro":[{"text":{"zh":"铜雀台上，武将们比箭夺锦袍，文官们轮番献诗。曹操让你也写一篇。","en":"On the Bronze Bird Terrace the generals shoot for a brocade robe and the scholars take turns presenting poems. Cao Cao has you write one too."}}],"choices":[{"id":"praise","type":"expression","label":{"zh":"写一篇颂德的赋。","en":"Write a rhapsody in his praise."},"out":[{"text":{"zh":"曹操笑道：『你们都说孤的功德，孤自己知道，孤不过想做个征西将军。』","en":"Cao Cao laughs. 'You all talk of my virtue. I know myself: all I ever wanted was to be General Who Subdues the West.'"}}],"effects":[{"set":"flag.tongque","to":true},{"add":"rel.caocao.esteem","by":1}],"echo":["e_tongque"]},{"id":"warn","type":"dilemma","label":{"zh":"写一篇讽喻：台越高，越看不见江南。","en":"Write an allegory: the higher the terrace, the less you see of the south."},"out":[{"text":{"zh":"满座无声。曹操看完，把你的文章收进了袖子里，没有念。","en":"The terrace falls silent. Cao Cao reads it, tucks it into his sleeve, and doesn't read it aloud."}}],"effects":[{"set":"flag.tongque","to":true},{"add":"rel.caocao.esteem","by":2},{"add":"renown.rash","by":1}],"echo":["e_tongque"]}],"salience":0,"order":10,"when":{"v":"track","op":"==","val":"cao"},"art":{"scene":"hall","layers":[]},"place":"xuchang","cast":[{"id":"caocao"}]},"c4_death":{"id":"c4_death","chapter":"c4","kind":"main","title":{"zh":"三气周瑜","en":"The Third Vexation"},"lock":"functional","canon":{"zh":"第56–57回","en":"Ch. 56–57"},"intro":[{"text":{"zh":"周瑜让人传话：想见你一面。","en":"Zhou Yu sends word: he would like to see you."},"when":{"v":"rel.zhouyu.trust","op":">=","val":3}},{"text":{"zh":"周瑜的人说起你，脸色都不好看。","en":"Zhou Yu's men don't look pleased when your name comes up."},"when":{"v":"imp.zhouyu.offended","op":">=","val":1}},{"text":{"zh":"周瑜借道取川的计被诸葛亮一眼看穿。大军到了荆州城下，城上遍插旗帜，四面都有伏兵。周瑜在马上大叫一声，箭疮复裂。","en":"Zhuge Liang sees through Zhou Yu's 'borrowed road' at a glance. When Zhou Yu's army reaches Jingzhou, the walls are thick with banners and ambushes wait on every side. Zhou Yu cries out in the saddle; his wound tears open again."}},{"text":{"zh":"他被抬回巴丘，一直没有起来。","en":"He is carried back to Baqiu and never rises again."}}],"choices":[{"id":"visit","type":"dilemma","label":{"zh":"赶去巴丘看他。","en":"Go to Baqiu to see him."},"out":[{"text":{"zh":"周瑜躺着，脸色像纸。他看见你，笑了笑：『你来看孔明的笑话，还是我的？』说完，望着帐顶，叹了口气：『既生瑜，何生亮？』连叫数声而亡。","en":"Zhou Yu lies there, his face like paper. He sees you and smiles. 'Come to watch Kongming's joke, or mine?' Then, staring up at the tent: 'Since Heaven made Zhou Yu, why did it make Zhuge Liang too?' He cries it out several times, and dies."}}],"effects":[{"add":"rel.zhouyu.esteem","by":1},{"add":"rel.lusu.trust","by":1}],"values":["ren"]},{"id":"save","type":"dilemma","label":{"zh":"带上温芷连夜赶去：只要他不再动气，伤还有救。","en":"Take Wen Zhi and go that night: if he can stop raging, the wound can still heal."},"out":[{"text":{"zh":"温芷在周瑜帐里守了半个月，你守在帐外，挡掉所有提荆州、提孔明的人。周瑜活了下来，却再也上不了战场。他把兵权交给了鲁肃，回了柴桑。","en":"Wen Zhi sits by Zhou Yu for half a month, and you stand outside the tent turning away anyone who mentions Jingzhou or Kongming. Zhou Yu lives—but he will never take the field again. He hands command to Lu Su and goes home to Chaisang."}}],"effects":[{"set":"flag.zhouyu_lives","to":true},{"add":"rel.zhouyu.trust","by":2},{"add":"rel.zhouyu.esteem","by":1},{"add":"rel.wenzhi.trust","by":1},{"add":"deviation","by":2}],"req":{"all":[{"v":"flag.wz_treated_zhou","op":"==","val":true},{"v":"flag.wenzhi_with_you","op":"==","val":true}]},"hint":{"zh":"需要温芷先前替周瑜治过箭伤","en":"Needs Wen Zhi to have treated Zhou Yu's wound before"},"echo":["e_zy_lives"],"debt":["d_zhouyu"],"values":["ren"]},{"id":"away","type":"expression","label":{"zh":"不去。这是东吴的事。","en":"Don't go. It's Wu's affair."},"out":[{"text":{"zh":"消息传来时，你正在灯下看地图。诸葛亮说要去柴桑吊丧，问你去不去。","en":"When the news comes you're studying a map by lamplight. Zhuge Liang says he'll go to Chaisang to mourn, and asks whether you'll come."}}],"effects":[]}],"salience":0,"order":10,"when":{"v":"track","op":"!=","val":"cao"},"callbacks":[{"pays":"e_nanjun","text":{"zh":"你想起南郡城下周瑜坠马的那一幕。第一口气，是你劝主公给的。","en":"You remember Zhou Yu falling from his horse under Nanjun's walls. The first vexation was your advice."},"when":{"v":"flag.took_nanjun","op":"==","val":true}},{"pays":"e_yield","text":{"zh":"周瑜让人带话：『南郡的事，我记着刘使君的情。』可他也没打算还这个情。","en":"Zhou Yu sends word: 'I remember Lord Liu's kindness over Nanjun.' He has no plans to repay it."},"when":{"v":"flag.yielded_nanjun","op":"==","val":true}},{"pays":"e_warned_zy","text":{"zh":"周瑜对鲁肃说过：刘备那边，只有一个人跟我说过真话。","en":"Zhou Yu once told Lu Su: in Liu Bei's camp, only one man ever told me the truth."},"when":{"v":"flag.warned_zhouyu","op":"==","val":true}},{"pays":"e_wz_zhou","text":{"zh":"温芷说过：这伤最怕气。","en":"Wen Zhi said it: this wound can't bear anger."},"when":{"any":[{"v":"flag.wz_treated_zhou","op":"==","val":true},{"v":"flag.wz_spied_zhou","op":"==","val":true}]}}],"on_enter":[{"when":{"v":"debt.d_base","op":"==","val":"open"},"effects":[],"resolve":[["d_base","reroute"]],"text":{"zh":"你想起诸葛亮那句话：主公连一座自己的城都没有。鲁肃最后还是说服了孙权，把南郡“借”给了刘备。从此有了“借荆州”的说法。","en":"You remember Zhuge Liang's words: our lord doesn't have a city of his own. In the end Lu Su persuades Sun Quan to 'lend' Nanjun to Liu Bei. From then on, people speak of 'the borrowed Jingzhou'."}}],"art":{"scene":"lamp","layers":[]},"place":"chaisang","cast":[{"id":"zhouyu"},{"id":"lusu"}]},"c4_mourn":{"id":"c4_mourn","chapter":"c4","kind":"main","title":{"zh":"卧龙吊丧","en":"Mourning at Chaisang"},"lock":"literal","canon":{"zh":"第57回","en":"Ch. 57"},"intro":[{"text":{"zh":"诸葛亮带着赵云去柴桑吊丧。东吴的将领个个想杀他。他伏在灵前，哭得泪如涌泉，祭文念到一半，满堂的人都哭了。","en":"Zhuge Liang goes to Chaisang to mourn, with Zhao Yun beside him. Every general in Wu wants him dead. He throws himself down before the coffin and weeps like a spring, and halfway through his elegy the whole hall is weeping too."},"when":{"v":"flag.zhouyu_lives","op":"!=","val":true}},{"text":{"zh":"周瑜没死。诸葛亮却还是要去柴桑——去探病。东吴的将领个个想杀他，周瑜在病榻上摆了摆手。","en":"Zhou Yu didn't die. Zhuge Liang goes to Chaisang anyway—to visit the sick. Every general in Wu wants him dead. From his sickbed, Zhou Yu waves them off."},"when":{"v":"flag.zhouyu_lives","op":"==","val":true}},{"text":{"zh":"出门时，一个黑面短髯、相貌古怪的人一把拉住了诸葛亮：『你气死了周郎，还来吊丧，欺东吴无人吗？』","en":"On the way out, a dark-faced, short-bearded, strange-looking man grabs Zhuge Liang by the sleeve. 'You vexed Zhou Yu to death and now you come to mourn him? Do you think Wu has no one left?'"},"when":{"v":"flag.pangtong_joined","op":"!=","val":true}}],"choices":[{"id":"pt","type":"strategy","label":{"zh":"留下来，和这个怪人喝一顿酒。","en":"Stay behind and drink with the strange man."},"out":[{"text":{"zh":"他叫庞统，道号凤雏。你们喝到半夜。他说：『孙权不喜欢我这张脸。刘备呢？』","en":"His name is Pang Tong; they call him the Young Phoenix. You drink until midnight. 'Sun Quan doesn't like my face,' he says. 'What about Liu Bei?'"}}],"effects":[{"set":"flag.met_pangtong","to":true},{"add":"rel.pangtong.warmth","by":2},{"add":"rel.pangtong.esteem","by":1}],"when":{"v":"flag.pangtong_joined","op":"!=","val":true},"echo":["e_pt"],"values":["zhi"]},{"id":"guard","type":"dilemma","label":{"zh":"寸步不离诸葛亮，和赵云一左一右。","en":"Stay at Zhuge Liang's side, Zhao Yun on the other."},"out":[{"text":{"zh":"没有人敢动手。回程的船上，诸葛亮说：『子衡兄，今天是你和子龙救了亮的命。』","en":"No one dares move. On the boat home Zhuge Liang says, 'Today you and Zilong saved my life.'"}}],"effects":[{"add":"rel.zhuge.esteem","by":2},{"add":"rel.zhaoyun.trust","by":1}],"values":["yi","yong"]},{"id":"old","type":"expression","label":{"zh":"陪庞统在灵前站一会儿。","en":"Stand before the coffin a while with Pang Tong."},"out":[{"text":{"zh":"庞统早已在刘备帐下，这一趟是陪诸葛亮来的。他看着灵位说：『公瑾也算知己。可惜了。』","en":"Pang Tong has served Liu Bei for some time now and came with Zhuge Liang. Looking at the tablet he says, 'Gongjin was a man who understood me. A pity.'"}}],"effects":[{"add":"rel.pangtong.warmth","by":1}],"when":{"v":"flag.pangtong_joined","op":"==","val":true}}],"salience":0,"order":20,"when":{"v":"track","op":"!=","val":"cao"},"quote":{"zh":"孔明……设祭物于灵前，亲自奠酒，跪于地下，读祭文曰：「呜呼公瑾，不幸夭亡，修短故天，人岂不伤？我心实痛，酹酒一觞……」","en":"Kongming … set out the offerings before the coffin, poured the wine himself, knelt, and read his elegy: \"Alas, Gongjin, taken so young! Long life or short is Heaven's to give, yet who would not grieve? My heart truly aches; I pour out this cup …\""},"callbacks":[{"pays":"e_rear","text":{"zh":"赵云在船上对你说：『那天江边，你背上那一刀，夫人一直记着。』","en":"On the boat Zhao Yun tells you, 'That cut you took on the riverbank—the lady hasn't forgotten.'"},"when":{"v":"flag.rearguard","op":"==","val":true}},{"pays":"e_lusu","text":{"zh":"鲁肃送你们上船时摸了摸怀里。那张约还在。","en":"Seeing you to the boat, Lu Su pats the front of his robe. The agreement is still there."},"when":{"v":"flag.promised_return","op":"==","val":true}},{"pays":"e_zy_lives","text":{"zh":"周瑜在病榻上对你点了点头。","en":"From his sickbed, Zhou Yu nods to you."},"when":{"v":"flag.zhouyu_lives","op":"==","val":true}}],"on_enter":[{"when":{"v":"debt.d_zhouyu","op":"==","val":"open"},"effects":[],"resolve":[["d_zhouyu","transform"]],"text":{"zh":"周瑜病退柴桑，东吴的兵权交到了鲁肃手里。孙刘的盟约，还是由鲁肃来守。","en":"Zhou Yu retires sick to Chaisang, and command in Wu passes to Lu Su. The alliance is still in Lu Su's keeping."}}],"art":{"scene":"mourning","layers":[{"id":"crowd"},{"id":"phoenix","when":{"v":"flag.zhouyu_lives","op":"!=","val":true}}]},"place":"chaisang","cast":[{"id":"zhuge"},{"id":"pangtong"}]},"c4_leiyang":{"id":"c4_leiyang","chapter":"c4","kind":"side","title":{"zh":"耒阳县令","en":"The Magistrate of Leiyang"},"lock":"literal","canon":{"zh":"第57回","en":"Ch. 57"},"intro":[{"text":{"zh":"庞统来投刘备，只分到一个耒阳县令。他到任一百天，天天喝酒，不理公事。张飞奉命去查，你也跟着去了。","en":"Pang Tong comes to Liu Bei and is given only the county of Leiyang. In a hundred days there he has done nothing but drink. Zhang Fei is sent to inspect, and you go along."}}],"choices":[{"id":"vouch","type":"strategy","label":{"zh":"请张飞先别发火，让他当面理事。","en":"Ask Zhang Fei to hold his temper and let the man work in front of him."},"out":[{"text":{"zh":"庞统把一百多天的公文抱上堂来，不到半日，全部断完，掷笔于地。张飞看傻了。回去之后，你和张飞一起替他作保。","en":"Pang Tong has a hundred days of papers carried in, and in less than half a day he has decided every case and thrown down his brush. Zhang Fei gapes. Back at headquarters, you and Zhang Fei vouch for him together."}}],"effects":[{"set":"flag.vouched_pangtong","to":true},{"add":"rel.pangtong.esteem","by":2},{"add":"rel.pangtong.warmth","by":1},{"add":"rel.liubei.trust","by":1}],"echo":["e_pt_vouch"]},{"id":"report","type":"expression","label":{"zh":"照实回报：这人整天喝酒。","en":"Report what you saw: the man drinks all day."},"out":[{"text":{"zh":"后来诸葛亮回来，说了一句：『庞士元非百里之才。』刘备才把他请了回来。庞统见了你，只笑了笑。","en":"Later Zhuge Liang returns and says, 'Pang Shiyuan is not a man to be wasted on a hundred-li county.' Only then does Liu Bei call him back. When Pang Tong sees you, he just smiles."}}],"effects":[{"add":"rel.pangtong.esteem","by":-1}]}],"salience":2,"order":1,"when":{"all":[{"v":"track","op":"!=","val":"cao"},{"v":"flag.pangtong_joined","op":"!=","val":true}]},"art":{"scene":"letter","layers":[{"id":"seal"}]},"place":"leiyang","cast":[{"id":"pangtong"}]},"c5_tongguan":{"id":"c5_tongguan","chapter":"c5","kind":"main","title":{"zh":"割须弃袍","en":"Shaving the Beard"},"lock":"literal","canon":{"zh":"第58回","en":"Ch. 58"},"intro":[{"text":{"zh":"潼关大败。马超的人在乱军中大喊：穿红袍的是曹操！曹操脱了袍子。又喊：长髯的是曹操！曹操割了胡须。你就在他身边。","en":"Disaster at Tongguan. Ma Chao's men shout through the chaos: the one in the red robe is Cao Cao! Cao throws off his robe. Then: the one with the long beard is Cao Cao! Cao cuts off his beard. You are right beside him."}}],"choices":[{"id":"cloak","type":"dilemma","label":{"zh":"把自己的外袍扔给他，自己往另一边跑。","en":"Throw him your own cloak and run the other way."},"out":[{"text":{"zh":"追兵追着你跑了半里地。你被曹洪救下时，曹操已经过了河。他后来对人说：『那天替孤挨刀的，是刘备那边来的人。』","en":"The pursuers chase you half a li. By the time Cao Hong pulls you out, Cao Cao is across the river. Later he tells people, 'The man who took the blades for me that day came from Liu Bei's side.'"}}],"effects":[{"set":"flag.saved_cao","to":true},{"add":"rel.caocao.esteem","by":3},{"add":"renown.loyal","by":1}],"echo":["e_cloak"]},{"id":"flee","type":"expression","label":{"zh":"各自逃命。","en":"Every man for himself."},"out":[{"text":{"zh":"你跟着溃兵跑了一夜。第二天才知道，曹操也活了下来。","en":"You run with the routed men all night. Only the next day do you learn Cao Cao lived too."}}],"effects":[]}],"salience":0,"order":5,"when":{"v":"track","op":"==","val":"cao"},"callbacks":[{"pays":"e_tongque","text":{"zh":"你那篇铜雀台上的文章，他一直收在袖子里。","en":"That piece you wrote on the Bronze Bird Terrace—he has kept it in his sleeve ever since."},"when":{"v":"flag.tongque","op":"==","val":true}}],"art":{"scene":"slope","layers":[]},"place":"tongguan","cast":[{"id":"caocao"}]},"c5_zhangsong":{"id":"c5_zhangsong","chapter":"c5","kind":"main","title":{"zh":"张松献图","en":"Zhang Song's Map"},"lock":"literal","canon":{"zh":"第60回","en":"Ch. 60"},"intro":[{"text":{"zh":"张松到了许都。曹操嫌他相貌猥琐，又听他言语冲撞，拂袖而去。杨修拿出曹操新写的兵书考他，张松看了一遍，从头到尾背了出来，说这是蜀中三尺小童都会背的古书。","en":"Zhang Song reaches Xuchang. Cao Cao finds him repulsive and, hearing him speak bluntly, sweeps out of the room. Yang Xiu tests him with Cao's new book on war; Zhang Song reads it once and recites it from start to finish, calling it an old text every child in Shu knows by heart."},"when":{"v":"track","op":"==","val":"cao"}},{"text":{"zh":"张松离开许都，往荆州来了。赵云在郢州界口等他，关羽在荆州界口等他，刘备、诸葛亮、庞统亲自出城十里相迎。","en":"Zhang Song leaves Xuchang and comes to Jingzhou. Zhao Yun is waiting at the Yingzhou border, Guan Yu at the Jingzhou border, and Liu Bei, Zhuge Liang and Pang Tong ride out ten li to meet him."},"when":{"v":"track","op":"!=","val":"cao"}}],"choices":[{"id":"host","type":"strategy","label":{"zh":"尽地主之谊：陪他喝了三天酒，一个字也不提西川。","en":"Play the host: three days of wine, and not one word about the west."},"out":[{"text":{"zh":"第三天送别时，张松从袖中取出一张图：『松感明公盛德，敢献此图。』他把图递给刘备，却回头看了你一眼。","en":"On the third day, at the farewell, Zhang Song takes a map from his sleeve. 'Moved by your great virtue, I dare to offer this.' He hands it to Liu Bei, but looks back at you."}}],"effects":[{"set":"flag.honored_zs","to":true},{"add":"rel.zhangsong.esteem","by":2},{"add":"rel.liubei.trust","by":1}],"when":{"v":"track","op":"!=","val":"cao"},"echo":["e_zs"],"values":["ren"]},{"id":"ask","type":"dilemma","label":{"zh":"开门见山：先生此来，是为西川找一个新主人吧？","en":"Get straight to it: you've come to find the west a new master, haven't you?"},"out":[{"text":{"zh":"张松的脸色变了变，随即大笑：『痛快！』图还是献了，可他跟刘备说话时，再也没看过你。","en":"Zhang Song's face flickers, then he roars with laughter. 'Refreshing!' He still offers the map—but when he talks to Liu Bei, he never looks at you again."}}],"effects":[{"add":"rel.zhangsong.esteem","by":-1},{"add":"rel.liubei.trust","by":1},{"add":"renown.cunning","by":1}],"when":{"v":"track","op":"!=","val":"cao"},"values":["zhi","cheng"]},{"id":"follow","type":"dilemma","label":{"zh":"跟张松一起走。去荆州。","en":"Leave with Zhang Song. Go to Jingzhou."},"out":[{"text":{"zh":"你在城外追上了张松。他打量着你：『你是刘备的人，还是曹操的人？』『今天起，是刘备的。』到了荆州，刘备拉着你的手，半晌没说话。","en":"You catch Zhang Song outside the walls. He looks you over. 'Are you Liu Bei's man, or Cao Cao's?' 'From today, Liu Bei's.' In Jingzhou, Liu Bei takes your hands and can't speak for a while."}}],"effects":[{"set":"flag.defected","to":true},{"set":"track","to":"liu"},{"add":"rel.caocao.esteem","by":-4},{"add":"rel.zhangsong.esteem","by":2},{"add":"rel.liubei.trust","by":1}],"when":{"v":"track","op":"==","val":"cao"},"echo":["e_defect"],"values":["yi"]},{"id":"north","type":"dilemma","label":{"zh":"留下。","en":"Stay."},"out":[{"text":{"zh":"张松走了。几年后，你在许都听说刘备取了西川，有人说起一张地图。曹操那天喝了很多酒，问你：『当初，孤是不是该留住那个矮子？』","en":"Zhang Song leaves. Years later, in Xuchang, you hear that Liu Bei has taken the west, and people talk about a map. Cao Cao drinks a great deal that day and asks you, 'Should I have kept that little man after all?'"}}],"effects":[{"set":"flag.cao_forever","to":true},{"add":"rel.caocao.esteem","by":1}],"when":{"v":"track","op":"==","val":"cao"},"ends":true}],"salience":0,"order":10,"quote":{"zh":"其人生得额镢头尖，鼻偃齿露，身短不满五尺，言语有若铜钟。……松于袖中取出一图，递与玄德曰：「松感明公盛德，敢献此图。便知蜀中道路矣。」","en":"The man had a pointed skull, a flat nose and teeth that showed, stood under five feet tall, and spoke like a bronze bell. … Song took a map from his sleeve and handed it to Xuande. \"Moved by your virtue, I dare to offer this map. With it you will know the roads of Shu.\""},"callbacks":[{"pays":"e_cloak","text":{"zh":"曹操把一件新袍子扔给你：『潼关那件，孤还你。』","en":"Cao Cao tosses you a new robe. 'For the one at Tongguan.'"},"when":{"v":"flag.saved_cao","op":"==","val":true}},{"pays":"e_cao_stay","text":{"zh":"你烧掉的那封信，鲁肃又写了一封，托张松带来了。","en":"Lu Su has written again, the letter you burned, and sent it with Zhang Song."},"when":{"v":"flag.cao_stay","op":"==","val":true}}],"ask":{"who":"zhangsong","fallback":"dodge","when":{"v":"track","op":"!=","val":"cao"},"q":{"zh":"酒过三巡，张松忽然放下杯子：『松这副模样，在许都被人当笑话。你家主公，为何以礼相待？』","en":"Several cups in, Zhang Song suddenly sets down his cup. 'In Xuchang they laughed at a man who looks like me. Why does your lord treat me with such courtesy?'"},"answers":[{"id":"rude","means":{"zh":"取笑他的相貌","en":"mocks his looks"},"out":[{"text":{"zh":"张松的脸一下子沉了：『原来刘家和曹家，一样。』","en":"Zhang Song's face falls. 'So the Liu house is no different from Cao's.'"}}],"effects":[{"add":"heat.zhangsong","by":1},{"add":"rel.zhangsong.esteem","by":-2},{"add":"renown.rash","by":1}],"match":"丑|矮|难看|样子|长相|ugly|short|looks","mood":"cold"},{"id":"west","means":{"zh":"直说是为了西川","en":"admits it's about the west"},"out":[{"text":{"zh":"张松大笑：『痛快！』笑完了，他慢慢说：『可松最恨被人当成一张地图。』","en":"Zhang Song roars with laughter. 'Refreshing!' Then, slowly: 'But what I hate most is being treated as a map.'"}}],"effects":[{"add":"rel.zhangsong.esteem","by":-1},{"add":"renown.cunning","by":1}],"match":"西川|益州|蜀|地图|图|the west|map|shu","mood":"surprised"},{"id":"talent","means":{"zh":"说看重的是他的才学","en":"says it's his talent"},"out":[{"text":{"zh":"张松的眼睛亮了：『过目不忘这点小本事，也有人看得上？』","en":"Zhang Song's eyes light up. 'This little knack of never forgetting a page—someone actually values it?'"}}],"effects":[{"add":"rel.zhangsong.esteem","by":2}],"match":"才|学|本事|过目不忘|学问|talent|learning|memory|ability","mood":"warm"},{"id":"virtue","means":{"zh":"说主公待人一向如此","en":"says Liu Bei treats everyone this way"},"out":[{"text":{"zh":"张松点头：『曹操若有皇叔一半的气度……罢了。』","en":"Zhang Song nods. 'If Cao Cao had half Lord Liu's grace… never mind.'"}}],"effects":[{"add":"rel.zhangsong.esteem","by":1},{"add":"rel.liubei.trust","by":1}],"match":"仁|一向|待人|宽厚|礼贤|always|kind|courtesy","mood":"warm"},{"id":"dodge","means":{"zh":"推辞、不正面回答","en":"evades"},"out":[{"text":{"zh":"张松也不追问，自顾自喝酒。","en":"Zhang Song doesn't press, and goes back to his wine."}}],"effects":[],"match":"不知|不好说|i don't know|can't say","mood":"neutral"}]},"art":{"scene":"hall","layers":[]},"place":"jiangling","cast":[{"id":"zhangsong"},{"id":"liubei","when":{"v":"track","op":"!=","val":"cao"}}]},"c6_river":{"id":"c6_river","chapter":"c6","kind":"main","title":{"zh":"截江夺阿斗","en":"On the River"},"lock":"literal","canon":{"zh":"第61回","en":"Ch. 61"},"intro":[{"text":{"zh":"东吴来信，说国太病重，要孙夫人带阿斗回去见一面。夫人带着阿斗上了船。赵云得了信，沿江追来。你在他的小船上。","en":"A letter comes from Wu: Lady Wu is gravely ill and wants to see her daughter—and the boy, A Dou. Lady Sun takes A Dou aboard a ship. Zhao Yun hears of it and races down the river. You are in his little boat."}},{"text":{"zh":"鲁肃事先派人悄悄告诉了你：那封信是假的。","en":"Lu Su had already sent someone to tell you quietly: the letter is a fake."},"when":{"v":"rel.lusu.trust","op":">=","val":5}},{"text":{"zh":"孙夫人看见你，脸色变了：江边那一夜，你撇下过她。","en":"Lady Sun sees you and her face hardens: that night on the riverbank, you left her behind."},"when":{"v":"flag.left_sun","op":"==","val":true}},{"text":{"zh":"她也没忘你说过的那些话。","en":"Nor has she forgotten the things you said to her."},"when":{"v":"imp.sunfuren.offended","op":">=","val":1}},{"text":{"zh":"孙夫人看见你，神色一松：江边那一刀，是你替她挨的。","en":"Lady Sun sees you and something in her eases: that cut on the riverbank, you took for her."},"when":{"v":"flag.rearguard","op":"==","val":true}}],"choices":[{"id":"board","type":"strategy","label":{"zh":"随赵云跳上大船，挡在夫人面前。","en":"Leap aboard the big ship with Zhao Yun and stand before the lady."},"out":[{"text":{"zh":"赵云掣剑在手：『主母欲何往？何故不令军师知会？』僵持到天明，张飞的船横截江面，大喊：『嫂嫂留下侄儿！』阿斗被抱了回来，孙夫人带着五只船回了东吴。","en":"Zhao Yun draws his sword. 'My lady, where are you going? Why did you not tell the strategist?' The standoff lasts till dawn, when Zhang Fei's boats block the river and he bellows, 'Sister, leave my nephew!' A Dou is carried back; Lady Sun sails home to Wu with five ships."}}],"effects":[{"set":"flag.adou_kept","to":true},{"add":"rel.zhaoyun.trust","by":1},{"add":"rel.sunfuren.warmth","by":-1},{"add":"renown.loyal","by":1}],"echo":["e_adou"],"values":["yong","yi"]},{"id":"talk","type":"dilemma","label":{"zh":"先上船，单独和夫人说几句。","en":"Board first and speak to the lady alone."},"out":[{"text":{"zh":"你在船舱里跟她说了很久。最后她亲手把阿斗交给你：『告诉玄德，我不是来偷他儿子的。我只是想回家看我娘。』她走得很体面，东吴那边也挑不出理来。","en":"You speak with her a long while in the cabin. In the end she hands A Dou to you herself. 'Tell Xuande I didn't come to steal his son. I only wanted to go home and see my mother.' She leaves with dignity, and Wu can find no grievance in it."}}],"effects":[{"set":"flag.sun_parted","to":true},{"set":"flag.adou_kept","to":true},{"add":"rel.sunfuren.trust","by":2},{"add":"rel.liubei.trust","by":1},{"add":"deviation","by":1}],"req":{"v":"rel.sunfuren.warmth","op":">=","val":3},"hint":{"zh":"需要孙夫人对你有足够的交情（≥ 3）","en":"Needs enough friendship with Lady Sun (≥ 3)"},"echo":["e_adou"],"values":["cheng"]},{"id":"let","type":"expression","label":{"zh":"让她走。","en":"Let her go."},"out":[{"text":{"zh":"赵云不肯。他一个人跳上了大船。后来的事，和原著写的一样。","en":"Zhao Yun won't hear of it. He leaps aboard alone. What follows happens just as the novel tells it."}}],"effects":[{"add":"rel.zhaoyun.trust","by":-1}]}],"salience":0,"order":10,"when":{"v":"track","op":"!=","val":"cao"},"quote":{"zh":"赵云……掣所佩青釭剑在手，……云曰：「主母欲何往？何故不令军师知会？」……张飞……大叫：「嫂嫂留下侄儿！」","en":"Zhao Yun … drew the Qinggang sword at his side. … \"My lady, where are you going? Why did you not tell the strategist?\" … Zhang Fei … roared, \"Sister, leave my nephew behind!\""},"callbacks":[{"pays":"e_zy","text":{"zh":"赵云在船头低声对你说：『桂阳那回，先生懂我。今天，子龙也懂先生。』","en":"At the bow Zhao Yun says quietly, 'At Guiyang you understood me, sir. Today I understand you.'"},"when":{"v":"flag.zy_refused","op":"==","val":true}},{"pays":"e_defect","text":{"zh":"赵云看见你，愣了一下：『先生从北边回来了？』他什么也没再问。","en":"Zhao Yun sees you and pauses. 'You've come back from the north, sir?' He asks nothing more."},"when":{"v":"flag.defected","op":"==","val":true}},{"pays":"e_left_sun","text":{"zh":"你想起江边那一夜，她自己挥鞭赶车的样子。","en":"You remember her whipping her own horses on the riverbank that night."},"when":{"v":"flag.left_sun","op":"==","val":true}}],"art":{"scene":"bigriver","layers":[{"id":"child"},{"id":"zhaoyun"},{"id":"blockade","choice":"board"}]},"place":"gongan","cast":[{"id":"sunfuren"},{"id":"zhaoyun"}]},"c6_wenzhi":{"id":"c6_wenzhi","chapter":"c6","kind":"side","title":{"zh":"去留","en":"Going or Staying"},"lock":"free","canon":{"zh":"原创人物","en":"original character"},"intro":[{"text":{"zh":"温芷这些日子话很少。","en":"Wen Zhi has said very little these days."},"when":{"v":"rel.wenzhi.trust","op":"<=","val":1}},{"text":{"zh":"大军要西去了。温芷在收拾药箱，收了一半，停下来问你：『你要我跟着去西川，还是留在荆州？』","en":"The army is going west. Wen Zhi is packing her medicine chest; halfway through she stops. 'Do you want me to come west, or stay in Jingzhou?'"}},{"text":{"zh":"她顿了一下，又说：『要是……以后有了孩子，我想他在一个不打仗的地方长大。』","en":"She pauses. 'If… one day there's a child, I'd like him to grow up somewhere without a war.'"},"when":{"v":"flag.confessed","op":"==","val":true}}],"choices":[{"id":"west","type":"dilemma","label":{"zh":"跟我去西川。","en":"Come west with me."},"out":[{"text":{"zh":"『好。』她把药箱合上了，『那就去看看蜀道到底有多难。』","en":"'All right.' She shuts the chest. 'Then let's see how hard those Shu roads really are.'"}}],"effects":[{"set":"flag.wz_west","to":true},{"add":"rel.wenzhi.intimacy","by":1},{"add":"rel.wenzhi.trust","by":1}],"echo":["e_wz_road"]},{"id":"stay","type":"dilemma","label":{"zh":"留在荆州。关将军那里，更需要大夫。","en":"Stay in Jingzhou. General Guan will need a physician more."},"out":[{"text":{"zh":"她点点头，没说什么，过了一会儿才说：『那你记得写信。』","en":"She nods and says nothing; after a while: 'Then remember to write.'"}}],"effects":[{"set":"flag.wz_jingzhou","to":true},{"add":"rel.wenzhi.trust","by":1},{"add":"rel.guanyu.esteem","by":1}],"echo":["e_wz_road"]},{"id":"child","type":"expression","label":{"zh":"说：等打下西川，我们就有一个不打仗的地方了。","en":"Say: once the west is taken, we'll have a place without a war."},"out":[{"text":{"zh":"温芷笑了，把头靠在你肩上，没有说话。窗外，江上起了雾。","en":"Wen Zhi smiles and leans her head on your shoulder, saying nothing. Outside, mist is rising on the river."}}],"effects":[{"set":"flag.wz_child","to":true},{"set":"flag.wz_west","to":true},{"add":"rel.wenzhi.intimacy","by":2}],"when":{"v":"flag.confessed","op":"==","val":true},"req":{"v":"rel.wenzhi.intimacy","op":">=","val":3},"hint":{"zh":"需要和温芷足够亲近（≥ 3）","en":"Needs enough closeness with Wen Zhi (≥ 3)"},"echo":["e_wz_road"]}],"salience":4,"order":1,"when":{"all":[{"v":"track","op":"!=","val":"cao"},{"v":"flag.wenzhi_with_you","op":"==","val":true}]},"art":{"scene":"herbs","layers":[{"id":"two"}]},"place":"gongan","cast":[{"id":"wenzhi"}]},"c6_pangtong":{"id":"c6_pangtong","chapter":"c6","kind":"main","title":{"zh":"夜谈·庞统","en":"Night Talk: Pang Tong"},"lock":"free","canon":{"zh":"夜谈","en":"night talk"},"intro":[{"text":{"zh":"入川前一夜。庞统一个人在帐里喝酒，见你掀帘进来，往旁边挪了挪。","en":"The night before the march west. Pang Tong is drinking alone in his tent; when you lift the flap he moves over."}},{"text":{"zh":"『今天不许夸我。』他先说。","en":"'No compliments tonight,' he says first."},"when":{"v":"imp.pangtong.flattery","op":">=","val":1}}],"choices":[{"id":"leave","type":"expression","label":{"zh":"起身告辞。","en":"Say goodnight and go."},"out":[{"text":{"zh":"庞统没有送你，只是在你身后说了一句：『到了雒城，我请你喝西川的酒。』","en":"Pang Tong doesn't see you out, only calls after you: 'At Luocheng, the western wine's on me.'"}}],"effects":[]}],"salience":0,"order":20,"when":{"v":"track","op":"!=","val":"cao"},"talk":{"char":"pangtong","turns":2,"topics":[{"id":"kongming","label":{"zh":"问他：你和孔明，到底谁更厉害？","en":"Ask him: you or Kongming—who is really better?"},"reply":[{"text":{"zh":"庞统哈哈大笑：『卧龙、凤雏，得一可安天下。主公两个都有了，天下怎么还没安？』笑完了，他低声说：『这一趟，我要让人看看凤雏。』","en":"Pang Tong laughs aloud. 'The Sleeping Dragon or the Young Phoenix—either one can settle the realm. Our lord has both, so why isn't it settled?' Then, quietly: 'This time I'll show them the phoenix.'"}}],"effects":[{"add":"rel.pangtong.warmth","by":1}]},{"id":"road","label":{"zh":"劝他：入川的路，宁可慢，不可险。","en":"Urge him: on the road west, better slow than dangerous."},"reply":[{"text":{"zh":"庞统摆摆手：『兵贵神速。慢了，刘璋就醒过来了。』他看了你一眼：『不过你的话，我记下了。』","en":"Pang Tong waves it off. 'Speed is everything. Go slow, and Liu Zhang wakes up.' He glances at you. 'But I'll remember you said it.'"}}],"effects":[{"add":"rel.pangtong.esteem","by":1}]},{"id":"face","label":{"zh":"问他：孙权不用你，是因为那张脸吗？","en":"Ask him: did Sun Quan turn you down because of your face?"},"reply":[{"text":{"zh":"『是，也不是。』庞统摸了摸自己的脸，『他嫌我丑，也嫌我狂。主公只嫌我狂。』他举杯：『所以我跟主公。』","en":"'Yes and no.' Pang Tong touches his face. 'He found me ugly, and arrogant. Our lord only finds me arrogant.' He raises his cup. 'So I follow our lord.'"}}],"effects":[{"add":"rel.pangtong.warmth","by":1},{"add":"rel.pangtong.esteem","by":1}]}]},"callbacks":[{"pays":"e_pt","text":{"zh":"『柴桑那顿酒，』庞统说，『还欠着你一顿。』","en":"'That night at Chaisang,' Pang Tong says, 'I still owe you a drink.'"},"when":{"v":"flag.met_pangtong","op":"==","val":true}},{"pays":"e_pt_vouch","text":{"zh":"『耒阳的事，』庞统说，『张飞到现在还跟人讲。』","en":"'That business at Leiyang,' Pang Tong says. 'Zhang Fei still tells everyone.'"},"when":{"v":"flag.vouched_pangtong","op":"==","val":true}}],"art":{"scene":"campfire","layers":[]},"place":"jiameng"},"c7_luofeng":{"id":"c7_luofeng","chapter":"c7","kind":"main","title":{"zh":"落凤坡","en":"Fallen Phoenix Slope"},"lock":"literal","canon":{"zh":"第63回","en":"Ch. 63"},"intro":[{"text":{"zh":"雒城外有两条路：大路平坦，小路险窄。庞统要走小路。临行前，他的马把他掀了下来。刘备把自己的白马让给了他。","en":"Two roads lead to Luocheng: the main road, level and open, and a narrow one through the hills. Pang Tong means to take the narrow road. Just before setting out, his horse throws him. Liu Bei gives him his own white horse."}},{"text":{"zh":"你记得这个地方的名字。你一直记得。","en":"You remember what this place is called. You always have."},"when":{"v":"uncanny","op":">=","val":2}},{"text":{"zh":"张松死前没给你留一句话。","en":"Zhang Song left no word for you before he died."},"when":{"v":"imp.zhangsong.offended","op":">=","val":1}}],"choices":[{"id":"stop","type":"dilemma","label":{"zh":"拦住庞统：今天不能走小路。不要问为什么。","en":"Stop Pang Tong: not the narrow road today. Don't ask why."},"out":[{"text":{"zh":"庞统盯着你看了很久，最后骂了一句，调转马头。那天，小路上的伏兵等了一整天，射死了一匹探路的白马。雒城晚破了三个月，庞统活了下来。他再也没问过你为什么。","en":"Pang Tong stares at you a long time, then swears and turns his horse. That day the ambush on the narrow road waits from dawn to dusk and kills one white horse sent ahead to scout. Luocheng falls three months later than it would have. Pang Tong lives. He never asks you why."}}],"effects":[{"set":"flag.pt_alive","to":true},{"add":"uncanny","by":2},{"add":"deviation","by":2},{"add":"rel.pangtong.warmth","by":2},{"add":"rel.pangtong.esteem","by":-1},{"add":"rel.zhuge.trust","by":-1}],"req":{"any":[{"v":"rel.pangtong.warmth","op":">=","val":3},{"v":"rel.pangtong.esteem","op":">=","val":3}]},"hint":{"zh":"需要庞统肯听你的（交情或看重 ≥ 3）","en":"Needs Pang Tong to listen to you (friendship or esteem ≥ 3)"},"foresight":true,"echo":["e_luofeng"],"debt":["d_phoenix"],"values":["yi"],"place":"luocheng"},{
