"id":"ride","type":"dilemma","label":{"zh":"陪他走小路。","en":"Ride the narrow road with him."},"out":[{"text":{"zh":"走到半路，庞统勒住马问：『此处是何地名？』降兵说：『此处地名落凤坡。』庞统惊道：『吾道号凤雏，此处名落凤坡，不利于吾。』话音未落，山坡上一声炮响，箭如飞蝗，只朝骑白马的人射来。你扑过去时，已经晚了。他倒下前，抓住你的袖子说了一句话。","en":"Halfway along Pang Tong reins in. 'What is this place called?' A surrendered soldier answers, 'This is Fallen Phoenix Slope.' Pang Tong starts. 'They call me the Young Phoenix, and this is called Fallen Phoenix Slope. This bodes ill for me.' Before the words are out a cannon booms on the hillside and arrows fly like locusts, all aimed at the man on the white horse. You throw yourself toward him, too late. Before he falls, he grips your sleeve and says one thing."}}],"effects":[{"set":"flag.with_pangtong","to":true},{"add":"rel.pangtong.warmth","by":2},{"add":"rel.liubei.trust","by":1},{"add":"renown.loyal","by":1}],"echo":["e_luofeng"],"values":["yong","yi"]},{"id":"main","type":"expression","label":{"zh":"随主公走大路。","en":"Go by the main road with your lord."},"out":[{"text":{"zh":"傍晚，小路上的兵逃回来报信：军师被乱箭射死了。刘备望西大哭。","en":"At dusk survivors from the narrow road come back with the news: the strategist has been shot dead by a storm of arrows. Liu Bei faces west and weeps."}}],"effects":[]}],"salience":0,"order":10,"quote":{"zh":"庞统心下甚疑，勒住马问：「此处是何地名？」内有新降军士，指道：「此处地名落凤坡。」庞统惊曰：「吾道号凤雏，此处名落凤坡，不利于吾。」令后军疾退。只听山坡前一声炮响，箭如飞蝗，只望骑白马者射来。可怜庞统竟死于乱箭之下。时年止三十六岁。","en":"Pang Tong grew uneasy, reined in and asked, \"What is this place called?\" A newly surrendered soldier pointed: \"This place is called Fallen Phoenix Slope.\" Pang Tong started. \"My name is the Young Phoenix, and this is Fallen Phoenix Slope. It bodes ill for me.\" He ordered the rear to fall back at once. A cannon boomed on the slope, arrows flew like locusts, all aimed at the rider on the white horse. Alas, Pang Tong died beneath the arrows, only thirty-six years old."},"callbacks":[{"pays":"e_weiyan","text":{"zh":"魏延抢着打头阵。你想起诸葛亮在长沙之后的安排：每次都多派一支兵跟在他后面。","en":"Wei Yan pushes to lead the van. You remember Zhuge Liang's arrangement after Changsha: always another column behind him."},"when":{"v":"flag.foresaw_weiyan","op":"==","val":true}},{"pays":"e_weiyan","text":{"zh":"黄忠、魏延争着打头阵。魏延路过你身边，低声说：『长沙那天，先生的话，魏某记着。』","en":"Huang Zhong and Wei Yan argue over who leads the van. Passing you, Wei Yan says quietly, 'That day at Changsha—I remember what you said, sir.'"},"when":{"v":"flag.pleaded_weiyan","op":"==","val":true}},{"pays":"e_zs","text":{"zh":"张松死了。临死前，他托人带给你一句话：『荆州那三天的酒，松记着。』","en":"Zhang Song is dead. Before he died he sent you a message: 'Those three days of wine in Jingzhou—I remember them.'"},"when":{"v":"flag.honored_zs","op":"==","val":true}}],"when":{"v":"track","op":"!=","val":"cao"},"ask":{"who":"pangtong","fallback":"dodge","q":{"zh":"出发前，庞统忽然问你，半开玩笑：『子衡，你总像是知道些什么。你说——这一路，我会死在哪里？』","en":"Before setting out Pang Tong suddenly asks you, half joking, 'Ziheng, you always seem to know something. Tell me—where on this road will I die?'"},"answers":[{"id":"name","means":{"zh":"说出落凤坡、坡、伏兵之类的地名或预言","en":"names the slope, the ambush, or foretells his death"},"out":[{"text":{"zh":"庞统的笑容僵住了。他看了你很久：『你说的，我会记着。』","en":"Pang Tong's smile freezes. He looks at you a long time. 'I'll remember what you said.'"}}],"effects":[{"add":"uncanny","by":1},{"add":"rel.pangtong.esteem","by":1},{"add":"rel.pangtong.warmth","by":1}],"match":"落凤|凤|坡|伏兵|小路|白马|箭|slope|phoenix|ambush|arrow|white horse|narrow road","mood":"surprised"},{"id":"dont","means":{"zh":"劝他别去、别走小路","en":"begs him not to go"},"out":[{"text":{"zh":"庞统拍拍你的肩：『放心，我命硬。』","en":"Pang Tong claps your shoulder. 'Don't worry. I'm hard to kill.'"}}],"effects":[{"add":"rel.pangtong.warmth","by":1}],"match":"别去|不要去|别走|留下|don't go|stay|please don't","mood":"warm"},{"id":"with","means":{"zh":"说我陪你去","en":"says he'll go with him"},"out":[{"text":{"zh":"『好！』庞统笑道，『那就一起去喝西川的酒。』","en":"'Good!' Pang Tong laughs. 'Then we'll drink the western wine together.'"}}],"effects":[{"add":"rel.pangtong.warmth","by":2}],"match":"陪你|一起|我也去|跟你|with you|together|i'll come","mood":"warm"},{"id":"joke","means":{"zh":"开玩笑、说他长命百岁","en":"jokes, or says he'll live forever"},"out":[{"text":{"zh":"庞统大笑：『借你吉言！』","en":"Pang Tong roars. 'From your lips to Heaven's ears!'"}}],"effects":[],"match":"长命|百岁|酒|醉|不会死|live forever|hundred|drunk","mood":"warm"},{"id":"dodge","means":{"zh":"推辞、不正面回答","en":"evades"},"out":[{"text":{"zh":"庞统耸耸肩：『不说就算了。』","en":"Pang Tong shrugs. 'Don't, then.'"}}],"effects":[],"match":"不知|不好说|i don't know|can't say","mood":"neutral"}]},"art":{"scene":"ravine","layers":[{"id":"arrows","choice":"ride"},{"id":"arrows","choice":"main"},{"id":"you","choice":"ride"},{"id":"turnback","choice":"stop"}]},"place":"luofeng","cast":[{"id":"pangtong"},{"id":"liubei"}]},"c7_guanyu":{"id":"c7_guanyu","chapter":"c7","kind":"main","title":{"zh":"夜谈·关羽","en":"Night Talk: Guan Yu"},"lock":"free","canon":{"zh":"夜谈","en":"night talk"},"intro":[{"text":{"zh":"诸葛亮奉命入川，荆州交给关羽一个人守。临行前一夜，你去关羽那里坐了坐。","en":"Zhuge Liang has been summoned west, and Jingzhou is left to Guan Yu alone. The night before you leave, you go and sit with him."},"when":{"v":"flag.pt_alive","op":"!=","val":true}},{"text":{"zh":"庞统没死，雒城却迟迟攻不下。刘备还是把诸葛亮召进了川，荆州交给关羽一个人守。临行前一夜，你去关羽那里坐了坐。","en":"Pang Tong lived, but Luocheng won't fall. Liu Bei summons Zhuge Liang west after all, and Jingzhou is left to Guan Yu alone. The night before you leave, you go and sit with him."},"when":{"v":"flag.pt_alive","op":"==","val":true}},{"text":{"zh":"关羽给你留了座位，酒已经温好了。","en":"Guan Yu has kept a seat for you, and the wine is already warm."},"when":{"v":"rel.guanyu.esteem","op":">=","val":6}},{"text":{"zh":"关羽看了你一眼，又低下头去擦刀。你们之间，还隔着以前那些话。","en":"Guan Yu glances at you, then goes back to his blade. What you said to him before still stands between you."},"when":{"v":"imp.guanyu.offended","op":">=","val":1}}],"choices":[{"id":"leave","type":"expression","label":{"zh":"起身告辞。","en":"Say goodnight and go."},"out":[{"text":{"zh":"关羽送你到门口：『到了西川，替我看看大哥。』","en":"Guan Yu walks you to the door. 'In the west, look after my brother for me.'"}}],"effects":[]}],"salience":0,"order":20,"when":{"v":"track","op":"!=","val":"cao"},"talk":{"char":"guanyu","turns":2,"topics":[{"id":"wu","label":{"zh":"劝他：东吴那边，能和就和。","en":"Urge him: with Wu, keep the peace if he can."},"reply":[{"text":{"zh":"关羽捋着胡须：『军师也是这么说的，八个字。』他没有说是哪八个字，只说：『孙权那个人，我看不上。』","en":"Guan Yu strokes his beard. 'The strategist said the same. Eight characters.' He doesn't say which eight. He only says, 'That Sun Quan—I don't think much of him.'"}}],"effects":[{"add":"rel.guanyu.esteem","by":1}]},{"id":"brother","label":{"zh":"说：大哥把荆州交给你，是最信你。","en":"Say: your brother left Jingzhou to you because he trusts you most."},"reply":[{"text":{"zh":"关羽沉默了很久：『我知道。所以我不能丢。』","en":"Guan Yu is silent a long time. 'I know. That's why I can't lose it.'"}}],"effects":[{"add":"rel.guanyu.esteem","by":1},{"set":"flag.guan_charge","to":true}]},{"id":"huarong","label":{"zh":"说起华容道。","en":"Bring up Huarong."},"reply":[{"text":{"zh":"『那一跪，』关羽说，『我还记着。』他给你斟满了酒。","en":"'You knelt,' Guan Yu says. 'I still remember.' He fills your cup."},"when":{"v":"flag.vouched_guan","op":"==","val":true}},{"text":{"zh":"『那一天你在道上求我，』关羽说，『我放了他。到现在也不知道对不对。』","en":"'That day on the road you begged me,' Guan Yu says, 'and I let him go. I still don't know if it was right.'"},"when":{"v":"flag.pleaded_guan","op":"==","val":true}},{"text":{"zh":"关羽摇摇头：『那件事，不提了。』","en":"Guan Yu shakes his head. 'Let's not speak of that.'"},"when":{"all":[{"v":"flag.vouched_guan","op":"!=","val":true},{"v":"flag.pleaded_guan","op":"!=","val":true}]}}],"effects":[{"add":"rel.guanyu.warmth","by":1}],"when":{"any":[{"v":"flag.vouched_guan","op":"==","val":true},{"v":"flag.pleaded_guan","op":"==","val":true},{"v":"flag.vouched_guan","op":"!=","val":true}]}}]},"callbacks":[{"pays":"e_wz_road","text":{"zh":"关羽说：『温大夫的事，你放心。』","en":"Guan Yu says, 'Don't worry about Physician Wen.'"},"when":{"v":"flag.wz_jingzhou","op":"==","val":true}},{"pays":"e_wz_road","text":{"zh":" 's side."},"out":[{"text":{"zh":"刘备沉默了一会儿：『二弟性子刚，有你在旁边，我也放心。』诸葛亮看着你，扇子停了很久。","en":"Liu Bei is quiet a moment. 'My brother is hard-tempered. With you beside him, I can rest easy.' Zhuge Liang looks at you, his fan still for a long time."}}],"effects":[{"set":"flag.post_jingzhou","to":true},{"add":"rel.guanyu.esteem","by":1},{"add":"rel.liubei.trust","by":1}],"values":["yi"],"place":"jiangling"},{"id":"none","type":"expression","label":{"zh":"什么都不要。","en":"Ask for nothing."},"out":[{"text":{"zh":"刘备看了你很久，笑了：『子衡还是子衡。』那天散席后，他一个人来你的住处坐了很久。","en":"Liu Bei looks at you a long time, then smiles. 'Ziheng is still Ziheng.' After the feast he comes to your lodging alone and sits a long while."}}],"effects":[{"set":"flag.post_none","to":true},{"add":"rel.liubei.trust","by":2},{"add":"renown.loyal","by":1}],"values":["cheng"]}],"salience":0,"order":10,"when":{"v":"track","op":"!=","val":"cao"},"callbacks":[{"pays":"e_adou","text":{"zh":"阿斗在席间跑来跑去，跑到你跟前停了一下。赵云说：『那天在船上，抱他的是先生。』","en":"A Dou runs about the hall and stops in front of you. Zhao Yun says, 'That day on the ship, it was you who held him, sir.'"},"when":{"v":"flag.adou_kept","op":"==","val":true}},{"pays":"e_luofeng","text":{"zh":"你想起落凤坡的箭雨。","en":"You think of the arrows at Fallen Phoenix Slope."},"when":{"any":[{"v":"flag.with_pangtong","op":"==","val":true},{"v":"flag.pt_alive","op":"==","val":true}]}}],"on_enter":[{"when":{"v":"debt.d_phoenix","op":"==","val":"open"},"effects":[],"resolve":[["d_phoenix","reroute"]],"text":{"zh":"诸葛亮终究还是入了川——不是因为庞统死了，是因为雒城久攻不下。荆州，还是只剩关羽一个人。","en":"Zhuge Liang came west after all—not because Pang Tong died, but because Luocheng would not fall. Jingzhou is still left to Guan Yu alone."}}],"ask":{"who":"liubei","fallback":"nothing","q":{"zh":"刘备看着你：『子衡，从许都跟到成都，你要什么？』","en":"Liu Bei looks at you. 'Ziheng, you've followed me from Xuchang to Chengdu. What do you want?'"},"answers":[{"id":"guan","means":{"zh":"要回荆州、陪关羽","en":"to go back to Jingzhou, to Guan Yu"},"out":[{"text":{"zh":"刘备点点头：『 liubei.trust","by":-1},{"add":"rel.zhuge.esteem","by":1}]}],"salience":0,"order":4,"when":{"v":"renown.rash","op":">=","val":6},"art":{"scene":"letter","layers":[]},"cast":[{"id":"liubei"}]},"x_zhouyu_rage":{"id":"x_zhouyu_rage","chapter":"*","kind":"flash","title":{"zh":"周瑜拔剑","en":"Zhou Yu Draws His Sword"},"lock":"free","canon":{"zh":"原创","en":"original"},"intro":[{"text":{"zh":"周瑜霍地站起，剑已出鞘：『刘备的人，敢在我营中放肆？』帐下的甲士围了上来。鲁肃急得直跺脚。","en":"Zhou Yu is on his feet with his sword out. 'One of Liu Bei's men, running his mouth in my camp?' Guards close in. Lu Su is stamping with anxiety."}}],"choices":[{"id":"bow","type":"expression","label":{"zh":"拱手赔罪。","en":"Bow and apologize."},"out":[{"text":{"zh":"鲁肃打了圆场。周瑜收剑入鞘，冷冷地说：『看在子敬面上。』","en":"Lu Su smooths it over. Zhou Yu sheathes his sword and says coldly, 'For Zijing's sake.'"}}],"effects":[{"add":"rel.zhouyu.esteem","by":-1},{"add":"rel.zhouyu.trust","by":-1},{"add":"renown.rash","by":1}]},{"id":"stand","type":"dilemma","label":{"zh":"不退：『大都督要杀盟友的人，请便。』","en":"Don't back down: 'If the Grand Commander wants to kill an ally's man, go ahead.'"},"out":[{"text":{"zh":"周瑜盯着你，剑尖慢慢垂了下去：『你倒是有胆。』他转身走了，伤口在衣服下渗出了血。","en":"Zhou Yu stares at you; slowly his sword point drops. 'You've got nerve.' He turns away; under his robe, his wound is seeping blood."}}],"effects":[{"add":"rel.zhouyu.esteem","by":1},{"add":"rel.zhouyu.trust","by":-2},{"add":"renown.rash","by":2},{"add":"rel.lusu.trust","by":-1}],"values":["yong"]}],"salience":0,"order":0,"art":{"scene":"hall","layers":[]},"cast":[{"id":"zhouyu"},{"id":"lusu"}]}},"endings":[{"id":"g_side","title":{"zh":"去处","en":"Where You Ended Up"},"fragments":[{"id":"hermit","text":{"zh":"你留在了那个渔村。后来的事，你是从过往客商嘴里听来的。","en":"You stayed in that fishing village. The rest you heard from passing merchants."},"when":{"v":"flag.v2_hermit","op":"==","val":true}},{"id":"north","text":{"zh":"你留在了北方。曹操封魏公那年，你就在台下。","en":"You stayed in the north. The year Cao Cao became Duke of Wei, you were in the crowd below the =","val":"cao"},{"v":"flag.v2_hermit","op":"!=","val":true},{"v":"flag.v2_exposed","op":"!=","val":true},{"v":"flag.v2_left","op":"!=","val":true}]}},{"id":"cao_high","text":{"zh":"曹操说：天下能让孤脱袍相赠的，只有一个人。","en":"Cao Cao says there is only one man in the realm he would give the robe off his back."},"when":{"all":[{"v":"track","op":"==","val":"cao"},{"v":"rel.caocao.esteem","op":">=","val":8}]}},{"id":"cao","text":{"zh":"曹操用你，也防你。","en":"Cao Cao uses you, and watches you."},"when":{"v":"track","op":"==","val":"cao"}}]},{"id":"g_zhouyu","title":{"zh":"周瑜","en":"Zhou Yu"},"fragments":[{"id":"lives","text":{"zh":"周瑜在柴桑养病，每逢江上起风，就让人抬他到城头去看。他对鲁肃说：『替我谢谢那个大夫，和那个守门的。』","en":"Zhou Yu convalesces at Chaisang; whenever the wind rises on the river he has himself carried up to the walls to watch. He tells Lu Su, 'Thank that physician for me—and the one who guarded my door.'"},"when":{"v":"flag.zhouyu_lives","op":"==","val":true}},{"id":"esteem","text":{"zh":"周瑜临死前问过鲁肃：『刘备那边那个子衡，还在吗？』","en":"Before he died, Zhou Yu asked Lu Su, 'That Ziheng in Liu Bei's camp—is he still there?'"},"when":{"v":"rel.zhouyu.esteem","op":">=","val":5}},{"id":"rival","text":{"zh":"东吴的人提起你，总说：周郎的死，也有他一份。","en":"When people in Wu speak of you, they say: he had a hand in Zhou Yu's death too."},"when":{"all":[{"v":"flag.took_nanjun","op":"==","val":true},{"v":"flag.zhouyu_lives","op":"!=","val":true}]}},{"id":"plain","text":{"zh":"周瑜死在巴丘，三十六岁。你想起他按着琴弦的手。","en":"Zhou Yu died at Baqiu at thirty-six. You remember his hand on the zither strings."},"when":{"all":[{"all":[{"v":"track","op":"!=","val":"cao"},{"v":"flag.v2_hermit","op":"!=","val":true},{"v":"flag.v2_exposed","op":"!=","val":true},{"v":"flag.v2_left","op":"!=","val":true}]},{"v":"flag.zhouyu_lives","op":"!=","val":true}]}}]},{"id":"g_pangtong","title":{"zh":"庞统","en":"Pang Tong"},"fragments":[{"id":"alive","text":{"zh":"庞统活着，和诸葛亮一左一右坐在刘备身边。他总说欠你一顿西川的酒，一直没还。","en":"Pang Tong lives, seated with Zhuge Liang at Liu Bei's left and right. He always says he owes you a cup of western wine. He never pays."},"when":{"v":"flag.pt_alive","op":"==","val":true}},{"id":"words","text":{"zh":"庞统倒下前抓着你的袖子，说的是：『告诉孔明，西川的路，我替他走了一半。』你一直没告诉别人。","en":"Before he fell, Pang Tong gripped your sleeve and said, 'Tell Kongming I walked half the western road for him.' You never told anyone else."},"when":{"v":"flag.with_pangtong","op":"==","val":true}},{"id":"dead","text":{"zh":"庞统死在落凤坡，三十六岁。","en":"Pang Tong died at Fallen Phoenix Slope at thirty-six."},"when":{"all":[{"v":"track","op":"!=","val":"cao"},{"v":"flag.v2_hermit","op":"!=","val":true},{"v":"flag.v2_exposed","op":"!=","val":true},{"v":"flag.v2_left","op":"!=","val":true}]}}]},{"id":"g_sun","title":{"zh":"孙夫人","en":"Lady Sun"},"fragments":[{"id":"parted","text":{"zh":"孙夫人回了东吴。临走前她托人带给你一张弓：『荆州人里，就你一个说话算话。』","en":"Lady Sun went back to Wu. Before she left she sent you a bow: 'Of all the Jingzhou men, you're the only one who kept his word.'"},"when":{"v":"flag.sun_parted","op":"==","val":true}},{"id":"letter","text":{"zh":"孙夫人回东吴后给你写过一封信，只问了一句：荆州的弓，还好用吗？","en":"After she went back to Wu, Lady Sun wrote you a single letter. It asked only: are the Jingzhou bows any good?"},"when":{"v":"rel.sunfuren.trust","op":">=","val":4}},{"id":"cold","text":{"zh":"孙夫人走的那天，没有回头看一眼。","en":"The day Lady Sun left, she never looked back."},"when":{"all":[{"all":[{"v":"track","op":"!=","val":"cao"},{"v":"flag.v2_hermit","op":"!=","val":true},{"v":"flag.v2_exposed","op":"!=","val":true},{"v":"flag.v2_left","op":"!=","val":true}]},{"v":"rel.sunfuren.warmth","op":"<=","val":0}]}},{"id":"plain","text":{"zh":"孙夫人回了东吴，再也没有回来。","en":"Lady Sun went back to Wu and never came back."},"when":{"all":[{"v":"track","op":"!=","val":"cao"},{"v":"flag.v2_hermit","op":"!=","val":true},{"v":"flag.v2_exposed","op":"!=","val":true},{"v":"flag.v2_left","op":"!=","val":true}]}}]},{"id":"g_wenzhi","title":{"zh":"温芷","en":"Wen Zhi"},"fragments":[{"id":"child","text":{"zh":"成都城西的小院里，温芷种的当归开了花。她说，等孩子会走路了，就教他认药。","en":"In the little yard on the west side of Chengdu, Wen Zhi's angelica has flowered. She says that once the child can walk, she'll teach him the herbs."},"when":{"v":"flag.wz_child","op":"==","val":true},"mood":"romance"},{"id":"west","text":{"zh":"温芷跟着大军走过了蜀道。她说，路是难，可也没传说的那么难。","en":"Wen Zhi crossed the Shu roads with the army. Hard, she says, but not as hard as the stories."},"when":{"v":"flag.wz_west","op":"==","val":true}},{"id":"jingzhou","text":{"zh":"温芷留在荆州，在关羽的营里做大夫。她的信一个月一封，从不说想你。","en":"Wen Zhi stayed in Jingzhou as physician to Guan Yu's army. Her letters come once a month and never say she misses you."},"when":{"v":"flag.wz_jingzhou","op":"==","val":true}},{"id":"north","text":{"zh":"每年冬至，你都会收到一包止血散，从北方寄来，没有信。","en":"Every year at the solstice a packet of wound powder comes from the north, with no letter."},"when":{"any":[{"v":"flag.wenzhi_safe","op":"==","val":true},{"v":"flag.wenzhi_warned","op":"==","val":true}]}},{"id":"together","text":{"zh":"你和温芷在许都安了家。她在药圃里晒当归，你在丞相府起草文书。","en":"You and Wen Zhi have made a home in Xuchang. She dries angelica in the herb garden; you draft documents for the Chancellor."},"when":{"all":[{"v":"track","op":"==","val":"cao"},{"v":"flag.wenzhi_together","op":"==","val":true}]},"mood":"romance"},{"id":"used","text":{"zh":"温芷再没回过信。","en":"Wen Zhi never wrote again."},"when":{"v":"flag.wenzhi_used","op":"==","val":true}},{"id":"far","text":{"zh":"你很久没有温芷的消息了。","en":"You haven't heard from Wen Zhi in a long time."}}]},{"id":"g_lives","title":{"zh":"因你而不同的人","en":"Lives You Changed"},"mode":"all","fragments":[{"id":"weiyan","text":{"zh":"魏延记得长沙城里是谁替他说的话。这件事，以后还会有人提起。","en":"Wei Yan remembers who spoke for him at Changsha. Someone will bring it up again one day."},"when":{"v":"flag.pleaded_weiyan","op":"==","val":true}},{"id":"zhaoyun","text":{"zh":"赵云后来娶了妻，喜酒请你坐了上席。","en":"Zhao Yun married in the end, and gave you the seat of honor at the wedding."},"when":{"all":[{"v":"flag.zy_refused","op":"==","val":true},{"v":"rel.zhaoyun.warmth","op":">=","val":4}]}},{"id":"zhangsong","text":{"zh":"张松死后，他的那张地图一直挂在刘备的书房里。","en":"After Zhang Song died, his map hung in Liu Bei's study for years."},"when":{"any":[{"v":"flag.honored_zs","op":"==","val":true},{"v":"rel.zhangsong.esteem","op":">=","val":3}]}},{"id":"tongguan","text":{"zh":"曹操一直记得潼关那件外袍。","en":"Cao Cao never forgot the cloak at Tongguan."},"when":{"v":"flag.saved_cao","op":"==","val":true}},{"id":"defected","text":{"zh":"你是随张松一起离开曹营的。许都那边，再没人提你的名字。","en":"You left Cao's camp with Zhang Song. In Xuchang, no one speaks your name again."},"when":{"v":"flag.defected","op":"==","val":true}},{"id":"owes","text":{"zh":"关羽说，欠你的，他记在心里。","en":"Guan Yu says what he owes you, he keeps in his heart."},"when":{"all":[{"any":[{"v":"flag.vouched_guan","op":"==","val":true},{"v":"flag.pleaded_guan","op":"==","val":true}]},{"v":"rel.guanyu.warmth","op":">=","val":4}]}},{"id":"lusu","text":{"zh":"鲁肃一直留着那张约。每次来荆州，都要拿出来看一看。","en":"Lu Su kept that agreement. Every time he came to Jingzhou he took it out and looked at it."},"when":{"v":"flag.promised_return","op":"==","val":true}},{"id":"guan","text":{"zh":"关羽那句『我不能丢』，你后来想起过很多次。","en":"You thought often, later, about Guan Yu saying: that's why I can't lose it."},"when":{"v":"flag.guan_charge","op":"==","val":true}}]},{"id":"g_name","title":{"zh":"名声","en":"Your Name"},"fragments":[{"id":"uncanny","text":{"zh":"蜀中有人叫你先生，有人叫你妖人。","en":"In Shu some call you Master; some call you sorcerer."},"when":{"v":"uncanny","op":">=","val":4}},{"id":"rash","text":{"zh":"人说子衡口无遮拦。喜欢你的人说你真，怕你的人说你狂。","en":"People say Ziheng can't hold his tongue. Those who like you call it honesty; those who fear you call it madness."},"when":{"v":"renown.rash","op":">=","val":4}},{"id":"loyal","text":{"zh":"人说子衡重义。","en":"People say Ziheng keeps faith."},"when":{"v":"renown.loyal","op":">","val":"@renown.cunning"}},{"id":"cunning","text":{"zh":"人说子衡多智，也说子衡心深。","en":"People say Ziheng is clever, and that his mind runs deep."},"when":{"v":"renown.cunning","op":">","val":"@renown.loyal"}},{"id":"none","text":{"zh":"史书里没有你的传，只有几处『或曰』。","en":"The histories give you no biography—just a few lines beginning 'some say.'"}}]},{"id":"g_history","title":{"zh":"天下","en":"The Realm"},"fragments":[{"id":"far","text":{"zh":"说书人讲到荆州和西川，有好几处讲不顺——那几处，都是你。","en":"When storytellers reach Jingzhou and the west, several places never quite fit. Those places are you."},"when":{"v":"deviation","op":">=","val":5}},{"id":"near","text":{"zh":"刘备有了荆州，也有了益州。天下三分，和书上写的差不多。","en":"Liu Bei has Jingzhou, and now Yi as well. The realm is split in three, much as the books say."}}]}],"future_terms":[{"term":{"zh":"单刀赴会","en":"the meeting with a single sword"},"from":"v3"},{"term":{"zh":"定军山","en":"Mount Dingjun"},"from":"v3"},{"term":{"zh":"汉中王","en":"King of Hanzhong"},"from":"v3"},{"term":{"zh":"水淹七军","en":"the flooding of the seven armies"},"from":"v4"},{"term":{"zh":"刮骨疗毒","en":"scraping the bone"},"from":"v4"},{"term":{"zh":"麦城","en":"Maicheng"},"from":"v4"},{"term":{"zh":"夷陵","en":"Yiling"},"from":"v5"},{"term":{"zh":"白帝","en":"Baidi"},"from":"v5"},{"term":{"zh":"托孤","en":"entrusting the heir"},"from":"v5"},{"term":{"zh":"七擒","en":"seven captures"},"from":"v6"},{"term":{"zh":"出师表","en":"the Memorial on Going to War"},"from":"v7"},{"term":{"zh":"街亭","en":"Jieting"},"from":"v7"},{"term":{"zh":"空城计","en":"the empty fort"},"from":"v7"},{"term":{"zh":"五丈原","en":"Wuzhang Plains"},"from":"v7"},{"term":{"zh":"落凤坡","en":"Fallen Phoenix Slope"},"from":"c7"}],"ending_art":{"scene":"ending","layers":[{"id":"city","when":{"v":"flag.post_chengdu","op":"==","val":true}},{"id":"home","when":{"any":[{"v":"flag.wz_child","op":"==","val":true},{"v":"flag.wz_west","op":"==","val":true}]}},{"id":"lone","when":{"any":[{"v":"flag.v2_hermit","op":"==","val":true},{"v":"flag.v2_left","op":"==","val":true},{"v":"flag.v2_exposed","op":"==","val":true}]}},{"id":"sail","when":{"v":"flag.post_jingzhou","op":"==","val":true}},{"id":"two_boat","when":{"v":"flag.wz_jingzhou","op":"==","val":true}}]},"art_prompts":{"garden":{"zh":"水墨淡彩，宽幅。许都后园，青梅枝从左上探入，远处城墙，右侧小亭中二人对坐煮酒，雷雨将至。图层：雷雨（闪电、雨丝）。","en":"Chinese ink wash with light color, wide banner. A walled garden in Xuchang: green-plum branches from the upper left, distant city wall, two men seated drinking in a small pavilion on the right, storm gathering. Layer: storm (lightning, rain)."},"lamp":{"zh":"夜，窗格内一灯如豆，一人跪坐读书，窗外竹影。图层：案上一道红色血诏。","en":"Night. Through a lattice window a single lamp, a seated man reading, bamboo shadows outside. Layer: a red silk edict on the desk."},"herbs":{"zh":"药圃，圆形月洞门，竹匾晒药，一名医女。图层：同行男子；春日落花；粉色花瓣（恋爱时刻）。","en":"Herb garden with a round moon gate, bamboo drying trays, a woman physician. Layers: a man beside her; spring blossoms; pink petals (romance moment)."},"road":{"zh":"平原大路，行军队列与红旗，远处许都城墙。图层：远处尘土中的追骑。","en":"A plain with a marching column and red banners, Xuchang's walls in the distance. Layer: pursuing riders in a dust cloud."},"letter":{"zh":"夜，烛光书案，信笺、毛笔、砚台。图层：药包；朱印；窗外江面火光。","en":"Night desk by candlelight: letter, brush, inkstone. Layers: medicine packet; red seal; river glow through a window."},"hill":{"zh":"土山被围，山顶一将与两位女眷，山下敌营红旗，一骑来劝降。图层：一骑从山后小路突围。","en":"A surrounded earthen hill: a general and two ladies on top, enemy tents with red flags below, a lone rider approaching to parley. Layer: a rider escaping down the back path."},"hall":{"zh":"厅堂内景，梁柱，门外天光。图层：梁上悬印、贴封条的箱笼；一匹赤红骏马。","en":"Hall interior, beams and pillars, daylight through the door. Layers: an official seal hanging from a beam and sealed chests; a red warhorse."},"camp":{"zh":"北方营寨，群山，蓝红旗帜林立。","en":"A northern army camp among mountains, forests of blue and red banners."},"mirror":{"zh":"竹林溪畔，隐士抚琴，二客远立。","en":"Bamboo grove by a stream, a recluse playing the zither, two visitors standing at a distance."},"snow":{"zh":"雪中茅庐，篱笆，门外数人立雪等候。图层：第四人（徐庶）。","en":"A thatched cottage in snow with a fence, several men waiting outside. Layer: a fourth man (Xu Shu)."},"bridge":{"zh":"长坂桥，一将横矛立马桥上，桥东树林，百姓奔逃。图层：林中尘土（疑兵）；白袍骑将救人。","en":"Changban bridge: a general with a spear on horseback on the bridge, woods to the east, fleeing civilians. Layers: dust in the woods (feint); a white-robed rider rescuing."},"slope":{"zh":"山坡上曹操与旌旗，坡下枪阵，一白袍将怀抱婴儿突围。图层：阵边缺口中逃出的车辆。","en":"Cao Cao and banners on a hilltop, spear ranks below, a white-robed general breaking through with an infant. Layer: carts escaping through a gap."},"fog":{"zh":"大雾江面，远岸营火。图层：插满箭的草船。","en":"Fog on the river, distant campfires. Layer: straw boats bristling with arrows."},"fire":{"zh":"赤壁夜江，铁索连舟。图层：火攻与红天；火船；后营空/后营起火；提灯小舟（接人）；下游未连锁的船。","en":"Night river at Red Cliffs, ships chained together. Layers: fire and red sky; fire ships; rear camp empty or burning; a small boat with a lantern (rescue); unchained ships downstream."},"huarong":{"zh":"华容道，两侧峭壁，泥泞小路，残兵队列，一将立马拦路。图层：背药箱的女子在队尾。","en":"Huarong road between cliffs, a muddy path, a column of defeated soldiers, a general blocking the way on horseback. Layer: a woman with a medicine chest at the rear."},"campfire":{"zh":"夜营篝火，帐篷剪影，二人对坐火边，火星飞起。图层：城楼（古城）；横在膝上的刀。","en":"A night camp: a fire with sparks, tent silhouettes, two men seated by the fire. Layers: a city wall (Gucheng); a blade across the knees."},"riverbank":{"zh":"战后夜江，水面漂着焦木，远处余火，江边一名女子洗药杵。图层：身旁一名男子。","en":"The river at night after battle: charred timbers drifting, distant embers, a woman washing a pestle at the water's edge. Layer: a man beside her."},"ending":{"zh":"尾声：晨江远山，红日。图层：两人同舟；江边茅屋炊烟；城郭；独立江岸；梅枝；远帆。","en":"Epilogue: river and mountains at dawn, red sun. Layers: two people in a boat; a cottage with smoke; city walls; a lone figure on the shore; plum branch; distant sail."},"citywall":{"zh":"水墨淡彩，宽幅。城墙与城门，城上旗帜。图层：攻城的长梯与枪林；刘字绿旗或东吴红旗；城门洞开；城下人群；黄昏。","en":"Ink and wash, wide. A city wall and gate with banners. Layers: siege ladders and spears; Liu's green banners or Wu's red; open gate; crowd below; dusk."},"temple":{"zh":"山寺，松树，亭台，主客数人。图层：廊下暗藏的刀斧手；被劈开的石头。","en":"Hillside temple, pines, pavilions, a few figures. Layers: axemen hidden in the corridor; a split rock."},"bigriver":{"zh":"大江上一艘大船，船上女子与侍从。图层：小船上的武将；怀中孩子；横江拦截的船队与绿旗；东吴的红旗船。","en":"A large ship on the river, a woman and attendants aboard. Layers: a general on a small boat; a child; a blockade of boats with green banners; Wu's red-bannered ships."},"mourning":{"zh":"夜，灵堂，白幡，灵位与烛火，一人跪拜。图层：两侧吊客；角落一个相貌古怪的人。","en":"Night, a mourning hall, white banners, spirit tablet and candles, one figure kneeling. Layers: mourners on both sides; an odd-looking man in the corner."},"ravine":{"zh":"竹林夹道的山间小路，一骑白马。图层：箭雨；倒地的随从；勒马回头。","en":"A narrow hill path between bamboo, a rider on a white horse. Layers: a hail of arrows; a fallen companion; the rider turning back."}},"frag_face":{"g_lord":{"high":["liubei","warm"],"mid":["liubei","neutral"],"low":["liubei","cold"],"cao":["caocao","cold"]},"g_zhouyu":{"lives":["zhouyu","warm"],"esteem":["zhouyu","sad"],"rival":["zhouyu","cold"],"plain":["zhouyu","sad"]},"g_pangtong":{"alive":["pangtong","warm"],"words":["pangtong","sad"],"dead":["pangtong","sad"]},"g_sun":{"parted":["sunfuren","warm"],"cold":["sunfuren","cold"],"plain":["sunfuren","neutral"]},"g_wenzhi":{"child":["wenzhi","shy"],"west":["wenzhi","warm"],"jingzhou":["wenzhi","neutral"],"north":["wenzhi","sad"],"far":["wenzhi","sad"]}},"portrait_prompts":{"liubei":{"zh":"水墨淡彩半身像，四十岁左右的汉室宗亲，面如冠玉，两耳垂肩，短须，小冠，青灰色交领长袍。表情：平静/温和/冷淡/忧伤/吃惊。","en":"Ink-wash bust portrait: an imperial kinsman around forty, fair face, very long earlobes, short beard, small crown, grey-green crossed-collar robe. Expressions: neutral / warm / cold / sad / surprised."},"guanyu":{"zh":"水墨淡彩半身像，面如重枣，丹凤眼，卧蚕眉，长髯过胸，绿头巾，绿袍。表情同上。","en":"Ink-wash bust portrait: face the deep red of a jujube, phoenix eyes, thick 'silkworm' brows, a beard past the chest, green headscarf and green robe. Same expressions."},"caocao":{"zh":"水墨淡彩半身像，丞相，细眼，长须，高冠，深红黑色官袍。表情同上。","en":"Ink-wash bust portrait: the Chancellor, narrow eyes, long thin beard, tall official hat, dark red-black robe. Same expressions."},
