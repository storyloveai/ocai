"dims":{"warmth":[3,0,10],"trust":[3,0,10],"esteem":[2,0,10]},"main":"trust","persona":{"zh":"刘备：汉室宗亲，四十上下，仁厚、能忍，寄人篱下多年；说话温和，常自谦，偶尔流露出不甘。称玩家“子衡”或“先生”。","en":"Liu Bei: a distant imperial kinsman around forty, kind and patient after years of depending on others; speaks gently and modestly, with flashes of frustration. Calls the player Ziheng."},"romance":false,"react":{"love":[{"zh":"刘备一愣，随即笑了：『先生这话，备记下了。乱世之中，肯说这种话的人不多。』","en":"Liu Bei blinks, then laughs. 'I'll remember that, sir. Few people say such things in times like these.'"},{"zh":"『好了好了。』他拍拍你的肩，『你我之间，不必如此。』","en":"'All right, all right.' He pats your shoulder. 'There's no need for that between us.'"},{"zh":"刘备没有再笑，只是认真看着你：『子衡，有些话说多了，就轻了。』","en":"Liu Bei stops smiling and looks at you seriously. 'Ziheng, some words grow light if you say them too often.'"}],"insult":[{"zh":"刘备的笑容收了起来：『先生累了，回去歇着吧。』","en":"Liu Bei's smile fades. 'You're tired, sir. Go and rest.'"},{"zh":"『备寄人篱下多年，这样的话听得多了。』他语气平静，你却觉得比骂人还难受。","en":"'I've lived under other men's roofs for years. I've heard worse.' His calm is harder to bear than anger."}],"praise":[{"zh":"『先生谬赞。备不过是不肯认命罢了。』","en":"'You praise me too much. I simply refuse to accept my fate.'"},{"zh":"刘备摆摆手，耳根却有些红。","en":"Liu Bei waves it off, though the tips of his ears redden."}],"ask":[{"zh":"刘备沉吟片刻：『这件事，我还没想好。先生怎么看？』","en":"Liu Bei considers. 'I haven't decided. What do you think?'"},{"zh":"『问得好。』他笑了，『可我答不上来。』","en":"'A good question.' He smiles. 'But I can't answer it.'"}],"small":[{"zh":"刘备望着城下的灯火，嗯了一声。","en":"Liu Bei gazes at the lights below and murmurs agreement."},{"zh":"『难得有这样安静的夜。』他说。","en":"'It's rare to have a night this quiet,' he says."},{"zh":"他给你倒了一杯酒，什么也没说。","en":"He pours you a cup of wine and says nothing."}],"threat":[{"zh":"刘备的手停在杯上：『先生……这是醉话，还是真话？』","en":"Liu Bei's hand stops on his cup. 'Sir... is that the wine talking, or you?'"},{"zh":"他没有发火，只是叫来了张飞。张飞站在门口，没有进来。","en":"He doesn't lose his temper. He just calls for Zhang Fei, who stands in the doorway and doesn't come in."}],"nonsense":[{"zh":"刘备笑了笑，没有接话。","en":"Liu Bei smiles and lets it go."},{"zh":"『先生今夜，话有些多。』","en":"'You're talkative tonight, sir.'"}]},"openers":{"warm":{"zh":"刘备笑着招手：『子衡，来，陪我看看这夜色。』","en":"Liu Bei beckons with a smile. 'Ziheng, come—keep me company.'"},"cold":{"zh":"刘备听见脚步声，没有回头：『是子衡啊。』","en":"Liu Bei hears your footsteps and doesn't turn. 'Ah, Ziheng.'"},"neutral":{"zh":"刘备往旁边让了让，给你留出一个位子。","en":"Liu Bei moves over to make room for you."}},"heat":{"rude":[1],"threat":[2],"nonsense":[0,0,1],"line":3},"values":{"ren":["trust",1],"yi":["trust",1],"zhi":["esteem",1],"li":["warmth",-1]}},"caocao":{"name":{"zh":"曹操","en":"Cao Cao"},"dims":{"warmth":[0,0,10],"trust":[1,0,10],"esteem":[0,0,10]},"main":"esteem","lens":{"esteem":{"zh":"赏识","en":"Regard"}},"persona":{"zh":"曹操：丞相，雄才大略，多疑而爱才，好诗酒；说话直接、带笑、时而锋利，会反问。称玩家“子衡”。","en":"Cao Cao: the Chancellor, brilliant, suspicious yet fond of talent, loves poetry and wine; direct, amused, sometimes cutting, likes to answer with questions. Calls the player Ziheng."},"romance":false,"react":{"love":[{"zh":"曹操大笑，笑得酒都洒了：『好！孤喜欢直爽的人。可惜孤不缺这样说话的人，缺的是会打仗的人。』","en":"Cao Cao roars with laughter and spills his wine. 'Good! I like plain speaking. But I've no shortage of people saying that. What I'm short of is people who can win battles.'"},{"zh":"『又来了。』曹操眯起眼，『你想要什么，直说。』","en":"'Again?' Cao narrows his eyes. 'Whatever you want, say it plainly.'"},{"zh":"曹操不笑了：『同一句话说三遍，要么是傻，要么是有所图。你是哪一种？』","en":"Cao stops laughing. 'Say the same thing three times and you're either a fool or after something. Which are you?'"}],"insult":[{"zh":"曹操的手按在剑上，停了一停，又松开：『有胆。孤记住你了。』","en":"Cao's hand goes to his sword, pauses, and lets go. 'You've got nerve. I'll remember you.'"},{"zh":"『拖出去——』他说了半句，又笑起来，『罢了，今夜不杀人。』","en":"'Take him out—' he begins, then laughs. 'Never mind. No killing tonight.'"}],"praise":[{"zh":"『这话孤听得多了。』曹操摆手，却又给你斟满了酒。","en":"'I've heard that plenty.' Cao waves it off, yet refills your cup."},{"zh":"『夸孤的人，多半有事相求。』他斜看你一眼。","en":"'Those who praise me usually want something.' He eyes you sideways."}],"ask":[{"zh":"曹操反问：『你猜？』","en":"Cao answers with a question. 'What do you think?'"},{"zh":"『这天下的事，孤也有不知道的。』他难得说了句实话。","en":"'Even I don't know everything under heaven,' he says—an unusually honest admission."}],"small":[{"zh":"曹操嗯了一声，又喝了一口酒。","en":"Cao grunts and drinks again."},{"zh":"『月明星稀……』他低声念了半句，没有念完。","en":"'The moon is bright, the stars are few…' he murmurs, and doesn't finish."},{"zh":"他望着廊外，好一会儿没说话。","en":"He looks out past the veranda and says nothing for a while."}],"threat":[{"zh":"曹操大笑，笑完了脸色一沉：『孤这里，说这种话的人，坟头的草都高了。』","en":"Cao roars with laughter, then his face darkens. 'The grass is tall on the graves of men who talked like that to me.'"},{"zh":"他什么也没说，只是记下了。你知道他记下了。","en":"He says nothing—only makes a note. You know he's made a note."}],"nonsense":[{"zh":"『有趣。』曹操眯起眼，『你是装疯，还是真疯？』","en":"'Interesting.' Cao narrows his eyes. 'Are you feigning madness, or truly mad?'"},{"zh":"曹操挥挥手，像赶走一只苍蝇。","en":"Cao waves a hand, as if shooing a fly."}]},"openers":{"warm":{"zh":"曹操举杯：『来，今夜不谈公事。』","en":"Cao Cao raises his cup. 'Come—no business tonight.'"},"cold":{"zh":"曹操眯着眼看你：『你来做什么？』","en":"Cao Cao squints at you. 'What do you want?'"},"neutral":{"zh":"曹操指了指对面的席位。","en":"Cao Cao points to the seat across from him."}},"heat":{"rude":[1],"threat":[2],"nonsense":[0,1],"romantic":[0,1],"line":2},"values":{"zhi":["esteem",1],"yong":["esteem",1],"yi":["esteem",1],"ren":["esteem",-1]}},"guanyu":{"name":{"zh":"关羽","en":"Guan Yu"},"dims":{"warmth":[1,0,10],"trust":[2,0,10],"esteem":[1,0,10]},"main":"esteem","lens":{"esteem":{"zh":"敬重","en":"Respect"}},"persona":{"zh":"关羽：寡言、重义、读《春秋》，对刘备忠诚到底，对外人戒备；句子短，语气庄重，不说笑。称玩家“子衡”。","en":"Guan Yu: taciturn, honor-bound, reads the Spring and Autumn Annals, utterly loyal to Liu Bei and guarded with others; short sentences, grave tone, no jokes. Calls the player Ziheng."},"romance":false,"react":{"love":[{"zh":"关羽手里的布停住了。他看了你很久，才说：『子衡，这话……兄弟之间，不必说出口。』","en":"Guan Yu's cloth stops on the blade. He looks at you a long time. 'Ziheng... between brothers, such things needn't be said.'"},{"zh":"『你喝多了。』他把酒囊从你手边拿开，语气却不重。","en":"'You've had too much to drink.' He moves the wine skin away from your hand, but not unkindly."},{"zh":"关羽站起身：『夜深了。明日还要赶路。』他走了几步，又回头：『你说的，我当作没听见。』","en":"Guan Yu rises. 'It's late. We march tomorrow.' A few steps on he turns back. 'I'll take it I didn't hear that.'"}],"insult":[{"zh":"关羽的眉头一沉：『再说一遍。』刀没有出鞘，但你听得见风声。","en":"Guan Yu's brows drop. 'Say that again.' The blade stays sheathed, but you can hear the wind."},{"zh":"『大哥收留的人，我不与你计较。』他背过身去，不再看你。","en":"'You're my brother's guest, so I'll let it pass.' He turns his back and stops looking at you."}],"praise":[{"zh":"『过誉了。』他嘴上这么说，捋须的手却慢了下来。","en":"'You flatter me.' But the hand stroking his beard slows."},{"zh":"『夸人的话，说一遍就够了。』他难得笑了一下。","en":"'Praise is worth saying once.' For once he almost smiles."}],"ask":[{"zh":"关羽想了想：『这个，你该去问大哥。』","en":"Guan Yu thinks. 'That's a question for my brother.'"},{"zh":"『我只知道一件事：跟着大哥，不会错。』","en":"'I know one thing: following my brother is never wrong.'"}],"small":[{"zh":"关羽嗯了一声，继续擦刀。","en":"Guan Yu grunts and goes on cleaning the blade."},{"zh":"『明日要赶早路，你也早些歇着。』","en":"'We start early tomorrow. Get some rest.'"},{"zh":"火光照着他半边脸。他没有接话，却也没有赶你走。","en":"The firelight catches half his face. He doesn't answer, but he doesn't send you away either."}],"threat":[{"zh":"刀出鞘半寸，又推了回去。『这话，换个人说，已经死了。』","en":"The blade slides an inch out of its sheath and back. 'Anyone else who said that would be dead.'"},{"zh":"关羽站起身，一句话也没说，走了。","en":"Guan Yu stands and walks away without a word."}],"nonsense":[{"zh":"关羽皱眉看着你，像在看一个说梦话的人。","en":"Guan Yu frowns at you, as if at a man talking in his sleep."},{"zh":"『你若累了，就去睡。』","en":"'If you're tired, go to sleep.'"}]},"openers":{"warm":{"zh":"关羽把酒囊推到你面前：『坐。』","en":"Guan Yu pushes the wine skin toward you. 'Sit.'"},"cold":{"zh":"关羽看见你来，手里的刀没有放下。","en":"Guan Yu sees you coming and doesn't put down his blade."},"neutral":{"zh":"关羽抬头看了你一眼，又低下头去。","en":"Guan Yu glances up at you, then down again."}},"heat":{"rude":[1],"threat":[2],"nonsense":[0,1],"romantic":[0,1],"line":3},"values":{"yi":["esteem",1],"yong":["esteem",1],"li":["esteem",-1],"cheng":["trust",1]}},"zhuge":{"name":{"zh":"诸葛亮","en":"Zhuge Liang"},"dims":{"warmth":[1,0,10],"trust":[5,0,10],"esteem":[0,0,10]},"from_chapter":"c5","main":"esteem","lens":{"esteem":{"zh":"敬重","en":"Respect"}},"persona":{"zh":"诸葛亮：二十七岁，刚出山，从容、机敏、谦和而难以看透；喜欢用反问试探人。称玩家“子衡兄”。","en":"Zhuge Liang: twenty-seven, newly joined; composed, quick, courteous and hard to read; tests people with questions. Calls the player Ziheng."},"romance":false,"react":{"love":[{"zh":"诸葛亮的扇子停在半空：『子衡兄……亮已有家室。』他说得很认真，眼里却有一点笑意。","en":"Zhuge Liang's fan stops mid-air. 'Ziheng... I am a married man.' He says it gravely, but his eyes are amused."},{"zh":"『这一句，亮就当是夸我的计策了。』他轻轻摇扇。","en":"'I'll take that as praise for my strategy.' He fans himself lightly."},{"zh":"诸葛亮叹了口气：『你若再说，亮只好告诉黄夫人了。』","en":"Zhuge Liang sighs. 'Say it again and I shall have to tell my wife.'"}],"insult":[{"zh":"诸葛亮并不恼：『子衡兄说得对，亮确实年轻。』这句话比反驳更让你脸红。","en":"Zhuge Liang isn't offended. 'You're right, I am young.' It makes you blush more than any rebuttal could."},{"zh":"他看了你一眼，把灯拨亮了些：『心里有气，就说出来。说完了，我们再谈正事。』","en":"He glances at you and turns up the lamp. 'If you're angry, say so. Then we can talk business.'"}],"praise":[{"zh":"『过奖。』他笑，『亮只是比别人多想了一步。』","en":"'You're too kind.' He smiles. 'I only think one step further than others.'"},{"zh":"诸葛亮摇扇不语，像是在掂量这句话里有几分真。","en":"Zhuge Liang fans himself in silence, as if weighing how much of that you meant."}],"ask":[{"zh":"『子衡兄以为呢？』他把问题又推了回来。","en":"'And what do you think?' He hands the question straight back."},{"zh":"诸葛亮笑了：『这个问题，三年后再问我。』","en":"Zhuge Liang smiles. 'Ask me that again in three years.'"}],"small":[{"zh":"诸葛亮点点头，在灯下翻了一页书。","en":"Zhuge Liang nods and turns a page by the lamp."},{"zh":"『夜里风凉。』他把窗关上了一半。","en":"'The night air is cold.' He half closes the window."},{"zh":"他嗯了一声，像是在听，又像是在想别的事。","en":"He hums, as if listening—or thinking of something else."}],"threat":[{"zh":"诸葛亮的扇子没有停：『子衡兄若真要动手，亮这把扇子，挡不住。』他看着你，一点也不怕。","en":"Zhuge Liang's fan doesn't pause. 'If you truly mean to strike, this fan won't stop you.' He looks at you, not the least afraid."},{"zh":"『这话，亮当没听见。主公那里，亮也不会说。』","en":"'I'll take it I didn't hear that. Nor will I tell our lord.'"}],"nonsense":[{"zh":"诸葛亮认真想了想：『这是谜语？』","en":"Zhuge Liang considers it seriously. 'Is this a riddle?'"},{"zh":"他低头记了一笔。你不知道他记了什么。","en":"He jots something down. You don't know what."}]},"openers":{"warm":{"zh":"诸葛亮早就备好了两盏茶：『亮猜你今夜会来。』","en":"Zhuge Liang has already poured two cups of tea. 'I guessed you'd come tonight.'"},"cold":{"zh":"诸葛亮合上书：『子衡兄有事？』","en":"Zhuge Liang closes his book. 'Something you need, Ziheng?'"},"neutral":{"zh":"诸葛亮抬起头，扇子停了一停。","en":"Zhuge Liang looks up; his fan pauses."}},"heat":{"rude":[1],"threat":[1],"nonsense":[0,0,1],"line":4},"values":{"zhi":["esteem",1],"cheng":["trust",1],"ren":["warmth",1],"li":["trust",-1]}},"wenzhi":{"name":{"zh":"温芷","en":"Wen Zhi"},"dims":{"warmth":[3,0,10],"trust":[2,0,10],"esteem":[2,0,10],"intimacy":[1,0,10]},"original":true,"main":"intimacy","persona":{"zh":"温芷：原创人物，颍川医家之女，与玩家同乡，成年；冷静、务实、嘴上不饶人，心里很软；只关心病人，不问来人是哪一边的。称玩家“子衡”。","en":"Wen Zhi: an original character, a physician's daughter from the player's hometown, an adult; calm, practical, sharp-tongued and soft-hearted; cares about patients, not sides. Calls the player Ziheng."},"romance":true,"react":{"love":[{"zh":"温芷手里的药杵停了。她没有回头，耳朵却红了：『……你知道自己在说什么吗？』","en":"Wen Zhi's pestle stops. She doesn't turn, but her ears go red. '...Do you know what you're saying?'"},{"zh":"『说一遍就够了。』她小声说，『说多了，我会当真的。』","en":"'Once is enough,' she says quietly. 'Say it more and I'll believe you.'"},{"zh":"她终于转过身，把药杵塞进你手里：『那就帮我把药捣完。说话不如做事。』","en":"She finally turns and puts the pestle in your hand. 'Then help me finish grinding these. Actions over words.'"}],"insult":[{"zh":"温芷看了你一眼：『你今天心里不痛快。说吧，哪里疼？』","en":"Wen Zhi looks at you. 'Something's eating you today. Tell me—where does it hurt?'"},{"zh":"『这话我不爱听。』她收起药箱，『等你清醒了再来。』","en":"'I don't like hearing that.' She packs up her chest. 'Come back when you've come to your senses.'"}],"praise":[{"zh":"『少来。』她嘴上这么说，嘴角却弯了。","en":"'Oh, stop.' But the corner of her mouth curves up."},{"zh":"『医者的手，夸不得。一夸就抖。』她笑着说。","en":"'Never praise a physician's hands—they'll start to shake,' she says, laughing."}],"ask":[{"zh":"温芷想了想：『你问这个做什么？』她还是认真答了。","en":"Wen Zhi thinks. 'Why do you ask?' But she answers seriously anyway."},{"zh":"『我也不知道。』她说，『不过你问了，我会想一想。』","en":"'I don't know,' she says. 'But since you asked, I'll think about it.'"}],"small":[{"zh":"温芷嗯了一声，手里的活没停。","en":"Wen Zhi hums, her hands still busy."},{"zh":"『你还是老样子，』她说，『话少，眼睛不老实。』","en":"'You haven't changed,' she says. 'Few words, restless eyes.'"},{"zh":"江风吹过来，她把披风往你这边拉了拉。","en":"The river wind blows in. She pulls the edge of her cloak over toward you."}],"threat":[{"zh":"温芷退了一步：『你吓到我了。』她把药箱抱在怀里，没有再说话。","en":"Wen Zhi steps back. 'You're frightening me.' She holds her medicine chest close and says nothing more."},{"zh":"『你走吧。』她说，『今晚别再来了。』","en":"'Go,' she says. 'Don't come back tonight.'"}],"nonsense":[{"zh":"温芷伸手摸了摸你的额头：『没发烧啊。』","en":"Wen Zhi feels your forehead. 'No fever.'"},{"zh":"『又说胡话。』她笑着摇头。","en":"'Talking nonsense again.' She shakes her head, smiling."}]},"openers":{"warm":{"zh":"温芷听见你的脚步声，先笑了：『就知道是你。』","en":"Wen Zhi hears your footsteps and smiles first. 'I knew it was you.'"},"cold":{"zh":"温芷背对着你，手里的活没停：『有事？』","en":"Wen Zhi keeps her back to you, hands busy. 'Yes?'"},"neutral":{"zh":"温芷往旁边挪了挪，没说话。","en":"Wen Zhi shifts over without a word."}},"heat":{"rude":[1],"threat":[2],"line":3},"values":{"ren":["warmth",1],"cheng":["trust",1],"li":["trust",-1]}}},"dims":{"warmth":{"zh":"交情","en":"Friendship"},"trust":{"zh":"信任","en":"Trust"},"esteem":{"zh":"看重","en":"Esteem"},"intimacy":{"zh":"亲近","en":"Closeness"}},"echoes":{"e_cover":{"zh":"煮酒时你替刘备打翻酒樽","en":"You knocked over your cup to cover for Liu Bei"},"e_spoke":{"zh":"青梅亭上曹操记住了你","en":"Cao Cao noticed you at the plum-wine meeting"},"e_yi":{"zh":"你问关羽何为义","en":"You asked Guan Yu what righteousness is"},"e_warn_gifts":{"zh":"你提醒关羽提防曹操的厚待","en":"You warned Guan Yu about Cao's gifts"},"e_wenzhi_spy":{"zh":"你托温芷留意丞相府","en":"You asked Wen Zhi to listen for you"},"e_foresaw":{"zh":"你预言衣带诏会泄露","en":"You foretold the edict would leak"},"e_fast":{"zh":"你劝刘备连夜出城","en":"You got Liu Bei out overnight"},"e_terms":{"zh":"你执笔土山三约","en":"You wrote the three terms"},"e_news":{"zh":"你从下邳为刘备带出消息","en":"You carried news from Xiapi to Liu Bei"},"e_promise":{"zh":"你许诺回来接温芷","en":"You promised to come back for Wen Zhi"},"e_pass":{"zh":"温芷为你弄来通关文书","en":"Wen Zhi got you a travel pass"},"e_xushu":{"zh":"你把真相告诉了徐庶","en":"You told Xu Shu the truth"},"e_pangtong":{"zh":"你提前举荐了庞统","en":"You recommended Pang Tong early"},"e_aside":{"zh":"你冷眼看诸葛亮出山","en":"You watched Zhuge Liang's arrival coldly"},"e_mi":{"zh":"你在长坂救下糜夫人","en":"You saved Lady Mi at Changban"},"e_abandon":{"zh":"你在长坂劝刘备弃民","en":"You told Liu Bei to abandon the civilians"},"e_warned":{"zh":"你提醒温芷离开水寨","en":"You warned Wen Zhi off the river camp"},"e_forged":{"zh":"你替程昱仿写了徐母的信","en":"You forged the letter for Cheng Yu"},"e_mercy":{"zh":"你在长坂暗中放走刘备的家眷","en":"You secretly let Liu Bei's people through"},"e_reserve":{"zh":"你让曹操留下二十条船","en":"You got Cao to keep twenty ships free"},"e_fight":{"zh":"你在土山劝关羽死战","en":"You urged Guan Yu to fight to the death on the hill"},"e_post":{"zh":"你接下了曹操给的官职","en":"You accepted a post from Cao"},"e_stay":{"zh":"你留在了曹营","en":"You stayed with Cao"},"e_angelica":{"zh":"你对温芷说破了心意","en":"You told Wen Zhi how you feel"},"e_used":{"zh":"你利用了温芷的信","en":"You used Wen Zhi's letters"},"e_row":{"zh":"你在赤壁之夜接回了温芷","en":"You brought Wen Zhi back on the night of the fire"},"e_guan_fear":{"zh":"关羽对你说过他最怕负了大哥","en":"Guan Yu told you he fears failing his brother"},"e_people":{"zh":"刘备在古城楼上说起百姓","en":"Liu Bei talked about his people on the Gucheng wall"},"e_zhuge_test":{"zh":"你用三分天下试探过诸葛亮","en":"You tested Zhuge Liang with the three-way division"},"e_wind":{"zh":"你提醒过曹操提防东南风","en":"You warned Cao about a southeast wind"},"e_cao_guan":{"zh":"曹操对你说过他留不住关羽","en":"Cao told you he couldn't keep Guan Yu"}},"debts":{"d_five_passes":{"title":{"zh":"通关文书","en":"The travel pass"},"lock":"functional","broken":{"zh":"有了文书，“过五关斩六将”失去了起因。","en":"With a pass, the 'five passes, six generals' episode loses its cause."},"function":{"zh":"关羽千里寻兄、一路过关的忠义之名","en":"Guan Yu's legend of crossing a thousand li for his brother"}},"d_recommend":{"title":{"zh":"走马荐诸葛","en":"The parting recommendation"},"lock":"literal","broken":{"zh":"徐庶没走，就没有人在城外回马举荐诸葛亮。","en":"Xu Shu stayed, so no one turns back at the gate to recommend Zhuge Liang."},"function":{"zh":"诸葛亮出山","en":"Zhuge Liang joins Liu Bei"}},"d_lianhuan":{"title":{"zh":"连环计","en":"The chain plan"},"lock":"literal","broken":{"zh":"庞统已在刘备帐下，没人去曹营献连环计。","en":"Pang Tong already serves Liu Bei, so no one offers Cao the chain plan."},"function":{"zh":"曹军战船连锁，火攻得以成立","en":"Cao's ships are chained, so the fire attack can work"}},"d_mi":{"title":{"zh":"糜夫人","en":"Lady Mi"},"lock":"literal","broken":{"zh":"糜夫人获救，赵云单骑救主少了悲壮的前因。","en":"With Lady Mi saved, Zhao Yun's lone ride loses its tragic cause."},"function":{"zh":"赵云单骑救出阿斗","en":"Zhao Yun rides out alone with the infant heir"}}},"chapters":[{"id":"c1","title":{"zh":"许都","en":"Xuchang"},"year":{"zh":"建安四年（199）","en":"Jian'an 4 (199)"},"canon":{"zh":"第20–21回","en":"Ch. 20–21"},"offer":3,"intro":[{"text":{"zh":"建安四年，许都。刘备寄身曹操门下，每天在后园种菜。你是颍川来的年轻书生，字子衡，经糜竺引荐，做了刘备的门客。府里人都说你话少，记性好。","en":"Xuchang, Jian'an 4 (199). Liu Bei lives under Cao Cao's eye and spends his days growing vegetables in the back garden. You are a young scholar from Yingchuan, styled Ziheng. Mi Zhu introduced you, and Liu Bei took you in as a retainer. The household says you talk little and forget nothing."}}]},{"id":"c2","title":{"zh":"出许都","en":"Leaving Xuchang"},"year":{"zh":"建安四年（199）","en":"Jian'an 4 (199)"},"canon":{"zh":"第21回","en":"Ch. 21"},"offer":2,"intro":[{"text":{"zh":"煮酒之后，刘备坐立不安。消息传来：袁术要北上投奔袁绍，必经徐州。","en":"After the plum-wine meeting Liu Bei cannot sit still. News arrives: Yuan Shu means to go north to join Yuan Shao, and his road runs through Xuzhou."},"when":{"v":"flag.left_behind","op":"!=","val":true}},{"text":{"zh":"煮酒那一席之后，你在许都的大牢里数日子。","en":"After the plum-wine meeting, you count the days in the Xuchang jail."},"when":{"v":"flag.left_behind","op":"==","val":true}}]},{"id":"c3","title":{"zh":"下邳","en":"Xiapi"},"year":{"zh":"建安五年（200）","en":"Jian'an 5 (200)"},"canon":{"zh":"第24–25回","en":"Ch. 24–25"},"offer":2,"intro":[{"text":{"zh":"建安五年正月，衣带诏事泄，董承等五家满门被杀。曹操亲率大军东征徐州。刘备兵败，单骑北投袁绍；张飞不知去向。关羽护着两位嫂嫂，被困在下邳城外的土山上。你也在山上。","en":"First month of Jian'an 5 (200). The belt edict is discovered, and Dong Cheng and four other families are put to death. Cao Cao marches on Xuzhou himself. Liu Bei is routed and flees north alone to Yuan Shao; no one knows where Zhang Fei is. Guan Yu, guarding Liu Bei's two wives, is cut off on a hill outside Xiapi. You are on the hill with him."}}]},{"id":"c4","title":{"zh":"千里","en":"A Thousand Li"},"year":{"zh":"建安五年（200）","en":"Jian'an 5 (200)"},"canon":{"zh":"第25–28回","en":"Ch. 25–28"},"offer":2,"intro":[{"text":{"zh":"许都。曹操待关羽极厚：三日一小宴，五日一大宴，送金银，送美女，送锦袍。你住在关羽府里，曹操也记得你。","en":"Xuchang. Cao Cao treats Guan Yu lavishly: a small banquet every three days, a grand one every five, gold, silver, beautiful women, a brocade robe. You live in Guan Yu's house, and Cao Cao knows who you are."},"when":{"v":"flag.with_guanyu","op":"==","val":true}},{"text":{"zh":"冀州，袁绍营中。刘备寄人篱下，天天打听二弟的消息。","en":"Jizhou, in Yuan Shao's camp. Liu Bei is a guest under another man's roof, asking every day for news of his sworn brother."},"when":{"v":"flag.with_guanyu","op":"!=","val":true}}]},{"id":"c5","title":{"zh":"新野","en":"Xinye"},"year":{"zh":"建安十二年（207）","en":"Jian'an 12 (207)"},"canon":{"zh":"第35–38回","en":"Ch. 35–38"},"offer":2,"intro":[{"text":{"zh":"七年过去了。刘备寄居荆州刘表门下，屯兵新野。徐庶做了军师，打了几场漂亮仗。你还在刘备身边，鬓角多了几根白发。","en":"Seven years pass. In Jian'an 12 (207) Liu Bei lives under Liu Biao's protection in Jingzhou, garrisoned at Xinye. Xu Shu has become his strategist and won him some fine victories. You are still at Liu Bei's side, with a few more grey hairs."},"when":{"v":"track","op":"==","val":"liu"}},{"text":{"zh":"七年过去了。曹操平定了河北。你在丞相府做事，日子过得体面，偶尔会想起古城的方向。温芷还在许都。","en":"Seven years pass. By Jian'an 12 (207) Cao Cao has conquered the north. You serve in the Chancellor's office and live comfortably, though you sometimes think of the road to Gucheng. Wen Zhi is still in Xuchang."},"when":{"v":"track","op":"==","val":"cao"}}]},{"id":"c6","title":{"zh":"长坂","en":"Changban"},"year":{"zh":"建安十三年（208）","en":"Jian'an 13 (208)"},"canon":{"zh":"第41–42回","en":"Ch. 41–42"},"offer":2,"intro":[{"text":{"zh":"建安十三年秋，刘表病死，次子刘琮举荆州降曹。曹操五千铁骑一日一夜追三百里。刘备带着十几万百姓南逃，一天只走十几里。","en":"Autumn, Jian'an 13 (208). Liu Biao dies, and his younger son Liu Cong surrenders Jingzhou to Cao Cao. Five thousand of Cao's armored horsemen ride three hundred li in a day and a night. Liu Bei is fleeing south with over a hundred thousand civilians, covering barely ten li a day."},"when":{"v":"track","op":"==","val":"liu"}},{"text":{"zh":"建安十三年秋，刘琮举荆州降了。曹操亲率五千铁骑追击刘备，命你随军参谋。","en":"Autumn, Jian'an 13 (208). Liu Cong surrenders Jingzhou. Cao Cao leads five thousand armored horsemen after Liu Bei and orders you to ride with him as an adviser."},"when":{"v":"track","op":"==","val":"cao"}}]},{"id":"c7","title":{"zh":"赤壁","en":"Red Cliffs"},"year":{"zh":"建安十三年冬（208）","en":"Winter, Jian'an 13 (208)"},"canon":{"zh":"第43–49回","en":"Ch. 43–49"},"offer":2,"intro":[{"text":{"zh":"刘备退到夏口。诸葛亮过江去了东吴，说服孙权联手抗曹。曹操号称八十三万大军，战船沿江排开，旌旗蔽日。","en":"Liu Bei retreats to Xiakou. Zhuge Liang crosses to Wu and persuades Sun Quan to join forces against Cao. Cao claims eight hundred and thirty thousand men; his warships line the river and their banners blot out the sun."},"when":{"v":"track","op":"==","val":"liu"}},{"text":{"zh":"你肩上的箭伤还没好，提笔都疼。","en":"The arrow wound in your shoulder hasn't healed; even holding a brush hurts."},"when":{"all":[{"v":"track","op":"==","val":"liu"},{"v":"flag.wounded","op":"==","val":true}]}},{"text":{"zh":"赤壁。北方士兵不习水战，在船上吐得站不起来，军中开始有人生病。温芷作为医女被征召随军，在后营给病兵配药。","en":"Red Cliffs. Northern soldiers unused to boats are too seasick to stand, and sickness spreads through the camp. Wen Zhi has been called up as an army physician and is mixing medicine for the sick in the rear camp."},"when":{"v":"track","op":"==","val":"cao"}}]},{"id":"c8","title":{"zh":"华容","en":"Huarong"},"year":{"zh":"建安十三年冬（208）","en":"Winter, Jian'an 13 (208)"},"canon":{"zh":"第49–50回","en":"Ch. 49–50"},"offer":2,"intro":[{"text":{"zh":"火烧了一夜。","en":"The fire burns all night."}}]}],"nodes":{"c1_guanyu":{"id":"c1_guanyu","chapter":"c1","kind":"side","title":{"zh":"夜访关羽","en":"A Late Visit to Guan Yu"},"lock":"free","canon":{"zh":"改编","en":"adapted"},"intro":[{"text":{"zh":"夜深了，关羽房里的灯还亮着。他坐在灯下读《春秋》，见你进来，并不放下书。","en":"It is late, but Guan Yu's lamp is still lit. He is reading the Spring and Autumn Annals and does not put it down when you come in."}}],"choices":[{"id":"ask_yi","type":"expression","label":{"zh":"问他：什么是义？","en":"Ask him: what is righteousness?"},"out":[{"text":{"zh":"关羽沉默良久：『义者，宜也。该做的事，死也要做。』他第一次正眼看你。","en":"Guan Yu is silent a long time. 'Righteousness is doing what ought to be done, even if it kills you.' For the first time he looks at you properly."}}],"effects":[{"add":"rel.guanyu.esteem","by":1},{"set":"flag.asked_yi","to":true}],"echo":["e_yi"]},{"id":"warn_gifts","type":"strategy","label":{"zh":"提醒他：曹公待人越厚，越难脱身。","en":"Warn him: the more generous Cao is, the harder it is to leave."},"out":[{"text":{"zh":"关羽放下书：『你是说，曹操要买我？』『是要你欠他。』他想了想，点头：『我记下了。』","en":"Guan Yu puts the book down. 'You mean Cao wants to buy me?' 'He wants you to owe him.' He thinks, then nods. 'I'll remember that.'"}}],"effects":[{"add":"rel.guanyu.esteem","by":1},{"set":"flag.warned_guan","to":true}],"echo":["e_warn_gifts"]},{"id":"lamp","type":"expression","label":{"zh":"不打扰他，替他添了灯油便走。","en":"Don't disturb him. Top up his lamp and go."},"out":[{"text":{"zh":"关羽没有抬头，只说了一句：『多谢。』","en":"Guan Yu doesn't look up. 'Thank you,' is all he says."}}],"effects":[]}],"salience":1,"order":1,"art":{"scene":"lamp","layers":[]},"place":"xuchang","cast":[{"id":"guanyu"}]},"c1_wenzhi":{"id":"c1_wenzhi","chapter":"c1","kind":"side","title":{"zh":"故人温芷","en":"An Old Friend"},"lock":"free","canon":{"zh":"原创人物","en":"original character"},"intro":[{"text":{"zh":"你在丞相府的偏门外遇见了温芷。你们是颍川同乡，她家世代行医，如今她在曹府内院做医女。她先是一愣，然后笑了：『子衡？你怎么在这里？』","en":"Outside a side gate of the Chancellor's residence you run into Wen Zhi. You grew up in the same town in Yingchuan; her family have been physicians for generations, and she now treats the women of Cao Cao's household. She stares, then laughs. 'Ziheng? What are you doing here?'"}}],"choices":[{"id":"reminisce","type":"expression","label":{"zh":"和她叙旧，说起颍川的那棵老槐树。","en":"Catch up with her. Talk about the old locust tree back home."},"out":[{"text":{"zh":"你们说了很久，说到天黑。分手时她说：『许都没有槐树。』","en":"You talk until dark. As you part she says, 'There are no locust trees in Xuchang.'"}}],"effects":[{"add":"rel.wenzhi.intimacy","by":1}]},{"id":"ask_watch","type":"dilemma","label":{"zh":"请她留意丞相府里关于刘备的议论。","en":"Ask her to listen for talk about Liu Bei in Cao's household."},"out":[{"text":{"zh":"她的笑容收了收：『你在替刘玄德做事。』过了很久，她说：『我只听，不偷。听到了，告诉你。』","en":"Her smile fades a little. 'You work for Liu Bei.' After a long pause: 'I'll listen. I won't steal. If I hear something, I'll tell you.'"}}],"effects":[{"add":"rel.wenzhi.trust","by":1},{"set":"flag.asked_wenzhi","to":true}],"echo":["e_wenzhi_spy"]},{"id":"urge_leave","type":"expression","label":{"zh":"劝她离开许都，这里迟早要出事。","en":"Urge her to leave Xuchang. Trouble is coming."},"out":[{"text":{"zh":"『你呢？你不也在这里？』她摇摇头，『府里有我要治的人。』","en":"'And you? You're here too.' She shakes her head. 'There are people in that house I have to treat.'"}}],"effects":[{"add":"rel.wenzhi.trust","by":1}]}],"salience":2,"order":2,"art":{"scene":"herbs","layers":[]},"place":"xuchang","cast":[{"id":"wenzhi"}]},"c1_dongcheng":{"id":"c1_dongcheng","chapter":"c1","kind":"side","title":{"zh":"衣带诏","en":"The Belt Edict"},"lock":"literal","canon":{"zh":"第20–21回","en":"Ch. 20–21"},"intro":[{"text":{"zh":"车骑将军董承深夜来访，屏退左右，从衣带里取出一道血书：天子密诏，讨曹。刘备看完，手在发抖。董承看了你一眼：『此人可信否？』","en":"General Dong Cheng visits at night, sends everyone out, and draws a letter written in blood from the lining of a belt: a secret edict from the Emperor ordering Cao Cao's destruction. Liu Bei's hands shake as he reads. Dong Cheng glances at you. 'Can this one be trusted?'"}}],"choices":[{"id":"sign","type":"strategy","label":{"zh":"劝主公签名。这是汉臣的本分。","en":"Urge your lord to sign. It is a Han subject's duty."},"out":[{"text":{"zh":"刘备提笔，写下『左将军刘备』。董承收起诏书，向你拱手。","en":"Liu Bei takes up the brush and writes 'Liu Bei, General of the Left.' Dong Cheng puts the edict away and bows to you."}}],"effects":[{"add":"rel.liubei.trust","by":1},{"add":"renown.loyal","by":1}]},{"id":"delay","type":"dilemma","label":{"zh":"劝主公先别签：名单越长，越容易泄露。","en":"Tell him not to sign yet: the longer the list, the easier it leaks."},"out":[{"text":{"zh":"刘备犹豫再三，还是签了。事后他对你说：『你说得对，可这个名字我不能不写。』","en":"Liu Bei hesitates, then signs anyway. Afterwards he tells you, 'You were right. But I couldn't leave my name off.'"}}],"effects":[{"add":"rel.liubei.trust","by":1},{"add":"renown.cunning","by":1}]},{"id":"foresee","type":"strategy","label":{"zh":"直说：这份名单将来一定会落到曹操手里。","en":"Say it plainly: this list will end up in Cao Cao's hands."},"out":[{"text":{"zh":"屋里一片寂静。董承脸色发青：『你怎么知道？』刘备按住他的手，还是签了名。散席后，刘备盯着你看了很久。","en":"The room goes silent. Dong Cheng turns grey. 'How would you know?' Liu Bei puts a hand on his arm and signs anyway. When the guest has gone, Liu Bei looks at you for a long time."}}],"effects":[{"add":"uncanny","by":1},{"add":"rel.liubei.trust","by":1},{"set":"flag.foresaw_yidai","to":true}],"foresight":true,"echo":["e_foresaw"]}],"salience":0,"order":3,"art":{"scene":"lamp","layers":[{"id":"edict"}]},"place":"xuchang","cast":[{"id":"liubei"}]},"c1_plum":{"id":"c1_plum","chapter":"c1","kind":"main","title":{"zh":"煮酒论英雄","en":"Heroes over Plum Wine"},"lock":"literal","canon":{"zh":"第21回","en":"Ch. 21"},"intro":[{"text":{"zh":"曹操派人来请：后园梅子青了，煮酒小坐。刘备只带了你一个。酒过数巡，阴云漠漠，骤雨将至。曹操一个一个数天下英雄：袁术、袁绍、刘表、孙策……都被他笑着摇头。","en":"Cao Cao sends for Liu Bei: the plums in his garden are green, the wine is warming, come and sit. Liu Bei brings only you. Several cups in, clouds pile up and rain threatens. Cao counts off the heroes of the realm—Yuan Shu, Yuan Shao, Liu Biao, Sun Ce—and laughs at each one."}}],"choices":[{"id":"cover","type":"strategy","label":{"zh":"趁雷声打翻自己的酒樽，替主公把慌乱遮过去。","en":"Knock over your own cup under cover of the thunder, to hide your lord's alarm."},"out":[{"text":{"zh":"酒樽当啷落地，你连声告罪。刘备借势俯身拾箸：『一震之威，乃至于此。』曹操大笑，目光却在你身上停了一停。","en":"Your cup clatters to the floor and you apologize profusely. Liu Bei uses the moment to stoop for his chopsticks. 'One clap of thunder, and look at us.' Cao laughs, but his eyes rest on you a moment."}}],"effects":[{"add":"rel.liubei.trust","by":2},{"add":"rel.caocao.esteem","by":1},{"set":"flag.covered_liu","to":true}],"echo":["e_cover"],"values":["yi","zhi"],"cg":"thunder"},{"id":"still","type":"expression","label":{"zh":"低头不动，等主公自己圆过去。","en":"Keep your head down and let your lord handle it."},"out":[{"text":{"zh":"刘备从容俯首拾箸：『一震之威，乃至于此。』曹操笑道：『丈夫亦畏雷乎？』没有人看你。","en":"Liu Bei calmly stoops for his chopsticks. 'One clap of thunder, and look at us.' Cao laughs. 'A grown man, afraid of thunder?' No one looks at you."}}],"effects":[],"cg":"thunder"},{"id":"speak","type":"dilemma","label":{"zh":"接过话头评点天下英雄，把曹操的注意力引到自己身上。","en":"Jump in and rate the heroes yourself, drawing Cao's attention to you."},"out":[{"text":{"zh":"你把袁绍、刘表、孙策挨个评了一遍，一句比一句狠。曹操拍案：『此子何人？』刘备替你告罪，回去的路上一句话也没说。","en":"You take Yuan Shao, Liu Biao and Sun Ce apart one by one, each verdict harsher than the last. Cao slaps the table. 'Who is this?' Liu Bei apologizes for you and says nothing the whole way home."},"when":{"v":"heat.caocao","op":"<","val":1}},{"text":{"zh":"你把袁绍、刘表、孙策挨个评了一遍。曹操没有笑：『此子三番两次相激，是替谁来试孤的？』他看的是刘备。刘备替你告罪，回去的路上一句话也没说。","en":"You take Yuan Shao, Liu Biao and Sun Ce apart one by one. Cao doesn't laugh. 'This one keeps baiting me. Who sent him to test me?' He is looking at Liu Bei. Liu Bei apologizes for you and says nothing the whole way home."},"when":{"v":"heat.caocao","op":">=","val":1}}],"effects":[{"add":"rel.caocao.esteem","by":2},{"add":"rel.liubei.trust","by":-1},{"add":"renown.cunning","by":1},{"set":"flag.spoke_at_plum","to":true}],"echo":["e_spoke"],"alt":[{"when":{"v":"heat.caocao","op":">=","val":1},"effects":[{"add":"rel.liubei.trust","by":-2},{"add":"renown.cunning","by":1},{"set":"flag.spoke_at_plum","to":true},{"set":"flag.cao_wary","to":true}]}],"values":["yong","zhi"],"cg":"thunder"}],"salience":0,"order":10,"quote":{"zh":"操以手指玄德，后自指，曰：「今天下英雄，惟使君与操耳！」玄德闻言，吃了一惊，手中所执匙箸，不觉落于地下。时正值天雨将至，雷声大作。","en":"Cao pointed at Liu Bei, then at himself. \"The only heroes in the realm today are you, my lord, and I.\" Liu Bei started; the spoon and chopsticks slipped from his hand. Just then the rain broke, and thunder crashed."},"ask":{"who":"caocao","fallback":"dodge","q":{"zh":"曹操忽然转向你：『玄德不肯说。你是他的门客，你说——当今天下，谁可称英雄？』","en":"Cao Cao suddenly turns to you. 'Xuande won't say. You're his man—you tell me. Who in the realm today deserves to be called a hero?'"},"answers":[{"id":"rude","means":{"zh":"答非所问、讽刺或冒犯曹操","en":"mocks or insults Cao"},"out":[{"text":{"zh":"席上安静了一瞬。曹操盯着你：『你再说一遍？』","en":"The table goes quiet for a moment. Cao stares at you. 'Say that again?'"}}],"effects":[{"add":"heat.caocao","by":1},{"add":"renown.rash","by":1},{"add":"rel.liubei.trust","by":-1}],"match":"奸|篡|贼|狗|蠢|traitor|usurp|tyrant|villain","mood":"cold"},{"id":"liu","means":{"zh":"说刘备是英雄","en":"names Liu Bei"},"out":[{"text":{"zh":"曹操的笑停了一停。他看了刘备一眼，刘备手里的筷子差点掉下来。『有意思。』曹操慢慢地说，『门客替主公说了主公不敢说的话。』","en":"Cao's laugh stops short. He glances at Liu Bei, whose chopsticks nearly slip. 'Interesting,' Cao says slowly. 'The retainer says what his lord doesn't dare.'"}}],"effects":[{"add":"rel.caocao.esteem","by":1},{"add":"rel.liubei.trust","by":-1},{"set":"flag.cao_wary","to":true}],"match":"刘备|玄德|使君|皇叔|主公|我家|liu bei|xuande|my lord","mood":"surprised"},{"id":"cao","means":{"zh":"说曹操本人是英雄","en":"names Cao Cao himself"},"out":[{"text":{"zh":"曹操大笑：『你倒会说话。』他给你斟了一杯，又看了刘备一眼：『你的门客，比你会说话。』","en":"Cao roars with laughter. 'You know how to talk.' He pours you a cup, then glances at Liu Bei. 'Your man talks better than you do.'"}}],"effects":[{"add":"rel.caocao.esteem","by":1}],"match":"丞相|曹公|曹操|明公|孟德|您|你自己|就是你|chancellor|cao cao|you yourself|yourself","mood":"warm"},{"id":"others","means":{"zh":"说某个诸侯，如袁绍、孙策、刘表、吕布","en":"names some other warlord"},"out":[{"text":{"zh":"曹操摇头笑道：『冢中枯骨。』说完又自顾自数下去。你的答案，他听过太多遍了。","en":"Cao shakes his head with a smile. 'Bones in the grave.' He goes on counting to himself. He has heard your answer too many times."}}],"effects":[],"match":"袁绍|本初|袁术|公路|孙策|伯符|景升|奉先|孙权|刘表|吕布|马腾|张鲁|刘璋|张绣|yuan shao|yuan shu|sun ce|liu biao|lu bu","mood":"neutral"},{"id":"dodge","means":{"zh":"推辞、不正面回答、说没有人","en":"evades, or says no one"},"out":[{"text":{"zh":"曹操也不勉强：『书生谨慎。』他转回头，接着说他自己的。","en":"Cao doesn't press. 'A cautious scholar.' He turns back and carries on."}}],"effects":[],"match":"不知|不敢|不好说|不清楚|无人|没人|没有|不便|i don't know|no one|nobody|can't say","mood":"neutral"},{"id":"self","means":{"zh":"说自己是英雄","en":"names Ziheng himself"},"out":[{"text":{"zh":"曹操眯起眼：『好大的口气。』他没有再笑，手指在案上轻轻敲着。","en":"Cao narrows his eyes. 'Big words.' He stops laughing; his fingers tap the table."}}],"effects":[{"add":"rel.caocao.esteem","by":1},{"add":"heat.caocao","by":1},{"add":"renown.rash","by":1}],"match":"^我(自己|就是|乃|当)|在下|子衡|本人|舍我其谁|^me\\b|myself|^i am|ziheng","mood":"cold"}]},"art":{"scene":"garden","layers":[{"id":"storm"}]},"place":"xuchang","cast":[{"id":"caocao"},{"id":"liubei"}]},"c2_note":{"id":"c2_note","chapter":"c2","kind":"side","title":{"zh":"药包里的纸条","en":"A Note in the Medicine"},"lock":"free","canon":{"zh":"原创人物","en":"original character"},"intro":[{"text":{"zh":"温芷托人送来一包药，药包里夹着一张纸条：『郭、程二人劝丞相，不可放刘备出城。』","en":"Wen Zhi sends over a packet of medicine. Folded inside is a note: 'Guo Jia and Cheng Yu are urging the Chancellor not to let Liu Bei leave the city.'"}}],"choices":[{"id":"haste","type":"strategy","label":{"zh":"劝主公一拿到兵马就连夜出城。","en":"Urge your lord to leave the night he gets his troops."},"out":[{"text":{"zh":"刘备点头：『就这么办。』当夜大军出了许都。","en":"Liu Bei nods. 'So be it.' That night the army leaves Xuchang."}}],"effects":[{"set":"flag.fast_departure","to":true},{"add":"rel.liubei.trust","by":1},{"add":"rel.wenzhi.trust","by":1}],"echo":["e_fast"]},{"id":"protect","type":"dilemma","label":{"zh":"烧掉纸条，托人带话：别再为我冒险。","en":"Burn the note and send word: don't take risks for me again."},"out":[{"text":{"zh":"回话只有两个字：『知道。』你不确定她是生气还是放心。","en":"The reply is two words: 'I know.' You can't tell whether she's angry or relieved."}}],"effects":[{"add":"rel.wenzhi.intimacy","by":1}]}],"salience":3,"order":1,"when":{"all":[{"any":[{"v":"flag.asked_wenzhi","op":"==","val":true},{"v":"rel.wenzhi.intimacy","op":">=","val":2}]},{"v":"flag.left_behind","op":"!=","val":true}]},"callbacks":[{"pays":"e_wenzhi_spy","text":{"zh":"她说过『只听，不偷』。这张纸条，已经是在偷了。","en":"She said she would listen, not steal. This note is stealing."},"when":{"v":"flag.asked_wenzhi","op":"==","val":true}}],"art":{"scene":"letter","layers":[{"id":"packet"}]},"place":"xuchang","cast":[{"id":"wenzhi"}]},"c2_pretext":{"id":"c2_pretext","chapter":"c2","kind":"side","title":{"zh":"出城的理由","en":"A Reason to Leave"},"lock":"functional","canon":{"zh":"第21回","en":"Ch. 21"},"intro":[{"text":{"zh":"刘备想出城，却需要一个曹操驳不回的理由。","en":"Liu Bei needs a reason to leave that Cao Cao cannot refuse."}}],"choices":[{"id":"intercept","type":"strategy","label":{"zh":"献策：请命截击袁术。","en":"Advise him to volunteer to intercept Yuan Shu."},"out":[{"text":{"zh":"次日刘备入朝请命，曹操竟然准了，拨给他五万兵马。","en":"The next day Liu Bei volunteers at court, and Cao agrees, giving him fifty thousand men."}}],"effects":[{"add":"rel.liubei.trust","by":1}]},{"id":"illness","type":"expression","label":{"zh":"主张托病闭门，等风头过去。","en":"Suggest he plead illness and wait it out."},"out":[{"text":{"zh":"刘备摇头：『闭门是等死。』他最后还是请命截击袁术。","en":"Liu Bei shakes his head. 'Hiding at home is waiting to die.' In the end he volunteers to intercept Yuan Shu anyway."}}],"effects":[]},{"id":"regret","type":"strategy","label":{"zh":"直说：曹操很快会后悔，要走就趁今夜。","en":"Say it plainly: Cao will regret this soon. If we go, we go tonight."},"out":[{"text":{"zh":"刘备看了你一眼，没有问为什么。次日入朝请命截击袁术，当夜就出了城。","en":"Liu Bei looks at you and doesn't ask why. He volunteers at court the next day, and leaves that same night."}}],"effects":[{"set":"flag.fast_departure","to":true},{"add":"uncanny","by":1},{"add":"rel.liubei.trust","by":1}],"foresight":true,"echo":["e_fast"]}],"salience":1,"order":2,"when":{"v":"flag.left_behind","op":"!=","val":true},"art":{"scene":"road","layers":[]},"place":"xuchang","cast":[{"id":"liubei"}]},"c2_xuchu":{"id":"c2_xuchu","chapter":"c2","kind":"main","title":{"zh":"许褚追来","en":"Xu Chu Gives Chase"},"lock":"functional","canon":{"zh":"第21回","en":"Ch. 21"},"intro":[{"text":{"zh":"大军出城没多久，后面尘头大起：许褚带着五百骑追来，说丞相请将军回去。","en":"Not long after the army leaves, dust rises behind you: Xu Chu with five hundred riders. The Chancellor asks the general to return."},"when":{"v":"flag.fast_departure","op":"!=","val":true}},{"text":{"zh":"大军连夜赶路。第二天中午，探马来报：许褚带五百骑追到半路，见追不上，回去了。","en":"The army marches through the night. At noon the next day, scouts report that Xu Chu came after you with five hundred riders, saw he couldn't catch up, and turned back."},"when":{"v":"flag.fast_departure","op":"==","val":true}},{"text":{"zh":"许褚追得格外急。梅园那天之后，曹操就没再放心过刘备。","en":"Xu Chu rides harder than anyone. Since the day in the plum garden, Cao has never trusted Liu Bei."},"when":{"all":[{"v":"flag.cao_wary","op":"==","val":true},{"v":"flag.fast_departure","op":"!=","val":true}]}},{"text":{"zh":"你背上的棍伤还没好，马每颠一下都疼。","en":"The welts on your back haven't healed; every jolt of the saddle hurts."},"when":{"v":"flag.flogged","op":"==","val":true}}],"choices":[{"id":"rule","type":"strategy","label":{"zh":"请主公答他：『将在外，君命有所不受。』","en":"Have your lord answer: 'A general in the field need not obey every order.'"},"out":[{"text":{"zh":"许褚是个直人，听了这话，竟无话可说，回去复命了。","en":"Xu Chu is a plain man. He has no answer to that and rides back to report."}}],"effects":[{"add":"rel.liubei.trust","by":1},{"add":"renown.loyal","by":1}],"when":{"v":"flag.fast_departure","op":"!=","val":true},"values":["yi"]},{"id":"talk","type":"dilemma","label":{"zh":"你亲自出面，跟许褚东拉西扯，拖到天黑。","en":"Go out yourself and talk Xu Chu in circles until dark."},"out":[{"text":{"zh":"许褚被你绕得头昏，拨马回去了。曹操听说后问：『跟许褚说话的那个书生，叫什么？』","en":"Xu Chu gets so tangled he turns his horse and goes home. When Cao hears about it he asks, 'The scholar who talked to Xu Chu—what's his name?'"}}],"effects":[{"add":"renown.cunning","by":1},{"add":"rel.caocao.esteem","by":1}],"when":{"v":"flag.fast_departure","op":"!=","val":true},"req":{"v":"flag.cao_wary","op":"!=","val":true},"hint":{"zh":"许褚认得你——梅园那天之后，丞相府的人都认得你","en":"Xu Chu knows your face. Since the plum garden, everyone in the Chancellor's household does"},"values":["zhi"]},{"id":"onward","type":"expression","label":{"zh":"催马继续赶路。","en":"Ride on."},"out":[{"text":{"zh":"徐州就在前面。","en":"Xuzhou lies ahead."}}],"effects":[],"when":{"v":"flag.fast_departure","op":"==","val":true}},{"id":"look_back","type":"expression","label":{"zh":"回头望一眼许都的方向。","en":"Look back toward Xuchang."},"out":[{"text":{"zh":"城楼已经看不见了。温芷还在那里。","en":"The city walls are out of sight. Wen Zhi is still there."}}],"effects":[],"when":{"v":"flag.fast_departure","op":"==","val":true}}],"salience":0,"order":10,"callbacks":[{"pays":"e_fast","text":{"zh":"要是晚走半天，就得在城门口跟许褚说话了。你想起那包药。","en":"Half a day later and you'd have been arguing with Xu Chu at the gate. You think of the medicine packet."},"when":{"v":"flag.fast_departure","op":"==","val":true}}],"when":{"v":"flag.left_behind","op":"!=","val":true},"art":{"scene":"road","layers":[{"id":"chase","when":{"v":"flag.fast_departure","op":"!=","val":true}}]},"place":"xiapi","cast":[{"id":"liubei"}]},"c3_terms":{"id":"c3_terms","chapter":"c3","kind":"main","title":{"zh":"土山约三事","en":"Three Terms on the Hill"},"lock":"functional","canon":{"zh":"第25回","en":"Ch. 25"},"intro":[{"text":{"zh":"张辽单骑上山，劝关羽暂降。他说关羽若死战，有三罪：负了桃园之誓，负了皇叔托付的两位嫂嫂，负了匡扶汉室之志。关羽沉默了。","en":"Zhang Liao rides up the hill alone to urge Guan Yu to surrender for now. If he fights to the death, Zhang Liao says, he commits three wrongs: he breaks the Peach Garden oath, abandons the two ladies his brother entrusted to him, and gives up on restoring the Han. Guan Yu says nothing."}},{"text":{"zh":"关羽没有看你。篝火边那句冲撞他的话，他还记着。","en":"Guan Yu doesn't look at you. He hasn't forgotten what you threw at him by the campfire."},"when":{"v":"imp.guanyu.offended","op":">=","val":1}},{"text":{"zh":"关羽瞥了你一眼：『篝火边那些话，我当你是年轻。今天，说正事。』","en":"Guan Yu glances at you. 'What you said by the fire—I'll put it down to youth. Today we talk business.'"},"when":{"all":[{"v":"imp.guanyu.frivolous","op":">=","val":1},{"v":"imp.guanyu.offended","op":"<","val":1}]}}],"choices":[{"id":"draft","type":"strategy","label":{"zh":"替关羽把条件写下来，一条一条和张辽谈。","en":"Write down Guan Yu's conditions and negotiate them with Zhang Liao point by point."},"out":[{"text":{"zh":"你执笔，关羽口述，三条写得清清楚楚：『吾今只降汉帝，不降曹操』；两位嫂嫂由皇叔俸禄供养，闲人不得入门；『但知刘皇叔去向，不管千里万里，便当辞去』。张辽带回去，曹操全都答应了。关羽随曹军入许都，你也一起去了。","en":"Guan Yu dictates and you write, three terms set down plainly: 'I surrender to the Han emperor, not to Cao Cao'; the two ladies are to be kept on Liu Bei's stipend and no one may enter their gate; 'the moment I learn where Liu Bei is, however far, I leave.' Zhang Liao takes them back and Cao agrees to all three. Guan Yu goes to Xuchang with Cao's army, and you go with him."}}],"effects":[{"add":"rel.guanyu.esteem","by":2},{"set":"flag.drafted_terms","to":true},{"set":"flag.with_guanyu","to":true}],"echo":["e_terms"],"cg":"terms"},{"id":"carry","type":"dilemma","label":{"zh":"趁夜突围北上，去袁绍那里给主公报信。","en":"Break out at night and ride north to bring your lord the news."},"out":[{"text":{"zh":"关羽给了你一匹马：『告诉大哥，我在，嫂嫂在。』你从山后的小路走了。后来听说，关羽与曹操约了三件事，随曹军入了许都。","en":"Guan Yu gives you a horse. 'Tell my brother: I'm alive, and so are the ladies.' You slip away down the back of the hill. Later you hear that Guan Yu agreed three terms with Cao and went to Xuchang with his army."}}],"effects":[{"add":"rel.liubei.trust","by":2},{"set":"flag.carried_news","to":true}],"echo":["e_news"]},{"id":"fight","type":"expression","label":{"zh":"劝关羽死战，宁死不降。","en":"Urge Guan Yu to fight to the death rather than surrender."},"out":[{"text":{"zh":"关羽摇头：『你说的，正是我想说的。可两位嫂嫂怎么办？』他还是派张辽回去传话，约了三件事。你随他入了许都。","en":"Guan Yu shakes his head. 'You're saying what I want to say. But what becomes of the two ladies?' He sends Zhang Liao back with three terms after all. You go to Xuchang with him."}}],"effects":[{"add":"renown.loyal","by":1},{"add":"rel.guanyu.esteem","by":1},{"set":"flag.with_guanyu","to":true},{"set":"flag.urged_fight","to":true}],"echo":["e_fight"]}],"salience":0,"order":10,"callbacks":[{"pays":"e_yi","text":{"zh":"关羽转头看你：『你问过我什么是义。今天这道题，难。』","en":"Guan Yu turns to you. 'You once asked me what righteousness is. Today the question is hard.'"},"when":{"v":"flag.asked_yi","op":"==","val":true}},{"pays":"e_foresaw","text":{"zh":"你想起那天夜里在董承面前说的话。消息传开后，有人说刘备府上有个书生，早就算到了。","en":"Word gets around that a scholar in Liu Bei's household saw this coming."},"when":{"v":"flag.foresaw_yidai","op":"==","val":true}},{"pays":"e_guan_fear","text":{"zh":"你想起篝火边他说的话：最怕负了大哥。","en":"You remember what he said by the fire: what he fears is failing his brother."},"when":{"v":"flag.guan_fear","op":"==","val":true}}],"art":{"scene":"hill","layers":[{"id":"escape","choice":"carry"}]},"place":"xiapi","cast":[{"id":"guanyu"}]},"c4_horse":{"id":"c4_horse","chapter":"c4","kind":"side","title":{"zh":"赤兔马","en":"Red Hare"},"lock":"free","canon":{"zh":"第25回","en":"Ch. 25"},"intro":[{"text":{"zh":"曹操把吕布的赤兔马送给关羽。关羽再拜称谢——金银美女都没让他拜过。曹操有些不快：『为何独重一马？』关羽答得坦然。曹操沉默片刻，转向你：『子衡也该有个官职。』","en":"Cao Cao gives Guan Yu Lü Bu's horse, Red Hare. Guan Yu bows twice in thanks—gold and women never got a bow from him. Cao is put out. 'Why does a horse matter more than all the rest?' Guan Yu answers frankly. Cao is quiet a moment, then turns to you. 'Ziheng ought to have a post too.'"}}],"choices":[{"id":"accept_post","type":"dilemma","label":{"zh":"接下曹操给的主簿之职。","en":"Accept the clerk's post Cao offers."},"out":[{"text":{"zh":"曹操很高兴。关羽看了你一眼，什么也没说。","en":"Cao is pleased. Guan Yu glances at you and says nothing."}}],"effects":[{"add":"rel.caocao.esteem","by":2},{"set":"flag.took_cao_post","to":true},{"add":"rel.guanyu.esteem","by":-1},{"add":"renown.cunning","by":1}],"echo":["e_post"],"values":["li"]},{"id":"decline","type":"strategy","label":{"zh":"婉拒：『在下是关将军的人。』","en":"Decline politely: 'I belong to General Guan.'"},"out":[{"text":{"zh":"曹操笑笑：『都是一样的脾气。』当晚关羽请你喝了酒。","en":"Cao smiles. 'The same temper, the pair of you.' That night Guan Yu buys you a drink."}}],"effects":[{"add":"rel.guanyu.esteem","by":1},{"add":"renown.loyal","by":1}],"values":["yi"]},{"id":"deflect","type":"expression","label":{"zh":"装作没听懂。","en":"Pretend not to understand."},"out":[{"text":{"zh":"曹操也不追问。","en":"Cao doesn't press."}}],"effects":[],"values":["zhi"]}],"salience":2,"order":1,"when":{"v":"flag.with_guanyu","op":"==","val":true},"quote":{"zh":"公曰：「吾知此马日行千里，今幸得之，若知兄长下落，可一日而见面矣。」","en":"Guan Yu said: \"I know this horse covers a thousand li a day. If I learn where my brother is, I can be with him in a single day.\""},"callbacks":[{"pays":"e_warn_gifts","text":{"zh":"关羽低声对你说：『你说过，他是要我欠他。欠下的，日后要还。』","en":"Guan Yu says quietly to you, 'You told me he wants me in his debt. Debts have to be repaid.'"},"when":{"v":"flag.warned_guan","op":"==","val":true}}],"art":{"scene":"hall","layers":[{"id":"horse"}]},"place":"xuchang","cast":[{"id":"caocao"},{"id":"guanyu"}]},"c4_garden":{"id":"c4_garden","chapter":"c4","kind":"side","title":{"zh":"药圃","en":"The Herb Garden"},"lock":"free","canon":{"zh":"原创人物","en":"original character"},"intro":[{"text":{"zh":"温芷约你在城南的药圃见面。她已经知道关羽在打听刘备的下落。『他总会走的，』她说，『你呢？』","en":"Wen Zhi asks you to meet her at the herb garden south of the city. She knows Guan Yu has been asking where Liu Bei is. 'He'll leave sooner or later,' she says. 'And you?'"}}],"choices":[{"id":"promise","type":"dilemma","label":{"zh":"许诺：等天下稍定，回来接你。","en":"Promise: when things settle, I'll come back for you."},"out":[{"text":{"zh":"她低头笑了一下，把一包止血散塞进你袖子里：『那你得活着回来。』","en":"She looks down and smiles, and tucks a packet of wound powder into your sleeve. 'Then you'd better come back alive.'"}}],"effects":[{"add":"rel.wenzhi.intimacy","by":2},{"set":"flag.promise_wenzhi","to":true}],"echo":["e_promise"]},{"id":"honest","type":"expression","label":{"zh":"实话实说：前路生死难料，不敢许诺。","en":"Be honest: you can't promise anything when you might not survive."},"out":[{"text":{"zh":"『你倒老实。』她看着药圃，『老实人活得久些。』","en":"'You're honest, at least.' She looks out over the herbs. 'Honest people live longer.'"}}],"effects":[{"add":"rel.wenzhi.trust","by":1}]},{"id":"ask_come","type":"dilemma","label":{"zh":"请她和你们一起走。","en":"Ask her to come with you."},"out":[{"text":{"zh":"她摇头：『府里还有三个病人离不开我。』停了一下，她又说：『你问了，我记着。』","en":"She shakes her head. 'Three patients there can't do without me.' A pause. 'But you asked. I'll remember that.'"}}],"effects":[{"add":"rel.wenzhi.intimacy","by":1},{"add":"rel.wenzhi.trust","by":1}]}],"salience":3,"order":2,"when":{"all":[{"v":"flag.with_guanyu","op":"==","val":true},{"v":"rel.wenzhi.intimacy","op":">=","val":2}]},"callbacks":[{"pays":"e_wenzhi_spy","text":{"zh":"『你托我听的那些话，』她说，『我还在听。』","en":"'The things you asked me to listen for,' she says, 'I'm still listening.'"},"when":{"v":"flag.asked_wenzhi","op":"==","val":true}}],"mood":"romance","art":{"scene":"herbs","layers":[{"id":"two"},{"id":"romance"}]},"place":"xuchang","cast":[{"id":"wenzhi"}]},"c4_seal":{"id":"c4_seal","chapter":"c4","kind":"main","title":{"zh":"挂印封金","en":"Seal Hung, Gold Sealed"},"lock":"functional","canon":{"zh":"第26–27回","en":"Ch. 26–27"},"intro":[{"text":{"zh":"白马一战，关羽斩了颜良，算是报了曹操的恩。不久，消息传来：刘备在袁绍军中。关羽把曹操所赠的金银封存在库，把汉寿亭侯印挂在堂上，就要走了。没有曹操的文书，沿途关隘不会放行。","en":"At White Horse, Guan Yu kills Yan Liang and repays Cao Cao's kindness. Soon word comes: Liu Bei is with Yuan Shao. Guan Yu seals Cao's gold and silver in the storehouse, hangs his seal of office in the hall, and prepares to go. Without a pass from Cao, no checkpoint on the road will let him through."}},{"text":{"zh":"关羽临走前低声对你说：『那晚的话，别再对旁人说了。』","en":"Before leaving, Guan Yu says quietly, 'What you said that night—don't say it to anyone else.'"},"when":{"v":"imp.guanyu.frivolous","op":">=","val":1}}],"choices":[{"id":"follow","type":"strategy","label":{"zh":"随关羽护着两位夫人上路，一关一关闯过去。","en":"Ride with Guan Yu and the ladies and force your way through, pass by pass."},"out":[{"text":{"zh":"一路过东岭、洛阳、汜水、荥阳、黄河渡口，关羽连斩六将。到古城与刘备重逢时，你的马已经换过三匹。","en":"Through Dongling, Luoyang, Sishui, Xingyang and the Yellow River ford, Guan Yu kills six generals. By the time you reunite with Liu Bei at Gucheng, you've worn out three horses."}}],"effects":[{"add":"rel.guanyu.esteem","by":1},{"add":"renown.loyal","by":1},{"add":"rel.liubei.trust","by":1}],"values":["yi","yong"],"place":"gucheng"},{"id":"pass","type":"dilemma","label":{"zh":"去求温芷，从丞相府弄一纸通关文书。","en":"Ask Wen Zhi to get you a travel pass from the Chancellor's office."},"out":[{"text":{"zh":"温芷什么也没问，第二天就把盖了印的文书交给你。东岭关的孔秀验过文书，放你们过去了。到了洛阳，韩福不认这份文书，关羽的刀还是出了鞘。后来你听说，温芷为这件事被叫去问了三天话。","en":"Wen Zhi asks nothing. The next day she hands you a stamped pass. At Dongling, Kong Xiu checks it and lets you through. At Luoyang, Han Fu refuses to honor it, and Guan Yu's blade comes out after all. Later you hear Wen Zhi was questioned for three days over it."}}],"effects":[{"set":"flag.pass_from_wenzhi","to":true},{"set":"flag.kongxiu_spared","to":true},{"add":"deviation","by":1},{"add":"rel.wenzhi.trust","by":1},{"add":"rel.guanyu.esteem","by":1},{"add":"rel.liubei.trust","by":1}],"req":{"v":"rel.wenzhi.trust","op":">=","val":2},"hint":{"zh":"需要温芷的信任 ≥ 2","en":"Needs Wen Zhi's trust ≥ 2"},"echo":["e_pass"],"debt":["d_five_passes"],"resolve":[["d_five_passes","transform"]],"values":["zhi"],"place":"gucheng"},{"id":"stay","type":"dilemma","label":{"zh":"留下来，做曹操的谋士。","en":"Stay, and serve Cao Cao as his adviser."},"out":[{"text":{"zh":"关羽在门口站了一会儿：『人各有志。保重。』他上马走了。当晚，曹操亲自给你斟了一杯酒。","en":"Guan Yu stands in the doorway a while. 'Every man chooses his own road. Take care.' He mounts and rides away. That evening Cao Cao pours you a cup of wine himself."}}],"effects":[{"set":"track","to":"cao"},{"add":"rel.liubei.trust","by":-3},{"add":"rel.guanyu.esteem","by":-1},{"add":"rel.caocao.esteem","by":2},{"add":"deviation","by":1}],"req":{"any":[{"v":"rel.caocao.esteem","op":">=","val":2},{"v":"flag.took_cao_post","op":"==","val":true}]},"hint":{"zh":"需要曹操的赏识 ≥ 2，或已接受曹营官职","en":"Needs Cao's regard ≥ 2, or a post under Cao"},"echo":["e_stay"],"values":["li"]}],"salience":0,"order":10,"when":{"v":"flag.with_guanyu","op":"==","val":true},"callbacks":[{"pays":"e_terms","text":{"zh":"曹操叹道：『土山上那三条，是子衡写的吧？我答应过，便不追了。』","en":"Cao sighs. 'Those three terms on the hill—Ziheng wrote them, didn't he? I gave my word. I won't pursue.'"},"when":{"v":"flag.drafted_terms","op":"==","val":true}},{"pays":"e_spoke","text":{"zh":"曹操把你叫到一边：『青梅亭上那个说话不留情的书生，我一直记得。留下来吧。』","en":"Cao takes you aside. 'The scholar at the plum pavilion who spared no one—I haven't forgotten. Stay.'"},"when":{"v":"flag.spoke_at_plum","op":"==","val":true}},{"pays":"e_cover","text":{"zh":"曹操把你叫到一边：『那天打翻酒樽的，是你吧？好快的手。留下来吧。』","en":"Cao takes you aside. 'It was you who knocked over that cup, wasn't it? Quick hands. Stay.'"},"when":{"v":"flag.covered_liu","op":"==","val":true}},{"pays":"e_warn_gifts","text":{"zh":"关羽封金时对你说：『你说过他要我欠他。今天，能还的我都还了。』","en":"As he seals the gold, Guan Yu says to you, 'You said he wanted me in his debt. Today I've repaid everything I can.'"},"when":{"v":"flag.warned_guan","op":"==","val":true}},{"pays":"e_fight","text":{"zh":"关羽说：『土山上你劝我死战。今天，我总算可以走了。』","en":"Guan Yu says, 'On the hill you told me to fight to the death. Today, at last, I can leave.'"},"when":{"v":"flag.urged_fight","op":"==","val":true}},{"pays":"e_post","text":{"zh":"你的主簿印信还放在案上。","en":"Your clerk's seal of office is still lying on the desk."},"when":{"v":"flag.took_cao_post","op":"==","val":true}},{"pays":"e_guan_fear","text":{"zh":"关羽说：『那晚说过的，最怕负了大哥。今天该走了。』","en":"Guan Yu says, 'I told you that night what I fear most. Today I have to go.'"},"when":{"v":"flag.guan_fear","op":"==","val":true}}],"art":{"scene":"hall","layers":[{"id":"seal"}]},"place":"xuchang","cast":[{"id":"guanyu"},{"id":"caocao"}]},"c4_yuan":{"id":"c4_yuan","chapter":"c4","kind":"main","title":{"zh":"袁绍营中","en":"In Yuan Shao's Camp"},"lock":"functional","canon":{"zh":"第25–28回","en":"Ch. 25–28"},"intro":[{"text":{"zh":"消息传到冀州：关羽在白马斩了袁绍的大将颜良。袁绍大怒，要杀刘备。","en":"News reaches Jizhou: at White Horse, Guan Yu has killed Yuan Shao's general Yan Liang. Yuan Shao is furious and wants Liu Bei dead."}}],"choices":[{"id":"letter","type":"strategy","label":{"zh":"献策：请主公向袁绍解释，再写信叫二弟来投。","en":"Advise your lord to explain himself to Yuan Shao, then write to his brother to come."},"out":[{"text":{"zh":"袁绍信了，转怒为喜。刘备的信送到许都，关羽很快辞别曹操，一路过关斩将寻来。他见到你，说：『写信这一着，是你出的主意？』","en":"Yuan Shao believes him and cheers up. The letter reaches Xuchang; Guan Yu soon takes leave of Cao and fights his way through the passes to find you. When he sees you he says, 'The letter—that was your idea?'"}}],"effects":[{"add":"rel.liubei.trust","by":1},{"add":"rel.guanyu.esteem","by":1}],"place":"gucheng"},{"id":"leave","type":"strategy","label":{"zh":"劝主公借口联络刘表，早日离开袁绍。","en":"Advise him to leave Yuan Shao early, on the pretext of contacting Liu Biao."},"out":[{"text":{"zh":"刘备借故南下汝南，在古城与关羽、张飞重聚。袁绍不久便在官渡大败。","en":"Liu Bei finds a reason to go south to Runan and reunites with Guan Yu and Zhang Fei at Gucheng. Not long after, Yuan Shao is crushed at Guandu."}}],"effects":[{"add":"rel.liubei.trust","by":1},{"add":"renown.cunning","by":1}],"place":"gucheng"},{"id":"guard","type":"dilemma","label":{"zh":"站到主公身前，替他挡袁绍的怒气。","en":"Step in front of your lord and take Yuan Shao's anger yourself."},"out":[{"text":{"zh":"袁绍的刀没有落下来。刘备什么也没说，只是那晚把自己的披风给了你。","en":"Yuan Shao's sword doesn't fall. Liu Bei says nothing, but that night he gives you his cloak."}}],"effects":[{"add":"rel.liubei.trust","by":2},{"add":"renown.loyal","by":1}],"place":"gucheng"},{"id":"foresee","type":"strategy","label":{"zh":"断言：袁绍必败，早走为上。","en":"Declare it: Yuan Shao is doomed. Leave while you can."},"out":[{"text":{"zh":"刘备借故南下。不到一年，袁绍在官渡大败。刘备想起你那句话，后背发凉。","en":"Liu Bei finds a reason to go south. Within the year Yuan Shao is crushed at Guandu. Liu Bei remembers what you said, and a chill runs down his back."}}],"effects":[{"add":"rel.liubei.trust","by":2},{"add":"uncanny","by":1},{"add":"renown.cunning","by":1}],"foresight":true,"place":"gucheng"}],"salience":0,"order":10,"when":{"v":"flag.with_guanyu","op":"!=","val":true},"callbacks":[{"pays":"e_news","text":{"zh":"刘备握着你的手：『若不是你从下邳带出那句话，我还以为二弟死了。』","en":"Liu Bei grips your hand. 'If you hadn't brought me word from Xiapi, I'd have thought my brother dead.'"},"when":{"v":"flag.carried_news","op":"==","val":true}},{"pays":"e_spoke","text":{"zh":"刘备苦笑：『听说曹操至今还在打听，青梅亭上那个书生是谁。』","en":"Liu Bei smiles ruefully. 'I hear Cao is still asking who that scholar at the plum pavilion was.'"},"when":{"v":"flag.spoke_at_plum","op":"==","val":true}}],"art":{"scene":"camp","layers":[]},"place":"jizhou","cast":[{"id":"liubei"}]},"c5_letter":{"id":"c5_letter","chapter":"c5","kind":"side","title":{"zh":"徐母之书","en":"A Letter from His Mother"},"lock":"functional","canon":{"zh":"第36回","en":"Ch. 36"},"intro":[{"text":{"zh":"一封信从许都辗转送到你手里，是温芷的字：『程昱仿徐母笔迹作书，将召徐元直北上。徐母本人不知。』第二天，徐庶就收到了『母亲』的信，哭着要走。","en":"A letter reaches you by a roundabout route from Xuchang, in Wen Zhi's hand: 'Cheng Yu has forged a letter in Xu Shu's mother's handwriting to summon him north. She knows nothing of it.' The next day Xu Shu receives a letter from his 'mother' and, in tears, prepares to go."}}],"choices":[{"id":"tell","type":"dilemma","label":{"zh":"把真相告诉徐庶。","en":"Tell Xu Shu the truth."},"out":[{"text":{"zh":"徐庶拿着两封信对照了一夜，留下了。可他的母亲还在曹操手里，从那以后，他再没睡过一个整觉。","en":"Xu Shu compares the two letters all night, and stays. But his mother is still in Cao's hands, and he never sleeps through the night again."}}],"effects":[{"set":"flag.xushu_stayed","to":true},{"add":"deviation","by":1},{"add":"rel.liubei.trust","by":1}],"echo":["e_xushu"],"debt":["d_recommend"]},{"id":"silent","type":"dilemma","label":{"zh":"沉默。他的母亲在曹营，他留下也救不了她。","en":"Say nothing. His mother is in Cao's hands; staying won't save her."},"out":[{"text":{"zh":"徐庶走了。出城十里，他又拨马回来，对刘备说：『此间有一奇士，只在襄阳城外二十里隆中。』说完再不回头。你一直看着他的背影。","en":"Xu Shu leaves. Ten li out he turns his horse back and tells Liu Bei, 'There is a remarkable man nearby, at Longzhong, twenty li outside Xiangyang.' Then he rides off without looking back. You watch him until he's gone."}}],"effects":[{"add":"renown.cunning","by":1}]},{"id":"tell_liu","type":"strategy","label":{"zh":"先告诉主公，由他决定。","en":"Tell your lord first and let him decide."},"out":[{"text":{"zh":"刘备想了很久：『母子天伦，我不能拦。』徐庶还是走了，临行前举荐了隆中的诸葛亮。刘备对你说：『你能先来问我，很好。』","en":"Liu Bei thinks a long time. 'A son and his mother—I can't stand in the way.' Xu Shu leaves, recommending Zhuge Liang of Longzhong before he goes. Liu Bei tells you, 'It was right of you to come to me first.'"}}],"effects":[{"add":"rel.liubei.trust","by":2}]}],"salience":3,"order":1,"when":{"all":[{"v":"track","op":"==","val":"liu"},{"any":[{"v":"rel.wenzhi.trust","op":">=","val":3},{"v":"flag.pass_from_wenzhi","op":"==","val":true}]}]},"callbacks":[{"pays":"e_pass","text":{"zh":"信末一行小字：『文书一事，问了三日，无妨。』","en":"A line squeezed in at the bottom: 'About the pass—three days of questions. I'm fine.'"},"when":{"v":"flag.pass_from_wenzhi","op":"==","val":true}},{"pays":"e_wenzhi_spy","text":{"zh":"这一回，她不只是在听了。","en":"This time she's done more than listen."},"when":{"v":"flag.asked_wenzhi","op":"==","val":true}}],"art":{"scene":"letter","layers":[{"id":"seal"}]},"place":"xinye","cast":[{"id":"wenzhi"}]},"c5_mirror":{"id":"c5_mirror","chapter":"c5","kind":"side","title":{"zh":"水镜庄","en":"Water Mirror Manor"},"lock":"free","canon":{"zh":"第35回","en":"Ch. 35"},"intro":[{"text":{"zh":"刘备带你去拜访隐士司马徽。水镜先生抚琴待客，谈到天下人才，只说了一句话。","en":"Liu Bei takes you to call on the recluse Sima Hui. Master Water Mirror receives you with his zither, and when talk turns to talent, he says only one thing."}}],"choices":[{"id":"ask_phoenix","type":"strategy","label":{"zh":"追问：凤雏是谁？","en":"Press him: who is the Young Phoenix?"},"out":[{"text":{"zh":"司马徽笑而不答。出门时，他的童子悄悄告诉你：『襄阳庞士元。』","en":"Sima Hui only smiles. On your way out, his servant boy whispers, 'Pang Shiyuan of Xiangyang.'"}}],"effects":[{"set":"flag.knows_pangtong","to":true}]},{"id":"ask_dragon","type":"expression","label":{"zh":"追问：卧龙在何处？","en":"Press him: where is the Sleeping Dragon?"},"out":[{"text":{"zh":"司马徽只说：『好，好。』刘备一路上都在念叨这两个字。","en":"Sima Hui says only, 'Good, good.' Liu Bei repeats it to himself the whole way home."}}],"effects":[]},{"id":"self","type":"expression","label":{"zh":"笑问：『先生看我算哪一种？』","en":"Ask with a smile: 'And which kind am I?'"},"out":[{"text":{"zh":"司马徽认真看了你一会儿：『你是记性好的那种。』刘备大笑。","en":"Sima Hui studies you seriously. 'You're the kind with a good memory.' Liu Bei roars with laughter."}}],"effects":[]}],"salience":1,"order":2,"when":{"v":"track","op":"==","val":"liu"},"quote":{"zh":"徽曰：「伏龙、凤雏，两人得一，可安天下。」","en":"Sima Hui said: \"Sleeping Dragon, Young Phoenix: win either one, and you can bring peace to the realm.\""},"art":{"scene":"mirror","layers":[]},"place":"xinye","cast":[{"id":"liubei"}]},"c5_cottage":{"id":"c5_cottage","chapter":"c5","kind":"main","title":{"zh":"三顾茅庐","en":"Three Visits to the Thatched Cottage"},"lock":"literal","canon":{"zh":"第37–38回","en":"Ch. 37–38"},"intro":[{"text":{"zh":"徐庶走马荐了诸葛亮。刘备冒着风雪去了隆中三次，前两次都扑了空。","en":"Xu Shu, on his way out, recommended Zhuge Liang. Liu Bei goes to Longzhong three times through wind and snow; the first two times he finds no one home."},"when":{"v":"flag.xushu_stayed","op":"!=","val":true}},{"text":{"zh":"徐庶留了下来。少了那一场离别，就没有人在城外回马举荐什么人。刘备只记得水镜先生那句『卧龙、凤雏』。","en":"Xu Shu has stayed. Without that farewell, no one turns back at the gate to recommend anyone. All Liu Bei has is Master Water Mirror's riddle about a dragon and a phoenix."},"when":{"v":"flag.xushu_stayed","op":"==","val":true}},{"text":{"zh":"刘备待你仍旧客气，只是议事时，他不再先问你。","en":"Liu Bei is as courteous as ever—but at council, he no longer asks you first."},"when":{"v":"imp.liubei.offended","op":">=","val":1}},{"text":{"zh":"刘备笑着对诸葛亮说：『子衡这人，什么话都敢说。』你分不清这是夸你还是提醒你。","en":"Liu Bei says to Zhuge Liang with a smile, 'Ziheng will say anything.' You can't tell whether it's praise or a warning."},"when":{"v":"renown.rash","op":">=","val":2}}],"choices":[{"id":"wait","type":"strategy","label":{"zh":"陪主公三顾，第三次在门外站着等他睡醒。","en":"Go with your lord all three times, and the third time stand outside until the man wakes."},"out":[{"text":{"zh":"诸葛亮终于出来，为刘备画了一张天下的图：『将军欲成霸业，北让曹操占天时，南让孙权占地利，将军可占人和。』出门时，他特意向你拱了拱手。","en":"Zhuge Liang finally comes out and draws Liu Bei a map of the realm: 'If you would build an empire, let Cao Cao have the moment in the north and Sun Quan the land in the south; you can have the people.' On the way out he makes a point of bowing to you."}}],"effects":[{"add":"rel.zhuge.esteem","by":2},{"add":"rel.liubei.trust","by":1}],"when":{"v":"flag.xushu_stayed","op":"!=","val":true},"values":["ren","cheng"]},{"id":"co_rec","type":"strategy","label":{"zh":"和徐庶一起，向主公举荐隆中的诸葛亮。","en":"Join Xu Shu in recommending Zhuge Liang of Longzhong to your lord."},"out":[{"text":{"zh":"刘备三顾隆中。诸葛亮出山时说：『元直举荐，子衡作陪，亮岂敢不来？』隆中对那张图，你们三个人一起看的。","en":"Liu Bei makes his three visits. When Zhuge Liang agrees to come, he says, 'Recommended by Yuanzhi, escorted by Ziheng—how could I refuse?' The three of you study his map together."}}],"effects":[{"add":"rel.zhuge.esteem","by":2},{"add":"rel.liubei.trust","by":1}],"when":{"v":"flag.xushu_stayed","op":"==","val":true},"resolve":[["d_recommend","reroute"]],"values":["yi"]},{"id":"pangtong","type":"strategy","label":{"zh":"同时举荐庞统：卧龙、凤雏，为何不能两个都要？","en":"Recommend Pang Tong as well: why not have both the dragon and the phoenix?"},"out":[{"text":{"zh":"刘备三顾隆中，请出了诸葛亮；又派人去襄阳，庞统竟也来了。他长得丑，话却说得漂亮。诸葛亮笑道：『子衡这一手，比我快了好几年。』","en":"Liu Bei makes his three visits and wins Zhuge Liang; he also sends to Xiangyang, and Pang Tong comes too. He's ugly, but he talks beautifully. Zhuge Liang laughs. 'Ziheng's move is several years ahead of mine.'"}}],"effects":[{"set":"flag.pangtong_joined","to":true},{"add":"deviation","by":1},{"add":"rel.zhuge.esteem","by":1},{"add":"rel.liubei.trust","by":1}],"req":{"v":"flag.knows_pangtong","op":"==","val":true},"hint":{"zh":"需要知道凤雏是谁","en":"Needs to know who the Young Phoenix is"},"echo":["e_pangtong"],"debt":["d_lianhuan"],"resolve":[["d_recommend","reroute"]],"values":["zhi"]},{"id":"aside","type":"dilemma","label":{"zh":"站在一边冷眼看着：这个年轻人一来，你的位置就没了。","en":"Stand aside and watch coldly: once this young man arrives, your place is gone."},"out":[{"text":{"zh":"刘备自己去了隆中三次。","en":"Liu Bei goes to Longzhong three times on his own."},"when":{"v":"flag.xushu_stayed","op":"==","val":true}},{"text":{"zh":"诸葛亮出山了。他待你客气，客气得让你发冷。有一晚刘备问你：『子衡近来话少了？』","en":"Zhuge Liang comes. He is polite to you—so polite it chills you. One night Liu Bei asks, 'You've been quiet lately, Ziheng?'"}}],"effects":[{"add":"rel.zhuge.trust","by":-2},{"add":"rel.liubei.trust","by":-1},{"add":"renown.cunning","by":1},{"set":"flag.aside_zhuge","to":true}],"echo":["e_aside"],"resolve":[["d_recommend","reroute"]],"values":["li"]},{"id":"preempt","type":"dilemma","label":{"zh":"抢在诸葛亮开口之前，把三分天下的大势先说给主公听。","en":"Before Zhuge Liang can speak, lay out the three-way division of the realm for your lord yourself."},"out":[{"text":{"zh":"刘备听得出神。诸葛亮出来时，你已经说完了。他看了你一眼，把准备好的地图又卷了起来，只说：『子衡兄所言，正是亮之所想。』","en":"Liu Bei listens spellbound. By the time Zhuge Liang comes out, you've finished. He glances at you, rolls his prepared map back up, and says only, 'Ziheng has said exactly what I was thinking.'"}}],"effects":[{"add":"rel.liubei.trust","by":2},{"add":"rel.zhuge.trust","by":-2},{"add":"rel.zhuge.esteem","by":1},{"add":"uncanny","by":1}],"foresight":true,"resolve":[["d_recommend","reroute"]],"values":["zhi"]}],"salience":0,"order":10,"when":{"v":"track","op":"==","val":"liu"},"quote":{"zh":"孔明曰：「……将军欲成霸业，北让曹操占天时，南让孙权占地利，将军可占人和。」","en":"Zhuge Liang said: \"…If you would build an empire, let Cao Cao have the moment in the north and Sun Quan the land in the south; you can have the people.\""},"callbacks":[{"pays":"e_cover","text":{"zh":"风雪里，刘备忽然说：『许都那杯酒，我一直记得。先生胆大心细，今天也帮我看看这个人。』","en":"In the snow Liu Bei suddenly says, 'I've never forgotten that cup of wine in Xuchang. You're bold and careful. Help me judge this man today.'"},"when":{"v":"flag.covered_liu","op":"==","val":true}},{"pays":"e_xushu","text":{"zh":"徐庶走在你身边，低声说：『我母亲的事……多谢。』","en":"Xu Shu walks beside you and says quietly, 'About my mother… thank you.'"},"when":{"v":"flag.xushu_stayed","op":"==","val":true}},{"pays":"e_news","text":{"zh":"刘备说：『当年你从下邳带来那一句话，我就知道，你是能托付的人。』","en":"Liu Bei says, 'When you brought me that message from Xiapi, I knew you were someone I could rely on.'"},"when":{"v":"flag.carried_news","op":"==","val":true}},{"pays":"e_pass","text":{"zh":"刘备问起：『听说云长过关时有一纸文书，是哪位贵人？』你没有说出她的名字。","en":"Liu Bei asks, 'I hear Yunchang had a pass at the checkpoints. Who was the benefactor?' You don't say her name."},"when":{"v":"flag.pass_from_wenzhi","op":"==","val":true}}],"ask":{"who":"zhuge","fallback":"dodge","q":{"zh":"诸葛亮请刘备入内，却先看向你：『子衡兄在门外站了半日。亮想先问一句——刘使君凭什么取天下？』","en":"Zhuge Liang invites Liu Bei in, but looks at you first. 'You stood outside half the day, Ziheng. Let me ask you first: what will Lord Liu take the realm with?'"},"answers":[{"id":"land","means":{"zh":"地利：荆州、益州、据险而守、三分天下","en":"territory: Jingzhou, Yizhou, a three-way split"},"out":[{"text":{"zh":"诸葛亮手里的扇子停了。他看了你很久：『这张图，亮画了十年，还没给人看过。子衡兄从哪里看来的？』","en":"Zhuge Liang's fan stops. He looks at you a long time. 'I've drawn that map for ten years and shown it to no one. Where did you see it, Ziheng?'"}}],"effects":[{"add":"rel.zhuge.esteem","by":2},{"add":"rel.zhuge.trust","by":-1},{"add":"uncanny","by":1}],"match":"荆州|益州|西川|两川|巴蜀|汉中|三分|鼎足|jingzhou|yizhou|shu|three ways|tripod","mood":"surprised"},{"id":"doubt","means":{"zh":"说取不了天下、没有机会","en":"says he can't"},"out":[{"text":{"zh":"刘备的脸色变了。诸葛亮却笑了：『肯说真话的人不多。那亮就来试试，看能不能让子衡兄改口。』","en":"Liu Bei's face changes. Zhuge Liang laughs. 'Few men will tell the truth. Then let me try to make you change your mind.'"}}],"effects":[{"add":"rel.zhuge.esteem","by":1},{"add":"rel.liubei.trust","by":-2}],"match":"取不了|不能|没机会|没有机会|难|不行|can't|cannot|no chance|impossible","mood":"surprised"},{"id":"fate","means":{"zh":"天命、汉室宗亲、皇叔的名分","en":"Heaven's mandate, his imperial blood"},"out":[{"text":{"zh":"诸葛亮淡淡一笑：『天命，是说给别人听的。子衡兄自己信吗？』","en":"Zhuge Liang smiles faintly. 'Heaven's mandate is something you tell other people. Do you believe it yourself?'"}}],"effects":[{"add":"rel.zhuge.esteem","by":-1}],"match":"天命|天意|宗亲|皇叔|汉室|正统|血脉|mandate|heaven|imperial|bloodline","mood":"neutral"},{"id":"ren","means":{"zh":"仁义、人心、百姓","en":"benevolence, people's hearts"},"out":[{"text":{"zh":"诸葛亮点头：『人和。曹操有天时，孙权有地利，使君能有的，只有这个。』刘备在旁边听着，没有说话。","en":"Zhuge Liang nods. 'The people. Cao has the moment, Sun Quan has the land; this is all my lord can have.' Liu Bei listens and says nothing."}}],"effects":[{"add":"rel.zhuge.esteem","by":1},{"add":"rel.liubei.trust","by":1}],"match":"仁|义|人心|民心|百姓|人和|benevol|righteous|the people|hearts","mood":"warm"},{"id":"talent","means":{"zh":"人才、得人、请到诸葛亮这样的人","en":"talent, winning men like Zhuge"},"out":[{"text":{"zh":"诸葛亮笑了：『这一句，亮听出来了，是在夸亮。』他摇着扇子，却没有否认。","en":"Zhuge Liang smiles. 'I can hear that one is meant for me.' He fans himself, but doesn't deny it."}}],"effects":[{"add":"rel.zhuge.esteem","by":1}],"match":"人才|得人|贤|先生|孔明|卧龙|talent|able men|kongming","mood":"warm"},{"id":"dodge","means":{"zh":"推辞、不正面回答","en":"evades"},"out":[{"text":{"zh":"诸葛亮也不追问：『那就听亮说吧。』","en":"Zhuge Liang doesn't press. 'Then hear what I have to say.'"}}],"effects":[],"match":"不知|不敢|先生说|请先生|i don't know|you tell","mood":"neutral"}]},"art":{"scene":"snow","layers":[{"id":"three"},{"id":"xushu","when":{"v":"flag.xushu_stayed","op":"==","val":true}}]},"place":"xinye","cast":[{"id":"zhuge"},{"id":"liubei"}]},"c5_spring":{"id":"c5_spring","chapter":"c5","kind":"side","title":{"zh":"当归","en":"Angelica"},"lock":"free","canon":{"zh":"原创人物","en":"original character"},"intro":[{"text":{"zh":"春天，温芷在药圃里晒药，你帮她翻竹匾。这样的日子已经过了好几年，你们谁都没有说破。","en":"Spring. Wen Zhi is drying herbs in the garden, and you help turn the trays. You've had years of days like this, and neither of you has said anything."}}],"choices":[{"id":"speak","type":"dilemma","label":{"zh":"把话说破。","en":"Say it."},"out":[{"text":{"zh":"她把一片当归放进你手心：『这个，叫当归。』她没再说别的，你也懂了。","en":"She puts a slice of angelica root in your palm. 'This is called danggui—\"you should come home.\"' She says nothing more, and you understand."}}],"effects":[{"add":"rel.wenzhi.intimacy","by":2},{"set":"flag.wenzhi_together","to":true}],"echo":["e_angelica"]},{"id":"wait","type":"expression","label":{"zh":"再等等，等天下定了再说。","en":"Wait a little longer—until the realm is settled."},"out":[{"text":{"zh":"她点点头，像是早就知道你会这么说。","en":"She nods, as if she knew you'd say that."}}],"effects":[{"add":"rel.wenzhi.trust","by":1}]},{"id":"chengyu","type":"strategy","label":{"zh":"问她：丞相府里，谁最不喜欢你？","en":"Ask her: who in the Chancellor's household likes you least?"},"out":[{"text":{"zh":"『程昱，』她说，『他说你骨子里还是刘备的人。』","en":"'Cheng Yu,' she says. 'He says that deep down you still belong to Liu Bei.'"}}],"effects":[{"add":"rel.wenzhi.trust","by":1}]}],"salience":2,"order":1,"when":{"all":[{"v":"track","op":"==","val":"cao"},{"v":"rel.wenzhi.intimacy","op":">=","val":2}]},"mood":"romance","art":{"scene":"herbs","layers":[{"id":"two"},{"id":"spring"},{"id":"romance"}]},"place":"xuchang","cast":[{"id":"wenzhi"}]},"c5_forge":{"id":"c5_forge","chapter":"c5","kind":"main","title":{"zh":"程昱之书","en":"Cheng Yu's Letter"},"lock":"functional","canon":{"zh":"第36回","en":"Ch. 36"},"intro":[{"text":{"zh":"程昱来找你：刘备得了个军师徐庶，屡次坏丞相的事。徐庶是孝子，他母亲就在许都。『你写得一手好字，』程昱说，『仿一封徐母的家书，不难吧？』","en":"Cheng Yu comes to see you. Liu Bei has a new strategist, Xu Shu, who keeps spoiling the Chancellor's plans. Xu Shu is a devoted son, and his mother is in Xuchang. 'You write a fine hand,' Cheng Yu says. 'Forging a letter from his mother shouldn't be hard.'"}}],"choices":[{"id":"forge","type":"dilemma","label":{"zh":"写。这是丞相的命令。","en":"Write it. These are the Chancellor's orders."},"out":[{"text":{"zh":"信写得很像。徐庶果然来了许都，见到母亲才知道是假信。徐母大骂儿子糊涂，当晚自缢。你在灵前站了很久。","en":"The letter is a good likeness. Xu Shu comes to Xuchang and learns from his mother that it was forged. She rebukes him for a fool and hangs herself that night. You stand before her coffin a long time."}}],"effects":[{"add":"rel.caocao.esteem","by":2},{"add":"renown.cunning","by":2},{"set":"flag.forged_letter","to":true}],"echo":["e_forged"]},{"id":"refuse","type":"strategy","label":{"zh":"推说手伤，写不了。","en":"Claim an injured hand and beg off."},"out":[{"text":{"zh":"程昱自己写了。徐庶照样来了，徐母照样死了。程昱从此不太和你说话。","en":"Cheng Yu writes it himself. Xu Shu comes all the same, and his mother dies all the same. Cheng Yu barely speaks to you after that."}}],"effects":[{"add":"rel.caocao.esteem","by":-1},{"add":"renown.loyal","by":1}]},{"id":"warn","type":"dilemma","label":{"zh":"表面答应，暗中托人给新野送信，揭穿此事。","en":"Agree to his face, then secretly send word to Xinye exposing the plot."},"out":[{"text":{"zh":"信写了，可徐庶没有来。程昱查了半个月，没有查到你。徐母活了下来，被软禁在许都。","en":"The letter is written, but Xu Shu doesn't come. Cheng Yu investigates for half a month and never finds you. Xu Shu's mother lives, under guard in Xuchang."}},{"text":{"zh":"后来听说，刘备还是去隆中请出了诸葛亮——是水镜先生指的路。","en":"Later you hear Liu Bei went to Longzhong and won Zhuge Liang anyway—Master Water Mirror pointed the way."}}],"effects":[{"set":"flag.xushu_stayed","to":true},{"add":"deviation","by":1},{"add":"rel.liubei.trust","by":1}],"debt":["d_recommend"],"resolve":[["d_recommend","reroute"]]}],"salience":0,"order":10,"when":{"v":"track","op":"==","val":"cao"},"callbacks":[{"pays":"e_spoke","text":{"zh":"程昱补了一句：『丞相说，青梅亭上就看出你这人心思多。』","en":"Cheng Yu adds, 'The Chancellor says he saw at the plum pavilion how many thoughts you keep.'"},"when":{"v":"flag.spoke_at_plum","op":"==","val":true}},{"pays":"e_cover","text":{"zh":"程昱说：『丞相还记得你那天打翻的酒樽。他说你手快，心更快。』","en":"Cheng Yu says, 'The Chancellor still remembers the cup you knocked over. He says your hands are quick and your mind quicker.'"},"when":{"v":"flag.covered_liu","op":"==","val":true}},{"pays":"e_post","text":{"zh":"程昱说：『主簿大人，丞相府的笔，你用了七年了。』","en":"Cheng Yu says, 'Master Clerk, you've held the Chancellor's brush for seven years now.'"},"when":{"v":"flag.took_cao_post","op":"==","val":true}}],"art":{"scene":"letter","layers":[{"id":"seal"}]},"place":"xuchang","cast":[{"id":"caocao"}]},"c6_slope":{"id":"c6_slope","chapter":"c6","kind":"main","title":{"zh":"长坂坡","en":"Changban Slope"},"lock":"literal","canon":{"zh":"第41–42回","en":"Ch. 41–42"},"intro":[{"text":{"zh":"刘备摆手打断你：『这时候，不必说好听的。』","en":"Liu Bei waves you silent. 'This is no time for pretty words.'"},"when":{"v":"imp.liubei.flattery","op":">=","val":1}},{"text":{"zh":"当阳长坂，曹军追到了。百姓哭喊着四散，刘备的家眷在乱军中走散了。","en":"Changban, near Dangyang. Cao's cavalry catches up. Civilians scatter, screaming, and Liu Bei's family is lost in the chaos."}}],"choices":[{"id":"abandon","type":"strategy","label":{"zh":"劝主公扔下百姓，轻骑快走。","en":"Urge your lord to leave the civilians and ride for it."},"out":[{"text":{"zh":"刘备红着眼睛：『举大事者必以人为本。今人归我，奈何弃之？』他没听你的。身边几个将领看你的眼神变了。","en":"Liu Bei's eyes are red. 'Great undertakings rest on the people. They have come to me—how can I abandon them?' He doesn't take your advice. Several of his officers look at you differently after that."}}],"effects":[{"add":"rel.liubei.trust","by":-2},{"add":"renown.cunning","by":1},{"set":"flag.abandon_advice","to":true}],"echo":["e_abandon"],"values":["li"]},{"id":"search","type":"dilemma","label":{"zh":"跟赵云一起杀回去，找夫人和小公子。","en":"Ride back in with Zhao Yun to find the lady and the young heir."},"out":[{"text":{"zh":"你们在一堵断墙后找到了糜夫人，她腿上中了枪，怀里抱着阿斗。赵云接过孩子，你扶夫人上了你的马。赵云单骑在前，怀抱阿斗冲出重围；你带着夫人从小路绕出来，左肩挨了一箭。","en":"Behind a broken wall you find Lady Mi, a spear wound in her leg, the infant Adou in her arms. Zhao Yun takes the child; you lift the lady onto your horse. Zhao Yun rides out alone through the encirclement with Adou at his chest, while you take the lady out by a back path and catch an arrow in your left shoulder."}}],"effects":[{"set":"flag.mi_saved","to":true},{"set":"flag.wounded","to":true},{"add":"deviation","by":1},{"add":"rel.liubei.trust","by":2},{"add":"renown.loyal","by":1}],"echo":["e_mi"],"debt":["d_mi"],"resolve":[["d_mi","transform"]],"req":{"v":"rel.liubei.trust","op":">=","val":4},"hint":{"zh":"需要刘备的信任 ≥ 4，他才会把家眷托给你","en":"Needs Liu Bei's trust ≥ 4 to entrust his family to you"},"values":["ren","yong"]},{"id":"dust","type":"strategy","label":{"zh":"献策：让张飞在长坂桥东的树林里拖着树枝跑马，扬尘作疑兵。","en":"Suggest Zhang Fei have riders drag branches through the woods east of the bridge to raise dust and fake an army."},"out":[{"text":{"zh":"张飞横矛立马桥上，大喝一声：『我乃燕人张翼德也！谁敢与我决一死战？』身后林中尘土大起。曹军疑有伏兵，竟不敢过桥。","en":"Zhang Fei plants himself on the bridge with his spear across his saddle and roars, 'I am Zhang Yide of Yan! Who dares fight me to the death?' Behind him dust boils up from the woods. Suspecting an ambush, Cao's army won't cross."}}],"effects":[{"add":"rel.liubei.trust","by":1},{"add":"renown.loyal","by":1}]},{"id":"guard_family","type":"strategy","label":{"zh":"预先劝主公：让赵云专护家眷，寸步不离。","en":"Warn your lord in advance: have Zhao Yun guard his family and never leave their side."},"out":[{"text":{"zh":"刘备依了你。乱军中家眷还是被冲散了，赵云单骑杀回去，把阿斗抱了出来；糜夫人离得近，被你扶上了马。","en":"Liu Bei takes your advice. The family is still scattered in the rout; Zhao Yun rides back alone and carries Adou out; Lady Mi was close by, and you get her onto your horse."}}],"effects":[{"set":"flag.mi_saved","to":true},{"add":"uncanny","by":1},{"add":"deviation","by":1},{"add":"rel.liubei.trust","by":1}],"foresight":true,"echo":["e_mi"],"debt":["d_mi"],"resolve":[["d_mi","transform"]]}],"salience":0,"order":10,"when":{"v":"track","op":"==","val":"liu"},"callbacks":[{"pays":"e_aside","text":{"zh":"诸葛亮在乱军里喊你的名字，让你护着百姓先走。他的声音很稳，你却没有回头。","en":"Through the chaos Zhuge Liang calls your name, telling you to get the civilians moving. His voice is steady; you don't look back."},"when":{"v":"flag.aside_zhuge","op":"==","val":true}},{"pays":"e_people","text":{"zh":"你想起古城楼上他说的：我从没扔下过他们。","en":"You remember what he said on the Gucheng wall: I've never left them behind."},"when":{"v":"flag.heard_people","op":"==","val":true}}],"art":{"scene":"bridge","layers":[{"id":"dust","choice":"dust"},{"id":"rescue","choice":"search"}]},"place":"changban","cast":[{"id":"liubei"}]},"c6_pursuit":{"id":"c6_pursuit","chapter":"c6","kind":"main","title":{"zh":"长坂追击","en":"The Pursuit at Changban"},"lock":"literal","canon":{"zh":"第41回","en":"Ch. 41"},"intro":[{"text":{"zh":"长坂坡上，一员白袍将抱着婴孩，在你们的阵里杀进杀出，所向披靡。曹操在山顶看着，问：『那是谁？』","en":"On the slope at Changban, a general in a white robe with an infant strapped to his chest cuts through your lines again and again. From the hilltop Cao Cao asks, 'Who is that?'"}}],"choices":[{"id":"alive","type":"strategy","label":{"zh":"答：『常山赵子龙。此人只可活捉，不可射杀。』","en":"Answer: 'Zhao Zilong of Changshan. Take him alive; don't shoot him.'"},"out":[{"text":{"zh":"曹操点头，急令传报：『如赵云到，不许放冷箭，只要捉活的。』赵云就这样一路杀了出去。曹操望着他的背影：『好一员将。』","en":"Cao nods and sends word down the lines: 'If Zhao Yun comes your way, no arrows—take him alive.' And so Zhao Yun fights his way out. Cao watches him go. 'What a general.'"}}],"effects":[{"add":"rel.caocao.esteem","by":1}]},{"id":"shoot","type":"dilemma","label":{"zh":"劝曹操下令放箭：这一个人能抵一支军队。","en":"Urge Cao to order the archers to shoot: this one man is worth an army."},"out":[{"text":{"zh":"曹操犹豫了一下：『这样的人，杀了可惜。』他还是下令捉活的。赵云冲了出去。曹操看了你一眼，没说什么。","en":"Cao hesitates. 'A man like that—it would be a waste to kill him.' He orders him taken alive. Zhao Yun breaks out. Cao glances at you and says nothing."}}],"effects":[{"add":"rel.caocao.esteem","by":-1},{"add":"renown.cunning","by":1}]},{"id":"gap","type":"dilemma","label":{"zh":"借口查看后军，悄悄让开一条路，放刘备的家眷过去。","en":"Make an excuse to inspect the rear and quietly open a gap for Liu Bei's people."},"out":[{"text":{"zh":"几辆车从你让开的缺口里逃了出去。没有人看见——你希望没有人看见。","en":"A few carts escape through the gap you've opened. No one saw—you hope no one saw."}}],"effects":[{"set":"flag.secret_mercy","to":true},{"add":"rel.liubei.trust","by":1},{"add":"renown.loyal","by":1}],"echo":["e_mercy"]}],"salience":0,"order":10,"when":{"v":"track","op":"==","val":"cao"},"quote":{"zh":"（曹操传令各处）「如赵云到，不许放冷箭，只要捉活的。」","en":"(Cao Cao's order to every unit) \"If Zhao Yun comes, no stray arrows. Take him alive.\""},"callbacks":[{"pays":"e_forged","text":{"zh":"你想起徐庶。他也在刘备的队伍里吗？","en":"You think of Xu Shu. Is he in Liu Bei's column too?"},"when":{"v":"flag.forged_letter","op":"==","val":true}},{"pays":"e_stay","text":{"zh":"远处是刘备的旗号。七年前，你本该在那面旗下面。","en":"In the distance fly Liu Bei's banners. Seven years ago you would have been under them."},"when":{"v":"track","op":"==","val":"cao"}}],"art":{"scene":"slope","layers":[{"id":"gap","choice":"gap"}]},"pla
