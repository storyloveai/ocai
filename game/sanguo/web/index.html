ce":"changban","cast":[{"id":"caocao"}]},"c7_arrows":{"id":"c7_arrows","chapter":"c7","kind":"side","title":{"zh":"草船借箭","en":"Borrowing Arrows"},"lock":"literal","canon":{"zh":"第46回","en":"Ch. 46"},"intro":[{"text":{"zh":"周瑜要诸葛亮十天造十万支箭，诸葛亮说三天就够。第三天夜里，大雾漫江，他请鲁肃和你上船喝酒。","en":"Zhou Yu demands a hundred thousand arrows in ten days; Zhuge Liang says three days will do. On the third night thick fog covers the river, and he invites Lu Su and you aboard to drink."}}],"choices":[{"id":"drink","type":"expression","label":{"zh":"陪他饮酒，听北岸箭如雨下。","en":"Drink with him and listen to the arrows rain down from the north bank."},"out":[{"text":{"zh":"二十条草船靠近曹营擂鼓呐喊。曹军不敢出战，只管放箭。天亮收船，船两边插满了箭。诸葛亮举杯：『子衡今夜不慌，难得。』","en":"Twenty straw-lined boats close on Cao's camp with drums and shouting. Cao's men won't come out; they just shoot. At dawn the boats pull back bristling with arrows. Zhuge Liang raises his cup. 'You kept calm tonight, Ziheng. That's rare.'"}}],"effects":[{"add":"rel.zhuge.esteem","by":1}]},{"id":"tell_lusu","type":"dilemma","label":{"zh":"先把计策悄悄告诉鲁肃，免得他吓坏。","en":"Quietly explain the plan to Lu Su first, so he doesn't panic."},"out":[{"text":{"zh":"鲁肃松了一口气，转身却把话告诉了周瑜。周瑜对诸葛亮更加忌惮。诸葛亮看你的眼神多了一分探究：『这条计，我对谁都没说过。』","en":"Lu Su is relieved—and then tells Zhou Yu, who grows warier still of Zhuge Liang. Zhuge Liang studies you more closely. 'I never told anyone this plan.'"}}],"effects":[{"add":"uncanny","by":1},{"add":"rel.zhuge.trust","by":-1}],"foresight":true}],"salience":1,"order":1,"when":{"all":[{"v":"track","op":"==","val":"liu"},{"v":"flag.wounded","op":"!=","val":true}]},"art":{"scene":"fog","layers":[{"id":"arrows"}]},"place":"chibi","cast":[{"id":"zhuge"}]},"c7_letter":{"id":"c7_letter","chapter":"c7","kind":"side","title":{"zh":"江上来信","en":"A Letter Across the River"},"lock":"free","canon":{"zh":"原创人物","en":"original character"},"intro":[{"text":{"zh":"这封信写得很短。上回你那些话，她大概还没消气。","en":"The letter is short. She probably hasn't forgiven what you said last time."},"when":{"v":"imp.wenzhi.offended","op":">=","val":1}},{"text":{"zh":"一封信穿过两军的封锁送到你手里：温芷随曹军南下了，在乌林后营给病兵配药。信里说北兵晕船，丞相在想办法让船稳下来。末尾一句：『江上风大，你多穿些。』","en":"A letter slips through both armies' lines to you: Wen Zhi has come south with Cao's army and is mixing medicine for the sick at the rear camp at Wulin. Northern soldiers are seasick, she writes, and the Chancellor is looking for a way to steady the boats. The last line: 'It's windy on the river. Dress warmly.'"}}],"choices":[{"id":"warn","type":"dilemma","label":{"zh":"回信：『冬至以后，离开水寨，越远越好。』","en":"Write back: 'After the solstice, get away from the river camp. As far as you can.'"},"out":[{"text":{"zh":"你没法解释为什么。回信只有一个字：『好。』","en":"You can't explain why. Her reply is a single word: 'Yes.'"}}],"effects":[{"set":"flag.wenzhi_warned","to":true},{"add":"uncanny","by":1},{"add":"rel.wenzhi.intimacy","by":1}],"foresight":true,"echo":["e_warned"]},{"id":"use","type":"strategy","label":{"zh":"回信请她多写些曹营的事。","en":"Write back asking her to tell you more about Cao's camp."},"out":[{"text":{"zh":"她又写来两封，第三封没有来。你把信里的消息交给了诸葛亮，他说很有用。","en":"She writes twice more; the third letter never comes. You pass what she wrote to Zhuge Liang, who says it's very useful."}}],"effects":[{"set":"flag.wenzhi_used","to":true},{"add":"rel.wenzhi.trust","by":-2},{"add":"rel.liubei.trust","by":1},{"add":"rel.zhuge.esteem","by":1},{"add":"renown.cunning","by":1}],"echo":["e_used"]},{"id":"care","type":"expression","label":{"zh":"只回一句：『你也是。』","en":"Write back just: 'You too.'"},"out":[{"text":{"zh":"信送出去了。你不知道她能不能收到。","en":"The letter goes out. You don't know if it will reach her."}}],"effects":[{"add":"rel.wenzhi.intimacy","by":1}]}],"salience":3,"order":2,"when":{"all":[{"v":"track","op":"==","val":"liu"},{"any":[{"v":"flag.promise_wenzhi","op":"==","val":true},{"v":"flag.pass_from_wenzhi","op":"==","val":true},{"v":"rel.wenzhi.intimacy","op":">=","val":2}]}]},"callbacks":[{"pays":"e_promise","text":{"zh":"你想起药圃里那包止血散，到现在还没用完。","en":"You think of the wound powder from the herb garden. You still haven't used it all."},"when":{"v":"flag.promise_wenzhi","op":"==","val":true}},{"pays":"e_wenzhi_spy","text":{"zh":"她说过只听不偷。这一封，她什么都没偷，只是在担心你。","en":"She said she'd listen, not steal. This letter steals nothing. She's just worried about you."},"when":{"v":"flag.asked_wenzhi","op":"==","val":true}}],"mood":"romance","art":{"scene":"letter","layers":[{"id":"window"}]},"place":"xiakou","cast":[{"id":"wenzhi"}]},"c7_phoenix":{"id":"c7_phoenix","chapter":"c7","kind":"side","title":{"zh":"凤雏的去向","en":"Where the Phoenix Goes"},"lock":"functional","canon":{"zh":"第47回","en":"Ch. 47"},"intro":[{"text":{"zh":"诸葛亮和周瑜都定了火攻。问题是：曹操的船分散着，一把火烧不了几条。得有人让曹操自己把船连起来。原本该做这件事的人，现在坐在你对面喝茶——庞统。","en":"Zhuge Liang and Zhou Yu have both settled on fire. The trouble is that Cao's ships are spread out; one fire won't catch many. Someone has to get Cao to chain them together himself. The man who should have done it is sitting across from you, drinking tea: Pang Tong."}}],"choices":[{"id":"send","type":"strategy","label":{"zh":"请庞统诈投曹营，献连环计。","en":"Ask Pang Tong to defect to Cao in pretense and offer the chain plan."},"out":[{"text":{"zh":"庞统笑道：『我本来就想去看看曹孟德。』几天后，曹营的大船三十一排、五十一排，用铁环连在了一起。","en":"Pang Tong laughs. 'I've been wanting a look at Cao Mengde anyway.' A few days later Cao's big ships are linked in rows of thirty and fifty with iron rings."}}],"effects":[{"add":"renown.cunning","by":1}],"resolve":[["d_lianhuan","transform"]]},{"id":"seasick","type":"dilemma","label":{"zh":"不必派人：北兵晕船，曹操自己会想到把船连起来。","en":"No need to send anyone: his northerners are seasick. Cao will think of chaining the ships himself."},"out":[{"text":{"zh":"诸葛亮看了你很久：『你怎么知道？』十天后探马来报：曹操听了蔡瑁的建议，用铁环把大船连在了一起。庞统留在了刘备身边。","en":"Zhuge Liang looks at you a long time. 'How would you know?' Ten days later scouts report that, on Cai Mao's advice, Cao has chained his big ships together. Pang Tong stays with Liu Bei."}}],"effects":[{"add":"uncanny","by":1},{"add":"rel.zhuge.trust","by":-1}],"foresight":true,"resolve":[["d_lianhuan","reroute"]]},{"id":"go_self","type":"dilemma","label":{"zh":"你自己过江，去曹营献这条计。","en":"Cross the river yourself and offer Cao the plan."},"out":[{"text":{"zh":"你在曹营待了五天，曹操听你讲连船之妙，抚掌大笑。离开那天，你在后营门口远远看见一个背药箱的身影。","en":"You spend five days in Cao's camp. Cao listens to you explain the virtues of chained ships and claps with delight. On the day you leave, you glimpse from the rear gate a distant figure carrying a medicine chest."}}],"effects":[{"add":"renown.cunning","by":2},{"add":"rel.caocao.esteem","by":1}],"req":{"v":"flag.wounded","op":"!=","val":true},"hint":{"zh":"需要伤已痊愈","en":"Needs your wound to have healed"},"resolve":[["d_lianhuan","transform"]]}],"salience":4,"order":3,"when":{"all":[{"v":"track","op":"==","val":"liu"},{"v":"flag.pangtong_joined","op":"==","val":true}]},"callbacks":[{"pays":"e_pangtong","text":{"zh":"庞统放下茶杯：『是你把我早拉进来的。这件事，你说怎么办？』","en":"Pang Tong sets down his cup. 'You brought me in early. So—what do we do about this?'"},"when":{"v":"flag.pangtong_joined","op":"==","val":true}}],"art":{"scene":"fog","layers":[]},"place":"xiakou","cast":[{"id":"zhuge"}]},"c7_fire":{"id":"c7_fire","chapter":"c7","kind":"main","title":{"zh":"火烧赤壁","en":"Fire at Red Cliffs"},"lock":"literal","canon":{"zh":"第49回","en":"Ch. 49"},"intro":[{"text":{"zh":"十一月二十日，东南风起。黄盖的二十条火船直冲曹营，连在一起的战船一条接一条烧起来。江面红了半边天。","en":"The twentieth day of the eleventh month: the southeast wind rises. Huang Gai's twenty fire ships ram straight into Cao's fleet, and the chained warships catch one after another. Half the sky over the river turns red."}}],"choices":[{"id":"row","type":"dilemma","label":{"zh":"趁乱驾一条小船，去乌林后营接温芷。","en":"Take a small boat in the chaos and go to the rear camp at Wulin for Wen Zhi."},"out":[{"text":{"zh":"乌林后营已经空了一半。你在江边找到她时，她正背着药箱等船。『我就知道你会来，』她说，『你信里那个字写得太急。』","en":"The rear camp at Wulin is half empty already. When you find her on the bank she's waiting for a boat with her medicine chest. 'I knew you'd come,' she says. 'Your handwriting in that letter was too rushed.'"},"when":{"v":"flag.wenzhi_warned","op":"==","val":true}},{"text":{"zh":"后营已经烧起来了。你在烟里喊她的名字，嗓子都喊哑了，最后在江边一条破船底下找到她。她的手烧伤了，还抱着药箱。","en":"The rear camp is already burning. You shout her name through the smoke until your voice gives out, and finally find her under a wrecked boat on the bank, her hands burned, still clutching her medicine chest."},"when":{"v":"flag.wenzhi_warned","op":"!=","val":true}},{"text":{"zh":"回到南岸时，仗已经打完了。刘备问你去了哪里，你没有回答。","en":"By the time you're back on the south bank, the battle is over. Liu Bei asks where you went. You don't answer."}}],"effects":[{"set":"flag.wenzhi_with_you","to":true},{"add":"rel.liubei.trust","by":-1},{"add":"rel.wenzhi.intimacy","by":2},{"add":"deviation","by":1}],"req":{"any":[{"v":"flag.wenzhi_warned","op":"==","val":true},{"v":"rel.wenzhi.intimacy","op":">=","val":3}]},"hint":{"zh":"需要与温芷足够亲近","en":"Needs to be close enough to Wen Zhi"},"echo":["e_row"],"values":["ren","yong"],"cg":"fireboat"},{"id":"ambush","type":"strategy","label":{"zh":"留在诸葛亮身边，帮他调度追击的伏兵。","en":"Stay with Zhuge Liang and help him deploy the ambushes."},"out":[{"text":{"zh":"诸葛亮一道一道发令：赵云去乌林，张飞去葫芦口……最后才看向关羽。","en":"Zhuge Liang gives his orders one by one: Zhao Yun to Wulin, Zhang Fei to Hulu Pass… and only at the end does he look at Guan Yu."}}],"effects":[{"add":"rel.zhuge.esteem","by":1}],"req":{"v":"rel.zhuge.esteem","op":">=","val":1},"hint":{"zh":"需要诸葛亮的敬重 ≥ 1","en":"Needs Zhuge Liang's respect ≥ 1"},"values":["zhi"]},{"id":"watch","type":"expression","label":{"zh":"站在南岸，看这一把火。","en":"Stand on the south bank and watch the fire."},"out":[{"text":{"zh":"火烧了一夜。你知道史书会怎么写这一夜，但亲眼看见，还是不一样。","en":"It burns all night. You know how the histories will tell it, but seeing it is different."}}],"effects":[]}],"salience":0,"order":10,"when":{"v":"track","op":"==","val":"liu"},"callbacks":[{"pays":"e_pangtong","text":{"zh":"庞统站在你旁边看着火光：『这把火，有我一分。』","en":"Pang Tong stands beside you watching the flames. 'Part of this fire is mine.'"},"when":{"all":[{"v":"flag.pangtong_joined","op":"==","val":true},{"v":"debt.d_lianhuan","op":"==","val":"transform"}]}},{"pays":"e_warned","text":{"zh":"你望着乌林的方向。她走了没有？","en":"You look toward Wulin. Did she get out?"},"when":{"v":"flag.wenzhi_warned","op":"==","val":true}},{"pays":"e_mi","text":{"zh":"糜夫人派人送来一件夹袄，说是给子衡挡江风。","en":"Lady Mi sends over a padded jacket—'to keep the river wind off Ziheng.'"},"when":{"v":"flag.mi_saved","op":"==","val":true}},{"pays":"e_xushu","text":{"zh":"徐庶站在船头，脸被火光照得通红：『我娘还在北边。』","en":"Xu Shu stands at the bow, his face red in the firelight. 'My mother is still in the north.'"},"when":{"v":"flag.xushu_stayed","op":"==","val":true}},{"pays":"e_pangtong","text":{"zh":"庞统看着火光：『这把火没用上我。也好。』","en":"Pang Tong watches the flames. 'This fire didn't need me. Just as well.'"},"when":{"all":[{"v":"flag.pangtong_joined","op":"==","val":true},{"v":"debt.d_lianhuan","op":"==","val":"reroute"}]}},{"pays":"e_promise","text":{"zh":"你摸了摸袖子里那包止血散。乌林就在火的那一边。","en":"You feel the packet of wound powder in your sleeve. Wulin is on the other side of the fire."},"when":{"v":"flag.promise_wenzhi","op":"==","val":true}},{"pays":"e_used","text":{"zh":"你想起那封没有来的第三封信。","en":"You think of the third letter that never came."},"when":{"v":"flag.wenzhi_used","op":"==","val":true}}],"on_enter":[{"when":{"all":[{"v":"flag.pangtong_joined","op":"==","val":true},{"v":"debt.d_lianhuan","op":"==","val":"open"}]},"text":{"zh":"你没顾上庞统的事。好在北兵晕船，蔡瑁出了主意，曹操自己用铁环把船连了起来。","en":"You never dealt with the Pang Tong question. As luck would have it, the northerners were seasick, Cai Mao made a suggestion, and Cao chained his ships together himself."},"resolve":[["d_lianhuan","reroute"]]}],"art":{"scene":"fire","layers":[{"id":"burning"},{"id":"fireships"},{"id":"camp_empty","when":{"v":"flag.wenzhi_warned","op":"==","val":true}},{"id":"camp_burning","when":{"v":"flag.wenzhi_warned","op":"!=","val":true}},{"id":"boat","choice":"row"}]},"place":"chibi","cast":[{"id":"zhuge"},{"id":"wenzhi","when":{"v":"flag.wenzhi_with_you","op":"==","val":true}}]},"c7_chain":{"id":"c7_chain","chapter":"c7","kind":"main","title":{"zh":"连环","en":"The Chain"},"lock":"literal","canon":{"zh":"第47–48回","en":"Ch. 47–48"},"intro":[{"text":{"zh":"庞统来献连环计：用铁环把大船连起来，北兵就不晕了。曹操大喜，众谋士都说好，只有程昱开口。","en":"Pang Tong offers his chain plan: link the big ships with iron rings and the northern soldiers will stop being sick. Cao Cao is delighted and his advisers all agree. Only Cheng Yu speaks up."}},{"text":{"zh":"曹操摆摆手：『你的好话我听腻了，今天说点有用的。』","en":"Cao waves a hand. 'I'm tired of your compliments. Say something useful today.'"},"when":{"v":"imp.caocao.flattery","op":">=","val":1}},{"text":{"zh":"曹操扫了你一眼：『今天倒是安静。』","en":"Cao glances at you. 'Quiet today, aren't we.'"},"when":{"v":"imp.caocao.offended","op":">=","val":1}}],"choices":[{"id":"second","type":"dilemma","label":{"zh":"附和程昱：『冬至前后，常有东南风。』","en":"Back Cheng Yu: 'Around the solstice there's often a southeast wind.'"},"out":[{"text":{"zh":"曹操笑了：『你也学程仲德？』但他还是准你留下二十条船不连锁，泊在下游。","en":"Cao laughs. 'Now you're imitating Cheng Zhongde?' But he lets you keep twenty ships unchained, moored downstream."}}],"effects":[{"add":"uncanny","by":1},{"set":"flag.cao_reserve","to":true},{"add":"deviation","by":1}],"foresight":true,"echo":["e_reserve"],"values":["zhi","cheng"]},{"id":"agree","type":"strategy","label":{"zh":"附和丞相：北兵能站稳，比什么都要紧。","en":"Back the Chancellor: getting the northerners on their feet matters more than anything."},"out":[{"text":{"zh":"曹操很高兴，赏了你一匹马。","en":"Cao is pleased and gives you a horse."}}],"effects":[{"add":"rel.caocao.esteem","by":1}],"values":["li"]},{"id":"wenzhi","type":"dilemma","label":{"zh":"什么也不说，回营让温芷把病兵和药都搬到岸上。","en":"Say nothing. Go back and tell Wen Zhi to move the sick and the medicine ashore."},"out":[{"text":{"zh":"温芷看着你：『你知道什么？』你说：『什么都不知道。搬吧。』","en":"Wen Zhi looks at you. 'What do you know?' 'Nothing,' you say. 'Just move them.'"}}],"effects":[{"set":"flag.wenzhi_warned","to":true},{"add":"uncanny","by":1},{"add":"rel.wenzhi.intimacy","by":1}],"req":{"v":"rel.wenzhi.intimacy","op":">=","val":2},"hint":{"zh":"需要与温芷足够亲近","en":"Needs to be close enough to Wen Zhi"},"foresight":true,"echo":["e_warned"],"values":["ren"]}],"salience":0,"order":10,"when":{"v":"track","op":"==","val":"cao"},"quote":{"zh":"程昱曰：「船皆连锁，固是平稳；但彼若用火攻，难以回避。不可不防。」……操曰：「凡用火攻，必藉风力。方今隆冬之际，但有西风北风，安有东风南风耶？」","en":"Cheng Yu said: \"Chained ships are steady, yes—but if they use fire we'll have no escape. We must guard against it.\" … Cao replied: \"Fire depends on the wind. In the depth of winter there is only west wind and north wind. Where would an east or south wind come from?\""},"callbacks":[{"pays":"e_forged","text":{"zh":"庞统经过你身边，低声说：『徐元直托我问候你。』你的手抖了一下。","en":"Passing you, Pang Tong murmurs, 'Xu Yuanzhi sends his regards.' Your hand trembles."},"when":{"v":"flag.forged_letter","op":"==","val":true}},{"pays":"e_angelica","text":{"zh":"温芷把一片当归塞进你衣襟：『记得回家。』","en":"Wen Zhi tucks a slice of angelica into your collar. 'Remember to come home.'"},"when":{"v":"flag.wenzhi_together","op":"==","val":true}},{"pays":"e_wind","text":{"zh":"曹操瞥了你一眼：『东南风？』他笑了，没有再说。","en":"Cao glances at you. 'A southeast wind?' He laughs and says no more."},"when":{"v":"flag.warned_wind","op":"==","val":true}}],"art":{"scene":"fire","layers":[{"id":"reserve","choice":"second"},{"id":"camp_empty","choice":"wenzhi"}]},"place":"chibi","cast":[{"id":"caocao"},{"id":"wenzhi","when":{"v":"rel.wenzhi.intimacy","op":">=","val":2}}]},"c8_huarong":{"id":"c8_huarong","chapter":"c8","kind":"main","title":{"zh":"华容道","en":"The Huarong Road"},"lock":"literal","canon":{"zh":"第49–50回","en":"Ch. 49–50"},"intro":[{"text":{"zh":"诸葛亮派关羽去守华容道。关羽当众立下军令状：若放走曹操，愿依军法。散帐后，刘备低声说：『吾弟义气深重，若曹操果然投华容道去时，只恐端的放了。』","en":"Zhuge Liang sends Guan Yu to hold the Huarong road, and Guan Yu swears before everyone to forfeit his life if Cao escapes. Afterwards Liu Bei says quietly, 'My brother has a deep sense of honor. If Cao really comes by Huarong, I fear he'll let him go.'"}},{"text":{"zh":"诸葛亮摇着扇子：『子衡兄的好话，亮已经攒了一箩筐。今天，说句实话吧。』","en":"Zhuge Liang waves his fan. 'I've a basketful of your compliments already, Ziheng. Today, tell me something true.'"},"when":{"v":"imp.zhuge.flattery","op":">=","val":1}},{"text":{"zh":"诸葛亮咳了一声，故意不看你。那晚灯下的话，他显然还记得。","en":"Zhuge Liang clears his throat and pointedly doesn't look at you. He clearly remembers what you said that night by the lamp."},"when":{"v":"imp.zhuge.frivolous","op":">=","val":1}},{"text":{"zh":"诸葛亮对你客气得过了头。灯下那句冲撞，他没有提，也没有忘。","en":"Zhuge Liang is excessively polite to you. He hasn't mentioned what you threw at him by the lamp—nor forgotten it."},"when":{"v":"imp.zhuge.offended","op":">=","val":1}}],"choices":[{"id":"vouch","type":"dilemma","label":{"zh":"替关羽作保：若他放了曹操，你与他同罪。","en":"Vouch for Guan Yu: if he lets Cao go, you share his punishment."},"out":[{"text":{"zh":"关羽在华容道等到了曹操。曹操只剩三百多骑，人人带伤。他提起当年的恩情，关羽长叹一声，把马头拨开了。","en":"Guan Yu waits on the Huarong road, and Cao comes—three hundred riders left, every one of them wounded. Cao speaks of old kindnesses. Guan Yu sighs and turns his horse aside."}},{"text":{"zh":"回营后诸葛亮要斩关羽，你跪在关羽身边。刘备求情，诸葛亮便收了令。关羽扶你起来的时候，手很重。","en":"Back in camp Zhuge Liang orders Guan Yu executed, and you kneel beside him. Liu Bei pleads, and Zhuge Liang withdraws the order. When Guan Yu helps you up, his grip is heavy."}}],"effects":[{"set":"flag.vouched_guan","to":true},{"add":"rel.guanyu.esteem","by":1},{"add":"rel.guanyu.warmth","by":2},{"add":"renown.loyal","by":1}],"req":{"all":[{"any":[{"v":"rel.guanyu.esteem","op":">=","val":3},{"v":"rel.liubei.trust","op":">=","val":6}]},{"v":"imp.guanyu.offended","op":"<","val":2}]},"hint":{"zh":"需要关羽的敬重 ≥ 3 或刘备的信任 ≥ 6，且关羽没有被你冒犯过两次以上","en":"Needs Guan Yu's respect ≥ 3 or Liu Bei's trust ≥ 6, and not to have offended Guan Yu twice"},"values":["yi","yong"],"cg":"turn"},{"id":"go_with","type":"strategy","label":{"zh":"请求随关羽同去华容道监军。","en":"Ask to go to Huarong with Guan Yu as overseer."},"out":[{"text":{"zh":"华容道上，曹操认出了你。","en":"On the Huarong road, Cao Cao recognizes you."}},{"text":{"zh":"『土山三约的执笔人也在。云长，我守了约。』","en":"'The man who wrote the three terms is here too. Yunchang, I kept my word.'"},"when":{"v":"flag.drafted_terms","op":"==","val":true}},{"text":{"zh":"『青梅亭上的书生，你如今替谁说话？』","en":"'The scholar from the plum pavilion. Whose side are you speaking for now?'"},"when":{"v":"flag.spoke_at_plum","op":"==","val":true}},{"text":{"zh":"关羽看了你一眼。你点了点头——或者你只是没有摇头。关羽拨开了马头。","en":"Guan Yu looks at you. You nod—or perhaps you only fail to shake your head. Guan Yu turns his horse aside."}},{"text":{"zh":"回营复命时，诸葛亮只问了一句：『你点头了？』你没有回答。他也没再问。","en":"When you report back, Zhuge Liang asks only, 'Did you nod?' You don't answer. He doesn't ask again."}}],"effects":[{"set":"flag.at_huarong","to":true},{"add":"rel.guanyu.warmth","by":1},{"add":"rel.zhuge.trust","by":-1}],"req":{"v":"rel.zhuge.esteem","op":">=","val":3},"hint":{"zh":"需要诸葛亮的敬重 ≥ 3","en":"Needs Zhuge Liang's respect ≥ 3"},"values":["yi"],"cg":"turn"},{"id":"warn_wenzhi","type":"dilemma","label":{"zh":"托一个渔夫给曹营的温芷送一句话：走华容道，别走大路。","en":"Pay a fisherman to take Wen Zhi a message in Cao's camp: take the Huarong road, not the main road."},"out":[{"text":{"zh":"你不知道话有没有送到。很久以后你才听说：曹军残部走华容道时，后队有个背药箱的女子，一路给伤兵包扎。","en":"You never learn whether the message arrived. Much later you hear that when Cao's remnants came through Huarong, a woman with a medicine chest at the rear of the column bandaged the wounded all the way."}}],"effects":[{"set":"flag.wenzhi_safe","to":true},{"add":"rel.wenzhi.intimacy","by":1}],"req":{"all":[{"v":"flag.wenzhi_with_you","op":"!=","val":true},{"v":"rel.wenzhi.intimacy","op":">=","val":2}]},"hint":{"zh":"需要与温芷足够亲近，且她仍在曹营","en":"Needs closeness with Wen Zhi, and for her to still be in Cao's camp"},"values":["ren"]},{"id":"silent","type":"expression","label":{"zh":"什么也不说。","en":"Say nothing."},"out":[{"text":{"zh":"关羽在华容道放走了曹操。回营后诸葛亮要斩他，刘备求情才免了。一切都和后来说书人讲的一样。","en":"Guan Yu lets Cao go on the Huarong road. Back in camp Zhuge Liang orders his execution, and only Liu Bei's pleading spares him. Everything happens just as the storytellers will tell it."}}],"effects":[],"cg":"turn"}],"salience":0,"order":10,"when":{"v":"track","op":"==","val":"liu"},"quote":{"zh":"孔明曰：「亮夜观乾象，操贼未合身亡。留这人情，教云长做了，亦是美事。」","en":"Zhuge Liang said: \"I have watched the heavens at night. Cao is not fated to die yet. Let Guan Yu repay his debt—that too is a fine thing.\""},"callbacks":[{"pays":"e_terms","text":{"zh":"关羽出帐前对你说：『土山那三条是你写的。曹公守了约。』他没有说下去。","en":"On his way out, Guan Yu says to you, 'You wrote those three terms on the hill. Lord Cao kept them.' He leaves it there."},"when":{"v":"flag.drafted_terms","op":"==","val":true}},{"pays":"e_yi","text":{"zh":"关羽说：『你问过我什么是义。这一回，我也不知道答案。』","en":"Guan Yu says, 'You once asked me what righteousness is. This time I don't know the answer either.'"},"when":{"v":"flag.asked_yi","op":"==","val":true}},{"pays":"e_aside","text":{"zh":"诸葛亮布置完，特意看了你一眼，像是在等你开口，又像是在防你开口。","en":"When his orders are done, Zhuge Liang gives you a deliberate look—as if waiting for you to speak, or guarding against it."},"when":{"v":"flag.aside_zhuge","op":"==","val":true}},{"pays":"e_abandon","text":{"zh":"刘备看着你：『长坂上你劝我弃民。今天你又要劝我什么？』","en":"Liu Bei looks at you. 'At Changban you told me to abandon the people. What will you tell me today?'"},"when":{"v":"flag.abandon_advice","op":"==","val":true}},{"pays":"e_row","text":{"zh":"温芷在帐后给伤兵换药，抬头看了你一眼。","en":"Behind the tent, Wen Zhi is changing a wounded man's dressing. She looks up at you."},"when":{"v":"flag.wenzhi_with_you","op":"==","val":true}},{"pays":"e_promise","text":{"zh":"你摸了摸袖子里那包止血散。","en":"You touch the packet of wound powder in your sleeve."},"when":{"all":[{"v":"flag.promise_wenzhi","op":"==","val":true},{"v":"flag.wenzhi_with_you","op":"!=","val":true}]}},{"pays":"e_zhuge_test","text":{"zh":"诸葛亮看了你一眼。自从那晚你说出三分天下，他一直是这样看你的。","en":"Zhuge Liang glances at you. He has looked at you this way ever since the night you spoke of the three-way division."},"when":{"v":"flag.zhuge_tested","op":"==","val":true}}],"art":{"scene":"huarong","layers":[{"id":"blocker"},{"id":"medic","when":{"v":"flag.wenzhi_safe","op":"==","val":true}},{"id":"medic","choice":"warn_wenzhi"}]},"place":"huarong","cast":[{"id":"guanyu"},{"id":"zhuge"}]},"c8_cao":{"id":"c8_cao","chapter":"c8","kind":"main","title":{"zh":"华容道·曹营","en":"Huarong, from Cao's Side"},"lock":"literal","canon":{"zh":"第50回","en":"Ch. 50"},"intro":[{"text":{"zh":"曹操带着残兵往华容道逃，人马都饿得站不住。转过山口，一彪人马拦住去路，为首的是关羽。","en":"Cao Cao flees by the Huarong road with what's left of his army, men and horses half-starved. Around a bend a troop blocks the way, and at its head is Guan Yu."}}],"choices":[{"id":"plead","type":"dilemma","label":{"zh":"你上前，求关羽念旧日情分。","en":"Step forward and ask Guan Yu to remember old friendships."},"out":[{"text":{"zh":"『土山三约，是我写，丞相守。』你说，『将军也守一个吧。』","en":"'I wrote the three terms on that hill, and the Chancellor kept them,' you say. 'Keep one for us, General.'"},"when":{"v":"flag.drafted_terms","op":"==","val":true}},{"text":{"zh":"关羽沉默良久，拨开马头，挥手让部下散开。曹操走过去的时候，关羽没有看他，看的是你。","en":"Guan Yu is silent a long time, then turns his horse aside and waves his men apart. As Cao passes, Guan Yu doesn't look at him. He looks at you."}}],"effects":[{"set":"flag.pleaded_guan","to":true},{"add":"rel.caocao.esteem","by":2}],"req":{"v":"rel.guanyu.esteem","op":">=","val":3},"hint":{"zh":"需要关羽的敬重 ≥ 3","en":"Needs Guan Yu's respect ≥ 3"},"values":["ren","yi"],"cg":"turn"},{"id":"cao_pleads","type":"strategy","label":{"zh":"劝曹操亲自去说，提起当年的恩情。","en":"Urge Cao to speak to him himself and recall old kindnesses."},"out":[{"text":{"zh":"曹操上前，说起当年五关斩将、他没有追究的事。关羽长叹一声，放他们过去了。","en":"Cao rides forward and reminds Guan Yu how he never punished him for the generals killed at the five passes. Guan Yu sighs heavily and lets them through."}}],"effects":[{"add":"rel.caocao.esteem","by":1}],"values":["zhi"],"cg":"turn"},{"id":"draw","type":"expression","label":{"zh":"拔剑，站到曹操前面。","en":"Draw your sword and stand in front of Cao."},"out":[{"text":{"zh":"你的剑在发抖。关羽看着你，像看一个孩子：『收起来吧。』他还是放了你们。","en":"Your sword is shaking. Guan Yu looks at you as if at a child. 'Put it away.' He lets you all through anyway."}}],"effects":[{"add":"rel.caocao.esteem","by":1},{"add":"renown.loyal","by":1}],"values":["yong","yi"],"cg":"turn"}],"salience":0,"order":10,"when":{"v":"track","op":"==","val":"cao"},"quote":{"zh":"操……欠身谓云长曰：「将军别来无恙？」云长亦欠身答曰：「关某奉军师将令，等候丞相多时。」","en":"Cao bowed slightly to Guan Yu: \"General, have you been well since we parted?\" Guan Yu bowed in return. \"By the strategist's orders, I have been waiting for you a long time, Chancellor.\""},"callbacks":[{"pays":"e_reserve","text":{"zh":"下游那二十条船救出了三千多人。曹操回头看了你一眼：『子衡那天说的，是真的。』","en":"The twenty ships downstream saved over three thousand men. Cao glances back at you. 'What you said that day was true.'"},"when":{"v":"flag.cao_reserve","op":"==","val":true}},{"pays":"e_warned","text":{"zh":"温芷就在后队，药箱一件没丢。","en":"Wen Zhi is at the rear of the column, not a single medicine chest lost."},"when":{"v":"flag.wenzhi_warned","op":"==","val":true}},{"pays":"e_mercy","text":{"zh":"关羽看见你，眼神动了一下：『长坂上那个缺口，是你开的？』","en":"Guan Yu sees you and something moves in his face. 'That gap at Changban—was that you?'"},"when":{"v":"flag.secret_mercy","op":"==","val":true}},{"pays":"e_terms","text":{"zh":"关羽看见你：『你也在。』","en":"Guan Yu sees you. 'You're here too.'"},"when":{"v":"flag.drafted_terms","op":"==","val":true}},{"pays":"e_stay","text":{"zh":"关羽看着你，说的还是那四个字：『人各有志。』","en":"Guan Yu looks at you and says the same words as before: 'Every man chooses his own road.'"},"when":{"v":"track","op":"==","val":"cao"}},{"pays":"e_angelica","text":{"zh":"你回头看了一眼后队。温芷还在。","en":"You glance back at the rear of the column. Wen Zhi is still there."},"when":{"v":"flag.wenzhi_together","op":"==","val":true}},{"pays":"e_cao_guan","text":{"zh":"曹操低声说：『我留不住的人，又来了。』","en":"Cao murmurs, 'The one I couldn't keep—here he is again.'"},"when":{"v":"flag.cao_on_guan","op":"==","val":true}}],"art":{"scene":"huarong","layers":[{"id":"blocker"},{"id":"medic","when":{"any":[{"v":"flag.wenzhi_warned","op":"==","val":true},{"v":"flag.wenzhi_together","op":"==","val":true}]}}]},"place":"huarong","cast":[{"id":"guanyu"},{"id":"caocao"}]},"c2_campfire":{"id":"c2_campfire","chapter":"c2","kind":"main","title":{"zh":"篝火·关羽","en":"By the Fire: Guan Yu"},"lock":"free","canon":{"zh":"夜谈","en":"night talk"},"intro":[{"text":{"zh":"关羽看见你手腕上的勒痕，没问是怎么来的，只往火边让了让。","en":"Guan Yu sees the rope marks on your wrists. He doesn't ask; he just makes room for you by the fire."},"when":{"v":"flag.left_behind","op":"==","val":true}},{"text":{"zh":"出许都的第一夜，大军扎营。关羽一个人坐在火边擦刀，见你过来，往旁边让了让。","en":"The first night out of Xuchang, the army makes camp. Guan Yu sits alone by a fire, cleaning his blade. When he sees you he moves over to make room."}}],"choices":[{"id":"leave","type":"expression","label":{"zh":"起身告辞。","en":"Say goodnight and go."},"out":[{"text":{"zh":"关羽冲你点了点头。火还旺着。","en":"Guan Yu nods to you. The fire is still burning high."}}],"effects":[]}],"salience":0,"order":20,"when":{"v":"track","op":"==","val":"liu"},"talk":{"char":"guanyu","turns":2,"topics":[{"id":"peach","label":{"zh":"问他桃园结义的事。","en":"Ask him about the oath in the peach garden."},"reply":[{"text":{"zh":"『那年春天，三个人，一头黑牛，一匹白马。』他难得笑了，『大哥说，不求同年同月同日生。』","en":"'One spring. Three men, a black ox, a white horse.' He almost smiles. 'My brother said: we don't ask to be born on the same day.'"}}],"effects":[{"add":"rel.guanyu.esteem","by":1}],"mood":"warm"},{"id":"self","label":{"zh":"说说你自己：颍川、读书，为什么投刘备。","en":"Tell him about yourself: Yingchuan, your studies, why you joined Liu Bei."},"reply":[{"text":{"zh":"他听完，点点头：『为一个“仁”字投大哥的，你不是第一个。能留下来的，不多。』","en":"He listens, then nods. 'You're not the first to follow my brother for his kindness. Not many stay.'"}}],"effects":[{"add":"rel.guanyu.esteem","by":1}]},{"id":"fear","label":{"zh":"问他：将军也有怕的事吗？","en":"Ask him: is there anything you're afraid of?"},"reply":[{"text":{  to do.'"}}],"effects":[{"add":"rel.liubei.trust","by":1}],"mood":"sad"},{"id":"people","label":{"zh":"问他：为什么百姓都愿意跟着你走？","en":"Ask him: why are the common people so willing to follow you?"},"reply":[{"text":{"zh":"『我也不知道。』他想了想，『大概是我从没扔下过他们。』","en":"'I don't know.' He thinks. 'Perhaps because I've never left them behind.'"}}],"effects":[{"add":"rel.liubei.trust","by":1},{"set":"flag.heard_people","to":true}],"echo":["e_people"]},{"id":"south","label":{"zh":"告诉他：往南走，荆州有人在等你。","en":"Tell him: go south. Someone in Jingzhou is waiting for you."},"reply":[{"text":{"zh":"刘备回过头：『谁？』你说不出名字。他拍拍你的肩：『那就等他来找我。』","en":"Liu Bei turns. 'Who?' You can't give a name. He pats your shoulder. 'Then let him come and find me.'"}}],"effects":[{"add":"uncanny","by":1},{"add":"rel.liubei.trust","by":1}],"foresight":true,"mood":"surprised"}]},"art":{"scene":"campfire","layers":[{"id":"wall"}]},"place":"gucheng","cast":[{"id":"liubei"}]},"c5_lamp":{"id":"c5_lamp","chapter":"c5","kind":"main","title":{"zh":"灯下·诸葛亮","en":"By Lamplight: Zhuge Liang"},"lock":"free","canon":{"zh":"夜谈","en":"night talk"},"intro":[{"text":{"zh":"诸葛亮出山后的第一个晚上，他提着一盏灯来敲你的门：『听说主公身边，子衡兄跟得最久。』","en":"On his first night in Liu Bei's service, Zhuge Liang knocks on your door with a lamp. 'I hear you've been with our lord longest, Ziheng.'"}}],"choices":[{"id":"leave","type":"expression","label":{"zh":"起身告辞。","en":"Say goodnight and go."},"out":[{"text":{"zh":"灯芯爆了一下。诸葛亮起身告辞。","en":"The lamp wick sputters. Zhuge Liang rises to take his leave."}}],"effects":[]}],"salience":0,"order":20,"when":{"v":"track","op":"==","val":"liu"},"talk":{"char":"zhuge","turns":2,"topics":[{"id":"why","label":{"zh":"问他：为何肯出山？","en":"Ask him: why did you agree to come?"},"reply":[{"text":{"zh":"『三顾，不是三请。』他笑，『一个人肯在雪里站三回，值得赌一赌。』","en":"'Three visits, not three invitations.' He smiles. 'A man who will stand in the snow three times is worth a wager.'"}}],"effects":[{"add":"rel.zhuge.esteem","by":1}]},{"id":"test","label":{"zh":"试探他：天下将三分，荆、益可图，对吗？","en":"Test him: the realm will split in three, and Jing and Yi provinces are there for the taking—right?"},"reply":[{"text":{"zh":"诸葛亮手里的扇子停了。『这话，我只在草庐里说过。』他看了你很久，『子衡兄，你从哪里听来的？』","en":"The fan in Zhuge Liang's hand stops. 'I've said that only in my cottage.' He studies you a long time. 'Where did you hear it, Ziheng?'"}}],"effects":[{"add":"uncanny","by":1},{"add":"rel.zhuge.trust","by":-2},{"add":"rel.zhuge.esteem","by":1},{"set":"flag.zhuge_tested","to":true}],"echo":["e_zhuge_test"],"foresight":true,"mood":"surprised"},{"id":"share","label":{"zh":"把你看到的主公说给他听：仁厚，信人，唯独对自己太苛。","en":"Tell him the lord you know: kind, trusting of others, too hard on himself."},"reply":[{"text":{"zh":"他认真记下：『多谢。往后，我们是同僚了。』","en":"He takes it to heart. 'Thank you. From now on, we are colleagues.'"}}],"effects":[{"add":"rel.zhuge.esteem","by":1},{"add":"rel.zhuge.trust","by":1}],"req":{"v":"rel.zhuge.esteem","op":">=","val":2},"hint":{"zh":"需要诸葛亮的敬重 ≥ 2","en":"Needs Zhuge Liang's respect ≥ 2"}},{"id":"rival","label":{"zh":"直说：你来之前，我是他最信的人。","en":"Say it plainly: before you came, I was the one he trusted most."},"reply":[{"text":{"zh":"『现在也是。』诸葛亮把灯留给了你，『我只是来帮他打仗的。』","en":"'You still are.' Zhuge Liang leaves the lamp with you. 'I'm only here to help him fight.'"}}],"effects":[{"add":"rel.zhuge.trust","by":1}],"when":{"v":"flag.aside_zhuge","op":"==","val":true},"mood":"warm"}]},"art":{"scene":"lamp","layers":[]},"place":"xinye","cast":[{"id":"zhuge"}]},"c5_feast":{"id":"c5_feast","chapter":"c5","kind":"main","title":{"zh":"宴后·曹操","en":"After the Feast: Cao Cao"},"lock":"free","canon":{"zh":"夜谈","en":"night talk"},"intro":[{"text":{"zh":"宴罢，曹操留你在廊下说话。他喝了酒，话比平时多。","en":"After the feast, Cao Cao keeps you on the veranda to talk. He has been drinking and says more than usual."}}],"choices":[{"id":"leave","type":"expression","label":{"zh":"起身告辞。","en":"Say goodnight and go."},"out":[{"text":{"zh":"曹操挥挥手，让你回去歇着。","en":"Cao waves you off to rest."}}],"effects":[]}],"salience":0,"order":20,"when":{"v":"track","op":"==","val":"cao"},"talk":{"char":"caocao","turns":2,"topics":[{"id":"why","label":{"zh":"问他：丞相当年为何留我？","en":"Ask him: why did you keep me, back then?"},"reply":[{"text":{"zh":"『因为你走得了，却没走。』曹操笑，『这样的人，用起来放心，也不放心。』","en":"'Because you could have left, and didn't.' Cao laughs. 'A man like that is easy to trust—and hard to.'"}}],"effects":[{"add":"rel.caocao.esteem","by":1}]},{"id":"guan","label":{"zh":"问他：还在想关云长吗？","en":"Ask him: do you still think about Guan Yunchang?"},"reply":[{"text":{"zh":"『想。』他倒了一杯酒，『我留不住的人，记得最清楚。』","en":"'I do.' He pours a cup. 'The ones I couldn't keep are the ones I remember best.'"}}],"effects":[{"add":"rel.caocao.esteem","by":1},{"set":"flag.cao_on_guan","to":true}],"echo":["e_cao_guan"],"mood":"sad"},{"id":"poem","label":{"zh":"请他念一首新作的诗。","en":"Ask him to recite a new poem."},"reply":[{"text":{"zh":"他低声吟了两句：『对酒当歌，人生几何。』又摆摆手，『还没写完。』","en":"He murmurs two lines: 'Facing wine, I sing: how long is a life?' Then waves it off. 'It isn't finished.'"}}],"effects":[{"add":"rel.caocao.esteem","by":1}]},{"id":"wind","label":{"zh":"劝他：将来南征，切莫轻视东南风。","en":"Warn him: when you march south, don't dismiss a southeast wind."},"reply":[{"text":{"zh":"曹操眯起眼睛：『你也学那些术士？』他不再说话。","en":"Cao narrows his eyes. 'Now you're imitating the soothsayers?' He says no more."}}],"effects":[{"add":"uncanny","by":1},{"add":"rel.caocao.esteem","by":-1},{"set":"flag.warned_wind","to":true}],"echo":["e_wind"],"foresight":true,"mood":"cold"}]},"art":{"scene":"hall","layers":[]},"place":"xuchang","cast":[{"id":"caocao"}]},"c8_river":{"id":"c8_river","chapter":"c8","kind":"main","title":{"zh":"江边·温芷","en":"By the River: Wen Zhi"},"lock":"free","canon":{"zh":"夜谈","en":"night talk"},"intro":[{"text":{"zh":"仗打完了。夜里，温芷在江边洗药杵。你走过去，她没有回头：『我就知道是你，脚步声都一样。』","en":"The fighting is over. At night Wen Zhi is washing a pestle at the river's edge. You walk over; she doesn't turn around. 'I knew it was you. Your footsteps haven't changed.'"}},{"text":{"zh":"『你今天嘴怎么这么甜？』她头也不回地说，『有事求我？』","en":"'Why so sweet today?' she says without turning around. 'Want something from me?'"},"when":{"v":"imp.wenzhi.flattery","op":">=","val":1}}],"choices":[{"id":"leave","type":"expression","label":{"zh":"起身告辞。","en":"Say goodnight and go."},"out":[{"text":{"zh":"她把药杵擦干，收进药箱。『回去吧，江边冷。』","en":"She dries the pestle and puts it away. 'Go back. It's cold by the river.'"}}],"effects":[]}],"salience":0,"order":20,"when":{"any":[{"v":"flag.wenzhi_with_you","op":"==","val":true},{"all":[{"v":"track","op":"==","val":"cao"},{"any":[{"v":"flag.wenzhi_warned","op":"==","val":true},{"v":"flag.wenzhi_together","op":"==","val":true}]}]}]},"talk":{"char":"wenzhi","turns":3,"topics":[{"id":"hands","label":{"zh":"看看她手上的伤。","en":"Look at the burns on her hands."},"reply":[{"text":{"zh":"她把手缩回袖子里：『医者的手，烧一回才知道疼。』过了一会儿，又伸出来给你看。","en":"She pulls her hands into her sleeves. 'A physician should get burned once, to learn what it feels like.' After a while she holds them out for you to see."}}],"effects":[{"add":"rel.wenzhi.intimacy","by":1}],"when":{"v":"flag.wenzhi_with_you","op":"==","val":true},"mood":"sad"},{"id":"home","label":{"zh":"说起颍川：等打完仗，回去看那棵槐树。","en":"Talk about home: when the war's over, go back and see the old locust tree."},"reply":[{"text":{"zh":"『许都没有槐树，南边也没有。』她笑了，『那就种一棵。』","en":"'There are no locust trees in Xuchang, or in the south.' She smiles. 'Then we'll plant one.'"}}],"effects":[{"add":"rel.wenzhi.intimacy","by":1}],"mood":"warm"},{"id":"future","label":{"zh":"问她：以后想做什么？","en":"Ask her: what do you want to do, afterwards?"},"reply":[{"text":{"zh":"『开一间药铺。不问来的人是哪一边的。』","en":"'Open an apothecary. And never ask which side the patients are on.'"}}],"effects":[{"add":"rel.wenzhi.trust","by":1}]},{"id":"confess","label":{"zh":"把一直没说出口的话说出来。","en":"Say what you've never said."},"reply":[{"text":{"zh":"她终于回过头。江上还漂着烧黑的木头。『说了，就收不回去了。』『不收。』","en":"She finally turns. Charred timbers still drift on the river. 'Once you say it, you can't take it back.' 'I won't.'"}}],"effects":  of Favor"},"lock":"free","canon":{"zh":"原创危机","en":"original crisis"},"intro":[{"text":{"zh":"你发现，议事的时候已经没有人等你开口了。刘备待你仍旧客气，只是不再问你。","en":"You notice that at council no one waits for you to speak any more. Liu Bei is as courteous as ever. He just doesn't ask you anything."}}],"choices":[{"id":"resign","type":"dilemma","label":{"zh":"请辞。","en":"Resign."},"out":[{"text":{"zh":"刘备没有挽留，送了你一匹马和一包盘缠：『子衡保重。』","en":"Liu Bei doesn't try to stop you. He gives you a horse and travel money. 'Take care, Ziheng.'"}}],"effects":[{"set":"flag.exiled","to":true}],"ends":true},{"id":"clerk","type":"expression","label":{"zh":"留下来，做个抄写文书的小吏。","en":"Stay on as a copying clerk."},"out":[{"text":{"zh":"你的案头堆满了别人的文书。日子还长。","en":"Your desk fills with other men's paperwork. There's a long road ahead."}}],"effects":[{"set":"flag.sidelined","to":true},{"add":"rel.liubei.trust","by":1}]},{"id":"prove","type":"dilemma","label":{"zh":"请命去做一件没人愿意做的事。","en":"Volunteer for the job nobody wants."},"out":[{"text":{"zh":"你在泥地里走了三个月，替刘备把各郡的粮册重新理了一遍。回来那天，他亲自出城接你。","en":"You spend three months tramping through mud, putting the grain registers of every district in order. The day you return, Liu Bei rides out of the city to meet you himself."}}],"effects":[{"add":"rel.liubei.trust","by":3},{"add":"renown.loyal","by":1}],"req":{"v":"renown.loyal","op":">=","val":1},"hint":{"zh":"需要一点忠义之名，主公才肯给你机会","en":"Needs some name for loyalty before he'll give you the chance"}}],"salience":0,"order":2,"when":{"all":[{"v":"track","op":"==","val":"liu"},{"v":"rel.liubei.trust","op":"<=","val":1}]},"art":{"scene":"hall","layers":[]},"place":null,"cast":[{"id":"liubei"}]},"x_cold_cao":{"id":"x_cold_cao","chapter":"*","kind":"interrupt","title":{"zh":"闲职","en":"A Quiet Post"},"lock":"free","canon":{"zh":"原创危机","en":"original crisis"},"intro":[{"text":{"zh":"丞相府的人都知道：子衡失宠了。你的文书被退回来三次，每次都没有批语。","en":"Everyone in the Chancellor's office knows: Ziheng has lost favor. Your memoranda come back three times, each without a word writ 送江夏。你终于明白了曹操的意思：他不必亲手杀你。","en":"You go south with a letter of state. Liu Biao receives you politely, then sends you on to Jiangxia. At last you understand Cao's meaning: he doesn't need to kill you himself."}}],"effects":[{"set":"flag.exiled","to":true},{"set":"flag.mi_heng","to":true}],"ends":true},{"id":"kneel","type":"strategy","label":{"zh":"跪在丞相府门前请罪。","en":"Kneel at the Chancellor's gate and beg forgiveness."},"out":[{"text":{"zh":"你跪了一整天。傍晚，曹操让人传话：『起来吧。孤要的是会说话的人，不是不会说话的人。』","en":"You kneel all day. At dusk Cao sends word: 'Get up. I want men who know how to speak—not men who don't know when to stop.'"}}],"effects":[{"add":"rel.caocao.esteem","by":-2},{"add":"renown.rash","by":-2}],"req":{"v":"rel.caocao.esteem","op":">=","val":5},"hint":{"zh":"需要曹操的赏识 ≥ 5，他才肯给你台阶","en":"Needs Cao's regard ≥ 5 for him to give you a way back"}},{"id":"again","type":"dilemma","label":{"zh":"当着来使的面，再骂一次。","en":"Curse him again, in front of his messenger."},"out":[{"text":{"zh":"来使面色惨白地回去复命。曹操只笑了一声：『送他去荆州。』你学祢衡学到了底。","en":"The messenger goes back ashen-faced. Cao only laughs once. 'Send him to Jingzhou.' You have followed Mi Heng all the way."}}],"effects":[{"set":"flag.exiled","to":true},{"set":"flag.mi_heng","to":true},{"add":"renown.rash","by":2}],"ends":true}],"salience":0,"order":0,"when":{"all":[{"v":"track","op":"==","val":"cao"},{"v":"imp.caocao.offended","op":">=","val":2}]},"art":{"scene":"letter","layers":[]},"place":null,"cast":[{"id":"caocao"}]},"x_loose":{"id":"x_loose","chapter":"*","kind":"interrupt","title":{"zh":"失言","en":"A Slip of the Tongue"},"lock":"free","canon":{"zh":"原创危机","en":"original crisis"},"intro":[{"text":{"zh":"有人把你夜里说的那些话，一句一句报给了刘备。张飞拍着桌子：『这种人留在身边做什么？』","en":"Someone has reported to Liu Bei, word for word, the things you've been saying at night. Zhang Fei pounds the table. 'Why keep a man like that around?'"},"when":{"v":"track","op":"==","val":"liu"}},{"text":{"zh":"程昱把一张纸放在曹操案头，上面抄着你这些日子说过的话。曹操看完，叫你过去。","en":"Cheng Yu lays a sheet on Cao Cao's desk: a copy of everything you've said lately. Cao reads it and sends for you."},"when":{"v":"track","op":"==","val":"cao"}}],"choices":[{"id":"apologize","type":"strategy","label":{"zh":"认错：话说过了头，愿受责罚。","en":"Admit it: you spoke out of turn, and will accept the consequences."},"out":[{"text":{"zh":"主公没有罚你，只说：『先生是聪明人，聪明人最该管住嘴。』","en":"Your lord doesn't punish you. He only says, 'You're a clever man. Clever men most of all should mind their tongues.'"}}],"effects":[{"add":"renown.rash","by":-2},{"add":"rel.liubei.trust","by":-1},{"add":"rel.caocao.esteem","by":-1}],"values":["cheng"]},{"id":"defend","type":"dilemma","label":{"zh":"辩解：都是真心话，句句有所指。","en":"Defend yourself: you meant every word, and each had a point."},"out":[{"text":{"zh":"你一句一句解释。主公听完，沉默了很久：『有些真话，要挑时候说。』这件事就这样过去了。","en":"You explain each line. Your lord listens and is silent for a long time. 'Some truths need the right moment.' And there it ends."}}],"effects":[{"add":"renown.rash","by":-1}],"req":{"any":[{"v":"rel.liubei.trust","op":">=","val":6},{"v":"rel.caocao.esteem","op":">=","val":6}]},"hint":{"zh":"需要主公足够信你（刘备信任或曹操赏识 ≥ 6）","en":"Needs your lord's confidence (Liu Bei's trust or Cao's regard ≥ 6)"},"values":["cheng","yong"]},{"id":"leave","type":"dilemma","label":{"zh":"请辞。","en":"Resign."},"out":[{"text":{"zh":"没有人挽留你。你走的那天，连送行的人都没有。","en":"No one asks you to stay. On the day you leave, no one even sees you off."}}],"effects":[{"set":"flag.exiled","to":true}],"ends":true}],"salience":0,"order":4,"when":{"v":"renown.rash","op":">=","val":4},"art":{"scene":"lamp","layers":[]},"place":null,"cast":[{"id":"liubei","when":{"v":"track","op":"==","val":"liu"}},{"id":"caocao","when":{"v":"track","op":"==","val":"cao"}}]},"x_plum_rage":{"id":"x_plum_rage","chapter":"*","kind":"flash","title":{"zh":"梅园变色","en":"The Garden Turns Cold"},"lock":"free","canon":{"zh":"原创","en":"original"},"intro":[{"text":{"zh":"曹操把酒樽往案上一顿。笑意还挂在脸上，眼睛已经冷了：『玄德，你这位门客，是替你来试孤的？』廊下的甲士按着刀，往前走了一步。刘备离席，伏在地上不起来。","en":"Cao Cao sets his cup down hard. The smile is still on his face; his eyes have gone cold. 'Xuande—did you bring this guest of yours to test me?' The guards under the eaves step forward, hands on their swords. Liu Bei leaves his seat and goes down on the ground, and stays there."}}],"choices":[{"id":"take","type":"dilemma","label":{"zh":"一个人担下来：『狂言是我一人的，与刘使君无关。』","en":"Take it all on yourself: 'The wild talk was mine alone. Lord Liu had nothing to do with it.'"},"out":[{"text":{"zh":"曹操盯着你看了很久：『好，有担当。拖下去，打二十棍，扔出府门。』棍子落下来的时候，你听见刘备在席上替你求情。那天夜里，他亲自来给你上药，一句责备的话也没说。","en":"Cao studies you for a long time. 'Good. A man who answers for himself. Take him out, twenty strokes, and throw him into the street.' As the rod comes down you hear Liu Bei pleading for you inside. That night he comes himself to dress your back, and says not one word of reproach."}}],"effects":[{"set":"flag.flogged","to":true},{"set":"flag.cao_wary","to":true},{"add":"rel.liubei.trust","by":1},{"add":"rel.caocao.esteem","by":-2},{"add":"renown.rash","by":1}],"values":["yi","yong"]},{"id":"beg","type":"expression","label":{"zh":"跟着主公一起伏地请罪。","en":"Go down beside your lord and beg forgiveness."},"out":[{"text":{"zh":"刘备替你磕了三个头。曹操这才笑了：『醉话而已，玄德何必当真。』酒宴照旧。回去的路上，刘备说：『今天差一点，就是你我两条命。』","en":"Liu Bei touches his head to the floor three times for you. Only then does Cao laugh. 'Drunken talk. Why take it so seriously, Xuande?' The feast goes on. On the way home Liu Bei says, 'Today it nearly cost us both our lives.'"}}],"effects":[{"set":"flag.cao_wary","to":true},{"add":"rel.liubei.trust","by":-2},{"add":"rel.caocao.esteem","by":-1}]},{"id":"turn","type":"strategy","label":{"zh":"举杯转圜：把刚才的狂话，说成是替丞相不平——天下英雄，没人配与丞相对饮。","en":"Raise your cup and turn it: your wild words were outrage on the Chancellor's behalf—no one in the realm is fit to drink with him."},"out":[{"text":{"zh":"曹操盯着你，忽然大笑：『好一张嘴！』他亲自给你斟了一杯。酒宴照旧。只是从那天起，许都多了几双盯着刘备的眼睛。","en":"Cao stares at you, then bursts out laughing. 'What a tongue!' He pours your cup himself. The feast goes on. But from that day, more eyes in Xuchang are watching Liu Bei."}}],"effects":[{"set":"flag.cao_wary","to":true},{"add":"rel.caocao.esteem","by":1},{"add":"rel.liubei.trust","by":-1},{"add":"renown.cunning","by":1}],"req":{"v":"renown.cunning","op":">=","val":1},"hint":{"zh":"需要“权谋”名声 ≥ 1：你得是个出了名会说话的人，曹操才肯接这个台阶","en":"Needs a name for cunning ≥ 1: Cao only takes the way out from a man known for his tongue"},"values":["zhi"]},{"id":"defy","type":"dilemma","label":{"zh":"梗着脖子，把话说完。","en":"Lift your chin and finish what you were saying."},"out":[{"text":{"zh":"曹操笑了：『好。孤成全你。』你被押进了许都大牢。刘备出城那天，你在牢里听见城外的马蹄声。","en":"Cao smiles. 'Very well. You shall have what you want.' You are taken to the Xuchang jail. On the day Liu Bei rides out of the city, you hear the hooves from your cell."}}],"effects":[{"set":"flag.jailed","to":true},{"set":"flag.left_behind","to":true},{"set":"flag.cao_wary","to":true},{"add":"renown.rash","by":2}],"values":["yong"]}],"salience":0,"order":0,"art":{"scene":"garden","layers":[{"id":"storm"}]},"place":null,"cast":[{"id":"caocao"},{"id":"liubei"}]},"x_jail":{"id":"x_jail","chapter":"*","kind":"interrupt","title":{"zh":"许都大牢","en":"The Xuchang Jail"},"lock":"free","canon":{"zh":"原创","en":"original"},"intro":[{"text":{"zh":"你在墙上刻到第九十道的时候，外面的消息已经传遍了：刘备请命截击袁术，带着五万兵马出了城。没有人来接你。","en":"By the time you've scratched the ninetieth mark on the wall, the news is everywhere: Liu Bei volunteered to intercept Yuan Shu and rode out with fifty thousand men. No one came for you."}}],"choices":[{"id":"wait","type":"expression","label":{"zh":"等。","en":"Wait."},"out":[{"text":{"zh":"又过了一个月，狱卒打开门：『丞相说，放了。』没人告诉你为什么。你一路向东，在徐州城外追上了刘备。他看见你，下了马，什么也没说，把自己的斗篷披在你身上。","en":"Another month passes. Then the jailer opens the door. 'The Chancellor says let him go.' No one tells you why. You head east and catch up with Liu Bei outside Xuzhou. When he sees you, he dismounts, says nothing, and puts his own cloak around your shoulders."}}],"effects":[{"set":"flag.jailed","to":false},{"set":"flag.was_jailed","to":true},{"add":"rel.liubei.trust","by":1},{"add":"renown.rash","by":-1}]},{"id":"wenzhi","type":"strategy","label":{"zh":"托人给温芷带个话。","en":"Get word to Wen Zhi."},"out":[{"text":{"zh":"第七天，温芷提着药箱进了牢房，说是给犯人看病。她走后，你在药包底下摸到一张盖了印的路引。那天夜里，你出了许都。","en":"On the seventh day Wen Zhi comes into the jail with her medicine chest, saying she's here to treat the prisoners. After she leaves, you find a stamped travel pass under the herbs. That night you are out of Xuchang."}}],"effects":[{"set":"flag.jailed","to":false},{"set":"flag.was_jailed","to":true},{"add":"rel.wenzhi.intimacy","by":1},{"add":"rel.wenzhi.trust","by":1}],"req":{"any":[{"v":"flag.asked_wenzhi","op":"==","val":true},{"v":"rel.wenzhi.intimacy","op":">=","val":2}]},"hint":{"zh":"需要和温芷走得足够近（亲近 ≥ 2，或托过她打听消息）","en":"Needs to be close to Wen Zhi (closeness ≥ 2, or have asked her for news)"}},{"id":"recant","type":"dilemma","label":{"zh":"给曹操上书认错。","en":"Write to Cao Cao and recant."},"out":[{"text":{"zh":"曹操看完你的信，笑了：『早这样不就好了。』当天就放了你。可这封信后来传到了刘备耳朵里。他没提，你知道他听说了。","en":"Cao reads your letter and laughs. 'Why not do this sooner?' You're released that day. But word of the letter reaches Liu Bei. He never mentions it. You know he's heard."}}],"effects":[{"set":"flag.jailed","to":false},{"set":"flag.was_jailed","to":true},{"add":"rel.caocao.esteem","by":1},{"add":"rel.liubei.trust","by":-1}]}],"salience":0,"order":-1,"when":{"v":"flag.jailed","op":"==","val":true},"art":{"scene":"lamp","layers":[]},"place":null},"x_cao_rage":{"id":"x_cao_rage","chapter":"*","kind":"flash","title":{"zh":"曹操发作","en":"Cao Cao Loses Patience"},"lock":"free","canon":{"zh":"原创","en":"original"},"intro":[{"text":{"zh":"曹操的脸色变了。『刘备的人，在孤面前也敢这样说话？』他抬了抬手，身后的人就把你按在了地上。","en":"Cao's face changes. 'One of Liu Bei's men, talking like that in front of me?' He lifts a hand, and the men behind him pin you to the floor."},"when":{"v":"track","op":"!=","val":"cao"}},{"text":{"zh":"曹操把手里的竹简往案上一摔：『孤给你脸，你偏不要。』许褚已经走到了你身后。","en":"Cao slams his bamboo slips onto the desk. 'I give you face, and you throw it back at me.' Xu Chu is already standing behind you."},"when":{"v":"track","op":"==","val":"cao"}}],"choices":[{"id":"kneel","type":"expression","label":{"zh":"叩头请罪。","en":"Bow to the floor and beg his pardon."},"out":[{"text":{"zh":"曹操让你在地上跪了一个时辰，才挥了挥手：『滚。』","en":"Cao leaves you kneeling for an hour before he waves a hand. 'Get out.'"}}],"effects":[{"add":"rel.caocao.esteem","by":-2},{"add":"renown.rash","by":1}]},{"id":"turn","type":"strategy","label":{"zh":"用一句妙语把话圆回来。","en":"Turn it with a well-placed line."},"out":[{"text":{"zh":"曹操愣了一下，大笑：『罢了！你这张嘴，迟早害死你。』","en":"Cao is caught off guard, then roars with laughter. 'Enough! That tongue of yours will be the death of you.'"}}],"effects":[{"add":"rel.caocao.esteem","by":-1}],"req":{"v":"rel.caocao.esteem","op":">=","val":5},"hint":{"zh":"需要曹操的赏识 ≥ 5，他才肯听你圆","en":"Needs Cao's regard ≥ 5 for him to let you talk your way out"}},{"id":"defy","type":"dilemma","label":{"zh":"不跪。","en":"Refuse to kneel."},"out":[{"text":{"zh":"许褚的手按上你的肩。关羽站了起来：『此人是我兄长的人。要罚，连关某一起罚。』曹操看了关羽很久，挥了挥手。","en":"Xu Chu's hand closes on your shoulder. Guan Yu rises. 'This man belongs to my brother. Punish him, and you punish me too.' Cao looks at Guan Yu a long time, then waves his hand."}}],"effects":[{"add":"rel.caocao.esteem","by":-2},{"add":"rel.guanyu.esteem","by":1},{"add":"renown.rash","by":1},{"set":"flag.cao_wary","to":true}],"when":{"v":"track","op":"!=","val":"cao"},"values":["yong"]},{"id":"defy_cao","type":"dilemma","label":{"zh":"不跪。","en":"Refuse to kneel."},"out":[{"text":{"zh":"曹操说：『祢衡走过的路，你也走一遍吧。』第二天，你被送往荆州。","en":"Cao says, 'Mi Heng's road—you may walk it too.' The next day you are sent to Jingzhou."}}],"effects":[{"set":"flag.mi_heng","to":true},{"set":"flag.exiled","to":true},{"add":"renown.rash","by":2}],"when":{"v":"track","op":"==","val":"cao"},"ends":true}],"salience":0,"order":0,"art":{"scene":"hall","layers":[]},"place":null,"cast":[{"id":"caocao"}]}},"endings":[{"id":"g_side","title":{"zh":"归属","en":"Allegiance"},"fragments":[{"id":"miheng","text":{"zh":"你和祢衡一样，被送去了荆州。后来的事，没有人记得很清楚——史书里，只多了一句“又有狂士某”。","en":"Like Mi Heng, you were sent to Jingzhou. What happened after, no one remembers clearly; the histories add only 'and another brash scholar.'"},"when":{"v":"flag.mi_heng","op":"==","val":true}},{"id":"exposed","text":{"zh":"你的名字后来出现在好几本笔记里，都在“异人”那一卷。至于赤壁，你是在家乡听说的——和你梦见的一模一样。","en":"Your name later turns up in several miscellanies, always in the chapter on strange men. As for Red Cliffs, you hear about it back home—exactly as you dreamed it."},"when":{"all":[{"v":"flag.exiled","op":"==","val":true},{"v":"flag.exposed","op":"==","val":true}]}},{"id":"left","text":{"zh":"你带着一匹马离开了。后来的事，你是从说书人嘴里听来的。","en":"You left with a horse and little else. You heard the rest of the story from the storytellers."},"when":{"v":"flag.exiled","op":"==","val":true}},{"id":"liu","text":{"zh":"你仍在刘备帐下，随他南取荆州。","en":"You remain in Liu Bei's service and follow him south to take Jingzhou."},"when":{"v":"track","op":"==","val":"liu"}},{"id":"cao","text":{"zh":"你随曹操北还许都，名字写进了丞相府的名册。","en":"You return north to Xuchang with Cao Cao, your name entered in the Chancellor's rolls."},"when":{"v":"track","op":"==","val":"cao"}}]},{"id":"g_lord","title":{"zh":"主公","en":"Your Lord"},"fragments":[{"id":"liu_high","text":{"zh":"刘备说：『孔明是我的水，子衡是我的井。』这话传出去被人笑了很久，你却记了一辈子。","en":"Liu Bei says, 'Kongming is my river; Ziheng is my well.' People laugh at that for years. You remember it all your life."},"when":{"all":[{"v":"track","op":"==","val":"liu"},{"v":"rel.liubei.trust","op":">=","val":10}]}},{"id":"liu_mid","text":{"zh":"刘备敬重你，遇事会问你。但你知道，最后拿主意的人已经是诸葛亮了。","en":"Liu Bei respects you and asks your opinion. But you know the man who decides is Zhuge Liang now."},"when":{"all":[{"v":"track","op":"==","val":"liu"},{"v":"rel.liubei.trust","op":">=","val":7}]}},{"id":"liu_low","text":{"zh":"刘备待你始终客气。客气，就是隔着一层。","en":"Liu Bei is always courteous to you. Courtesy is a kind of distance."},"when":{"v":"track","op":"==","val":"liu"}},{"id":"cao_high","text":{"zh":"曹操把你列为心腹谋臣，与程昱、荀攸同席。","en":"Cao Cao counts you among his closest advisers, seated with Cheng Yu and Xun You."},"when":{"all":[{"v":"track","op":"==","val":"cao"},{"v":"rel.caocao.esteem","op":">=","val":8}]}},{"id":"cao_low","text":{"zh":"曹操用你，也防你。他从没忘记你是从刘备那里来的。","en":"Cao Cao uses you, and watches you. He never forgets you came from Liu Bei."},"when":{"v":"track","op":"==","val":"cao"}}]},{"id":"g_name","title":{"zh":"名声","en":"Your Name"},"fragments":[{"id":"rash","text":{"zh":"人说子衡口无遮拦。喜欢你的人说你真，怕你的人说你狂。","en":"People say Ziheng can't hold his tongue. Those who like you call it honesty; those who fear you call it madness."},"when":{"v":"renown.rash","op":">=","val":3}},{"id":"uncanny","text":{"zh":"坊间传说你能知未来。敬你的人叫你『先生』，怕你的人叫你『妖人』。","en":"People say you can see the future. Those who respect you call you 'Master'; those who fear you call you a sorcerer."},"when":{"v":"uncanny","op":">=","val":3}},{"id":"loyal","text":{"zh":"人说子衡有古人之风，重义。","en":"People say Ziheng is a man of the old kind, who keeps faith."},"when":{"v":"renown.loyal","op":">","val":"@renown.cunning"}},{"id":"cunning","text":{"zh":"人说子衡多智，也说子衡心深。","en":"People say Ziheng is clever, and that his mind runs deep."},"when":{"v":"renown.cunning","op":">","val":"@renown.loyal"}},{"id":"none","text":{"zh":"史书里没有你的传，只有几处『或曰』。","en":"The histories give you no biography—just a few lines beginning 'some say.'"}}]},{"id":"g_guanyu","title":{"zh":"关羽","en":"Guan Yu"},"fragments":[{"id":"vouched","text":{"zh":"华容道之后，关羽每次喝酒都要先敬你一杯：『那一跪，我记着。』","en":"After Huarong, whenever Guan Yu drinks, he raises the first cup to you. 'I remember that you knelt.'"},"when":{"v":"flag.vouched_guan","op":"==","val":true}},{"id":"pleaded","text":{"zh":"华容道上关羽让开的那条路，曹操记在了你的名下。","en":"Cao Cao credits you with the road Guan Yu opened at Huarong."},"when":{"v":"flag.pleaded_guan","op":"==","val":true}},{"id":"owes","text":{"zh":"关羽一直记着欠你的那份情。他不常说，但每逢有人议论你，他就把刀往桌上一放。","en":"Guan Yu never forgets what he owes you. He rarely mentions it, but whenever someone talks about you behind your back, he sets his blade on the table."},"when":{"any":[{"v":"flag.vouched_guan","op":"==","val":true},{"v":"flag.at_huarong","op":"==","val":true},{"v":"flag.guan_fear","op":"==","val":true}]}},{"id":"respect","text":{"zh":"关羽敬你。在他那里，这比喜欢难得多。","en":"Guan Yu respects you. With him, that is much harder to earn than liking."},"when":{"v":"rel.guanyu.esteem","op":">=","val":6}},{"id":"cold","text":{"zh":"关羽说起你，只有两个字：『可惜。』","en":"When Guan Yu speaks of you, it's one word: 'Pity.'"},"when":{"v":"rel.guanyu.esteem","op":"<=","val":0}},{"id":"plain","text":{"zh":"你和关羽，始终是点头之交。","en":"You and Guan Yu remain nodding acquaintances."}}]},{"id":"g_zhuge","title":{"zh":"诸葛亮","en":"Zhuge Liang"},"fragments":[{"id":"nod","text":{"zh":"那一句『你点头了？』，诸葛亮到最后也没有再问。","en":"Zhuge Liang never asks again whether you nodded."},"when":{"all":[{"v":"track","op":"==","val":"liu"},{"v":"flag.at_huarong","op":"==","val":true}]}},{"id":"wary","text":{"zh":"诸葛亮对你始终存着一分戒心。你知道得太多，又说不出是从哪里知道的。","en":"Zhuge Liang never quite lowers his guard with you. You know too much, and can't say how."},"when":{"all":[{"v":"track","op":"==","val":"liu"},{"v":"rel.zhuge.trust","op":"<=","val":3}]}},{"id":"respect","text":{"zh":"诸葛亮出兵前，会把方略先给你看一遍。","en":"Before any campaign, Zhuge Liang shows you his plans first."},"when":{"all":[{"v":"track","op":"==","val":"liu"},{"v":"rel.zhuge.esteem","op":">=","val":4}]}},{"id":"plain","text":{"zh":"诸葛亮与你相处融洽，却没有深交。","en":"You and Zhuge Liang get along, but never grow close."},"when":{"v":"track","op":"==","val":"liu"}}]},{"id":"g_wenzhi","title":{"zh":"温芷","en":"Wen Zhi"},"fragments":[{"id":"married","text":{"zh":"那一夜江边说出口的话，你们谁都没有收回。后来你们在公安城外成了亲，开了一间药铺，不问来人是哪一边的。","en":"Neither of you ever took back what was said by the river that night. Later you married outside Gong'an and opened an apothecary that never asked which side its patients were on."},"when":{"all":[{"v":"flag.wenzhi_with_you","op":"==","val":true},{"v":"flag.confessed","op":"==","val":true}]},"mood":"romance"},{"id":"with_you","text":{"zh":"温芷跟你回了南岸。她手上的疤一直没消。后来你们在公安城外开了一间药铺，晒药的竹匾你来翻。","en":"Wen Zhi comes back to the south bank with you. The scars on her hands never fade. Later the two of you open an apothecary outside Gong'an, and you turn the drying trays."},"when":{"v":"flag.wenzhi_with_you","op":"==","val":true},"mood":"romance"},{"id":"together","text":{"zh":"你和温芷在许都成了家。你在丞相府起草文书，她在药圃里晒当归。","en":"You and Wen Zhi make a home in Xuchang. You draft documents for the Chancellor; she dries angelica in the garden."},"when":{"all":[{"v":"track","op":"==","val":"cao"},{"v":"flag.wenzhi_together","op":"==","val":true}]},"mood":"romance"},{"id":"cao_saved","text":{"zh":"赤壁那一夜，后营的病兵一个没丢。温芷说，那天你叫她搬，是她这辈子听过最没道理、也最对的话。","en":"On the night of the fire, not one patient in the rear camp was lost. Wen Zhi says that when you told her to move them, it was the least reasonable and most correct thing she ever heard."},"when":{"all":[{"v":"track","op":"==","val":"cao"},{"v":"flag.wenzhi_warned","op":"==","val":true}]}},{"id":"used","text":{"zh":"温芷再没回过信。你后来才明白：她冒着性命写来的东西，被你当成了军报。","en":"Wen Zhi never writes again. Only later do you understand: what she risked her life to write, you treated as military intelligence."},"when":{"v":"flag.wenzhi_used","op":"==","val":true}},{"id":"safe","text":{"zh":"温芷随曹军北还。每年冬至，你都会收到一包止血散，没有信。","en":"Wen Zhi goes north with Cao's army. Every year at the solstice a packet of wound powder arrives for you, with no letter."},"when":{"any":[{"v":"flag.wenzhi_safe","op":"==","val":true},{"v":"flag.wenzhi_warned","op":"==","val":true}]}},{"id":"far","text":{"zh":"你很久没有温芷的消息了。","en":"You haven't heard from Wen Zhi in a long time."}}]},{"id":"g_lives","title":{"zh":"因你而不同的人","en":"Lives You Changed"},"mode":"all","fragments":[{"id":"jail","when":{"v":"flag.was_jailed","op":"==","val":true},"text":{"zh":"你在许都的大牢里待过三个月。后来有人问起，你只说：那里很安静，适合想事情。","en":"You spent three months in the Xuchang jail. When people ask about it later, you say only: it was quiet, good for thinking."}},{"id":"flogged","when":{"v":"flag.flogged","op":"==","val":true},"text":{"zh":"梅园那二十棍，在你背上留了疤。刘备每次看见，都不说话。","en":"The twenty strokes from the plum garden left scars on your back. Whenever Liu Bei sees them, he says nothing."}},{"id":"xushu","text":{"zh":"徐庶没有北去。他的母亲被软禁在许都，母子再没见面，但都活着。","en":"Xu Shu never went north. His mother lives under guard in Xuchang; they never meet again, but both are alive."},"when":{"v":"flag.xushu_stayed","op":"==","val":true}},{"id":"mi","text":{"zh":"糜夫人没有投井。阿斗长大后，叫你『子衡叔』。","en":"Lady Mi never threw herself into the well. When Adou grows up, he calls you Uncle Ziheng."},"when":{"v":"flag.mi_saved","op":"==","val":true}},{"id":"kongxiu","text":{"zh":"东岭关的孔秀活了下来。说书人讲『过五关斩六将』时，你总想纠正：是五将。","en":"Kong Xiu of Dongling Pass survived. Whenever storytellers recite 'five passes, six generals,' you want to correct them: five."},"when":{"v":"flag.kongxiu_spared","op":"==","val":true}},{"id":"pangtong","text":{"zh":"庞统早来了好几年。很久以后，你会想起一个叫落凤坡的地名，然后决定什么都不说。","en":"Pang Tong came years early. Long afterwards, a place called Fallen Phoenix Slope will cross your mind, and you will decide to say nothing."},"when":{"v":"flag.pangtong_joined","op":"==","val":true}},{"id":"mercy","text":{"zh":"长坂坡上那个缺口，你到死都没有告诉曹操。","en":"You never tell Cao Cao about the gap at Changban, not to your dying day."},"when":{"v":"flag.secret_mercy","op":"==","val":true}},{"id":"forged","text":{"zh":"徐母的灵位，你每年都去上一炷香。","en":"Every year you light incense before Xu Shu's mother's spirit tablet."},"when":{"v":"flag.forged_letter","op":"==","val":true}},{"id":"reserve","text":{"zh":"下游那二十条船上的三千人，后来有很多成了你的兵。","en":"Many of the three thousand saved on those twenty ships later served under you."},"when":{"v":"flag.cao_reserve","op":"==","val":true}}]},{"id":"g_history","title":{"zh":"天下","en":"The Realm"},"fragments":[{"id":"far","text":{"zh":"说书人讲到这一段，总有几处讲不顺——那几处，都是你。","en":"When storytellers reach this part, a few places never quite fit. Those places are you."},"when":{"v":"deviation","op":">=","val":3}},{"id":"near","text":{"zh":"史书和演义大体如常，只在几个角落多了几行小字。","en":"The histories and the novel run much as they always did, with a few lines of small print added in the corners."},"when":{"v":"deviation","op":">=","val":1}},{"id":"same","text":{"zh":"后人读《三国》，找不到你的名字。你只是改变了一些人的一些日子。","en":"Later readers of the Three Kingdoms will never find your name. You only changed some days in some lives."}}]}],"future_terms":[{"term":{"zh":"下邳","en":"Xiapi"},"from":"c3"},{"term":{"zh":"土山","en":"Tushan"},"from":"c3"},{"term":{"zh":"官渡","en":"Guandu"},"from":"c4"},{"term":{"zh":"过五关","en":"five passes"},"from":"c4"},{"term":{"zh":"千里走单骑","en":"rode a thousand li"},"from":"c4"},{"term":{"zh":"赤兔","en":"Red Hare"},"from":"c4"},{"term":{"zh":"诸葛亮","en":"Zhuge"},"from":"c5"},{"term":{"zh":"孔明","en":"Kongming"},"from":"c5"},{"term":{"zh":"卧龙","en":"Sleeping Dragon"},"from":"c5"},{"term":{"zh":"隆中","en":"Longzhong"},"from":"c5"},{"term":{"zh":"三顾","en":"three visits"},"from":"c5"},{"term":{"zh":"庞统","en":"Pang Tong"},"from":"c5"},{"term":{"zh":"凤雏","en":"Young Phoenix"},"from":"c5"},{"term":{"zh":"长坂","en":"Changban"},"from":"c6"},{"term":{"zh":"阿斗","en":"Adou"},"from":"c6"},{"term":{"zh":"赤壁","en":"Red Cliffs"},"from":"c7"},{"term":{"zh":"连环","en":"chain the ships"},"from":"c7"},{"term":{"zh":"东风","en":"east wind"},"from":"c7"},{"term":{"zh":"草船","en":"straw boats"},"from":"c7"},{"term":{"zh":"借箭","en":"borrow arrows"},"from":"c7"},{"term":{"zh":"火攻","en":"fire attack"},"from":"c7"},{"term":{"zh":"黄盖","en":"Huang Gai"},"from":"c7"},{"term":{"zh":"华容","en":"Huarong"},"from":"c8"},{"term":{"zh":"落凤坡","en":"Fallen Phoenix"},"from":"c99"},{"term":{"zh":"麦城","en":"Maicheng"},"from":"c99"},{"term":{"zh":"白帝城","en":"Baidi"},"from":"c99"},{"term":{"zh":"五丈原","en":"Wuzhang"},"from":"c99"}],"ending_art":{"scene":"ending","layers":[{"id":"two_boat","when":{"v":"flag.wenzhi_with_you","op":"==","val":true}},{"id":"home","when":{"v":"flag.wenzhi_together","op":"==","val":true}},{"id":"city","when":{"v":"track","op":"==","val":"cao"}},{"id":"lone","when":{"all":[{"v":"flag.wenzhi_with_you","op":"!=","val":true},{"v":"flag.wenzhi_together","op":"!=","val":true}]}},{"id":"plum","when":{"v":"flag.covered_liu","op":"==","val":true}},{"id":"sail"}]},"art_prompts":{"garden":{"zh":"水墨淡彩，宽幅。许都后园，青梅枝从左上探入，远处城墙，右侧小亭中二人对坐煮酒，雷雨将至。图层：雷雨（闪电、雨丝）。","en":"Chinese ink wash with light color, wide banner. A walled garden in Xuchang: green-plum branches from the upper left, distant city wall, two men seated drinking in a small pavilion on the right, storm gathering. Layer: storm (lightning, rain)."},"lamp":{"zh":"夜，窗格内一灯如豆，一人跪坐读书，窗外竹影。图层：案上一道红色血诏。","en":"Night. Through a lattice window a single lamp, a seated man reading, bamboo shadows outside. Layer: a red silk edict on the desk."},"herbs":{"zh":"药圃，圆形月洞门，竹匾晒药，一名医女。图层：同行男子；春日落花；粉色花瓣（恋爱时刻）。","en":"Herb garden with a round moon gate, bamboo drying trays, a woman physician. Layers: a man beside her; spring blossoms; pink petals (romance moment)."},"road":{"zh":"平原大路，行军队列与红旗，远处许都城墙。图层：远处尘土中的追骑。","en":"A plain with a marching column and red banners, Xuchang's walls in the distance. Layer: pursuing riders in a dust cloud."},"letter":{"zh":"夜，烛光书案，信笺、毛笔、砚台。图层：药包；朱印；窗外江面火光。","en":"Night desk by candlelight: letter, brush, inkstone. Layers: medicine packet; red seal; river glow through a window."},"hill":{"zh":"土山被围，山顶一将与两位女眷，山下敌营红旗，一骑来劝降。图层：一骑从山后小路突围。","en":"A surrounded earthen hill: a general and two ladies on top, enemy tents with red flags below, a lone rider approaching to parley. Layer: a rider escaping down the back path."},"hall":{"zh":"厅堂内景，梁柱，门外天光。图层：梁上悬印、贴封条的箱笼；一匹赤红骏马。","en":"Hall interior, beams and pillars, daylight through the door. Layers: an official seal hanging from a beam and sealed chests; a red warhorse."},"camp":{"zh":"北方营寨，群山，蓝红旗帜林立。","en":"A northern army camp among mountains, forests of blue and red banners."},"mirror":{"zh":"竹林溪畔，隐士抚琴，二客远立。","en":"Bamboo grove by a stream, a recluse playing the zither, two visitors standing at a distance."},"snow":{"zh":"雪中茅庐，篱笆，门外数人立雪等候。图层：第四人（徐庶）。","en":"A thatched cottage in snow with a fence, several men waiting outside. Layer: a fourth man (Xu Shu)."},"bridge":{"zh":"长坂桥，一将横矛立马桥上，桥东树林，百姓奔逃。图层：林中尘土（疑兵）；白袍骑将救人。","en":"Changban bridge: a general with a spear on horseback on the bridge, woods to the east, fleeing civilians. Layers: dust in the woods (feint); a white-robed rider rescuing."},"slope":{"zh":"山坡上曹操与旌旗，坡下枪阵，一白袍将怀抱婴儿突围。图层：阵边缺口中逃出的车辆。","en":"Cao Cao and banners on a hilltop, spear ranks below, a white-robed general breaking through with an infant. Layer: carts escaping through a gap."},"fog":{"zh":"大雾江面，远岸营火。图层：插满箭的草船。","en":"Fog on the river, distant campfires. Layer: straw boats bristling with arrows."},"fire":{"zh":"赤壁夜江，铁索连舟。图层：火攻与红天；火船；后营空/后营起火；提灯小舟（接人）；下游未连锁的船。","en":"Night river at Red Cliffs, ships chained together. Layers: fire and red sky; fire ships; rear camp empty or burning; a small boat with a lantern (rescue); unchained ships downstream."},"huarong":{"zh":"华容道，两侧峭壁，泥泞小路，残兵队列，一将立马拦路。图层：背药箱的女子在队尾。","en":"Huarong road between cliffs, a muddy path, a column of defeated soldiers, a general blocking the way on horseback. Layer: a woman with a medicine chest at the rear."},"campfire":{"zh":"夜营篝火，帐篷剪影，二人对坐火边，火星飞起。图层：城楼（古城）；横在膝上的刀。","en":"A night camp: a fire with sparks, tent silhouettes, two men seated by the fire. Layers: a city wall (Gucheng); a blade across the knees."},"riverbank":{"zh":"战后夜江，水面漂着焦木，远处余火，江边一名女子洗药杵。图层：身旁一名男子。","en":"The river at night after battle: charred timbers drifting, distant embers, a woman washing a pestle at the water's edge. Layer: a man beside her."},"ending":{"zh":"尾声：晨江远山，红日。图层：两人同舟；江边茅屋炊烟；城郭；独立江岸；梅枝；远帆。","en":"Epilogue: river and mountains at dawn, red sun. Layers: two people in a boat; a cottage with smoke; city walls; a lone figure on "flag.wz_child":{"type":"flag","init":false,"label":{"zh":"和温芷说起将来的孩子","en":"Talked with Wen Zhi about a child"}},"flag.pt_alive":{"type":"flag","init":false,"label":{"zh":"庞统没有死在落凤坡","en":"Pang Tong did not die at Fallen Phoenix Slope"}},"flag.with_pangtong":{"type":"flag","init":false,"label":{"zh":"随庞统走了小路","en":"Took the narrow road with Pang Tong"}},"flag.post_chengdu":{"type":"flag","init":false,"label":{"zh":"留在成都","en":"Stayed in Chengdu"}},"flag.post_jingzhou":{"type":"flag","init":false,"label":{"zh":"回荆州，在关羽身边","en":"Went back to Jingzhou, beside Guan Yu"}},"flag.post_none":{"type":"flag","init":false,"label":{"zh":"什么都不要","en":"Asked for nothing"}},"flag.v2_left":{"type":"flag","init":false,"label":{"zh":"被冷落后离开","en":"Left after being sidelined"}},"flag.v2_exposed":{"type":"flag","init":false,"label":{"zh":"妖人之名坐实","en":"Branded a sorcerer for good"}},"flag.sidelined":{"type":"flag","init":false,"label":{"zh":"被冷落","en":"Sidelined"}},"flag.guan_charge":{"type":"flag","init":false,"label":{"zh":"关羽托付了你一句话","en":"Guan Yu entrusted you with a word"}}},"chars":{"liubei":{"name":{"zh":"刘备","en":"Liu Bei"},"dims":{"warmth":[3,0,10],"trust":[3,0,10],"esteem":[2,0,10]},"main":"trust","persona":{"zh":"刘备：汉室宗亲，四十上下，仁厚、能忍，寄人篱下多年；说话温和，常自谦，偶尔流露出不甘。称玩家“子衡”或“先生”。","en":"Liu Bei: a distant imperial kinsman around forty, kind and patient after years of depending on others; speaks gently and modestly, with flashes of frustration. Calls the player Ziheng."},"romance":false,"values":{"ren":["trust",1],"yi":["trust",1],"zhi":["esteem",1],"li":["warmth",-1]},"heat":{"rude":[1],"threat":[2],"nonsense":[0,0,1],"line":3},"react":{"love":[{"zh":"刘备一愣，随即笑了：『先生这话，备记下了。乱世之中，肯说这种话的人不多。』","en":"Liu Bei blinks, then laughs. 'I'll remember that, sir. Few people say such things in times like these.'"},{"zh":"『好了好了。』他拍拍你的肩，『你我之间，不必如此。』","en":"'All right, all right.' He pats your shoulder. 'There's no need for that between us.'"},{"zh":"刘备没有再笑，只是认真看着你：『子衡，有些话说多了，就轻了。』","en":"Liu Bei stops smiling and looks at you seriously. 'Ziheng, some words grow light if you say them too often.'"}],"insult":[{"zh":"刘备的笑容收了起来：『先生累了，回去歇着吧。』","en":"Liu Bei's smile fades. 'You're tired, sir. Go and rest.'"},{"zh":"『备寄人篱下多年，这样的话听得多了。』他语气平静，你却觉得比骂人还难受。","en":"'I've lived under other men's roofs for years. I've heard worse.' His calm is harder to bear than anger."}],"praise":[{"zh":"『先生谬赞。备不过是不肯认命罢了。』","en":"'You praise me too much. I simply refuse to accept my fate.'"},{"zh":"刘备摆摆手，耳根却有些红。","en":"Liu Bei waves it off, though the tips of his ears redden."}],"ask":[{"zh":"刘备沉吟片刻：『这件事，我还没想好。先生怎么看？』","en":"Liu Bei considers. 'I haven't decided. What do you think?'"},{"zh":"『问得好。』他笑了，『可我答不上来。』","en":"'A good question.' He smiles. 'But I can't answer it.'"}],"small":[{"zh":"刘备望着城下的灯火，嗯了一声。","en":"Liu Bei gazes at the lights below and murmurs agreement."},{"zh":"『难得有这样安静的夜。』他说。","en":"'It's rare to have a night this quiet,' he says."},{"zh":"他给你倒了一杯酒，什么也没说。","en":"He pours you a cup of wine and says nothing."}],"threat":[{"zh":"刘备的手停在杯上：『先生……这是醉话，还是真话？』","en":"Liu Bei's hand stops on his cup. 'Sir... is that the wine talking, or you?'"},{"zh":"他没有发火，只是叫来了张飞。张飞站在门口，没有进来。","en":"He doesn't lose his temper. He just calls for Zhang Fei, who stands in the doorway and doesn't come in."}],"nonsense":[{"zh":"刘备笑了笑，没有接话。","en":"Liu Bei smiles and lets it go."},{"zh":"『先生今夜，话有些多。』","en":"'You're talkative tonight, sir.'"}]},"openers":{"warm":{"zh":"刘备笑着招手：『子衡，来，陪我看看这夜色。』","en":"Liu Bei beckons with a smile. 'Ziheng, come—keep me company.'"},"cold":{"zh":"刘备听见脚步声，没有回头：『是子衡啊。』","en":"Liu Bei hears your footsteps and doesn't turn. 'Ah, Ziheng.'"},"neutral":{"zh":"刘备往旁边让了让，给你留出一个位子。","en":"Liu Bei moves over to make room for you."}}},"caocao":{"name":{"zh":"曹操","en":"Cao Cao"},"dims":{"warmth":[0,0,10],"trust":[1,0,10],"esteem":[0,0,10]},"main":"esteem","lens":{"esteem":{"zh":"赏识","en":"Regard"}},"persona":{"zh":"曹操：丞相，雄才大略，多疑而爱才，好诗酒；说话直接、带笑、时而锋利，会反问。称玩家“子衡”。","en":"Cao Cao: the Chancellor, brilliant, suspicious yet fond of talent, loves poetry and wine; direct, amused, sometimes cutting, likes to answer with questions. Calls the player Ziheng."},"romance":false,"values":{"zhi":["esteem",1],"yong":["esteem",1],"yi":["esteem",1],"ren":["esteem",-1]},"heat":{"rude":[1],"threat":[2],"nonsense":[0,1],"romantic":[0,1],"line":2},"react":{"love":[{"zh":"曹操大笑，笑得酒都洒了：『好！孤喜欢直爽的人。可惜孤不缺这样说话的人，缺的是会打仗的人。』","en":"Cao Cao roars with laughter and spills his wine. 'Good! I like plain speaking. But I've no shortage of people saying that. What I'm short of is people who can win battles.'"},{"zh":"『又来了。』曹操眯起眼，『你想要什么，直说。』","en":"'Again?' Cao narrows his eyes. 'Whatever you want, say it plainly.'"},{"zh":"曹操不笑了：『同一句话说三遍，要么是傻，要么是有所图。你是哪一种？』","en":"Cao stops laughing. 'Say the same thing three times and you're either a fool or after something. Which are you?'"}],"insult":[{"zh":"曹操的手按在剑上，停了一停，又松开：『有胆。孤记住你了。』","en":"Cao's hand goes to his sword, pauses, and lets go. 'You've got nerve. I'll remember you.'"},{"zh":"『拖出去——』他说了半句，又笑起来，『罢了，今夜不杀人。』","en":"'Take him out—' he begins, then laughs. 'Never mind. No killing tonight.'"}],"praise":[{"zh":"『这话孤听得多了。』曹操摆手，却又给你斟满了酒。","en":"'I've heard that plenty.' Cao waves it off, yet refills your cup."},{"zh":"『夸孤的人，多半有事相求。』他斜看你一眼。","en":"'Those who praise me usually want something.' He eyes you sideways."}],"ask":[{"zh":"曹操反问：『你猜？』","en":"Cao answers with a question. 'What do you think?'"},{"zh":"『这天下的事，孤也有不知道的。』他难得说了句实话。","en":"'Even I don't know everything under heaven,' he says—an unusually honest admission."}],"small":[{"zh":"曹操嗯了一声，又喝了一口酒。","en":"Cao grunts and drinks again."},{"zh":"『月明星稀……』他低声念了半句，没有念完。","en":"'The moon is bright, the stars are few…' he murmurs, and doesn't finish."},{"zh":"他望着廊外，好一会儿没说话。","en":"He looks out past the veranda and says nothing for a while."}],"threat":[{"zh":"曹操大笑，笑完了脸色一沉：『孤这里，说这种话的人，坟头的草都高了。』","en":"Cao roars with laughter, then his face darkens. 'The grass is tall on the graves of men who talked like that to me.'"},{"zh":"他什么也没说，只是记下了。你知道他记下了。","en":"He says nothing—only makes a note. You know he's made a note."}],"nonsense":[{"zh":"『有趣。』曹操眯起眼，『你是装疯，还是真疯？』","en":"'Interesting.' Cao narrows his eyes. 'Are you feigning madness, or truly mad?'"},{"zh":"曹操挥挥手，像赶走一只苍蝇。","en":"Cao waves a hand, as if shooing a fly."}]},"openers":{"warm":{"zh":"曹操举杯：『来，今夜不谈公事。』","en":"Cao Cao raises his cup. 'Come—no business tonight.'"},"cold":{"zh":"曹操眯着眼看你：『你来做什么？』","en":"Cao Cao squints at you. 'What do you want?'"},"neutral":{"zh":"曹操指了指对面的席位。","en":"Cao Cao points to the seat across from him."}}},"guanyu":{"name":{"zh":"关羽","en":"Guan Yu"},"dims":{"warmth":[1,0,10],"trust":[2,0,10],"esteem":[1,0,10]},"main":"esteem","lens":{"esteem":{"zh":"敬重","en":"Respect"}},"persona":{"zh":"关羽：寡言、重义、读《春秋》，对刘备忠诚到底，对外人戒备；句子短，语气庄重，不说笑。称玩家“子衡”。","en":"Guan Yu: taciturn, honor-bound, reads the Spring and Autumn Annals, utterly loyal to Liu Bei and guarded with others; short sentences, grave tone, no jokes. Calls the player Ziheng."},"romance":false,"values":{"yi":["esteem",1],"yong":["esteem",1],"li":["esteem",-1],"cheng":["trust",1]},"heat":{"rude":[1],"threat":[2],"nonsense":[0,1],"romantic":[0,1],"line":3},"react":{"love":[{"zh":"关羽手里的布停住了。他看了你很久，才说：『子衡，这话……兄弟之间，不必说出口。』","en":"Guan Yu's cloth stops on the blade. He looks at you a long time. 'Ziheng... between brothers, such things needn't be said.'"},{"zh":"『你喝多了。』他把酒囊从你手边拿开，语气却不重。","en":"'You've had too much to drink.' He moves the wine skin away from your hand, but not unkindly."},{"zh":"关羽站起身：『夜深了。明日还要赶路。』他走了几步，又回头：『你说的，我当作没听见。』","en":"Guan Yu rises. 'It's late. We march tomorrow.' A few steps on he turns back. 'I'll take it I didn't hear that.'"}],"insult":[{"zh":"关羽的眉头一沉：『再说一遍。』刀没有出鞘，但你听得见风声。","en":"Guan Yu's brows drop. 'Say that again.' The blade stays sheathed, but you can hear the wind."},{"zh":"『大哥收留的人，我不与你计较。』他背过身去，不再看你。","en":"'You're my brother's guest, so I'll let it pass.' He turns his back and stops looking at you."}],"praise":[{"zh":"『过誉了。』他嘴上这么说，捋须的手却慢了下来。","en":"'You flatter me.' But the hand stroking his beard slows."},{"zh":"『夸人的话，说一遍就够了。』他难得笑了一下。","en":"'Praise is worth saying once.' For once he almost smiles."}],"ask":[{"zh":"关羽想了想：『这个，你该去问大哥。』","en":"Guan Yu thinks. 'That's a question for my brother.'"},{"zh":"『我只知道一件事：跟着大哥，不会错。』","en":"'I know one thing: following my brother is never wrong.'"}],"small":[{"zh":"关羽嗯了一声，继续擦刀。","en":"Guan Yu grunts and goes on cleaning the blade."},{"zh":"『明日要赶早路，你也早些歇着。』","en":"'We start early tomorrow. Get some rest.'"},{"zh":"火光照着他半边脸。他没有接话，却也没有赶你走。","en":"The firelight catches half his face. He doesn't answer, but he doesn't send you away either."}],"threat":[{"zh":"刀出鞘半寸，又推了回去。『这话，换个人说，已经死了。』","en":"The blade slides an inch out of its sheath and back. 'Anyone else who said that would be dead.'"},{"zh":"关羽站起身，一句话也没说，走了。","en":"Guan Yu stands and walks away without a word."}],"nonsense":[{"zh":"关羽皱眉看着你，像在看一个说梦话的人。","en":"Guan Yu frowns at you, as if at a man talking in his sleep."},{"zh":"『你若累了，就去睡。』","en":"'If you're tired, go to sleep.'"}]},"openers":{"warm":{"zh":"关羽把酒囊推到你面前：『坐。』","en":"Guan Yu pushes the wine skin toward you. 'Sit.'"},"cold":{"zh":"关羽看见你来，手里的刀没有放下。","en":"Guan Yu sees you coming and doesn't put down his blade."},"neutral":{"zh":"关羽抬头看了你一眼，又低下头去。","en":"Guan Yu glances up at you, then down again."}}},"zhuge":{"name":{"zh":"诸葛亮","en":"Zhuge Liang"},"dims":{"warmth":[1,0,10],"trust":[5,0,10],"esteem":[0,0,10]},"main":"esteem","lens":{"esteem":{"zh":"敬重","en":"Respect"}},"persona":{"zh":"诸葛亮：二十八九岁，刘备的军师，赤壁之后声望日隆；从容、机敏、谦和而难以看透，喜欢用反问试探人。称玩家“子衡兄”。","en":"Zhuge Liang: late twenties, Liu Bei's strategist, his reputation rising since Red Cliffs; composed, quick, courteous and hard to read; tests people with questions. Calls the player Ziheng."},"romance":false,"values":{"zhi":["esteem",1],"cheng":["trust",1],"ren":["warmth",1],"li":["trust",-1]},"heat":{"rude":[1],"threat":[1],"nonsense":[0,0,1],"line":4},"react":{"love":[{"zh":"诸葛亮的扇子停在半空：『子衡兄……亮已有家室。』他说得很认真，眼里却有一点笑意。","en":"Zhuge Liang's fan stops mid-air. 'Ziheng... I am a married man.' He says it gravely, but his eyes are amused."},{"zh":"『这一句，亮就当是夸我的计策了。』他轻轻摇扇。","en":"'I'll take that as praise for my strategy.' He fans himself lightly."},{"zh":"诸葛亮叹了口气：『你若再说，亮只好告诉黄夫人了。』","en":"Zhuge Liang sighs. 'Say it again and I shall have to tell my wife.'"}],"insult":[{"zh":"诸葛亮并不恼：『子衡兄说得对，亮确实年轻。』这句话比反驳更让你脸红。","en":"Zhuge Liang isn't offended. 'You're right, I am young.' It makes you blush more than any rebuttal could."},{"zh":"他看了你一眼，把灯拨亮了些：『心里有气，就说出来。说完了，我们再谈正事。』","en":"He glances at you and turns up the lamp. 'If you're angry, say so. Then we can talk business.'"}],"praise":[{"zh":"『过奖。』他笑，『亮只是比别人多想了一步。』","en":"'You're too kind.' He smiles. 'I only think one step further than others.'"},{"zh":"诸葛亮摇扇不语，像是在掂量这句话里有几分真。","en":"Zhuge Liang fans himself in silence, as if weighing how much of that you meant."}],"ask":[{"zh":"『子衡兄以为呢？』他把问题又推了回来。","en":"'And what do you think?' He hands the question straight back."},{"zh":"诸葛亮笑了：『这个问题，三年后再问我。』","en":"Zhuge Liang smiles. 'Ask me that again in three years.'"}],"small":[{"zh":"诸葛亮点点头，在灯下翻了一页书。","en":"Zhuge Liang nods and turns a page by the lamp."},{"zh":"『夜里风凉。』他把窗关上了一半。","en":"'The night air is cold.' He half closes the window."},{"zh":"他嗯了一声，像是在听，又像是在想别的事。","en":"He hums, as if listening—or thinking of something else."}],"threat":[{"zh":"诸葛亮的扇子没有停：『子衡兄若真要动手，亮这把扇子，挡不住。』他看着你，一点也不怕。","en":"Zhuge Liang's fan doesn't pause. 'If you truly mean to strike, this fan won't stop you.' He looks at you, not the least afraid."},{"zh":"『这话，亮当没听见。主公那里，亮也不会说。』","en":"'I'll take it I didn't hear that. Nor will I tell our lord.'"}],"nonsense":[{"zh":"诸葛亮认真想了想：『这是谜语？』","en":"Zhuge Liang considers it seriously. 'Is this a riddle?'"},{"zh":"他低头记了一笔。你不知道他记了什么。","en":"He jots something down. You don't know what."}]},"openers":{"warm":{"zh":"诸葛亮早就备好了两盏茶：『亮猜你今夜会来。』","en":"Zhuge Liang has already poured two cups of tea. 'I guessed you'd come tonight.'"},"cold":{"zh":"诸葛亮合上书：『子衡兄有事？』","en":"Zhuge Liang closes his book. 'Something you need, Ziheng?'"},"neutral":{"zh":"诸葛亮抬起头，扇子停了一停。","en":"Zhuge Liang looks up; his fan pauses."}}},"wenzhi":{"name":{"zh":"温芷","en":"Wen Zhi"},"dims":{"warmth":[3,0,10],"trust":[2,0,10],"esteem":[2,0,10],"intimacy":[1,0,10]},"original":true,"main":"intimacy","persona":{"zh":"温芷：原创人物，颍川医家之女，与玩家同乡，成年；冷静、务实、嘴上不饶人，心里很软；只关心病人，不问来人是哪一边的。称玩家“子衡”。","en":"Wen Zhi: an original character, a physician's daughter from the player's hometown, an adult; calm, practical, sharp-tongued and soft-hearted; cares about patients, not sides. Calls the player Ziheng."},"romance":true,"values":{"ren":["warmth",1],"cheng":["trust",1],"li":["trust",-1]},"heat":{"rude":[1],"threat":[2],"line":3},"react":{"love":[{"zh":"温芷手里的药杵停了。她没有回头，耳朵却红了：『……你知道自己在说什么吗？』","en":"Wen Zhi's pestle stops. She doesn't turn, but her ears go red. '...Do you know what you're saying?'"},{"zh":"『说一遍就够了。』她小声说，『说多了，我会当真的。』","en":"'Once is enough,' she says quietly. 'Say it more and I'll believe you.'"},{"zh":"她终于转过身，把药杵塞进你手里：『那就帮我把药捣完。说话不如做事。』","en":"She finally turns and puts the pestle in your hand. 'Then help me finish grinding these. Actions over words.'"}],"insult":[{"zh":"温芷看了你一眼：『你今天心里不痛快。说吧，哪里疼？』","en":"Wen Zhi looks at you. 'Something's eating you today. Tell me—where does it hurt?'"},{"zh":"『这话我不爱听。』她收起药箱，『等你清醒了再来。』","en":"'I don't like hearing that.' She packs up her chest. 'Come back when you've come to your senses.'"}],"praise":[{"zh":"『少来。』她嘴上这么说，嘴角却弯了。","en":"'Oh, stop.' But the corner of her mouth curves up."},{"zh":"『医者的手，夸不得。一夸就抖。』她笑着说。","en":"'Never praise a physician's hands—they'll start to shake,' she says, laughing."}],"ask":[{"zh":"温芷想了想：『你问这个做什么？』她还是认真答了。","en":"Wen Zhi thinks. 'Why do you ask?' But she answers seriously anyway."},{"zh":"『我也不知道。』她说，『不过你问了，我会想一想。』","en":"'I don't know,' she says. 'But since you asked, I'll think about it.'"}],"small":[{"zh":"温芷嗯了一声，手里的活没停。","en":"Wen Zhi hums, her ha
