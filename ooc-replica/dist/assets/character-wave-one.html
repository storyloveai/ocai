<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新的相遇 · StoryDate</title>
<meta name="robots" content="noindex"><style>
*{box-sizing:border-box}body{margin:0;background:#111110;color:#fafafa;font:15px/1.75 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}header{max-width:1240px;margin:auto;padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}header img{width:176px;display:block}.languages{display:flex;border:1px solid #ffffff24;border-radius:8px;overflow:hidden}button{font:inherit;color:#a7a49e;background:transparent;border:0;padding:6px 13px;cursor:pointer}button[aria-pressed=true]{background:#34332f;color:#fafafa}main{max-width:1240px;margin:auto;padding:30px 28px 80px}.lead{max-width:700px;margin-bottom:36px}.eyebrow{color:#bd955a;font-size:12px;letter-spacing:.08em}h1{font-size:clamp(30px,5vw,44px);line-height:1.3;letter-spacing:-.035em;margin:10px 0 16px}.lead>p:last-child{color:#aaa69f}nav a{display:inline-flex;align-items:center;min-height:44px;color:#c6c0b4;font-size:13px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:30px 20px}.person{display:flex;min-width:0;flex-direction:column}.portrait{display:block;aspect-ratio:3/4;overflow:hidden;background:#23231f;border-radius:12px}.portrait img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}.portrait:hover img{transform:scale(1.025)}.name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:13px 0 4px}h2{margin:0;font-size:19px;line-height:1.4;font-weight:600}.age{font-size:11px;color:#928d84}.tags{color:#bd955a;font-size:11px;margin:5px 0 8px}.description{font-size:12px;color:#b3afa7;line-height:1.8;margin:0 0 15px;flex:1}.enter{display:flex;justify-content:space-between;align-items:center;min-height:44px;border-top:1px solid #ffffff19;font-size:12px}.enter span{color:#bd955a}a:focus-visible,button:focus-visible{outline:2px solid #bd955a;outline-offset:4px}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){header{padding:18px}header img{width:145px}main{padding:16px 18px 60px}.lead{margin-bottom:26px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}h2{font-size:17px}.description{font-size:12px}.languages button{padding:5px 9px}}@media(prefers-reduced-motion:reduce){.portrait img{transition:none}}
</style></head><body><header><a href="/character" aria-label="StoryDate"><img src="/assets/logo-lab/dialogue-two-tone-logo.svg" alt="StoryDate"></a><div class="languages" aria-label="Language"><button data-lang="en">EN</button><button data-lang="zh">中文</button></div></header><main id="content"></main>
<script type="module">
import{waveOneCharacters as people}from './character-wave-one.js';
import{escapeHTML as safe}from './stream.js';
let lang=localStorage.getItem('sd.lang')||(navigator.language.startsWith('zh')?'zh':'en');
function draw(){const zh=lang==='zh';document.documentElement.lang=lang;document.title=(zh?'新的相遇':'New encounters')+' · StoryDate';document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.querySelector('#content').innerHTML=`<nav><a href="/character">‹ ${zh?'返回角色书架':'Back to characters'}</a></nav><div class="lead"><p class="eyebrow">STORYDATE ORIGINALS</p><h1>${zh?'这一次，想先遇见谁？':'Who would you meet first?'}</h1><p>${zh?'十位新人物，二十种相遇。从一句针锋相对，到一段愿意慢慢说完的话。':'Ten new characters. Twenty ways to meet. From a sharp disagreement to a conversation worth taking your time with.'}</p></div><div class="grid">${people.map(c=>`<article class="person"><a class="portrait" href="/character/${safe(c.id)}"><img src="${safe(c.image)}" alt="${safe(zh?c.title_zh:c.title)}" loading="lazy" width="300" height="400"></a><div class="name"><h2><a href="/character/${safe(c.id)}">${safe(zh?c.title_zh:c.title)}</a></h2><span class="age">${c.apparentAge?(zh?'成年狐族':'Adult fox spirit'):(zh?c.age+' 岁':'Age '+c.age)}</span></div><p class="tags">${c.tags[lang].map(safe).join(' · ')}</p><p class="description">${safe(zh?c.description_zh:c.description)}</p><a class="enter" href="/character/${safe(c.id)}">${zh?'选择一场相遇':'Choose an encounter'}<span aria-hidden="true">↗</span></a></article>`).join('')}</div>`;}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('sd.lang',lang);draw();});draw();
</script></body></html>
