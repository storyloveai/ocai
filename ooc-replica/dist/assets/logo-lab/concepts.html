 *{box-sizing:border-box}html{color-scheme:dark;background:#171717;color:#e4d9bf;font-family:Inter,"PingFang SC",system-ui,sans-serif}body{margin:0}a{color:inherit;text-decoration:none}header,main,footer{max-width:1440px;margin:auto;padding:24px 5%}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff15;gap:20px}.wordmark{font:26px Georgia,serif;color:#c5a46c}nav{display:flex;gap:20px;font-size:13px;color:#b9ad94}.intro{margin:32px 0}.eyebrow{color:#b88d4a;font-size:12px;letter-spacing:2px}h1{font:clamp(28px,4vw,44px) Georgia,"Songti SC",serif;margin:16px 0}.intro p:last-child{color:#a89d88;font-size:14px;line-height:1.9}.intro a{color:#d0ad70;text-decoration:underline;text-underline-offset:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0;border:1px solid #ffffff16;border-radius:12px;overflow:hidden;background:#131313}.art{display:block;position:relative;aspect-ratio:3/2;overflow:hidden}.art img{position:absolute;display:block;width:200%;max-width:none;height:200%}.art.two img{left:-100%}.art.three img{top:-100%}.art.four img{left:-100%;top:-100%}figcaption{padding:18px 22px 22px;border-top:1px solid #ffffff10}h2{font-size:18px;font-weight:500;margin:0 0 8px}.number{color:#bb9555;margin-right:10px}figcaption p{color:#a89d88;font-size:13px;line-height:1.8;margin:0}.footnote{color:#8b816e;font-size:12px;line-height:1.9;margin-top:28px}footer{border-top:1px solid #ffffff12;color:#746b59;font-size:12px;margin-top:20px;padding-bottom:32px}a:focus-visible{outline:2px solid #c5a46c;outline-offset:4px}@media(max-width:700px){header{align-items:start}nav{gap:12px;font-size:12px;flex-wrap:wrap;justify-content:flex-end}.grid{grid-template-columns:1fr;gap:18px}.intro{margin:24px 0}.intro p:last-child{font-size:13px}figcaption{padding:16px 18px}}
 </style>

<body>
 <header><a href="/" class="wordmark">StoryDate</a><nav><a href="/assets/logo-lab/index.html">配色对比</a><a href="/">返回网站 ↗</a></nav></header>
 <main>
  <section class="intro"><p class="eyebrow">LOGO EXPLORATIONS / 02</p><h1>四套新的 Logo 设计</h1><p>每套包含完整字标、小图标和配色。点击任意方案可打开高清原图放大查看。<br><a href="/assets/logo-lab/concepts-board.png" target="_blank" rel="noopener">直接打开四方案高清总览 ↗</a></p></section>
  <section class="grid" aria-label="四套 Logo 设计">
   <figure><a class="art one" href="/assets/logo-lab/concepts-board.png" target="_blank" rel="noopener" aria-label="打开高清原图：01 书中之门"><img src="/assets/logo-lab/concepts-board.png" alt="书中之门：打开的书页中嵌入金色入口，搭配金色与暖白 StoryDate 字标" width="1536" height="1024"></a><figcaption><h2><span class="number">01</span>书中之门</h2><p>延续书本与入口的意象，用更清楚的门洞和书页曲线传达“走进故事”。</p></figcaption></figure>
   <figure><a class="art two" href="/assets/logo-lab/concepts-board.png" target="_blank" rel="noopener" aria-label="打开高清原图：02 对话之书"><img src="/assets/logo-lab/concepts-board.png" alt="对话之书：金色和暖白的书页结合对话符号，搭配 StoryDate 字标" width="1536" height="1024"></a><figcaption><h2><span class="number">02</span>对话之书</h2><p>让书页与对话符号融在一起，呼应互动故事和角色聊天。</p></figcaption></figure>
   <figure><a class="art three" href="/assets/logo-lab/concepts-board.png" target="_blank" rel="noopener" aria-label="打开高清原图：03 SD 字母印记"><img src="/assets/logo-lab/concepts-board.png" alt="SD 字母印记：金色 S 与 D 交织成紧凑标志，搭配暖白 StoryDate 字标" width="1536" height="1024"></a><figcaption><h2><span class="number">03</span>SD 字母印记</h2><p>将 S 与 D 组合成独立的品牌印记，强调头像和应用图标的辨识度。</p></figcaption></figure>
   <figure><a class="art four" href="/assets/logo-lab/concepts-board.png" target="_blank" rel="noopener" aria-label="打开高清原图：04 翻页 D"><img src="/assets/logo-lab/concepts-board.png" alt="翻页 D：金色 D 字母中融入暖白翻页曲线，搭配 StoryDate 字标" width="1536" height="1024"></a><figcaption><h2><span class="number">04</span>翻页 D</h2><p>把翻起的书页融入 D 的轮廓，表达翻开新篇章的感觉。</p></figcaption></figure>
  </section>
  <p class="footnote">这是图形设计探索页。网站当前采用的仍是已选定的 D「原金暖白」版本。</p>
 </main>
 <footer>StoryDate · Logo 设计探索</footer>
