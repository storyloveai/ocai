<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>接着上次聊 · StoryDate</title><style>
*{box-sizing:border-box}body{margin:0;background:#111110;color:#fafafa;font:15px/1.8 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}header{max-width:1180px;margin:auto;padding:24px;display:flex;justify-content:space-between;align-items:center}header img{width:172px;display:block}.langs{display:flex;border:1px solid #ffffff20;border-radius:8px;overflow:hidden}.langs button{border:0;background:transparent;color:#aaa69e;padding:7px 13px;min-height:40px;cursor:pointer}.langs [aria-pressed=true]{background:#34332f;color:#fafafa}main{max-width:1180px;padding:20px 24px 80px;margin:auto}h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;margin:12px 0 18px;line-height:1.35}.lead{max-width:750px;color:#aaa69e;margin-bottom:32px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{min-width:0;overflow:hidden;background:#1b1b18;border:1px solid #ffffff0d;border-radius:12px}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 27%;display:block}.text{padding:20px}h2{font-size:22px;font-weight:550;margin:0 0 10px}.text>p{font-size:13px;color:#b3ada1;min-height:70px}.text blockquote{margin:18px 0;color:#d8bd91;font-size:14px}.chat{display:flex;justify-content:space-between;align-items:center;min-height:44px;border-top:1px solid #ffffff12;margin-top:20px;padding-top:12px;font-size:13px}.more{display:block;min-height:36px;padding-top:12px;color:#928a7b;font-size:12px}.note{font-size:13px;color:#a49d90;margin:32px 0}.back{color:#b7aa92;font-size:13px;display:inline-flex;align-items:center;min-height:44px}a:focus-visible,button:focus-visible{outline:2px solid #bd955a;outline-offset:4px}@media(max-width:700px){header{padding:18px}header img{width:145px}main{padding:14px 18px 64px}.grid{grid-template-columns:1fr;gap:20px}.card img{aspect-ratio:4/3;object-position:center 24%}.text>p{min-height:0}}
</style></head><body><header><a href="/character"><img src="/assets/logo-lab/dialogue-two-tone-logo.svg" alt="StoryDate"></a><div class="langs" aria-label="Language"><button data-lang="en">EN</button><button data-lang="zh">中文</button></div></header><main id="content"></main><script type="module">
import{originalCharacters}from './original-characters.js';import{escapeHTML as safe}from './stream.js';
const ids=['oc-gu-chengye','oc-song-zhixia','oc-yan-fei'];const phrases={zh:['今晚先不谈工作。','我不买花，只想坐一会儿。','我不签契约。'],en:["I don't want to work tonight.","I don't want to buy flowers. I'd just like to sit here.",'No pact tonight.']};
let lang=localStorage.getItem('sd.lang')||(navigator.language.startsWith('zh')?'zh':'en');if(!['zh','en'].includes(lang))lang='zh';
function draw(){const zh=lang==='zh';document.documentElement.lang=lang;document.title=(zh?'接着上次聊':'Pick up where we left off')+' · StoryDate';document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.querySelector('#content').innerHTML=`<a class="back" href="/character">‹ ${zh?'返回角色书架':'Back to characters'}</a><h1>${zh?'让这句话，留到下次。':'Let this conversation carry on.'}</h1><p class="lead">${zh?'先聊一轮，再离开页面、回来，点“接着上次聊”。角色会接上当前走向里的原话与选择。你也可以直接输入新的话题。':'Have an exchange, leave the page and return. Choose “Pick up where we left off” to continue with your own words and choices in this branch. You can also type something new.'}</p><div class="grid">${ids.map((id,i)=>{const c=originalCharacters.find(c=>c.id===id);return `<article class="card"><a href="/play/${c.id}?encounter=${c.defaultScene}"><img src="${c.image}" alt="${safe(zh?c.title_zh:c.title)}"></a><div class="text"><h2>${safe(zh?c.title_zh:c.title)}</h2><p>${safe(zh?c.description_zh:c.description)}</p><blockquote>${safe(phrases[lang][i])}</blockquote><a class="chat" href="/play/${c.id}?encounter=${c.defaultScene}">${zh?'从这场相遇开始':'Open this encounter'}<span>↗</span></a><a class="more" href="/character/${c.id}">${zh?'看人物与其他相遇':'Character and other encounters'}</a></div></article>`;}).join('')}</div><p class="note">${zh?'对话里的“查看原话”能回到选择的出处。同一人物的其他相遇与另开的走向各自保留记录。':'“View your words” beside a reply returns to the source. Other encounters and branches keep their own separate history.'}</p>`;}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('sd.lang',lang);draw();});draw();
</script></body></html>
