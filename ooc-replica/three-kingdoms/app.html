async function initRuntime() {

/* 记录里只存“文本键”，渲染时按当前语言取文字，切换语言后整段记录一起换 */

  const m = new Map(), put = (t, k) => { if (t && !m.has(t)) m.set(t, k); };
  put(pack.opening.text, "open");
  pack.actions.forEach(a => { put(a.text_success, `a:${a.id}:ok`); put(a.text_denied, `a:${a.id}:no`); });
  (pack.events || []).forEach(e => put(e.text, `e:${e.id}`));
  pack.characters.forEach(c => { c.disclosures.forEach((d, i) => put(d.line, `d:${c.id}:${i}`)); c.topics.forEach(t => put(t.fallback, `f:${c.id}:${t.id}`)); });

}

  if (kind === "a") { const x = pack.actions.find(x => x.id === a); return x && (b === "ok" ? x.text_success : x.text_denied); }

}
/* 旧版存档（只有文字）转成文本键：在两种语言里反查 */
function migrateLog(pack, log) {
  const id = pack.pack_id, idx = [idxOf("en", id), idxOf("zh", id)];
  const labelMap = new Map();
  ["en", "zh"].forEach(lg => { const p = packOf(id, lg);
    p.actions.forEach(a => labelMap.set(a.label, { kind: "action", intent: { kind: "action", action: a.id } }));
    p.characters.forEach(c => c.topics.forEach(t => labelMap.set(UI[lg].ask(c.short_name || c.name, t.label), { kind: "topic", intent: { kind: "talk", character: c.id, topic: t.id } })));
    p.info.forEach(i => i.player_label && labelMap.set("info:" + i.player_label, i.id)); });
  return log.map(e => {
    if (e.k || e.t === "fx" || e.t === "gen" || e.t === "lets") return e;
    if (e.t === "narr" || e.t === "dia") { const k = idx[0].get(e.text) || idx[1].get(e.text); return k ? { t: "fx", k, role: e.t, speaker: e.speaker || null } : e; }

/* ---------------- understand ---------------- */
function understandInput(pack, s, text) {
  const info = Object.fromEntries(pack.info.map(i => [i.id, i]));
  const out = {
    player_role: pack.player.display_name,
    location: pack.locations.find(l => l.id === s.location).name,

    actions: pack.actions.map(a => ({ id: a.id, label: a.label, examples: a.examples })),
    player_knows: s.known.map(k => ({ id: k, summary: info[k].player_label || info[k].text })),

  if (d) out.accusation = { suspects: d.suspects.map(id => ({ id, name: pack.characters.find(c => c.id === id).name })), evidence_ids_player_knows: s.known.filter(k => ["clue", "secret", "claim"].includes(info[k].kind)) };

const KINDS = ["talk", "action", "accuse", "clarify", "unsupported", "contradiction", "unclear", "meta"];
const intentOk = x => x && typeof x === "object" && !Array.isArray(x) && KINDS.includes(x.kind);

const ZSTOP = new Set("你的 我的 一下 什么 怎么 这个 那个 我们 你们 他们 是不 不是 可以 现在 就是 还是 一个 吗？".split(" "));
function tokens(t) {
  const latin = (t.toLowerCase().match(/[a-z']+/g) || []).map(w => w.replace(/'s$/, "").replace(/s$/, "")).filter(w => w.length > 1 && !STOP.has(w));
  const runs = t.match(/[\u4e00-\u9fff]+/g) || [], big = [];
  runs.forEach(r => { if (r.length === 1) big.push(r); for (let i = 0; i + 1 < r.length; i++) big.push(r.slice(i, i + 2)); });

}

  const tk = tokens(text); let best = { score: 0, intent: { kind: "unclear" } };
  const consider = (phrases, intent) => phrases.forEach(p => { const sc = overlap(tk, tokens(p)); if (sc > best.score) best = { score: sc, intent }; });
  const both = ["en", "zh"].map(lg => packOf(pack.pack_id, lg)); // 中英文输入都能匹配（两种语言 id 相同）
  both.forEach(pk => pk.actions.forEach(a => consider([a.label, ...a.examples], { kind: "action", action: a.id })));
  const chars = pack.characters.filter(c => present(pack, c, s));
  both.forEach(pk => pk.characters.filter(c => chars.some(x => x.id === c.id)).forEach(c => c.topics.forEach(t => consider([t.label, ...t.examples], { kind: "talk", character: c.id, topic: t.id }))));
  if (best.score >= 0.34) return best.intent;

  if (named) return { kind: "talk", character: named.id, topic: null };

}

async function understand(text, meta) {
  const pack = G.pack;
  const normalize=s=>s.toLowerCase().replace(/[\s，。！？、,.!?“”「」]/g,"");
  const exact=pack.actions.find(a=>[a.label,...a.examples].some(p=>normalize(p)===normalize(text)));
  if(exact){meta.understand_source="exact";return {kind:"action",action:exact.id};}

  if (!RT.sample || RT.ai === "off") { meta.understand_source = "matcher"; return matchIntent(pack, G.save, text); }
  const input = [{ role: "user", content: PROMPTS.understand + "\n\nThe player may write in English or Chinese; map either to the same ids.\n\nThe input JSON follows. Reply with only the intent JSON object.\n\n" + JSON.stringify(understandInput(pack, G.save, text)) }];
  const t0 = performance.now();
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const out = await RT.sample.json(input, { modelTier: "quick", cache: false, phase:"understand", context:understandInput(pack,G.save,text) });
      meta.latency_ms_understand = Math.round(performance.now() - t0);
      if (intentOk(out)) { RT.ai="ready";RT.aiNote="";meta.understand_source = "model"; return out; }
      meta.understand_retries = attempt + 1;
    } catch (e) {
      meta.latency_ms_understand = Math.round(performance.now() - t0);
      const code = e && e.code;
      meta.understand_error = code || "error";
      if (code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed") { RT.ai = "off"; RT.aiNote = "declined"; break; }
      if (code === "rate_limited") { RT.ai = "limited"; RT.aiNote = "limited"; break; }
      if (code === "invalid_json" && attempt === 0) { meta.understand_retries = 1; continue; }
      break;
    }
  }
  RT.aiNote="fallback";RT.ai="limited";
  meta.understand_source = "matcher";
  return matchIntent(pack, G.save, text);
}

/* ---------------- express ---------------- */
function expressPrompt() {
  if (settings.lang !== "zh") return PROMPTS.express;
  return PROMPTS.express.replace(/6\. English only\.[^\n]*/, "6. Write in Simplified Chinese only, in a plain, lightly classical style that echoes the novel Romance of the Three Kingdoms (半文半白, easy to read). 1 to 4 blocks. 220 Chinese characters or fewer in total.");
}
function sysText(key, pack, s, name) {

  return T[key].replace("{opts}", labs.join(T.sep) || T.none).replace("{name}", name || "");
}
function suggestionsL(pack, s) {

  const choices=candidates?.length?candidates.map(a=>({id:a.id,kind:"action",label:a.label,intent:{kind:"action",action:a.id}})):SV.suggestions(pack,s);

}
function expressProblems(pack, saveAfter, out) {

  const P = [];
  const ids = new Set(pack.characters.filter(c => present(pack, c, saveAfter)).map(c => c.id));
  for (const b of out.blocks) {
    if (!b || !["narration", "dialogue"].includes(b.type) || typeof b.text !== "string" || !b.text.trim()) return ["schema: block"];
    if (b.type === "dialogue" && !ids.has(b.speaker)) P.push("speaker_not_present:" + b.speaker);
  }
  const text = out.blocks.map(b => b.text).join(" ");
  if (settings.lang === "zh") { const n = text.replace(/\s/g, "").length; if (n > 1000) P.push("too_long:" + n + "chars"); if (!/[\u4e00-\u9fff]/.test(text)) P.push("wrong_language"); }

async function express(r, saveAfter, playerInput, meta) {

  const input = [{ role: "user", content: expressPrompt() + "\n\nThe input JSON follows. Reply with only the JSON object.\n\n" + JSON.stringify(ctx) }];
  const t0 = performance.now(); meta.express_problems = [];

      const probs = expressProblems(G.pack, saveAfter, out);

    } catch (e) {

/* ---------------- routing: fixed vs generated (对话机制设计报告 · 路由规则) ---------------- */
function route(r, intent, mode) {
  if (!["ok", "denied", "ended"].includes(r.status)) return { gen: false, why: "system" };
  if (!RT.sample || RT.ai === "off") return { gen: false, why: "ai_off" };
  if (intent.kind === "talk" && !intent.topic) return { gen: true, why: "small_talk" };
  if (mode === "suggestion") return { gen: true, why: "immersive_choice" };
  if (mode === "typed") return { gen: true, why: "immersive_typed" };
  if (settings.textMode === "generated") return { gen: true, why: "mode_generated" };
  if (r.texts.length && r.texts.every(t => G.shownFixed.has(idxOf(settings.lang, G.pack.pack_id).get(t) || t))) return { gen: true, why: "repeat_variation" };
  return { gen: false, why: "typed_defined" };
}
function fixedEntries(pack, r, intent, before) {
  const sys = ["clarify", "unsupported", "contradiction", "unclear"].includes(r.status) || (r.status === "ended" && !r.outcome);
  if (intent.kind === "talk" && !intent.topic && r.status === "ok" && r.speaker) return [{ t: "lets", c: r.speaker }];
  if (sys) {
    const key = r.status === "ended" ? "ended" : r.status;
    if (key === "clarify") return [{ t: "sys", key, cand: (intent.candidates || []).filter(id => pack.actions.some(a => a.id === id)) }];
    return [{ t: "sys", key, opts: SV.suggestions(pack, before).map(x => ({ kind: x.kind, intent: x.intent })) }];
  }
  if (r.status === "denied" && intent.kind === "talk") {
    const c = pack.characters.find(x => x.id === intent.character);
    if (c && !present(pack, c, before)) return [{ t: "sys", key: "not_here", c: c.id }];
  }
  const idx = idxOf(settings.lang, pack.pack_id);
  return r.texts.map((t, i) => {
    const role = (i === 0 && r.speaker && /^["“]/.test(t)) ? "dia" : "narr";
    const k = idx.get(t);
    return k ? { t: "fx", k, role, speaker: role === "dia" ? r.speaker : null } : { t: role, text: t, speaker: role === "dia" ? r.speaker : null };
  });
}
/* 当前语言下，一条记录显示成什么 */
function entryBlocks(pack, e) {
  const T = L();
  if (e.t === "fx") { const text = keyText(pack, e.k); return text ? [{ type: e.role === "dia" ? "dialogue" : "narration", speaker: e.speaker, text }] : []; }
  if (e.t === "lets") return [{ type: "narration", text: T.lets(nameOf(pack, e.c)) }];
  if (e.t === "sys" && e.key) {
    if (e.key === "clarify") return [{ type: "system", text: T.sys.clarify.replace("{opts}", (e.cand || []).map(id => (pack.actions.find(a => a.id === id) || {}).label).filter(Boolean).join(T.sys.or) || T.sys.none) }];
    if (e.key === "not_here") return [{ type: "system", text: T.sys.not_here.replace("{name}", nameOf(pack, e.c)) }];
    const labs = (e.opts || []).map(o => sugLabel(pack, o)).filter(Boolean);
    return [{ type: "system", text: T.sys[e.key].replace("{opts}", labs.join(T.sys.sep) || T.sys.none) }];
  }
  if (e.t === "gen") return e.lang === settings.lang ? e.blocks : e.fb.flatMap(x => entryBlocks(pack, x));
  if (e.t === "sys") return [{ type: "system", text: e.text }];
  if (e.t === "narr" || e.t === "dia") return [{ type: e.t === "dia" ? "dialogue" : "narration", speaker: e.speaker, text: e.text }];
  return [];
}

async function submit({ text, suggestion }) {

  G.busy = true;

  G.liveValidated=null;
  const game=G, outputStart=($("#log")?.children.length||0)+1;
  const turnId = "t_" + rid();
  G.log.push({ t: "you", text: shownInput, mode, sug: suggestion ? { kind: suggestion.kind, intent: suggestion.intent } : null });
  const meta = { understand_retries: 0, express_retries: 0, express_problems: [], latency_ms_understand: null, latency_ms_express: null };

  const fixed = fixedEntries(pack, r, intent, before);

  else { fixed.forEach(e => G.log.push(e)); blocks = fixed.flatMap(e => entryBlocks(pack, e)); source = rt.gen ? "fallback" : (["clarify", "unsupported", "contradiction", "unclear"].includes(r.status) ? "system" : "fixed"); }
  r.texts.forEach(t => { const k = idxOf(settings.lang, pack.pack_id).get(t); G.shownFixed.add(k || t); });

  if (r.status === "ended" && r.outcome) {
    const o = pack.outcomes.find(x => x.id === r.outcome);
    G.ended = endingOf(pack, o.id, s2);
    const got = new Set(endingsFound(pack.pack_id)); got.add(o.id); store.set("endings." + pack.pack_id, [...got]);
    track("episode_ended", { save_id: G.save_id, pack_id: pack.pack_id, outcome_id: o.id, turns: s2.turn, typed_turns: G.counts.typed, suggestion_turns: G.counts.suggestion });
  }

function showLiveBlocks(blocks){

   const text=node.querySelector(".say")||node;
   if(text.dataset.target===b.text)return;text.dataset.target=b.text;
   if(text.dataset.painting)return;text.dataset.painting="true";
   const tick=()=>{if(!text.isConnected){return;}const goal=text.dataset.target||"",old=text.textContent||"";
     if(document.hidden||turnController?.signal.aborted||!goal.startsWith(old)){text.textContent=goal;delete text.dataset.painting;scrollLatest();return;}
     const remaining=Array.from(goal.slice(old.length));if(!remaining.length){delete text.dataset.painting;return;}
     const next=remaining.slice(0,Math.max(2,Math.ceil(remaining.length/7))).join("");text.append(document.createTextNode(next));scrollLatest();setTimeout(tick,16);
   };tick();

}

function scrollLatest(force=false){

async function revealTurn(start){

 for(let n=0;n<nodes.length;n++){
   const chars=segmenter?[...segmenter.segment(texts[n])].map(x=>x.segment):Array.from(texts[n]);const target=nodes[n].appendChild(document.createTextNode(''));let shown=0;const started=performance.now();
   await new Promise(resolve=>{const tick=()=>{

     const count=Math.min(chars.length,Math.floor((performance.now()-started)/8));

}

function dataView(ev) {

  const firstEnd = {}; by("episode_ended").sort((a, b) => a.ts - b.ts).forEach(e => { if (!firstEnd[e.player]) firstEnd[e.player] = e; });
  const active = Object.values(firstEnd).filter(e => e.typed_turns > e.suggestion_turns).length;
  const more = new Set(ev.filter(e => e.event === "next_episode_clicked" || e.event === "replay_clicked").map(e => e.player));

  const exits = by("episode_exit").map(e => e.pack_id + "@" + e.turn);

  return h("div", {},
    h("div", { class: "lbl" }, `玩家 ${P} 人 · 事件 ${ev.length} 条`),
    h("div", { class: "grid2" },
      stat(`${finished.size}/${P}`, "完成率（门槛 ≥6/10）", P ? finished.size / P >= .6 : undefined),
      stat(`${active}/${Object.keys(firstEnd).length}`, "主动表达：首局打字多于点选（门槛 ≥5/10）", Object.keys(firstEnd).length ? active / Object.keys(firstEnd).length >= .5 : undefined),

    h("div", { class: "grid2" },
      stat(pct(gen.filter(t => t.text_source === "fallback").length, gen.length), "兜底率（调用表达模型的轮次）"),
      stat(pct(typed.filter(t => t.intent_kind === "unclear").length, typed.length), "理解失败率（打字轮）"),
      stat(pct(turns.filter(t => t.status === "denied").length, turns.length), "拒绝率"),
      stat(pct(typed.filter(t => t.status === "unsupported").length, typed.length), "不支持率（打字轮）"),
      stat(String(turns.reduce((n, t) => n + (t.express_problems || []).filter(x => String(x).startsWith("leak:")).length, 0)), "泄露拦截次数"),
      stat(p90 === null ? "—" : p90 + " ms", "理解延迟 P90")),
    h("div", { class: "lbl", style: "margin-top:14px" }, "分段"),
    h("div", { class: "tablewrap" }, h("table", {}, h("tr", {}, h("th", {}, "段落"), h("th", {}, "开始人数"), h("th", {}, "完成人数"), h("th", {}, "结局分布")), perPack.map(r => h("tr", {}, r.map(c => h("td", {}, String(c))))))),
    h("div", { class: "lbl", style: "margin-top:14px" }, "流失位置（段落@回合）"), h("div", { class: "note" }, exits.join("  ") || "—"),
    h("div", { class: "lbl", style: "margin-top:14px" }, "玩家想做但做不了的事（最近 30 条，用来补行动）"),
    h("ul", {}, unsup.length ? unsup.map(t => h("li", {}, `${t.pack_id}: ${t.unsupported_text} → ${t.status}`)) : h("li", {}, "—")));
