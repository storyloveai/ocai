<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryDate 积分验收</title><link rel="stylesheet" href="/assets/credits.css"><style>body{margin:0;background:#141218;color:#eee;font:15px system-ui}main{display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:1160px;margin:24px auto;padding:16px}header{padding:18px 24px;background:#292331;border-bottom:1px solid #51435f}header strong{display:block;font-size:22px;margin-bottom:8px}.chat{padding:24px;border:1px solid #4c425a;border-radius:18px;align-self:start;background:#201b27}.chat h2{margin-top:0}.chat p{line-height:1.8}label{display:block;margin:20px 0 8px}textarea,select,button{font:inherit;color:inherit;background:#31283d;border:1px solid #665577;border-radius:10px;padding:12px;box-sizing:border-box}textarea{width:100%;resize:vertical}button{cursor:pointer}#send{background:#8b5cf6;margin-top:12px}#receipt{white-space:pre-wrap;line-height:1.7;color:#c9badb}#reply{padding:20px;background:#302637;border-radius:12px;margin:18px 0;min-height:60px}#error{color:#ffb4bd}#wallet .credits-page{min-height:0}#wallet .credits-content{padding:0}small{color:#baacc9}@media(max-width:700px){main{display:block;margin:0;padding:14px}.chat{margin-bottom:24px}header{padding:16px;font-size:13px}.credits-tabs{overflow:auto}}</style>
<header><strong>StoryDate · 积分消费与内测补贴</strong>本地验收 · 模拟账号/模型 · 无真实付款、无真实赠送、无模型支出</header><main><section class="chat"><h2>每条回复，价格先说明白</h2><p>普通回复 1 点，长回复 2 点。赠送先用，购买永久有效；失败或取消释放预留。</p><label for="length">回复长度</label><select id="length"><option value="standard">普通回复 · 1 点</option><option value="long">长回复 · 2 点</option></select><label for="draft">发给角色的话</label><textarea id="draft" rows="4">今天想和你聊一会儿。</textarea><button id="send">发送 · 1 点</button> <button id="fail">模拟生成失败</button> <button id="stop">取消</button><div id="reply" aria-live="polite">回复会显示在这里。</div><p id="error" role="alert"></p><div id="receipt" role="status"></div><small>右侧活动编号：beta-preview。当前账号可领 30 点，仅一次。可用积分不足时，输入内容会保留。</small></section><div id="wallet"></div></main><script type="module">
import {createPayments} from '/assets/payments.js';import {createCreditClient} from '/assets/credit-client.js';import {httpStream} from '/assets/stream.js';
const cfg=await(await fetch('/api/config')).json();const account={paymentConfig:cfg,user:{uid:'qa-alice',getIdToken:async()=>'qa-only'},async api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer qa-only'},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Object.assign(Error(data.error),{code:data.code});return data;}};
const payments=createPayments({account,show:html=>{const d=document.createElement('dialog');d.innerHTML=html+'<button>关闭</button>';document.body.append(d);d.querySelector('button').onclick=()=>d.remove();d.showModal();},notify:console.log});payments.sync();payments.mount(document.querySelector('#wallet'));
const credit=createCreditClient(account,{config:async()=>cfg});let controller,busy=false,messages=[];
const q=id=>document.getElementById(id);q('length').onchange=()=>q('send').textContent='发送 · '+(q('length').value==='long'?2:1)+' 点';
q('stop').onclick=()=>controller?.abort();q('fail').onclick=()=>send(true);q('send').onclick=()=>send(false);
async function send(fail){if(busy)return;const text=q('draft').value.trim();if(!text)return;busy=true;controller=new AbortController();q('error').textContent='';const context={titleId:'sgc-007',outputLength:q('length').value,...(fail?{qaFailure:true}:{})},next=[...messages,{role:'user',content:text}];let payment;
try{payment=await credit.prepare({...context,messages:next});if(controller.signal.aborted)return;q('receipt').textContent='已按报价提交，正在生成。';q('reply').textContent='';for await(const chunk of httpStream(next,controller.signal,context,()=>{},payment)){q('reply').textContent+=chunk;}messages=[...next,{role:'assistant',content:q('reply').textContent}];q('draft').value='';q('receipt').textContent='回复已完成，只结算一次。';}
catch(e){q('error').textContent=controller.signal.aborted?'已取消，释放预留积分。':e.message;q('receipt').textContent='输入内容已保留，可继续重试。';}
finally{busy=false;setTimeout(()=>{payments.sync();globalThis.dispatchEvent(new Event('sd-wallet-changed'));},50);}}
</script></html>
